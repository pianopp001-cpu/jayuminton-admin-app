<script>
/* Member-only controls. Admin behavior stays untouched. */
(function(){
  if(typeof IS_ADMIN!=='undefined'&&IS_ADMIN)return;if(window.__JAYUMINTON_MEMBER_ANYWHERE_V3__)return;window.__JAYUMINTON_MEMBER_ANYWHERE_V3__=true;
  var selectedMemberIds=[];var selfTapMemberId='';var selfTapAt=0;var selfHoldTimer=null;var selfHoldTriggered=false;var selfHoldCard=null;var selfHoldX=0;var selfHoldY=0;var SELF_HOLD_MS=650;var moveBusy=false;
  function paintMemberCardSelection(){document.querySelectorAll('.member-anywhere-selected').forEach(function(el){el.classList.remove('member-anywhere-selected');});selectedMemberIds.forEach(function(id){document.querySelectorAll('[data-member-id="'+id+'"]').forEach(function(el){el.classList.add('member-anywhere-selected');});});document.dispatchEvent(new CustomEvent('memberAnywhereSelectionChanged',{detail:{ids:selectedMemberIds.slice()}}));}

  function selectedSwapPartner(){if(!selectedPairHasSelf())return null;var me=String(storedSelfMemberId()||'');var other=selectedMemberIds[0]===me?selectedMemberIds[1]:selectedMemberIds[0];return(STATE.members||[]).find(function(m){return m&&String(m.id)===String(other);})||null;}
  function ensureMemberModal(){var root=document.getElementById('memberAnywhereModal');if(root)return root;root=document.createElement('div');root.id='memberAnywhereModal';root.className='member-anywhere-modal hidden';root.innerHTML='<div class="member-anywhere-dialog"><div id="memberAnywhereTitle"></div><div id="memberAnywhereBody"></div><div id="memberAnywhereActions"></div></div>';document.body.appendChild(root);return root;}
  function closeMemberModal(){ensureMemberModal().classList.add('hidden');}
  function ensureSaving(){var root=document.getElementById('memberAnywhereSaving');if(root)return root;root=document.createElement('div');root.id='memberAnywhereSaving';root.className='member-anywhere-saving hidden';root.innerHTML='<div class="member-anywhere-saving-card"><div class="member-anywhere-spinner"></div><strong>저장 중...</strong><span>잠시만 기다려 주세요</span></div>';document.body.appendChild(root);return root;}
  function setSaving(on){moveBusy=!!on;ensureSaving().classList.toggle('hidden',!on);document.documentElement.classList.toggle('member-anywhere-busy',!!on);}
  function showMemberModal(title,body){var root=ensureMemberModal();document.getElementById('memberAnywhereTitle').textContent=String(title||'');document.getElementById('memberAnywhereBody').textContent=String(body||'');var actions=document.getElementById('memberAnywhereActions');actions.innerHTML='';var ok=document.createElement('button');ok.type='button';ok.className='primary member-anywhere-ok';ok.textContent='확인';ok.onclick=function(event){event.preventDefault();event.stopPropagation();closeMemberModal();};actions.appendChild(ok);root.classList.remove('hidden');}
  function performSelfMove(destination){if(moveBusy)return;closeMemberModal();setSaving(true);Promise.resolve(memberAnywhereMoveSelfServer_(destination)).then(function(result){setSaving(false);if(result&&result.ok&&result.state){STATE=result.state;clearMemberCardSelection();renderState();showMemberModal('이동 완료',result.message||'이동했어요.');return;}showMemberModal('이동 실패',(result&&result.message)||'이동을 저장하지 못했어요.');}).catch(function(error){setSaving(false);showMemberModal('이동 실패',String(error&&error.message||error||'이동을 처리하지 못했어요.'));});}
  function showDestinationMenu(){var root=ensureMemberModal();document.getElementById('memberAnywhereTitle').textContent='어디로 이동할까요?';document.getElementById('memberAnywhereBody').textContent='이동할 상태를 선택해 주세요.';var actions=document.getElementById('memberAnywhereActions');actions.innerHTML='';[['대기',{type:'status',status:'active'}],['휴식',{type:'status',status:'rest'}],['귀가',{type:'status',status:'away'}],['도착전',{type:'status',status:'before'}]].forEach(function(item){var b=document.createElement('button');b.type='button';b.className='primary';b.textContent=item[0];b.onclick=function(e){e.preventDefault();e.stopPropagation();performSelfMove(item[1]);};actions.appendChild(b);});var cancel=document.createElement('button');cancel.type='button';cancel.className='member-anywhere-cancel';cancel.textContent='취소';cancel.onclick=function(e){e.preventDefault();e.stopPropagation();closeMemberModal();};actions.appendChild(cancel);root.classList.remove('hidden');}

  function showSwapConfirm(partner){var root=ensureMemberModal();document.getElementById('memberAnywhereTitle').textContent='자리교환 요청';document.getElementById('memberAnywhereBody').textContent=String(partner.name||'')+'님과 자리교환을 요청할까요?';var actions=document.getElementById('memberAnywhereActions');actions.innerHTML='';var cancel=document.createElement('button');cancel.type='button';cancel.textContent='취소';cancel.onclick=function(){clearMemberCardSelection();closeMemberModal();};var request=document.createElement('button');request.type='button';request.className='primary';request.textContent='교환요청';actions.appendChild(cancel);actions.appendChild(request);root.classList.remove('hidden');}
  function memberForCard(card){var id=String(card&&card.getAttribute('data-member-id')||'');return(STATE.members||[]).find(function(m){return m&&String(m.id)===id;})||null;}
  function selfCardFromTarget(target){var selfId=String(storedSelfMemberId()||'');if(!selfId)return null;var card=target&&target.closest?target.closest('[data-member-id]'):null;if(!card||String(card.getAttribute('data-member-id')||'')!==selfId)return null;return card;}
  function clearSelfHold(){if(selfHoldTimer){clearTimeout(selfHoldTimer);selfHoldTimer=null;}selfHoldCard=null;}
  function beginSelfHold(card,x,y){if(moveBusy||!card)return;clearSelfHold();selfHoldTriggered=false;selfHoldCard=card;selfHoldX=Number(x||0);selfHoldY=Number(y||0);selfHoldTimer=setTimeout(function(){selfHoldTimer=null;selfHoldTriggered=true;var held=selfHoldCard;selfHoldCard=null;if(held){held.classList.add('member-anywhere-processing');setTimeout(function(){held.classList.remove('member-anywhere-processing');},250);}if(navigator.vibrate)navigator.vibrate(25);showDestinationMenu();},SELF_HOLD_MS);}
  function startSelfHold(event){var card=selfCardFromTarget(event.target);if(!card)return;beginSelfHold(card,event.clientX,event.clientY);}
  function startSelfTouchHold(event){var card=selfCardFromTarget(event.target);if(!card)return;var touch=event.touches&&event.touches[0];beginSelfHold(card,touch?touch.clientX:0,touch?touch.clientY:0);}
  function moveSelfHold(x,y){if(!selfHoldTimer)return;if(Math.abs(Number(x||0)-selfHoldX)>18||Math.abs(Number(y||0)-selfHoldY)>18)clearSelfHold();}
  function handleFirstMemberCardTap(event){if(moveBusy||storedSelfMemberId())return;var card=event.target&&event.target.closest?event.target.closest('[data-member-id]'):null;if(!card)return;var member=memberForCard(card);if(!member)return;event.preventDefault();event.stopImmediatePropagation();showSelfConfirm(member);}
  function handleSelectedMemberCardTap(event){if(moveBusy)return;var selfId=String(storedSelfMemberId()||'');if(!selfId)return;var card=event.target&&event.target.closest?event.target.closest('[data-member-id]'):null;if(!card)return;var member=memberForCard(card);if(!member)return;event.preventDefault();event.stopImmediatePropagation();if(String(member.id)===selfId){if(selfHoldTriggered){selfHoldTriggered=false;return;}var now=Date.now();var isDouble=selfTapMemberId===selfId&&now-selfTapAt<=420;selfTapMemberId=selfId;selfTapAt=now;if(isDouble){selfTapMemberId='';selfTapAt=0;clearMemberCardSelection();showMemberModal('내 이름 확인','이미 '+String(member.name||'')+'님으로 설정되어 있습니다.');return;}selectedMemberIds=[selfId];paintMemberCardSelection();return;}selfTapMemberId='';selfTapAt=0;if(selectedMemberIds.indexOf(selfId)<0)selectedMemberIds=[selfId];selectedMemberIds=[selfId,String(member.id)];paintMemberCardSelection();var partner=selectedSwapPartner();if(partner)showSwapConfirm(partner);}
  document.addEventListener('pointerdown',startSelfHold,true);document.addEventListener('pointerup',clearSelfHold,true);document.addEventListener('pointercancel',clearSelfHold,true);document.addEventListener('pointermove',function(e){moveSelfHold(e.clientX,e.clientY);},true);
  document.addEventListener('touchstart',startSelfTouchHold,{capture:true,passive:true});document.addEventListener('touchend',clearSelfHold,true);document.addEventListener('touchcancel',clearSelfHold,true);document.addEventListener('touchmove',function(e){var t=e.touches&&e.touches[0];if(t)moveSelfHold(t.clientX,t.clientY);},{capture:true,passive:true});
  document.addEventListener('contextmenu',function(e){if(selfCardFromTarget(e.target)){e.preventDefault();if(!selfHoldTriggered)showDestinationMenu();}},true);
  document.addEventListener('click',handleFirstMemberCardTap,true);document.addEventListener('click',handleSelectedMemberCardTap,true);
  window.memberAnywhereMemberForCard=memberForCard;window.memberAnywhereSelectedPairHasSelf=selectedPairHasSelf;window.memberAnywhereSelectedSwapPartner=selectedSwapPartner;window.memberAnywhereSelection={clear:clearMemberCardSelection,current:function(){return selectedMemberIds.slice();},hasSelf:function(){var me=String(storedSelfMemberId()||'');return !!me&&selectedMemberIds.indexOf(me)>=0;}};window.memberAnywhereMoveSelf=performSelfMove;window.memberAnywhereIsBusy=function(){return moveBusy;};window.memberAnywhereModal={show:showMemberModal,close:closeMemberModal,confirmSelf:showSelfConfirm,confirmSwap:showSwapConfirm,destinations:showDestinationMenu};
  var style=document.createElement('style');style.textContent='.is-self-member{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.member-anywhere-selected{outline:4px solid #111!important;outline-offset:-4px!important;box-shadow:0 0 0 4px rgba(255,215,0,.9),0 4px 12px rgba(0,0,0,.22)!important;transform:scale(.97);filter:brightness(.94)}.member-anywhere-processing{outline:5px solid #111!important;transform:scale(.95)}.member-anywhere-modal{position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px}.member-anywhere-modal.hidden,.member-anywhere-saving.hidden{display:none!important}.member-anywhere-dialog{width:min(92vw,400px);background:#fff;border-radius:18px;padding:20px}#memberAnywhereTitle{font-size:21px;font-weight:900;margin-bottom:8px}#memberAnywhereBody{margin-bottom:16px}#memberAnywhereActions{display:grid;grid-template-columns:1fr 1fr;gap:10px}#memberAnywhereActions button{min-height:52px;font-size:16px;font-weight:900;border-radius:12px}#memberAnywhereActions button:active{transform:scale(.95)}#memberAnywhereActions button:disabled{opacity:.62}.member-anywhere-ok,.member-anywhere-cancel{grid-column:1/-1}.member-anywhere-saving{position:fixed;inset:0;z-index:100001;background:rgba(0,0,0,.68);display:flex;align-items:center;justify-content:center;padding:20px}.member-anywhere-saving-card{min-width:260px;background:#fff;border-radius:22px;padding:28px 24px;text-align:center;box-shadow:0 14px 50px rgba(0,0,0,.35)}.member-anywhere-saving-card strong{display:block;font-size:27px;font-weight:950;margin:14px 0 6px}.member-anywhere-saving-card span{font-size:16px;font-weight:700}.member-anywhere-spinner{width:48px;height:48px;margin:0 auto;border:6px solid #ddd;border-top-color:#111;border-radius:50%;animation:memberAnywhereSpin .8s linear infinite}@keyframes memberAnywhereSpin{to{transform:rotate(360deg)}}.member-anywhere-busy body{pointer-events:none}.member-anywhere-busy #memberAnywhereSaving{pointer-events:auto}';document.head.appendChild(style);
})();
</script>
