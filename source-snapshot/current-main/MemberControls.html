<script>
/* Member-only controls. Admin behavior stays untouched. */
(function(){
  if (typeof IS_ADMIN !== 'undefined' && IS_ADMIN) return;
  if (window.__JAYUMINTON_MEMBER_ANYWHERE_V3__) return;
  window.__JAYUMINTON_MEMBER_ANYWHERE_V3__ = true;

  var selectedMemberId = '';

  function clearMemberCardSelection(){
    selectedMemberId = '';
    document.querySelectorAll('.member-anywhere-selected').forEach(function(el){
      el.classList.remove('member-anywhere-selected');
    });
  }

  function selectMemberCard(memberId){
    clearMemberCardSelection();
    selectedMemberId = String(memberId || '');
    document.querySelectorAll('[data-member-id="' + selectedMemberId + '"]').forEach(function(el){
      el.classList.add('member-anywhere-selected');
    });
  }

  function toggleMemberCard(memberId){
    memberId = String(memberId || '');
    if (selectedMemberId === memberId) {
      clearMemberCardSelection();
      return false;
    }
    selectMemberCard(memberId);
    return true;
  }

  window.memberAnywhereSelection = {
    clear: clearMemberCardSelection,
    select: selectMemberCard,
    toggle: toggleMemberCard,
    current: function(){ return selectedMemberId; }
  };

  var style = document.createElement('style');
  style.textContent = '.member-anywhere-selected{outline:3px solid currentColor!important;outline-offset:-3px!important}';
  document.head.appendChild(style);
})();
</script>
