<script>
/* Member-only controls. Admin behavior stays untouched. */
(function(){
  if(typeof IS_ADMIN!=='undefined'&&IS_ADMIN)return;if(window.__JAYUMINTON_MEMBER_ANYWHERE_V3__)return;window.__JAYUMINTON_MEMBER_ANYWHERE_V3__=true;
  var selectedMemberIds=[];var selfTapMemberId='';var selfTapAt=0;var selfHoldTimer=null;var selfHoldTriggered=false;var SELF_HOLD_MS=750;
  function paintMemberCardSelection(){document.querySelectorAll('.member-anywhere-selected').forEach(function(el){el.classList.remove('member-anywhere-selected');});selectedMemberIds.forEach(function(id){document.querySelectorAll('[data-member-id="'+id+'"]').forEach(function(el){el.classList.add('member-anywhere-selected');});});}
  function clearMemberCardSelection(){selectedMemberIds=[];paintMemberCardSelection();}
  function selectedPairHasSelf(){var me=String(storedSelfMemberId()||'');return selectedMemberIds.length===2&&!!me&&selectedMemberIds.indexOf(me)>=0;}
  function selectedSwapPartner(){if(!selectedPairHasSelf())return null;var me=String(storedSelfMemberId()||'');var other=selectedMemberIds[0]===me?selectedMemberIds[1]:selectedMemberIds[0];return(STATE.members||[]).find(function(m){return m&&String(m.id)===String(other);})||null;}
  function ensureMemberModal(){var root=document.getElementById('memberAnywhereModal');if(root)return root;root=document.createElement('div');root.id='memberAnywhereModal';root.className='member-anywhere-modal hidden';root.innerHTML='<div class="member-anywhere-dialog"><div id="memberAnywhereTitle"></div><div id="memberAnywhereBody"></div><div id="memberAnywhereActions"></div></div>';document.body.appendChild(root);return root;}
  function closeMemberModal(){ensureMemberModal().classList.add('hidden');}
  function showMemberModal(title,body){var root=ensureMemberModal();document.getElementById('memberAnywhereTitle').textContent=String(title||'');document.getElementById('memberAnywhereBody').textContent=String(body||'');var actions=document.getElementById('memberAnywhereActions');actions.innerHTML='';var ok=document.createElement('button');ok.type='button';ok.className='primary member-anywhere-ok';ok.textContent='확인';ok.onclick=closeMemberModal;actions.appendChild(ok);root.classList.remove('hidden');}
  function showSelfConfirm(member){var root=ensureMemberModal();document.getElementById('memberAnywhereTitle').textContent='내 이름 확인';document.getElementById('memberAnywhereBody').textContent=String(member.name||'')+'님이 본인인가요?';var actions=document.getElementById('memberAnywhereActions');actions.innerHTML='';var cancel=document.createElement('button');cancel.type='button';cancel.textContent='취소';cancel.onclick=closeMemberModal;var ok=document.createElement('button');ok.type='button';ok.className='primary';ok.textContent='본인 맞아요';ok.onclick=function(){ok.disabled=true;ok.textContent='설정 중...';selectMemberSelf(member.id);clearMemberCardSelection();closeMemberModal();};actions.appendChild(cancel);actions.appendChild(ok);root.classList.remove('hidden');}
  function showSwapConfirm(partner){var root=ensureMemberModal();document.getElementById('memberAnywhereTitle').textContent='자리교환 요청';document.getElementById('memberAnywhereBody').textContent=String(partner.name||'')+'님과 자리교환을 요청할까요?';var actions=document.getElementById('memberAnywhereActions');actions.innerHTML='';var cancel=document.createElement('button');cancel.type='button';cancel.textContent='취소';cancel.onclick=function(){clearMemberCardSelection();closeMemberModal();};var request=document.createElement('button');request.type='button';request.className='primary';request.textContent='교환요청';actions.appendChild(cancel);actions.appendChild(request);root.classList.remove('hidden');}
  function memberForCard(card){var id=String(card&&card.getAttribute('data-member-id')||'');return(STATE.members||[]).find(function(m){return m&&String(m.id)===id;})||null;}
  function selfCardFromEvent(event){var selfId=String(storedSelfMemberId()||'');if(!selfId)return null;var card=event.target&&event.target.closest?event.target.closest('[data-member-id]'):null;if(!card||String(card.getAttribute('data-member-id')||'')!==selfId)return null;return card;}
  function clearSelfHold(){if(selfHoldTimer){clearTimeout(selfHoldTimer);selfHoldTimer=null;}}
  function startSelfHold(event){var card=selfCardFromEvent(event);if(!card)return;clearSelfHold();selfHoldTriggered=false;selfHoldTimer=setTimeout(function(){selfHoldTimer=null;selfHoldTriggered=true;clearMemberCardSelection();card.classList.add('member-anywhere-processing');showMemberModal('대기 이동','대기목록으로 이동하는 중입니다...');Promise.resolve(memberAnywhereReturnSelfToWaitServer_()).then(function(result){card.classList.remove('member-anywhere-processing');if(result&&result.ok&&result.state){STATE=result.state;renderState();}showMemberModal(result&&result.ok?'대기 이동 완료':'이동 실패',result&&result.message||'대기목록 이동을 처리하지 못했어요.');}).catch(function(error){card.classList.remove('member-anywhere-processing');showMemberModal('이동 실패',String(error&&error.message||error||'대기목록 이동을 처리하지 못했어요.'));});},SELF_HOLD_MS);}
  function cancelSelfHold(){clearSelfHold();}
  function handleFirstMemberCardTap(event){if(storedSelfMemberId())return;var card=event.target&&event.target.closest?event.target.closest('[data-member-id]'):null;if(!card)return;var member=memberForCard(card);if(!member)return;event.preventDefault();event.stopImmediatePropagation();showSelfConfirm(member);}
  function handleSelectedMemberCardTap(event){var selfId=String(storedSelfMemberId()||'');if(!selfId)return;var card=event.target&&event.target.closest?event.target.closest('[data-member-id]'):null;if(!card)return;var member=memberForCard(card);if(!member)return;if(String(member.id)===selfId){if(selfHoldTriggered){selfHoldTriggered=false;event.preventDefault();event.stopImmediatePropagation();return;}var now=Date.now();var isDouble=selfTapMemberId===selfId&&now-selfTapAt<=420;selfTapMemberId=selfId;selfTapAt=now;clearMemberCardSelection();if(isDouble){event.preventDefault();event.stopImmediatePropagation();selfTapMemberId='';selfTapAt=0;showMemberModal('내 이름 확인','이미 '+String(member.name||'')+'님으로 설정되어 있습니다.');}return;}event.preventDefault();event.stopImmediatePropagation();selectedMemberIds=[selfId,String(member.id)];paintMemberCardSelection();var partner=selectedSwapPartner();if(partner)showSwapConfirm(partner);}
  document.addEventListener('pointerdown',startSelfHold,true);document.addEventListener('pointerup',cancelSelfHold,true);document.addEventListener('pointercancel',cancelSelfHold,true);document.addEventListener('pointermove',function(event){if(selfHoldTimer&&event.pointerType==='touch')clearSelfHold();},true);
  document.addEventListener('click',handleFirstMemberCardTap,true);document.addEventListener('click',handleSelectedMemberCardTap,true);
  window.memberAnywhereMemberForCard=memberForCard;window.memberAnywhereSelectedPairHasSelf=selectedPairHasSelf;window.memberAnywhereSelectedSwapPartner=selectedSwapPartner;window.memberAnywhereSelection={clear:clearMemberCardSelection,current:function(){return selectedMemberIds.slice();}};window.memberAnywhereModal={show:showMemberModal,close:closeMemberModal,confirmSelf:showSelfConfirm,confirmSwap:showSwapConfirm};
  var style=document.createElement('style');style.textContent='.member-anywhere-selected{outline:4px solid #111!important;outline-offset:-4px!important;box-shadow:0 0 0 4px rgba(255,215,0,.9),0 4px 12px rgba(0,0,0,.22)!important;transform:scale(.97);filter:brightness(.94)}.member-anywhere-processing{outline:4px solid #111!important;opacity:.65!important;transform:scale(.96)}.member-anywhere-modal{position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.42);display:flex;align-items:center;justify-content:center;padding:20px}.member-anywhere-modal.hidden{display:none!important}.member-anywhere-dialog{width:min(92vw,380px);background:#fff;border-radius:18px;padding:20px}#memberAnywhereTitle{font-size:20px;font-weight:800;margin-bottom:8px}#memberAnywhereBody{margin-bottom:16px}#memberAnywhereActions{display:grid;grid-template-columns:1fr 1fr;gap:8px}#memberAnywhereActions button{min-height:48px;font-weight:800}#memberAnywhereActions button:active{transform:scale(.96)}#memberAnywhereActions button:disabled{opacity:.62}.member-anywhere-ok{grid-column:1/-1}';document.head.appendChild(style);
})();
</script>
