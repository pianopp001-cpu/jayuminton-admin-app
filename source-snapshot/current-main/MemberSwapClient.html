<script>
function memberAnywhereSession_(){return {memberId:String(storedSelfMemberId()||''),token:String(MEMBER_SESSION_VALUE||localStorage.getItem(MEMBER_SESSION_KEY)||'')};}

var memberAnywhereSavingDepth_=0;
