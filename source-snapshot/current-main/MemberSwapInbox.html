<script>
(function(){
  var shownRequestKey='';var activeRequestKey='';var responsePending=false;var pollGeneration_=0;var pollPendingGeneration_=0;var pollPendingMemberId_='';var pollPendingToken_='';
  function requesterName_(request){var id=String(request&&request.requesterId||'');var member=(STATE.members||[]).find(function(item){return item&&String(item.id)===id;});return member?String(member.name||'회원'):'회원';}
  function requestKey_(request){return String(request&&request.requesterId||'')+':'+String(request&&request.createdAt||'');}
  function requestChanged_(result){return !!(result&&!result.ok&&String(result.message||'').indexOf('자리교환 요청이 변경됐어요.')===0);}
  function clearIncoming_(){var shouldClose=incomingPromptVisible_(activeRequestKey);shownRequestKey='';activeRequestKey='';responsePending=false;if(shouldClose&&window.memberAnywhereModal)window.memberAnywhereModal.close();}
  function applyAcceptedSwapLocally_(request){
    if(!request||!request.requesterId||!request.targetId||typeof applyMoveOrSwapLocally!=='function')return;
    var targetId=String(request.targetId||'');if(!targetId)return;
    try{applyMoveOrSwapLocally(String(request.requesterId),'','',targetId);if(typeof renderState==='function')renderState();}catch(error){}
  }
  function applyAcceptedServerState_(result,request){
    if(result&&result.state){STATE=typeof normalizeStateMemberProfiles==='function'?normalizeStateMemberProfiles(result.state):result.state;if(typeof renderState==='function')renderState();return true;}
    applyAcceptedSwapLocally_(request);return false;
  }
  function incomingPromptVisible_(key){
    if(!key||key!==shownRequestKey)return false;
    var root=document.getElementById('memberAnywhereModal');var title=document.getElementById('memberAnywhereTitle');var actions=document.getElementById('memberAnywhereActions');
    if(!root||root.classList.contains('hidden')||!title||title.textContent!=='자리교환 요청'||!actions)return false;
    var labels=Array.prototype.map.call(actions.querySelectorAll('button'),function(button){return String(button.textContent||'');});
    return labels.indexOf('거절')>=0&&labels.indexOf('수락')>=0;
  }
  function anotherMemberModalVisible_(){
    var root=document.getElementById('memberAnywhereModal');
    if(!root||root.classList.contains('hidden'))return false;
    var actions=document.getElementById('memberAnywhereActions');
    if(!actions)return true;
    var labels=Array.prototype.map.call(actions.querySelectorAll('button'),function(button){return String(button.textContent||'');});
    return !(labels.indexOf('거절')>=0&&labels.indexOf('수락')>=0);
  }
  function showLatestRequestAfterChange_(root){responsePending=false;activeRequestKey='';shownRequestKey='';if(root&&typeof root.close==='function')root.close();setTimeout(poll_,0);}
  function showIncoming_(request){
    var key=requestKey_(request);if(!key||responsePending||incomingPromptVisible_(key)||anotherMemberModalVisible_())return;var displayedAuth=typeof memberAnywhereSession_==='function'?memberAnywhereSession_():null;if(!displayedAuth||String(displayedAuth.memberId||'')!==String(request&&request.targetId||'')||!displayedAuth.token)return;var displayedMemberId=String(displayedAuth.memberId||'');var displayedToken=String(displayedAuth.token||'');shownRequestKey=key;activeRequestKey=key;
    var root=window.memberAnywhereModal&&window.memberAnywhereModal;if(!root){shownRequestKey='';activeRequestKey='';return;}
    root.show('자리교환 요청',requesterName_(request)+'님이 자리교환을 요청했어요.');
    var actions=document.getElementById('memberAnywhereActions');if(!actions){shownRequestKey='';activeRequestKey='';return;}actions.innerHTML='';
    var reject=document.createElement('button');reject.type='button';reject.textContent='거절';
    var accept=document.createElement('button');accept.type='button';accept.className='primary';accept.textContent='수락';
    function setPending_(value){responsePending=value;reject.disabled=value;accept.disabled=value;}
    function displayedSessionStillCurrent_(){var current=typeof memberAnywhereSession_==='function'?memberAnywhereSession_():null;return !!(current&&String(current.memberId||'')===displayedMemberId&&String(current.token||'')===displayedToken);}
    reject.onclick=function(){if(!displayedSessionStillCurrent_()){showLatestRequestAfterChange_(root);return;}setPending_(true);memberAnywhereRejectServer_(request).then(function(result){if(!displayedSessionStillCurrent_()){showLatestRequestAfterChange_(root);return;}if(requestChanged_(result)){showLatestRequestAfterChange_(root);return;}responsePending=false;activeRequestKey='';shownRequestKey='';root.show(result&&result.ok?'자리교환':'처리 실패',result&&result.message||'자리교환 요청을 처리하지 못했어요.');}).catch(function(error){if(!displayedSessionStillCurrent_()){showLatestRequestAfterChange_(root);return;}setPending_(false);root.show('처리 실패',String(error&&error.message||error||'자리교환 요청을 처리하지 못했어요.'));});};
    accept.onclick=function(){if(!displayedSessionStillCurrent_()){showLatestRequestAfterChange_(root);return;}setPending_(true);memberAnywhereAcceptServer_(request).then(function(result){if(!displayedSessionStillCurrent_()){if(typeof refreshMemberState==='function')refreshMemberState();showLatestRequestAfterChange_(root);return;}if(requestChanged_(result)){showLatestRequestAfterChange_(root);return;}responsePending=false;activeRequestKey='';shownRequestKey='';root.show(result&&result.ok?'교환 완료':'교환 실패',result&&result.message||'자리교환을 처리하지 못했어요.');if(result&&(result.ok||result.state))applyAcceptedServerState_(result,request);if(typeof refreshMemberState==='function')refreshMemberState();}).catch(function(error){if(!displayedSessionStillCurrent_()){if(typeof refreshMemberState==='function')refreshMemberState();showLatestRequestAfterChange_(root);return;}setPending_(false);root.show('처리 실패',String(error&&error.message||error||'자리교환 요청을 처리하지 못했어요.'));});};
    actions.appendChild(reject);actions.appendChild(accept);
  }
  function poll_(){var auth=typeof memberAnywhereSession_==='function'?memberAnywhereSession_():null;if(!auth||!auth.memberId||!auth.token){pollGeneration_+=1;pollPendingGeneration_=0;pollPendingMemberId_='';pollPendingToken_='';if(activeRequestKey)clearIncoming_();return;}if(responsePending)return;var expectedMemberId=String(auth.memberId);var expectedToken=String(auth.token);if(pollPendingGeneration_&&pollPendingMemberId_===expectedMemberId&&pollPendingToken_===expectedToken)return;if(pollPendingGeneration_){pollGeneration_+=1;pollPendingGeneration_=0;pollPendingMemberId_='';pollPendingToken_='';}var generation=++pollGeneration_;pollPendingGeneration_=generation;pollPendingMemberId_=expectedMemberId;pollPendingToken_=expectedToken;memberAnywherePendingServer_().then(function(request){var current=typeof memberAnywhereSession_==='function'?memberAnywhereSession_():null;if(generation!==pollGeneration_||!current||String(current.memberId||'')!==expectedMemberId||String(current.token||'')!==expectedToken)return;if(request){showIncoming_(request);return;}if(activeRequestKey)clearIncoming_();}).catch(function(){}).then(function(){if(pollPendingGeneration_===generation){pollPendingGeneration_=0;pollPendingMemberId_='';pollPendingToken_='';}});}
  window.memberAnywherePollSwapInbox=poll_;setInterval(poll_,3000);setTimeout(poll_,800);
})();

/* 사용자 카드에서 현재 제외 상태를 작게 표시한다. 코트/대기1~5/코트배정대기는 별도 배지를 붙이지 않는다. */
(function installMemberStatusBadges(){
  if(typeof window.memberCard!=='function'||window.__jayumintonStatusBadgeInstalled)return;
  window.__jayumintonStatusBadgeInstalled=true;
  var originalMemberCard=window.memberCard;
  function badgeText(member){
    if(!member)return '';
    if(member.status==='away')return '귀가';
    if(member.status==='before')return '도착 전';
    if(member.status==='rest')return '휴식';
    return '';
  }
  window.memberCard=function(member,showGames,clickable){
    var html=originalMemberCard.apply(this,arguments);
    var label=badgeText(member);
    if(!label||IS_ADMIN)return html;
    var badge='<span class="member-status-mini" style="display:inline-flex;align-items:center;justify-content:center;margin-left:5px;padding:1px 5px;border-radius:999px;font-size:10px;font-weight:700;line-height:1.35;white-space:nowrap;background:rgba(0,0,0,.08);">'+escapeMemberInfo(label)+'</span>';
    return html.replace('</span>'+((showGames)?'<span class="meta">':''),'</span>'+badge+((showGames)?'<span class="meta">':''));
  };
})();
</script>
