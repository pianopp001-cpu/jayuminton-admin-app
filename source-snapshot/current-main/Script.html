/* v1.6.16: 코트/대기 빈자리 다중 선택. 기존 인원선택·전체교환 기능은 유지한다. */
const EMPTY_SLOT_TARGETS = [];

function emptySlotTargetKey(target) {
  return String(target.type) + ':' + String(target.index) + ':' + String(target.slotIndex);
}

function copyEmptySlotTarget(target) {
  return {
    type: target.type === 'court' ? 'court' : 'wait',
    index: Number(target.index),
    slotIndex: Number(target.slotIndex)
  };
}

function syncPrimaryEmptyTarget() {
  AUTO_ASSIGN_TARGET = EMPTY_SLOT_TARGETS.length
    ? copyEmptySlotTarget(EMPTY_SLOT_TARGETS[0])
    : null;
}

function selectedEmptyTargetIndex(type, index, slotIndex) {
  const key = emptySlotTargetKey({type:type, index:Number(index), slotIndex:Number(slotIndex)});
  return EMPTY_SLOT_TARGETS.findIndex(function(target) {
    return emptySlotTargetKey(target) === key;
  });
}

function isEmptySlotTargetSelected(type, index, slotIndex) {
  return selectedEmptyTargetIndex(type, index, slotIndex) >= 0;
}

function clearEmptySlotTargets() {
  EMPTY_SLOT_TARGETS.splice(0, EMPTY_SLOT_TARGETS.length);
  syncPrimaryEmptyTarget();
}

function removeEmptySlotTarget(type, index, slotIndex) {
  const found = selectedEmptyTargetIndex(type, index, slotIndex);
  if (found >= 0) EMPTY_SLOT_TARGETS.splice(found, 1);
  syncPrimaryEmptyTarget();
}

function removeEmptyTargetsForGroup(type, index) {
  index = Number(index);
  for (let i = EMPTY_SLOT_TARGETS.length - 1; i >= 0; i -= 1) {
    const target = EMPTY_SLOT_TARGETS[i];
    if (target.type === type && Number(target.index) === index) {
      EMPTY_SLOT_TARGETS.splice(i, 1);
    }
  }
  syncPrimaryEmptyTarget();
}

function toggleEmptySlotTarget(type, index, slotIndex) {
  index = Number(index);
  slotIndex = Number(slotIndex);
  const found = selectedEmptyTargetIndex(type, index, slotIndex);
  if (found >= 0) {
    EMPTY_SLOT_TARGETS.splice(found, 1);
  } else {
    EMPTY_SLOT_TARGETS.push({type:type, index:index, slotIndex:slotIndex});
  }
  syncPrimaryEmptyTarget();
}

function targetGroupForEmpty(target) {
  return target.type === 'court'
    ? (STATE.courts[Number(target.index)] || [])
    : (STATE.waitGroups[Number(target.index)] || []);
}

function pruneEmptySlotTargets() {
  for (let i = EMPTY_SLOT_TARGETS.length - 1; i >= 0; i -= 1) {
    const target = EMPTY_SLOT_TARGETS[i];
    const group = targetGroupForEmpty(target);
    if (group.length >= 4 || Number(target.slotIndex) < group.length) {
      EMPTY_SLOT_TARGETS.splice(i, 1);
    }
  }
  syncPrimaryEmptyTarget();
}

assignMemberToChosenEmpty = function(memberId, event) {
  pruneEmptySlotTargets();
  if (!EMPTY_SLOT_TARGETS.length) return false;

  const target = copyEmptySlotTarget(EMPTY_SLOT_TARGETS[0]);
  const targetGroup = targetGroupForEmpty(target);

  if (targetGroup.indexOf(memberId) >= 0) {
    alert('이미 선택한 위치에 있는 멤버입니다.');
    return true;
  }

  if (targetGroup.length >= 4) {
    removeEmptyTargetsForGroup(target.type, target.index);
    renderCourts();
    renderWaitGroups();
    return assignMemberToChosenEmpty(memberId, event);
  }

  if (event) {
    event.preventDefault();
    event.stopPropagation();
  }

  /* 배열은 빈칸을 건너뛸 수 없으므로 현재 그룹의 첫 빈자리를 채우고,
     사용자가 연속 선택한 다음 빈자리를 다음 대상에 남긴다. */
  removeEmptySlotTarget(target.type, target.index, target.slotIndex);
  if (targetGroup.length >= 3) {
    removeEmptyTargetsForGroup(target.type, target.index);
  }

  QUICK_PICK = null;
  SELECTED.delete(memberId);
  batchAssignToTarget([memberId], target.type, target.index);
  return true;
};

handleEmptySlotTap = function(type, index, slotIndex, event) {
  if (event) {
    event.preventDefault();
    event.stopPropagation();
  }

  const ids = QUICK_PICK ? [QUICK_PICK.memberId] : Array.from(SELECTED);

  if (!ids.length) {
    toggleEmptySlotTarget(type, index, slotIndex);
    renderCourts();
    renderWaitGroups();
    return;
  }

  const targetGroup = type === 'court'
    ? (STATE.courts[Number(index)] || [])
    : (STATE.waitGroups[Number(index)] || []);
  const capacity = 4 - targetGroup.length;

  if (ids.some(function(id) { return targetGroup.indexOf(id) >= 0; })) {
    alert('이미 이 위치에 있는 인원은 다시 넣을 수 없습니다.');
    return;
  }

  if (ids.length > capacity) {
    alert('이 위치에는 ' + capacity + '명만 더 들어갈 수 있습니다. 선택 인원을 줄여주세요.');
    return;
  }

  clearEmptySlotTargets();
  cancelQuickPick();
  batchAssignToTarget(ids, type, index);
};

emptySlotCard = function(type, index, slotIndex) {
  const targetOrder = selectedEmptyTargetIndex(type, index, slotIndex);
  const selected = targetOrder >= 0;
  return (
    '<div class="person empty quick-empty-slot' +
    (selected ? ' auto-assign-target' : '') +
    '" onclick="handleEmptySlotTap(\'' + type + '\',\'' + index + '\',' + slotIndex + ',event)" ' +
    'title="빈자리를 연속 선택할 수 있습니다. 같은 자리를 다시 누르면 해제됩니다.">' +
    '<span class="empty-slot-label">' + (selected ? '빈자리 선택 ' + (targetOrder + 1) : '비어 있음') + '</span>' +
    '<small>' + (selected ? '다시 탭하면 해제' : '연속 선택 가능') + '</small>' +
    '</div>'
  );
};

smartAssignSelected = async function() {
  pruneEmptySlotTargets();
  if (!EMPTY_SLOT_TARGETS.length) {
    alert('먼저 코트 또는 대기조의 비어 있는 자리를 한 번 누르세요. 여러 빈자리를 연속 선택할 수도 있습니다.');
    return;
  }

  const target = copyEmptySlotTarget(EMPTY_SLOT_TARGETS[0]);
  const targetType = target.type;
  const targetIndex = target.index;
  const targetLabel = targetType === 'court' ? COURT_LABELS[targetIndex] : '대기' + (targetIndex + 1);
  const existingIds = targetType === 'court'
    ? (STATE.courts[targetIndex] || []).slice()
    : (STATE.waitGroups[targetIndex] || []).slice();
  const existingMembers = existingIds.map(memberById).filter(Boolean);
  const needed = 4 - existingIds.length;

  if (needed <= 0) {
    removeEmptyTargetsForGroup(targetType, targetIndex);
    alert(targetLabel + '에는 빈자리가 없습니다.');
    return;
  }

  const ids = SELECTED.size ? Array.from(SELECTED) : autoPickCourtFillIds(existingMembers);
  if (SELECTED.size && ids.length !== needed) {
    alert(targetLabel + '의 빈자리는 ' + needed + '자리입니다.\n' + needed + '명을 선택하거나 선택을 모두 해제하고 자동배정하세요.');
    return;
  }
  if (ids.length !== needed) {
    alert('현재 인원과 남복·여복·혼복을 만들 수 있는 코트배정 대기 인원이 부족합니다.');
    return;
  }

  const finalMembers = existingMembers.concat(ids.map(memberById).filter(Boolean));
  if (!isAllowedDoublesTeam(finalMembers)) {
    alert('선택한 인원으로는 남복·여복·혼복을 만들 수 없습니다.');
    return;
  }

  const previousState = JSON.parse(JSON.stringify(STATE));
  const previousTargets = EMPTY_SLOT_TARGETS.map(copyEmptySlotTarget);
  applyBatchAssignLocally(ids, targetType, targetIndex);
  SELECTED.clear();
  removeEmptyTargetsForGroup(targetType, targetIndex);
  renderState();

  try {
    const method = targetType === 'court' ? 'autoFillCourt' : 'autoFillWaitGroup';
    const savedState = await server(method, [ADMIN_PIN_VALUE, targetIndex, ids]);
    renderState(savedState);
    setUndoState(previousState);
  } catch (error) {
    STATE = previousState;
    clearEmptySlotTargets();
    previousTargets.forEach(function(item) { EMPTY_SLOT_TARGETS.push(copyEmptySlotTarget(item)); });
    syncPrimaryEmptyTarget();
    renderState();
    alert(error.message || error);
  }
};


function openAdminPushApp() {
  const target = 'https://jayuminton-push.web.app/';
  try {
    if (window.NativeBrowser && typeof window.NativeBrowser.openPwa === 'function') {
      window.NativeBrowser.openPwa();
      return;
    }
  } catch (error) {}
  try { window.location.href = target; }
  catch (error) { window.open(target, '_blank', 'noopener'); }
}
