/* Android APK Native TTS bridge.
   Works inside the Google Apps Script content frame without Chrome/Samsung Internet.
   Completion is detected by polling NativeVoice.isSpeaking(), so it does not depend
   on evaluateJavascript callbacks reaching the same iframe. */
(function installJayumintonNativeTtsBridge() {
  if (!window.NativeVoice) return;
  if (
    window.__jayumintonNativeVoiceWebBridgeInstalled &&
    window.speechSynthesis &&
    window.SpeechSynthesisUtterance
  ) return;

  const pending = Object.create(null);
  let sequence = 0;
  let nativeSpeaking = false;

  function NativeUtterance(text) {
    this.text = String(text == null ? '' : text);
    this.lang = 'ko-KR';
    this.rate = 1;
    this.pitch = 1;
    this.volume = 1;
    this.voice = null;
    this.onstart = null;
    this.onend = null;
    this.onerror = null;
  }

  const voices = [
    { name: 'Korean Male', lang: 'ko-KR', localService: true, default: false },
    { name: 'Korean Female', lang: 'ko-KR', localService: true, default: true }
  ];

  function dispatch(utterance, eventName) {
    try {
      const handler = utterance && utterance['on' + eventName];
      if (typeof handler === 'function') {
        handler.call(utterance, { type: eventName, utterance: utterance });
      }
    } catch (error) {}
  }

  function clearWatcher(item) {
    if (!item) return;
    if (item.timer) clearInterval(item.timer);
    if (item.timeout) clearTimeout(item.timeout);
    item.timer = null;
    item.timeout = null;
  }

  function finish(id, eventName) {
    const item = pending[id];
    if (!item) return;
    clearWatcher(item);
    delete pending[id];
    nativeSpeaking = Object.keys(pending).length > 0;
    dispatch(item.utterance, eventName === 'end' ? 'end' : 'error');
  }

  function watchNativeSpeech(id) {
    const item = pending[id];
    if (!item) return;
    let started = false;
    let falseCount = 0;
    const startedAt = Date.now();

    item.timer = setInterval(function() {
      if (!pending[id]) return;
      let speaking = false;
      try { speaking = !!window.NativeVoice.isSpeaking(); } catch (error) {}

      if (speaking) {
        falseCount = 0;
        if (!started) {
          started = true;
          nativeSpeaking = true;
          dispatch(item.utterance, 'start');
        }
        return;
      }

      if (started) {
        falseCount += 1;
        if (falseCount >= 2) finish(id, 'end');
        return;
      }

      /* Very short/silent warm-up utterances can finish between polls. */
      const visibleText = String(item.utterance.text || '')
        .replace(/[\u200B-\u200D\uFEFF]/g, '')
        .trim();
      if (!visibleText && Date.now() - startedAt > 180) {
        dispatch(item.utterance, 'start');
        finish(id, 'end');
      }
    }, 70);

    item.timeout = setTimeout(function() {
      if (!pending[id]) return;
      if (started) finish(id, 'end');
      else finish(id, 'error');
    }, 120000);
  }

  const synthesis = {
    onvoiceschanged: null,
    pause: function() {},
    resume: function() {},
    getVoices: function() { return voices.slice(); },
    speak: function(utterance) {
      if (!utterance) return;
      const id = 'jm_' + Date.now() + '_' + (++sequence);
      pending[id] = { utterance: utterance, timer: null, timeout: null };
      try {
        window.NativeVoice.speak(
          id,
          String(utterance.text || ''),
          Number(utterance.rate || 1),
          Number(utterance.pitch || 1),
          String(utterance.voice && utterance.voice.name || '')
        );
        watchNativeSpeech(id);
      } catch (error) {
        finish(id, 'error');
      }
    },
    cancel: function() {
      try { window.NativeVoice.stop(); } catch (error) {}
      Object.keys(pending).forEach(function(id) {
        const item = pending[id];
        clearWatcher(item);
        delete pending[id];
        dispatch(item.utterance, 'error');
      });
      nativeSpeaking = false;
    }
  };

  Object.defineProperties(synthesis, {
    speaking: {
      configurable: true,
      get: function() {
        try { return !!window.NativeVoice.isSpeaking(); }
        catch (error) { return nativeSpeaking || Object.keys(pending).length > 0; }
      }
    },
    pending: {
      configurable: true,
      get: function() { return Object.keys(pending).length > 0; }
    },
    paused: {
      configurable: true,
      get: function() { return false; }
    }
  });

  /* This callback still works when the APK invokes it in the same frame.
     The polling watcher remains the fallback for the Apps Script iframe. */
  window.__jayumintonNativeVoiceCallback = function(id, eventName) {
    const item = pending[id];
    if (!item) return;
    if (eventName === 'start') {
      nativeSpeaking = true;
      dispatch(item.utterance, 'start');
      return;
    }
    finish(id, eventName === 'end' ? 'end' : 'error');
  };

  try {
    Object.defineProperty(window, 'SpeechSynthesisUtterance', {
      configurable: true,
      writable: true,
      value: NativeUtterance
    });
  } catch (error) {
    window.SpeechSynthesisUtterance = NativeUtterance;
  }

  try {
    Object.defineProperty(window, 'speechSynthesis', {
      configurable: true,
      get: function() { return synthesis; }
    });
  } catch (error) {
    window.speechSynthesis = synthesis;
  }

  window.__jayumintonNativeVoiceWebBridgeInstalled = true;
  setTimeout(function() {
    try {
      if (typeof synthesis.onvoiceschanged === 'function') synthesis.onvoiceschanged();
    } catch (error) {}
  }, 0);
})();

function loadLastVoiceAnnouncement() {
  try {
    const saved = JSON.parse(
      localStorage.getItem(LAST_VOICE_KEY) || 'null'
    );
    const courtNo = Number(saved && saved.courtNo);
    if (
      courtNo < 1 ||
      courtNo > 4 ||
      !Array.isArray(saved.members)
    ) {
      return null;
    }
    return {
      courtNo: courtNo,
      members: saved.members
        .map(function(member) {
          return {
            name: String(member && member.name || ''),
            gender:
              member && member.gender === 'female'
                ? 'female'
                : 'male'
          };
        })
        .filter(function(member) {
          return member.name;
        })
    };
  } catch (error) {
    return null;
  }
}

function unlockVoiceSound() {
  try {
    const AudioContextClass =
      window.AudioContext || window.webkitAudioContext;
    if (AudioContextClass) {
      VOICE_AUDIO_CONTEXT =
        VOICE_AUDIO_CONTEXT || new AudioContextClass();
      if (VOICE_AUDIO_CONTEXT.state === 'suspended') {
        VOICE_AUDIO_CONTEXT.resume();
      }
    }
  } catch (error) {}

  if (!('speechSynthesis' in window)) return;
  try {
    window.speechSynthesis.resume();
    if (!VOICE_WARMED) {
      const utterance =
        new SpeechSynthesisUtterance('\u200b');
      utterance.lang = 'ko-KR';
      utterance.volume = 0;
      utterance.onstart = utterance.onend = function() {
        VOICE_WARMED = true;
        updateSoundUnlockButton();
      };
      window.speechSynthesis.speak(utterance);
    }
  } catch (error) {}
}

function restorePageMediaVolume() {
  VOICE_DUCKED_MEDIA.forEach(function(item) {
    if (item.element) {
      item.element.volume = item.volume;
    }
  });
  VOICE_DUCKED_MEDIA = [];

  if (VOICE_DUCK_TIMEOUT) {
    clearTimeout(VOICE_DUCK_TIMEOUT);
    VOICE_DUCK_TIMEOUT = null;
  }
}

function duckPageMediaForVoice() {
  restorePageMediaVolume();

  document
    .querySelectorAll('audio,video')
    .forEach(function(element) {
      if (
        !element.paused &&
        !element.muted &&
        element.volume > 0
      ) {
        VOICE_DUCKED_MEDIA.push({
          element: element,
          volume: element.volume
        });
        element.volume =
          Math.max(0.05, element.volume * 0.18);
      }
    });

  VOICE_DUCK_TIMEOUT = setTimeout(
    restorePageMediaVolume,
    90000
  );
}

function koreanVoices() {
  if (!('speechSynthesis' in window)) return null;

  return window.speechSynthesis
    .getVoices()
    .filter(function(voice) {
      return /^ko[-_]/i.test(voice.lang || '');
    });
}

  };

function getKoreanVoice(gender) {
  const voices = koreanVoices() || [];
  const femaleKeywords =
    /female|여성|sunhi|yuna|sora|nari|seoyeon|jiyeon|heami|해미|유나|소라|나리|서연|지연|선히/i;
  const maleKeywords =
    /male|남성|injoon|hyunsu|minsu|junho|woosung|민수|준호|현수|인준/i;
  const naturalKeywords =
    /natural|online|premium|enhanced|자연|고품질/i;

  if (gender === 'female') {
    const naturalFemale = voices.find(function(voice) {
      const label =
        (voice.name || '') + ' ' + (voice.lang || '');
      return femaleKeywords.test(label) && naturalKeywords.test(label);
    });
    if (naturalFemale) return naturalFemale;

    const female = voices.find(function(voice) {
      return femaleKeywords.test(
        (voice.name || '') + ' ' + (voice.lang || '')
      );
    });
    if (female) return female;
  }

  if (gender === 'male') {
    const male = voices.find(function(voice) {
      return maleKeywords.test(
        (voice.name || '') + ' ' + (voice.lang || '')
      );
    });
    if (male) return male;
  }

  return voices.find(function(voice) {
    return naturalKeywords.test(voice.name || '');
  }) || voices[0] || null;
}

function speakKoreanText(text, gender, onComplete) {
  if (
    !VOICE_GUIDE_ENABLED ||
    !('speechSynthesis' in window) ||
    !text
  ) {
    return;
  }

  const utterance =
    new SpeechSynthesisUtterance(String(text));
  utterance.lang = 'ko-KR';
  utterance.rate =
    gender === 'male'
      ? 0.92
      : gender === 'female'
        ? 0.92
        : 0.92;
  utterance.pitch =
    gender === 'male'
      ? 0.88
      : gender === 'female'
        ? 1.03
        : 1.03;
  utterance.volume = 1;

  const voice = getKoreanVoice(gender);
  if (voice) utterance.voice = voice;

  VOICE_UTTERANCES.push(utterance);

  function finishUtterance() {
    VOICE_UTTERANCES =
      VOICE_UTTERANCES.filter(function(item) {
        return item !== utterance;
      });
    if (typeof onComplete === 'function') {
      onComplete();
    }
  }

  utterance.onend = finishUtterance;
  utterance.onerror = finishUtterance;

  window.speechSynthesis.speak(utterance);
  window.speechSynthesis.resume();
  return utterance;
}

function speechFriendlyName(name) {
  const rawName = String(name || '').trim();
  const matched = rawName.match(
    /^([^()（）]+?)\s*[（(]\s*([^()（）]+?)\s*[）)]\s*$/
  );

  if (matched) {
    const realName = matched[1].trim();
    const nickname = matched[2].trim();
    return (realName + ' ' + nickname).trim();
  }

  return rawName
    .replace(/[()（）]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function speechFriendlyMemberCall(name) {
  const friendlyName = speechFriendlyName(name);
  return friendlyName ? friendlyName + '님.' : '';
}

function clearVoiceQueueRuntime() {
  VOICE_QUEUE = [];
  if (VOICE_QUEUE_TIMER) {
    clearTimeout(VOICE_QUEUE_TIMER);
    VOICE_QUEUE_TIMER = null;
  }
  if (VOICE_KEEPALIVE_TIMER) {
    clearInterval(VOICE_KEEPALIVE_TIMER);
    VOICE_KEEPALIVE_TIMER = null;
  }
  VOICE_UTTERANCES = [];
}

function playVoiceQueue(queue, playbackToken, onComplete) {
  try {
    window.speechSynthesis.cancel();
  } catch (error) {}
  clearVoiceQueueRuntime();
  VOICE_QUEUE = queue.slice();

  function next() {
    if (playbackToken !== VOICE_PLAYBACK_TOKEN) return;
    if (!VOICE_QUEUE.length) {
      clearVoiceQueueRuntime();
      if (typeof onComplete === 'function') onComplete();
      return;
    }

    const item = VOICE_QUEUE.shift();
    const utterance =
      new SpeechSynthesisUtterance(String(item.text || ''));
    utterance.lang = 'ko-KR';
    utterance.rate =
      item.gender === 'male'
        ? 0.92
        : item.gender === 'female'
          ? 0.92
          : 0.92;
    utterance.pitch =
      item.gender === 'male'
        ? 0.88
        : item.gender === 'female'
          ? 1.03
          : 1.03;
    utterance.volume = 1;
    const voice = getKoreanVoice(item.gender);
    if (voice) utterance.voice = voice;
    VOICE_UTTERANCES = [utterance];

    function continueQueue() {
      VOICE_QUEUE_TIMER = setTimeout(next, 140);
    }
    utterance.onstart = function() {
      VOICE_WARMED = true;
      updateSoundUnlockButton();
    };
    utterance.onend = continueQueue;
    utterance.onerror = continueQueue;

    try {
      window.speechSynthesis.resume();
      window.speechSynthesis.speak(utterance);
    } catch (error) {
      continueQueue();
    }

    if (!VOICE_KEEPALIVE_TIMER) {
      VOICE_KEEPALIVE_TIMER = setInterval(function() {
        try {
          if (
            window.speechSynthesis.speaking &&
            window.speechSynthesis.paused
          ) {
            window.speechSynthesis.resume();
          }
        } catch (error) {}
      }, 4000);
    }
  }

  unlockVoiceSound();
  VOICE_QUEUE_TIMER = setTimeout(
    next,
    VOICE_IS_IOS ? 280 : 100
  );
}

function playCourtFinishVoice(courtNo, waitingMembers) {
  if (
    !VOICE_GUIDE_ENABLED ||
    !('speechSynthesis' in window)
  ) {
    return;
  }

  VOICE_PLAYBACK_TOKEN += 1;
  const playbackToken = VOICE_PLAYBACK_TOKEN;
  duckPageMediaForVoice();

  function finishAnnouncement() {
    restorePageMediaVolume();
    if (
      VOICE_REPEAT_ENABLED &&
      playbackToken === VOICE_PLAYBACK_TOKEN
    ) {
      setTimeout(function() {
        if (
          VOICE_REPEAT_ENABLED &&
          playbackToken === VOICE_PLAYBACK_TOKEN
        ) {
          playCourtFinishVoice(courtNo, waitingMembers);
        }
      }, 450);
    }
  }

  let announcementText =
    courtNo + '번 코트 경기가 종료되었습니다. ';

  if (!waitingMembers.length) {
    announcementText +=
      '대기 1번에 입장할 인원이 없습니다.';
  } else {
    const memberCalls = waitingMembers
      .map(function(member) {
        return speechFriendlyMemberCall(member.name);
      })
      .filter(Boolean);
    const memberListText = memberCalls.join(' ');
    const assignmentBlock =
      memberListText + ' ' +
      courtNo + '번 코트로 들어가 주세요.';

    /* 4명 이름과 코트 입장 안내를 한 묶음으로 만들어
       같은 전체 안내를 정확히 세 번 반복한다. */
    announcementText +=
      assignmentBlock + ' ' +
      assignmentBlock + ' ' +
      assignmentBlock;
  }

  const queue = [{
    text: announcementText.trim(),
    gender: 'female'
  }];

  playVoiceQueue(queue, playbackToken, finishAnnouncement);
}

function server(name, args) {
  const mutationNames = [
    'addMember','setMemberStatus','deleteMembers',
    'assignMembersToCourt','assignMembersToWaitGroup',
    'assignWaitGroupToCourt',
    'autoFillCourt','autoFillWaitGroup','moveOrSwapMember',
    'swapCourts','swapWaitGroups','finishCourt',
    'removeFromCourt','removeFromWaitGroup','smartAssignSelected',
    'undoLastAction','decreaseSelectedGameCounts',
    'resetSelectedGameCounts','resetAllOperationData',
    'adjustCourtMembers','adjustWaitGroupMembers',
    'createManualBackup','restoreManualBackup','changeMemberPassword'
  ];
  const isMutation = mutationNames.indexOf(name) >= 0;

  if (isMutation && ACTION_IN_FLIGHT) {
    return Promise.reject(
      new Error('이전 작업을 저장하고 있습니다. 잠시만 기다려 주세요.')
    );
  }

  if (isMutation) setActionBusy(true);

  return new Promise(function(resolve, reject) {
    google.script.run
      .withSuccessHandler(function(result) {
        if (isMutation) setActionBusy(false);
        resolve(result);
      })
      .withFailureHandler(function(error) {
        if (isMutation) setActionBusy(false);
        reject(error);
      })[name]
      .apply(
        google.script.run,
        args || []
      );
  });
}

function setActionBusy(busy) {
  ACTION_IN_FLIGHT = Boolean(busy);
  document.body.classList.toggle(
    'action-busy',
    ACTION_IN_FLIGHT
  );
  document.body.setAttribute(
    'aria-busy',
    ACTION_IN_FLIGHT ? 'true' : 'false'
  );
}

document.addEventListener('click', function(event) {
  if (!ACTION_IN_FLIGHT) return;
  const control = event.target.closest('button,summary');
  if (!control) return;
  event.preventDefault();
  event.stopImmediatePropagation();
}, true);


function sortMembersByKoreanName(list) {
  return list.slice().sort(function(a, b) {
    return String(a.name || '').localeCompare(
      String(b.name || ''),
      'ko-KR',
      {
        sensitivity: 'base',
        numeric: true
      }
    );
  });
}

function memberById(id) {
  return STATE.members.find(function(member) {
    return member.id === id;
  });
}

function genderClass(member) {
  return (
    member &&
    member.gender === 'female'
  )
    ? 'female'
    : 'male';
}

function compactMemberName(name) {
  const baseName =
    String(name || '')
      .split('(')[0]
      .trim();

  return Array.from(baseName || String(name || '').trim())
    .slice(0, 2)
    .join('');
}

function escapeMemberInfo(value) {
  return String(value == null ? '' : value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function firstMemberProfileValue(member, keys) {
  if (!member) return '';
  for (let index = 0; index < keys.length; index += 1) {
    const value = String(member[keys[index]] == null ? '' : member[keys[index]]).trim();
    if (value) return value;
  }
  return '';
}

function normalizeMemberProfile(member) {
  if (!member) return member;
  const grade = firstMemberProfileValue(member, [
    'grade', 'level', 'rank', 'className', 'skillLevel'
  ]);
  const experience = firstMemberProfileValue(member, [
    'experience', 'career', 'years', 'experienceText', 'playYears'
  ]);
  member.grade = grade;
  member.experience = experience;
  member.level = grade;
  member.career = experience;
  return member;
}

function normalizeStateMemberProfiles(state) {
  if (!state || !Array.isArray(state.members)) return state;
  state.members.forEach(normalizeMemberProfile);
  return state;
}

function memberLocationInfo(member) {
  if (!member) return '';
  const id = String(member.id || '');

  for (let courtNo = 1; courtNo <= 4; courtNo++) {
    if ((STATE.courts[courtNo] || []).some(function(value) {
      return String(value) === id;
    })) {
      return courtNo + '번코트';
    }
  }

  for (let groupIndex = 0; groupIndex < (STATE.waitGroups || []).length; groupIndex++) {
    if ((STATE.waitGroups[groupIndex] || []).some(function(value) {
      return String(value) === id;
    })) {
      return '대기' + (groupIndex + 1);
    }
  }

  if (member.status === 'active') return '코트배정 대기';
  if (member.status === 'before') return '도착전';
  if (member.status === 'rest') return '휴식';
  if (member.status === 'away') return '귀가';
  return '';
}

function memberInfoDetailHtml(member, locationOverride) {
  normalizeMemberProfile(member);
  const grade = String(member && member.grade || '').trim();
  let experience = String(member && member.experience || '').trim();

  experience = experience.replace(/^구력\s*/i, '').trim();

  if (!IS_ADMIN) {
    const parts = [];
    if (grade) parts.push(escapeMemberInfo(grade));
    if (experience) parts.push(escapeMemberInfo('구력 ' + experience));
    if (!parts.length) return '';
    return '<span class="member-info-detail">' + parts.join(' · ') + '</span>';
  }

  if (!grade && !experience) {
    return '<span class="member-info-detail is-missing">급수·구력 미입력</span>';
  }

  const gradeText = grade || '급수 미입력';
  const experienceText = experience ? '구력 ' + experience : '구력 미입력';

  return '<span class="member-info-detail' +
    ((!grade || !experience) ? ' is-missing' : '') + '">' +
    escapeMemberInfo(gradeText) + ' · ' + escapeMemberInfo(experienceText) +
    '</span>';
}

function toggleMemberInfo(memberId, event) {

  return;
}

function memberLongPressAttributes(memberId) {
  if (!IS_ADMIN) return '';
  return (
    ' onpointerdown="startMemberLongPress(\'' + memberId + '\',event)"' +
    ' onpointermove="moveMemberLongPress(event)"' +
    ' onpointerup="finishMemberLongPress()"' +
    ' onpointercancel="finishMemberLongPress()"' +
    ' oncontextmenu="event.preventDefault()"'
  );
}

function startMemberLongPress(memberId, event) {
  if (!IS_ADMIN) return;
  finishMemberLongPress();

  MEMBER_LONG_PRESS_TRACK = {
    memberId: memberId,
    x: event ? event.clientX : 0,
    y: event ? event.clientY : 0
  };

  MEMBER_LONG_PRESS_TIMER = setTimeout(function() {
    MEMBER_LONG_PRESS_TIMER = null;
    MEMBER_ACTION_IDS = [memberId];
    MEMBER_LONG_PRESS_BLOCK_UNTIL = Date.now() + 700;

    if (navigator.vibrate) {
      navigator.vibrate(25);
    }

    document
      .querySelectorAll('[data-member-id="' + memberId + '"]')
      .forEach(function(element) {
        element.classList.add('long-pressed');
      });
    renderQuickMoveBar();
  }, 600);
}

function moveMemberLongPress(event) {
  if (!MEMBER_LONG_PRESS_TRACK || !event) return;

  if (
    Math.abs(event.clientX - MEMBER_LONG_PRESS_TRACK.x) > 12 ||
    Math.abs(event.clientY - MEMBER_LONG_PRESS_TRACK.y) > 12
  ) {
    finishMemberLongPress();
  }
}

function finishMemberLongPress() {
  if (MEMBER_LONG_PRESS_TIMER) {
    clearTimeout(MEMBER_LONG_PRESS_TIMER);
    MEMBER_LONG_PRESS_TIMER = null;
  }
  MEMBER_LONG_PRESS_TRACK = null;
}

function consumeLongPressClick(memberId, event) {
  if (
    Date.now() <= MEMBER_LONG_PRESS_BLOCK_UNTIL &&
    MEMBER_ACTION_IDS.indexOf(memberId) >= 0
  ) {
    if (event) {
      event.preventDefault();
      event.stopPropagation();
    }
    MEMBER_LONG_PRESS_BLOCK_UNTIL = 0;
    return true;
  }
  return false;
}

function handleSelectableMemberClick(memberId, event) {
  if (consumeLongPressClick(memberId, event)) return;
  if (assignMemberToChosenEmpty(memberId, event)) return;
  toggleSelected(memberId);
}

function assignMemberToChosenEmpty(memberId, event) {
  if (!AUTO_ASSIGN_TARGET) return false;

  const targetType = AUTO_ASSIGN_TARGET.type;
  const targetIndex = AUTO_ASSIGN_TARGET.index;
  const targetGroup =
    targetType === 'court'
      ? (STATE.courts[targetIndex] || [])
      : (STATE.waitGroups[targetIndex] || []);

  if (targetGroup.indexOf(memberId) >= 0) {
    alert('이미 선택한 위치에 있는 멤버입니다.');
    return true;
  }

  if (targetGroup.length >= 4) {
    AUTO_ASSIGN_TARGET = null;
    alert('선택한 위치에는 빈자리가 없습니다.');
    renderState();
    return true;
  }

  if (event) {
    event.preventDefault();
    event.stopPropagation();
  }

  if (targetGroup.length === 3) {
    AUTO_ASSIGN_TARGET = null;
  }

  QUICK_PICK = null;
  SELECTED.delete(memberId);
  batchAssignToTarget(
    [memberId],
    targetType,
    targetIndex
  );
  return true;
}

function handleEmptySlotTap(type, index, slotIndex, event) {
  if (event) {
    event.preventDefault();
    event.stopPropagation();
  }

  let ids = [];

  if (QUICK_PICK) {
    ids = [QUICK_PICK.memberId];
  } else {
    ids = Array.from(SELECTED);
  }

  if (!ids.length) {
    const sameTarget =
      AUTO_ASSIGN_TARGET &&
      AUTO_ASSIGN_TARGET.type === type &&
      AUTO_ASSIGN_TARGET.index === Number(index) &&
      AUTO_ASSIGN_TARGET.slotIndex === Number(slotIndex);

    AUTO_ASSIGN_TARGET = sameTarget
      ? null
      : {
          type: type,
          index: Number(index),
          slotIndex: Number(slotIndex)
        };
    renderCourts();
    renderWaitGroups();
    return;
  }

  const targetGroup =
    type === 'court'
      ? (STATE.courts[Number(index)] || [])
      : (STATE.waitGroups[Number(index)] || []);
  const capacity = 4 - targetGroup.length;

  if (ids.some(function(id) {
    return targetGroup.indexOf(id) >= 0;
  })) {
    alert('이미 이 위치에 있는 인원은 다시 넣을 수 없습니다.');
    return;
  }

  if (ids.length > capacity) {
    alert(
      '이 위치에는 ' + capacity +
      '명만 더 들어갈 수 있습니다. 선택 인원을 줄여주세요.'
    );
    return;
  }

  AUTO_ASSIGN_TARGET = null;
  cancelQuickPick();
  batchAssignToTarget(ids, type, index);
}

function locateMemberInState(memberId) {
  for (let courtNo = 1; courtNo <= 4; courtNo++) {
    const position = (STATE.courts[courtNo] || []).indexOf(memberId);
    if (position >= 0) {
      return { type:'court', index:String(courtNo), position:position };
    }
  }
  for (let groupIndex = 0; groupIndex < STATE.waitGroups.length; groupIndex++) {
    const position = (STATE.waitGroups[groupIndex] || []).indexOf(memberId);
    if (position >= 0) {
      return { type:'wait', index:String(groupIndex), position:position };
    }
  }
  return { type:'active', index:'', position:-1 };
}

function stateGroup(location) {
  if (location.type === 'court') return STATE.courts[Number(location.index)];
  if (location.type === 'wait') return STATE.waitGroups[Number(location.index)];
  return null;
}

function applyMoveOrSwapLocally(memberId, targetType, targetIndex, targetMemberId) {
  const source = locateMemberInState(memberId);
  const sourceGroup = stateGroup(source);

  if (targetMemberId) {
    const other = locateMemberInState(targetMemberId);
    const otherGroup = stateGroup(other);
    if (sourceGroup) sourceGroup[source.position] = targetMemberId;
    if (otherGroup) otherGroup[other.position] = memberId;
  } else {
    const target = { type:targetType, index:String(targetIndex), position:-1 };
    const targetGroup = stateGroup(target);
    if (targetGroup && targetGroup.length >= 4) {
      throw new Error('선택한 위치는 이미 4명이 모두 찼습니다.');
    }
    if (sourceGroup) sourceGroup.splice(source.position, 1);
    if (targetGroup) targetGroup.push(memberId);
  }

  const playing = new Set();
  const waiting = new Set();
  Object.keys(STATE.courts).forEach(function(key) {
    (STATE.courts[key] || []).forEach(function(id) { playing.add(id); });
  });
  STATE.waitGroups.forEach(function(group) {
    (group || []).forEach(function(id) { waiting.add(id); });
  });
  STATE.members.forEach(function(member) {
    if (playing.has(member.id)) member.status = 'playing';
    else if (waiting.has(member.id)) member.status = 'waiting';
    else if (member.id === memberId || member.id === targetMemberId) {
      member.status = 'active';
    }
  });
}

function applyBatchAssignLocally(ids, targetType, targetIndex) {
  const moving = new Set(ids);

  Object.keys(STATE.courts).forEach(function(key) {
    STATE.courts[key] =
      (STATE.courts[key] || []).filter(function(id) {
        return !moving.has(id);
      });

    if (STATE.courts[key].length < 4) {
      STATE.courtStartedAt[key] = '';
    }
  });

  STATE.waitGroups = STATE.waitGroups.map(function(group) {
    return (group || []).filter(function(id) {
      return !moving.has(id);
    });
  });

  if (targetType === 'court') {
    const courtNo = Number(targetIndex);
    STATE.courts[courtNo] =
      (STATE.courts[courtNo] || []).concat(ids);
    STATE.courtStartedAt[courtNo] =
      STATE.courts[courtNo].length === 4
        ? new Date().toISOString()
        : '';
  } else {
    const groupIndex = Number(targetIndex);
    STATE.waitGroups[groupIndex] =
      (STATE.waitGroups[groupIndex] || []).concat(ids);
  }

  const playing = new Set();
  const waiting = new Set();

  Object.keys(STATE.courts).forEach(function(key) {
    (STATE.courts[key] || []).forEach(function(id) {
      playing.add(id);
    });
  });
  STATE.waitGroups.forEach(function(group) {
    (group || []).forEach(function(id) {
      waiting.add(id);
    });
  });

  STATE.members.forEach(function(member) {
    if (playing.has(member.id)) member.status = 'playing';
    else if (waiting.has(member.id)) member.status = 'waiting';
    else if (moving.has(member.id)) member.status = 'active';
  });
}

async function batchAssignToTarget(ids, targetType, targetIndex) {
  const previousState =
    JSON.parse(JSON.stringify(STATE));

  try {
    applyBatchAssignLocally(
      ids,
      targetType,
      targetIndex
    );
    renderState();

    const method =
      targetType === 'court'
        ? 'assignMembersToCourt'
        : 'assignMembersToWaitGroup';

    const state = await server(method, [
      ADMIN_PIN_VALUE,
      Number(targetIndex),
      ids
    ]);

    renderState(state);
    setUndoState(previousState);
  } catch (error) {
    STATE = previousState;
    renderState();
    alert(error.message || error);
  }
}

async function quickMoveOrSwap(memberId, targetType, targetIndex, targetMemberId) {
  const previousState = JSON.parse(JSON.stringify(STATE));
  try {
    applyMoveOrSwapLocally(
      memberId,
      targetType,
      targetIndex,
      targetMemberId || ''
    );
    renderState();
    const state = await server('moveOrSwapMember', [
      ADMIN_PIN_VALUE,
      memberId,
      targetType,
      String(targetIndex),
      targetMemberId || ''
    ]);
    renderState(state);
    setUndoState(previousState);
  } catch (error) {
    STATE = previousState;
    renderState();
    alert(error.message || error);
  }
}

function sendQuickPickToActive() {

  closeMemberActionBar();

function deleteQuickPickedMembers() {
  const ids = MEMBER_ACTION_IDS.slice();

  if (!ids.length) return;

  const names = ids
    .map(memberById)
    .filter(Boolean)
    .map(function(member) {
      return member.name;
    })
    .join(', ');

  if (!confirm(names + '\n\n선택한 멤버를 완전히 삭제할까요?')) {

function assignToQuickTarget(type, index) {
  if (QUICK_PICK) {
    const memberId = QUICK_PICK.memberId;
    cancelQuickPick();
    quickMoveOrSwap(memberId, type, index, '');
    return;
  }

  if (!SELECTED.size) return;

  const action =
    type === 'court'
      ? 'assignMembersToCourt'
      : 'assignMembersToWaitGroup';

  runAction(action, [

    Number(index),
    Array.from(SELECTED)

function wholeSwapLabel(type, index) {

}

function renderWholeSwapBar() {
  const bar =
    document.getElementById(
      'wholeSwapBar'
    );

  if (!bar) return;

  bar.classList.toggle(
    'hidden',
    !WHOLE_SWAP_PICK

function cancelWholeSwap() {
  if (!WHOLE_SWAP_PICK) return;
  WHOLE_SWAP_PICK = null;
  refreshWholeSwapVisuals();
}

function handleGroupHeaderClick(type, index, event) {
  if (event) {
    event.preventDefault();
    event.stopPropagation();
  }

  if (QUICK_PICK) {
    assignToQuickTarget(type, index);
    return;
  }

  if (SELECTED.size) {
    alert(
      '선택한 인원은 빈자리를 두 번 눌러 배치하세요. ' +
      '전체 교환은 인원 선택을 해제한 뒤 사용하세요.'
    );
    return;
  }

  index = String(index);

  if (!WHOLE_SWAP_PICK) {
    WHOLE_SWAP_PICK = {
      type: type,
      index: index
    };
    refreshWholeSwapVisuals();
    return;
  }

  const first = WHOLE_SWAP_PICK;

  if (
    first.type === type &&
    first.index === index
  ) {
    cancelWholeSwap();
    return;
  }

  if (first.type !== type) {
    alert(
      type === 'court'
        ? '코트끼리만 전체 교환할 수 있습니다.'
        : '대기조끼리만 전체 교환할 수 있습니다.'
    );
    WHOLE_SWAP_PICK = {
      type: type,
      index: index
    };
    refreshWholeSwapVisuals();
    return;
  }

  WHOLE_SWAP_PICK = null;
  quickWholeGroupSwap(
    type,
    first.index,
    index
  );
}

function applyWholeGroupSwapLocally(type, indexA, indexB) {
  if (type === 'court') {
    const courtA = Number(indexA);
    const courtB = Number(indexB);
    const players = STATE.courts[courtA];
    const startedAt = STATE.courtStartedAt[courtA];

    STATE.courts[courtA] = STATE.courts[courtB];
    STATE.courts[courtB] = players;
    STATE.courtStartedAt[courtA] =
      STATE.courtStartedAt[courtB];
    STATE.courtStartedAt[courtB] = startedAt;
    return;
  }

  const groupA = Number(indexA);
  const groupB = Number(indexB);
  const players = STATE.waitGroups[groupA];

  STATE.waitGroups[groupA] =
    STATE.waitGroups[groupB];
  STATE.waitGroups[groupB] = players;
}

async function quickWholeGroupSwap(type, indexA, indexB) {
  const previousState =
    JSON.parse(JSON.stringify(STATE));

  try {
    applyWholeGroupSwapLocally(
      type,
      indexA,
      indexB
    );
    renderState();

    const method =
      type === 'court'
        ? 'swapCourts'
        : 'swapWaitGroups';

    const state = await server(method, [
      ADMIN_PIN_VALUE,
      Number(indexA),
      Number(indexB)
    ]);

    renderState(state);
    setUndoState(previousState);
  } catch (error) {
    STATE = previousState;
    renderState();
    alert(error.message || error);
  }
}


function isUnifiedMemberFrame() {

}

function postUnifiedMemberMessage(type, extra) {
  if (IS_ADMIN || window.top === window) return false;
  try {
    window.top.postMessage(
      Object.assign({type: type}, extra || {}),
      UNIFIED_MEMBER_APP_ORIGIN
    );
    return true;
  } catch (error) {
    return false;
  }
}

function currentMemberAuthVersion() {

}

function currentMemberSessionToken() {
  if (MEMBER_SESSION_VALUE) return String(MEMBER_SESSION_VALUE);
  try { return String(localStorage.getItem(MEMBER_SESSION_KEY) || ''); }

}

function memberSelfSearchMatches() {

  const query = String(input && input.value || '').trim().toLocaleLowerCase('ko-KR');
  if (!query) return [];
  return sortMembersByKoreanName((STATE.members || []).filter(function(member) {
    return member && String(member.name || '').toLocaleLowerCase('ko-KR').indexOf(query) >= 0;
  })).slice(0, 8);

  event.preventDefault();

function selectMemberSelf(memberId) {
  if (IS_ADMIN) return;
  const member = (STATE.members || []).find(function(item) {
    return item && String(item.id) === String(memberId);
  });
  if (!member) return;
  const memberInput = document.getElementById('memberSelfSearchInput');
  if (memberInput) {
    memberInput.dataset.userEditing = '0';
    memberInput.value = String(member.name || '').trim();
  }
  try {
    localStorage.setItem(WEB_PUSH_SELECTED_MEMBER_KEY, JSON.stringify({
      id: String(member.id),
      name: String(member.name || '').trim()
    }));
    localStorage.setItem(MEMBER_SELF_PANEL_COMPACT_KEY, 'true');
  } catch (error) {}
  unlockMemberAlertAudio();
  postUnifiedMemberMessage('JAYUMINTON_MEMBER_SELECTED', {
    member: {id: String(member.id), name: String(member.name || '').trim()}
  });
  renderCourts();
  renderWaitGroups();
  renderActive();
  renderInactive();
  renderMemberSelfSettings();
}

  if (IS_ADMIN) return;

    localStorage.removeItem(WEB_PUSH_SELECTED_MEMBER_KEY);
    localStorage.removeItem(WEB_PUSH_CONNECTION_KEY);
    localStorage.setItem(MEMBER_SELF_PANEL_COMPACT_KEY, 'false');

  const input = document.getElementById('memberSelfSearchInput');

  renderWaitGroups();

}

function toggleMemberAlertSetting() {

  catch (error) {}
  if (enabled) unlockMemberAlertAudio();
  postUnifiedMemberMessage('JAYUMINTON_MEMBER_ALERT_PREFERENCE', {enabled: enabled});

function toggleMemberVibrationSetting() {
  const enabled = !memberVibrationEnabled();
  try { localStorage.setItem(MEMBER_VIBRATION_ENABLED_KEY, enabled ? 'true' : 'false'); }
  catch (error) {}
  if (enabled && navigator.vibrate) {

let MEMBER_SETTING_MESSAGE_TIMER = null;

function showMemberSettingMessage(text, isError) {
  const message = document.getElementById('memberUnifiedSettingMessage');
  if (!message || !text) return;
  message.textContent = String(text);
  message.classList.toggle('is-error', !!isError);

}

function compactMemberSelfSettings() {
  let selected = currentStoredWebPushMember();
  const input = document.getElementById('memberSelfSearchInput');
  const typed = String(input && input.value || '').trim();

  // member-complete-auto-select-v12
  // If the user typed another name, never reuse the previously stored member silently.
  if (input && input.dataset.userEditing === '1' && typed) {
    const matches = memberSelfSearchMatches();
    const typedLower = typed.toLocaleLowerCase('ko-KR');
    const exact = matches.find(function(member) {
      return member && String(member.name || '').trim().toLocaleLowerCase('ko-KR') === typedLower;
    });
    const candidate = exact || (matches.length === 1 ? matches[0] : null);
    if (candidate) {
      selectMemberSelf(candidate.id);
      selected = {id:String(candidate.id), name:String(candidate.name || '').trim()};
    } else {
      showMemberSettingMessage('검색 결과에서 본인 이름을 선택하세요.', true);
      if (input) input.focus();
      return;
    }
  }

  if (!selected) {
    if (input) input.focus();
    showMemberSettingMessage('먼저 내 이름을 선택하세요.', true);
    return;
  }
  if (memberAlertEnabled()) {
    postUnifiedMemberMessage('JAYUMINTON_PUSH_SETUP_REQUEST', {
      member: selected,
      authVersion: currentMemberAuthVersion()
    });
  } else {
    postUnifiedMemberMessage('JAYUMINTON_PUSH_DISCONNECT_REQUEST', {member:selected});
  }
  if (input) input.dataset.userEditing = '0';
  try { localStorage.setItem(MEMBER_SELF_PANEL_COMPACT_KEY, 'true'); }
  catch (error) {}
  renderMemberSelfSettings();
}

function buildMemberInstallEntryUrl() {
  const target = new URL(UNIFIED_MEMBER_APP_URL);
  target.searchParams.set('install', 'choose');
  target.searchParams.set('external', '1');
  target.searchParams.set('source', 'embedded');
  target.searchParams.set('app', 'user');
  target.searchParams.set('mode', 'user');
  const selected = currentStoredWebPushMember();
  if (selected && selected.id) target.searchParams.set('memberId', String(selected.id));
  if (selected && selected.name) target.searchParams.set('memberName', String(selected.name));
  const sessionToken = currentMemberSessionToken();
  if (sessionToken) target.searchParams.set('memberSession', sessionToken);
  return target.toString();
}

function detectMemberInstallPlatform() {
  if (MEMBER_APP_INSTALL_STATE.platform === 'android' || MEMBER_APP_INSTALL_STATE.platform === 'ios') {
    return MEMBER_APP_INSTALL_STATE.platform;
  }
  const ua = String(navigator.userAgent || '');
  if (/Android/i.test(ua)) return 'android';
  if (/iPhone|iPad|iPod/i.test(ua) ||
      (navigator.platform === 'MacIntel' && Number(navigator.maxTouchPoints || 0) > 1)) return 'ios';
  return 'other';
}

function detectMemberInstallBrowserContext() {
  const known = String(MEMBER_APP_INSTALL_STATE.browserContext || '');
  if (known && known !== 'other') return known;
  const ua = String(navigator.userAgent || '');
  const ref = String(document.referrer || '');
  const embedded = /;\s*wv\)|\bwv\b|KAKAOTALK|KakaoTalk|DaumApps|NAVER|Instagram|FBAN|FBAV|Line\/|Daangn|Danggeun|Karrot|com\.towneers|EverytimeApp|WhaleInApp/i.test(ua) ||
    /kakao|daangn|danggeun|karrot|naver|instagram/i.test(ref) || !!window.NativeVoice;
  const platform = detectMemberInstallPlatform();
  if (embedded && platform === 'android') return 'android-embedded';
  if (embedded && platform === 'ios') return 'ios-embedded';
  if (platform === 'android') return 'android-browser';
  if (platform === 'ios') return 'ios-safari';
  return 'other';
}

function navigateMemberTop(url) {
  try {
    window.top.location.href = url;
    return true;
  } catch (error) {
    try {
      window.location.href = url;
      return true;
    } catch (innerError) {
      return false;
    }
  }
}

function openMemberInstallInChrome(installUrl) {
  if (isUnifiedMemberFrame()) {
    postUnifiedMemberMessage('JAYUMINTON_APP_INSTALL_REQUEST', {
      platform: 'android',
      browserContext: detectMemberInstallBrowserContext(),
      installUrl: installUrl
    });
    return;
  }
  try {
    const target = new URL(installUrl);
    if (target.origin !== UNIFIED_MEMBER_APP_ORIGIN) throw new Error('invalid member app origin');
    target.searchParams.set('install', 'choose');
    target.searchParams.set('external', '1');
    target.searchParams.set('source', 'embedded');
    target.searchParams.set('app', 'user');
    target.searchParams.set('mode', 'user');
    navigateMemberTop(target.toString());
    return;
  } catch (error) {}
  navigateMemberTop(UNIFIED_MEMBER_APP_URL + '?install=choose&external=1&source=embedded&app=user&mode=user');
}

function openMemberInstallInSafari(installUrl) {
  try {
    const target = new URL(installUrl);
    const safariUrl = 'x-safari-https://' + target.host + target.pathname + target.search + target.hash;
    if (navigateMemberTop(safariUrl)) return;
  } catch (error) {}
  navigateMemberTop(installUrl);
}

function openMemberSelfSettings() {
  try { localStorage.setItem(MEMBER_SELF_PANEL_COMPACT_KEY, 'false'); }

  const input = document.getElementById('memberSelfSearchInput');
  if (input) {

  }
  renderMemberSelfSettings();
  setTimeout(function() {
    const currentInput = document.getElementById('memberSelfSearchInput');
    if (currentInput) currentInput.focus();

}

function renderMemberSelfSettings() {
  if (MEMBER_USER_APK_HINT) {
    MEMBER_APP_INSTALL_STATE.installed = true;
    MEMBER_APP_INSTALL_STATE.choice = 'on';
    MEMBER_APP_INSTALL_STATE.browserContext = 'user-apk';
    MEMBER_APP_INSTALL_STATE.ready = true;
    MEMBER_APP_INSTALL_STATE.installing = false;
    MEMBER_APP_INSTALL_STATE.prepRemaining = 0;
    MEMBER_APP_INSTALL_STATE.nativeInstall = true;
  } else {
    MEMBER_APP_INSTALL_STATE.installed = false;
    MEMBER_APP_INSTALL_STATE.choice = '';
    MEMBER_APP_INSTALL_STATE.ready = true;
    MEMBER_APP_INSTALL_STATE.nativeInstall = true;
    MEMBER_APP_INSTALL_STATE.prepRemaining = 0;
  }

  if (IS_ADMIN) return;
  const summary = document.getElementById('memberSelfSummary');
  const summaryText = document.getElementById('memberSelfSummaryText');
  const panel = document.getElementById('memberSelfPanel');
  const alertButton = document.getElementById('memberAlertToggle');
  const vibrationButton = document.getElementById('memberVibrationToggle');
  const appInstallButton = document.getElementById('memberAppInstallToggle');
  const input = document.getElementById('memberSelfSearchInput');
  if (!summary || !panel) return;

  const selected = currentStoredWebPushMember();
  let compact = false;
  try { compact = !!selected && localStorage.getItem(MEMBER_SELF_PANEL_COMPACT_KEY) !== 'false'; }
  catch (error) { compact = !!selected; }

  summary.classList.toggle('hidden', !compact);
  panel.classList.toggle('hidden', compact);

  if (summaryText) {
    summaryText.textContent = selected
      ? '🌟 ' + selected.name + ' · 알림 ' + (memberAlertEnabled() ? 'ON' : 'OFF') +
        ' · 진동 ' + (memberVibrationEnabled() ? 'ON' : 'OFF') +
        ' · 앱설치 ' + (MEMBER_APP_INSTALL_STATE.installed ? 'ON' : 'OFF')
      : '🌟 내 이름·알림·앱 설정';
  }
  if (alertButton) {
    alertButton.textContent = '알림 ' + (memberAlertEnabled() ? 'ON' : 'OFF');
    alertButton.classList.toggle('is-on', memberAlertEnabled());
  }
  if (vibrationButton) {
    vibrationButton.textContent = '진동 ' + (memberVibrationEnabled() ? 'ON' : 'OFF');
    vibrationButton.classList.toggle('is-on', memberVibrationEnabled());
  }
  if (appInstallButton) {
    let installLabel = MEMBER_APP_INSTALL_STATE.installed
      ? '앱설치 ON'
      : (MEMBER_APP_INSTALL_STATE.installing ? '앱설치 중' : '앱설치');
    appInstallButton.textContent = installLabel;
    appInstallButton.classList.toggle('is-on', MEMBER_APP_INSTALL_STATE.installed);
    appInstallButton.classList.toggle('is-installing', MEMBER_APP_INSTALL_STATE.installing);
    appInstallButton.classList.toggle('is-preparing', MEMBER_APP_INSTALL_STATE.platform === 'android' && !MEMBER_APP_INSTALL_STATE.ready && !MEMBER_APP_INSTALL_STATE.nativeInstall && !MEMBER_APP_INSTALL_STATE.installing);
    const prepRemain = Math.max(0, Math.min(30, Number(MEMBER_APP_INSTALL_STATE.prepRemaining || 0)));
    appInstallButton.style.setProperty('--install-prep-progress', String(((30 - prepRemain) / 30) * 100) + '%');
    appInstallButton.setAttribute('aria-busy', MEMBER_APP_INSTALL_STATE.installing ? 'true' : 'false');
  }
  if (input && selected && !input.value && input.dataset.userEditing !== '1') input.value = selected.name;
  if (!compact) renderMemberSelfMatches();
  requestAnimationFrame(publishMemberAppInstallButtonRect);
}

function publishMemberAppInstallButtonRect() {
  if (IS_ADMIN || window.top === window) return;
  const button = document.getElementById('memberAppInstallToggle');
  const panel = document.getElementById('memberSelfPanel');
  if (!button || !panel) return;
  const rect = button.getBoundingClientRect();
  const visible = !button.classList.contains('hidden') &&
    !panel.classList.contains('hidden') &&
    rect.width > 0 && rect.height > 0;
  postUnifiedMemberMessage('JAYUMINTON_APP_INSTALL_BUTTON_RECT', {
    visible: visible,
    left: rect.left,
    top: rect.top,
    width: rect.width,
    height: rect.height
  });
}

function currentWebPushConnection() {
  try {
    const saved = JSON.parse(localStorage.getItem(WEB_PUSH_CONNECTION_KEY) || 'null');

function applyWebPushReturn() {
  if (IS_ADMIN) return;
  let returned = window.JAYUMINTON_PUSH_RETURN || {};
  try {
    const prefix = 'JAYUMINTON_PUSH_RETURN:';
    if ((!returned || !returned.connected) &&
        String(window.name || '').indexOf(prefix) === 0) {
      const rawReturn = String(window.name).slice(prefix.length);
      try {
        returned = JSON.parse(rawReturn);
      } catch (parseError) {
        returned = JSON.parse(decodeURIComponent(rawReturn));
      }
      window.name = '';
    }
  } catch (error) {
    returned = returned || {};
  }
  if (!returned.connected || !returned.memberId) return;
  const connection = {
    connected: true,
    memberId: String(returned.memberId),
    memberName: String(returned.memberName || '').trim(),
    connectedAt: Date.now()
  };
  try {
    localStorage.setItem(WEB_PUSH_CONNECTION_KEY, JSON.stringify(connection));
    localStorage.setItem(WEB_PUSH_SELECTED_MEMBER_KEY, JSON.stringify({
      id: connection.memberId,
      name: connection.memberName
    }));
  } catch (error) {}
}

function encodeUnifiedHandoff(value) {
  try {
    const bytes = new TextEncoder().encode(JSON.stringify(value));
    let binary = '';
    bytes.forEach(function(byte) { binary += String.fromCharCode(byte); });
    return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
  } catch (error) {
    return '';
  }
}

function webPushEscapeHtml(value) {
  return String(value == null ? '' : value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

window.addEventListener('message', function(event) {
  if (event.origin !== UNIFIED_MEMBER_APP_ORIGIN) return;
  const data = event.data || {};

  if (data.type === 'JAYUMINTON_UNIFIED_BOOTSTRAP') {
    UNIFIED_MEMBER_BRIDGE_CONNECTED = true;
    if (data.authVersion) {
      try { localStorage.setItem(MEMBER_AUTH_KEY, String(data.authVersion)); }
      catch (error) {}
    }
    if (data.authSession) storeMemberSessionToken(String(data.authSession));
    if (data.member && data.member.id && data.member.name) {
      try {
        localStorage.setItem(WEB_PUSH_SELECTED_MEMBER_KEY, JSON.stringify({
          id: String(data.member.id),
          name: String(data.member.name)
        }));
      } catch (error) {}
      renderWebPushMemberOptions();
    }
    if (data.pushConnected && data.pushMember && data.pushMember.id) {
      try {
        localStorage.setItem(WEB_PUSH_CONNECTION_KEY, JSON.stringify({
          connected: true,
          memberId: String(data.pushMember.id),
          memberName: String(data.pushMember.name || ''),
          connectedAt: Date.now()
        }));
      } catch (error) {}
      renderWebPushMemberOptions();
    }
    MEMBER_APP_INSTALL_STATE = {
      installed:MEMBER_PWA_STANDALONE_HINT || !!data.appInstalled,
      choice:MEMBER_PWA_STANDALONE_HINT ? 'on' : String(data.appInstallChoice || ''),
      platform:String(data.appInstallPlatform || 'other'),
      browserContext:MEMBER_PWA_STANDALONE_HINT ? 'standalone' : String(data.appInstallBrowserContext || 'other'),
      message:'',
      ready:!!data.appInstallReady,
      installing:!!data.appInstallPending,
      armed:!!data.appInstallArmed,
      prepRemaining:Number(data.appInstallPrepRemaining || 0),
      nativeInstall:!!data.appInstallNative
    };
    renderMemberSelfSettings();
    if (!IS_ADMIN) initialize();
    return;
  }

  if (data.type === 'JAYUMINTON_UNIFIED_PUSH_STATUS') {
    const status = document.getElementById('webPushStatus');
    if (data.connected && data.member && data.member.id) {
      try {
        localStorage.setItem(WEB_PUSH_CONNECTION_KEY, JSON.stringify({
          connected: true,
          memberId: String(data.member.id),
          memberName: String(data.member.name || ''),
          connectedAt: Date.now()
        }));
      } catch (error) {}
      renderWebPushMemberOptions();
    } else if (data.connected === false) {
      try { localStorage.removeItem(WEB_PUSH_CONNECTION_KEY); } catch (error) {}
      renderWebPushMemberOptions();
    } else if (status) {
      status.textContent = String(data.message || '개인 알림 상태가 갱신되었습니다.');
    }
    return;
  }

  if (data.type === 'JAYUMINTON_APP_INSTALL_STATUS') {
    MEMBER_APP_INSTALL_STATE = {
      installed:MEMBER_PWA_STANDALONE_HINT || !!data.installed,
      choice:MEMBER_PWA_STANDALONE_HINT ? 'on' : String(data.choice || ''),
      platform:String(data.platform || 'other'),
      browserContext:MEMBER_PWA_STANDALONE_HINT ? 'standalone' : String(data.browserContext || 'other'),
      message:String(data.message || ''),
      ready:!!data.ready,
      installing:!!data.installing,
      armed:!!data.armed,
      prepRemaining:Number(data.prepRemaining || 0),
      nativeInstall:!!data.nativeInstall
    };
    renderMemberSelfSettings();
    if (data.message) showMemberSettingMessage(String(data.message), /못|취소|오류|시작되지|준비가 되지/.test(String(data.message)));
    return;
  }

  if (data.type === 'JAYUMINTON_PUSH_CONNECT_RESULT') {
    showMemberSettingMessage(
      String(data.message || (data.connected ? '알림 ON' : '알림 OFF')),
      data.connected === false
    );
    if (data.connected && data.member && data.member.id) {
      try {
        localStorage.setItem(WEB_PUSH_CONNECTION_KEY, JSON.stringify({
          connected:true,
          memberId:String(data.member.id),
          memberName:String(data.member.name || ''),
          connectedAt:Date.now()
        }));
      } catch (error) {}
    } else if (data.connected === false) {
      try { localStorage.removeItem(WEB_PUSH_CONNECTION_KEY); } catch (error) {}
    }
    renderMemberSelfSettings();
    return;
  }

  if (data.type === 'JAYUMINTON_UNIFIED_REFRESH') {
    const app = document.getElementById('memberApp');
    if (app && !app.classList.contains('hidden')) {
      refreshMemberState();
    } else {
      initialize();
    }
  }
});

function memberLocation(state, memberId) {
  if (!state || !memberId) return {type: 'none', index: -1};
  const id = String(memberId);
  for (let courtNo = 1; courtNo <= 4; courtNo += 1) {
    if ((state.courts && state.courts[courtNo] || []).some(function(value) {
      return String(value) === id;
    })) return {type: 'court', index: courtNo};
  }
  const waits = Array.isArray(state.waitGroups) ? state.waitGroups : [];
  for (let waitIndex = 0; waitIndex < waits.length; waitIndex += 1) {
    if ((waits[waitIndex] || []).some(function(value) {
      return String(value) === id;
    })) return {type: 'wait', index: waitIndex};
  }
  return {type: 'other', index: -1};
}

function mostElapsedCourtNoForState(state) {
  const candidates = [1, 2, 3, 4].filter(function(no) {
    return state && state.courts && Array.isArray(state.courts[no]) &&
      state.courts[no].length === 4;
  }).map(function(no) {
    const started = parseCourtStart(state.courtStartedAt && state.courtStartedAt[no]);
    return {courtNo: no, startedAt: started ? started.getTime() : Number.POSITIVE_INFINITY};
  }).sort(function(a, b) {
    return a.startedAt - b.startedAt || a.courtNo - b.courtNo;
  });
  return candidates.length ? candidates[0].courtNo : 0;
}

function memberAlertRepeatCount(type) {
  if (type === 'court_assignment') return 4;
  if (type === 'wait1_ready') return 2;
  return 1;
}

function memberVibrationPattern(type) {
  return [320, 180, 320, 180, 320];
}

function playSingleMemberAlertCue(type) {
  try {
    if (memberVibrationEnabled() && navigator.vibrate) {
      navigator.vibrate(memberVibrationPattern(type));
    }
  } catch (error) {}
  try {
    if (!memberAlertEnabled()) return;
    const ctx = window.__jayumintonMemberAudioContext;
    if (!ctx || !MEMBER_ALERT_AUDIO_READY) return;
    const oscillator = ctx.createOscillator();
    const gain = ctx.createGain();
    oscillator.frequency.value = 880;
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.18, ctx.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.45);
    oscillator.connect(gain).connect(ctx.destination);
    oscillator.start();
    oscillator.stop(ctx.currentTime + 0.48);
  } catch (error) {}
}

function showSingleNativeMemberNotification(title, body, eventId, repeatIndex) {
  /* System notifications are handled by the web-push wrapper to avoid duplicates. */
  return;
}

function playMemberAlertCue(type, title, body, eventId) {
  const repeatCount = memberAlertRepeatCount(type);
  for (let index = 0; index < repeatCount; index += 1) {
    setTimeout(function() {
      playSingleMemberAlertCue(type);
      showSingleNativeMemberNotification(title, body, eventId, index + 1);
    }, index * 1700);
  }
}

function showMemberForegroundAlert(title, body, eventId, type) {
  if (!eventId) return;
  if (!memberAlertEnabled() && !memberVibrationEnabled()) return;
  try {
    if (localStorage.getItem(MEMBER_FOREGROUND_EVENT_KEY) === eventId) return;
    localStorage.setItem(MEMBER_FOREGROUND_EVENT_KEY, eventId);
  } catch (error) {}
  const box = document.getElementById('memberForegroundAlert');
  const titleElement = document.getElementById('memberForegroundAlertTitle');
  const bodyElement = document.getElementById('memberForegroundAlertBody');
  if (memberAlertEnabled() && box && titleElement && bodyElement) {
    titleElement.textContent = title;
    bodyElement.textContent = body;
    box.classList.remove('hidden');
  }
  const connectedPush = !IS_ADMIN && window.parent !== window && currentWebPushConnection();
  if (!connectedPush) {
    playMemberAlertCue(type, title, body, eventId);
  }
}

function closeMemberForegroundAlert() {

function detectMemberForegroundTransition(previousState, nextState) {
  if (IS_ADMIN || !previousState || !nextState) return;
  normalizeStateMemberProfiles(previousState);
  normalizeStateMemberProfiles(nextState);
  const member = selectedWebPushMember();
  if (!member) return;
  const before = memberLocation(previousState, member.id);
  const after = memberLocation(nextState, member.id);

  if (before.type === 'wait' && before.index === 1 &&
      after.type === 'wait' && after.index === 0) {
    showMemberForegroundAlert(
      '대기 1순위 안내',
      '대기1순위 입니다. 라켓 들고 준비해주세요.',
      'wait1_' + member.id + '_' + String(nextState.updatedAt || Date.now()),
      'wait1_ready'
    );
  }

  if (before.type === 'wait' && before.index === 0 && after.type === 'court') {
    const courtNo = Number(after.index);
    showMemberForegroundAlert(
      '코트 배정 안내',
      courtNo + '번 코트가 나왔습니다. ' + courtNo + '번코트로 이동해주세요!',
      'court_' + courtNo + '_' + member.id + '_' +
        String(nextState.updatedAt || Date.now()),
      'court_assignment'
    );
  }
}

function renderPartialPreview(
  courtA,
  courtB,
  countA,
  countB
) {
  const preview =
    document.getElementById(
      'partialPreview'
    );

  if (!preview) {
    return;
  }

  const selectedA =
    PARTIAL_SELECTED_A.size;

  const selectedB =
    PARTIAL_SELECTED_B.size;

  const nextA =
    countA - selectedA + selectedB;

  const nextB =
    countB - selectedB + selectedA;

  if (!selectedA && !selectedB) {
    preview.className =
      'partial-preview';

    preview.textContent =
      '이동하거나 교환할 인원을 선택하세요.';

    return;
  }

  const valid =
    nextA <= 4 &&
    nextB <= 4;

  preview.className =
    'partial-preview ' +
    (valid ? 'valid' : 'invalid');

  let actionText = '';

  if (selectedA && selectedB) {
    actionText =
      selectedA +
      '명 ↔ ' +
      selectedB +
      '명 교환';
  } else if (selectedA) {
    actionText =
      selectedA +
      '명을 ' +
      courtB +
      '번 코트로 이동';
  } else {
    actionText =
      selectedB +
      '명을 ' +
      courtA +
      '번 코트로 이동';
  }

  preview.textContent =
    actionText +
    ' · 적용 후 ' +
    courtA +
    '코트 ' +
    nextA +
    '명 / ' +
    courtB +
    '코트 ' +
    nextB +
    '명' +
    (
      valid
        ? ''
        : ' — 한 코트가 4명을 초과합니다.'
    );
}

function parseCourtStart(value) {
  if (!value) return null;
  const date = new Date(value);
  return isNaN(date.getTime()) ? null : date;
}

function courtElapsedSeconds(courtNo) {
  const start = parseCourtStart(
    STATE.courtStartedAt && STATE.courtStartedAt[courtNo]
  );
  if (!start) return 0;
  return Math.max(0, Math.floor((Date.now() - start.getTime()) / 1000));
}

function formatElapsed(seconds) {
  const minutes = Math.floor(seconds / 60);
  const remain = seconds % 60;
  return minutes < 1
    ? remain + '초'
    : minutes + '분 ' + String(remain).padStart(2, '0') + '초';
}

function updateCourtTimers() {
  const rankedCourts = [1, 2, 3, 4]
    .filter(function(no) {
      return STATE && STATE.courts && Array.isArray(STATE.courts[no]) &&
        STATE.courts[no].length === 4 && courtElapsedSeconds(no) > 0;
    })
    .sort(function(a, b) {
      return courtElapsedSeconds(b) - courtElapsedSeconds(a) || a - b;
    });
  const firstCourt = rankedCourts.length ? rankedCourts[0] : 0;
  const nextSummary = ensureNextCourtSummary();
  if (nextSummary) {
    nextSummary.innerHTML = firstCourt
      ? '<span class="next-court-label">⏱ 다음 종료 예상 1위</span>' +
        '<strong>' + firstCourt + '번 코트</strong>'
      : '<span class="next-court-label">⏱ 다음 종료 예상</span>' +
        '<strong>경기 중인 코트 없음</strong>';
    nextSummary.classList.toggle('no-active-court', !firstCourt);
  }

  [1, 2, 3, 4].forEach(function(no) {
    const timer = document.querySelector('[data-court-timer="' + no + '"]');
    const card = document.querySelector('.court-card.court-' + no);
    const elapsed = courtElapsedSeconds(no);
    if (timer) {
      timer.textContent = elapsed > 0 ? formatElapsed(elapsed) : '대기';
      timer.classList.toggle('fresh-running', elapsed > 300 && elapsed <= 600);
      timer.classList.toggle('warning-running', elapsed > 600 && elapsed <= 900);
      timer.classList.toggle('long-running', elapsed > 900);
    }
    if (card) card.classList.toggle('next-court-likely', no === firstCourt);
  });
}

function currentCourtEntranceSide() {
  try {
    return localStorage.getItem(COURT_ENTRANCE_SIDE_KEY) === 'left'
      ? 'left'
      : 'right';
  } catch (error) {
    return 'right';
  }
}

function courtDisplayOrder(side) {
  return side === 'left' ? [4, 3, 2, 1] : [1, 2, 3, 4];
}

function courtOrientationMapHtml(side) {
  const order = courtDisplayOrder(side);
  const entrance = '<span class="court-orientation-edge entrance">🚪 입구</span>';
  const inside = '<span class="court-orientation-edge">안쪽</span>';
  const flow = '<span class="court-orientation-flow">' +
    order.map(function(courtNo) {
      return '<b class="' + (courtNo === 4 ? 'entrance-court' : '') + '">' +
        courtNo + '번</b>';
    }).join('') +
    '</span>';
  return side === 'left'
    ? entrance + flow + inside
    : inside + flow + entrance;
}

function ensureCourtOrientationPanel() {
  const courts = document.getElementById(IS_ADMIN ? 'adminCourts' : 'memberCourts');
  if (!courts || !courts.parentNode) return null;

  let panel = document.getElementById('courtOrientationPanel');
  if (panel) return panel;

  panel = document.createElement('div');
  panel.id = 'courtOrientationPanel';
  panel.className = 'court-orientation-panel';
  panel.innerHTML =
    '<div class="court-orientation-top">' +
    '<span class="court-orientation-title">코트 위치</span>' +
    '<div class="court-orientation-buttons" role="group" aria-label="코트 배치 방향 선택">' +
    '<button type="button" data-entrance-side="left">🚪 왼쪽부터</button>' +
    '<button type="button" data-entrance-side="right">오른쪽부터 🚪</button>' +
    '</div></div>' +
    '<div class="court-orientation-map" aria-live="polite"></div>';

  courts.parentNode.insertBefore(panel, courts);
  panel.querySelectorAll('[data-entrance-side]').forEach(function(button) {
    button.addEventListener('click', function() {
      setCourtEntranceSide(button.getAttribute('data-entrance-side'));
    });
  });
  return panel;
}

function ensureNextCourtSummary() {
  const courts = document.getElementById(IS_ADMIN ? 'adminCourts' : 'memberCourts');
  if (!courts || !courts.parentNode) return null;

  let summary = document.getElementById('nextCourtSummary');
  if (summary) return summary;

  summary = document.createElement('div');
  summary.id = 'nextCourtSummary';
  summary.className = 'next-court-summary no-active-court';
  summary.setAttribute('aria-live', 'polite');
  summary.textContent = '다음 종료 예상순위: 경기 중인 코트 없음';
  courts.parentNode.insertBefore(summary, courts);
  return summary;
}

function applyCourtOrientation() {
  const side = currentCourtEntranceSide();
  const order = courtDisplayOrder(side);

  ['adminCourts', 'memberCourts'].forEach(function(containerId) {
    const container = document.getElementById(containerId);
    if (!container) return;
    container.setAttribute('data-entrance-side', side);
    order.forEach(function(courtNo) {
      const card = container.querySelector('.court-' + courtNo);
      if (card) container.appendChild(card);
    });
  });

  const panel = ensureCourtOrientationPanel();
  ensureNextCourtSummary();
  if (!panel) return;
  const map = panel.querySelector('.court-orientation-map');
  if (map) map.innerHTML = courtOrientationMapHtml(side);
  panel.querySelectorAll('[data-entrance-side]').forEach(function(button) {
    const active = button.getAttribute('data-entrance-side') === side;
    button.classList.toggle('active', active);
    button.setAttribute('aria-pressed', active ? 'true' : 'false');
  });
}

function setCourtEntranceSide(side) {
  side = side === 'left' ? 'left' : 'right';
  try {
    localStorage.setItem(COURT_ENTRANCE_SIDE_KEY, side);
  } catch (error) {}
  applyCourtOrientation();
}

          STATE.courts[courtNo] || [];

        const slots =
          ids
            .concat(
              new Array(

                  0,
                  4 - ids.length
                )
              ).fill(null)

            .slice(0, 4);

        const body =
          slots
            .map(function(id, slotIndex) {
              if (!id) {
                if (IS_ADMIN) {
                  return emptySlotCard('court', courtNo, slotIndex);
                }

                courtNo +

                id +
                '\')">' +

            .join('');

function applySmartAssignLocally(ids, preferredCourt) {
  let emptyCourts = [1, 2, 3, 4].filter(function(courtNo) {
    return (STATE.courts[courtNo] || []).length === 0;
  });

  while (emptyCourts.length) {
    const queuedIndex = STATE.waitGroups.findIndex(function(group) {
      return (group || []).length === 4;
    });

    if (queuedIndex < 0) break;

    const courtNo = emptyCourts.shift();
    const promoted = STATE.waitGroups[queuedIndex].slice();
    STATE.courts[courtNo] = promoted;
    STATE.courtStartedAt[courtNo] = new Date().toISOString();
    STATE.waitGroups.splice(queuedIndex, 1);
    STATE.waitGroups.push([]);

    promoted.forEach(function(id) {
      const member = memberById(id);
      if (member) member.status = 'playing';
    });
  }

  const targetCourt =
    emptyCourts.length === 1
      ? emptyCourts[0]
      : preferredCourt
        ? Number(preferredCourt)
        : 0;

  if (targetCourt) {
    STATE.courts[targetCourt] = ids.slice();
    STATE.courtStartedAt[targetCourt] = new Date().toISOString();
    ids.forEach(function(id) {
      const member = memberById(id);
      if (member) member.status = 'playing';
    });
    return;
  }

  let lastOccupiedWait = -1;
  STATE.waitGroups.forEach(function(group, index) {
    if ((group || []).length > 0) {
      lastOccupiedWait = index;
    }
  });

  let targetWait =
    lastOccupiedWait + 1 < STATE.waitGroups.length &&
    (STATE.waitGroups[lastOccupiedWait + 1] || []).length === 0
      ? lastOccupiedWait + 1
      : STATE.waitGroups.findIndex(function(group) {
          return (group || []).length === 0;
        });

  if (targetWait >= 0) {
    STATE.waitGroups[targetWait] = ids.slice();
    ids.forEach(function(id) {
      const member = memberById(id);
      if (member) member.status = 'waiting';
    });
  }
}

function isAllowedDoublesTeam(members) {
  if (members.length !== 4) return false;

  const maleCount =
    members.filter(function(member) {
      return member.gender === 'male';
    }).length;
  const femaleCount = members.length - maleCount;

  return (
    maleCount === 4 ||
    femaleCount === 4 ||
    (maleCount === 2 && femaleCount === 2)
  );
}

function autoPickDoublesIds() {
  const active = STATE.members
    .filter(function(member) {
      return member.status === 'active';
    })
    .sort(function(a, b) {
      const gameDifference =
        (Number(a.games) || 0) -
        (Number(b.games) || 0);

      if (gameDifference) return gameDifference;

      const createdDifference =
        String(a.createdAt || '')
          .localeCompare(String(b.createdAt || ''));

      if (createdDifference) return createdDifference;

      return String(a.name || '').localeCompare(
        String(b.name || ''),
        'ko-KR'
      );
    });

  const order = {};
  active.forEach(function(member, index) {
    order[member.id] = index;
  });

  const men = active.filter(function(member) {
    return member.gender === 'male';
  });
  const women = active.filter(function(member) {
    return member.gender === 'female';
  });
  const candidates = [];

  if (men.length >= 4) {
    candidates.push(men.slice(0, 4));
  }
  if (women.length >= 4) {
    candidates.push(women.slice(0, 4));
  }
  if (men.length >= 2 && women.length >= 2) {
    candidates.push(
      men.slice(0, 2).concat(women.slice(0, 2))
    );
  }

  candidates.sort(function(a, b) {
    function score(group) {
      const games = group.map(function(member) {
        return Number(member.games) || 0;
      });

      return [
        games.reduce(function(sum, game) {
          return sum + game;
        }, 0),
        Math.max.apply(null, games),
        group.reduce(function(sum, member) {
          return sum + order[member.id];
        }, 0)
      ];
    }

    const scoreA = score(a);
    const scoreB = score(b);

    for (let index = 0; index < scoreA.length; index++) {
      if (scoreA[index] !== scoreB[index]) {
        return scoreA[index] - scoreB[index];
      }
    }

    return 0;
  });

  return candidates.length
    ? candidates[0].map(function(member) {
        return member.id;
      })
    : [];
}

function sortedActiveMembersForAutoFill() {
  return STATE.members
    .filter(function(member) {
      return member.status === 'active';
    })
    .sort(function(a, b) {
      const gameDifference =
        (Number(a.games) || 0) -
        (Number(b.games) || 0);

      if (gameDifference) return gameDifference;

      const createdDifference =
        String(a.createdAt || '')
          .localeCompare(String(b.createdAt || ''));

      if (createdDifference) return createdDifference;

      return String(a.name || '').localeCompare(
        String(b.name || ''),
        'ko-KR'
      );
    });
}

function autoPickCourtFillIds(existingMembers) {
  const needed = 4 - existingMembers.length;
  if (needed <= 0) return [];

  const active = sortedActiveMembersForAutoFill();
  const men = active.filter(function(member) {
    return member.gender === 'male';
  });
  const women = active.filter(function(member) {
    return member.gender === 'female';
  });
  const existingMale =
    existingMembers.filter(function(member) {
      return member.gender === 'male';
    }).length;
  const existingFemale =
    existingMembers.length - existingMale;
  const candidates = [];

  [4, 0, 2].forEach(function(finalMale) {
    const finalFemale = 4 - finalMale;
    const needMale = finalMale - existingMale;
    const needFemale = finalFemale - existingFemale;

    if (
      needMale < 0 ||
      needFemale < 0 ||
      needMale + needFemale !== needed ||
      men.length < needMale ||
      women.length < needFemale
    ) {
      return;
    }

    candidates.push(
      men.slice(0, needMale)
        .concat(women.slice(0, needFemale))
    );
  });

  candidates.sort(function(a, b) {
    function score(group) {
      const games = group.map(function(member) {
        return Number(member.games) || 0;
      });

      return [
        games.reduce(function(sum, game) {
          return sum + game;
        }, 0),
        games.length
          ? Math.max.apply(null, games)
          : 0
      ];
    }

    const scoreA = score(a);
    const scoreB = score(b);

    return (
      scoreA[0] - scoreB[0] ||
      scoreA[1] - scoreB[1]
    );
  });

  return candidates.length
    ? candidates[0].map(function(member) {
        return member.id;
      })
    : [];
}

async function smartAssignSelected() {
  if (!AUTO_ASSIGN_TARGET) {
    alert('먼저 코트 또는 대기조의 비어 있는 자리를 한 번 누르세요.');
    return;
  }

  const targetType = AUTO_ASSIGN_TARGET.type;
  const targetIndex = AUTO_ASSIGN_TARGET.index;
  const targetLabel =
    targetType === 'court'
      ? COURT_LABELS[targetIndex]
      : '대기' + (targetIndex + 1);
  const existingIds =
    targetType === 'court'
      ? (STATE.courts[targetIndex] || []).slice()
      : (STATE.waitGroups[targetIndex] || []).slice();
  const existingMembers =
    existingIds.map(memberById).filter(Boolean);
  const needed = 4 - existingIds.length;

  if (needed <= 0) {
    AUTO_ASSIGN_TARGET = null;
    alert(targetLabel + '에는 빈자리가 없습니다.');
    return;
  }

  const ids =
    SELECTED.size
      ? Array.from(SELECTED)
      : autoPickCourtFillIds(existingMembers);

  if (SELECTED.size && ids.length !== needed) {
    alert(
      targetLabel + '의 빈자리는 ' + needed + '자리입니다.\n' +
      needed + '명을 선택하거나 선택을 모두 해제하고 자동배정하세요.'
    );
    return;
  }

  if (ids.length !== needed) {
    alert(
      '현재 인원과 남복·여복·혼복을 만들 수 있는 ' +
      '코트배정 대기 인원이 부족합니다.'
    );
    return;
  }

  const finalMembers =
    existingMembers.concat(
      ids.map(memberById).filter(Boolean)
    );

  if (!isAllowedDoublesTeam(finalMembers)) {
    alert(
      '선택한 인원으로는 남복·여복·혼복을 만들 수 없습니다.'
    );
    return;
  }

  const previousState =
    JSON.parse(JSON.stringify(STATE));

  applyBatchAssignLocally(
    ids,
    targetType,
    targetIndex
  );
  SELECTED.clear();
  AUTO_ASSIGN_TARGET = null;
  renderState();

  try {
    const method =
      targetType === 'court'
        ? 'autoFillCourt'
        : 'autoFillWaitGroup';
    const savedState = await server(method, [
      ADMIN_PIN_VALUE,
      targetIndex,
      ids
    ]);
    renderState(savedState);
    setUndoState(previousState);
  } catch (error) {
    STATE = previousState;
    AUTO_ASSIGN_TARGET = {
      type: targetType,
      index: targetIndex,
      slotIndex: 0
    };
    renderState();
    alert(error.message || error);
  }
}

async function runAction(name, args) {
  const previousState =
    JSON.parse(JSON.stringify(STATE));

  try {
    const state =
      await server(name, args);

    SELECTED.clear();

    /* 멤버 등록은 전체 코트 상태를 다시 만들지 않고 새 카드만 합친다. */
    if (name === 'addMember' && state && state.member) {
      const member = normalizeMemberProfile(state.member);
      const existingIndex = STATE.members.findIndex(function(item) {
        return String(item.id) === String(member.id);
      });
      if (existingIndex >= 0) STATE.members[existingIndex] = member;
      else STATE.members.push(member);
      STATE.updatedAt = state.updatedAt || new Date().toISOString();
      if (state.maxMembers) STATE.maxMembers = state.maxMembers;
      renderActive();
      renderQuickRoster();
      renderStats();
      renderSelectionCount();
      renderQuickMoveBar();
      const count = document.getElementById('memberCount');
      if (count) {
        count.textContent = STATE.members.length + '/' + (STATE.maxMembers || 500) + '명';
      }
    } else {
      renderState(state);
    }
    setUndoState(previousState);

  } catch (error) {
    alert(error.message || error);
  }
}

function setUndoState(state) {
  LAST_UNDO_STATE = state;

async function undoLastAction() {
  if (!LAST_UNDO_STATE) {

  }

  const restoreState =
    JSON.parse(JSON.stringify(LAST_UNDO_STATE));
  const currentState =
    JSON.parse(JSON.stringify(STATE));

  LAST_UNDO_STATE = null;
  ['undoButton','mobileUndoButton'].forEach(function(id) {
    const button = document.getElementById(id);

  } catch (error) {
    renderState(currentState);
    alert(error.message || error);
  }
}

  try {
    const params = new URLSearchParams(window.location.search || '');
    const transferredSession = String(params.get('memberSession') || currentMemberSessionToken() || '');
    if (transferredSession) {
      const resumed = await server('resumeMemberSession', [transferredSession]);
      if (resumed && resumed.ok) {
        localStorage.setItem(MEMBER_AUTH_KEY, String(resumed.version));
        storeMemberSessionToken(transferredSession);
        if (loading) loading.classList.add('hidden');
        if (login) login.classList.add('hidden');
        if (app) app.classList.remove('hidden');
        await loadState();
        postUnifiedMemberMessage('JAYUMINTON_MEMBER_AUTH_READY', {
          version: String(resumed.version),
          sessionToken: transferredSession
        });
        syncUnifiedMemberBridge();
        try {
          if (params.has('memberSession')) {
            params.delete('memberSession');
            const clean = window.location.pathname + (params.toString() ? '?' + params.toString() : '') + window.location.hash;
            window.history.replaceState({}, document.title, clean);
          }
        } catch (cleanError) {}
        return;
      }
      storeMemberSessionToken('');
    }

    const version = String(await server('getMemberPasswordVersion', []));
    const saved = localStorage.getItem(MEMBER_AUTH_KEY);
    if (saved === version) {
      if (loading) loading.classList.add('hidden');
      if (login) login.classList.add('hidden');
      if (app) app.classList.remove('hidden');
      await loadState();
      postUnifiedMemberMessage('JAYUMINTON_MEMBER_AUTH_READY', {
        version: version,
        sessionToken: currentMemberSessionToken()
      });
      syncUnifiedMemberBridge();
      return;
    }
  } catch (error) {
    console.error(error);
  }

  if (loading) loading.classList.add('hidden');
  if (app) app.classList.add('hidden');
  if (login) login.classList.remove('hidden');
}

async function addMember() {
  if (ADD_MEMBER_IN_FLIGHT) return;

  const nameInput = document.getElementById('newName');
  const genderInput = document.getElementById('newGender');
  const gradeInput = document.getElementById('newGrade');
  const experienceInput = document.getElementById('newExperience');
  const button = document.getElementById('addMemberButton');

  const name = nameInput.value.trim();
  const gender = genderInput.value;
  const grade = gradeInput.value.trim();
  const experience = experienceInput.value.trim();

  if (!name) {
    alert('이름 또는 닉네임을 입력하세요.');
    nameInput.focus();
    return;
  }
  if (!gender) {
    alert('성별을 선택하세요.');
    genderInput.focus();
    return;
  }

  ADD_MEMBER_IN_FLIGHT = true;
  if (button) {
    button.disabled = true;
    button.textContent = '저장 중…';
  }

  /* 서버 전체 상태를 다시 받을 때까지 기다리지 않고 카드 한 장만 즉시 추가한다. */
  const temporaryId = 'saving_' + Date.now();
  const temporaryMember = {
    id: temporaryId,
    name: name,
    gender: gender,
    games: 0,
    status: 'active',
    grade: grade,
    experience: experience,
    createdAt: new Date().toISOString()
  };
  STATE.members.push(temporaryMember);
  renderActive();
  renderQuickRoster();
  renderStats();
  const count = document.getElementById('memberCount');
  if (count) {
    count.textContent = STATE.members.length + '/' + (STATE.maxMembers || 500) + '명';
  }

  try {
    const result = await new Promise(function(resolve, reject) {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
        .addMember(
          ADMIN_PIN_VALUE,
          name,
          gender,
          grade,
          experience
        );
    });

    const index = STATE.members.findIndex(function(member) {
      return member.id === temporaryId;
    });
    if (index >= 0 && result && result.member) {
      STATE.members[index] = result.member;
    }
    if (result && result.updatedAt) {
      STATE.updatedAt = result.updatedAt;
    }

    nameInput.value = '';
    genderInput.value = '';
    gradeInput.value = '';
    experienceInput.value = '';

    renderActive();
    renderQuickRoster();
    renderStats();
  } catch (error) {
    STATE.members = STATE.members.filter(function(member) {
      return member.id !== temporaryId;
    });
    renderActive();
    renderQuickRoster();
    renderStats();
    alert(error.message || error);
  } finally {
    ADD_MEMBER_IN_FLIGHT = false;
    if (button) {
      button.disabled = false;
      button.textContent = '등록';
    }
    const finalCount = document.getElementById('memberCount');
    if (finalCount) {
      finalCount.textContent = STATE.members.length + '/' + (STATE.maxMembers || 500) + '명';
    }
  }
}
