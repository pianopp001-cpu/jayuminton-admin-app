    <div id="memberSelfPanel" class="member-self-panel">
      <div class="member-self-search-row">
        <input id="memberSelfSearchInput" type="search" autocomplete="off" placeholder="내 이름 검색" oninput="renderMemberSelfMatches()" onkeydown="handleMemberSelfSearchKey(event)">

        <button id="memberVibrationToggle" type="button" onclick="toggleMemberVibrationSetting()" aria-label="진동 켜기 또는 끄기">진동 ON</button>
        <button id="memberAppInstallToggle" type="button" onclick="requestMemberAppInstall()" aria-label="사용자용 앱 설치">앱설치</button>
        <button id="memberSelfDone" type="button" class="primary" onclick="compactMemberSelfSettings()">완료</button>
      </div>
    </div>
    <div id="memberUnifiedSettingMessage" class="member-unified-setting-message" role="status" aria-live="polite"></div>
  </section>

  <section class="card section queue-panel">

    <div id="activeMembersMember" class="roster"></div>
  </section>
  <section class="section member-courts-section"><div id="memberCourts" class="grid"></div></section>
  <section class="section member-wait-section">
    <div class="sub">나와 바꿀 사람을 각각 한 번 선택하면 자리교환 요청 · 선택한 카드를 다시 누르면 선택취소 · 빈자리는 두 번 터치하면 이동</div>
