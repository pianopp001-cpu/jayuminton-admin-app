plugins {
    id 'com.android.application'
}

def escapeBuildConfig = { String value ->
    return (value ?: '')
            .replace('\\', '\\\\')
            .replace('"', '\\"')
}

def configuredPushFunctionUrl = System.getenv('JAYUMINTON_PUSH_FUNCTION_URL')
def pushFunctionUrl = escapeBuildConfig(
        configuredPushFunctionUrl ?: 'https://asia-northeast3-jayuminton-push.cloudfunctions.net/publishAssignment'
)
def pushSharedSecret = escapeBuildConfig(System.getenv('JAYUMINTON_PUSH_SHARED_SECRET'))

android {
    namespace 'com.jayuminton.admin'
    compileSdk 35

    defaultConfig {
        applicationId 'com.jayuminton.admin'
        minSdk 24
        targetSdk 34
        versionCode 19
        versionName '1.5'

        buildConfigField 'String', 'PUSH_FUNCTION_URL', '"' + pushFunctionUrl + '"'
        buildConfigField 'String', 'PUSH_SHARED_SECRET', '"' + pushSharedSecret + '"'
    }

    signingConfigs {
        release {
            storeFile file('../signing/jayuminton-release.jks')
            storePassword 'JayuMinton14!'
            keyAlias 'jayuminton'
            keyPassword 'JayuMinton14!'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
