<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2457d6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="자유민턴">
  <title>자유민턴 코트배정 현황</title>
  <link id="manifestLink" rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" href="/icon-dog.png">
  <link rel="apple-touch-icon" href="/icon-dog.png">
  <style>
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f4f7fb}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f7fb}
    body{min-height:100dvh}
    #memberFrame{display:block;width:100%;height:100dvh;border:0;background:#f4f7fb}
    .hidden{display:none!important}
    .loader{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:#f4f7fb;color:#2457d6;font-weight:900}
    .loader span{display:inline-flex;align-items:center;gap:10px;padding:14px 18px;border-radius:14px;background:#fff;box-shadow:0 12px 36px rgba(20,36,70,.12)}
    .spinner{width:18px;height:18px;border:3px solid #dbe5ff;border-top-color:#2457d6;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .toast{position:fixed;z-index:90;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(92vw,520px);padding:13px 15px;border-radius:13px;background:#172b4d;color:#fff;font-size:14px;font-weight:800;line-height:1.45;box-shadow:0 14px 42px rgba(0,0,0,.26);text-align:center}
    .toast.success{background:#12632e}.toast.error{background:#a11c1c}.toast.action{cursor:pointer}
    .sheet-backdrop{position:fixed;z-index:100;inset:0;background:rgba(10,18,32,.48);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
    .sheet{width:min(100%,540px);max-height:min(86dvh,760px);overflow:auto;background:#fff;border-radius:22px;padding:22px;box-shadow:0 24px 90px rgba(0,0,0,.34)}
    .sheet h2{margin:0 0 10px;font-size:22px}.sheet p{margin:8px 0;line-height:1.55}.sheet .member{margin:14px 0;padding:12px;border-radius:12px;background:#eef5ff;font-weight:900;text-align:center;font-size:18px}
    .sheet .steps{margin:12px 0;padding:0;list-style:none;counter-reset:steps}.sheet .steps li{position:relative;margin:10px 0;padding:11px 12px 11px 46px;border-radius:12px;background:#f5f7fb;line-height:1.45}.sheet .steps li:before{counter-increment:steps;content:counter(steps);position:absolute;left:12px;top:10px;width:25px;height:25px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#2457d6;color:#fff;font-weight:900}
    .sheet button{width:100%;min-height:50px;border:0;border-radius:12px;padding:12px 15px;font-size:16px;font-weight:900;cursor:pointer}.primary{background:#2457d6;color:#fff}.secondary{margin-top:9px;background:#eef1f7;color:#263247}.danger{margin-top:9px;background:#fff0f0;color:#a11c1c}.small{font-size:13px;color:#5c6678}
    .browser-escape{position:fixed;z-index:120;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(92vw,460px);padding:10px;border-radius:14px;background:#fff;box-shadow:0 16px 50px rgba(0,0,0,.26)}
    .browser-escape button{width:100%;min-height:48px;border:0;border-radius:11px;background:#2457d6;color:#fff;font-weight:900;font-size:15px}
  </style>
</head>
<body>
  <iframe id="memberFrame" title="자유민턴 코트배정 현황" allow="autoplay; clipboard-write"></iframe>

  <div id="loader" class="loader"><span><i class="spinner"></i>코트 현황을 연결하는 중입니다…</span></div>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <div id="setupBackdrop" class="sheet-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="setupTitle">
    <section class="sheet">
      <h2 id="setupTitle">개인 배정 알림</h2>
      <div id="setupMember" class="member">이름 확인 중…</div>
      <div id="setupContent"></div>
      <button id="setupPrimary" class="primary" type="button">알림 허용</button>
      <button id="setupSecondary" class="secondary" type="button">닫기</button>
      <button id="disableButton" class="danger hidden" type="button">이 휴대폰 알림 해제</button>
    </section>
  </div>

  <div id="browserEscape" class="browser-escape hidden">
    <button id="browserEscapeButton" type="button">Chrome에서 알림 화면 계속하기</button>
  </div>

  <iframe id="submitFrame" name="submitFrame" hidden></iframe>
  <form id="relayForm" method="post" target="submitFrame" hidden>
    <input id="relayPayload" name="payload" type="hidden">
  </form>

  <script src="/config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-messaging-compat.js"></script>
  <script src="/app.js"></script>
</body>
</html>
