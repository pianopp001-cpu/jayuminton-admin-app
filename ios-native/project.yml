name: JayumintonIOS
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
targets:
  JayumintonIOS:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Jayuminton
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jayuminton.user
        PRODUCT_NAME: 자유민턴
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Jayuminton/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
    scheme:
      gatherCoverageData: false
