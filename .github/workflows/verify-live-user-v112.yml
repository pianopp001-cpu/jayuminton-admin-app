name: Verify live user v1.1.2 deployment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-live-user-v112.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global @google/clasp@latest
      - name: Verify pulled live source
        shell: bash
        run: |
          set -euo pipefail
          CONFIG="$RUNNER_TEMP/deploy.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$CONFIG"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          MAIN_SCRIPT_ID="$(jq -r '.mainScriptId' "$CONFIG")"
          WORK="$RUNNER_TEMP/live"
          mkdir -p "$WORK"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$MAIN_SCRIPT_ID" > "$WORK/.clasp.json"
          cd "$WORK"
          clasp pull
          test "$(cat check.js)" = '// Intentionally empty server-side placeholder.'
          grep -F 'jayuminton-courtstatus-v1.1.2-fresh-install.apk' Script.html >/dev/null
          grep -F 'function handleMemberSelfCardTap' Script.html >/dev/null
          grep -F 'member-new-badge' Script.html >/dev/null
          grep -F 'handleMemberSelfSearchInput()' Index.html >/dev/null
          grep -F '/* NEW member badge */' Style.html >/dev/null
          node --check Code.js
          printf 'status=success\nversion=1.1.2\nlive_apk_link=yes\nuser_full_names=yes\nnew_badge=yes\ndouble_tap=yes\nmanual_search=yes\nverified_at=%s\n' "$(date -u +%FT%TZ)" > "$GITHUB_WORKSPACE/deployment/status/user-v112-live.txt"
          cd "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment/status/user-v112-live.txt
          git commit -m 'Verify live user v1.1.2 deployment'
          git pull --rebase origin main
          git push origin main
