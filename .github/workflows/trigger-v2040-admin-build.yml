name: Trigger v2040 admin APK build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-v2040-admin-build.yml'
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch verified admin APK workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-v2015-known-good-shell.yml --repo "$GITHUB_REPOSITORY" --ref main

