name: Apply member seat UX v2

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-member-seat-ux-v2.yml

permissions:
  contents: write

concurrency:
  group: jayuminton-member-seat-ux-v2
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: member-seat-ux-v2
          fetch-depth: 0

      - name: Patch only member seat UX
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          sp=Path('source-snapshot/current-main/Script.html')
          ip=Path('source-snapshot/current-main/Index.html')
          s=sp.read_text(encoding='utf-8')
          i=ip.read_text(encoding='utf-8')

          old_other="""function handleMemberWaitOtherTap(groupIndex,targetMemberId,event){
            if(IS_ADMIN)return;
            if(event){event.preventDefault();event.stopPropagation();}
            const a=memberWaitSeatSessionArgs(); if(!a)return;
            if(String(targetMemberId)===String(a.member.id))return;
            if(MEMBER_WAIT_SEAT_PICK&&MEMBER_WAIT_SEAT_PICK.type==='self'){clearMemberWaitSeatPick();memberRequestWaitSwap(targetMemberId);return;}
            MEMBER_WAIT_SEAT_PICK={type:'other',groupIndex:Number(groupIndex),memberId:String(targetMemberId)};
            showMemberSettingMessage('내 자리를 터치하면 교환 요청을 보냅니다.');
          }"""
          new_other="""function handleMemberWaitOtherTap(groupIndex,targetMemberId,event){
            if(IS_ADMIN)return;
            if(event){event.preventDefault();event.stopPropagation();}
            const target=(STATE.members||[]).find(function(item){return item&&String(item.id)===String(targetMemberId);});
            if(!target)return;
            const selected=currentStoredWebPushMember();
            if(!selected||!selected.id){
              if(confirm(String(target.name||'선택한 회원')+'님이 본인인가요?')){
                selectMemberSelf(target.id);
                showMemberSettingMessage(String(target.name||'')+'님으로 설정했어요.');
              }
              return;
            }
            const a=memberWaitSeatSessionArgs(); if(!a)return;
            if(String(targetMemberId)===String(a.member.id))return;
            if(MEMBER_WAIT_SEAT_PICK&&MEMBER_WAIT_SEAT_PICK.type==='self'){
              MEMBER_WAIT_SEAT_PICK={type:'other',groupIndex:Number(groupIndex),memberId:String(targetMemberId),fromSelf:true};
              renderWaitGroups();
              setTimeout(function(){
                const ok=confirm(String(target.name||'선택한 회원')+'님과 자리를 바꿀까요?');
                if(ok){memberRequestWaitSwap(targetMemberId);return;}
                MEMBER_WAIT_SEAT_PICK={type:'self',groupIndex:Number(groupIndex)};
                renderWaitGroups();
              },0);
              return;
            }
            MEMBER_WAIT_SEAT_PICK={type:'other',groupIndex:Number(groupIndex),memberId:String(targetMemberId)};
            renderWaitGroups();
            showMemberSettingMessage('내 자리를 선택하면 '+String(target.name||'상대')+'님과 자리 바꾸기를 요청할 수 있어요.');
          }"""
          if old_other not in s: raise SystemExit('unsafe: other tap block changed')
          s=s.replace(old_other,new_other,1)

          old_self="""function handleMemberWaitSelfTap(groupIndex,memberId,event){
            if(IS_ADMIN||String(memberId)!==storedSelfMemberId())return;
            if(event){event.preventDefault();event.stopPropagation();}
            const now=Date.now(),dbl=MEMBER_WAIT_SELF_TAP.memberId===String(memberId)&&now-MEMBER_WAIT_SELF_TAP.tappedAt<=420;
            if(MEMBER_WAIT_SELF_TAP.timer)clearTimeout(MEMBER_WAIT_SELF_TAP.timer);
            MEMBER_WAIT_SELF_TAP={memberId:String(memberId),tappedAt:now,timer:null};
            if(dbl){MEMBER_WAIT_SELF_TAP={memberId:'',tappedAt:0,timer:null};memberLeaveWaitGroup();return;}
            MEMBER_WAIT_SELF_TAP.timer=setTimeout(function(){
              MEMBER_WAIT_SELF_TAP.timer=null;
              if(MEMBER_WAIT_SEAT_PICK&&MEMBER_WAIT_SEAT_PICK.type==='empty'){const g=MEMBER_WAIT_SEAT_PICK.groupIndex;clearMemberWaitSeatPick();memberMoveToWaitGroup(g);return;}
              if(MEMBER_WAIT_SEAT_PICK&&MEMBER_WAIT_SEAT_PICK.type==='other'){const target=MEMBER_WAIT_SEAT_PICK.memberId;clearMemberWaitSeatPick();memberRequestWaitSwap(target);return;}
              MEMBER_WAIT_SEAT_PICK={type:'self',groupIndex:Number(groupIndex)};
            },430);
          }"""
          new_self="""function handleMemberWaitSelfTap(groupIndex,memberId,event){
            if(IS_ADMIN||String(memberId)!==storedSelfMemberId())return;
            if(event){event.preventDefault();event.stopPropagation();}
            const now=Date.now(),dbl=MEMBER_WAIT_SELF_TAP.memberId===String(memberId)&&now-MEMBER_WAIT_SELF_TAP.tappedAt<=420;
            MEMBER_WAIT_SELF_TAP={memberId:String(memberId),tappedAt:now,timer:null};
            if(dbl){MEMBER_WAIT_SELF_TAP={memberId:'',tappedAt:0,timer:null};memberLeaveWaitGroup();return;}
            if(MEMBER_WAIT_SEAT_PICK&&MEMBER_WAIT_SEAT_PICK.type==='empty'){const g=MEMBER_WAIT_SEAT_PICK.groupIndex;clearMemberWaitSeatPick();memberMoveToWaitGroup(g);return;}
            if(MEMBER_WAIT_SEAT_PICK&&MEMBER_WAIT_SEAT_PICK.type==='other'){
              const targetId=MEMBER_WAIT_SEAT_PICK.memberId;
              const target=(STATE.members||[]).find(function(item){return item&&String(item.id)===String(targetId);});
              MEMBER_WAIT_SEAT_PICK={type:'self',groupIndex:Number(groupIndex)};
              renderWaitGroups();
              setTimeout(function(){
                if(confirm(String(target&&target.name||'선택한 회원')+'님과 자리를 바꿀까요?'))memberRequestWaitSwap(targetId);
              },0);
              return;
            }
            MEMBER_WAIT_SEAT_PICK={type:'self',groupIndex:Number(groupIndex)};
            renderWaitGroups();
            showMemberSettingMessage('바꾸고 싶은 사람을 선택하세요.');
          }"""
          if old_self not in s: raise SystemExit('unsafe: self tap block changed')
          s=s.replace(old_self,new_self,1)

          old_self_card="""return '<div class=\"person member-info-card ' + genderClass(member) + ' is-self-member\" data-member-id=\"' + member.id + '\" onclick=\"handleMemberWaitSelfTap(' + groupIndex + ',\\'' + member.id + '\\',event)\">' + '<span class=\"member-self-star\" aria-label=\"내 이름\">나</span><span class=\"name\">' + escapeMemberInfo(member.name) + '</span>' + memberInfoDetailHtml(member) + '</div>';"""
          new_self_card="""return '<div class=\"person member-info-card ' + genderClass(member) + ' is-self-member' + (MEMBER_WAIT_SEAT_PICK&&MEMBER_WAIT_SEAT_PICK.type==='self'?' selected':'') + '\" data-member-id=\"' + member.id + '\" onclick=\"handleMemberWaitSelfTap(' + groupIndex + ',\\'' + member.id + '\\',event)\">' + '<span class=\"member-self-star\" aria-label=\"내 이름\">나</span><span class=\"name\">' + escapeMemberInfo(member.name) + '</span>' + memberInfoDetailHtml(member) + '</div>';"""
          if old_self_card not in s: raise SystemExit('unsafe: self card anchor changed')
          s=s.replace(old_self_card,new_self_card,1)

          old_other_card="""return '<div class=\"person member-info-card ' + genderClass(member) + '\" data-member-id=\"' + member.id + '\" onclick=\"handleMemberWaitOtherTap(' + groupIndex + ',\\'' + member.id + '\\',event)\">' + '<span class=\"name\">' + escapeMemberInfo(member.name) + '</span>' + memberInfoDetailHtml(member) + '</div>';"""
          new_other_card="""return '<div class=\"person member-info-card ' + genderClass(member) + (MEMBER_WAIT_SEAT_PICK&&MEMBER_WAIT_SEAT_PICK.type==='other'&&String(MEMBER_WAIT_SEAT_PICK.memberId)===String(member.id)?' selected':'') + '\" data-member-id=\"' + member.id + '\" onclick=\"handleMemberWaitOtherTap(' + groupIndex + ',\\'' + member.id + '\\',event)\">' + '<span class=\"name\">' + escapeMemberInfo(member.name) + '</span>' + memberInfoDetailHtml(member) + '</div>';"""
          if old_other_card not in s: raise SystemExit('unsafe: other card anchor changed')
          s=s.replace(old_other_card,new_other_card,1)

          replacements={
            '이름 입력 또는 내 카드 두 번 터치로 자신을 설정해주세요.':'대기자에서 내 카드를 한 번 터치하면 바로 본인 설정할 수 있어요.',
            '빈자리 두 번 터치로 자리잡기 · 내 자리와 상대 자리를 차례로 터치하면 교환요청':'빈자리 선택 → 자리잡기 · 내 자리 선택 → 바꿀 사람 선택'
          }
          for old,new in replacements.items():
            if old not in i: raise SystemExit('unsafe: Index 안내문 anchor missing: '+old)
            i=i.replace(old,new,1)

          sp.write_text(s,encoding='utf-8')
          ip.write_text(i,encoding='utf-8')
          PY

      - name: Guard exact scope and syntax
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "님이 본인인가요?" source-snapshot/current-main/Script.html
          grep -Fq "님과 자리를 바꿀까요?" source-snapshot/current-main/Script.html
          grep -Fq "바꾸고 싶은 사람을 선택하세요." source-snapshot/current-main/Script.html
          grep -Fq "?' selected':''" source-snapshot/current-main/Script.html
          grep -Fq "대기자에서 내 카드를 한 번 터치하면 바로 본인 설정할 수 있어요." source-snapshot/current-main/Index.html
          grep -Fq "빈자리 선택 → 자리잡기 · 내 자리 선택 → 바꿀 사람 선택" source-snapshot/current-main/Index.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path('source-snapshot/current-main/Script.html').read_text(encoding='utf-8')
          a=s.find('<script>'); b=s.rfind('</script>')
          assert a>=0 and b>a
          Path('/tmp/member-seat-ux-v2.js').write_text(s[a+8:b],encoding='utf-8')
          PY
          node --check /tmp/member-seat-ux-v2.js
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected=$'source-snapshot/current-main/Index.html\nsource-snapshot/current-main/Script.html'
          test "$changed" = "$expected"

      - name: Commit only to UX branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source-snapshot/current-main/Index.html source-snapshot/current-main/Script.html
          git commit -m 'feat: simplify member self select and seat swap UX'
          git push origin HEAD:member-seat-ux-v2
