name: Build current admin APK clean

on:
  workflow_dispatch: {}
  pull_request:
    branches: [main]
    paths:
      - 'deployment/jayuminton/current_admin_build.trigger'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-current-admin.yml'
      - 'deployment/jayuminton/current_admin_build.trigger'
      - 'deployment/jayuminton/admin_card_interaction_v2042.js'
      - 'deployment/jayuminton/admin_team_layout_v2038.js'
      - 'deployment/jayuminton/admin_team_layout_v2064.test.mjs'
      - 'deployment/jayuminton/admin_multiaction_v2054_hotfix.js'
      - 'deployment/jayuminton/cloudflare_v6_frontend_bridge.js'
      - 'deployment/jayuminton/patch_bridge_admin_multiselect_v2048.py'
      - 'deployment/jayuminton/inject_cloudflare_v6_frontend_bridge.py'
      - 'deployment/jayuminton/force_cloudflare_admin_login_v2050.py'
      - 'deployment/jayuminton/admin_native_audio_v2021_patch.py'
      - 'deployment/jayuminton/admin_native_vibration_v2023_patch.py'
      - 'cloudflare/state-worker/worker.js'
      - 'cloudflare/state-worker/temp-pairs.test.mjs'

permissions:
  contents: write

concurrency:
  group: jayuminton-current-admin-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Repair and verify current worker temp-team contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cloudflare/state-worker/worker.js')
          s=p.read_text(encoding='utf-8')
          bad="try { const state = await readState(env.DB); await verifyAdminSession(request, env, state); return reply({ ok: true, state: adminState(state) });\n      catch (error)"
          good="try { const state = await readState(env.DB); await verifyAdminSession(request, env, state); return reply({ ok: true, state: adminState(state) }); }\n      catch (error)"
          if bad in s:
              s=s.replace(bad,good,1)
              p.write_text(s,encoding='utf-8')
          PY
          node --check cloudflare/state-worker/worker.js
          node cloudflare/state-worker/temp-pairs.test.mjs
          grep -F "getCurrentMemberPassword" cloudflare/state-worker/worker.js >/dev/null
          grep -F "setTempPairs" cloudflare/state-worker/worker.js >/dev/null
          grep -F "sendMemberMessage" cloudflare/state-worker/worker.js >/dev/null
      - name: Restore proven shell
        shell: bash
        run: |
          set -euo pipefail
          PROVEN_COMMIT=20823018b13bba64082b09b76db617680a9d16b5
          rm -rf app
          git archive "$PROVEN_COMMIT" app | tar -x
          mkdir -p app/src/main/assets/admin
          unzip -p releases/jayuminton-admin-v200.8-webview-js-fixed.apk assets/admin/index.html > app/src/main/assets/admin/index.html
          test -s app/src/main/assets/admin/index.html
      - name: Inject current Cloudflare admin
        shell: bash
        run: |
          set -euo pipefail
          HTML=app/src/main/assets/admin/index.html
          python3 deployment/jayuminton/patch_bridge_admin_multiselect_v2048.py
          python3 deployment/jayuminton/inject_cloudflare_v6_frontend_bridge.py "$HTML"
          node deployment/jayuminton/admin_team_layout_v2064.test.mjs
          python3 deployment/jayuminton/admin_native_audio_v2021_patch.py
          python3 deployment/jayuminton/admin_native_vibration_v2023_patch.py
          python3 deployment/jayuminton/force_cloudflare_admin_login_v2050.py
          grep -F '__JAYUMINTON_ADMIN_MULTI_ACTION_V2053__' "$HTML" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_MESSAGE_ANYWHERE_V2056__' "$HTML" >/dev/null
          grep -F 'jayuminton-admin-multi-action-v2053-style' "$HTML" >/dev/null
          grep -F '녹색 = 이동선택' "$HTML" >/dev/null
          grep -F '이동/교환, 코트배정 대기 또는 팀설정을 선택하세요.' "$HTML" >/dev/null
          grep -F '1명·3명·4명은 자동으로 이동/교환입니다.' "$HTML" >/dev/null
          grep -F '이동/교환' "$HTML" >/dev/null
          grep -F '팀설정' "$HTML" >/dev/null
          grep -F 'class="jm-do-active">코트배정 대기</button>' "$HTML" >/dev/null
          grep -F "rpc('setMemberStatus',[null,ids,'active'])" "$HTML" >/dev/null
          grep -F '메시지 보내기' "$HTML" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_SELECTION_SCOPE_V2057__' "$HTML" >/dev/null
          grep -F '__JAYUMINTON_RESET_MULTI_SELECTION_V2057__' "$HTML" >/dev/null
          grep -F 'id="quickClearSelectionButton"' "$HTML" >/dev/null
          grep -F 'class="jm-quick-member-actions"' "$HTML" >/dev/null
          grep -F '#adminApp #quickMoveBar.quick-move-bar{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr))!important' "$HTML" >/dev/null
          grep -F 'overflow-x:hidden!important' "$HTML" >/dev/null
          grep -F 'onclick="startMemberEdit()">편집</button>' "$HTML" >/dev/null
          grep -F 'id="cancelMemberEditButton"' "$HTML" >/dev/null
          grep -F 'closeQuickMemberMessage(true)' "$HTML" >/dev/null
          grep -F "await window.server('addMember'" "$HTML" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_MEMBER_SAVE_V2065__' "$HTML" >/dev/null
          grep -F "window.addMember=function(){return save('add');}" "$HTML" >/dev/null
          grep -F "window.applyMemberEdit=function(){return save('edit');}" "$HTML" >/dev/null
          grep -F "window.server(editing?'updateMemberProfile':'addMember',args)" "$HTML" >/dev/null
          grep -F 'saveButton&&!saveBusy' "$HTML" >/dev/null
          ! grep -F '.addMember(ADMIN_PIN_VALUE' "$HTML" >/dev/null
          grep -F '#16a34a' "$HTML" >/dev/null
          grep -F '#d4a017' "$HTML" >/dev/null
          grep -F "selected.length!==2" "$HTML" >/dev/null
          grep -F "if(selected.length===1)" "$HTML" >/dev/null
          grep -F "if(selected.length===3||selected.length===4)" "$HTML" >/dev/null
          grep -F "window.server!=='function'" "$HTML" >/dev/null
          grep -F "rpc('setTempPairs'" "$HTML" >/dev/null
          grep -F "runAction('sendMemberMessage'" "$HTML" >/dev/null
          grep -F "executeSwap([left],[id])" "$HTML" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_DIRECT_CLOUDFLARE_LOGIN_V2050__' "$HTML" >/dev/null
          grep -F 'window.server=directServer' "$HTML" >/dev/null
          grep -F 'window.adminLogin=async function()' "$HTML" >/dev/null
          grep -F "directServer('createAdminSession',[pin])" "$HTML" >/dev/null
          grep -F "directServer('getCurrentMemberPassword',[null])" "$HTML" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_SINGLE_MEMBER_PASSWORD_V2064__' "$HTML" >/dev/null
          grep -F 'id="currentMemberPassword"' "$HTML" >/dev/null
          test "$(grep -o 'id="currentMemberPassword"' "$HTML" | wc -l)" -eq 1
          ! grep -F 'jm-current-member-password-box' "$HTML" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_TEAM_LAYOUT_V2064__' "$HTML" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_TEAM_CONTRACT_V2064__' "$HTML" >/dev/null
          grep -F 'outline:1px solid var(--member-team-color' "$HTML" >/dev/null
          grep -F '0 0 0 5px var(--member-team-color' "$HTML" >/dev/null
          ! grep -F "card.style.setProperty('outline','2px solid var(--member-team-color)'" "$HTML" >/dev/null
          ! grep -F 'box-shadow:inset 5px 0 0 var(--member-team-color)' "$HTML" >/dev/null
          ! grep -F 'padding-left:10px!important' "$HTML" >/dev/null
          grep -F 'jayuminton-state.pianopp001.workers.dev/api/compat/rpc' "$HTML" >/dev/null
          ! grep -F 'window.google&&window.google.script&&window.google.script.run' deployment/jayuminton/admin_card_interaction_v2042.js >/dev/null
          ! grep -F 'window.confirm(' deployment/jayuminton/admin_card_interaction_v2042.js >/dev/null
          ! grep -F 'script.google.com' "$HTML" >/dev/null
      - name: Set APK identity and signer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          java=Path('app/src/main/java/com/jayuminton/admin/MainActivity.java')
          s=java.read_text(encoding='utf-8')
          s,n=re.subn(r'private static final String ADMIN_URL =\s*\n?\s*"[^"]+";', 'private static final String ADMIN_URL =\n            "file:///android_asset/admin/index.html?app=admin&native=1&appVersion=203.0";',s,count=1)
          if n!=1: raise SystemExit('ADMIN_URL replacement failed')
          java.write_text(s,encoding='utf-8')
          gradle=Path('app/build.gradle')
          g=gradle.read_text(encoding='utf-8')
          g=re.sub(r'versionCode\s+\d+','versionCode 2030',g,count=1)
          g=re.sub(r"versionName\s+['\"][^'\"]+['\"]","versionName '203.0'",g,count=1)
          gradle.write_text(g,encoding='utf-8')
          PY
          base64 --decode app/src/main/res/drawable/icon_from_library.b64 > app/src/main/res/drawable/icon.png
          rm -f app/src/main/res/drawable/icon_from_library.b64
          base64 --decode signing/jayuminton-release.keystore.b64 > signing/jayuminton-release.jks
      - name: Build verify publish
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleRelease
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          unzip -p "$APK" assets/admin/index.html > "$RUNNER_TEMP/apk-admin.html"
          grep -F '__JAYUMINTON_ADMIN_MULTI_ACTION_V2053__' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_MESSAGE_ANYWHERE_V2056__' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F 'jayuminton-admin-multi-action-v2053-style' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F '녹색 = 이동선택' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F '이동/교환, 코트배정 대기 또는 팀설정을 선택하세요.' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F '1명·3명·4명은 자동으로 이동/교환입니다.' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F '#16a34a' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F '#d4a017' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F 'class="jm-do-active">코트배정 대기</button>' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F "rpc('setMemberStatus',[null,ids,'active'])" "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F '메시지 보내기' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_SELECTION_SCOPE_V2057__' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F '__JAYUMINTON_RESET_MULTI_SELECTION_V2057__' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F 'id="quickClearSelectionButton"' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F 'class="jm-quick-member-actions"' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F '#adminApp #quickMoveBar.quick-move-bar{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr))!important' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F 'overflow-x:hidden!important' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F 'onclick="startMemberEdit()">편집</button>' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F 'id="cancelMemberEditButton"' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F 'closeQuickMemberMessage(true)' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F "await window.server('addMember'" "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_MEMBER_SAVE_V2065__' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F "window.addMember=function(){return save('add');}" "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F "window.applyMemberEdit=function(){return save('edit');}" "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F "window.server(editing?'updateMemberProfile':'addMember',args)" "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F 'saveButton&&!saveBusy' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          ! grep -F '.addMember(ADMIN_PIN_VALUE' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F "selected.length!==2" "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F "if(selected.length===1)" "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F "if(selected.length===3||selected.length===4)" "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F "rpc('setTempPairs'" "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F "runAction('sendMemberMessage'" "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F "executeSwap([left],[id])" "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_DIRECT_CLOUDFLARE_LOGIN_V2050__' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F 'window.server=directServer' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F "directServer('getCurrentMemberPassword',[null])" "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_SINGLE_MEMBER_PASSWORD_V2064__' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F 'id="currentMemberPassword"' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          test "$(grep -o 'id="currentMemberPassword"' "$RUNNER_TEMP/apk-admin.html" | wc -l)" -eq 1
          ! grep -F 'jm-current-member-password-box' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_TEAM_LAYOUT_V2064__' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_TEAM_CONTRACT_V2064__' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F 'outline:1px solid var(--member-team-color' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F '0 0 0 5px var(--member-team-color' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          ! grep -F "card.style.setProperty('outline','2px solid var(--member-team-color)'" "$RUNNER_TEMP/apk-admin.html" >/dev/null
          ! grep -F 'box-shadow:inset 5px 0 0 var(--member-team-color)' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          ! grep -F 'padding-left:10px!important' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F 'jayuminton-state.pianopp001.workers.dev/api/compat/rpc' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          ! grep -F 'script.google.com' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          mkdir -p releases deployment/status
          cp "$APK" releases/jayuminton-admin-v203.0-complete-pair-recording-clear-team-cards.apk
          printf 'status=success\nversion=203.0\nrun_id=%s\nsha256=%s\nbuild=current-cloudflare-admin-v2056-stable-team-message-anywhere\n' "$GITHUB_RUN_ID" "$SHA" > deployment/status/v2030-complete-pair-recording-clear-team-cards.txt
          git add releases/jayuminton-admin-v203.0-complete-pair-recording-clear-team-cards.apk deployment/status/v2030-complete-pair-recording-clear-team-cards.txt
          git commit -m 'Publish admin APK v2056 stable team message anywhere' || exit 0
          git push origin HEAD:main
