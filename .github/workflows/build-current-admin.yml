name: Build current admin APK clean

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-current-admin.yml'
      - 'deployment/jayuminton/current_admin_build.trigger'
      - 'deployment/jayuminton/admin_card_interaction_v2042.js'
      - 'deployment/jayuminton/admin_team_layout_v2038.js'
      - 'deployment/jayuminton/cloudflare_v6_frontend_bridge.js'
      - 'deployment/jayuminton/inject_cloudflare_v6_frontend_bridge.py'
      - 'deployment/jayuminton/admin_native_audio_v2021_patch.py'
      - 'deployment/jayuminton/admin_native_vibration_v2023_patch.py'
      - 'cloudflare/state-worker/worker.js'
      - 'cloudflare/state-worker/temp-pairs.test.mjs'

permissions:
  contents: write

concurrency:
  group: jayuminton-current-admin-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Verify current worker temp-team contract
        shell: bash
        run: |
          set -euo pipefail
          node cloudflare/state-worker/temp-pairs.test.mjs
      - name: Restore proven shell
        shell: bash
        run: |
          set -euo pipefail
          PROVEN_COMMIT=20823018b13bba64082b09b76db617680a9d16b5
          rm -rf app
          git archive "$PROVEN_COMMIT" app | tar -x
          mkdir -p app/src/main/assets/admin
          unzip -p releases/jayuminton-admin-v200.8-webview-js-fixed.apk assets/admin/index.html > app/src/main/assets/admin/index.html
          test -s app/src/main/assets/admin/index.html
      - name: Inject current Cloudflare admin
        shell: bash
        run: |
          set -euo pipefail
          HTML=app/src/main/assets/admin/index.html
          python3 deployment/jayuminton/inject_cloudflare_v6_frontend_bridge.py "$HTML"
          python3 - <<'PY'
          from pathlib import Path
          html_path=Path('app/src/main/assets/admin/index.html')
          js_path=Path('deployment/jayuminton/admin_card_interaction_v2042.js')
          html=html_path.read_text(encoding='utf-8')
          js=js_path.read_text(encoding='utf-8')
          marker='id="jayuminton-admin-multi-action-v2047"'
          html=html.replace('<script '+marker+'>'+js+'</script>','')
          block='<script '+marker+'>'+js+'</script>'
          if '</body>' not in html: raise SystemExit('body closing tag missing')
          html=html.replace('</body>',block+'\n</body>',1)
          html_path.write_text(html,encoding='utf-8')
          PY
          python3 deployment/jayuminton/admin_native_audio_v2021_patch.py
          python3 deployment/jayuminton/admin_native_vibration_v2023_patch.py
          grep -F '__JAYUMINTON_ADMIN_MULTI_ACTION_V2047__' "$HTML" >/dev/null
          grep -F '1~4명을 먼저 선택한 뒤 이동/교환 또는 팀설정을 누르세요.' "$HTML" >/dev/null
          grep -F '이동/교환' "$HTML" >/dev/null
          grep -F '팀설정' "$HTML" >/dev/null
          grep -F '#16a34a' "$HTML" >/dev/null
          grep -F '#d4a017' "$HTML" >/dev/null
          grep -F "await server('swapMembers'" "$HTML" >/dev/null
          grep -F "await server('moveOrSwapMember'" "$HTML" >/dev/null
          ! grep -F 'window.confirm(' deployment/jayuminton/admin_card_interaction_v2042.js >/dev/null
          ! grep -F 'script.google.com' "$HTML" >/dev/null
      - name: Set APK identity and signer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          java=Path('app/src/main/java/com/jayuminton/admin/MainActivity.java')
          s=java.read_text(encoding='utf-8')
          s,n=re.subn(r'private static final String ADMIN_URL =\s*\n?\s*"[^"]+";', 'private static final String ADMIN_URL =\n            "file:///android_asset/admin/index.html?app=admin&native=1&appVersion=203.0";',s,count=1)
          if n!=1: raise SystemExit('ADMIN_URL replacement failed')
          java.write_text(s,encoding='utf-8')
          gradle=Path('app/build.gradle')
          g=gradle.read_text(encoding='utf-8')
          g=re.sub(r'versionCode\s+\d+','versionCode 2030',g,count=1)
          g=re.sub(r"versionName\s+['\"][^'\"]+['\"]","versionName '203.0'",g,count=1)
          gradle.write_text(g,encoding='utf-8')
          PY
          base64 --decode app/src/main/res/drawable/icon_from_library.b64 > app/src/main/res/drawable/icon.png
          rm -f app/src/main/res/drawable/icon_from_library.b64
          base64 --decode signing/jayuminton-release.keystore.b64 > signing/jayuminton-release.jks
      - name: Build verify publish
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleRelease
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          unzip -p "$APK" assets/admin/index.html > "$RUNNER_TEMP/apk-admin.html"
          grep -F '__JAYUMINTON_ADMIN_MULTI_ACTION_V2047__' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F '1~4명을 먼저 선택한 뒤 이동/교환 또는 팀설정을 누르세요.' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          ! grep -F 'script.google.com' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          mkdir -p releases deployment/status
          cp "$APK" releases/jayuminton-admin-v203.0-complete-pair-recording-clear-team-cards.apk
          printf 'status=success\nversion=203.0\nrun_id=%s\nsha256=%s\nbuild=current-cloudflare-admin-v2047-clean\n' "$GITHUB_RUN_ID" "$SHA" > deployment/status/v2030-complete-pair-recording-clear-team-cards.txt
          git add releases/jayuminton-admin-v203.0-complete-pair-recording-clear-team-cards.apk deployment/status/v2030-complete-pair-recording-clear-team-cards.txt
          git commit -m 'Publish clean current Cloudflare admin APK v2047' || exit 0
          git push origin HEAD:main
