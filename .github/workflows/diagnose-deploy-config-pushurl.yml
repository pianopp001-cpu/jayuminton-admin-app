name: Diagnose deploy config pushUrl field (read only)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
    steps:
      - name: Check for pushUrl and other fields the AAB workflow needs (no values printed)
        shell: bash
        run: |
          set -euo pipefail
          CONFIG="$RUNNER_TEMP/deploy.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$CONFIG"
          jq -e . "$CONFIG" >/dev/null
          echo "all_top_level_keys:"
          jq -r 'keys[]' "$CONFIG"
          for key in mainDeploymentId pushUrl firebaseProjectId; do
            value="$(jq -r --arg k "$key" '.[$k] // empty' "$CONFIG")"
            if [ -z "$value" ] || [ "$value" = "null" ]; then
              echo "MISSING_OR_NULL: $key"
            else
              echo "PRESENT: $key (length ${#value})"
            fi
          done
