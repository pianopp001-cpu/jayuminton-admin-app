name: Deploy web heads-up notifications only

on:
  pull_request:
    branches: [main]
    paths:
      - 'deployment/status/trigger-headsup-web.txt'
      - '.github/workflows/deploy-headsup-web-only.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: jayuminton-headsup-web-only
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@latest

      - name: Authenticate Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Resolve live hosting
        shell: bash
        run: |
          set -euo pipefail
          CONFIG="$RUNNER_TEMP/deploy.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$CONFIG"
          jq -e '.firebaseProjectId and .hostingUrl and .mainDeploymentId and .pushDeploymentId' "$CONFIG" >/dev/null
          {
            echo "FIREBASE_PROJECT_ID=$(jq -r '.firebaseProjectId' "$CONFIG")"
            echo "HOSTING_URL=$(jq -r '.hostingUrl' "$CONFIG")"
            echo "MAIN_URL=https://script.google.com/macros/s/$(jq -r '.mainDeploymentId' "$CONFIG")/exec"
            echo "PUSH_URL=https://script.google.com/macros/s/$(jq -r '.pushDeploymentId' "$CONFIG")/exec"
          } >> "$GITHUB_ENV"

      - name: Build unchanged shell with strengthened service worker
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/hosting"
          PUBLIC="$ROOT/web-push"
          SRC="deployment/jayuminton/v1637-web"
          BASE="${HOSTING_URL%/}"
          mkdir -p "$PUBLIC"
          cp deployment/jayuminton/firebase.json "$ROOT/firebase.json"
          cp "$SRC/index.html" "$PUBLIC/index.html"
          cp "$SRC/setup-v205.css" "$PUBLIC/setup-v205.css"
          cp "$SRC/manifest.webmanifest" "$PUBLIC/manifest.webmanifest"
          cp "$SRC/firebase-messaging-sw.js" "$PUBLIC/firebase-messaging-sw.js"
          cp "$SRC/alert-self-test.js" "$PUBLIC/alert-self-test.js"

          for a in icon-198.png icon-512.png apple-touch-icon-180.png badge-96.png; do
            curl --fail --location --retry 5 --retry-delay 2 --max-time 90 "$BASE/$a?src=$GITHUB_RUN_ID" -o "$PUBLIC/$a"
            test -s "$PUBLIC/$a"
          done

          cat "$SRC"/setup-v205.js.gz.b64.part-* | tr -d '\r\n' | base64 -d > "$RUNNER_TEMP/setup-v205.js.gz"
          gzip -dc "$RUNNER_TEMP/setup-v205.js.gz" > "$PUBLIC/setup-v205.js"
          python3 - "$SRC/config-v204.template.js" "$PUBLIC" <<'PY'
          from pathlib import Path
          import os,sys
          template=Path(sys.argv[1]).read_text(encoding='utf-8')
          cfg=template.replace('__MEMBER_PAGE_URL__',os.environ['MAIN_URL']).replace('__RELAY_URL__',os.environ['PUSH_URL'])
          root=Path(sys.argv[2])
          for name in ('config-v202.js','config-v203.js','config-v204.js'):
              (root/name).write_text(cfg,encoding='utf-8')
          PY

          node --check "$PUBLIC/setup-v205.js"
          node --check "$PUBLIC/firebase-messaging-sw.js"
          node --check "$PUBLIC/alert-self-test.js"
          grep -F "const sets = String(type || '') === 'court_assignment' ? 5 : 3;" "$PUBLIC/firebase-messaging-sw.js" >/dev/null
          grep -F 'return [650, 220, 650, 220, 650];' "$PUBLIC/firebase-messaging-sw.js" >/dev/null
          grep -F "requireInteraction: true" "$PUBLIC/firebase-messaging-sw.js" >/dev/null
          grep -F "renotify: true" "$PUBLIC/firebase-messaging-sw.js" >/dev/null
          grep -F "silent: false" "$PUBLIC/firebase-messaging-sw.js" >/dev/null
          grep -F "코트 입장 — 지금 이동하세요" "$PUBLIC/firebase-messaging-sw.js" >/dev/null
          grep -F "대기1 진입 — 곧 경기입니다" "$PUBLIC/firebase-messaging-sw.js" >/dev/null
          grep -F 'alert-self-test.js?v=1' "$PUBLIC/index.html" >/dev/null
          grep -F 'JAYUMINTON_PUSH_SETUP_REQUEST' "$PUBLIC/alert-self-test.js" >/dev/null
          grep -F '자유민턴 알림 테스트' "$PUBLIC/alert-self-test.js" >/dev/null
          grep -F '<title>자유민턴 코트현황</title>' "$PUBLIC/index.html" >/dev/null

      - name: Deploy Hosting only
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/hosting"
          firebase deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive

      - name: Verify live heads-up service worker
        shell: bash
        run: |
          set -euo pipefail
          BASE="${HOSTING_URL%/}"
          sleep 6
          curl --fail --location --retry 5 -H 'Cache-Control: no-cache' "$BASE/firebase-messaging-sw.js?verify=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/live-sw.js"
          node --check "$RUNNER_TEMP/live-sw.js"
          grep -F "const sets = String(type || '') === 'court_assignment' ? 5 : 3;" "$RUNNER_TEMP/live-sw.js" >/dev/null
          grep -F 'return [650, 220, 650, 220, 650];' "$RUNNER_TEMP/live-sw.js" >/dev/null
          grep -F 'requireInteraction: true' "$RUNNER_TEMP/live-sw.js" >/dev/null
          grep -F 'renotify: true' "$RUNNER_TEMP/live-sw.js" >/dev/null
          grep -F 'silent: false' "$RUNNER_TEMP/live-sw.js" >/dev/null
          grep -F '코트 입장 — 지금 이동하세요' "$RUNNER_TEMP/live-sw.js" >/dev/null
          grep -F '대기1 진입 — 곧 경기입니다' "$RUNNER_TEMP/live-sw.js" >/dev/null
          curl --fail --location --retry 5 -H 'Cache-Control: no-cache' "$BASE/alert-self-test.js?verify=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/live-test.js"
          node --check "$RUNNER_TEMP/live-test.js"
          grep -F '자유민턴 알림 테스트' "$RUNNER_TEMP/live-test.js" >/dev/null
          curl --fail --location --retry 5 -H 'Cache-Control: no-cache' "$BASE/?verify=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/live-index.html"
          grep -F 'alert-self-test.js?v=1' "$RUNNER_TEMP/live-index.html" >/dev/null
          echo 'Live web heads-up worker and notification self-test verified.'
