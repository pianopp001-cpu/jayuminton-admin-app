name: DISABLED known-GAS user APK v1.4.3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blocked:
    runs-on: ubuntu-latest
    steps:
      - name: Block known-GAS user APK rollback
        run: |
          echo 'DISABLED: this workflow hardcodes a script.google.com user route, removes Firebase messaging, and builds obsolete v1.4.3.'
          echo 'Production user APK is Cloudflare-only v1.6.42 (com.jayuminton.user) with native FCM.'
          exit 1
