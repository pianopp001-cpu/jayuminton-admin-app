name: Build lightweight user APK v1.4.0

on:
  push:
    branches: [main]
    paths:
      - 'deployment/scripts/build_user_lite_fresh_v140.sh'
      - '.github/workflows/build-user-lite-v140.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: jayuminton-user-lite-v140
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - id: resolve
        name: Resolve user deployment
        shell: bash
        run: |
          set -euo pipefail
          C="$RUNNER_TEMP/deploy.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$C"
          jq -e '.mainDeploymentId' "$C" >/dev/null
          echo "MAIN_DEPLOYMENT_ID=$(jq -r '.mainDeploymentId' "$C")" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.7'}
      - id: build_apk
        name: Build lightweight APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signing
          test -s signing/jayuminton-release.keystore.b64
          base64 --decode signing/jayuminton-release.keystore.b64 > signing/jayuminton-release.jks
          test -s signing/jayuminton-release.jks
          bash deployment/scripts/build_user_lite_fresh_v140.sh 2>&1 | tee "$RUNNER_TEMP/user-lite-build.log"
          test -s releases/jayuminton-courtstatus-v1.4.0-lite-fresh.apk
          grep -F 'status=success' deployment/status/user-lite-v1.4.0.txt >/dev/null
          grep -F 'firebase_messaging=removed' deployment/status/user-lite-v1.4.0.txt >/dev/null
          grep -F 'native_vibration_bridge=3-pulses-x-8-groups-stop-on-vibrate-zero' deployment/status/user-lite-v1.4.0.txt >/dev/null
          SIZE=$(stat -c%s releases/jayuminton-courtstatus-v1.4.0-lite-fresh.apk)
          [ "$SIZE" -lt 500000 ]
          cp releases/jayuminton-courtstatus-v1.4.0-lite-fresh.apk "$RUNNER_TEMP/user-lite.apk"
          cp deployment/status/user-lite-v1.4.0.txt "$RUNNER_TEMP/user-lite-status.txt"
      - id: publish
        name: Publish verified lite APK
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git fetch origin main
          git checkout -B main origin/main
          cp "$RUNNER_TEMP/user-lite.apk" releases/jayuminton-courtstatus-v1.4.0-lite-fresh.apk
          cp "$RUNNER_TEMP/user-lite-status.txt" deployment/status/user-lite-v1.4.0.txt
          sha256sum releases/jayuminton-courtstatus-v1.4.0-lite-fresh.apk > deployment/status/user-lite-v1.4.0.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/jayuminton-courtstatus-v1.4.0-lite-fresh.apk deployment/status/user-lite-v1.4.0.txt deployment/status/user-lite-v1.4.0.sha256
          git commit -m 'Publish lightweight user APK v1.4.0'
          git pull --rebase origin main
          git push origin main
      - name: Record build evidence
        if: ${{ always() }}
        shell: bash
        env:
          RESOLVE: ${{ steps.resolve.outcome }}
          BUILD: ${{ steps.build_apk.outcome }}
          PUBLISH: ${{ steps.publish.outcome }}
        run: |
          set -euo pipefail
          git reset --hard HEAD || true
          git fetch origin main || true
          git checkout -B main origin/main || true
          mkdir -p deployment/status
          {
            echo "source_sha=${GITHUB_SHA}"
            echo "resolve=${RESOLVE:-not_run}"
            echo "build_apk=${BUILD:-not_run}"
            echo "publish=${PUBLISH:-not_run}"
            if [ -f "$RUNNER_TEMP/user-lite-build.log" ]; then
              echo 'build_log_tail_begin'
              tail -40 "$RUNNER_TEMP/user-lite-build.log" | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g'
              echo
              echo 'build_log_tail_end'
            fi
          } > deployment/status/user-lite-v1.4.0-build-evidence.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment/status/user-lite-v1.4.0-build-evidence.txt
          git commit -m 'Record lightweight user APK build evidence' || exit 0
          git pull --rebase origin main
          git push origin main
      - uses: actions/upload-artifact@v4
        if: ${{ success() }}
        with:
          name: jayuminton-courtstatus-v1.4.0-lite-fresh
          path: releases/jayuminton-courtstatus-v1.4.0-lite-fresh.apk
          if-no-files-found: error
          retention-days: 30
