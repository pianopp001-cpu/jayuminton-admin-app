name: DISABLED legacy lightweight user APK v1.4.0

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blocked:
    runs-on: ubuntu-latest
    steps:
      - name: Block obsolete v1.4.0 lightweight user APK
        run: |
          echo 'DISABLED: this workflow resolves the old deployment id and intentionally removes native Firebase messaging.'
          echo 'Production user APK is Cloudflare-only v1.6.42 with native FCM.'
          exit 1
