name: Emergency rollback unverified v1.1.9 install link

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rollback-user-v119-install-link.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --global @google/clasp@latest
      - name: Roll back only APK URL
        shell: bash
        run: |
          set -euo pipefail
          C="$RUNNER_TEMP/deploy.json"; printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$C"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          ID="$(jq -r '.mainScriptId' "$C")"; DEPLOY="$(jq -r '.mainDeploymentId' "$C")"
          W="$RUNNER_TEMP/main"; mkdir -p "$W"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$ID" > "$W/.clasp.json"
          cd "$W"; clasp pull
          cp Code.js "$RUNNER_TEMP/Code.before.js"; cp Admin.html "$RUNNER_TEMP/Admin.before.html"; cp Style.html "$RUNNER_TEMP/Style.before.html"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Script.html'); s=p.read_text(encoding='utf-8')
          old='https://raw.githubusercontent.com/pianopp001-cpu/jayuminton-admin-app/main/releases/jayuminton-courtstatus-v1.1.9-fresh-install.apk?build=e9c82252'
          new='https://raw.githubusercontent.com/pianopp001-cpu/jayuminton-admin-app/main/releases/jayuminton-courtstatus-v1.1.7-fresh-install.apk?build=f8bbf540'
          if s.count(old) != 1: raise SystemExit('v1.1.9 live link not found exactly once')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          cmp Code.js "$RUNNER_TEMP/Code.before.js"; cmp Admin.html "$RUNNER_TEMP/Admin.before.html"; cmp Style.html "$RUNNER_TEMP/Style.before.html"
          clasp push --force
          clasp create-deployment --deploymentId "$DEPLOY" --description "rollback unverified v1.1.9 ${GITHUB_SHA::7}"
          printf 'status=success\nrolled_back_from=1.1.9\nrolled_back_to=1.1.7\nchanged_files=Script.html\nadmin_logic_changed=no\ndeployed_at=%s\n' "$(date -u +%FT%TZ)" > "$GITHUB_WORKSPACE/deployment/status/user-v119-emergency-rollback.txt"
      - name: Publish status
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add deployment/status/user-v119-emergency-rollback.txt
          git commit -m 'Record emergency rollback of unverified v1.1.9 link'
          git pull --rebase origin main
          git push origin main
