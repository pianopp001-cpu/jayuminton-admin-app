name: Deploy Cloudflare-only admin save lock and memo

# explicit retry after authenticated RPC preflight was corrected to transport-only validation
on:
  push:
    branches: [main]
    paths:
      - 'deployment/jayuminton/inject_cloudflare_v6_frontend_bridge.py'
      - 'deployment/jayuminton/admin_cloudflare_post_contract_patch.py'
      - '.github/workflows/deploy-cloudflare-admin-save-lock-memo.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: jayuminton-cloudflare-admin-save-lock-memo
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      ADMIN_CHANNEL: admin-cloudflare-vnext
      ADMIN_URL: https://jayuminton-push--admin-cloudflare-vnext-z3bgvi2g.web.app
      CLOUDFLARE_RPC_URL: https://jayuminton-state.pianopp001.workers.dev/api/compat/rpc

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Authenticate Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      - name: Install Firebase CLI
        run: npm install --global firebase-tools@latest
      - name: Resolve Firebase project and restore verified v200.8 admin source
        shell: bash
        run: |
          set -euo pipefail
          CONFIG="$RUNNER_TEMP/deploy.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$CONFIG"
          FIREBASE_PROJECT_ID="$(jq -r '.firebaseProjectId // empty' "$CONFIG")"
          test -n "$FIREBASE_PROJECT_ID"
          echo "FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID" >> "$GITHUB_ENV"
          unzip -p releases/jayuminton-admin-v200.8-webview-js-fixed.apk assets/admin/index.html > "$RUNNER_TEMP/admin-preflight.html"
          test -s "$RUNNER_TEMP/admin-preflight.html"
          grep -F '<html' "$RUNNER_TEMP/admin-preflight.html" >/dev/null || grep -F '<!DOCTYPE html' "$RUNNER_TEMP/admin-preflight.html" >/dev/null
      - name: Verify Cloudflare RPC transport contract
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --max-time 60 \
            -H 'content-type: application/json' \
            --data '{"name":"getPublicState","args":[]}' \
            "$CLOUDFLARE_RPC_URL" -o "$RUNNER_TEMP/rpc.json"
          jq -e 'type == "object" and has("ok")' "$RUNNER_TEMP/rpc.json" >/dev/null
          ! grep -F 'script.google.com/macros/s/' "$RUNNER_TEMP/rpc.json"
      - name: Restore v203 admin frontend then apply latest save-lock memo contract
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/admin-cloudflare-only"
          PUBLIC="$ROOT/public"
          mkdir -p "$PUBLIC"
          cp "$RUNNER_TEMP/admin-preflight.html" "$PUBLIC/index.html"
          python3 deployment/jayuminton/inject_cloudflare_v6_frontend_bridge.py "$PUBLIC/index.html"
          python3 deployment/jayuminton/admin_cloudflare_post_contract_patch.py "$PUBLIC/index.html"
          grep -F 'function usesAdminFullName(member)' "$PUBLIC/index.html" >/dev/null
          grep -F '>같은 팀 설정</button>' "$PUBLIC/index.html" >/dev/null
          grep -F '>팀 해제</button>' "$PUBLIC/index.html" >/dev/null
          grep -F 'id="jayuminton-pair-statistics-disclosure-v2028"' "$PUBLIC/index.html" >/dev/null
          grep -F '#adminApp .member-team-badge{display:none!important}' "$PUBLIC/index.html" >/dev/null
          grep -F 'JAYUMINTON_ADMIN_CLOUDFLARE_SAVE_LOCK_V24' "$PUBLIC/index.html" >/dev/null
          grep -F '저장중 · 잠시만 기다려 주세요' "$PUBLIC/index.html" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_SAVING__' "$PUBLIC/index.html" >/dev/null
          grep -F 'member-public-memo' "$PUBLIC/index.html" >/dev/null
          grep -F 'publicMemo' "$PUBLIC/index.html" >/dev/null
          grep -F "$CLOUDFLARE_RPC_URL" "$PUBLIC/index.html" >/dev/null
          ! grep -F 'script.google.com/macros/s/' "$PUBLIC/index.html"
          cat > "$ROOT/firebase.json" <<'JSON'
          {"hosting":{"public":"public","headers":[{"source":"/**","headers":[{"key":"Cache-Control","value":"no-store, no-cache, must-revalidate, max-age=0"}]}],"rewrites":[{"source":"**","destination":"/index.html"}]}}
          JSON
      - name: Deploy Cloudflare admin frontend channel
        shell: bash
        run: |
          set -euo pipefail
          firebase hosting:channel:deploy "$ADMIN_CHANNEL" --project "$FIREBASE_PROJECT_ID" --expires 30d --config "$RUNNER_TEMP/admin-cloudflare-only/firebase.json" --non-interactive --json | tee "$RUNNER_TEMP/deploy.json"
      - name: Verify live admin requirements
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          curl --fail --location --retry 5 --max-time 60 -H 'Cache-Control: no-cache, no-store' "$ADMIN_URL/?verify=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/live.html"
          for marker in 'function usesAdminFullName(member)' '같은 팀 설정' '팀 해제' 'jayuminton-pair-statistics-disclosure-v2028' 'JAYUMINTON_ADMIN_CLOUDFLARE_SAVE_LOCK_V24' '저장중 · 잠시만 기다려 주세요' '__JAYUMINTON_ADMIN_SAVING__' 'court-voice-controls' 'member-public-memo' 'publicMemo'; do grep -F "$marker" "$RUNNER_TEMP/live.html" >/dev/null; done
          grep -F "$CLOUDFLARE_RPC_URL" "$RUNNER_TEMP/live.html" >/dev/null
          ! grep -F 'script.google.com/macros/s/' "$RUNNER_TEMP/live.html"
          echo "ADMIN_CLOUDFLARE_V203_SAVE_LOCK_MEMO_OK url=$ADMIN_URL"
      - name: Record verified Cloudflare admin success
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deployment/status
          NOW="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          {
            echo 'status=success'
            echo 'baseline=v203'
            echo 'source=v200.8-verified-apk-plus-v203-bridge'
            echo 'backend=cloudflare-only'
            echo 'gas=absent'
            echo 'team_set_clear=verified'
            echo 'team_stripe=verified'
            echo 'pair_statistics_full_expand=verified'
            echo 'save_lock=verified'
            echo 'voice_controls_during_save=verified'
            echo 'public_memo=verified'
            echo "run_id=$GITHUB_RUN_ID"
            echo "admin_url=$ADMIN_URL"
            echo "updated_at=$NOW"
          } > deployment/status/cloudflare-admin-v203.txt
          {
            echo 'workflow=Deploy Cloudflare-only admin save lock and memo'
            echo 'conclusion=success'
            echo "run_id=$GITHUB_RUN_ID"
            echo "head_sha=$GITHUB_SHA"
            echo "run_url=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "updated_at=$NOW"
          } > deployment/status/last-admin-cloudflare-workflow.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment/status/cloudflare-admin-v203.txt deployment/status/last-admin-cloudflare-workflow.txt
          git commit -m 'status: verify Cloudflare admin v203 deployment' || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main
      - name: Record Cloudflare admin failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          NOW="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          mkdir -p deployment/status
          {
            echo 'workflow=Deploy Cloudflare-only admin save lock and memo'
            echo 'conclusion=failure'
            echo "run_id=$GITHUB_RUN_ID"
            echo "head_sha=$GITHUB_SHA"
            echo "run_url=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "updated_at=$NOW"
          } > deployment/status/last-admin-cloudflare-workflow.txt
          git add deployment/status/last-admin-cloudflare-workflow.txt
          git commit -m 'status: record admin Cloudflare deploy failure' || exit 0
          git push origin HEAD:main
