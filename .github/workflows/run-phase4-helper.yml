name: Run phase4 helper
on:
  push:
    branches: [phase4-exchange-patch]
    paths: ['.github/workflows/run-phase4-helper.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase4-exchange-patch
          fetch-depth: 0
      - run: python3 tools/apply_phase4_swap.py
      - run: |
          set -e
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf 'source-snapshot/current-main/Code.js\nsource-snapshot/current-main/Script.html')"
          grep -q 'function memberRequestWaitSwap' source-snapshot/current-main/Script.html
          grep -q 'function memberRespondWaitSwap' source-snapshot/current-main/Code.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add source-snapshot/current-main/Code.js source-snapshot/current-main/Script.html
          git commit -m 'feat: add member wait-seat exchange approval'
          git push origin HEAD:phase4-exchange-patch
