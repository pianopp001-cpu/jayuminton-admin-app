name: Restore Firebase member web hosting
on:
  push:
    branches: [main]
    paths:
      - deployment/jayuminton/web-push-overrides/**
      - .github/workflows/deploy-member-proxy.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy-hosting:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      - name: Install Firebase CLI
        run: npm install --global firebase-tools@latest
      - name: Resolve Firebase Hosting config
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$RUNNER_TEMP/deploy.json"
          PROJECT="$(jq -r '.firebaseProjectId' "$RUNNER_TEMP/deploy.json")"
          HOSTING_URL="$(jq -r '.hostingUrl' "$RUNNER_TEMP/deploy.json")"
          echo "FIREBASE_PROJECT_ID=$PROJECT" >> "$GITHUB_ENV"
          echo "HOSTING_URL=$HOSTING_URL" >> "$GITHUB_ENV"
      - name: Write Hosting-only Firebase config
        shell: bash
        run: |
          set -euo pipefail
          test -f deployment/jayuminton/web-push-overrides/index.html
          cat > firebase.json <<'JSON'
          {"hosting":{"public":"deployment/jayuminton/web-push-overrides","rewrites":[{"source":"/api/member-rpc","function":{"functionId":"memberRpc","region":"asia-northeast3"}},{"source":"**","destination":"/index.html"}]}}
          JSON
      - name: Deploy Hosting only
        shell: bash
        run: |
          set -euo pipefail
          firebase deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive
      - name: Verify restored member web
        shell: bash
        run: |
          set -euo pipefail
          BASE="${HOSTING_URL%/}"
          code="$(curl -L -sS --max-time 60 -o "$RUNNER_TEMP/member.html" -w '%{http_code}' "$BASE/?restore=$GITHUB_RUN_ID")"
          echo "member_web_url=$BASE/"
          echo "member_web_http=$code"
          echo "member_web_bytes=$(wc -c < "$RUNNER_TEMP/member.html")"
          test "$code" = "200"
          grep -Eqi '<html|<!doctype html' "$RUNNER_TEMP/member.html"
          if grep -Eqi 'Google Drive|파일을 열 수|unable to open' "$RUNNER_TEMP/member.html"; then
            echo 'Drive fallback detected in member web response' >&2
            exit 1
          fi
