# retrigger 2026-08-08T02:12Z
name: Build Jayuminton v199.5 direct APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-v1995-direct.yml'

permissions:
  contents: write

concurrency:
  group: jayuminton-v1995-direct-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      DOG_ICON_SHA256: c64778554936a98100ef4a277a007bd4d619e75f22804a8b86deaae86a4af4ed

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore exact original dog icon from preserved base64 parts
        shell: bash
        run: |
          set -euo pipefail
          test -s app/icon-base64/original-dog-icon.b64.part-00
          test -s app/icon-base64/original-dog-icon.b64.part-01
          mkdir -p app/src/main/res/drawable
          cat app/icon-base64/original-dog-icon.b64.part-* | tr -d '\r\n' | base64 --decode > app/src/main/res/drawable/icon.png
          test -s app/src/main/res/drawable/icon.png
          ACTUAL=$(sha256sum app/src/main/res/drawable/icon.png | awk '{print $1}')
          echo "dog icon sha256=$ACTUAL"
          test "$ACTUAL" = "$DOG_ICON_SHA256"
          file app/src/main/res/drawable/icon.png

      - name: Prepare clean v199.5 fresh-install source
        shell: bash
        run: |
          set -euo pipefail
          CONFIG="$RUNNER_TEMP/deploy.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$CONFIG"
          DEPLOYMENT_ID=$(jq -r '.mainDeploymentId' "$CONFIG")
          test -n "$DEPLOYMENT_ID"
          test "$DEPLOYMENT_ID" != "null"

          python3 - <<'PY'
          from pathlib import Path
          import json, os, re

          cfg=json.loads(os.environ['JAYUMINTON_DEPLOY_CONFIG_JSON'])
          deployment_id=str(cfg['mainDeploymentId']).strip()

          java=Path('app/src/main/java/com/jayuminton/admin/MainActivity.java')
          text=java.read_text(encoding='utf-8')
          admin_url=(
              'https://script.google.com/macros/s/'+deployment_id+
              '/exec?mode=admin&appVersion=199.5&freshAdmin=1'
          )
          text,count=re.subn(
              r'https://script\.google\.com/macros/s/[^"\\]+/exec\?mode=admin[^"\\]*',
              admin_url,
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('ADMIN_URL replacement failed')
          text=re.sub(
              r'private static final String APK_WEB_BUILD = "[^"]+";',
              'private static final String APK_WEB_BUILD = "1995-fresh-install-final";',
              text,
              count=1,
          )
          text=re.sub(
              r'JayumintonNative/[0-9A-Za-z.\-]+(?: FreshAdmin/[0-9A-Za-z.\-]+)?',
              'JayumintonNative/199.5 FreshAdmin/1995-final',
              text,
          )
          java.write_text(text,encoding='utf-8')

          gradle=Path('app/build.gradle')
          g=gradle.read_text(encoding='utf-8')
          g=re.sub(r"applicationId\s+['\"][^'\"]+['\"]","applicationId 'com.jayuminton.admin'",g,count=1)
          g=re.sub(r'versionCode\s+\d+','versionCode 1995',g,count=1)
          g=re.sub(r"versionName\s+['\"][^'\"]+['\"]","versionName '199.5'",g,count=1)
          gradle.write_text(g,encoding='utf-8')
          PY

          grep -F "applicationId 'com.jayuminton.admin'" app/build.gradle
          grep -F 'versionCode 1995' app/build.gradle
          grep -F "versionName '199.5'" app/build.gradle
          grep -F 'NativeBrowser' app/src/main/java/com/jayuminton/admin/MainActivity.java
          grep -F 'com.android.chrome' app/src/main/java/com/jayuminton/admin/MainActivity.java
          grep -F 'jayuminton-push.web.app' app/src/main/java/com/jayuminton/admin/MainActivity.java
          if grep -F 'intent://' app/src/main/java/com/jayuminton/admin/MainActivity.java >/dev/null; then
            echo 'Forbidden intent URL found'; exit 1
          fi
          if grep -F 'drive.google.com' app/src/main/java/com/jayuminton/admin/MainActivity.java >/dev/null; then
            echo 'Forbidden Drive fallback found'; exit 1
          fi

      - name: Restore release signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signing
          base64 --decode signing/jayuminton-release.keystore.b64 > signing/jayuminton-release.jks
          keytool -list -keystore signing/jayuminton-release.jks -storepass 'JayuMinton14!' -alias jayuminton >/dev/null

      - name: Build signed release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$AAPT" dump badging "$APK" > "$RUNNER_TEMP/badging.txt"
          grep -F "package: name='com.jayuminton.admin'" "$RUNNER_TEMP/badging.txt"
          grep -F "versionName='199.5'" "$RUNNER_TEMP/badging.txt"
          unzip -p "$APK" res/drawable/icon.png > "$RUNNER_TEMP/final-icon.png"
          test "$(sha256sum "$RUNNER_TEMP/final-icon.png" | awk '{print $1}')" = "$DOG_ICON_SHA256"

      - name: Publish fresh-install APK to repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p releases
          cp app/build/outputs/apk/release/app-release.apk releases/jayuminton-v199.5-fresh-install.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/jayuminton-v199.5-fresh-install.apk
          git commit -m 'Add verified Jayuminton v199.5 fresh-install APK'
          git pull --rebase origin main || true
          git push origin main

      - uses: actions/upload-artifact@v4
        with:
          name: jayuminton-v199.5-fresh-install
          path: releases/jayuminton-v199.5-fresh-install.apk
          if-no-files-found: error
          retention-days: 30
