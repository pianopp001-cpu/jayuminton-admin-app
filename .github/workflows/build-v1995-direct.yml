name: Build Jayuminton v199.6 final APK
run-name: Jayuminton v199.6 final fresh-install APK

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-v1995-direct.yml'

permissions:
  contents: write

concurrency:
  group: jayuminton-v1996-final-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      APK_OUTPUT: releases/jayuminton-v199.6-final-fresh-install.apk
      OLD_APK: releases/jayuminton-v199.3-reinstall.apk

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install exact Android build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore exact dog launcher art from working v199.3 APK
        shell: bash
        run: |
          set -euo pipefail
          test -s "$OLD_APK"
          unzip -t "$OLD_APK" >/dev/null
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$OLD_APK" > "$RUNNER_TEMP/v1993-badging.txt"
          grep -E '^application(-icon-[0-9]+)?:' "$RUNNER_TEMP/v1993-badging.txt" || true

          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from io import BytesIO
          from PIL import Image
          import os, re, zipfile, hashlib

          apk = Path(os.environ['OLD_APK'])
          badging = Path(os.environ['RUNNER_TEMP']) / 'v1993-badging.txt'
          text = badging.read_text(encoding='utf-8', errors='ignore')

          preferred = []
          for m in re.finditer(r"application-icon-[0-9]+:'([^']+)'", text):
              preferred.append(m.group(1))
          m = re.search(r"application:.*? icon='([^']+)'", text)
          if m:
              preferred.append(m.group(1))

          with zipfile.ZipFile(apk, 'r') as z:
              names = z.namelist()
              extra = [n for n in names if re.search(r'^res/(?:mipmap|drawable)[^/]*/[^/]*(?:icon|launcher)[^/]*\.(?:png|webp)$', n, re.I)]
              all_rasters = [n for n in names if re.search(r'^res/(?:mipmap|drawable)[^/]*/[^/]+\.(?:png|webp)$', n, re.I)]

              candidates = []
              for n in preferred + extra + all_rasters:
                  if n not in candidates:
                      candidates.append(n)

              valid = []
              for order, name in enumerate(candidates):
                  if name not in names:
                      continue
                  try:
                      data = z.read(name)
                      im = Image.open(BytesIO(data))
                      im.load()
                      w, h = im.size
                      if w < 48 or h < 48:
                          continue
                      is_preferred = name in preferred
                      looks_icon = bool(re.search(r'(icon|launcher)', name, re.I))
                      score = (2 if is_preferred else 0, 1 if looks_icon else 0, w * h, -order)
                      valid.append((score, name, im.convert('RGBA')))
                  except Exception:
                      continue

          if not valid:
              raise SystemExit('No valid raster launcher icon could be extracted from v199.3 APK')

          valid.sort(key=lambda item: item[0], reverse=True)
          score, chosen, image = valid[0]
          print('chosen old APK launcher icon:', chosen)
          print('chosen icon size:', image.size)

          # Preserve the artwork/pixels from the known-working APK while writing
          # a conventional PNG that current AAPT2 accepts.
          out = Path('app/src/main/res/drawable/icon.png')
          out.parent.mkdir(parents=True, exist_ok=True)
          image.save(out, format='PNG', optimize=False, compress_level=6)
          clean = out.read_bytes()
          print('normalized launcher sha256:', hashlib.sha256(clean).hexdigest())

          # Record provenance so the build result proves which old APK resource was used.
          Path('deployment/status/v1996-dog-icon-source.txt').write_text(
              'source_apk=releases/jayuminton-v199.3-reinstall.apk\n'
              'source_resource=' + chosen + '\n'
              'source_dimensions=%dx%d\n' % image.size +
              'normalized_sha256=' + hashlib.sha256(clean).hexdigest() + '\n',
              encoding='utf-8')
          PY

          test -s app/src/main/res/drawable/icon.png
          file app/src/main/res/drawable/icon.png

      - name: Prepare v199.6 against current live admin deployment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, os, re

          cfg = json.loads(os.environ['JAYUMINTON_DEPLOY_CONFIG_JSON'])
          deployment_id = str(cfg.get('mainDeploymentId') or '').strip()
          if not deployment_id:
              raise SystemExit('mainDeploymentId missing')

          java = Path('app/src/main/java/com/jayuminton/admin/MainActivity.java')
          text = java.read_text(encoding='utf-8')
          admin_url = 'https://script.google.com/macros/s/' + deployment_id + '/exec?mode=admin&appVersion=199.6&freshAdmin=1'
          text, n = re.subn(
              r'https://script\.google\.com/macros/s/[^"\\]+/exec\?mode=admin[^"\\]*',
              admin_url, text, count=1)
          if n != 1:
              raise SystemExit('ADMIN_URL replacement failed')
          text, n = re.subn(
              r'private static final String APK_WEB_BUILD = "[^"]+";',
              'private static final String APK_WEB_BUILD = "1996-final-fresh-install";',
              text, count=1)
          if n != 1:
              raise SystemExit('APK_WEB_BUILD replacement failed')
          text = re.sub(
              r'JayumintonNative/[0-9A-Za-z.\-]+(?: FreshAdmin/[0-9A-Za-z.\-]+)?',
              'JayumintonNative/199.6 FreshAdmin/1996-final', text)
          java.write_text(text, encoding='utf-8')

          gradle = Path('app/build.gradle')
          g = gradle.read_text(encoding='utf-8')
          g, a = re.subn(r"applicationId\s+['\"][^'\"]+['\"]", "applicationId 'com.jayuminton.admin'", g, count=1)
          g, b = re.subn(r'versionCode\s+\d+', 'versionCode 1996', g, count=1)
          g, c = re.subn(r"versionName\s+['\"][^'\"]+['\"]", "versionName '199.6'", g, count=1)
          if not (a and b and c):
              raise SystemExit('Gradle version/package replacement failed')
          gradle.write_text(g, encoding='utf-8')

          Path('deployment/status/v1996-build-target.txt').write_text(
              'deployment_id=' + deployment_id + '\n' +
              'apk_web_build=1996-final-fresh-install\n', encoding='utf-8')
          PY

          grep -F "applicationId 'com.jayuminton.admin'" app/build.gradle
          grep -F 'versionCode 1996' app/build.gradle
          grep -F "versionName '199.6'" app/build.gradle
          grep -F '1996-final-fresh-install' app/src/main/java/com/jayuminton/admin/MainActivity.java
          grep -F 'WebSettings.LOAD_NO_CACHE' app/src/main/java/com/jayuminton/admin/MainActivity.java
          grep -F 'WebStorage.getInstance().deleteAllData()' app/src/main/java/com/jayuminton/admin/MainActivity.java
          grep -F 'NativeBrowser' app/src/main/java/com/jayuminton/admin/MainActivity.java
          grep -F 'com.android.chrome' app/src/main/java/com/jayuminton/admin/MainActivity.java
          grep -F 'jayuminton-push.web.app' app/src/main/java/com/jayuminton/admin/MainActivity.java
          grep -F 'android:icon="@drawable/icon"' app/src/main/AndroidManifest.xml
          if grep -F 'intent://' app/src/main/java/com/jayuminton/admin/MainActivity.java >/dev/null; then exit 1; fi
          if grep -F 'drive.google.com' app/src/main/java/com/jayuminton/admin/MainActivity.java >/dev/null; then exit 1; fi

      - name: Verify latest requested server state
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'onclick="applyMemberEdit()">수정</button>' source-snapshot/current-main/Admin.html >/dev/null
          if grep -F '수정 저장' source-snapshot/current-main/Admin.html >/dev/null; then exit 1; fi
          grep -F 'id="adminPushAppButton"' source-snapshot/current-main/Admin.html >/dev/null
          grep -F 'async function applyMemberEdit()' source-snapshot/current-main/Script.html >/dev/null
          if grep -E '(async[[:space:]]+){2,}function' source-snapshot/current-main/Script.html >/dev/null; then exit 1; fi
          grep -F "if (!IS_ADMIN) return '';" source-snapshot/current-main/Script.html >/dev/null
          grep -F "if (type === 'wait1_ready') return 2;" source-snapshot/current-main/Script.html >/dev/null
          grep -F "if (type === 'court_assignment') return 4;" source-snapshot/current-main/Script.html >/dev/null
          grep -F 'index * 1700' source-snapshot/current-main/Script.html >/dev/null
          grep -F 'members[index].name = name;' source-snapshot/current-main/Code.js >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          t = Path('source-snapshot/current-main/Script.html').read_text(encoding='utf-8')
          a, b = t.find('<script>'), t.rfind('</script>')
          if a < 0 or b <= a:
              raise SystemExit('Script wrapper missing')
          Path('/tmp/jayuminton-server-check.js').write_text(t[a + len('<script>'):b], encoding='utf-8')
          PY
          node --check /tmp/jayuminton-server-check.js

      - name: Restore release signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signing
          base64 --decode signing/jayuminton-release.keystore.b64 > signing/jayuminton-release.jks
          keytool -list -keystore signing/jayuminton-release.jks -storepass 'JayuMinton14!' -alias jayuminton >/dev/null

      - name: Build signed release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify signed APK package version signature and launcher artwork
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$AAPT" dump badging "$APK" > "$RUNNER_TEMP/new-badging.txt"
          grep -F "package: name='com.jayuminton.admin'" "$RUNNER_TEMP/new-badging.txt"
          grep -F "versionCode='1996'" "$RUNNER_TEMP/new-badging.txt"
          grep -F "versionName='199.6'" "$RUNNER_TEMP/new-badging.txt"

          NEW_ICON=$(sed -n "s/^application-icon-[0-9]*:'\([^']*\)'.*/\1/p" "$RUNNER_TEMP/new-badging.txt" | tail -1)
          if [ -z "$NEW_ICON" ]; then
            NEW_ICON=$(sed -n "s/^application:.* icon='\([^']*\)'.*/\1/p" "$RUNNER_TEMP/new-badging.txt" | head -1)
          fi
          test -n "$NEW_ICON"
          unzip -p "$APK" "$NEW_ICON" > "$RUNNER_TEMP/new-launcher"
          test -s "$RUNNER_TEMP/new-launcher"

          python3 - <<'PY'
          from PIL import Image, ImageChops
          from pathlib import Path
          import os
          src = Image.open('app/src/main/res/drawable/icon.png').convert('RGBA')
          packaged = Image.open(Path(os.environ['RUNNER_TEMP']) / 'new-launcher').convert('RGBA')
          if src.size != packaged.size:
              raise SystemExit('packaged launcher dimensions differ')
          if ImageChops.difference(src, packaged).getbbox() is not None:
              raise SystemExit('packaged launcher pixels differ from extracted dog artwork')
          print('packaged launcher pixels verified:', packaged.size)
          PY
          ls -lh "$APK"

      - name: Publish verified fresh-install APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p releases deployment/status
          cp app/build/outputs/apk/release/app-release.apk "$APK_OUTPUT"
          test -s "$APK_OUTPUT"
          sha256sum "$APK_OUTPUT" | tee deployment/status/v1996-final-apk.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$APK_OUTPUT" deployment/status/v1996-final-apk.sha256 deployment/status/v1996-build-target.txt deployment/status/v1996-dog-icon-source.txt
          git commit -m 'Add verified Jayuminton v199.6 final fresh-install APK'
          git pull --rebase origin main || true
          git push origin main

      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jayuminton-v199.6-final-fresh-install
          path: releases/jayuminton-v199.6-final-fresh-install.apk
          if-no-files-found: error
          retention-days: 30

      - name: Record APK build result
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p deployment/status
          {
            echo 'workflow=Build Jayuminton v199.6 final APK'
            echo 'run_id=${{ github.run_id }}'
            echo 'status=${{ job.status }}'
            echo 'head_sha=${{ github.sha }}'
            echo 'version=199.6'
            echo 'package=com.jayuminton.admin'
            echo 'output=releases/jayuminton-v199.6-final-fresh-install.apk'
            echo 'dog_art=extracted-from-working-v199.3-apk'
            date -u '+updated_at=%Y-%m-%dT%H:%M:%SZ'
          } > deployment/status/v1996-final-apk.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment/status/v1996-final-apk.txt
          git commit -m 'Record v199.6 final APK result: ${{ job.status }}' || exit 0
          git pull --rebase origin main || true
          git push origin main
