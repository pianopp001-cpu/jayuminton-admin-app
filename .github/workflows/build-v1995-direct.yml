name: Build Jayuminton admin v200.4 verified operations APK
run-name: Jayuminton admin v200.4 verified operations fresh-install APK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-v1995-direct.yml'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: jayuminton-v2004-admin-verified-operations-apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      APK_OUTPUT: releases/jayuminton-admin-v200.4-verified-operations.apk
      DOG_ICON_SHA256: a64eaa06107cd20478fe49ab7c10b5b2afd2347533b95c383a439f8705d4a58e
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 35 build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.7'}
      - name: Restore dog launcher icon from library source
        shell: bash
        run: |
          set -euo pipefail
          SRC='app/src/main/res/drawable/icon_from_library.b64'; ICON='app/src/main/res/drawable/icon.png'
          base64 --decode "$SRC" > "$ICON"
          test "$(sha256sum "$ICON" | awk '{print $1}')" = "$DOG_ICON_SHA256"
          mv "$SRC" "$RUNNER_TEMP/icon_from_library.b64"
          mkdir -p deployment/status
          printf 'source=chatgpt-file-library\nsource_name=자유민턴 관리자 배드민턴 아이콘.png\nresource=res/drawable/icon.png\nsha256=%s\n' "$DOG_ICON_SHA256" > deployment/status/v1996-dog-icon-source.txt
      - name: Prepare v200.4 admin native shell with vibration bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          java=Path('app/src/main/java/com/jayuminton/admin/MainActivity.java')
          text=java.read_text(encoding='utf-8')
          admin_url='file:///android_asset/admin/index.html?app=admin&native=1&appVersion=200.4'
          text,n=re.subn(r'(?:https://[^"\\]+(?:web\.app|/exec)|file:///android_asset/admin/index\.html)[^"\\]*',admin_url,text,count=1)
          if n!=1: raise SystemExit('ADMIN_URL replacement failed')
          text,n=re.subn(r'private static final String APK_WEB_BUILD = "[^"]+";','private static final String APK_WEB_BUILD = "2004-admin-finish-vibration";',text,count=1)
          if n!=1: raise SystemExit('APK_WEB_BUILD replacement failed')
          if 'import android.os.VibrationEffect;' not in text:
              text=text.replace('import android.os.Bundle;\n','import android.os.Bundle;\nimport android.os.VibrationEffect;\nimport android.os.Vibrator;\n')
          bridge_anchor='''        @JavascriptInterface\n        public boolean isSpeaking() {\n            return speaking.get() || (tts != null && tts.isSpeaking());\n        }'''
          vibration_methods='''        @JavascriptInterface\n        public boolean isSpeaking() {\n            return speaking.get() || (tts != null && tts.isSpeaking());\n        }\n\n        @JavascriptInterface\n        public void vibrate() {\n            runOnUiThread(() -> {\n                Vibrator vibrator = (Vibrator) getSystemService(VIBRATOR_SERVICE);\n                if (vibrator == null || !vibrator.hasVibrator()) return;\n                long[] pattern = new long[] {\n                    0,360,150,360,150,360,520,\n                    360,150,360,150,360,520,\n                    360,150,360,150,360,520,\n                    360,150,360,150,360,520,\n                    360,150,360,150,360,520,\n                    360,150,360,150,360,520,\n                    360,150,360,150,360,520,\n                    360,150,360,150,360\n                };\n                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {\n                    vibrator.vibrate(VibrationEffect.createWaveform(pattern, -1));\n                } else {\n                    vibrator.vibrate(pattern, -1);\n                }\n            });\n        }\n\n        @JavascriptInterface\n        public void cancelVibration() {\n            runOnUiThread(() -> {\n                Vibrator vibrator = (Vibrator) getSystemService(VIBRATOR_SERVICE);\n                if (vibrator != null) vibrator.cancel();\n            });\n        }'''
          if 'public void vibrate()' not in text:
              if bridge_anchor not in text: raise SystemExit('VoiceBridge insertion anchor missing')
              text=text.replace(bridge_anchor,vibration_methods,1)
          java.write_text(text,encoding='utf-8')
          manifest=Path('app/src/main/AndroidManifest.xml'); m=manifest.read_text(encoding='utf-8')
          if 'android.permission.VIBRATE' not in m:
              manifest_end=m.find('>')
              if manifest_end < 0: raise SystemExit('manifest tag missing')
              m=m[:manifest_end+1]+'\n    <uses-permission android:name="android.permission.VIBRATE" />'+m[manifest_end+1:]
          manifest.write_text(m,encoding='utf-8')
          gradle=Path('app/build.gradle'); g=gradle.read_text(encoding='utf-8')
          g=re.sub(r"applicationId\s+['\"][^'\"]+['\"]","applicationId 'com.jayuminton.admin'",g,count=1)
          g=re.sub(r'versionCode\s+\d+','versionCode 2004',g,count=1)
          g=re.sub(r"versionName\s+['\"][^'\"]+['\"]","versionName '200.4'",g,count=1)
          gradle.write_text(g,encoding='utf-8')
          Path('deployment/status/v2004-build-target.txt').write_text('admin_url='+admin_url+'\napk_web_build=2004-admin-finish-vibration\nfrontend=bundled-cloudflare-android-asset\nfinish_contract=empty-court-allowed_wait-rotation_auto-refresh\nvoice_contract=female-alarm-max_repeat-3_media-duck-6_restore_replay-repeat-stop\nadmin_finish_vibration=3x8_native_bridge\nmember_alert_contract=cloudflare-to-current-selected-member-native-3x8\n',encoding='utf-8')
          PY
          grep -F 'public void vibrate()' app/src/main/java/com/jayuminton/admin/MainActivity.java
          grep -F 'public void cancelVibration()' app/src/main/java/com/jayuminton/admin/MainActivity.java
          grep -F 'VibrationEffect.createWaveform(pattern, -1)' app/src/main/java/com/jayuminton/admin/MainActivity.java
          grep -F 'android.permission.VIBRATE' app/src/main/AndroidManifest.xml
          grep -F 'MEDIA_DUCK_VOLUME_STEP = 6' app/src/main/java/com/jayuminton/admin/MainActivity.java
          grep -F 'VOICE_REPEAT_COUNT = 3' app/src/main/java/com/jayuminton/admin/MainActivity.java
          grep -F 'setStreamVolume(AudioManager.STREAM_ALARM, maxAlarm, 0)' app/src/main/java/com/jayuminton/admin/MainActivity.java
      - name: Bundle verified Cloudflare admin frontend
        shell: bash
        run: |
          set -euo pipefail
          URL='https://jayuminton-push--admin-cloudflare-vnext-z3bgvi2g.web.app/?apkVerify=${{ github.run_id }}'
          curl --fail --location --retry 8 "$URL" -o "$RUNNER_TEMP/admin-cloudflare.html"
          for marker in JAYUMINTON_ADMIN_CLOUDFLARE_FINAL_V1 __JAYUMINTON_ADMIN_VOICE_TEST_REMOVED__ __JAYUMINTON_ADMIN_NEW_BADGE_KO__ __JAYUMINTON_ADMIN_REFRESH_BOUND__ __JAYUMINTON_ADMIN_BLOCKING_SAVE__ jayuminton-admin-finish-alert-v19 __JAYUMINTON_ADMIN_FINISH_ALERT_V19__ __JAYUMINTON_TRANSITION_ALERT__ 'emptyCourtAllowed:true' __JAYUMINTON_ADMIN_EMPTY_COURT_FINISH_V1__ __JAYUMINTON_ADMIN_TRANSITION_ALERT_BRIDGE_V1__ __JAYUMINTON_ADMIN_FAST_SAVE_CLIENT_V1__ __JAYUMINTON_ADMIN_STATISTICS_NO_CLIP_FINAL__ "memberWaitAlert:'member-device-only'" "memberCourtAlert:'member-device-only'" 'adminTransitionVibration:true' 'adminCourtVoice:true' '번 코트 종료되었습니다.'; do grep -F "$marker" "$RUNNER_TEMP/admin-cloudflare.html" >/dev/null; done
          if grep -F 'adminVoiceTestButton' "$RUNNER_TEMP/admin-cloudflare.html" >/dev/null; then exit 1; fi
          if grep -F '>음성테스트<' "$RUNNER_TEMP/admin-cloudflare.html" >/dev/null; then exit 1; fi
          if grep -F 'script.google.com/macros/s/' "$RUNNER_TEMP/admin-cloudflare.html" >/dev/null; then exit 1; fi
          mkdir -p app/src/main/assets/admin
          cp "$RUNNER_TEMP/admin-cloudflare.html" app/src/main/assets/admin/index.html
      - name: Restore release signing key
        run: |
          mkdir -p signing
          base64 --decode signing/jayuminton-release.keystore.b64 > signing/jayuminton-release.jks
          keytool -list -keystore signing/jayuminton-release.jks -storepass 'JayuMinton14!' -alias jayuminton >/dev/null
      - name: Build signed release APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify signed admin operations APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          unzip -p "$APK" assets/admin/index.html > "$RUNNER_TEMP/apk-admin.html"
          for marker in JAYUMINTON_ADMIN_CLOUDFLARE_FINAL_V1 __JAYUMINTON_ADMIN_VOICE_TEST_REMOVED__ __JAYUMINTON_ADMIN_NEW_BADGE_KO__ __JAYUMINTON_ADMIN_REFRESH_BOUND__ __JAYUMINTON_ADMIN_BLOCKING_SAVE__ jayuminton-admin-finish-alert-v19 __JAYUMINTON_ADMIN_FINISH_ALERT_V19__ __JAYUMINTON_TRANSITION_ALERT__ 'emptyCourtAllowed:true' __JAYUMINTON_ADMIN_EMPTY_COURT_FINISH_V1__ __JAYUMINTON_ADMIN_TRANSITION_ALERT_BRIDGE_V1__ __JAYUMINTON_ADMIN_FAST_SAVE_CLIENT_V1__ __JAYUMINTON_ADMIN_STATISTICS_NO_CLIP_FINAL__ "memberWaitAlert:'member-device-only'" "memberCourtAlert:'member-device-only'" 'adminTransitionVibration:true' 'adminCourtVoice:true' '번 코트 종료되었습니다.'; do grep -F "$marker" "$RUNNER_TEMP/apk-admin.html" >/dev/null; done
          unzip -p "$APK" classes.dex | strings | grep -F 'cancelVibration' >/dev/null
          unzip -p "$APK" classes.dex | strings | grep -F 'VibrationEffect' >/dev/null
      - name: Publish verified v200.4 admin APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p releases deployment/status
          cp app/build/outputs/apk/release/app-release.apk "$APK_OUTPUT"
          sha256sum "$APK_OUTPUT" | tee deployment/status/v2004-admin-verified-operations-apk.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '418982588+github-actions[bot]@users.noreply.github.com'
          git add "$APK_OUTPUT" deployment/status/v2004-admin-verified-operations-apk.sha256 deployment/status/v2004-build-target.txt deployment/status/v1996-dog-icon-source.txt
          git commit -m 'Add Jayuminton admin v200.4 verified operations APK'
          git stash push --include-untracked --keep-index --message 'v2004-build-only-source-mutations' || true
          git pull --rebase origin main
          git push origin main
      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v4
        with: {name: jayuminton-admin-v200.4-verified-operations, path: releases/jayuminton-admin-v200.4-verified-operations.apk, if-no-files-found: error, retention-days: 30}
