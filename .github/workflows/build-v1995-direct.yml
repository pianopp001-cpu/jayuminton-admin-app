name: Build Jayuminton admin v199.7 Cloudflare APK
run-name: Jayuminton admin v199.7 Cloudflare vNext APK

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-v1995-direct.yml'

permissions:
  contents: write

concurrency:
  group: jayuminton-v1996-final-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      APK_OUTPUT: releases/jayuminton-admin-v199.7-cloudflare-vnext.apk
      DOG_ICON_SHA256: a64eaa06107cd20478fe49ab7c10b5b2afd2347533b95c383a439f8705d4a58e

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore dog launcher icon from library source
        shell: bash
        run: |
          set -euo pipefail
          SRC='app/src/main/res/drawable/icon_from_library.b64'
          ICON='app/src/main/res/drawable/icon.png'
          test -s "$SRC"
          base64 --decode "$SRC" > "$ICON"
          test -s "$ICON"
          ACTUAL=$(sha256sum "$ICON" | awk '{print $1}')
          echo "library dog icon sha256=$ACTUAL"
          test "$ACTUAL" = "$DOG_ICON_SHA256"
          file "$ICON"
          mkdir -p deployment/status
          {
            echo 'source=chatgpt-file-library'
            echo 'source_name=자유민턴 관리자 배드민턴 아이콘.png'
            echo 'resource=res/drawable/icon.png'
            echo "sha256=$ACTUAL"
          } > deployment/status/v1996-dog-icon-source.txt

      - name: Prepare v199.7 against Cloudflare admin vNext
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, os, re

          java = Path('app/src/main/java/com/jayuminton/admin/MainActivity.java')
          text = java.read_text(encoding='utf-8')
          admin_url = 'https://jayuminton-push--admin-cloudflare-vnext-z3bgvi2g.web.app/?app=admin&native=1&appVersion=199.7'
          text, n = re.subn(
              r'https://[^"\\]+(?:web\.app|/exec)[^"\\]*', admin_url, text, count=1)
          if n != 1:
              raise SystemExit('ADMIN_URL replacement failed')
          text, n = re.subn(
              r'private static final String APK_WEB_BUILD = "[^"]+";',
              'private static final String APK_WEB_BUILD = "1997-cloudflare-admin-vnext";',
              text, count=1)
          if n != 1:
              raise SystemExit('APK_WEB_BUILD replacement failed')
          text = re.sub(
              r'JayumintonNative/[0-9A-Za-z.\-]+(?: FreshAdmin/[0-9A-Za-z.\-]+)?',
              'JayumintonNative/199.7 CloudflareAdmin/1997', text)
          java.write_text(text, encoding='utf-8')

          gradle = Path('app/build.gradle')
          g = gradle.read_text(encoding='utf-8')
          g, a = re.subn(r"applicationId\s+['\"][^'\"]+['\"]", "applicationId 'com.jayuminton.admin'", g, count=1)
          g, b = re.subn(r'versionCode\s+\d+', 'versionCode 1997', g, count=1)
          g, c = re.subn(r"versionName\s+['\"][^'\"]+['\"]", "versionName '199.7'", g, count=1)
          if not (a and b and c):
              raise SystemExit('Gradle version/package replacement failed')
          gradle.write_text(g, encoding='utf-8')

          Path('deployment/status/v1997-build-target.txt').write_text(
              'admin_url=' + admin_url + '\n' +
              'apk_web_build=1997-cloudflare-admin-vnext\n', encoding='utf-8')
          PY

          grep -F "applicationId 'com.jayuminton.admin'" app/build.gradle
          grep -F 'versionCode 1997' app/build.gradle
          grep -F "versionName '199.7'" app/build.gradle
          grep -F '1997-cloudflare-admin-vnext' app/src/main/java/com/jayuminton/admin/MainActivity.java
          grep -F 'admin-cloudflare-vnext-z3bgvi2g.web.app' app/src/main/java/com/jayuminton/admin/MainActivity.java
          grep -F 'WebSettings.LOAD_NO_CACHE' app/src/main/java/com/jayuminton/admin/MainActivity.java
          grep -F 'WebStorage.getInstance().deleteAllData()' app/src/main/java/com/jayuminton/admin/MainActivity.java
          grep -F 'NativeBrowser' app/src/main/java/com/jayuminton/admin/MainActivity.java
          grep -F 'com.android.chrome' app/src/main/java/com/jayuminton/admin/MainActivity.java
          grep -F 'jayuminton-push.web.app' app/src/main/java/com/jayuminton/admin/MainActivity.java
          grep -F 'android:icon="@drawable/icon"' app/src/main/AndroidManifest.xml
          if grep -F 'intent://' app/src/main/java/com/jayuminton/admin/MainActivity.java >/dev/null; then exit 1; fi
          if grep -F 'drive.google.com' app/src/main/java/com/jayuminton/admin/MainActivity.java >/dev/null; then exit 1; fi

      - name: Verify latest requested server state
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'onclick="applyMemberEdit()">수정</button>' source-snapshot/current-main/Admin.html >/dev/null
          if grep -F '수정 저장' source-snapshot/current-main/Admin.html >/dev/null; then exit 1; fi
          grep -F 'id="adminPushAppButton"' source-snapshot/current-main/Admin.html >/dev/null
          grep -F 'async function applyMemberEdit()' source-snapshot/current-main/Script.html >/dev/null
          if grep -E '(async[[:space:]]+){2,}function' source-snapshot/current-main/Script.html >/dev/null; then exit 1; fi
          grep -F "if (!IS_ADMIN) return '';" source-snapshot/current-main/Script.html >/dev/null
          grep -F "if (type === 'wait1_ready') return 2;" source-snapshot/current-main/Script.html >/dev/null
          grep -F "if (type === 'court_assignment') return 4;" source-snapshot/current-main/Script.html >/dev/null
          grep -F 'index * 1700' source-snapshot/current-main/Script.html >/dev/null
          grep -F 'members[index].name = name;' source-snapshot/current-main/Code.js >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          t = Path('source-snapshot/current-main/Script.html').read_text(encoding='utf-8')
          a, b = t.find('<script>'), t.rfind('</script>')
          if a < 0 or b <= a:
              raise SystemExit('Script wrapper missing')
          Path('/tmp/jayuminton-server-check.js').write_text(t[a + len('<script>'):b], encoding='utf-8')
          PY
          node --check /tmp/jayuminton-server-check.js

      - name: Restore release signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signing
          base64 --decode signing/jayuminton-release.keystore.b64 > signing/jayuminton-release.jks
          keytool -list -keystore signing/jayuminton-release.jks -storepass 'JayuMinton14!' -alias jayuminton >/dev/null

      - name: Build signed release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify signed APK package version signature and dog icon
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$AAPT" dump badging "$APK" > "$RUNNER_TEMP/new-badging.txt"
          grep -F "package: name='com.jayuminton.admin'" "$RUNNER_TEMP/new-badging.txt"
          grep -F "versionCode='1997'" "$RUNNER_TEMP/new-badging.txt"
          grep -F "versionName='199.7'" "$RUNNER_TEMP/new-badging.txt"
          unzip -p "$APK" res/drawable/icon.png > "$RUNNER_TEMP/final-dog-icon.png"
          test -s "$RUNNER_TEMP/final-dog-icon.png"
          FINAL_SHA=$(sha256sum "$RUNNER_TEMP/final-dog-icon.png" | awk '{print $1}')
          echo "final packaged dog icon sha256=$FINAL_SHA"
          test "$FINAL_SHA" = "$DOG_ICON_SHA256"
          ls -lh "$APK"

      - name: Publish verified fresh-install APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p releases deployment/status
          cp app/build/outputs/apk/release/app-release.apk "$APK_OUTPUT"
          test -s "$APK_OUTPUT"
          sha256sum "$APK_OUTPUT" | tee deployment/status/v1997-cloudflare-apk.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$APK_OUTPUT" deployment/status/v1997-cloudflare-apk.sha256 deployment/status/v1997-build-target.txt deployment/status/v1996-dog-icon-source.txt
          git commit -m 'Add Jayuminton admin v199.7 Cloudflare vNext APK'
          git pull --rebase origin main || true
          git push origin main

      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jayuminton-admin-v199.7-cloudflare-vnext
          path: releases/jayuminton-admin-v199.7-cloudflare-vnext.apk
          if-no-files-found: error
          retention-days: 30

      - name: Record APK build result
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p deployment/status
          {
            echo 'workflow=Build Jayuminton admin v199.7 Cloudflare APK'
            echo 'run_id=${{ github.run_id }}'
            echo 'status=${{ job.status }}'
            echo 'head_sha=${{ github.sha }}'
            echo 'version=199.7'
            echo 'package=com.jayuminton.admin'
            echo 'output=releases/jayuminton-admin-v199.7-cloudflare-vnext.apk'
            echo 'dog_icon_sha256=a64eaa06107cd20478fe49ab7c10b5b2afd2347533b95c383a439f8705d4a58e'
            echo 'dog_art=chatgpt-file-library-source'
            date -u '+updated_at=%Y-%m-%dT%H:%M:%SZ'
          } > deployment/status/v1997-cloudflare-apk.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment/status/v1997-cloudflare-apk.txt
          git commit -m 'Record v199.7 Cloudflare APK result: ${{ job.status }}' || exit 0
          git pull --rebase origin main || true
          git push origin main
