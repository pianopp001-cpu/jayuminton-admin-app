name: Deploy Cloudflare user push and rebuild user APK

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/user-push/**'
      - '.github/workflows/deploy-cloudflare-user-push.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: jayuminton-cloudflare-user-push
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      JAYUMINTON_PUSH_SHARED_SECRET: ${{ secrets.JAYUMINTON_PUSH_SHARED_SECRET }}
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      WORKER_NAME: jayuminton-user-push
      KV_TITLE: jayuminton-user-push-tokens-v1

    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.7'}
      - run: npm install --global wrangler@latest firebase-tools@latest @google/clasp@latest
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          for value in "$CLOUDFLARE_API_TOKEN" "$CLOUDFLARE_ACCOUNT_ID" "$FIREBASE_SERVICE_ACCOUNT_JSON" "$JAYUMINTON_PUSH_SHARED_SECRET" "$JAYUMINTON_DEPLOY_CONFIG_JSON" "$CLASPRC_JSON"; do test -n "$value"; done
          test "${#JAYUMINTON_PUSH_SHARED_SECRET}" -ge 32
          node --check cloudflare/user-push/worker.js
          C="$RUNNER_TEMP/deploy.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$C"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          MAIN_SCRIPT_ID="$(jq -r '.mainScriptId // empty' "$C")"
          MAIN_DEPLOYMENT_ID="$(jq -r '.mainDeploymentId // empty' "$C")"
          FIREBASE_PROJECT_ID="$(jq -r '.firebaseProjectId // empty' "$C")"
          for value in "$MAIN_SCRIPT_ID" "$MAIN_DEPLOYMENT_ID" "$FIREBASE_PROJECT_ID"; do test -n "$value"; done
          {
            echo "MAIN_SCRIPT_ID=$MAIN_SCRIPT_ID"
            echo "MAIN_DEPLOYMENT_ID=$MAIN_DEPLOYMENT_ID"
            echo "FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID"
          } >> "$GITHUB_ENV"

      - name: Resolve or create Cloudflare KV namespace
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API?per_page=100" > "$RUNNER_TEMP/kv-list.json"
          KV_ID="$(jq -r --arg title "$KV_TITLE" '.result[]? | select(.title==$title) | .id' "$RUNNER_TEMP/kv-list.json" | head -1)"
          if [ -z "$KV_ID" ]; then
            curl --fail --silent --show-error -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              --data "$(jq -nc --arg title "$KV_TITLE" '{title:$title}')" \
              "$API" > "$RUNNER_TEMP/kv-create.json"
            KV_ID="$(jq -r '.result.id // empty' "$RUNNER_TEMP/kv-create.json")"
          fi
          test -n "$KV_ID"
          echo "KV_ID=$KV_ID" >> "$GITHUB_ENV"
          echo 'Cloudflare KV ready.'

      - name: Deploy Cloudflare push Worker
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/user-push-worker"
          mkdir -p "$ROOT"
          cp cloudflare/user-push/worker.js "$ROOT/worker.js"
          cat > "$ROOT/wrangler.toml" <<EOF
          name = "$WORKER_NAME"
          main = "worker.js"
          compatibility_date = "2026-08-21"
          workers_dev = true
          account_id = "$CLOUDFLARE_ACCOUNT_ID"

          [[kv_namespaces]]
          binding = "PUSH_TOKENS"
          id = "$KV_ID"
          EOF
          cd "$ROOT"
          wrangler deploy --config wrangler.toml | tee "$RUNNER_TEMP/wrangler-deploy.txt"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" | wrangler secret put FIREBASE_SERVICE_ACCOUNT_JSON --config wrangler.toml >/dev/null
          printf '%s' "$JAYUMINTON_PUSH_SHARED_SECRET" | wrangler secret put INTERNAL_KEY --config wrangler.toml >/dev/null
          wrangler deploy --config wrangler.toml | tee "$RUNNER_TEMP/wrangler-final.txt"
          WORKER_URL="$(grep -Eo 'https://[^ ]+\.workers\.dev' "$RUNNER_TEMP/wrangler-final.txt" | tail -1)"
          if [ -z "$WORKER_URL" ]; then WORKER_URL="$(grep -Eo 'https://[^ ]+\.workers\.dev' "$RUNNER_TEMP/wrangler-deploy.txt" | tail -1)"; fi
          test -n "$WORKER_URL"
          echo "WORKER_URL=$WORKER_URL" >> "$GITHUB_ENV"
          echo "Cloudflare push Worker: $WORKER_URL"

      - name: Verify Worker and fresh mapping contract
        shell: bash
        run: |
          set -euo pipefail
          sleep 4
          curl --fail --silent --show-error "$WORKER_URL/health" > "$RUNNER_TEMP/health.json"
          jq -e '.ok == true and .service == "jayuminton-cloudflare-user-push"' "$RUNNER_TEMP/health.json" >/dev/null
          FAKE_TOKEN="cf-diagnostic-$(printf '%096d' 0)-$GITHUB_RUN_ID"
          curl --fail --silent --show-error -X POST "$WORKER_URL/api/push/register" \
            -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg id '__cf_diag_member__' --arg name 'DIAG' --arg token "$FAKE_TOKEN" '{memberId:$id,memberName:$name,token:$token,userAgent:"JayumintonNativeAndroid/diag"}')" > "$RUNNER_TEMP/register.json"
          jq -e '.ok == true and .action == "registered"' "$RUNNER_TEMP/register.json" >/dev/null
          curl --fail --silent --show-error -X POST "$WORKER_URL/api/push/status" \
            -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg id '__cf_diag_member__' --arg token "$FAKE_TOKEN" '{memberId:$id,token:$token}')" > "$RUNNER_TEMP/status.json"
          jq -e '.ok == true and .registered == true' "$RUNNER_TEMP/status.json" >/dev/null
          curl --fail --silent --show-error -X POST "$WORKER_URL/api/push/event" \
            -H 'Content-Type: application/json' \
            -H "X-Jayuminton-Key: $JAYUMINTON_PUSH_SHARED_SECRET" \
            --data '{"type":"wait1_ready","assignmentId":"cf-safe-no-target-123456","expectedCourtNo":1,"members":[{"id":"__cf_no_token_member__","name":"DIAG"}]}' > "$RUNNER_TEMP/event.json"
          jq -e '.ok == true and .sent == 0' "$RUNNER_TEMP/event.json" >/dev/null
          curl --fail --silent --show-error -X POST "$WORKER_URL/api/push/unregister" \
            -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg token "$FAKE_TOKEN" '{token:$token}')" > "$RUNNER_TEMP/unregister.json"
          jq -e '.ok == true' "$RUNNER_TEMP/unregister.json" >/dev/null
          echo 'Cloudflare token mapping + protected event contract verified.'

      - name: Point live state-transition sender to Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/main-live"
          mkdir -p "$WORK"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$MAIN_SCRIPT_ID" > "$WORK/.clasp.json"
          (cd "$WORK" && clasp pull)
          python3 - "$WORK/Code.js" "$WORKER_URL/api/push/event" "$JAYUMINTON_PUSH_SHARED_SECRET" <<'PY'
          from pathlib import Path
          import re,sys
          path=Path(sys.argv[1]); url=sys.argv[2]; key=sys.argv[3]
          src=path.read_text(encoding='utf-8')
          def replace_const(name,value):
              global src
              pat=r"((?:const|let|var)\s+"+re.escape(name)+r"\s*=\s*)['\"][^'\"]*['\"]\s*;"
              src2,n=re.subn(pat,lambda m:m.group(1)+repr(value)+';',src,count=1)
              if n != 1: raise SystemExit('missing constant '+name)
              src=src2
          replace_const('JAYUMINTON_STATE_PUSH_RELAY_URL_',url)
          replace_const('JAYUMINTON_STATE_PUSH_INTERNAL_KEY_',key)
          path.write_text(src,encoding='utf-8')
          PY
          grep -F "$WORKER_URL/api/push/event" "$WORK/Code.js" >/dev/null
          node --check "$WORK/Code.js"
          (cd "$WORK" && clasp push --force)
          (cd "$WORK" && clasp create-deployment --deploymentId "$MAIN_DEPLOYMENT_ID" --description "cloudflare user push $GITHUB_RUN_ID")
          echo 'Live state transition sender now targets Cloudflare Worker.'

      - name: Prepare Firebase Android config
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='com.jayuminton.user'
          firebase apps:list ANDROID --project "$FIREBASE_PROJECT_ID" --json > "$RUNNER_TEMP/apps.json"
          APP_ID="$(jq -r --arg pkg "$PACKAGE" '[.. | objects | select(((.packageName? == $pkg) or (.package_name? == $pkg) or (.androidClientInfo?.packageName? == $pkg)) and ((.appId? // .app_id?) != null)) | (.appId? // .app_id?)] | first // empty' "$RUNNER_TEMP/apps.json")"
          test -n "$APP_ID"
          firebase apps:sdkconfig ANDROID "$APP_ID" --project "$FIREBASE_PROJECT_ID" > app/google-services.json
          grep -F 'com.jayuminton.user' app/google-services.json >/dev/null

      - name: Build v1.3.2 user APK with Cloudflare push
        shell: bash
        env:
          PUSH_URL: ${{ env.WORKER_URL }}
        run: |
          set -euo pipefail
          export PUSH_URL="$WORKER_URL"
          SCRIPT="$RUNNER_TEMP/build_user_cloudflare.sh"
          cp deployment/scripts/build_user_native_push_fresh_v110.sh "$SCRIPT"
          for patch in \
            patch_build_user_native_v111.py patch_build_user_native_v112.py patch_build_user_native_v113.py patch_build_user_native_v114.py \
            patch_build_user_native_v115.py patch_build_user_native_v116.py patch_build_user_native_v117.py patch_build_user_native_v118.py \
            patch_build_user_native_v119.py patch_build_user_native_v120_diagnostic.py patch_build_user_native_v121.py patch_build_user_native_v122.py \
            patch_build_user_native_v124_confirmed_overlay.py patch_build_user_native_v126_stop_controller.py patch_build_user_native_v126_raceguard.py \
            patch_build_user_native_v127_member_switch.py patch_build_user_native_v128_repeat_switch.py patch_build_user_native_v129_background_registration.py; do
            python3 "deployment/scripts/$patch" "$SCRIPT"
          done
          python3 deployment/scripts/patch_user_native_v130_vibration_cap8.py "$SCRIPT"
          python3 deployment/scripts/patch_user_native_v132_strict_current_member.py "$SCRIPT"
          grep -F 'VERSION="1.3.2"' "$SCRIPT" >/dev/null
          grep -F 'private static final int MAX_GROUPS = 8;' "$SCRIPT" >/dev/null
          grep -F 'NativePushRegistrar.isCurrentMember(this, targetMemberId)' "$SCRIPT" >/dev/null
          bash "$SCRIPT"
          SRC='releases/jayuminton-courtstatus-v1.3.2-current-member-only.apk'
          test -s "$SRC"
          cp "$SRC" "$RUNNER_TEMP/jayuminton-courtstatus-v1.3.2-cloudflare-push.apk"
          strings "$RUNNER_TEMP/jayuminton-courtstatus-v1.3.2-cloudflare-push.apk" >/dev/null || true

      - name: Publish Cloudflare user APK and status
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git pull --rebase origin main || true
          APK='releases/jayuminton-courtstatus-v1.3.2-cloudflare-push.apk'
          cp "$RUNNER_TEMP/jayuminton-courtstatus-v1.3.2-cloudflare-push.apk" "$APK"
          sha256sum "$APK" > deployment/status/user-cloudflare-push-v1.3.2.sha256
          cat > deployment/status/user-cloudflare-push-v1.3.2.txt <<EOF
          status=success
          push_backend=cloudflare-worker
          mapping_store=cloudflare-kv
          mapping_generation=fresh-v1
          worker_url=$WORKER_URL
          application_id=com.jayuminton.user
          version=1.3.2
          vibration_max_groups=8
          assignment_scope=current-selected-member-only
          user_voice=disabled
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$APK" deployment/status/user-cloudflare-push-v1.3.2.sha256 deployment/status/user-cloudflare-push-v1.3.2.txt
          git commit -m 'Publish user APK with Cloudflare push backend' || exit 0
          git pull --rebase origin main || true
          git push origin main

      - uses: actions/upload-artifact@v4
        with:
          name: jayuminton-user-cloudflare-push-v1.3.2
          path: ${{ runner.temp }}/jayuminton-courtstatus-v1.3.2-cloudflare-push.apk
          if-no-files-found: error
          retention-days: 30
