name: Emergency probe main login runtime
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --global @google/clasp@latest
      - name: Probe exact deployed MAIN source and manifest
        shell: bash
        run: |
          set -euo pipefail
          C="$RUNNER_TEMP/deploy.json"; printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$C"; printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          SID="$(jq -r '.mainScriptId' "$C")"; DID="$(jq -r '.mainDeploymentId' "$C")"
          W="$RUNNER_TEMP/main"; mkdir -p "$W"; printf '{"scriptId":"%s","rootDir":"."}\n' "$SID" > "$W/.clasp.json"; cd "$W"; clasp pull >/dev/null
          echo '=== DEPLOYMENTS ==='; clasp deployments
          echo '=== MANIFEST ==='; cat appsscript.json
          echo '=== REQUIRED SERVER FUNCTIONS ==='
          for f in doGet getPublicState verifyMemberPassword getSystemStatus; do
            if grep -Eq "function[[:space:]]+$f[[:space:]]*\\(" Code.js; then echo "FOUND $f"; else echo "MISSING $f"; fi
          done
          echo '=== VERIFY MEMBER PASSWORD IMPLEMENTATION ==='
          grep -n -A35 -B8 'function verifyMemberPassword' Code.js || true
          echo '=== GET PUBLIC STATE IMPLEMENTATION ==='
          grep -n -A45 -B8 'function getPublicState' Code.js || true
          echo '=== CLIENT LOGIN CALLS ==='
          grep -n -A20 -B10 -E 'verifyMemberPassword|서버에 연결|server|withFailureHandler' Index.html Script.html 2>/dev/null | head -300 || true
          URL="https://script.google.com/macros/s/$DID/exec"
          echo '=== LIVE URL ==='; echo "$URL"
          curl -L -sS --retry 4 --max-time 60 "$URL?mode=user&app=user&probe=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/live.html"
          echo "LIVE_BYTES=$(wc -c < "$RUNNER_TEMP/live.html")"
          grep -Eo '<title>[^<]*|verifyMemberPassword|google\.script\.run|서버에 연결[^<]*' "$RUNNER_TEMP/live.html" | head -80 || true
          echo PROBE_COMPLETE
