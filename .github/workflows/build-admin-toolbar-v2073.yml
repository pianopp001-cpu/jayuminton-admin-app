name: Build admin smart placement v2081

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-admin-toolbar-v2073.yml'
      - 'deployment/jayuminton/admin_toolbar_position_colors_v2073.js'
      - 'deployment/jayuminton/admin_layout_wait4_compact_v2076.js'
      - 'deployment/jayuminton/admin_toolbar_actions_v2077.js'
      - 'deployment/jayuminton/admin_wait4_v2079.trigger'
      - 'deployment/jayuminton/admin_dead_ui_cleanup_v2080.js'
      - 'deployment/jayuminton/admin_smart_placement_v2081.js'
      - 'deployment/jayuminton/admin_server_timeout_v1.js'
      - 'deployment/jayuminton/admin_render_resilience_v1.js'
      - 'deployment/jayuminton/admin_login_load_resilience_v1.js'
      - 'deployment/jayuminton/admin_lock_watchdog_v1.js'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: jayuminton-admin-wait4-v2079
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager 'build-tools;35.0.0' >/dev/null
      - name: Patch v2087 placement safety fix
        shell: bash
        run: |
          set -euo pipefail
          BASE=releases/jayuminton-admin-v207.2-unlimited-selection.apk
          test -s "$BASE"
          ROOT="$RUNNER_TEMP/jm2081"
          mkdir -p "$ROOT/assets/admin"
          cp "$BASE" "$ROOT/base.apk"
          unzip -p "$BASE" assets/admin/index.html > "$ROOT/assets/admin/index.html"
          test -s "$ROOT/assets/admin/index.html"
          python3 - "$ROOT/assets/admin/index.html" deployment/jayuminton/admin_toolbar_position_colors_v2073.js deployment/jayuminton/admin_layout_wait4_compact_v2076.js deployment/jayuminton/admin_toolbar_actions_v2077.js deployment/jayuminton/admin_dead_ui_cleanup_v2080.js deployment/jayuminton/admin_smart_placement_v2081.js deployment/jayuminton/admin_server_timeout_v1.js deployment/jayuminton/admin_render_resilience_v1.js deployment/jayuminton/admin_login_load_resilience_v1.js deployment/jayuminton/admin_lock_watchdog_v1.js <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); html=p.read_text(encoding='utf-8')
          for name in sys.argv[2:]:
              overlay=Path(name).read_text(encoding='utf-8')
              close=html.lower().rfind('</body>')
              if close < 0: raise SystemExit('body close not found')
              html=html[:close]+'<script>\n'+overlay+'\n</script>\n'+html[close:]
          p.write_text(html,encoding='utf-8')
          PY
          grep -F '__JAYUMINTON_ADMIN_UNLIMITED_SELECTION_V2072__' "$ROOT/assets/admin/index.html" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_TOOLBAR_V2073__' "$ROOT/assets/admin/index.html" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_LAYOUT_WAIT4_COMPACT_V2079__' "$ROOT/assets/admin/index.html" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_TOOLBAR_ACTIONS_V2077__' "$ROOT/assets/admin/index.html" >/dev/null
          grep -F 'data-jm-v2079-wait4-index' "$ROOT/assets/admin/index.html" >/dev/null
          grep -F 'jmBottomActionRowV2079' "$ROOT/assets/admin/index.html" >/dev/null
          grep -F 'jm-v2079-new-badge' "$ROOT/assets/admin/index.html" >/dev/null
          grep -F "for(var key of ['4','3'])" "$ROOT/assets/admin/index.html" >/dev/null
          grep -F 'moveOrSwapMember' "$ROOT/assets/admin/index.html" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_DEAD_UI_CLEANUP_V2080__' "$ROOT/assets/admin/index.html" >/dev/null
          grep -F 'jmDeadUiCleanupV2080Style' "$ROOT/assets/admin/index.html" >/dev/null
          grep -F '#quickSelectedCount,#mobileSelectedCount,#mdBulkDeleteCount,.admin-member-bulk-panel,.jm-v2080-return-btn{display:none!important}' "$ROOT/assets/admin/index.html" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_SMART_PLACEMENT_V2081__' "$ROOT/assets/admin/index.html" >/dev/null
          grep -F "setProperty('position','fixed','important')" "$ROOT/assets/admin/index.html" >/dev/null
          grep -F '자리교환' "$ROOT/assets/admin/index.html" >/dev/null
          grep -F 'swapBtn.click()' "$ROOT/assets/admin/index.html" >/dev/null
          grep -F "SELECTED.clear()" "$ROOT/assets/admin/index.html" >/dev/null
          grep -F 'window.__jmDuplicateNameFixV1' "$ROOT/assets/admin/index.html" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_SERVER_TIMEOUT_V1__' "$ROOT/assets/admin/index.html" >/dev/null
          grep -F '__jmServerTimeoutV1' "$ROOT/assets/admin/index.html" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_RENDER_RESILIENCE_V1__' "$ROOT/assets/admin/index.html" >/dev/null
          grep -F 'jm-render-resilience' "$ROOT/assets/admin/index.html" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_LOGIN_LOAD_RESILIENCE_V1__' "$ROOT/assets/admin/index.html" >/dev/null
          grep -F 'jm-login-load-resilience' "$ROOT/assets/admin/index.html" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_LOCK_WATCHDOG_V1__' "$ROOT/assets/admin/index.html" >/dev/null
          grep -F 'jm-lock-watchdog' "$ROOT/assets/admin/index.html" >/dev/null
          cp "$ROOT/base.apk" "$ROOT/patched-unsigned.apk"
          (cd "$ROOT" && zip -q -u patched-unsigned.apk assets/admin/index.html)
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$ROOT/patched-unsigned.apk" "$ROOT/aligned.apk"
          base64 --decode signing/jayuminton-release.keystore.b64 > "$ROOT/release.jks"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$ROOT/release.jks" --ks-key-alias jayuminton --ks-pass pass:'JayuMinton14!' --key-pass pass:'JayuMinton14!' --out "$ROOT/jayuminton-admin-v208.17-login-timeout-selfcontained-fix.apk" "$ROOT/aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$ROOT/jayuminton-admin-v208.17-login-timeout-selfcontained-fix.apk"
          unzip -p "$ROOT/jayuminton-admin-v208.17-login-timeout-selfcontained-fix.apk" assets/admin/index.html > "$ROOT/verify.html"
          grep -F '__JAYUMINTON_ADMIN_LAYOUT_WAIT4_COMPACT_V2079__' "$ROOT/verify.html" >/dev/null
          grep -F 'data-jm-v2079-wait4-index' "$ROOT/verify.html" >/dev/null
          grep -F 'jmBottomActionRowV2079' "$ROOT/verify.html" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_DEAD_UI_CLEANUP_V2080__' "$ROOT/verify.html" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_SMART_PLACEMENT_V2081__' "$ROOT/verify.html" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_SERVER_TIMEOUT_V1__' "$ROOT/verify.html" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_RENDER_RESILIENCE_V1__' "$ROOT/verify.html" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_LOGIN_LOAD_RESILIENCE_V1__' "$ROOT/verify.html" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_LOCK_WATCHDOG_V1__' "$ROOT/verify.html" >/dev/null
      - name: Publish APK
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/jm2081"
          APK="$ROOT/jayuminton-admin-v208.17-login-timeout-selfcontained-fix.apk"
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          mkdir -p releases deployment/status
          cp "$APK" releases/jayuminton-admin-v208.17-login-timeout-selfcontained-fix.apk
          printf 'status=success\nversion=208.17\nfeature=login-timeout-selfcontained-fix\nbase=v207.2-unlimited-selection\nrun_id=%s\nsha256=%s\n' "$GITHUB_RUN_ID" "$SHA" > deployment/status/v20817-login-timeout-selfcontained-fix.txt
          git add releases/jayuminton-admin-v208.17-login-timeout-selfcontained-fix.apk deployment/status/v20817-login-timeout-selfcontained-fix.txt
          git commit -m 'Publish admin v208.17: login/state-load timeout no longer depends on another script wrapping window.server first' || exit 0
          git push origin HEAD:main
