name: Build admin smart placement v2081

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-admin-toolbar-v2073.yml'
      - 'deployment/jayuminton/admin_toolbar_position_colors_v2073.js'
      - 'deployment/jayuminton/admin_layout_wait4_compact_v2076.js'
      - 'deployment/jayuminton/admin_toolbar_actions_v2077.js'
      - 'deployment/jayuminton/admin_wait4_v2079.trigger'
      - 'deployment/jayuminton/admin_dead_ui_cleanup_v2080.js'
      - 'deployment/jayuminton/admin_smart_placement_v2081.js'
      - 'deployment/jayuminton/admin_server_timeout_v1.js'
      - 'deployment/jayuminton/admin_render_resilience_v1.js'
      - 'deployment/jayuminton/admin_login_load_resilience_v1.js'
      - 'deployment/jayuminton/admin_lock_watchdog_v1.js'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: jayuminton-admin-wait4-v2079
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager 'build-tools;35.0.0' >/dev/null
      - name: Patch v2087 placement safety fix
        shell: bash
        run: |
          set -euo pipefail
          BASE=releases/jayuminton-admin-v207.2-unlimited-selection.apk
          test -s "$BASE"
          ROOT="$RUNNER_TEMP/jm2081"
          mkdir -p "$ROOT/assets/admin"
          cp "$BASE" "$ROOT/base.apk"
          unzip -p "$BASE" assets/admin/index.html > "$ROOT/assets/admin/index.html"
          test -s "$ROOT/assets/admin/index.html"

          python3 - "$ROOT/assets/admin/index.html" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          text = p.read_text(encoding='utf-8')
          marker = 'jmSyncPublicMemosIdempotentFix'
          if marker not in text:
              # syncPublicMemos() (JAYUMINTON_ADMIN_CLOUDFLARE_SAVE_LOCK_V24) is called
              # from its OWN MutationObserver watching document.documentElement for any
              # childList/subtree change, with zero debouncing. It unconditionally does
              # node.textContent=memo -- setting textContent to a string ALWAYS mutates
              # the DOM (replaces the text node) even when the value is unchanged, which
              # itself is a childList mutation that the SAME observer is watching for.
              # The instant any member card has a non-empty publicMemo, this becomes a
              # true infinite loop: mutate -> observer fires -> mutate again -> forever,
              # saturating the event loop with zero error and zero visible symptom other
              # than the page going completely unresponsive within seconds. Confirmed via
              # the actual live production state (fetched with the admin PIN): one member
              # already has a non-empty publicMemo, so this fires on every real load.
              # Guarding both assignments with a value check breaks the cycle -- once the
              # text/hidden state matches, the next call becomes a true no-op.
              old = "if(node){node.textContent=memo;node.hidden=!memo;}"
              new = "if(node){if(node.textContent!==memo)node.textContent=memo;/* jmSyncPublicMemosIdempotentFix */if(node.hidden!==!memo)node.hidden=!memo;}"
              if old not in text:
                  raise SystemExit('syncPublicMemos anchor not found -- base HTML has drifted')
              text = text.replace(old, new, 1)
          if marker not in text:
              raise SystemExit('syncPublicMemos idempotent fix did not apply')
          p.write_text(text, encoding='utf-8')
          PY

          python3 - "$ROOT/assets/admin/index.html" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          text = p.read_text(encoding='utf-8')
          marker = 'jmSyncPublicMemosNodePlacementFixV1'
          if marker not in text:
              # v208.28: THE actual root cause of the "freezes right after login,
              # every time, on any real data" bug -- found via elimination testing
              # (bisecting out save-lock/team-state/refreshCurrentMemberPassword one
              # at a time against real production data with heartbeat+entry/exit
              # instrumented logging) and confirmed by reading exactly what this
              # branch does. When a member has a non-empty publicMemo but their card
              # has no '.member-info-detail' element (happens whenever both grade
              # and experience are empty -- memberInfoDetailHtml() returns '' in
              # that case, so the span is never rendered at all), `target` falls
              # back to `card` itself, and insertAdjacentElement('afterend', node)
              # inserts the new memo span as CARD'S OWN NEXT SIBLING -- outside of
              # card, not inside it. The next syncPublicMemos() call (triggered by
              # this very insertion, via the file's own MutationObserver on
              # document.documentElement) does card.querySelector('.member-public-
              # memo',...) which can never find a node that lives outside card, so
              # it inserts ANOTHER one, forever: real production data has exactly
              # one member with a memo and no grade/experience, so this fires on
              # every single login. jmSyncPublicMemosIdempotentFix (v208.20) only
              # guarded the update-existing-node path; this create-node path was
              # never idempotent to begin with. Fix: append directly to card when
              # there's no '.member-info-detail' anchor, so the node is always a
              # findable descendant of card on the next pass. Empirically verified
              # against real production data with heartbeat instrumentation: with
              # only this fix (save-lock/team-state left fully intact), the login
              # completes and heartbeat keeps running indefinitely -- courts,
              # members and wait1-5 all render correctly.
              old = (
                  "if(memo&&!node){node=document.createElement('span');node.className='member-public-memo';"
                  "var target=card.querySelector('.member-info-detail')||card;target.insertAdjacentElement('afterend',node);}"
              )
              new = (
                  "if(memo&&!node){node=document.createElement('span');node.className='member-public-memo';"
                  "/* jmSyncPublicMemosNodePlacementFixV1 */var target=card.querySelector('.member-info-detail');"
                  "if(target)target.insertAdjacentElement('afterend',node);else card.appendChild(node);}"
              )
              if old not in text:
                  raise SystemExit('syncPublicMemos node-placement anchor not found -- base HTML has drifted')
              text = text.replace(old, new, 1)
          if marker not in text:
              raise SystemExit('syncPublicMemos node-placement fix did not apply')
          p.write_text(text, encoding='utf-8')
          PY
          grep -F 'jmSyncPublicMemosNodePlacementFixV1' "$ROOT/assets/admin/index.html" >/dev/null
          grep -F 'jmSyncPublicMemosIdempotentFix' "$ROOT/assets/admin/index.html" >/dev/null

          python3 - "$ROOT/assets/admin/index.html" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          text = p.read_text(encoding='utf-8')
          marker = 'jmSyncPublicMemosDisabledDuplicateFixV1'
          if marker not in text:
              # v208.29: every real card template pairs memberInfoDetailHtml(member)
              # with adminVnextMemberBadges(member) (6 call sites: courts, wait
              # groups, exclusion panel, etc.) -- adminVnextMemberBadges() already
              # renders a member's publicMemo. Two OTHER, later-added code paths
              # independently render the SAME publicMemo a second and third time:
              # the md-card-timer overlay's memberInfoDetailHtml() override adds its
              # own '.member-md-memo' span, and syncPublicMemos() (already fixed
              # for its infinite-loop bug in v208.28) adds a third '.member-public-
              # memo' span via direct DOM insertion. Net effect: any member with a
              # memo shows it three times on the same card. Disable both of the
              # later, redundant paths -- adminVnextMemberBadges() remains the
              # single, consistently-used source of truth for memo display; no
              # existing caller reads syncPublicMemos()'s or mdProfileParts' memo
              # output for anything else.
              old_md = (
                  "    var memo=String(member.publicMemo||member.memo||'').trim();\n"
                  "    if(grade)parts.push(escapeMemberInfo(grade));\n"
                  "    if(exp)parts.push(escapeMemberInfo('구력 '+exp));\n"
                  "    if(memo)parts.push('<span class=\"member-md-memo\">'+escapeMemberInfo(memo)+'</span>');\n"
              )
              new_md = (
                  "    /* jmSyncPublicMemosDisabledDuplicateFixV1: memo is already shown once via adminVnextMemberBadges() */\n"
                  "    if(grade)parts.push(escapeMemberInfo(grade));\n"
                  "    if(exp)parts.push(escapeMemberInfo('구력 '+exp));\n"
              )
              if old_md not in text:
                  raise SystemExit('mdProfileParts memo anchor not found -- base HTML has drifted')
              text = text.replace(old_md, new_md, 1)

              old_sync = "  function syncPublicMemos(){\n    var s=null;"
              new_sync = (
                  "  function syncPublicMemos(){\n"
                  "    /* jmSyncPublicMemosDisabledDuplicateFixV1: this overlay's own\n"
                  "       memo span duplicated what adminVnextMemberBadges() already\n"
                  "       renders on every real card template; disabled entirely rather\n"
                  "       than leave dead insertion logic idempotency-guarded for no\n"
                  "       reason. */\n"
                  "    return;\n"
                  "    var s=null;"
              )
              if old_sync not in text:
                  raise SystemExit('syncPublicMemos entry anchor not found -- base HTML has drifted')
              text = text.replace(old_sync, new_sync, 1)
          if marker not in text:
              raise SystemExit('duplicate-memo disable fix did not apply')
          p.write_text(text, encoding='utf-8')
          PY
          grep -F 'jmSyncPublicMemosDisabledDuplicateFixV1' "$ROOT/assets/admin/index.html" >/dev/null

          python3 - "$ROOT/assets/admin/index.html" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          text = p.read_text(encoding='utf-8')
          marker = 'jmUnifiedSwapMoveFixV1'
          if marker not in text:
              # v208.30: the multi-select toolbar has two separate modes -- 'move'
              # (click an empty court/wait slot to place selected members there) and
              # 'swap' (click an occupied card to exchange positions with it) -- but
              # the always-visible bottom "자리교환" button only ever triggers 'swap'
              # mode (it clicks the toolbar's [data-a="swap"] button). Since 'swap'
              # mode's handleClick branch only recognizes clicks on member cards
              # (mode==='swap'&&c), clicking an EMPTY court/wait slot while in swap
              # mode does nothing at all -- exactly "코트에 멤버가 안들어가". 'move'
              # mode already handles empty slots correctly, but nothing in the
              # current UI exposes it as an always-visible button the way swap is.
              # Requested fix: one button that does both -- click an empty slot to
              # move there, click an occupied card to swap with it. Extend 'swap'
              # mode's click handling to also recognize empty slots (reusing the
              # exact same detection 'move' mode already uses), collecting a target
              # list that can contain a mix of member-id strings (swap) and
              # {type,key} location objects (move), then dispatch each target to the
              # right RPC in executeSwapTargets(). 'move' mode and
              # executeMoveTargets() are untouched -- kept as-is for anything that
              # still starts 'move' mode directly.
              old_exec = (
                  "async function executeSwapTargets(){var src=Array.from(selected);if(src.length!==targets.length)return;setBusy(true);"
                  "try{for(var i=0;i<src.length;i++)await rpc('swapMembers',[null,[src[i]],[targets[i]]]);"
                  "await refresh();clearSelection();toast(src.length+'명 교환 완료');}"
                  "catch(e){toast(e&&e.message||e,true);mode='';targets=[];}finally{setBusy(false);paint();}}"
              )
              new_exec = (
                  "async function executeSwapTargets(){/* jmUnifiedSwapMoveFixV1 */var src=Array.from(selected);if(src.length!==targets.length)return;setBusy(true);"
                  "try{for(var i=0;i<src.length;i++){var t=targets[i];"
                  "if(t&&typeof t==='object'){await rpc('moveOrSwapMember',[null,src[i],t.type,t.type==='wait'?String(Number(t.key)-1):String(t.key),'']);}"
                  "else{await rpc('swapMembers',[null,[src[i]],[t]]);}}"
                  "await refresh();clearSelection();toast(src.length+'명 처리 완료');}"
                  "catch(e){toast(e&&e.message||e,true);mode='';targets=[];}finally{setBusy(false);paint();}}"
              )
              if old_exec not in text:
                  raise SystemExit('executeSwapTargets anchor not found -- base HTML has drifted')
              text = text.replace(old_exec, new_exec, 1)

              old_start = (
                  "function startMode(next){if(!selected.size)return toast('멤버를 먼저 선택하세요.',true);"
                  "mode=next;targets=[];paint();toast(next==='move'?'이동할 빈자리를 선택하세요.':'교환할 상대 멤버를 선택하세요.');}"
              )
              new_start = (
                  "function startMode(next){if(!selected.size)return toast('멤버를 먼저 선택하세요.',true);"
                  "mode=next;targets=[];paint();toast(next==='move'?'이동할 빈자리를 선택하세요.':'빈자리(이동) 또는 상대 멤버(교환)를 선택하세요.');}"
              )
              if old_start not in text:
                  raise SystemExit('startMode anchor not found -- base HTML has drifted')
              text = text.replace(old_start, new_start, 1)

              old_click = (
                  "function handleClick(ev){if(busy)return;var r=root();if(!r||!r.contains(ev.target))return;var c=cardFrom(ev.target);"
                  "if(mode==='swap'&&c){var id=memberId(c);if(selected.has(id)||targets.indexOf(id)>=0)return;"
                  "ev.preventDefault();ev.stopImmediatePropagation();targets.push(id);paint();"
                  "if(targets.length===selected.size)executeSwapTargets();return;}"
                  "if(mode==='move'){var empty=ev.target.closest&&ev.target.closest('.empty,.quick-empty-slot,[onclick*=\"handleEmptySlotTap\"],[onclick*=\"handleMemberWaitEmptyTap\"]');"
                  "var t=parseEmpty(empty);if(t){ev.preventDefault();ev.stopImmediatePropagation();targets.push(t);paint();"
                  "if(targets.length===selected.size)executeMoveTargets();}return;}"
                  "if(!c)return;var id=memberId(c);ev.preventDefault();ev.stopImmediatePropagation();"
                  "if(selected.has(id))selected.delete(id);else selected.add(id);paint();}"
              )
              new_click = (
                  "function handleClick(ev){/* jmUnifiedSwapMoveFixV1 */if(busy)return;var r=root();if(!r||!r.contains(ev.target))return;var c=cardFrom(ev.target);"
                  "if(mode==='swap'){"
                  "if(c){var id=memberId(c);if(selected.has(id)||targets.indexOf(id)>=0)return;"
                  "ev.preventDefault();ev.stopImmediatePropagation();targets.push(id);paint();"
                  "if(targets.length===selected.size)executeSwapTargets();return;}"
                  "var emptyS=ev.target.closest&&ev.target.closest('.empty,.quick-empty-slot,[onclick*=\"handleEmptySlotTap\"],[onclick*=\"handleMemberWaitEmptyTap\"]');"
                  "var tS=parseEmpty(emptyS);if(tS){ev.preventDefault();ev.stopImmediatePropagation();targets.push(tS);paint();"
                  "if(targets.length===selected.size)executeSwapTargets();}return;}"
                  "if(mode==='move'){var empty=ev.target.closest&&ev.target.closest('.empty,.quick-empty-slot,[onclick*=\"handleEmptySlotTap\"],[onclick*=\"handleMemberWaitEmptyTap\"]');"
                  "var t=parseEmpty(empty);if(t){ev.preventDefault();ev.stopImmediatePropagation();targets.push(t);paint();"
                  "if(targets.length===selected.size)executeMoveTargets();}return;}"
                  "if(!c)return;var id=memberId(c);ev.preventDefault();ev.stopImmediatePropagation();"
                  "if(selected.has(id))selected.delete(id);else selected.add(id);paint();}"
              )
              if old_click not in text:
                  raise SystemExit('handleClick anchor not found -- base HTML has drifted')
              text = text.replace(old_click, new_click, 1)
          if marker not in text:
              raise SystemExit('unified swap/move fix did not apply')
          p.write_text(text, encoding='utf-8')
          PY
          grep -F 'jmUnifiedSwapMoveFixV1' "$ROOT/assets/admin/index.html" >/dev/null

          python3 - "$ROOT/assets/admin/index.html" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          text = p.read_text(encoding='utf-8')
          marker = 'jmBatchFillEmptyLocationV1'
          if marker not in text:
              # v208.31: v208.30 made clicking an empty slot in 'swap' mode
              # recognized at all, but it still required exactly one click per
              # selected member -- select 4, click 4 different empty slots one at
              # a time, waiting on a full RPC round trip in between each (the
              # loop in executeSwapTargets() awaits sequentially). Reported as
              # both too slow and inconsistent (a later click's RPC can complete
              # while an earlier one is still resolving/failing, so what's shown
              # doesn't always match what's actually saved). The server already
              # supports batch placement: assignMembersToCourt/
              # assignMembersToWaitGroup take a memberIds ARRAY and move all of
              # them in one atomic moveMutation call (one capacity check for the
              # whole group, not one check per person). Change: clicking ANY
              # empty slot while in 'swap' mode with members selected now places
              # the ENTIRE current selection into that one location with a
              # single RPC call -- one click, one request, all-or-nothing. The
              # per-target collection loop (targets.push, 1:1 count matching) is
              # kept only for the occupied-card swap path, where a 1:1
              # correspondence is the actual intended semantics (member A
              # trades with member B) and batching doesn't apply.
              old_exec2 = (
                  "async function executeSwapTargets(){/* jmUnifiedSwapMoveFixV1 */var src=Array.from(selected);if(src.length!==targets.length)return;setBusy(true);"
                  "try{for(var i=0;i<src.length;i++){var t=targets[i];"
                  "if(t&&typeof t==='object'){await rpc('moveOrSwapMember',[null,src[i],t.type,t.type==='wait'?String(Number(t.key)-1):String(t.key),'']);}"
                  "else{await rpc('swapMembers',[null,[src[i]],[t]]);}}"
                  "await refresh();clearSelection();toast(src.length+'명 처리 완료');}"
                  "catch(e){toast(e&&e.message||e,true);mode='';targets=[];}finally{setBusy(false);paint();}}"
              )
              new_exec2 = (
                  "async function executeSwapTargets(){/* jmUnifiedSwapMoveFixV1 */var src=Array.from(selected);if(src.length!==targets.length)return;setBusy(true);"
                  "try{for(var i=0;i<src.length;i++){var t=targets[i];"
                  "if(t&&typeof t==='object'){await rpc('moveOrSwapMember',[null,src[i],t.type,t.type==='wait'?String(Number(t.key)-1):String(t.key),'']);}"
                  "else{await rpc('swapMembers',[null,[src[i]],[t]]);}}"
                  "await refresh();clearSelection();toast(src.length+'명 처리 완료');}"
                  "catch(e){toast(e&&e.message||e,true);mode='';targets=[];}finally{setBusy(false);paint();}}"
                  "async function executeBatchFillLocation(loc){/* jmBatchFillEmptyLocationV1 */var ids=Array.from(selected);if(!ids.length)return;setBusy(true);"
                  "try{if(loc.type==='court'){await rpc('assignMembersToCourt',[null,loc.key,ids]);}"
                  "else{await rpc('assignMembersToWaitGroup',[null,String(Number(loc.key)-1),ids]);}"
                  "await refresh();clearSelection();toast(ids.length+'명 배치 완료');}"
                  "catch(e){toast(e&&e.message||e,true);}finally{mode='';targets=[];setBusy(false);paint();}}"
              )
              if old_exec2 not in text:
                  raise SystemExit('executeSwapTargets (v208.30 output) anchor not found -- base HTML has drifted')
              text = text.replace(old_exec2, new_exec2, 1)

              old_click2 = (
                  "var emptyS=ev.target.closest&&ev.target.closest('.empty,.quick-empty-slot,[onclick*=\"handleEmptySlotTap\"],[onclick*=\"handleMemberWaitEmptyTap\"]');"
                  "var tS=parseEmpty(emptyS);if(tS){ev.preventDefault();ev.stopImmediatePropagation();targets.push(tS);paint();"
                  "if(targets.length===selected.size)executeSwapTargets();}return;}"
              )
              new_click2 = (
                  "var emptyS=ev.target.closest&&ev.target.closest('.empty,.quick-empty-slot,[onclick*=\"handleEmptySlotTap\"],[onclick*=\"handleMemberWaitEmptyTap\"]');"
                  "var tS=parseEmpty(emptyS);if(tS){ev.preventDefault();ev.stopImmediatePropagation();"
                  "/* jmBatchFillEmptyLocationV1 */executeBatchFillLocation(tS);}return;}"
              )
              if old_click2 not in text:
                  raise SystemExit('handleClick empty-slot branch (v208.30 output) anchor not found -- base HTML has drifted')
              text = text.replace(old_click2, new_click2, 1)
          if marker not in text:
              raise SystemExit('batch-fill empty location fix did not apply')
          p.write_text(text, encoding='utf-8')
          PY
          grep -F 'jmBatchFillEmptyLocationV1' "$ROOT/assets/admin/index.html" >/dev/null

          python3 - "$ROOT/assets/admin/index.html" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          text = p.read_text(encoding='utf-8')
          marker = 'jmAutoAssignTargetFillFixV1'
          if marker not in text:
              # v208.35: reported as "탭해서 지정한 빈자리에 사람을 눌러도 안
              # 들어간다" -- the base app has ANOTHER, older placement flow
              # besides select-then-click-empty: tap an empty court/wait slot
              # FIRST (with nothing selected) to arm AUTO_ASSIGN_TARGET (a
              # yellow-highlighted "chosen empty seat"), then tap a MEMBER card
              # to drop them into it one at a time -- handled natively by
              # assignMemberToChosenEmpty()/handleSelectableMemberClick(),
              # wired via each member button's own inline onclick attribute.
              # But this toolbar's handleClick is a CAPTURE-phase listener on
              # #adminApp, installed ahead of the target's own bubble-phase
              # onclick -- its final branch (mode==='', c is a member card)
              # unconditionally calls stopImmediatePropagation() and just
              # toggles this toolbar's OWN checkbox selection, which stops the
              # event before it ever reaches the native onclick. So tapping
              # the member after arming a target only adds a checkmark; the
              # native fill code never runs, and the armed target is left
              # stuck highlighted with nobody placed -- reproduced live for
              # both 대기1 and court targets, not location-specific. Fix:
              # when a target is armed, this branch must not intercept at
              # all -- return before preventDefault/stopImmediatePropagation
              # so the click reaches the member's real onclick normally.
              old = (
                  "if(!c)return;var id=memberId(c);ev.preventDefault();ev.stopImmediatePropagation();"
                  "if(selected.has(id))selected.delete(id);else selected.add(id);paint();}"
              )
              new = (
                  "if(!c)return;var id=memberId(c);/* jmAutoAssignTargetFillFixV1 */"
                  "if(typeof AUTO_ASSIGN_TARGET!=='undefined'&&AUTO_ASSIGN_TARGET)return;"
                  "ev.preventDefault();ev.stopImmediatePropagation();"
                  "if(selected.has(id))selected.delete(id);else selected.add(id);paint();}"
              )
              if old not in text:
                  raise SystemExit('handleClick final branch anchor not found -- base HTML has drifted')
              text = text.replace(old, new, 1)

              # Second half of the same fix: the base HTML also has an entirely
              # separate, unrelated multigroup-swap script that overrides
              # window.handleCourtMemberTap/handleWaitMemberTap -- meaning EVERY
              # member card's real click handler is this file's tap(), not
              # assignMemberToChosenEmpty(). Freeing handleClick above (so the
              # click reaches the card's own onclick) isn't enough by itself --
              # tap() has to know about an armed AUTO_ASSIGN_TARGET too, or it
              # just treats the tap as a group-swap source/target pick instead.
              old_tap = (
                  "function tap(location,id,event){\n"
                  "    if(event&&event.target&&event.target.closest('button.small'))return;\n"
                  "    if(event){event.preventDefault();event.stopPropagation();}\n"
                  "    id=String(id); location={type:String(location.type),index:String(location.index||'')};\n"
                  "    if(sourcePick&&sourcePick.ids.indexOf(id)>=0){\n"
                  "      toggleIn(sourcePick,id);\n"
                  "      if(!sourcePick.ids.length){sourcePick=targetPick;targetPick=null;}\n"
                  "      sync();return;\n"
                  "    }\n"
                  "    if(targetPick&&targetPick.ids.indexOf(id)>=0){\n"
                  "      toggleIn(targetPick,id);\n"
                  "      if(!targetPick.ids.length)targetPick=null;\n"
                  "      sync();return;\n"
                  "    }\n"
