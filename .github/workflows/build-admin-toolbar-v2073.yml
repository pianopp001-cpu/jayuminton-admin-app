name: Build admin smart placement v2081

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-admin-toolbar-v2073.yml'
      - 'deployment/jayuminton/admin_toolbar_position_colors_v2073.js'
      - 'deployment/jayuminton/admin_layout_wait4_compact_v2076.js'
      - 'deployment/jayuminton/admin_toolbar_actions_v2077.js'
      - 'deployment/jayuminton/admin_wait4_v2079.trigger'
      - 'deployment/jayuminton/admin_dead_ui_cleanup_v2080.js'
      - 'deployment/jayuminton/admin_smart_placement_v2081.js'
      - 'deployment/jayuminton/admin_server_timeout_v1.js'
      - 'deployment/jayuminton/admin_render_resilience_v1.js'
      - 'deployment/jayuminton/admin_login_load_resilience_v1.js'
      - 'deployment/jayuminton/admin_lock_watchdog_v1.js'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: jayuminton-admin-wait4-v2079
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager 'build-tools;35.0.0' >/dev/null
      - name: Patch v2087 placement safety fix
        shell: bash
        run: |
          set -euo pipefail
          BASE=releases/jayuminton-admin-v207.2-unlimited-selection.apk
          test -s "$BASE"
          ROOT="$RUNNER_TEMP/jm2081"
          mkdir -p "$ROOT/assets/admin"
          cp "$BASE" "$ROOT/base.apk"
          unzip -p "$BASE" assets/admin/index.html > "$ROOT/assets/admin/index.html"
          test -s "$ROOT/assets/admin/index.html"

          python3 - "$ROOT/assets/admin/index.html" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          text = p.read_text(encoding='utf-8')
          marker = 'jmSyncPublicMemosIdempotentFix'
          if marker not in text:
              # syncPublicMemos() (JAYUMINTON_ADMIN_CLOUDFLARE_SAVE_LOCK_V24) is called
              # from its OWN MutationObserver watching document.documentElement for any
              # childList/subtree change, with zero debouncing. It unconditionally does
              # node.textContent=memo -- setting textContent to a string ALWAYS mutates
              # the DOM (replaces the text node) even when the value is unchanged, which
              # itself is a childList mutation that the SAME observer is watching for.
              # The instant any member card has a non-empty publicMemo, this becomes a
              # true infinite loop: mutate -> observer fires -> mutate again -> forever,
              # saturating the event loop with zero error and zero visible symptom other
              # than the page going completely unresponsive within seconds. Confirmed via
              # the actual live production state (fetched with the admin PIN): one member
              # already has a non-empty publicMemo, so this fires on every real load.
              # Guarding both assignments with a value check breaks the cycle -- once the
              # text/hidden state matches, the next call becomes a true no-op.
              old = "if(node){node.textContent=memo;node.hidden=!memo;}"
              new = "if(node){if(node.textContent!==memo)node.textContent=memo;/* jmSyncPublicMemosIdempotentFix */if(node.hidden!==!memo)node.hidden=!memo;}"
              if old not in text:
                  raise SystemExit('syncPublicMemos anchor not found -- base HTML has drifted')
              text = text.replace(old, new, 1)
          if marker not in text:
              raise SystemExit('syncPublicMemos idempotent fix did not apply')
          p.write_text(text, encoding='utf-8')
          PY
          grep -F 'jmSyncPublicMemosIdempotentFix' "$ROOT/assets/admin/index.html" >/dev/null

          python3 - "$ROOT/assets/admin/index.html" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          text = p.read_text(encoding='utf-8')
          marker = 'jmUnlimitedPaintIdempotentFix'
          if marker not in text:
              # installJayumintonAdminUnlimitedSelectionV2072 -- the foundational
              # selection toolbar every other overlay this session builds on top of.
              # Its paint() is called from its own MutationObserver on #adminApp
              # (childList+subtree) AND directly from handleClick on every member
              # tap, so it is by far the hottest path of all the observer-triggered
              # functions audited this session. It unconditionally rewrote
              # #jmUnlimitedCount/#jmUnlimitedMode textContent on every single call,
              # with zero value check and zero special state required (fires from
              # the very first paint() after login) -- confirmed via live production
              # state inspection and a real-browser mutation-count harness that this
              # is a genuine, state-independent, self-sustaining loop distinct from
              # the ones already fixed in v208.20/v208.22.
              old = (
                  "var c=document.getElementById('jmUnlimitedCount');"
                  "if(c)c.textContent=selected.size+'명 선택';"
                  "var m=document.getElementById('jmUnlimitedMode');"
                  "if(m)m.textContent=mode==='move'?'자리이동 대상 '+targets.length+'/'+selected.size:"
                  "mode==='swap'?'교환 대상 '+targets.length+'/'+selected.size:'원하는 멤버를 계속 선택하세요';}"
              )
              new = (
                  "var c=document.getElementById('jmUnlimitedCount');"
                  "if(c){var __jmCText=selected.size+'명 선택';"
                  "/* jmUnlimitedPaintIdempotentFix */if(c.textContent!==__jmCText)c.textContent=__jmCText;}"
                  "var m=document.getElementById('jmUnlimitedMode');"
                  "if(m){var __jmMText=mode==='move'?'자리이동 대상 '+targets.length+'/'+selected.size:"
                  "mode==='swap'?'교환 대상 '+targets.length+'/'+selected.size:'원하는 멤버를 계속 선택하세요';"
                  "if(m.textContent!==__jmMText)m.textContent=__jmMText;}}"
              )
              if old not in text:
                  raise SystemExit('v2072 paint() anchor not found -- base HTML has drifted')
              text = text.replace(old, new, 1)
          if marker not in text:
              raise SystemExit('v2072 paint() idempotent fix did not apply')
          p.write_text(text, encoding='utf-8')
          PY
          grep -F 'jmUnlimitedPaintIdempotentFix' "$ROOT/assets/admin/index.html" >/dev/null

          python3 - "$ROOT/assets/admin/index.html" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          text = p.read_text(encoding='utf-8')
          marker = 'jmTempTeamVisualStyleIdempotentFix'
          if marker not in text:
              # installAdminTempTeamVisualV2048's style() rewrote a <style> tag's
              # textContent to the same constant string on every call, and its
              # observer watches document.documentElement -- the entire page, the
              # broadest possible scope, so it re-fired on any mutation anywhere.
              # Compare against the desired content (not just existence of the tag)
              # so it still self-heals if anything else ever alters this style tag,
              # while becoming a true no-op once the content already matches --
              # confirmed via a full-codebase grep that nothing else currently
              # reads/writes this specific tag's id, so this is belt-and-suspenders
              # rather than a live risk, but costs nothing to keep.
              old = (
                  "  function style(){\n"
                  "    var s=document.getElementById(id);\n"
                  "    if(!s){s=document.createElement('style');s.id=id;(document.head||document.documentElement).appendChild(s);}\n"
                  "    s.textContent=''\n"
                  "      +'#adminApp .jm-temp-team-v2047,'\n"
                  "      +'#adminApp .jm-temp-team-v2047.jm-temp-pair,'\n"
                  "      +'#adminApp .has-member-team.jm-temp-team-v2047,'\n"
                  "      +'#adminApp .has-member-team.jm-temp-team-v2047.jm-temp-pair{'\n"
                  "      +'box-shadow:0 0 0 4px #d4a017!important;'\n"
                  "      +'outline:2px solid rgba(212,160,23,.28)!important;outline-offset:1px!important}'\n"
                  "      +'#adminApp .jm-source-selected:not(.jm-temp-team-v2047),#adminApp .jm-target-selected:not(.jm-temp-team-v2047){box-shadow:0 0 0 4px #16a34a!important}'\n"
                  "      +'#adminApp .jm-temp-pair-pending{outline:none!important}'\n"
                  "      +'#adminApp .jm-temp-team-v2047 .member-team-badge{display:none!important}';\n"
                  "  }\n"
              )
              new = (
                  "  function style(){\n"
                  "    /* jmTempTeamVisualStyleIdempotentFix */\n"
                  "    var s=document.getElementById(id);\n"
                  "    if(!s){s=document.createElement('style');s.id=id;(document.head||document.documentElement).appendChild(s);}\n"
                  "    var __jmDesired=''\n"
                  "      +'#adminApp .jm-temp-team-v2047,'\n"
                  "      +'#adminApp .jm-temp-team-v2047.jm-temp-pair,'\n"
                  "      +'#adminApp .has-member-team.jm-temp-team-v2047,'\n"
                  "      +'#adminApp .has-member-team.jm-temp-team-v2047.jm-temp-pair{'\n"
                  "      +'box-shadow:0 0 0 4px #d4a017!important;'\n"
                  "      +'outline:2px solid rgba(212,160,23,.28)!important;outline-offset:1px!important}'\n"
                  "      +'#adminApp .jm-source-selected:not(.jm-temp-team-v2047),#adminApp .jm-target-selected:not(.jm-temp-team-v2047){box-shadow:0 0 0 4px #16a34a!important}'\n"
                  "      +'#adminApp .jm-temp-pair-pending{outline:none!important}'\n"
                  "      +'#adminApp .jm-temp-team-v2047 .member-team-badge{display:none!important}';\n"
                  "    if(s.textContent!==__jmDesired)s.textContent=__jmDesired;\n"
                  "  }\n"
              )
              if old not in text:
                  raise SystemExit('v2048 style() anchor not found -- base HTML has drifted')
              text = text.replace(old, new, 1)
          if marker not in text:
              raise SystemExit('v2048 style() idempotent fix did not apply')
          p.write_text(text, encoding='utf-8')
          PY
          grep -F 'jmTempTeamVisualStyleIdempotentFix' "$ROOT/assets/admin/index.html" >/dev/null

          python3 - "$ROOT/assets/admin/index.html" deployment/jayuminton/admin_toolbar_position_colors_v2073.js deployment/jayuminton/admin_layout_wait4_compact_v2076.js deployment/jayuminton/admin_toolbar_actions_v2077.js deployment/jayuminton/admin_dead_ui_cleanup_v2080.js deployment/jayuminton/admin_smart_placement_v2081.js deployment/jayuminton/admin_server_timeout_v1.js deployment/jayuminton/admin_render_resilience_v1.js deployment/jayuminton/admin_login_load_resilience_v1.js deployment/jayuminton/admin_lock_watchdog_v1.js <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); html=p.read_text(encoding='utf-8')
          for name in sys.argv[2:]:
              overlay=Path(name).read_text(encoding='utf-8')
              close=html.lower().rfind('</body>')
              if close < 0: raise SystemExit('body close not found')
              html=html[:close]+'<script>\n'+overlay+'\n</script>\n'+html[close:]
          p.write_text(html,encoding='utf-8')
          PY
          grep -F '__JAYUMINTON_ADMIN_UNLIMITED_SELECTION_V2072__' "$ROOT/assets/admin/index.html" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_TOOLBAR_V2073__' "$ROOT/assets/admin/index.html" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_LAYOUT_WAIT4_COMPACT_V2079__' "$ROOT/assets/admin/index.html" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_TOOLBAR_ACTIONS_V2077__' "$ROOT/assets/admin/index.html" >/dev/null
          grep -F 'data-jm-v2079-wait4-index' "$ROOT/assets/admin/index.html" >/dev/null
          grep -F 'jmBottomActionRowV2079' "$ROOT/assets/admin/index.html" >/dev/null
          grep -F 'jm-v2079-new-badge' "$ROOT/assets/admin/index.html" >/dev/null
          grep -F 'jmBadgesIdempotentFix' "$ROOT/assets/admin/index.html" >/dev/null
          grep -F "for(var key of ['4','3'])" "$ROOT/assets/admin/index.html" >/dev/null
          grep -F 'moveOrSwapMember' "$ROOT/assets/admin/index.html" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_DEAD_UI_CLEANUP_V2080__' "$ROOT/assets/admin/index.html" >/dev/null
          grep -F 'jmDeadUiCleanupV2080Style' "$ROOT/assets/admin/index.html" >/dev/null
          grep -F '#quickSelectedCount,#mobileSelectedCount,#mdBulkDeleteCount,.admin-member-bulk-panel,.jm-v2080-return-btn{display:none!important}' "$ROOT/assets/admin/index.html" >/dev/null
          grep -F 'jmTagReturnButtonIdempotentFix' "$ROOT/assets/admin/index.html" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_SMART_PLACEMENT_V2081__' "$ROOT/assets/admin/index.html" >/dev/null
          grep -F "setProperty('position','fixed','important')" "$ROOT/assets/admin/index.html" >/dev/null
          grep -F '자리교환' "$ROOT/assets/admin/index.html" >/dev/null
          grep -F 'swapBtn.click()' "$ROOT/assets/admin/index.html" >/dev/null
          grep -F "SELECTED.clear()" "$ROOT/assets/admin/index.html" >/dev/null
          grep -F 'window.__jmDuplicateNameFixV1' "$ROOT/assets/admin/index.html" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_SERVER_TIMEOUT_V1__' "$ROOT/assets/admin/index.html" >/dev/null
          grep -F '__jmServerTimeoutV1' "$ROOT/assets/admin/index.html" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_RENDER_RESILIENCE_V1__' "$ROOT/assets/admin/index.html" >/dev/null
          grep -F 'jm-render-resilience' "$ROOT/assets/admin/index.html" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_LOGIN_LOAD_RESILIENCE_V1__' "$ROOT/assets/admin/index.html" >/dev/null
          grep -F 'jm-login-load-resilience' "$ROOT/assets/admin/index.html" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_LOCK_WATCHDOG_V1__' "$ROOT/assets/admin/index.html" >/dev/null
          grep -F 'jm-lock-watchdog' "$ROOT/assets/admin/index.html" >/dev/null
          cp "$ROOT/base.apk" "$ROOT/patched-unsigned.apk"
          (cd "$ROOT" && zip -q -u patched-unsigned.apk assets/admin/index.html)
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$ROOT/patched-unsigned.apk" "$ROOT/aligned.apk"
          base64 --decode signing/jayuminton-release.keystore.b64 > "$ROOT/release.jks"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$ROOT/release.jks" --ks-key-alias jayuminton --ks-pass pass:'JayuMinton14!' --key-pass pass:'JayuMinton14!' --out "$ROOT/jayuminton-admin-v208.24-html-fix.apk" "$ROOT/aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$ROOT/jayuminton-admin-v208.24-html-fix.apk"
          unzip -p "$ROOT/jayuminton-admin-v208.24-html-fix.apk" assets/admin/index.html > "$ROOT/verify.html"
          grep -F '__JAYUMINTON_ADMIN_LAYOUT_WAIT4_COMPACT_V2079__' "$ROOT/verify.html" >/dev/null
          grep -F 'data-jm-v2079-wait4-index' "$ROOT/verify.html" >/dev/null
          grep -F 'jmBottomActionRowV2079' "$ROOT/verify.html" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_DEAD_UI_CLEANUP_V2080__' "$ROOT/verify.html" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_SMART_PLACEMENT_V2081__' "$ROOT/verify.html" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_SERVER_TIMEOUT_V1__' "$ROOT/verify.html" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_RENDER_RESILIENCE_V1__' "$ROOT/verify.html" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_LOGIN_LOAD_RESILIENCE_V1__' "$ROOT/verify.html" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_LOCK_WATCHDOG_V1__' "$ROOT/verify.html" >/dev/null
          grep -F 'jmSyncPublicMemosIdempotentFix' "$ROOT/verify.html" >/dev/null
          grep -F 'jmUnlimitedPaintIdempotentFix' "$ROOT/verify.html" >/dev/null
          grep -F 'jmTempTeamVisualStyleIdempotentFix' "$ROOT/verify.html" >/dev/null
          grep -F 'jmBadgesIdempotentFix' "$ROOT/verify.html" >/dev/null
          grep -F 'jmTagReturnButtonIdempotentFix' "$ROOT/verify.html" >/dev/null
      - name: Publish APK
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/jm2081"
          APK="$ROOT/jayuminton-admin-v208.24-html-fix.apk"
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          mkdir -p releases deployment/status
          cp "$APK" releases/jayuminton-admin-v208.24-html-fix.apk
          printf 'status=success\nversion=208.24\nfeature=html-idempotent-mutation-fix\nbase=v207.2-unlimited-selection\nrun_id=%s\nsha256=%s\n' "$GITHUB_RUN_ID" "$SHA" > deployment/status/v20824-html-fix.txt
          git add releases/jayuminton-admin-v208.24-html-fix.apk deployment/status/v20824-html-fix.txt
          git commit -m 'Publish admin v208.24-html-fix: idempotent paint()/style()/badges()/tagReturnButton() mutation fixes' || exit 0
          git push origin HEAD:main
