name: Build admin smart placement v2081

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-admin-toolbar-v2073.yml'
      - 'deployment/jayuminton/admin_toolbar_position_colors_v2073.js'
      - 'deployment/jayuminton/admin_layout_wait4_compact_v2076.js'
      - 'deployment/jayuminton/admin_toolbar_actions_v2077.js'
      - 'deployment/jayuminton/admin_wait4_v2079.trigger'
      - 'deployment/jayuminton/admin_dead_ui_cleanup_v2080.js'
      - 'deployment/jayuminton/admin_smart_placement_v2081.js'
      - 'deployment/jayuminton/admin_server_timeout_v1.js'
      - 'deployment/jayuminton/admin_render_resilience_v1.js'
      - 'deployment/jayuminton/admin_login_load_resilience_v1.js'
      - 'deployment/jayuminton/admin_lock_watchdog_v1.js'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: jayuminton-admin-wait4-v2079
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager 'build-tools;35.0.0' >/dev/null
      - name: Patch v2087 placement safety fix
        shell: bash
        run: |
          set -euo pipefail
          BASE=releases/jayuminton-admin-v207.2-unlimited-selection.apk
          test -s "$BASE"
          ROOT="$RUNNER_TEMP/jm2081"
          mkdir -p "$ROOT/assets/admin"
          cp "$BASE" "$ROOT/base.apk"
          unzip -p "$BASE" assets/admin/index.html > "$ROOT/assets/admin/index.html"
          test -s "$ROOT/assets/admin/index.html"

          python3 - "$ROOT/assets/admin/index.html" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          text = p.read_text(encoding='utf-8')
          marker = 'jmSyncPublicMemosIdempotentFix'
          if marker not in text:
              # syncPublicMemos() (JAYUMINTON_ADMIN_CLOUDFLARE_SAVE_LOCK_V24) is called
              # from its OWN MutationObserver watching document.documentElement for any
              # childList/subtree change, with zero debouncing. It unconditionally does
              # node.textContent=memo -- setting textContent to a string ALWAYS mutates
              # the DOM (replaces the text node) even when the value is unchanged, which
              # itself is a childList mutation that the SAME observer is watching for.
              # The instant any member card has a non-empty publicMemo, this becomes a
              # true infinite loop: mutate -> observer fires -> mutate again -> forever,
              # saturating the event loop with zero error and zero visible symptom other
              # than the page going completely unresponsive within seconds. Confirmed via
              # the actual live production state (fetched with the admin PIN): one member
              # already has a non-empty publicMemo, so this fires on every real load.
              # Guarding both assignments with a value check breaks the cycle -- once the
              # text/hidden state matches, the next call becomes a true no-op.
              old = "if(node){node.textContent=memo;node.hidden=!memo;}"
              new = "if(node){if(node.textContent!==memo)node.textContent=memo;/* jmSyncPublicMemosIdempotentFix */if(node.hidden!==!memo)node.hidden=!memo;}"
              if old not in text:
                  raise SystemExit('syncPublicMemos anchor not found -- base HTML has drifted')
              text = text.replace(old, new, 1)
          if marker not in text:
              raise SystemExit('syncPublicMemos idempotent fix did not apply')
          p.write_text(text, encoding='utf-8')
          PY
          grep -F 'jmSyncPublicMemosIdempotentFix' "$ROOT/assets/admin/index.html" >/dev/null

          python3 - "$ROOT/assets/admin/index.html" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          text = p.read_text(encoding='utf-8')
          marker = 'jmUnlimitedPaintIdempotentFix'
          if marker not in text:
              # installJayumintonAdminUnlimitedSelectionV2072 -- the foundational
              # selection toolbar every other overlay this session builds on top of.
              # Its paint() is called from its own MutationObserver on #adminApp
              # (childList+subtree) AND directly from handleClick on every member
              # tap, so it is by far the hottest path of all the observer-triggered
              # functions audited this session. It unconditionally rewrote
              # #jmUnlimitedCount/#jmUnlimitedMode textContent on every single call,
              # with zero value check and zero special state required (fires from
              # the very first paint() after login) -- confirmed via live production
              # state inspection and a real-browser mutation-count harness that this
              # is a genuine, state-independent, self-sustaining loop distinct from
              # the ones already fixed in v208.20/v208.22.
              old = (
                  "var c=document.getElementById('jmUnlimitedCount');"
                  "if(c)c.textContent=selected.size+'명 선택';"
                  "var m=document.getElementById('jmUnlimitedMode');"
                  "if(m)m.textContent=mode==='move'?'자리이동 대상 '+targets.length+'/'+selected.size:"
                  "mode==='swap'?'교환 대상 '+targets.length+'/'+selected.size:'원하는 멤버를 계속 선택하세요';}"
              )
              new = (
                  "var c=document.getElementById('jmUnlimitedCount');"
                  "if(c){var __jmCText=selected.size+'명 선택';"
                  "/* jmUnlimitedPaintIdempotentFix */if(c.textContent!==__jmCText)c.textContent=__jmCText;}"
                  "var m=document.getElementById('jmUnlimitedMode');"
                  "if(m){var __jmMText=mode==='move'?'자리이동 대상 '+targets.length+'/'+selected.size:"
                  "mode==='swap'?'교환 대상 '+targets.length+'/'+selected.size:'원하는 멤버를 계속 선택하세요';"
                  "if(m.textContent!==__jmMText)m.textContent=__jmMText;}}"
              )
              if old not in text:
                  raise SystemExit('v2072 paint() anchor not found -- base HTML has drifted')
              text = text.replace(old, new, 1)
          if marker not in text:
              raise SystemExit('v2072 paint() idempotent fix did not apply')
          p.write_text(text, encoding='utf-8')
          PY
          grep -F 'jmUnlimitedPaintIdempotentFix' "$ROOT/assets/admin/index.html" >/dev/null

          python3 - "$ROOT/assets/admin/index.html" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          text = p.read_text(encoding='utf-8')
          marker = 'jmTempTeamVisualStyleIdempotentFix'
          if marker not in text:
              # installAdminTempTeamVisualV2048's style() rewrote a <style> tag's
              # textContent to the same constant string on every call, and its
              # observer watches document.documentElement -- the entire page, the
              # broadest possible scope, so it re-fired on any mutation anywhere.
              # Compare against the desired content (not just existence of the tag)
              # so it still self-heals if anything else ever alters this style tag,
              # while becoming a true no-op once the content already matches --
              # confirmed via a full-codebase grep that nothing else currently
              # reads/writes this specific tag's id, so this is belt-and-suspenders
              # rather than a live risk, but costs nothing to keep.
              old = (
                  "  function style(){\n"
                  "    var s=document.getElementById(id);\n"
                  "    if(!s){s=document.createElement('style');s.id=id;(document.head||document.documentElement).appendChild(s);}\n"
                  "    s.textContent=''\n"
                  "      +'#adminApp .jm-temp-team-v2047,'\n"
                  "      +'#adminApp .jm-temp-team-v2047.jm-temp-pair,'\n"
                  "      +'#adminApp .has-member-team.jm-temp-team-v2047,'\n"
                  "      +'#adminApp .has-member-team.jm-temp-team-v2047.jm-temp-pair{'\n"
                  "      +'box-shadow:0 0 0 4px #d4a017!important;'\n"
                  "      +'outline:2px solid rgba(212,160,23,.28)!important;outline-offset:1px!important}'\n"
                  "      +'#adminApp .jm-source-selected:not(.jm-temp-team-v2047),#adminApp .jm-target-selected:not(.jm-temp-team-v2047){box-shadow:0 0 0 4px #16a34a!important}'\n"
                  "      +'#adminApp .jm-temp-pair-pending{outline:none!important}'\n"
                  "      +'#adminApp .jm-temp-team-v2047 .member-team-badge{display:none!important}';\n"
                  "  }\n"
              )
              new = (
                  "  function style(){\n"
                  "    /* jmTempTeamVisualStyleIdempotentFix */\n"
                  "    var s=document.getElementById(id);\n"
                  "    if(!s){s=document.createElement('style');s.id=id;(document.head||document.documentElement).appendChild(s);}\n"
                  "    var __jmDesired=''\n"
                  "      +'#adminApp .jm-temp-team-v2047,'\n"
                  "      +'#adminApp .jm-temp-team-v2047.jm-temp-pair,'\n"
                  "      +'#adminApp .has-member-team.jm-temp-team-v2047,'\n"
                  "      +'#adminApp .has-member-team.jm-temp-team-v2047.jm-temp-pair{'\n"
                  "      +'box-shadow:0 0 0 4px #d4a017!important;'\n"
                  "      +'outline:2px solid rgba(212,160,23,.28)!important;outline-offset:1px!important}'\n"
                  "      +'#adminApp .jm-source-selected:not(.jm-temp-team-v2047),#adminApp .jm-target-selected:not(.jm-temp-team-v2047){box-shadow:0 0 0 4px #16a34a!important}'\n"
                  "      +'#adminApp .jm-temp-pair-pending{outline:none!important}'\n"
                  "      +'#adminApp .jm-temp-team-v2047 .member-team-badge{display:none!important}';\n"
                  "    if(s.textContent!==__jmDesired)s.textContent=__jmDesired;\n"
                  "  }\n"
              )
              if old not in text:
                  raise SystemExit('v2048 style() anchor not found -- base HTML has drifted')
              text = text.replace(old, new, 1)
          if marker not in text:
              raise SystemExit('v2048 style() idempotent fix did not apply')
          p.write_text(text, encoding='utf-8')
          PY
          grep -F 'jmTempTeamVisualStyleIdempotentFix' "$ROOT/assets/admin/index.html" >/dev/null

          python3 - "$ROOT/assets/admin/index.html" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          text = p.read_text(encoding='utf-8')
          marker = 'jmAdminLoginDiagnosticV1'
          if marker not in text:
              # Diagnostic-only, v208.25: adminLogin() -> openAdminApp() -> loadState()
              # has zero error handling anywhere in the base app. adminApp is made
              # visible BEFORE getCurrentMemberPassword/getPublicState/renderState run,
              # so if any one of those throws or rejects, the screen is left showing
              # only the static chrome (header/quick-assign shell) with courts/members/
              # wait-groups never painted, and NO error is ever shown -- an unhandled
              # promise rejection is invisible without devtools. This tags each step
              # with its own name and re-throws, so the single alert this file's global
              # unhandledrejection/window.onerror handler shows carries a full
              # function:step breadcrumb pointing at exactly where it failed. No
              # behavior changes on the success path -- purely additive error surfacing.
              old_load = (
                  "async function loadState() {\n"
                  "  const nextState = await server('getPublicState', []);\n"
                  "  if (!IS_ADMIN && LAST_PUBLIC_STATE) {\n"
                  "    detectMemberForegroundTransition(LAST_PUBLIC_STATE, nextState);\n"
                  "  }\n"
                  "  renderState(nextState);\n"
                  "  if (!IS_ADMIN) {\n"
                  "    LAST_PUBLIC_STATE = JSON.parse(JSON.stringify(nextState));\n"
                  "  }\n"
                  "}\n"
              )
              new_load = (
                  "async function loadState() {\n"
                  "  /* jmAdminLoginDiagnosticV1 */\n"
                  "  const nextState = await server('getPublicState', []).catch(function(__jmE){\n"
                  "    throw new Error('[loadState:getPublicState] ' + (__jmE && __jmE.message || __jmE));\n"
                  "  });\n"
                  "  if (!IS_ADMIN && LAST_PUBLIC_STATE) {\n"
                  "    detectMemberForegroundTransition(LAST_PUBLIC_STATE, nextState);\n"
                  "  }\n"
                  "  try {\n"
                  "    renderState(nextState);\n"
                  "  } catch (__jmE2) {\n"
                  "    throw new Error('[loadState:renderState] ' + (__jmE2 && __jmE2.message || __jmE2));\n"
                  "  }\n"
                  "  if (!IS_ADMIN) {\n"
                  "    LAST_PUBLIC_STATE = JSON.parse(JSON.stringify(nextState));\n"
                  "  }\n"
                  "}\n"
              )
              if old_load not in text:
                  raise SystemExit('loadState() anchor not found -- base HTML has drifted')
              text = text.replace(old_load, new_load, 1)

              old_admin_login = (
                  "async function adminLogin() {\n"
                  "  const pin =\n"
                  "    document\n"
                  "      .getElementById(\n"
                  "        'adminPinInput'\n"
                  "      )\n"
                  "      .value\n"
                  "      .trim();\n"
                  "\n"
                  "  const result =\n"
                  "    await server(\n"
                  "      'createAdminSession',\n"
                  "      [pin]\n"
                  "    );\n"
                  "\n"
                  "  if (!result || !result.ok) {\n"
                  "    alert('관리자 PIN이 틀렸습니다.');\n"
                  "    return;\n"
                  "  }\n"
                  "\n"
                  "  localStorage.setItem(\n"
                  "    ADMIN_AUTH_KEY,\n"
                  "    String(result.token)\n"
                  "  );\n"
                  "\n"
                  "  await openAdminApp(\n"
                  "    String(result.token)\n"
                  "  );\n"
                  "}\n"
              )
              new_admin_login = (
                  "async function adminLogin() {\n"
                  "  const pin =\n"
                  "    document\n"
                  "      .getElementById(\n"
                  "        'adminPinInput'\n"
                  "      )\n"
                  "      .value\n"
                  "      .trim();\n"
                  "\n"
                  "  let result;\n"
                  "  try {\n"
                  "    result = await server('createAdminSession', [pin]);\n"
                  "  } catch (__jmE) {\n"
                  "    alert('[진단] adminLogin:createAdminSession 실패 - ' + (__jmE && __jmE.message || __jmE));\n"
                  "    return;\n"
                  "  }\n"
                  "\n"
                  "  if (!result || !result.ok) {\n"
                  "    alert('관리자 PIN이 틀렸습니다.');\n"
                  "    return;\n"
                  "  }\n"
                  "\n"
                  "  localStorage.setItem(\n"
                  "    ADMIN_AUTH_KEY,\n"
                  "    String(result.token)\n"
                  "  );\n"
                  "\n"
                  "  try {\n"
                  "    await openAdminApp(String(result.token));\n"
                  "  } catch (__jmE2) {\n"
                  "    throw new Error('[adminLogin:openAdminApp] ' + (__jmE2 && __jmE2.message || __jmE2));\n"
                  "  }\n"
                  "}\n"
              )
              if old_admin_login not in text:
                  raise SystemExit('adminLogin() anchor not found -- base HTML has drifted')
              text = text.replace(old_admin_login, new_admin_login, 1)

              old_open = (
                  "async function openAdminApp(credential) {\n"
                  "  ADMIN_PIN_VALUE = credential;\n"
                  "  updateVoiceGuideButton();\n"
                  "  updateReplayVoiceButton();\n"
                  "  updateVoiceRepeatButton();\n"
                  "  updateSoundUnlockButton();\n"
                  "\n"
                  "  document\n"
                  "    .getElementById(\n"
                  "      'adminLoginBox'\n"
                  "    )\n"
                  "    .classList\n"
                  "    .add('hidden');\n"
                  "\n"
                  "  document\n"
                  "    .getElementById(\n"
                  "      'adminApp'\n"
                  "    )\n"
                  "    .classList\n"
                  "    .remove('hidden');\n"
                  "\n"
                  "  document\n"
                  "    .getElementById(\n"
                  "      'currentMemberPassword'\n"
                  "    )\n"
                  "    .textContent =\n"
                  "      await server(\n"
                  "        'getCurrentMemberPassword',\n"
                  "        [credential]\n"
                  "      );\n"
                  "\n"
                  "  await loadState();\n"
                  "  await loadSystemStatus();\n"
                  "}\n"
              )
              new_open = (
                  "async function openAdminApp(credential) {\n"
                  "  ADMIN_PIN_VALUE = credential;\n"
                  "  updateVoiceGuideButton();\n"
                  "  updateReplayVoiceButton();\n"
                  "  updateVoiceRepeatButton();\n"
                  "  updateSoundUnlockButton();\n"
                  "\n"
                  "  document\n"
                  "    .getElementById(\n"
                  "      'adminLoginBox'\n"
                  "    )\n"
                  "    .classList\n"
                  "    .add('hidden');\n"
                  "\n"
                  "  document\n"
                  "    .getElementById(\n"
                  "      'adminApp'\n"
                  "    )\n"
                  "    .classList\n"
                  "    .remove('hidden');\n"
                  "\n"
                  "  try {\n"
                  "    document.getElementById('currentMemberPassword').textContent =\n"
                  "      await server('getCurrentMemberPassword', [credential]);\n"
                  "  } catch (__jmE) {\n"
                  "    throw new Error('[openAdminApp:getCurrentMemberPassword] ' + (__jmE && __jmE.message || __jmE));\n"
                  "  }\n"
                  "\n"
                  "  try {\n"
                  "    await loadState();\n"
                  "  } catch (__jmE2) {\n"
                  "    throw new Error('[openAdminApp:loadState] ' + (__jmE2 && __jmE2.message || __jmE2));\n"
                  "  }\n"
                  "  try {\n"
                  "    await loadSystemStatus();\n"
                  "  } catch (__jmE3) {\n"
                  "    throw new Error('[openAdminApp:loadSystemStatus] ' + (__jmE3 && __jmE3.message || __jmE3));\n"
                  "  }\n"
                  "}\n"
              )
              if old_open not in text:
                  raise SystemExit('openAdminApp() anchor not found -- base HTML has drifted')
              text = text.replace(old_open, new_open, 1)
          if marker not in text:
              raise SystemExit('admin login diagnostic patch did not apply')
          p.write_text(text, encoding='utf-8')
          PY
          grep -F 'jmAdminLoginDiagnosticV1' "$ROOT/assets/admin/index.html" >/dev/null

          python3 - "$ROOT/assets/admin/index.html" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          text = p.read_text(encoding='utf-8')
          marker = 'jmSkipAutoSystemStatusV1'
          if marker not in text:
              # v208.27: loadSystemStatus() only refreshes the minor "최근
              # 백업/저장 시각" status text. Reliably reproduced live, against
              # real production data, that calling it automatically right
              # after login freezes the entire JS main thread completely --
              # even a setInterval heartbeat stops firing, which no JS-level
              # timeout can ever recover from. This code path is currently
              # shadowed by admin_login_load_resilience_v1.js's own
              # openAdminApp() replacement (already patched separately), but
              # keep both call sites consistent as defense in depth. Nothing
              # else depends on this call succeeding.
              old = (
                  "  try {\n"
                  "    await loadState();\n"
                  "  } catch (__jmE2) {\n"
                  "    throw new Error('[openAdminApp:loadState] ' + (__jmE2 && __jmE2.message || __jmE2));\n"
                  "  }\n"
                  "  try {\n"
                  "    await loadSystemStatus();\n"
                  "  } catch (__jmE3) {\n"
                  "    throw new Error('[openAdminApp:loadSystemStatus] ' + (__jmE3 && __jmE3.message || __jmE3));\n"
                  "  }\n"
                  "}\n"
              )
              new = (
                  "  try {\n"
                  "    await loadState();\n"
                  "  } catch (__jmE2) {\n"
                  "    throw new Error('[openAdminApp:loadState] ' + (__jmE2 && __jmE2.message || __jmE2));\n"
                  "  }\n"
                  "  /* jmSkipAutoSystemStatusV1 */\n"
                  "}\n"
              )
              if old not in text:
                  raise SystemExit('openAdminApp() loadSystemStatus call anchor not found -- base HTML has drifted')
              text = text.replace(old, new, 1)
          if marker not in text:
              raise SystemExit('skip-auto-system-status patch did not apply')
          p.write_text(text, encoding='utf-8')
          PY
          grep -F 'jmSkipAutoSystemStatusV1' "$ROOT/assets/admin/index.html" >/dev/null

          python3 - "$ROOT/assets/admin/index.html" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          text = p.read_text(encoding='utf-8')
          marker = 'jmServerWrapChainFixV1'
          if marker not in text:
              # v208.26: three independent scripts each poll on their own
              # setInterval and re-wrap window.server, checking only their OWN
              # flag on the OUTERMOST current window.server -- save-lock
              # (__jmCloudflareSaveLockV24, base HTML), team-state sync
              # (__jmV2063, base HTML), and the timeout wrapper
              # (__jmServerTimeoutV1, admin_server_timeout_v1.js, patched
              # separately). None of them are aware of the others, so whichever
              # one's poll fires last "wins" a round and buries the others'
              # flags under a fresh wrapper lacking them -- their next poll
              # then wraps AGAIN underneath, nesting the same wrapper multiple
              # times. Live-reproduced via an instrumented real-PIN login
              # against production data: loadSystemStatus()'s single await
              # server(...) call hung completely, and even the page's own
              # setInterval heartbeat stopped firing -- consistent with a
              # circular Promise.resolve(cur(...)).then(...) wrap starving the
              # microtask queue, which defeats every setTimeout-based timeout
              # this app already has (a macrotask callback can never run while
              # microtasks keep re-queuing themselves). Fix: each wrapper
              # stores a reference to what it wrapped (__jmInner) and walks
              # that chain looking for its OWN flag before deciding to wrap,
              # instead of checking only the outermost function. This makes
              # each of the three wrappers apply exactly once, in any order,
              # regardless of what else has wrapped window.server since.
              old_savelock = (
                  "  function wrapServer(){\n"
                  "    var original=window.server;\n"
                  "    if(typeof original!=='function'||original.__jmCloudflareSaveLockV24)return false;\n"
                  "    function wrapped(name,args){\n"
                  "      var mutation=MUTATIONS.has(String(name||''));\n"
                  "      if(!mutation)return original.apply(this,arguments);\n"
                  "      setBusy(true);\n"
                  "      try{\n"
                  "        var result=original.apply(this,arguments);\n"
                  "        return Promise.resolve(result).finally(function(){setBusy(false);});\n"
                  "      }catch(error){setBusy(false);throw error;}\n"
                  "    }\n"
                  "    wrapped.__jmCloudflareSaveLockV24=true;wrapped.__original=original;window.server=wrapped;return true;\n"
                  "  }\n"
              )
              new_savelock = (
                  "  function jmChainHasV24(fn){\n"
                  "    /* jmServerWrapChainFixV1 */\n"
                  "    var depth=0;\n"
                  "    while(typeof fn==='function'&&depth<50){\n"
                  "      if(fn.__jmCloudflareSaveLockV24)return true;\n"
                  "      fn=fn.__jmInner||fn.__original;\n"
                  "      depth++;\n"
                  "    }\n"
                  "    return false;\n"
                  "  }\n"
                  "  function wrapServer(){\n"
                  "    var original=window.server;\n"
                  "    if(typeof original!=='function'||jmChainHasV24(original))return false;\n"
                  "    function wrapped(name,args){\n"
                  "      var mutation=MUTATIONS.has(String(name||''));\n"
                  "      if(!mutation)return original.apply(this,arguments);\n"
                  "      setBusy(true);\n"
                  "      try{\n"
                  "        var result=original.apply(this,arguments);\n"
                  "        return Promise.resolve(result).finally(function(){setBusy(false);});\n"
                  "      }catch(error){setBusy(false);throw error;}\n"
                  "    }\n"
                  "    wrapped.__jmCloudflareSaveLockV24=true;wrapped.__original=original;wrapped.__jmInner=original;window.server=wrapped;return true;\n"
                  "  }\n"
              )
              if old_savelock not in text:
                  raise SystemExit('save-lock wrapServer() anchor not found -- base HTML has drifted')
              text = text.replace(old_savelock, new_savelock, 1)

              old_teamstate = (
                  "function wrap(){var cur=window.server;if(typeof cur!=='function'||cur.__jmV2063)return;"
                  "var w=function(n,a){return Promise.resolve(cur(n,a)).then(function(r){commit(r);return r;});};"
                  "w.__jmV2063=true;window.server=w;}"
              )
              new_teamstate = (
                  "function jmChainHasV2063(fn){var depth=0;while(typeof fn==='function'&&depth<50){"
                  "if(fn.__jmV2063)return true;fn=fn.__jmInner||fn.__original;depth++;}return false;}"
