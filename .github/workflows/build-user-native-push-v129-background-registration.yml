name: Build v1.2.9 background-registration diagnostic user APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-user-native-push-v129-background-registration.yml'
      - 'deployment/scripts/patch_build_user_native_v129_background_registration.py'
      - 'deployment/scripts/patch_user_native_v129_vibration_cap10.py'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: jayuminton-user-native-v129-background-registration
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.7'}
      - run: npm install --global firebase-tools@latest @google/clasp@latest
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Resolve config and Firebase user app
        shell: bash
        run: |
          set -euo pipefail
          C="$RUNNER_TEMP/deploy.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$C"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          MAIN_DEPLOYMENT_ID="$(jq -r '.mainDeploymentId' "$C")"
          PUSH_URL="$(jq -r '.pushUrl' "$C")"
          PUSH_SCRIPT_ID="$(jq -r '.pushScriptId' "$C")"
          FIREBASE_PROJECT_ID="$(jq -r '.firebaseProjectId' "$C")"
          for value in "$MAIN_DEPLOYMENT_ID" "$PUSH_URL" "$PUSH_SCRIPT_ID" "$FIREBASE_PROJECT_ID"; do
            test -n "$value"; test "$value" != null
          done
          {
            echo "MAIN_DEPLOYMENT_ID=$MAIN_DEPLOYMENT_ID"
            echo "PUSH_URL=$PUSH_URL"
            echo "PUSH_SCRIPT_ID=$PUSH_SCRIPT_ID"
            echo "FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID"
          } >> "$GITHUB_ENV"

          PACKAGE='com.jayuminton.user'
          firebase apps:list ANDROID --project "$FIREBASE_PROJECT_ID" --json > "$RUNNER_TEMP/apps.json"
          APP_ID="$(jq -r --arg pkg "$PACKAGE" '[.. | objects | select(((.packageName? == $pkg) or (.package_name? == $pkg) or (.androidClientInfo?.packageName? == $pkg)) and ((.appId? // .app_id?) != null)) | (.appId? // .app_id?)] | first // empty' "$RUNNER_TEMP/apps.json")"
          test -n "$APP_ID"
          firebase apps:sdkconfig ANDROID "$APP_ID" --project "$FIREBASE_PROJECT_ID" > app/google-services.json
          grep -F 'com.jayuminton.user' app/google-services.json >/dev/null

      - name: Verify live member-switch server guard
        shell: bash
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/push-check"; mkdir -p "$W"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$PUSH_SCRIPT_ID" > "$W/.clasp.json"
          ok=0
          for attempt in 1 2 3 4 5; do
            rm -f "$W/Code.js"
            (cd "$W" && clasp pull) || true
            if grep -F 'JAYUMINTON_MEMBER_TOKEN_SWITCH_ATOMIC_V1' "$W/Code.js" >/dev/null 2>&1; then ok=1; break; fi
            sleep 4
          done
          test "$ok" = 1

      - name: Build v1.2.9 diagnostic candidate
        id: build_apk
        shell: bash
        run: |
          set +e
          LOG="$RUNNER_TEMP/v129-build.log"
          (
            set -euo pipefail
            SCRIPT='deployment/scripts/build_user_native_push_fresh_v110.sh'
            python3 deployment/scripts/patch_build_user_native_v111.py "$SCRIPT"
            python3 deployment/scripts/patch_build_user_native_v112.py "$SCRIPT"
            python3 deployment/scripts/patch_build_user_native_v113.py "$SCRIPT"
            python3 deployment/scripts/patch_build_user_native_v114.py "$SCRIPT"
            python3 deployment/scripts/patch_build_user_native_v115.py "$SCRIPT"
            python3 deployment/scripts/patch_build_user_native_v116.py "$SCRIPT"
            python3 deployment/scripts/patch_build_user_native_v117.py "$SCRIPT"
            python3 deployment/scripts/patch_build_user_native_v118.py "$SCRIPT"
            python3 deployment/scripts/patch_build_user_native_v119.py "$SCRIPT"
            python3 deployment/scripts/patch_build_user_native_v120_diagnostic.py "$SCRIPT"
            python3 deployment/scripts/patch_build_user_native_v121.py "$SCRIPT"
            python3 deployment/scripts/patch_build_user_native_v122.py "$SCRIPT"
            python3 deployment/scripts/patch_build_user_native_v124_confirmed_overlay.py "$SCRIPT"
            python3 deployment/scripts/patch_build_user_native_v126_stop_controller.py "$SCRIPT"
            python3 deployment/scripts/patch_build_user_native_v126_raceguard.py "$SCRIPT"
            python3 deployment/scripts/patch_build_user_native_v127_member_switch.py "$SCRIPT"
            python3 deployment/scripts/patch_build_user_native_v128_repeat_switch.py "$SCRIPT"
            python3 deployment/scripts/patch_build_user_native_v129_background_registration.py "$SCRIPT"
            python3 deployment/scripts/patch_user_native_v129_vibration_cap10.py "$SCRIPT"
            grep -F 'VERSION="1.2.9"' "$SCRIPT" >/dev/null
            grep -F 'NativeRegistrationJobService' "$SCRIPT" >/dev/null
            grep -F 'token_register_job_http_ok' "$SCRIPT" >/dev/null
            grep -F 'AlertVibrationController.start(this, assignmentId)' "$SCRIPT" >/dev/null
            grep -F 'private static final int MAX_GROUPS = 10;' "$SCRIPT" >/dev/null
            grep -F 'vibration_max_groups=10' "$SCRIPT" >/dev/null
            bash "$SCRIPT"
            APK='releases/jayuminton-courtstatus-v1.2.9-background-registration.apk'
            STATUS='deployment/status/user-native-push-v1.2.9.txt'
            test -s "$APK"; test -s "$STATUS"
            grep -F 'status=success' "$STATUS" >/dev/null
            grep -F 'version=1.2.9' "$STATUS" >/dev/null
            grep -F 'version_code=129' "$STATUS" >/dev/null
            grep -F 'application_id=com.jayuminton.user' "$STATUS" >/dev/null
            grep -F 'vibration_max_groups=10' "$STATUS" >/dev/null
            cp "$APK" "$RUNNER_TEMP/v129.apk"
            cp "$STATUS" "$RUNNER_TEMP/v129-status.txt"
          ) 2>&1 | tee "$LOG"
          RC=${PIPESTATUS[0]}
          echo "exit_code=$RC" >> "$GITHUB_OUTPUT"
          exit "$RC"

      - name: Publish diagnostic candidate only
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          cp "$RUNNER_TEMP/v129.apk" releases/jayuminton-courtstatus-v1.2.9-background-registration.apk
          cp "$RUNNER_TEMP/v129-status.txt" deployment/status/user-native-push-v1.2.9.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/jayuminton-courtstatus-v1.2.9-background-registration.apk deployment/status/user-native-push-v1.2.9.txt
          git commit -m 'Publish v1.2.9 background-registration diagnostic user APK' || exit 0
          git pull --rebase origin main || true
          git push origin main

      - name: Publish visible build failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          STATUS='deployment/status/native-v129-build-failure.txt'
          {
            echo 'status=failure'
            echo 'build_exit_code=${{ steps.build_apk.outputs.exit_code }}'
            echo '--- safe log tail ---'
            tail -n 220 "$RUNNER_TEMP/v129-build.log" 2>/dev/null || echo 'build log unavailable'
          } > "$STATUS"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$STATUS"
          git commit -m 'Record v1.2.9 background-registration build failure' || exit 0
          git pull --rebase origin main || true
          git push origin main
