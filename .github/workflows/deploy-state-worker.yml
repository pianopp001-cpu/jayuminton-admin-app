name: Deploy jayuminton state worker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-state-worker.yml'
      - 'cloudflare/state-worker/**'
      - 'deployment/jayuminton/patch_attendance_statistics_v1.py'
      - 'deployment/jayuminton/patch_member_admin_preference_message_v1.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jayuminton-cloudflare-state
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      INTERNAL_KEY: ${{ secrets.JAYUMINTON_PUSH_SHARED_SECRET }}
      WORKER_URL: https://jayuminton-state.pianopp001.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Wrangler
        run: npm install --global wrangler@latest
      - name: Repair parser edge and verify worker repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cloudflare/state-worker/worker.js')
          s=p.read_text(encoding='utf-8')
          bad="try { const state = await readState(env.DB); await verifyAdminSession(request, env, state); return reply({ ok: true, state: adminState(state) });\n      catch (error)"
          good="try { const state = await readState(env.DB); await verifyAdminSession(request, env, state); return reply({ ok: true, state: adminState(state) }); }\n      catch (error)"
          if bad in s:
              s=s.replace(bad,good,1)
              p.write_text(s,encoding='utf-8')
          PY
          python3 deployment/jayuminton/patch_attendance_statistics_v1.py cloudflare/state-worker
          python3 deployment/jayuminton/patch_member_admin_preference_message_v1.py cloudflare/state-worker/worker.js
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "${#INTERNAL_KEY}" -ge 32
          node --check cloudflare/state-worker/worker.js
          node cloudflare/state-worker/temp-pairs.test.mjs
          node cloudflare/state-worker/worker.test.mjs
          node cloudflare/state-worker/attendance-statistics.test.mjs
          grep -F 'validMemberIds' cloudflare/state-worker/worker.js >/dev/null
          grep -F '!validMemberIds.has(id) || occupied.has(id)' cloudflare/state-worker/worker.js >/dev/null
          grep -F 'JAYUMINTON_MEMBER_PAIR_PLAY_V1' cloudflare/state-worker/worker.js >/dev/null
          grep -F 'JAYUMINTON_ATTENDANCE_TIMES_V2' cloudflare/state-worker/worker.js >/dev/null
          grep -F 'JAYUMINTON_KOK_ARRIVAL_TIME_V2' cloudflare/state-worker/worker.js >/dev/null
          grep -F 'JAYUMINTON_ATTENDANCE_STATS_RESPONSE_V2' cloudflare/state-worker/worker-md-entry.js >/dev/null
          grep -F 'memberSessionsRevoked: true' cloudflare/state-worker/worker.js >/dev/null
          grep -F 'JAYUMINTON_MEMBER_ADMIN_PREFERENCE_MESSAGE_V1' cloudflare/state-worker/worker.js >/dev/null
          grep -F "name === 'memberSendAdminPreference'" cloudflare/state-worker/worker.js >/dev/null
          grep -F '대기순서 밀려도 ${partner}와 배정해 주세요.' cloudflare/state-worker/worker.js >/dev/null
      - name: Resolve existing D1 and prepare config
        shell: bash
        run: |
          set -euo pipefail
          wrangler d1 list --json > "$RUNNER_TEMP/d1-list.json"
          D1_ID="$(jq -r '.[] | select(.name=="jayuminton-state") | .uuid' "$RUNNER_TEMP/d1-list.json" | head -1)"
          test -n "$D1_ID"
          sed "s/__D1_DATABASE_ID__/$D1_ID/g" cloudflare/state-worker/wrangler.toml.template > "$RUNNER_TEMP/wrangler.toml"
      - name: Deploy Cloudflare Worker
        shell: bash
        run: |
          set -euo pipefail
          wrangler d1 execute DB --remote --file cloudflare/state-worker/schema.sql --config "$RUNNER_TEMP/wrangler.toml"
          cp cloudflare/state-worker/*.js "$RUNNER_TEMP/"
          echo "::add-mask::$INTERNAL_KEY"
          printf '%s' "$INTERNAL_KEY" | wrangler secret put INTERNAL_KEY --config "$RUNNER_TEMP/wrangler.toml" >/dev/null
          wrangler deploy --config "$RUNNER_TEMP/wrangler.toml"
      - name: Verify live Cloudflare service
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 8 --retry-delay 2 "$WORKER_URL/health?run=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/health.json"
          jq -e '.ok==true and .backend=="cloudflare-only" and .database=="d1" and .concurrency=="durable-object" and .gas==false' "$RUNNER_TEMP/health.json" >/dev/null
          echo ATTENDANCE_STATISTICS_V2_KOK_ARRIVAL_WORKER_LIVE

      - name: Record state worker deployment result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          outcome='failure'
          if [ "${{ job.status }}" = 'success' ]; then outcome='success'; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          mkdir -p deployment/status
          printf 'status=%s\nrun_id=%s\nsource_sha=%s\nfeature=member-admin-preference-v2\nphrase=대기순서 밀려도 {name}와 배정해 주세요.\n' "$outcome" "$GITHUB_RUN_ID" "$GITHUB_SHA" > deployment/status/state-worker-member-admin-preference-v2.txt
          git add deployment/status/state-worker-member-admin-preference-v2.txt
          git commit -m "Record member preference worker deployment: $outcome" || exit 0
          git push origin HEAD:main
