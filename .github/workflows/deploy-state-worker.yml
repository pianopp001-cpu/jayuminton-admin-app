name: Deploy jayuminton state worker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-state-worker.yml'
      - 'cloudflare/state-worker/worker.js'
      - 'cloudflare/state-worker/worker-md-entry.js'
      - 'cloudflare/state-worker/worker-md-compat-entry.js'
      - 'cloudflare/state-worker/worker-md-final-entry.js'
      - 'cloudflare/state-worker/wrangler.toml.template'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare wrangler config
        shell: bash
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          set -euo pipefail
          test -n "$D1_DATABASE_ID"
          cd cloudflare/state-worker
          sed "s/__D1_DATABASE_ID__/$D1_DATABASE_ID/g" wrangler.toml.template > wrangler.toml
      - name: Deploy Cloudflare Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          cd cloudflare/state-worker
          npx --yes wrangler@4 deploy --config wrangler.toml
