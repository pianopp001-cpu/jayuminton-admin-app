name: Force badminton.html user page to v1.2.8

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-badminton-v128.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: jayuminton-badminton-v128
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --global firebase-tools@latest
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Build fresh Hosting including physical badminton.html
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$RUNNER_TEMP/deploy.json"
          FIREBASE_PROJECT_ID="$(jq -r '.firebaseProjectId' "$RUNNER_TEMP/deploy.json")"
          HOSTING_URL="$(jq -r '.hostingUrl' "$RUNNER_TEMP/deploy.json")"
          MAIN_DEPLOYMENT_ID="$(jq -r '.mainDeploymentId' "$RUNNER_TEMP/deploy.json")"
          PUSH_DEPLOYMENT_ID="$(jq -r '.pushDeploymentId' "$RUNNER_TEMP/deploy.json")"
          echo "FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID" >> "$GITHUB_ENV"
          echo "HOSTING_URL=${HOSTING_URL%/}" >> "$GITHUB_ENV"

          SRC="$GITHUB_WORKSPACE/deployment/jayuminton/v1637-web"
          ROOT="$RUNNER_TEMP/hosting-badminton-v128"
          PUBLIC="$ROOT/public"
          mkdir -p "$PUBLIC"
          cp "$SRC/index.html" "$PUBLIC/index.html"
          cp "$SRC/setup-v205.css" "$PUBLIC/setup-v205.css"
          cp "$SRC/manifest.webmanifest" "$PUBLIC/manifest.webmanifest"
          cp "$SRC/firebase-messaging-sw.js" "$PUBLIC/firebase-messaging-sw.js"
          cp "$SRC/alert-self-test.js" "$PUBLIC/alert-self-test.js"

          BASE="${HOSTING_URL%/}"
          for asset in icon-198.png icon-512.png apple-touch-icon-180.png badge-96.png; do
            curl --fail --location --retry 5 "$BASE/$asset?source=badminton-v128-$GITHUB_RUN_ID" -o "$PUBLIC/$asset"
          done

          cat "$SRC"/setup-v205.js.gz.b64.part-* | tr -d '\r\n' | base64 -d > "$RUNNER_TEMP/setup.gz"
          gzip -dc "$RUNNER_TEMP/setup.gz" > "$PUBLIC/setup-v205.js"
          python3 deployment/scripts/patch_push_setup_verification.py "$PUBLIC/setup-v205.js"
          python3 deployment/scripts/patch_embedded_browser_push.py "$PUBLIC/setup-v205.js"
          python3 deployment/scripts/patch_native_host_bridge.py "$PUBLIC/setup-v205.js"
          python3 deployment/scripts/patch_user_install_link_v128.py hosting "$PUBLIC/setup-v205.js"

          python3 - <<'PY'
          from pathlib import Path
          import os,re
          public=Path(os.environ['RUNNER_TEMP'])/'hosting-badminton-v128'/'public'
          run=os.environ['GITHUB_RUN_ID']
          main='https://script.google.com/macros/s/'+os.environ.get('MAIN_DEPLOYMENT_ID','')+'/exec'
          push='https://script.google.com/macros/s/'+os.environ.get('PUSH_DEPLOYMENT_ID','')+'/exec'
          # MAIN/PUSH env are not exported; reconstruct from deploy JSON directly below instead.
          PY
          MAIN_URL="https://script.google.com/macros/s/$MAIN_DEPLOYMENT_ID/exec"
          PUSH_URL="https://script.google.com/macros/s/$PUSH_DEPLOYMENT_ID/exec"
          export MAIN_URL PUSH_URL
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          public=Path(os.environ['RUNNER_TEMP'])/'hosting-badminton-v128'/'public'
          run=os.environ['GITHUB_RUN_ID']
          template=Path('deployment/jayuminton/v1637-web/config-v204.template.js').read_text(encoding='utf-8')
          config=template.replace('__MEMBER_PAGE_URL__',os.environ['MAIN_URL']).replace('__RELAY_URL__',os.environ['PUSH_URL'])
          for name in ('config-v202.js','config-v203.js','config-v204.js'):
              (public/name).write_text(config,encoding='utf-8')
          p=public/'index.html'
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'/setup-v205\.js\?v=[^"\']+',f'/setup-v205.js?v=native-apk-128-badminton-{run}',s,count=1)
          s=re.sub(r'/config-v204\.js\?v=[^"\']+',f'/config-v204.js?v=native-apk-128-badminton-{run}',s,count=1)
          s=s.replace('<meta name="jayuminton-build" content="1.6.37">',f'<meta name="jayuminton-build" content="1.6.37-v128-badminton-{run}">')
          p.write_text(s,encoding='utf-8')
          (public/'badminton.html').write_text(s,encoding='utf-8')
          sw=public/'firebase-messaging-sw.js'
          w=sw.read_text(encoding='utf-8')
          w=re.sub(r"const JAYUMINTON_SW_VERSION = '[^']+';",f"const JAYUMINTON_SW_VERSION = 'v128-badminton-{run}';",w,count=1)
          w=re.sub(r"const JAYUMINTON_CACHE = '[^']+';",f"const JAYUMINTON_CACHE = 'jayuminton-v128-badminton-{run}';",w,count=1)
          sw.write_text(w,encoding='utf-8')
          PY

          node --check "$PUBLIC/setup-v205.js"
          grep -F 'jayuminton-courtstatus-v1.2.8-repeat-switch.apk' "$PUBLIC/setup-v205.js" >/dev/null
          ! grep -F 'v1.2.4-confirmed-overlay.apk' "$PUBLIC/setup-v205.js"
          cmp "$PUBLIC/index.html" "$PUBLIC/badminton.html"

          cat > "$ROOT/firebase.json" <<'JSON'
          {"hosting":{"public":"public","ignore":["firebase.json","**/.*","**/node_modules/**"],"headers":[{"source":"/index.html","headers":[{"key":"Cache-Control","value":"no-cache, no-store, must-revalidate"}]},{"source":"/badminton.html","headers":[{"key":"Cache-Control","value":"no-cache, no-store, must-revalidate"}]},{"source":"/setup-v205.js","headers":[{"key":"Cache-Control","value":"no-cache, no-store, must-revalidate"}]},{"source":"/config-v204.js","headers":[{"key":"Cache-Control","value":"no-cache, no-store, must-revalidate"}]},{"source":"/firebase-messaging-sw.js","headers":[{"key":"Cache-Control","value":"no-cache, no-store, must-revalidate"}]}],"rewrites":[{"source":"**","destination":"/index.html"}]}}
          JSON
          firebase deploy --only hosting --project "$FIREBASE_PROJECT_ID" --config "$ROOT/firebase.json" --non-interactive

      - name: Verify exact badminton.html route and APK bytes
        shell: bash
        run: |
          set -euo pipefail
          BASE="${HOSTING_URL%/}"
          EXPECTED="$(sed -n 's/^apk_sha256=//p' deployment/status/user-native-push-v1.2.8.txt | tail -1)"
          ok=0
          for attempt in $(seq 1 15); do
            curl --fail --location --silent --show-error -D "$RUNNER_TEMP/headers.txt" -H 'Cache-Control: no-cache, no-store' \
              "$BASE/badminton.html?verify=v128-badminton-$GITHUB_RUN_ID-$attempt" -o "$RUNNER_TEMP/badminton.html" || true
            curl --fail --location --silent --show-error -H 'Cache-Control: no-cache, no-store' \
              "$BASE/setup-v205.js?verify=v128-badminton-$GITHUB_RUN_ID-$attempt" -o "$RUNNER_TEMP/setup.js" || true
            if grep -F "1.6.37-v128-badminton-$GITHUB_RUN_ID" "$RUNNER_TEMP/badminton.html" >/dev/null 2>&1 && \
               grep -F 'jayuminton-courtstatus-v1.2.8-repeat-switch.apk' "$RUNNER_TEMP/setup.js" >/dev/null 2>&1 && \
               ! grep -F 'v1.2.4-confirmed-overlay.apk' "$RUNNER_TEMP/setup.js" >/dev/null 2>&1; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1
          grep -i 'cache-control:.*no-store' "$RUNNER_TEMP/headers.txt" >/dev/null

          TARGET="$(sed -n "s/.*const JAYUMINTON_USER_APK_V128 = '\([^']*\)'.*/\1/p" "$RUNNER_TEMP/setup.js" | head -1)"
          test -n "$TARGET"
          curl --fail --location --retry 5 -H 'Cache-Control: no-cache, no-store' "$TARGET" -o "$RUNNER_TEMP/v128.apk"
          OBSERVED="$(sha256sum "$RUNNER_TEMP/v128.apk" | awk '{print $1}')"
          test "$OBSERVED" = "$EXPECTED"

          cat > deployment/status/badminton-v128-live.txt <<EOF
          status=success
          user_url=$BASE/badminton.html
          canonical_root=$BASE/
          badminton_page=fresh-physical-file
          badminton_cache_control=no-store
          badminton_build_marker=1.6.37-v128-badminton-$GITHUB_RUN_ID
          setup_v128_present=yes
          setup_v124_present=no
          apk=jayuminton-courtstatus-v1.2.8-repeat-switch.apk
          apk_hash_match=yes
          apk_sha256=$OBSERVED
          admin_logic_changed=no
          verified_at=$(date -u +%FT%TZ)
          EOF

      - name: Publish verified badminton route
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment/status/badminton-v128-live.txt
          git commit -m 'Record verified badminton.html v1.2.8 install route' || exit 0
          git pull --rebase origin main || true
          git push origin main
