name: Hotfix public install link to v1.2.9

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-v129-install-link.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: jayuminton-user-v129-hotfix
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --global firebase-tools@latest
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Patch current live Hosting to v1.2.9
        id: deploy_live
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          C="$RUNNER_TEMP/deploy.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$C"
          FIREBASE_PROJECT_ID="$(jq -r '.firebaseProjectId' "$C")"
          HOSTING_URL="$(jq -r '.hostingUrl' "$C")"
          BASE="${HOSTING_URL%/}"
          echo "FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID" >> "$GITHUB_ENV"
          echo "HOSTING_URL=$BASE" >> "$GITHUB_ENV"

          STATUS='deployment/status/user-native-push-v1.2.9.txt'
          APK='releases/jayuminton-courtstatus-v1.2.9-background-registration.apk'
          test -s "$STATUS"; test -s "$APK"
          grep -F 'status=success' "$STATUS" >/dev/null
          grep -F 'version=1.2.9' "$STATUS" >/dev/null
          EXPECTED="$(sed -n 's/^apk_sha256=//p' "$STATUS" | tail -1)"
          test -n "$EXPECTED"
          test "$(sha256sum "$APK" | awk '{print $1}')" = "$EXPECTED"
          echo "EXPECTED_APK_SHA=$EXPECTED" >> "$GITHUB_ENV"

          ROOT="$RUNNER_TEMP/v129-hotfix"
          PUBLIC="$ROOT/public"
          mkdir -p "$PUBLIC"
          for asset in index.html setup-v205.js setup-v205.css manifest.webmanifest firebase-messaging-sw.js alert-self-test.js config-v202.js config-v203.js config-v204.js icon-198.png icon-512.png apple-touch-icon-180.png badge-96.png; do
            curl --fail --location --retry 5 -H 'Cache-Control: no-cache, no-store' \
              "$BASE/$asset?source=v129-hotfix-$GITHUB_RUN_ID" -o "$PUBLIC/$asset"
          done
          curl --fail --location --retry 5 -H 'Cache-Control: no-cache, no-store' \
            "$BASE/badminton.html?source=v129-hotfix-$GITHUB_RUN_ID" -o "$PUBLIC/badminton.html" || cp "$PUBLIC/index.html" "$PUBLIC/badminton.html"
          cp "$APK" "$PUBLIC/jayuminton-courtstatus-v1.2.9-background-registration.apk"

          python3 - <<'PY'
          from pathlib import Path
          import os,re
          public=Path(os.environ['RUNNER_TEMP'])/'v129-hotfix'/'public'
          run=os.environ['GITHUB_RUN_ID']
          target=f"/jayuminton-courtstatus-v1.2.9-background-registration.apk?build=129-hotfix-{run}"
          p=public/'setup-v205.js'
          s=p.read_text(encoding='utf-8')
          # Remove prior APK marker/constant block and insert a single v1.2.9 constant.
          s=re.sub(r"  /\* JAYUMINTON_NATIVE_APK_DOWNLOAD_[A-Z0-9_]+ \*/\n  const JAYUMINTON_USER_APK_[A-Z0-9_]+ = '[^']+';\n\n",'',s)
          handler='  function handleAppInstallButton(fromDirectUserTap) {\n'
          if s.count(handler) != 1: raise SystemExit('install handler missing')
          # Normalize any historical install override variable name before inserting.
          s=re.sub(r'JAYUMINTON_USER_APK_[A-Z0-9_]+','JAYUMINTON_USER_APK_V129',s)
          block=f"  /* JAYUMINTON_NATIVE_APK_DOWNLOAD_V129 */\n  const JAYUMINTON_USER_APK_V129 = '{target}';\n\n"
          s=s.replace(handler,block+handler,1)
          s=s.replace('자유민턴 사용자 앱 1.2.8을 다운로드합니다.','자유민턴 사용자 앱 1.2.9을 다운로드합니다.')
          s=s.replace('자유민턴 사용자 앱 1.2.7을 다운로드합니다.','자유민턴 사용자 앱 1.2.9을 다운로드합니다.')
          if target not in s: raise SystemExit('v129 target missing')
          if 'v1.2.8-repeat-switch.apk' in s: raise SystemExit('v128 route remained')
          p.write_text(s,encoding='utf-8')

          for name in ('index.html','badminton.html'):
              q=public/name
              h=q.read_text(encoding='utf-8')
              h=re.sub(r'/setup-v205\.js\?v=[^"\']+',f'/setup-v205.js?v=v129-hotfix-{run}',h)
              h=re.sub(r'<meta name="jayuminton-build" content="[^"]+">',f'<meta name="jayuminton-build" content="1.6.37-v129-hotfix-{run}">',h,count=1)
              q.write_text(h,encoding='utf-8')

          sw=public/'firebase-messaging-sw.js'
          w=sw.read_text(encoding='utf-8')
          w=re.sub(r"const JAYUMINTON_SW_VERSION = '[^']+';",f"const JAYUMINTON_SW_VERSION = 'v129-hotfix-{run}';",w,count=1)
          w=re.sub(r"const JAYUMINTON_CACHE = '[^']+';",f"const JAYUMINTON_CACHE = 'jayuminton-v129-hotfix-{run}';",w,count=1)
          sw.write_text(w,encoding='utf-8')
          PY

          node --check "$PUBLIC/setup-v205.js"
          grep -F 'jayuminton-courtstatus-v1.2.9-background-registration.apk' "$PUBLIC/setup-v205.js" >/dev/null
          ! grep -F 'v1.2.8-repeat-switch.apk' "$PUBLIC/setup-v205.js"

          cat > "$ROOT/firebase.json" <<'JSON'
          {"hosting":{"public":"public","ignore":["firebase.json","**/.*","**/node_modules/**"],"headers":[{"source":"/index.html","headers":[{"key":"Cache-Control","value":"no-cache, no-store, must-revalidate"}]},{"source":"/badminton.html","headers":[{"key":"Cache-Control","value":"no-cache, no-store, must-revalidate"}]},{"source":"/setup-v205.js","headers":[{"key":"Cache-Control","value":"no-cache, no-store, must-revalidate"}]},{"source":"/firebase-messaging-sw.js","headers":[{"key":"Cache-Control","value":"no-cache, no-store, must-revalidate"}]},{"source":"/*.apk","headers":[{"key":"Cache-Control","value":"no-cache, no-store, must-revalidate"},{"key":"Content-Type","value":"application/vnd.android.package-archive"}]}],"rewrites":[{"source":"**","destination":"/index.html"}]}}
          JSON
          firebase deploy --only hosting --project "$FIREBASE_PROJECT_ID" --config "$ROOT/firebase.json" --non-interactive

      - name: Verify v1.2.9 live link and bytes
        id: verify_live
        if: steps.deploy_live.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          BASE="${HOSTING_URL%/}"
          ok=0
          for attempt in $(seq 1 20); do
            curl --fail --location --silent --show-error -H 'Cache-Control: no-cache, no-store' \
              "$BASE/setup-v205.js?verify=v129-hotfix-$GITHUB_RUN_ID-$attempt" -o "$RUNNER_TEMP/live-setup.js" || true
            if grep -F 'jayuminton-courtstatus-v1.2.9-background-registration.apk' "$RUNNER_TEMP/live-setup.js" >/dev/null 2>&1 && \
               ! grep -F 'v1.2.8-repeat-switch.apk' "$RUNNER_TEMP/live-setup.js" >/dev/null 2>&1; then ok=1; break; fi
            sleep 4
          done
          test "$ok" = 1
          curl --fail --location --retry 5 -H 'Cache-Control: no-cache, no-store' \
            "$BASE/jayuminton-courtstatus-v1.2.9-background-registration.apk?verify=$GITHUB_RUN_ID" \
            -o "$RUNNER_TEMP/live-v129.apk"
          test "$(sha256sum "$RUNNER_TEMP/live-v129.apk" | awk '{print $1}')" = "$EXPECTED_APK_SHA"

      - name: Publish visible v1.2.9 link status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY='${{ steps.deploy_live.outcome }}'
          VERIFY='${{ steps.verify_live.outcome }}'
          STATUS='failure'
          if [ "$DEPLOY" = success ] && [ "$VERIFY" = success ]; then STATUS='success'; fi
          cat > deployment/status/hotfix-v129-live.txt <<EOF
          status=$STATUS
          version=1.2.9
          version_code=129
          deploy_outcome=$DEPLOY
          verify_outcome=$VERIFY
          hosting_url=${HOSTING_URL:-unknown}
          apk=jayuminton-courtstatus-v1.2.9-background-registration.apk
          expected_apk_sha256=${EXPECTED_APK_SHA:-unknown}
          public_button_target=v1.2.9
          admin_logic_changed=no
          recorded_at=$(date -u +%FT%TZ)
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment/status/hotfix-v129-live.txt
          git commit -m "Record v1.2.9 public install link status: $STATUS" || exit 0
          git pull --rebase origin main || true
          git push origin main

      - name: Fail if deployment was not verified
        if: always()
        shell: bash
        run: |
          test '${{ steps.deploy_live.outcome }}' = success
          test '${{ steps.verify_live.outcome }}' = success
