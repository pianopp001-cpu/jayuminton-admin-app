name: Verify v1.3.0 nested frame visible simple

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-v130-nested-simple.yml'
      - 'deployment/scripts/verify_v130_nested.sh'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify live nested content
        shell: bash
        run: bash deployment/scripts/verify_v130_nested.sh
      - name: Publish proof
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment/status/v130-visible-nested-proof.txt
          git commit -m 'Verify v1.3.0 nested court content visible' || exit 0
          git pull --rebase origin main || true
          git push origin main
