name: Apply shared temp pair state

on:
  push:
    branches: [main]
    paths:
      - 'deployment/jayuminton/patch_shared_temp_pairs_v2.py'
      - 'cloudflare/state-worker/temp-pairs.test.mjs'
      - '.github/workflows/apply-shared-temp-pairs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply shared temp-pair patch
        run: |
          python3 deployment/jayuminton/patch_shared_temp_pairs_v2.py
          python3 - <<'PY'
          from pathlib import Path

          # Any mutation that can change a member's physical location must
          # revalidate temporary pairs before returning state.
          wp=Path('cloudflare/state-worker/worker.js')
          w=wp.read_text()
          replacements={
            "  syncMemberStatuses(state);\n  return { state, event: { type: 'court_finished'":
              "  syncMemberStatuses(state);\n  reconcileTempPairs(state);\n  return { state, event: { type: 'court_finished'",
            "  syncMemberStatuses(state);\n  return { state, event: { type: 'members_moved'":
              "  syncMemberStatuses(state);\n  reconcileTempPairs(state);\n  return { state, event: { type: 'members_moved'",
            "  syncMemberStatuses(state);\n  return { state, event: { type: 'members_swapped'":
              "  syncMemberStatuses(state);\n  reconcileTempPairs(state);\n  return { state, event: { type: 'members_swapped'",
            "  return { state, event: { type: 'locations_swapped'":
              "  reconcileTempPairs(state);\n  return { state, event: { type: 'locations_swapped'",
          }
          for old,new in replacements.items():
            if old in w:
              w=w.replace(old,new,1)
          wp.write_text(w)

          p=Path('deployment/jayuminton/cloudflare_v6_frontend_bridge.js')
          s=p.read_text()
          s=s.replace(
            ".jm-temp-pair{box-shadow:0 0 0 3px var(--jm-temp-pair-color)!important}.jm-team-bottom-label{display:none!important}",
            ".jm-temp-pair{box-shadow:0 0 0 3px var(--jm-temp-pair-color)!important}#adminApp .member.jm-team-card.has-member-team.jm-temp-pair,#adminApp .member.jm-team-card.jm-temp-pair,#adminApp .has-member-team.jm-temp-pair,#adminApp .jm-temp-pair{box-shadow:0 0 0 3px var(--jm-temp-pair-color)!important}.jm-team-bottom-label{display:none!important}")
          s=s.replace(
            "#adminApp .has-member-team.jm-temp-pair{box-shadow:0 0 0 3px var(--jm-temp-pair-color)!important}#adminApp .jm-temp-pair-pending",
            "#adminApp .member.jm-team-card.has-member-team.jm-temp-pair{box-shadow:0 0 0 3px var(--jm-temp-pair-color)!important}#adminApp .member.jm-team-card.jm-temp-pair{box-shadow:0 0 0 3px var(--jm-temp-pair-color)!important}#adminApp .has-member-team.jm-temp-pair{box-shadow:0 0 0 3px var(--jm-temp-pair-color)!important}#adminApp .jm-temp-pair-pending")
          s=s.replace(
            "card.style.setProperty('box-shadow','none','important');\n          card.style.setProperty('border'",
            "if(card.classList.contains('jm-temp-pair'))card.style.removeProperty('box-shadow');else card.style.setProperty('box-shadow','none','important');\n          card.style.setProperty('border'")
          p.write_text(s)
          PY
      - name: Run regression tests
        run: |
          node cloudflare/state-worker/worker.test.mjs
          node cloudflare/state-worker/temp-pairs.test.mjs
          node deployment/jayuminton/cloudflare_v6_frontend_bridge.test.mjs
      - name: Verify shared temp-pair contract
        run: |
          grep -q "tempPairs" cloudflare/state-worker/worker.js
          grep -q "setTempPairsMutation" cloudflare/state-worker/worker.js
          grep -q "reconcileTempPairs(state)" cloudflare/state-worker/worker.js
          grep -q "setTempPairs" deployment/jayuminton/cloudflare_v6_frontend_bridge.js
          grep -q "member.jm-team-card.has-member-team.jm-temp-pair" deployment/jayuminton/cloudflare_v6_frontend_bridge.js
          grep -q "card.classList.contains('jm-temp-pair')" deployment/jayuminton/cloudflare_v6_frontend_bridge.js
          if grep -q "bottom.textContent=teamText" deployment/jayuminton/cloudflare_v6_frontend_bridge.js; then
            echo 'legacy visible team label creator still present' >&2
            exit 1
          fi
      - name: Commit generated sources to main
        run: |
          if git diff --quiet; then
            echo 'No generated source changes required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/state-worker/worker.js deployment/jayuminton/cloudflare_v6_frontend_bridge.js
          git commit -m 'fix(team): reconcile temporary pairs after location changes'
          git push origin main

# trigger: reconcile temporary pairs after movement
