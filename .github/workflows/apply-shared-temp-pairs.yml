name: Apply shared temp pair state

on:
  push:
    branches: [main]
    paths:
      - 'deployment/jayuminton/patch_shared_temp_pairs_v2.py'
      - 'deployment/jayuminton/patch_shared_temp_pairs_v3.py'
      - 'cloudflare/state-worker/temp-pairs.test.mjs'
      - '.github/workflows/apply-shared-temp-pairs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply shared temp-pair patch
        run: python3 deployment/jayuminton/patch_shared_temp_pairs_v3.py
      - name: Run regression tests
        run: |
          node cloudflare/state-worker/worker.test.mjs
          node cloudflare/state-worker/temp-pairs.test.mjs
          node deployment/jayuminton/cloudflare_v6_frontend_bridge.test.mjs
      - name: Verify shared temp-pair contract
        run: |
          grep -q "tempPairs" cloudflare/state-worker/worker.js
          grep -q "setTempPairsMutation" cloudflare/state-worker/worker.js
          grep -q "reconcileTempPairs(state)" cloudflare/state-worker/worker.js
          grep -q "setTempPairs" deployment/jayuminton/cloudflare_v6_frontend_bridge.js
          grep -q "typeof document==='undefined'||typeof document.querySelectorAll!=='function'" deployment/jayuminton/cloudflare_v6_frontend_bridge.js
          grep -q "member.jm-team-card.has-member-team.jm-temp-pair" deployment/jayuminton/cloudflare_v6_frontend_bridge.js
          grep -q "card.classList.contains('jm-temp-pair')" deployment/jayuminton/cloudflare_v6_frontend_bridge.js
          grep -q "bottom.textContent=teamText" deployment/jayuminton/cloudflare_v6_frontend_bridge.js
          grep -q "확인 = 1회성 팀설정" deployment/jayuminton/cloudflare_v6_frontend_bridge.js
          python3 - <<'PY'
          from pathlib import Path
          w=Path('cloudflare/state-worker/worker.js').read_text()
          b=Path('deployment/jayuminton/cloudflare_v6_frontend_bridge.js').read_text()
          if "  reconcileTempPairs(state);\n  reconcileTempPairs(state);\n" in w:
              raise SystemExit('duplicate reconcileTempPairs detected')
          if "var side=[group.pairA,TEMP_PAIR_COLORS[index%TEMP_PAIR_COLORS.length]];" not in b:
              raise SystemExit('pairA-only overlay missing')
          if '.jm-team-bottom-label{display:block!important' not in b:
              raise SystemExit('small bottom official team label style missing')
          print('SHARED_TEMP_PAIR_CONTRACT_OK labels=bottom-small pairAOnly=true prompt=true')
          PY
      - name: Commit generated sources to main
        run: |
          if git diff --quiet; then
            echo 'No generated source changes required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/state-worker/worker.js deployment/jayuminton/cloudflare_v6_frontend_bridge.js
          git commit -m 'fix(team): share temporary pair state across admin and member'
          git push origin main
