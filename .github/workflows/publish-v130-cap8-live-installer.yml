name: Publish v1.3.0 cap8 live installer

on:
  push:
    branches: [main]
    paths:
      - 'releases/jayuminton-courtstatus-v1.3.0-cap8.apk'
      - 'deployment/status/user-native-push-v1.3.0.txt'
      - '.github/workflows/publish-v130-cap8-live-installer.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: jayuminton-v130-cap8-live-installer
  cancel-in-progress: false

jobs:
  publish-deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --global firebase-tools@latest
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Resolve config
        shell: bash
        run: |
          set -euo pipefail
          C="$RUNNER_TEMP/deploy.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$C"
          {
            echo "FIREBASE_PROJECT_ID=$(jq -r '.firebaseProjectId' "$C")"
            echo "HOSTING_URL=$(jq -r '.hostingUrl' "$C")"
            echo "MAIN_URL=https://script.google.com/macros/s/$(jq -r '.mainDeploymentId' "$C")/exec"
            echo "PUSH_URL=$(jq -r '.pushUrl' "$C")"
          } >> "$GITHUB_ENV"

      - name: Verify code130 cap8 APK and release asset
        shell: bash
        run: |
          set -euo pipefail
          APK='releases/jayuminton-courtstatus-v1.3.0-cap8.apk'
          STATUS='deployment/status/user-native-push-v1.3.0.txt'
          test -s "$APK"; test -s "$STATUS"
          grep -F 'status=success' "$STATUS" >/dev/null
          grep -F 'version=1.3.0' "$STATUS" >/dev/null
          grep -F 'version_code=130' "$STATUS" >/dev/null
          grep -F 'wait1_vibration=controller-finite-3-pulse-groups-max8-or-until-confirmed' "$STATUS" >/dev/null
          grep -F 'court_vibration=controller-finite-3-pulse-groups-max8-or-until-confirmed' "$STATUS" >/dev/null
          grep -F 'vibration_max_groups=8' "$STATUS" >/dev/null
          EXPECTED="$(sha256sum "$APK" | awk '{print $1}')"
          echo "V130_APK_SHA=$EXPECTED" >> "$GITHUB_ENV"
          AAPT=''; for p in "$ANDROID_HOME"/build-tools/*/aapt; do [ -x "$p" ] && AAPT="$p"; done; test -n "$AAPT"
          "$AAPT" dump badging "$APK" > "$RUNNER_TEMP/local-badging.txt"
          grep -F "package: name='com.jayuminton.user'" "$RUNNER_TEMP/local-badging.txt" >/dev/null
          grep -F "versionCode='130'" "$RUNNER_TEMP/local-badging.txt" >/dev/null
          grep -F "versionName='1.3.0'" "$RUNNER_TEMP/local-badging.txt" >/dev/null

          TAG='user-v1.3.0-cap8'
          ASSET='Jayuminton-User-v1.3.0-code130-cap8.apk'
          cp "$APK" "$RUNNER_TEMP/$ASSET"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP/$ASSET" --clobber
          else
            gh release create "$TAG" "$RUNNER_TEMP/$ASSET" --title '자유민턴 사용자 앱 v1.3.0' --notes '기존 기능 유지. 대기1/코트입장 진동은 3회씩 최대 8그룹으로 제한.'
          fi
          RELEASE_URL="https://github.com/pianopp001-cpu/jayuminton-admin-app/releases/download/$TAG/$ASSET"
          echo "V130_RELEASE_URL=$RELEASE_URL" >> "$GITHUB_ENV"
          curl --fail --location --retry 5 -H 'Cache-Control: no-cache, no-store' "$RELEASE_URL?verify=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/release-v130.apk"
          test "$(sha256sum "$RUNNER_TEMP/release-v130.apk" | awk '{print $1}')" = "$EXPECTED"

      - name: Deploy hosting with direct court iframe fail-safe
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/deployment/jayuminton/v1637-web"
          ROOT="$RUNNER_TEMP/hosting"
          PUBLIC="$ROOT/public"
          mkdir -p "$PUBLIC"
          cp "$SRC/index.html" "$PUBLIC/index.html"
          cp "$SRC/setup-v205.css" "$PUBLIC/setup-v205.css"
          cp "$SRC/manifest.webmanifest" "$PUBLIC/manifest.webmanifest"
          cp "$SRC/firebase-messaging-sw.js" "$PUBLIC/firebase-messaging-sw.js"
          cp "$SRC/alert-self-test.js" "$PUBLIC/alert-self-test.js"
          BASE="${HOSTING_URL%/}"
          for asset in icon-198.png icon-512.png apple-touch-icon-180.png badge-96.png; do
            curl --fail --location --retry 5 "$BASE/$asset?source=v130-whitefix-$GITHUB_RUN_ID" -o "$PUBLIC/$asset"
          done
          cat "$SRC"/setup-v205.js.gz.b64.part-* | tr -d '\r\n' | base64 -d > "$RUNNER_TEMP/setup.gz"
          gzip -dc "$RUNNER_TEMP/setup.gz" > "$PUBLIC/setup-v205.js"
          python3 deployment/scripts/patch_push_setup_verification.py "$PUBLIC/setup-v205.js"
          python3 deployment/scripts/patch_embedded_browser_push.py "$PUBLIC/setup-v205.js"
          python3 deployment/scripts/patch_native_host_bridge.py "$PUBLIC/setup-v205.js"
          python3 deployment/scripts/patch_user_install_link_v130.py hosting "$PUBLIC/setup-v205.js"
          export MAIN_URL_BUST="${MAIN_URL}?build=v130-whitefix-${GITHUB_RUN_ID}"
          python3 - <<'PY'
          from pathlib import Path
          import os
          public=Path(os.environ['RUNNER_TEMP'])/'hosting'/'public'
          main=os.environ['MAIN_URL_BUST']
          template=Path('deployment/jayuminton/v1637-web/config-v204.template.js').read_text(encoding='utf-8')
          config=template.replace('__MEMBER_PAGE_URL__',main).replace('__RELAY_URL__',os.environ['PUSH_URL'])
          for n in ('config-v202.js','config-v203.js','config-v204.js'):
              (public/n).write_text(config,encoding='utf-8')
          base=(public/'index.html').read_text(encoding='utf-8')
          old='<iframe id="courtFrame" title="자유민턴 코트현황" scrolling="no" allow="clipboard-read; clipboard-write"></iframe>'
          new=f'<iframe id="courtFrame" src="{main}" title="자유민턴 코트현황" scrolling="no" allow="clipboard-read; clipboard-write"></iframe>'
          if old not in base:
              raise SystemExit('court iframe anchor missing')
          base=base.replace(old,new,1)
          base=base.replace('/setup-v205.js?v=1637',f'/setup-v205.js?v=v130-whitefix-{os.environ["GITHUB_RUN_ID"]}')
          base=base.replace('/config-v204.js?v=1637',f'/config-v204.js?v=v130-whitefix-{os.environ["GITHUB_RUN_ID"]}')
          base=base.replace('</head>',f'<meta name="jayuminton-whitefix" content="v130-{os.environ["GITHUB_RUN_ID"]}"></head>')
          for n in ('index.html','badminton.html'):
              (public/n).write_text(base,encoding='utf-8')
          sw=public/'firebase-messaging-sw.js'
          w=sw.read_text(encoding='utf-8')
          w += "\nself.addEventListener('install',()=>self.skipWaiting());\nself.addEventListener('activate',e=>e.waitUntil(caches.keys().then(ks=>Promise.all(ks.map(k=>caches.delete(k)))).then(()=>self.clients.claim())));\n"
          sw.write_text(w,encoding='utf-8')
          PY
          grep -F 'src="https://script.google.com/macros/s/' "$PUBLIC/index.html" >/dev/null
          grep -F 'Jayuminton-User-v1.3.0-code130-cap8.apk' "$PUBLIC/setup-v205.js" >/dev/null

          cat > "$ROOT/firebase.json" <<'JSON'
          {"hosting":{"public":"public","ignore":["firebase.json","**/.*","**/node_modules/**"],"headers":[{"source":"/index.html","headers":[{"key":"Cache-Control","value":"no-cache, no-store, must-revalidate"}]},{"source":"/badminton.html","headers":[{"key":"Cache-Control","value":"no-cache, no-store, must-revalidate"}]},{"source":"/setup-v205.js","headers":[{"key":"Cache-Control","value":"no-cache, no-store, must-revalidate"}]},{"source":"/config-v204.js","headers":[{"key":"Cache-Control","value":"no-cache, no-store, must-revalidate"}]},{"source":"/firebase-messaging-sw.js","headers":[{"key":"Cache-Control","value":"no-cache, no-store, must-revalidate"}]}],"rewrites":[{"source":"**","destination":"/index.html"}]}}
          JSON
          firebase deploy --only hosting --project "$FIREBASE_PROJECT_ID" --config "$ROOT/firebase.json" --non-interactive

      - name: Verify live page is visible and download is code130
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/pw"; mkdir -p "$D"; cd "$D"
          npm init -y >/dev/null 2>&1
          npm i playwright@1.54.2 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > verify.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const base=process.env.HOSTING_URL.replace(/\/$/,'');
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({userAgent:'Mozilla/5.0 (Linux; Android 15; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/139 Mobile Safari/537.36'});
          const errors=[];
          page.on('pageerror',e=>errors.push(e.message));
          await page.goto(base+'/?whitefix='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForTimeout(9000);
          const frames=page.frames();
          const target=frames.find(f=>f!==page.mainFrame() && f.url().includes('script.google.com')) || frames.find(f=>f!==page.mainFrame() && !f.url().startsWith('about:blank'));
          let inner='';
          if(target) inner=(await target.locator('body').innerText({timeout:6000}).catch(()=>'' )).replace(/\s+/g,' ').trim();
          const result={frameUrls:frames.map(f=>f.url()),inner:inner.slice(0,2000),errors};
          fs.writeFileSync('proof.json',JSON.stringify(result,null,2));
          console.log(JSON.stringify(result,null,2));
          if(!target) throw new Error('court iframe did not load');
          if(inner.length < 20) throw new Error('court iframe is blank');
          await browser.close();
JS
          node verify.mjs

          LIVE_JS="$RUNNER_TEMP/live-setup.js"
          curl --fail --location --retry 5 -H 'Cache-Control: no-cache, no-store' "${HOSTING_URL%/}/setup-v205.js?verify=$GITHUB_RUN_ID" -o "$LIVE_JS"
          grep -F 'Jayuminton-User-v1.3.0-code130-cap8.apk' "$LIVE_JS" >/dev/null
          TARGET="$(sed -n "s/.*const JAYUMINTON_USER_APK_V130 = '\([^']*\)'.*/\1/p" "$LIVE_JS" | head -1)"
          test -n "$TARGET"
          curl --fail --location --retry 5 -H 'Cache-Control: no-cache, no-store' "$TARGET" -o "$RUNNER_TEMP/live-v130.apk"
          LIVE_SHA="$(sha256sum "$RUNNER_TEMP/live-v130.apk" | awk '{print $1}')"
          test "$LIVE_SHA" = "$V130_APK_SHA"
          AAPT=''; for p in "$ANDROID_HOME"/build-tools/*/aapt; do [ -x "$p" ] && AAPT="$p"; done; test -n "$AAPT"
          "$AAPT" dump badging "$RUNNER_TEMP/live-v130.apk" > "$RUNNER_TEMP/live-badging.txt"
          grep -F "versionCode='130'" "$RUNNER_TEMP/live-badging.txt" >/dev/null
          grep -F "versionName='1.3.0'" "$RUNNER_TEMP/live-badging.txt" >/dev/null
          cd "$GITHUB_WORKSPACE"
          cat > deployment/status/v130-white-screen-hotfix.txt <<EOF
          status=success
          live_page=${HOSTING_URL%/}/
          visible_page=yes
          direct_iframe_failsafe=yes
          version_name=1.3.0
          version_code=130
          wait1_groups=8
          court_groups=8
          pulses_per_group=3
          installer_asset=Jayuminton-User-v1.3.0-code130-cap8.apk
          apk_sha256=$LIVE_SHA
          verified_at=$(date -u +%FT%TZ)
          EOF

      - name: Publish verification
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment/status/v130-white-screen-hotfix.txt
          git commit -m 'Verify live page and v1.3.0 code130 download' || exit 0
          git pull --rebase origin main || true
          git push origin main
