name: Build v1.3.2 current-member-only user APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-user-native-push-v132-current-member-only.yml'
      - 'deployment/scripts/patch_user_native_v132_strict_current_member.py'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: jayuminton-user-native-v132-current-member-only
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.7'}
      - run: npm install --global firebase-tools@latest @google/clasp@latest
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - id: resolve
        name: Resolve config and Firebase user app
        shell: bash
        run: |
          set -euo pipefail
          C="$RUNNER_TEMP/deploy.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$C"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          for key in mainDeploymentId pushUrl pushScriptId firebaseProjectId; do jq -e --arg k "$key" '.[$k] and .[$k] != ""' "$C" >/dev/null; done
          echo "MAIN_DEPLOYMENT_ID=$(jq -r '.mainDeploymentId' "$C")" >> "$GITHUB_ENV"
          echo "PUSH_URL=$(jq -r '.pushUrl' "$C")" >> "$GITHUB_ENV"
          echo "PUSH_SCRIPT_ID=$(jq -r '.pushScriptId' "$C")" >> "$GITHUB_ENV"
          echo "FIREBASE_PROJECT_ID=$(jq -r '.firebaseProjectId' "$C")" >> "$GITHUB_ENV"
          PACKAGE='com.jayuminton.user'
          firebase apps:list ANDROID --project "$(jq -r '.firebaseProjectId' "$C")" --json > "$RUNNER_TEMP/apps.json"
          APP_ID="$(jq -r --arg pkg "$PACKAGE" '[.. | objects | select(((.packageName? == $pkg) or (.package_name? == $pkg) or (.androidClientInfo?.packageName? == $pkg)) and ((.appId? // .app_id?) != null)) | (.appId? // .app_id?)] | first // empty' "$RUNNER_TEMP/apps.json")"
          test -n "$APP_ID"
          firebase apps:sdkconfig ANDROID "$APP_ID" --project "$(jq -r '.firebaseProjectId' "$C")" > app/google-services.json
          grep -F 'com.jayuminton.user' app/google-services.json >/dev/null

      - id: live_guard
        name: Verify live atomic member-token guard
        shell: bash
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/push-check"; mkdir -p "$W"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$PUSH_SCRIPT_ID" > "$W/.clasp.json"
          ok=0
          for attempt in 1 2 3 4 5; do
            rm -f "$W/Code.js"
            (cd "$W" && clasp pull) || true
            if grep -F 'JAYUMINTON_MEMBER_TOKEN_SWITCH_ATOMIC_V1' "$W/Code.js" >/dev/null 2>&1; then ok=1; break; fi
            sleep 4
          done
          test "$ok" = 1
          grep -F "if (memberId && String(record.memberId || '') !== memberId) return true;" "$W/Code.js" >/dev/null

      - id: build_apk
        name: Build and verify strict current-member APK
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT='deployment/scripts/build_user_native_push_fresh_v110.sh'
          python3 deployment/scripts/patch_build_user_native_v111.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v112.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v113.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v114.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v115.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v116.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v117.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v118.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v119.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v120_diagnostic.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v121.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v122.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v124_confirmed_overlay.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v126_stop_controller.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v126_raceguard.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v127_member_switch.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v128_repeat_switch.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v129_background_registration.py "$SCRIPT"
          python3 deployment/scripts/patch_user_native_v130_vibration_cap8.py "$SCRIPT"
          python3 deployment/scripts/patch_user_native_v132_strict_current_member.py "$SCRIPT"

          grep -F 'VERSION="1.3.2"' "$SCRIPT" >/dev/null
          grep -F 'VERSION_CODE="132"' "$SCRIPT" >/dev/null
          grep -F 'boolean selectedMemberMatches = hasTargetMemberId &&' "$SCRIPT" >/dev/null
          grep -F '"wait1_ready".equals(type)' "$SCRIPT" >/dev/null
          grep -F '"court_assignment".equals(type)' "$SCRIPT" >/dev/null
          grep -F 'assignmentType && (!hasTargetMemberId || !selectedMemberMatches)' "$SCRIPT" >/dev/null
          grep -F '"missing_target_rejected"' "$SCRIPT" >/dev/null
          grep -F 'NativePushRegistrar.isCurrentMember(this, targetMemberId)' "$SCRIPT" >/dev/null
          grep -F 'stopPreviousMemberAlert(app);' "$SCRIPT" >/dev/null
          grep -F 'private static final int MAX_GROUPS = 8;' "$SCRIPT" >/dev/null
          grep -F 'jayuminton_web_push_selected_member_v1' "$SCRIPT" >/dev/null
          if grep -F 'selectedMemberMatches = !hasTargetMemberId || NativePushRegistrar.isCurrentMember' "$SCRIPT" >/dev/null; then
            echo 'unsafe generic assignment acceptance survived' >&2; exit 1
          fi

          bash "$SCRIPT"
          APK='releases/jayuminton-courtstatus-v1.3.2-current-member-only.apk'
          STATUS='deployment/status/user-native-push-v1.3.2.txt'
          test -s "$APK"; test -s "$STATUS"
          grep -F 'status=success' "$STATUS" >/dev/null
          grep -F 'version=1.3.2' "$STATUS" >/dev/null
          grep -F 'version_code=132' "$STATUS" >/dev/null
          grep -F 'application_id=com.jayuminton.user' "$STATUS" >/dev/null
          grep -F 'assignment_alert_scope=current-selected-member-only' "$STATUS" >/dev/null
          grep -F 'missing_target_assignment=reject-before-popup-sound-vibration' "$STATUS" >/dev/null
          grep -F 'unrelated_assignment=ignore-without-cancelling-current-alert' "$STATUS" >/dev/null
          grep -F 'assignment_types=wait1_ready,court_assignment' "$STATUS" >/dev/null
          cp "$APK" "$RUNNER_TEMP/v132.apk"
          cp "$STATUS" "$RUNNER_TEMP/v132-status.txt"

      - id: publish
        name: Publish verified v1.3.2 user APK
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          cp "$RUNNER_TEMP/v132.apk" releases/jayuminton-courtstatus-v1.3.2-current-member-only.apk
          cp "$RUNNER_TEMP/v132-status.txt" deployment/status/user-native-push-v1.3.2.txt
          sha256sum releases/jayuminton-courtstatus-v1.3.2-current-member-only.apk > deployment/status/user-native-push-v1.3.2.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/jayuminton-courtstatus-v1.3.2-current-member-only.apk deployment/status/user-native-push-v1.3.2.txt deployment/status/user-native-push-v1.3.2.sha256
          git commit -m 'Publish v1.3.2 current-member-only user APK'
          git pull --rebase origin main
          git push origin main

      - name: Record durable build-stage evidence
        if: ${{ always() }}
        shell: bash
        env:
          RESOLVE_OUTCOME: ${{ steps.resolve.outcome }}
          LIVE_GUARD_OUTCOME: ${{ steps.live_guard.outcome }}
          BUILD_APK_OUTCOME: ${{ steps.build_apk.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          set -euo pipefail
          git reset --hard HEAD || true
          git fetch origin main || true
          git checkout -B main origin/main || true
          mkdir -p deployment/status
          {
            echo "source_sha=${GITHUB_SHA}"
            echo "resolve=${RESOLVE_OUTCOME:-not_run}"
            echo "live_member_guard=${LIVE_GUARD_OUTCOME:-not_run}"
            echo "build_apk=${BUILD_APK_OUTCOME:-not_run}"
            echo "publish=${PUBLISH_OUTCOME:-not_run}"
            echo 'required_contract=current-selected-member-only'
            echo 'assignment_types=wait1_ready,court_assignment'
          } > deployment/status/user-v132-build-evidence.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment/status/user-v132-build-evidence.txt
          git commit -m 'Record user v1.3.2 build evidence' || exit 0
          git pull --rebase origin main
          git push origin main

      - uses: actions/upload-artifact@v4
        if: ${{ success() }}
        with:
          name: jayuminton-courtstatus-v1.3.2-current-member-only
          path: releases/jayuminton-courtstatus-v1.3.2-current-member-only.apk
          if-no-files-found: error
          retention-days: 30
