name: Build true-fresh lightweight user APK v1.4.1

on:
  push:
    branches: [main]
    paths:
      - 'deployment/scripts/build_user_lite_true_fresh_v141.sh'
      - '.github/workflows/build-user-lite-v141-true-fresh.yml'
      - 'deployment/scripts/build_user_lite_fresh_v140.sh'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: jayuminton-user-lite-v141-true-fresh
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - id: resolve
        name: Resolve user deployment
        shell: bash
        run: |
          set -euo pipefail
          C="$RUNNER_TEMP/deploy.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$C"
          jq -e '.mainDeploymentId' "$C" >/dev/null
          echo "MAIN_DEPLOYMENT_ID=$(jq -r '.mainDeploymentId' "$C")" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.7'}
      - id: build_apk
        name: Build true-fresh lightweight APK
        shell: bash
        run: |
          set -euo pipefail
          bash deployment/scripts/build_user_lite_true_fresh_v141.sh 2>&1 | tee "$RUNNER_TEMP/user-v141-build.log"
          APK=releases/jayuminton-courtstatus-v1.4.1-true-fresh.apk
          STATUS=deployment/status/user-lite-v1.4.1-true-fresh.txt
          test -s "$APK"
          grep -F 'status=success' "$STATUS" >/dev/null
          grep -F 'application_id=com.jayuminton.courtstatus.fresh' "$STATUS" >/dev/null
          grep -F 'legacy_package_collision=impossible-by-application-id' "$STATUS" >/dev/null
          grep -F 'firebase_messaging=removed' "$STATUS" >/dev/null
          SIZE=$(stat -c%s "$APK")
          [ "$SIZE" -lt 500000 ]
          cp "$APK" "$RUNNER_TEMP/user-v141.apk"
          cp "$STATUS" "$RUNNER_TEMP/user-v141-status.txt"
      - id: publish
        name: Publish verified true-fresh APK
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git fetch origin main
          git checkout -B main origin/main
          cp "$RUNNER_TEMP/user-v141.apk" releases/jayuminton-courtstatus-v1.4.1-true-fresh.apk
          cp "$RUNNER_TEMP/user-v141-status.txt" deployment/status/user-lite-v1.4.1-true-fresh.txt
          sha256sum releases/jayuminton-courtstatus-v1.4.1-true-fresh.apk > deployment/status/user-lite-v1.4.1-true-fresh.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/jayuminton-courtstatus-v1.4.1-true-fresh.apk deployment/status/user-lite-v1.4.1-true-fresh.txt deployment/status/user-lite-v1.4.1-true-fresh.sha256
          git commit -m 'Publish true-fresh lightweight user APK v1.4.1'
          git pull --rebase origin main
          git push origin main
      - name: Record build evidence
        if: ${{ always() }}
        shell: bash
        env:
          RESOLVE: ${{ steps.resolve.outcome }}
          BUILD: ${{ steps.build_apk.outcome }}
          PUBLISH: ${{ steps.publish.outcome }}
        run: |
          set -euo pipefail
          git reset --hard HEAD || true
          git fetch origin main || true
          git checkout -B main origin/main || true
          mkdir -p deployment/status
          {
            echo "source_sha=${GITHUB_SHA}"
            echo "resolve=${RESOLVE:-not_run}"
            echo "build_apk=${BUILD:-not_run}"
            echo "publish=${PUBLISH:-not_run}"
            if [ -f "$RUNNER_TEMP/user-v141-build.log" ]; then
              echo 'build_log_tail_begin'
              tail -40 "$RUNNER_TEMP/user-v141-build.log" | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g'
              echo
              echo 'build_log_tail_end'
            fi
          } > deployment/status/user-lite-v1.4.1-true-fresh-build-evidence.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment/status/user-lite-v1.4.1-true-fresh-build-evidence.txt
          git commit -m 'Record true-fresh user APK build evidence' || exit 0
          git pull --rebase origin main
          git push origin main
      - uses: actions/upload-artifact@v4
        if: ${{ success() }}
        with:
          name: jayuminton-courtstatus-v1.4.1-true-fresh
          path: releases/jayuminton-courtstatus-v1.4.1-true-fresh.apk
          if-no-files-found: error
          retention-days: 30
