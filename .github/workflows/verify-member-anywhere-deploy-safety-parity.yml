name: Verify member anywhere deploy safety parity

on:
  push:
    branches:
      - member-anywhere-controls-v3
    paths:
      - 'source-snapshot/current-main/MemberAnywhereSwap.js'
      - 'source-snapshot/current-main/MemberSwapClient.html'
      - 'source-snapshot/current-main/MemberSwapAction.html'
      - 'source-snapshot/current-main/MemberControls.html'
      - 'source-snapshot/current-main/MemberSwapInbox.html'
      - '.github/workflows/deploy-member-anywhere-controls-v3.yml'
      - '.github/workflows/verify-member-anywhere-contract.yml'
      - '.github/workflows/verify-member-anywhere-cancel-repoll.yml'
      - '.github/workflows/verify-member-anywhere-read-helper-purity.yml'
      - '.github/workflows/verify-member-anywhere-request-tracking.yml'
      - '.github/workflows/verify-member-anywhere-deploy-safety-parity.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify-deploy-safety-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: member-anywhere-controls-v3

      - name: Verify production deploy keeps current swap safety gates
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY='.github/workflows/deploy-member-anywhere-controls-v3.yml'
          CONTRACT_VERIFY='.github/workflows/verify-member-anywhere-contract.yml'
          CANCEL_VERIFY='.github/workflows/verify-member-anywhere-cancel-repoll.yml'
          READ_VERIFY='.github/workflows/verify-member-anywhere-read-helper-purity.yml'
          TRACK_VERIFY='.github/workflows/verify-member-anywhere-request-tracking.yml'

          # Swap RPCs must stay on the canonical member-session source in manual production deploys.
          grep -F "grep -F 'function memberAnywhereSession_()' MemberSwapClient.html" "$DEPLOY" >/dev/null
          grep -F "currentMemberSessionToken()===''" "$DEPLOY" >/dev/null && exit 1 || true
          grep -F "typeof currentMemberSessionToken==='function'?String(currentMemberSessionToken()||'')" "$DEPLOY" >/dev/null

          # Late async responses must remain isolated to the member/login session that started them.
          grep -F "grep -F 'function memberAnywhereSameSession_(expected)' MemberSwapAction.html" "$DEPLOY" >/dev/null
          grep -F "grep -F 'function displayedSessionStillCurrent_()' MemberSwapInbox.html" "$DEPLOY" >/dev/null
          grep -F "String(current.token||'')===displayedToken" "$DEPLOY" >/dev/null

          # Request-change/expiry races must re-poll, and stale responses must not close unrelated modals.
          grep -F "message.indexOf('자리교환 요청이 변경')===0||message==='교환 요청이 없거나 만료됐어요.'" "$DEPLOY" >/dev/null
          grep -F "if(requestChanged_(result)){showLatestRequestAfterChange_(root);return;}" "$DEPLOY" >/dev/null
          grep -F "if(shouldClose&&root&&typeof root.close==='function')root.close();" "$DEPLOY" >/dev/null

          # Keep the standalone contract verifier's stale-accept coverage wired into deploy parity too.
          # If either server race response stops re-polling, parity must fail even before a manual deploy.
          test -f "$CONTRACT_VERIFY"
          grep -F "message==='자리 상태가 변경되어 교환할 수 없어요.'" "$CONTRACT_VERIFY" >/dev/null
          grep -F "message==='이미 같은 상태라 자리교환이 필요하지 않아요.'" "$CONTRACT_VERIFY" >/dev/null
          grep -F "if(requestChanged_(result)){showLatestRequestAfterChange_(root);return;}" "$CONTRACT_VERIFY" >/dev/null

          # A response from an old session must clean only its still-mounted swap request prompt.
          grep -F "grep -F 'function memberAnywhereDiscardStaleRequestPrompt_(button)' MemberSwapAction.html" "$DEPLOY" >/dev/null
          grep -F "if(!button||!button.isConnected)return;" "$DEPLOY" >/dev/null
          grep -F "button.disabled=false;button.textContent='교환요청';" "$DEPLOY" >/dev/null

          # The dedicated stale-cancel verifier is part of deploy-safety parity too.
          # If its request-binding or immediate re-poll checks are weakened, parity must fail.
          test -f "$CANCEL_VERIFY"
          grep -F "memberAnywhereCancelOutgoingServer_(expectedTargetId,expectedCreatedAt)" "$CANCEL_VERIFY" >/dev/null
          grep -F "function memberCancelAnywhereSwap(sessionToken,memberId,expectedTargetId,expectedCreatedAt)" "$CANCEL_VERIFY" >/dev/null
          grep -F "function memberAnywhereCancelResultChanged_(result)" "$CANCEL_VERIFY" >/dev/null
          grep -F "setTimeout(memberAnywhereCheckOutgoing_,0)" "$CANCEL_VERIFY" >/dev/null

          # Read-only swap polling is also part of the production safety contract.
          # Keep the dedicated purity verifier wired into parity so it cannot silently weaken or stop running.
          test -f "$READ_VERIFY"
          grep -F "reader = function_body('memberAnywhereReadSwapRequest_')" "$READ_VERIFY" >/dev/null
          grep -F "if '.remove(' in reader or 'memberAnywhereClearSwapRequest_' in reader:" "$READ_VERIFY" >/dev/null
          grep -F "for name in ('memberGetAnywhereSwapRequest', 'memberGetAnywhereOutgoingSwap'):" "$READ_VERIFY" >/dev/null
          grep -F "if 'memberAnywherePeekActiveOutgoingTarget_' not in outgoing:" "$READ_VERIFY" >/dev/null
          grep -F "if 'memberAnywhereReadActiveOutgoingTarget_' in outgoing:" "$READ_VERIFY" >/dev/null

          # Request tracking must remain reconstructable after reload: immutable request time,
          # both location baselines, and the selected partner id are all required.
          # Keep the dedicated verifier in parity so these checks cannot silently weaken or stop running.
          test -f "$TRACK_VERIFY"
          grep -F "createdAt:Number(request.createdAt||0)" "$TRACK_VERIFY" >/dev/null
          grep -F "requesterLocationKey:String(request.snapshot.from.locationKey||'')" "$TRACK_VERIFY" >/dev/null
          grep -F "targetLocationKey:String(request.snapshot.to.locationKey||'')" "$TRACK_VERIFY" >/dev/null
          grep -F "if(result&&result.ok)result.targetId=String(partner.id||'')" "$TRACK_VERIFY" >/dev/null
          grep -F "memberAnywhereStartOutgoingSync_(result.requesterLocationKey,result.createdAt,result.targetLocationKey,result.targetId)" "$TRACK_VERIFY" >/dev/null
          grep -F "memberAnywhereStartOutgoingSync_(outgoing.requesterLocationKey,outgoing.createdAt,outgoing.targetLocationKey,outgoing.targetId)" "$TRACK_VERIFY" >/dev/null

          # The actual manual production deploy must enforce the same read-purity gate, not merely rely on the standalone verifier.
          grep -F "text = Path('MemberAnywhereSwap.js').read_text(encoding='utf-8')" "$DEPLOY" >/dev/null
          grep -F "reader=body('memberAnywhereReadSwapRequest_')" "$DEPLOY" >/dev/null
          grep -F "if '.remove(' in reader or 'memberAnywhereClearSwapRequest_' in reader:" "$DEPLOY" >/dev/null
          grep -F "for name in ('memberGetAnywhereSwapRequest','memberGetAnywhereOutgoingSwap'):" "$DEPLOY" >/dev/null
          grep -F "if 'memberAnywherePeekActiveOutgoingTarget_' not in outgoing or 'memberAnywhereReadActiveOutgoingTarget_' in outgoing:" "$DEPLOY" >/dev/null

          echo 'MEMBER_ANYWHERE_DEPLOY_SAFETY_PARITY_OK'
