name: Validate iOS native app

on:
  push:
    branches: [main]
    paths:
      - 'ios-native/**'
      - '.github/workflows/validate-ios-native.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Reject GAS runtime regression
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'script\.google\.com|google\.script\.run|Apps Script deployment' ios-native --exclude=README.md; then
            echo 'GAS_RUNTIME_REFERENCE_FOUND_IN_IOS_NATIVE' >&2
            exit 1
          fi
          grep -RInF 'https://jayuminton-push.web.app/' ios-native/Jayuminton >/dev/null

      - name: Install XcodeGen
        shell: bash
        run: brew install xcodegen

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          cd ios-native
          xcodegen generate
          test -d JayumintonIOS.xcodeproj
          plutil -lint Jayuminton/Info.plist

      - name: Build unsigned iOS simulator app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios-native/JayumintonIOS.xcodeproj \
            -scheme JayumintonIOS \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios-native/build/simulator \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Build unsigned iPhone device app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios-native/JayumintonIOS.xcodeproj \
            -scheme JayumintonIOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios-native/build/device \
            CODE_SIGNING_ALLOWED=NO \
            clean build
          find ios-native/build/device/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit | grep -F '.app' >/dev/null

      - name: Verify native shell contract
        shell: bash
        run: |
          set -euo pipefail
          SOURCE='ios-native/Jayuminton/CourtStatusWebView.swift'
          grep -F 'WKWebView' "$SOURCE" >/dev/null
          grep -F 'JayumintonUserNativeIOS/' "$SOURCE" >/dev/null
          grep -F 'static let appVersion = "1.0.0"' "$SOURCE" >/dev/null
          grep -F 'https://jayuminton-push.web.app/' "$SOURCE" >/dev/null
          grep -F 'window.NativeUserApp' "$SOURCE" >/dev/null
          ! grep -RInF 'script.google.com' ios-native/Jayuminton

      - name: Stage unsigned device app artifact
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find ios-native/build/device/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -d "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$RUNNER_TEMP/jayuminton-ios-unsigned-device-app.zip"

      - name: Upload unsigned device artifact
        uses: actions/upload-artifact@v4
        with:
          name: jayuminton-ios-unsigned-device-app
          path: ${{ runner.temp }}/jayuminton-ios-unsigned-device-app.zip
          if-no-files-found: error
          retention-days: 14
