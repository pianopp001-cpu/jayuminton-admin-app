name: Patch busy save controls

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch_busy_voice_v1.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply targeted patch
        run: python scripts/patch_busy_voice_v1.py
      - name: Commit patched source
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source-snapshot/current-main/Script.html source-snapshot/current-main/Style.html
          git commit -m "fix: block controls while saving except voice controls"
          git push
