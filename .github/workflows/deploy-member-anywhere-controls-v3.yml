name: Deploy member anywhere controls v3

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: jayuminton-member-anywhere-controls-v3
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: member-anywhere-controls-v3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          CONFIG="$RUNNER_TEMP/deploy.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$CONFIG"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          jq -e '.mainScriptId and .mainDeploymentId' "$CONFIG" >/dev/null
          echo "MAIN_SCRIPT_ID=$(jq -r '.mainScriptId' "$CONFIG")" >> "$GITHUB_ENV"
          echo "MAIN_DEPLOYMENT_ID=$(jq -r '.mainDeploymentId' "$CONFIG")" >> "$GITHUB_ENV"
      - name: Install clasp
        run: npm install --global @google/clasp@latest
      - name: Pull live and overlay member controls
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/main-live"
          SRC="$GITHUB_WORKSPACE/source-snapshot/current-main"
          mkdir -p "$WORK"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$MAIN_SCRIPT_ID" > "$WORK/.clasp.json"
          cd "$WORK"
          clasp pull
          cp "$SRC/Index.html" Index.html
          cp "$SRC/MemberAnywhereSwap.js" MemberAnywhereSwap.js
          cp "$SRC/MemberControls.html" MemberControls.html
          cp "$SRC/MemberSwapAction.html" MemberSwapAction.html
          cp "$SRC/MemberSwapClient.html" MemberSwapClient.html
          cp "$SRC/MemberSwapInbox.html" MemberSwapInbox.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          code=Path('Code.js'); s=code.read_text(encoding='utf-8')
          marker='function autoFillCourtUnlocked_(pin, courtNo, ids) {'
          helper='''function pickAutoFillIds_(existingIds, needed, members) {\n  existingIds = normalizeIds_(existingIds);\n  needed = Number(needed) || 0;\n  if (needed <= 0) return [];\n  const occupied = {};\n  Object.keys(readCourts_()).forEach(function(no){ (readCourts_()[no]||[]).forEach(function(id){occupied[String(id)]=true;}); });\n  (readWaitGroups_()||[]).forEach(function(group){ (group||[]).forEach(function(id){occupied[String(id)]=true;}); });\n  existingIds.forEach(function(id){ occupied[String(id)] = true; });\n  const active = (members || []).filter(function(member) { return member && member.status === 'active' && !occupied[String(member.id)]; }).slice().sort(function(a,b) { const d=(Number(a.games)||0)-(Number(b.games)||0); return d || String(a.createdAt||'').localeCompare(String(b.createdAt||'')); });\n  let existingMale=0;\n  existingIds.forEach(function(id){ const member=(members||[]).find(function(item){return String(item.id)===String(id);}); if(member&&member.gender!=='female')existingMale+=1; });\n  const targets=[4,0,2];\n  for(let t=0;t<targets.length;t+=1){ const needMale=targets[t]-existingMale; const needFemale=needed-needMale; if(needMale<0||needFemale<0)continue; const males=active.filter(function(m){return m.gender!=='female';}).slice(0,needMale); const females=active.filter(function(m){return m.gender==='female';}).slice(0,needFemale); if(males.length===needMale&&females.length===needFemale)return males.concat(females).map(function(m){return String(m.id);}); }\n  throw new Error('현재 코트배정 대기 인원으로 남복·여복·혼복 조합을 만들 수 없습니다.');\n}\n\n'''
          if 'function pickAutoFillIds_' not in s:
              if marker not in s: raise SystemExit('autoFillCourt marker missing')
              s=s.replace(marker,helper+marker,1)
          old="  const needed = GROUP_SIZE - existingIds.length;\n\n  if (needed <= 0 || ids.length !== needed) {"
          new="  const needed = GROUP_SIZE - existingIds.length;\n\n  if (needed > 0 && ids.length === 0) {\n    ids = pickAutoFillIds_(existingIds, needed, readMembers_());\n  }\n\n  if (needed <= 0 || ids.length !== needed) {"
          if 'ids = pickAutoFillIds_(existingIds, needed, readMembers_());' not in s:
              if old not in s: raise SystemExit('auto-fill guard marker missing')
              s=s.replace(old,new)
          code.write_text(s,encoding='utf-8')

          script=Path('Script.html'); s=script.read_text(encoding='utf-8')
          if 'let LAST_REDO_STATE = null;' not in s:s=s.replace('let LAST_UNDO_STATE = null;','let LAST_UNDO_STATE = null;\nlet LAST_REDO_STATE = null;',1)
          # Admin two-person click always uses immediate admin move/swap; never member request flow.
          s=s.replace("if (IS_ADMIN) {\n    toggleSelected(memberId);\n    return;\n  }", "if (IS_ADMIN) {\n    quickPickMember(memberId);\n    return;\n  }")
          # Make admin saving state unmistakable and block duplicate actions.
          addon='''\nfunction adminRefreshNow(){if(!IS_ADMIN)return;showAdminSaving_('새로고침 중입니다 · 잠시 기다려 주세요');server('getPublicState',[]).then(function(state){STATE=normalizeStateMemberProfiles(state);SELECTED.clear();renderState();}).catch(function(error){alert(String((error&&error.message)||error||'새로고침에 실패했습니다.'));}).finally(hideAdminSaving_);}\nfunction showAdminSaving_(text){if(!IS_ADMIN)return;var el=document.getElementById('adminSavingOverlay');if(!el){el=document.createElement('div');el.id='adminSavingOverlay';el.className='admin-saving-overlay';el.innerHTML='<div class="admin-saving-card"><div class="admin-saving-spinner"></div><strong id="adminSavingText"></strong><small>처리가 끝날 때까지 잠시 기다려 주세요.</small></div>';document.body.appendChild(el);}var t=document.getElementById('adminSavingText');if(t)t.textContent=text||'저장 중입니다';el.classList.add('show');}\nfunction hideAdminSaving_(){var el=document.getElementById('adminSavingOverlay');if(el)el.classList.remove('show');}\nfunction updateUndoRedoButtons_(){const undo=document.getElementById('undoButton');const redo=document.getElementById('redoButton');if(undo)undo.disabled=!LAST_UNDO_STATE;if(redo)redo.disabled=!LAST_REDO_STATE;}\nfunction redoLastAction(){if(!LAST_REDO_STATE)return;const target=JSON.parse(JSON.stringify(LAST_REDO_STATE));const current=JSON.parse(JSON.stringify(STATE));showAdminSaving_('다시 실행 중입니다');server('undoLastAction',[ADMIN_PIN_VALUE,target]).then(function(state){LAST_UNDO_STATE=current;LAST_REDO_STATE=null;STATE=normalizeStateMemberProfiles(state);SELECTED.clear();renderState();updateUndoRedoButtons_();}).catch(function(error){alert(String((error&&error.message)||error));}).finally(hideAdminSaving_);}\n'''
          if 'function showAdminSaving_' not in s:s=s.replace('</script>',addon+'\n</script>',1)
          script.write_text(s,encoding='utf-8')

          admin=Path('Admin.html'); a=admin.read_text(encoding='utf-8')
          needle='    >↶ 실행 취소</button>\n    <button class="primary mobile-assign-button" onclick="smartAssignSelected()">위치 자동배정</button>'
          replacement='    >↶ 실행 취소</button>\n    <button id="mobileRefreshButton" class="ghost-button mobile-refresh-button" type="button" onclick="adminRefreshNow()">↻ 새로고침</button>\n    <button class="primary mobile-assign-button" onclick="smartAssignSelected()">위치 자동배정</button>'
          if 'id="mobileRefreshButton"' not in a:
              if needle not in a: raise SystemExit('mobile undo/assign marker missing')
              a=a.replace(needle,replacement,1)
          admin.write_text(a,encoding='utf-8')

          style=Path('Style.html'); css=style.read_text(encoding='utf-8')
          patch='''\n/* JAYUMINTON_ADMIN_SAFE_UX_V1 */\n.mobile-refresh-button{font-size:12px!important;font-weight:500!important;line-height:1!important;min-height:36px!important;height:36px!important;padding:0 10px!important;white-space:nowrap!important}\n.admin-saving-overlay{position:fixed;inset:0;z-index:99999;background:rgba(15,23,42,.48);display:none;align-items:center;justify-content:center;pointer-events:all}.admin-saving-overlay.show{display:flex}.admin-saving-card{background:#fff;border-radius:18px;padding:24px 28px;min-width:260px;text-align:center;box-shadow:0 18px 55px rgba(0,0,0,.28);display:flex;flex-direction:column;gap:8px;align-items:center}.admin-saving-card strong{font-size:18px}.admin-saving-card small{font-size:12px;color:#64748b}.admin-saving-spinner{width:34px;height:34px;border:4px solid #e2e8f0;border-top-color:#475569;border-radius:50%;animation:adminSavingSpin .8s linear infinite}@keyframes adminSavingSpin{to{transform:rotate(360deg)}}\n'''
          if 'JAYUMINTON_ADMIN_SAFE_UX_V1' not in css: css=css.rstrip()+patch
          style.write_text(css,encoding='utf-8')
          PY
          grep -F "include('MemberControls')" Index.html >/dev/null
          grep -F 'function memberMoveSelf' MemberAnywhereSwap.js >/dev/null
          grep -F 'memberAnywhereMoveSelfServer_' MemberSwapClient.html >/dev/null
          grep -F 'showDestinationMenu' MemberControls.html >/dev/null
          grep -F 'SELF_HOLD_MS=650' MemberControls.html >/dev/null
          grep -F "document.addEventListener('touchstart'" MemberControls.html >/dev/null
          grep -F 'id="mobileRefreshButton"' Admin.html >/dev/null
          grep -F 'showAdminSaving_' Script.html >/dev/null
          node --check Code.js
          node --check MemberAnywhereSwap.js
          python3 - <<'PY'
          from pathlib import Path
          for name in ['Script.html','MemberControls.html','MemberSwapAction.html','MemberSwapClient.html','MemberSwapInbox.html']:
              s=Path(name).read_text(encoding='utf-8');a=s.find('<script>');b=s.rfind('</script>')
              if a>=0 and b>a:(Path('/tmp')/(name+'.js')).write_text(s[a+8:b],encoding='utf-8')
          PY
          for f in /tmp/*.html.js; do [ -e "$f" ] && node --check "$f"; done
      - name: Push and update existing MAIN deployment
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/main-live"
          clasp push --force
          clasp create-deployment --deploymentId "$MAIN_DEPLOYMENT_ID" --description "member anywhere controls v3 safe latest $GITHUB_RUN_ID"
