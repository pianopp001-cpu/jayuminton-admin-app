name: Deploy user Cloudflare seat UX fix

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/deploy-user-cloudflare-seat-fix.yml'
      - 'deployment/jayuminton/user_cloudflare_web.py'
      - 'source-snapshot/current-main/Index.html'
      - 'source-snapshot/current-main/Style.html'
      - 'source-snapshot/current-main/Script.html'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: jayuminton-user-cloudflare-seat-fix
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      USER_WORKER_NAME: jayuminton-user-web
      USER_WORKER_URL: https://jayuminton-user-web.pianopp001.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install tools
        run: npm install --global @google/clasp@latest wrangler@latest
      - name: Resolve config
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$RUNNER_TEMP/deploy.json"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          MAIN_SCRIPT_ID="$(jq -r '.mainScriptId // empty' "$RUNNER_TEMP/deploy.json")"
          test -n "$MAIN_SCRIPT_ID"; test -n "$CLOUDFLARE_API_TOKEN"; test -n "$CLOUDFLARE_ACCOUNT_ID"
          echo "MAIN_SCRIPT_ID=$MAIN_SCRIPT_ID" >> "$GITHUB_ENV"
      - name: Patch Apps Script HEAD for user RPC
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/user-backend"; mkdir -p "$WORK"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$MAIN_SCRIPT_ID" > "$WORK/.clasp.json"
          (cd "$WORK" && clasp pull)
          python3 - "$WORK/Code.js" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text(encoding='utf-8')
          include='function include(filename) {'
          if include not in s: raise SystemExit('include marker missing')
          self_fn=r'''
          function memberSetOwnStatus(sessionToken,memberId,status){
            return withDocumentLock_('회원 본인 상태 변경',function(){
              memberId=memberSessionAuth_(sessionToken,memberId);
              status=String(status||'');
              if(['active','rest','away','before'].indexOf(status)<0)throw new Error('지원하지 않는 상태입니다.');
              const courts=readCourts_(),startedAt=readCourtStartedAt_(),waitGroups=readWaitGroups_();
              Object.keys(courts).forEach(function(k){
                const before=(courts[k]||[]).length;
                courts[k]=(courts[k]||[]).filter(function(id){return String(id)!==memberId;});
                if(courts[k].length!==before&&courts[k].length<GROUP_SIZE)startedAt[k]='';
              });
              for(let i=0;i<waitGroups.length;i+=1)waitGroups[i]=(waitGroups[i]||[]).filter(function(id){return String(id)!==memberId;});
              writeCourts_(courts,startedAt); writeWaitGroups_(waitGroups);
              updateMemberStatuses_([memberId],status); touch_(); return getPublicState();
            });
          }
          '''
          if 'function memberSetOwnStatus(' not in s:
              s=s.replace(include,self_fn+'\n'+include,1)
          allowed=['getPublicState','getMemberPasswordVersion','verifyMemberPassword','resumeMemberSession','memberMoveToWaitGroup','memberLeaveWaitGroup','memberSetOwnStatus','memberRequestWaitSwap','memberGetWaitSwapRequest','memberRespondWaitSwap']
          allow=',\n    '.join(x+': true' for x in allowed)
          cases='\n'.join(('    ' if i==0 else '    else ')+f'if (name === "{x}") result = {x}.apply(null, args);' for i,x in enumerate(allowed))
          rpc=r'''
          function memberCloudflareRpc_(e) {
            ensureSetup_();
            const p=e&&e.parameter?e.parameter:{};
            const callback=String(p.callback||'');
            const name=String(p.rpc||'');
            const allowed={__ALLOW__};
            if(!/^[A-Za-z_$][A-Za-z0-9_$]{0,80}$/.test(callback))throw new Error('잘못된 callback입니다.');
            if(!allowed[name])return ContentService.createTextOutput(callback+'('+JSON.stringify({ok:false,error:'허용되지 않은 사용자 함수입니다.'})+');').setMimeType(ContentService.MimeType.JAVASCRIPT);
            let args=[];
            try{const encoded=String(p.payload||'');if(encoded){const normalized=encoded.replace(/-/g,'+').replace(/_/g,'/');const pad='='.repeat((4-normalized.length%4)%4);args=JSON.parse(Utilities.newBlob(Utilities.base64Decode(normalized+pad)).getDataAsString('UTF-8'));}if(!Array.isArray(args))throw new Error('args');}
            catch(error){return ContentService.createTextOutput(callback+'('+JSON.stringify({ok:false,error:'요청 데이터를 읽을 수 없습니다.'})+');').setMimeType(ContentService.MimeType.JAVASCRIPT);}
            try{let result;
          __CASES__
              else throw new Error('허용되지 않은 사용자 함수입니다.');
              return ContentService.createTextOutput(callback+'('+JSON.stringify({ok:true,result:result})+');').setMimeType(ContentService.MimeType.JAVASCRIPT);
            }catch(error){return ContentService.createTextOutput(callback+'('+JSON.stringify({ok:false,error:String(error&&error.message||error||'서버 오류')})+');').setMimeType(ContentService.MimeType.JAVASCRIPT);}
          }
          '''.replace('__ALLOW__',allow).replace('__CASES__',cases)
          start=s.find('function memberCloudflareRpc_(e)')
          if start>=0:
              end=s.find('\nfunction include(filename) {',start)
              if end>start:s=s[:start]+rpc+s[end:]
          else:
              s=s.replace(include,rpc+'\n'+include,1)
          branch="  if (e && e.parameter && e.parameter.memberRpc === '1' && e.parameter.rpc) {\n    return memberCloudflareRpc_(e);\n  }\n"
          if branch not in s:
              marker='function doGet(e) {'
              if marker not in s: raise SystemExit('doGet marker missing')
              s=s.replace(marker,marker+'\n'+branch,1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -F 'function memberSetOwnStatus(' "$WORK/Code.js" >/dev/null
          grep -F 'memberSetOwnStatus: true' "$WORK/Code.js" >/dev/null
          grep -F 'function memberCloudflareRpc_(e)' "$WORK/Code.js" >/dev/null
          (cd "$WORK" && clasp push --force)
          LIST="$(cd "$WORK" && clasp list-deployments || true)"
          printf '%s\n' "$LIST"
          HEAD_DEPLOYMENT_ID="$(printf '%s\n' "$LIST" | awk '/@HEAD/{print $2; exit}')"
          test -n "$HEAD_DEPLOYMENT_ID"
          echo "USER_RPC_UPSTREAM=https://script.google.com/macros/s/$HEAD_DEPLOYMENT_ID/exec" >> "$GITHUB_ENV"
      - name: Probe HEAD RPC before Cloudflare deploy
        shell: bash
        run: |
          set -euo pipefail
          sleep 4
          CALLBACK="jmHeadProbe${GITHUB_RUN_ID}"
          curl --fail --location --retry 6 --retry-delay 2 --max-time 60 "$USER_RPC_UPSTREAM?memberRpc=1&rpc=getPublicState&callback=$CALLBACK&payload=W10&nonce=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/head-state.js"
          grep -F "$CALLBACK(" "$RUNNER_TEMP/head-state.js" >/dev/null
          grep -F '"ok":true' "$RUNNER_TEMP/head-state.js" >/dev/null
      - name: Build user frontend and Worker
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/user-worker"; mkdir -p "$ROOT/public"
          python3 deployment/jayuminton/user_cloudflare_web.py build-frontend --snapshot source-snapshot/current-main --out "$ROOT/public" --rpc-url "$USER_WORKER_URL"
          for marker in 'jayuminton-user-seat-self-status-v2' 'memberRequestWaitSwap(targetMemberId)' 'memberSetOwnStatus' 'NativeUserApp.setMember'; do grep -F "$marker" "$ROOT/public/index.html" >/dev/null; done
          ! grep -F '관리자 화면을 불러오는 중입니다' "$ROOT/public/index.html" >/dev/null
          python3 - "$ROOT/public/index.html" "$ROOT/worker.js" <<'PY'
          import json,sys
          from pathlib import Path
          html=Path(sys.argv[1]).read_text(encoding='utf-8')
          worker='''const USER_HTML=%s; export default { async fetch(request,env){ const url=new URL(request.url); const h={'Cache-Control':'no-store, no-cache, must-revalidate, max-age=0','X-Content-Type-Options':'nosniff'}; if(url.searchParams.get('memberRpc')==='1'&&url.searchParams.get('rpc')){ const cb=url.searchParams.get('callback')||''; const rpc=url.searchParams.get('rpc')||''; const payload=url.searchParams.get('payload')||'W10'; if(!/^[A-Za-z_$][\\w$]*$/.test(cb)||!/^[A-Za-z_$][\\w$]*$/.test(rpc)) return new Response('invalid_request',{status:400,headers:h}); const up=new URL(env.USER_RPC_UPSTREAM); for(const [k,v] of [['memberRpc','1'],['rpc',rpc],['callback',cb],['payload',payload],['nonce',url.searchParams.get('nonce')||Date.now().toString()]]) up.searchParams.set(k,v); const r=await fetch(up.toString(),{redirect:'follow'}); const t=await r.text(); return new Response(t,{status:r.ok?200:502,headers:{...h,'Content-Type':'application/javascript; charset=utf-8'}}); } if(request.method!=='GET'&&request.method!=='HEAD') return new Response('method_not_allowed',{status:405,headers:h}); return new Response(request.method==='HEAD'?null:USER_HTML,{status:200,headers:{...h,'Content-Type':'text/html; charset=utf-8'}}); }};''' % json.dumps(html,ensure_ascii=False)
          Path(sys.argv[2]).write_text(worker,encoding='utf-8')
          PY
          cat > "$ROOT/wrangler.toml" <<EOF
          name = "$USER_WORKER_NAME"
          main = "worker.js"
          compatibility_date = "2026-08-21"
          workers_dev = true
          [vars]
          USER_RPC_UPSTREAM = "$USER_RPC_UPSTREAM"
          EOF
      - name: Deploy and verify live user web
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/user-worker"
          wrangler deploy --config wrangler.toml
          sleep 6
          curl --fail --location --retry 6 --retry-delay 2 --max-time 60 "$USER_WORKER_URL/?verify=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/live.html"
          for marker in 'jayuminton-user-seat-self-status-v2' 'memberRequestWaitSwap(targetMemberId)' 'memberSetOwnStatus' 'NativeUserApp.setMember'; do grep -F "$marker" "$RUNNER_TEMP/live.html" >/dev/null; done
          CALLBACK="jmSeatProbe${GITHUB_RUN_ID}"
          curl --fail --retry 6 --retry-delay 2 --max-time 60 "$USER_WORKER_URL/?memberRpc=1&rpc=getPublicState&callback=$CALLBACK&payload=W10&nonce=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/state.js"
          grep -F "$CALLBACK(" "$RUNNER_TEMP/state.js" >/dev/null
          grep -F '"ok":true' "$RUNNER_TEMP/state.js" >/dev/null
          echo 'USER_SEAT_UX_LIVE=success'
