name: Inspect PUSH token registration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-push-register.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global @google/clasp@latest
      - name: Pull and inspect PUSH functions
        shell: bash
        run: |
          set -euo pipefail
          C="$RUNNER_TEMP/deploy.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$C"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          SID="$(jq -r '.pushScriptId' "$C")"
          W="$RUNNER_TEMP/push"; mkdir -p "$W"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$SID" > "$W/.clasp.json"
          cd "$W"; clasp pull
          python3 - "$GITHUB_WORKSPACE/deployment/jayuminton/PUSH_REGISTER_DIAGNOSTIC.txt" <<'PY'
          from pathlib import Path
          import re,sys
          text='\n'.join(p.read_text(encoding='utf-8',errors='ignore') for p in list(Path('.').glob('*.js'))+list(Path('.').glob('*.gs')))
          def extract(name):
              m=re.search(r'function\s+'+re.escape(name)+r'\s*\([^)]*\)\s*\{',text)
              if not m: return name+': NOT_FOUND'
              start=m.start(); i=m.end(); depth=1; quote=None; esc=False
              while i<len(text) and depth:
                  c=text[i]
                  if quote:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c==quote: quote=None
                  else:
                      if c in "'\"`": quote=c
                      elif c=='{': depth+=1
                      elif c=='}': depth-=1
                  i+=1
              return text[start:i]
          raw='\n\n'.join([extract('registerWebToken_'),extract('unregisterWebToken_'),extract('getWebPushTokens_'),extract('countWebPushTokens_')])
          raw=re.sub(r'https?://[^\s\"\']+','<URL>',raw)
          raw=re.sub(r'[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}','<EMAIL>',raw)
          raw=re.sub(r'([\"\'])[A-Za-z0-9_\-]{32,}\1',r'\1<OPAQUE>\1',raw)
          Path(sys.argv[1]).write_text(raw[:24000],encoding='utf-8')
          PY
          cd "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '4189822+github-actions[bot]@users.noreply.github.com'
          git add deployment/jayuminton/PUSH_REGISTER_DIAGNOSTIC.txt
          git commit -m 'Record exact PUSH registration functions' || exit 0
          git pull --rebase origin main || true
          git push
