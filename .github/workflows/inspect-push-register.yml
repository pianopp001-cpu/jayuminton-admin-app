name: Inspect PUSH token registration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-push-register.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global @google/clasp@latest
      - name: Pull actual MAIN and decode v1.6.37 PWA
        shell: bash
        run: |
          set -euo pipefail
          C="$RUNNER_TEMP/deploy.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$C"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          SID="$(jq -r '.mainScriptId' "$C")"
          W="$RUNNER_TEMP/main"; mkdir -p "$W"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$SID" > "$W/.clasp.json"
          cd "$W"; clasp pull
          cat "$GITHUB_WORKSPACE"/deployment/jayuminton/v1637-web/setup-v205.js.gz.b64.part-* | tr -d '\r\n' | base64 -d > "$RUNNER_TEMP/setup.gz"
          gzip -dc "$RUNNER_TEMP/setup.gz" > "$RUNNER_TEMP/setup-v205.js"
          python3 - "$W/Script.html" "$RUNNER_TEMP/setup-v205.js" "$GITHUB_WORKSPACE/deployment/jayuminton/MEMBER_INSTALL_CODE_DIAGNOSTIC.txt" <<'PY'
          from pathlib import Path
          import re,sys
          main=Path(sys.argv[1]).read_text(encoding='utf-8',errors='ignore')
          pwa=Path(sys.argv[2]).read_text(encoding='utf-8',errors='ignore')
          def function(text,name):
              m=re.search(r'function\s+'+re.escape(name)+r'\s*\([^)]*\)\s*\{',text)
              if not m: return name+': NOT_FOUND'
              start=m.start(); i=m.end(); depth=1; q=None; esc=False
              while i<len(text) and depth:
                  c=text[i]
                  if q:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c==q: q=None
                  else:
                      if c in "'\"`": q=c
                      elif c=='{': depth+=1
                      elif c=='}': depth-=1
                  i+=1
              return text[start:i]
          def around(text,needle,radius=1200):
              i=text.find(needle)
              return (needle+': NOT_FOUND') if i<0 else text[max(0,i-radius):min(len(text),i+radius)]
          chunks=['=== MAIN ===']
          for n in ['openMemberSelfSettings','renderMemberSelfSettings','selectMemberSelf','clearMemberSelfSelection','completeMemberSelfSettings','handleMemberSelfSearchInput','handleMemberSelfDone']:
              chunks.append(function(main,n))
          chunks.append('=== MAIN INPUT OCCURRENCES ===')
          chunks.append(around(main,"memberSelfSearchInput",2500))
          chunks.append('=== PWA ===')
          for n in ['isEmbeddedBrowser','buildAndroidChromeIntent','buildChromeUserTarget','handleAppInstallButton','handleEmbeddedChromeLinkClick','connectAlarm','submitRelay','handleCourtMessage']:
              chunks.append(function(pwa,n))
          out='\n\n'.join(chunks)
          # no deployment IDs/URLs should be persisted
          out=re.sub(r'https?://[^\s\"\']+','<URL>',out)
          Path(sys.argv[3]).write_text(out[:50000],encoding='utf-8')
          PY
          cd "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '4189822+github-actions[bot]@users.noreply.github.com'
          git add deployment/jayuminton/MEMBER_INSTALL_CODE_DIAGNOSTIC.txt
          git commit -m 'Record actual member/install code diagnostic' || exit 0
          git pull --rebase origin main || true
          git push
