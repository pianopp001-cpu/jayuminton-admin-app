name: Deploy actual member and install fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-push-register.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: jayuminton-actual-member-install-fix
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global @google/clasp@latest firebase-tools@latest
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Read config
        shell: bash
        run: |
          set -euo pipefail
          C="$RUNNER_TEMP/deploy.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$C"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          jq -e '.mainScriptId and .mainDeploymentId and .pushDeploymentId and .firebaseProjectId and .hostingUrl' "$C" >/dev/null
          {
            echo "MAIN_SCRIPT_ID=$(jq -r '.mainScriptId' "$C")"
            echo "MAIN_DEPLOYMENT_ID=$(jq -r '.mainDeploymentId' "$C")"
            echo "MAIN_URL=https://script.google.com/macros/s/$(jq -r '.mainDeploymentId' "$C")/exec"
            echo "PUSH_URL=https://script.google.com/macros/s/$(jq -r '.pushDeploymentId' "$C")/exec"
            echo "FIREBASE_PROJECT_ID=$(jq -r '.firebaseProjectId' "$C")"
            echo "HOSTING_URL=$(jq -r '.hostingUrl' "$C")"
            echo "BUILD_ROOT=$RUNNER_TEMP/actual-fix-v12"
          } >> "$GITHUB_ENV"

      - name: Patch and deploy MAIN
        shell: bash
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/main"
          rm -rf "$W" && mkdir -p "$W"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$MAIN_SCRIPT_ID" > "$W/.clasp.json"
          cd "$W"
          clasp pull
          printf '%s  %s\n' \
            '34d5a1469b1abdefc57fe3ca2395fe3ec6c00ef6cd14855fb554af70086e38d0' Admin.html \
            '7342d7051bf125f771c5951e4c54f114f9eb57949327d874be63e6ba5781522b' Code.js \
            '6b61b90e1b6a0955ba0c00524e3556605f46eafa3b969f60a3c420aeb654ae6c' Index.html \
            'f74408c53654e38ff1646f31693b1ed6701e6a625efeb28258edc62bffe12625' Style.html | sha256sum --check
          python3 "$GITHUB_WORKSPACE/deployment/jayuminton/actual_member_install_fix_v12.py" main Script.html
          grep -F 'member-complete-auto-select-v12' Script.html >/dev/null
          clasp push --force
          clasp create-deployment --deploymentId "$MAIN_DEPLOYMENT_ID" --description "actual member fix v12 ${GITHUB_SHA::7}"

      - name: Build PWA
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$BUILD_ROOT" && mkdir -p "$BUILD_ROOT/web-push"
          cp deployment/jayuminton/firebase.json "$BUILD_ROOT/firebase.json"
          cp deployment/jayuminton/v1637-web/index.html "$BUILD_ROOT/web-push/index.html"
          cp deployment/jayuminton/v1637-web/setup-v205.css "$BUILD_ROOT/web-push/setup-v205.css"
          cp deployment/jayuminton/v1637-web/manifest.webmanifest "$BUILD_ROOT/web-push/manifest.webmanifest"
          cp deployment/jayuminton/v1637-web/firebase-messaging-sw.js "$BUILD_ROOT/web-push/firebase-messaging-sw.js"
          cat deployment/jayuminton/v1637-web/setup-v205.js.gz.b64.part-* | tr -d '\r\n' | base64 -d > "$RUNNER_TEMP/setup.gz"
          gzip -dc "$RUNNER_TEMP/setup.gz" > "$BUILD_ROOT/web-push/setup-v205.js"
          printf '%s  %s\n' '53828f38565e057b865750b9fbf66737b8841451ac4afebc34150b0f93d8fd9b' "$BUILD_ROOT/web-push/setup-v205.js" | sha256sum --check
          python3 deployment/jayuminton/actual_member_install_fix_v12.py pwa "$BUILD_ROOT/web-push" --main-url "$MAIN_URL" --push-url "$PUSH_URL"
          node --check "$BUILD_ROOT/web-push/setup-v205.js"
          grep -F 'auto-install-prompt-v12' "$BUILD_ROOT/web-push/setup-v205.js" >/dev/null
          grep -F 'shouldAutoPrompt' "$BUILD_ROOT/web-push/setup-v205.js" >/dev/null
          if grep -F 'S.browser_fallback_url' "$BUILD_ROOT/web-push/setup-v205.js" >/dev/null; then exit 1; fi
          BASE="${HOSTING_URL%/}"
          for a in icon-198.png icon-512.png apple-touch-icon-180.png badge-96.png; do
            curl --fail --location --retry 3 --max-time 60 "$BASE/$a?x=$GITHUB_RUN_ID" -o "$BUILD_ROOT/web-push/$a"
            test -s "$BUILD_ROOT/web-push/$a"
          done

      - name: Deploy Firebase Hosting
        working-directory: ${{ env.BUILD_ROOT }}
        run: firebase deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive --message "actual member/install fix v12 ${GITHUB_SHA::7}"

      - name: Verify live
        shell: bash
        run: |
          set -euo pipefail

          BODY="$RUNNER_TEMP/main.html"
          FINAL="$RUNNER_TEMP/main-url.txt"
          MAIN_OK=0
          for attempt in $(seq 1 12); do
            : > "$BODY"
            : > "$FINAL"
            if curl --fail --location --max-time 90 --output "$BODY" --write-out '%{url_effective}' \
              "$MAIN_URL?mode=user&app=user&verify=$GITHUB_RUN_ID-$attempt" > "$FINAL"; then
              if grep -Eiq 'drive\.google\.com|docs\.google\.com' "$FINAL"; then
                echo "MAIN attempt $attempt redirected to Google Drive/Docs"
              elif grep -F 'member-complete-auto-select-v12' "$BODY" >/dev/null; then
                echo "MAIN live marker verified on attempt $attempt"
                MAIN_OK=1
                break
              else
                echo "MAIN attempt $attempt still serving previous deployment"
              fi
            else
              echo "MAIN attempt $attempt request failed"
            fi
            sleep 10
          done
          test "$MAIN_OK" = '1'

          BASE="${HOSTING_URL%/}"
          FIREBASE_OK=0
          for attempt in $(seq 1 8); do
            if curl --fail --location -H 'Cache-Control: no-cache' \
              "$BASE/?v=$GITHUB_RUN_ID-$attempt" > "$RUNNER_TEMP/index" && \
               curl --fail --location -H 'Cache-Control: no-cache' \
              "$BASE/setup-v205.js?v=$GITHUB_RUN_ID-$attempt" > "$RUNNER_TEMP/setup"; then
              if grep -F 'setup-v205.js?v=1637-actualfix12' "$RUNNER_TEMP/index" >/dev/null && \
                 grep -F 'auto-install-prompt-v12' "$RUNNER_TEMP/setup" >/dev/null && \
                 grep -F 'shouldAutoPrompt' "$RUNNER_TEMP/setup" >/dev/null && \
                 ! grep -F 'S.browser_fallback_url' "$RUNNER_TEMP/setup" >/dev/null; then
                echo "Firebase live PWA verified on attempt $attempt"
                FIREBASE_OK=1
                break
              fi
            fi
            echo "Firebase attempt $attempt not ready yet"
            sleep 5
          done
          test "$FIREBASE_OK" = '1'

      - name: Record result
        if: always()
        shell: bash
        run: |
          STATUS='${{ job.status }}'
          printf 'status=%s\ncommit=%s\nrun=%s\n' "$STATUS" "$GITHUB_SHA" "$GITHUB_RUN_ID" > deployment/jayuminton/ACTUAL_MEMBER_INSTALL_FIX_V12_RESULT.txt
          git config user.name 'github-actions[bot]'
          git config user.email '4189822+github-actions[bot]@users.noreply.github.com'
          git add deployment/jayuminton/ACTUAL_MEMBER_INSTALL_FIX_V12_RESULT.txt
          git commit -m "Record actual member/install v12: $STATUS" || exit 0
          git pull --rebase origin main || true
          git push
