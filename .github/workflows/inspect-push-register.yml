name: Inspect PUSH token registration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-push-register.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global @google/clasp@latest
      - name: Inspect exact event wiring
        shell: bash
        run: |
          set -euo pipefail
          C="$RUNNER_TEMP/deploy.json"; printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$C"; printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          SID="$(jq -r '.mainScriptId' "$C")"; W="$RUNNER_TEMP/main"; mkdir -p "$W"; printf '{"scriptId":"%s","rootDir":"."}\n' "$SID" > "$W/.clasp.json"; cd "$W"; clasp pull
          cat "$GITHUB_WORKSPACE"/deployment/jayuminton/v1637-web/setup-v205.js.gz.b64.part-* | tr -d '\r\n' | base64 -d > "$RUNNER_TEMP/setup.gz"; gzip -dc "$RUNNER_TEMP/setup.gz" > "$RUNNER_TEMP/setup.js"
          python3 - "$W/Script.html" "$RUNNER_TEMP/setup.js" "$GITHUB_WORKSPACE/deployment/jayuminton/MEMBER_INSTALL_WIRING.txt" <<'PY'
          from pathlib import Path
          import re,sys
          main=Path(sys.argv[1]).read_text(encoding='utf-8',errors='ignore'); pwa=Path(sys.argv[2]).read_text(encoding='utf-8',errors='ignore')
          def allaround(text,needles,r=1800):
              spans=[]
              for needle in needles:
                  pos=0
                  while True:
                      i=text.find(needle,pos)
                      if i<0: break
                      spans.append((max(0,i-r),min(len(text),i+r),needle)); pos=i+len(needle)
              spans.sort(); out=[]; last=-1
              for a,b,n in spans:
                  if a<last: continue
                  out.append('--- '+n+' ---\n'+text[a:b]); last=b
              return '\n'.join(out)
          out='=== MAIN WIRING ===\n'+allaround(main,['memberSelfDone','memberSelfSearchInput','JAYUMINTON_PUSH_SETUP_REQUEST'],2200)
          out+='\n=== PWA INSTALL WIRING ===\n'+allaround(pwa,['beforeinstallprompt','deferredInstallPrompt','installAndroidUserApp','directInstall','appInstallButton.addEventListener'],2400)
          out=re.sub(r'https?://[^\s\"\']+','<URL>',out)
          Path(sys.argv[3]).write_text(out[:70000],encoding='utf-8')
          PY
          cd "$GITHUB_WORKSPACE"; git config user.name 'github-actions[bot]'; git config user.email '4189822+github-actions[bot]@users.noreply.github.com'; git add deployment/jayuminton/MEMBER_INSTALL_WIRING.txt; git commit -m 'Record member/install event wiring' || exit 0; git pull --rebase origin main || true; git push
