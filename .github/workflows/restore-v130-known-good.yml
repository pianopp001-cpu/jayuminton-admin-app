name: Restore verified v1.3.0 code130 hosting

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-v130-known-good.yml'
      - 'deployment/scripts/inject_v130_frame_guard.py'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: jayuminton-restore-v130-known-good
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout exact verified v130 source
        uses: actions/checkout@v4
        with:
          ref: e88774455545529ab27e02d0587085a46351345b

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@latest

      - name: Authenticate Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Add post-setup iframe recovery guard
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://raw.githubusercontent.com/pianopp001-cpu/jayuminton-admin-app/main/deployment/scripts/inject_v130_frame_guard.py -o "$RUNNER_TEMP/inject_v130_frame_guard.py"
          python3 "$RUNNER_TEMP/inject_v130_frame_guard.py"

      - name: Restore v130 hosting against restored main backend
        shell: bash
        run: |
          set -euo pipefail
          bash deployment/scripts/hotfix_v130_white_screen.sh

      - name: Confirm browser-verified restore
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'status=success' deployment/status/v130-white-screen-hotfix.txt
          grep -F 'version_code=130' deployment/status/v130-white-screen-hotfix.txt
          grep -F 'visible_page=yes' deployment/status/v130-white-screen-hotfix.txt
          grep -F 'direct_iframe_failsafe=yes' deployment/status/v130-white-screen-hotfix.txt
          echo 'V130_BROWSER_VERIFIED_RESTORE_OK'
