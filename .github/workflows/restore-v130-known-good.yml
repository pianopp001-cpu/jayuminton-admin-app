name: Restore verified v1.3.0 code130 hosting

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-v130-known-good.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: jayuminton-restore-v130-known-good
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout exact verified v130 source
        uses: actions/checkout@v4
        with:
          ref: e88774455545529ab27e02d0587085a46351345b

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@latest

      - name: Authenticate Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Add post-setup iframe recovery guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('deployment/jayuminton/v1637-web/index.html')
          s = p.read_text(encoding='utf-8')
          guard = r'''\n<script id="v130-frame-recovery">\n(() => {\n  const frame = document.getElementById('courtFrame');\n  if (!frame) return;\n  const recover = () => {\n    const cfg = window.JAYUMINTON_PUSH_SETUP_CONFIG || {};\n    const target = String(cfg.memberPageUrl || frame.getAttribute('src') || '').trim();\n    const current = String(frame.getAttribute('src') || '').trim();\n    if (target && (!current || current === 'about:blank')) frame.setAttribute('src', target);\n  };\n  recover();\n  let count = 0;\n  const timer = setInterval(() => {\n    recover();\n    if (++count >= 20) clearInterval(timer);\n  }, 500);\n})();\n</script>\n'''
          if 'id="v130-frame-recovery"' not in s:
              s = s.replace('</body>', guard + '</body>')
          p.write_text(s, encoding='utf-8')
          PY
          grep -F 'v130-frame-recovery' deployment/jayuminton/v1637-web/index.html

      - name: Restore v130 hosting against restored main backend
        shell: bash
        run: |
          set -euo pipefail
          bash deployment/scripts/hotfix_v130_white_screen.sh

      - name: Confirm browser-verified restore
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'status=success' deployment/status/v130-white-screen-hotfix.txt
          grep -F 'version_code=130' deployment/status/v130-white-screen-hotfix.txt
          grep -F 'visible_page=yes' deployment/status/v130-white-screen-hotfix.txt
          grep -F 'direct_iframe_failsafe=yes' deployment/status/v130-white-screen-hotfix.txt
          echo 'V130_BROWSER_VERIFIED_RESTORE_OK'
