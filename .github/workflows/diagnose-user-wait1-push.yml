name: Diagnose user wait1 push live
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-user-wait1-push.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --global @google/clasp@latest
      - name: Pull live main script
        shell: bash
        run: |
          set -euo pipefail
          C="$RUNNER_TEMP/deploy.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$C"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          MAIN_SCRIPT_ID="$(jq -r '.mainScriptId' "$C")"
          mkdir -p "$RUNNER_TEMP/main"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$MAIN_SCRIPT_ID" > "$RUNNER_TEMP/main/.clasp.json"
          (cd "$RUNNER_TEMP/main" && clasp pull)
      - name: Print live push relay functions
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/main/Code.js" <<'PY'
          from pathlib import Path
          import re,sys
          src=Path(sys.argv[1]).read_text(encoding='utf-8')
          def block(name):
              i=src.find('function '+name)
              if i<0:return 'NOT_FOUND'
              b=src.find('{',i); d=0; q=None; esc=False
              for j in range(b,len(src)):
                  c=src[j]
                  if q:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c==q:q=None
                      continue
                  if c in "'\"`":q=c
                  elif c=='{':d+=1
                  elif c=='}':
                      d-=1
                      if d==0:return src[i:j+1]
              return 'UNBALANCED'
          for n in ['captureStatePushSnapshot_(','postStatePushEvent_(','sendStateTransitionPushes_(']:
              print('\n--- '+n+' ---')
              text=block(n)
              text=re.sub(r'https://[^\s\"\']+','https://[URL_REDACTED]',text)
              print(text)
          for marker in ['JAYUMINTON_PUSH_URL','PUSH_URL','statePushUrl','UrlFetchApp.fetch']:
              print('\nMARKER',marker,'=',marker in src)
          PY
