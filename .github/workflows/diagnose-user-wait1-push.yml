name: Diagnose user wait1 push live
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-user-wait1-push.yml'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      JAYUMINTON_PUSH_APPS_SCRIPT_URL: ${{ secrets.JAYUMINTON_PUSH_APPS_SCRIPT_URL }}
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --global @google/clasp@latest
      - name: Inspect live relay auth structure safely
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$RUNNER_TEMP/deploy.json"
          MAIN_SCRIPT_ID="$(jq -r '.mainScriptId' "$RUNNER_TEMP/deploy.json")"
          RELAY_DEPLOYMENT_ID="$(python3 - <<'PY'
          import os,re
          m=re.search(r'/macros/s/([^/]+)/exec',os.environ['JAYUMINTON_PUSH_APPS_SCRIPT_URL'])
          print(m.group(1) if m else '')
          PY
          )"
          test -n "$MAIN_SCRIPT_ID"; test -n "$RELAY_DEPLOYMENT_ID"

          MW="$RUNNER_TEMP/main"; mkdir -p "$MW"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$MAIN_SCRIPT_ID" > "$MW/.clasp.json"
          (cd "$MW" && clasp pull >/dev/null)

          clasp list > "$RUNNER_TEMP/projects.txt"
          : > "$RUNNER_TEMP/relay-script.txt"
          while IFS= read -r line; do
            SID="$(printf '%s' "$line" | grep -oE '[A-Za-z0-9_-]{30,}' | tail -1 || true)"
            [ -n "$SID" ] || continue
            W="$RUNNER_TEMP/check-$RANDOM"; mkdir -p "$W"
            printf '{"scriptId":"%s","rootDir":"."}\n' "$SID" > "$W/.clasp.json"
            if (cd "$W" && clasp deployments) > "$W/d.txt" 2>/dev/null && grep -F "$RELAY_DEPLOYMENT_ID" "$W/d.txt" >/dev/null; then
              printf '%s' "$SID" > "$RUNNER_TEMP/relay-script.txt"; break
            fi
          done < "$RUNNER_TEMP/projects.txt"
          test -s "$RUNNER_TEMP/relay-script.txt"
          RELAY_SCRIPT_ID="$(cat "$RUNNER_TEMP/relay-script.txt")"
          RW="$RUNNER_TEMP/relay"; mkdir -p "$RW"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$RELAY_SCRIPT_ID" > "$RW/.clasp.json"
          (cd "$RW" && clasp pull >/dev/null)
          RELAY_CODE="$(find "$RW" -maxdepth 1 -type f \( -name 'Code.js' -o -name 'Code.gs' \) | head -1)"
          test -n "$RELAY_CODE"

          mkdir -p deployment/status
          python3 - "$MW/Code.js" "$RELAY_CODE" "$JAYUMINTON_PUSH_APPS_SCRIPT_URL" deployment/status/user-push-relay-structure.txt <<'PY'
          from pathlib import Path
          import re,sys
          main=Path(sys.argv[1]).read_text(encoding='utf-8')
          relay=Path(sys.argv[2]).read_text(encoding='utf-8')
          target=sys.argv[3]
          out=Path(sys.argv[4])
          m=re.search(r"(?:const|let|var)\s+JAYUMINTON_STATE_PUSH_RELAY_URL_\s*=\s*['\"]([^'\"]+)['\"]",main)
          live=m.group(1) if m else ''
          rows={
            'relay_script_found':True,
            'main_url_matches_secret_url': live.rstrip('/')==target.rstrip('/'),
            'doPost_calls_verify_e': 'verifyAdminSecret_(e);' in relay,
            'doPost_calls_verify_e_body': 'verifyAdminSecret_(e, body);' in relay,
            'verify_sig_e': 'function verifyAdminSecret_(e) {' in relay,
            'verify_sig_e_body': 'function verifyAdminSecret_(e, body) {' in relay,
            'has_secure_equals': 'secureEquals_' in relay,
            'has_register_web_token': 'register_web_token' in relay,
            'has_main_state_event': 'main_state_event' in relay,
          }
          out.write_text('\n'.join(f'{k}={str(v).lower()}' for k,v in rows.items())+'\n',encoding='utf-8')
          PY
      - name: Record structure diagnostic
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment/status/user-push-relay-structure.txt
          git commit -m 'Record live relay auth structure' || exit 0
          git pull --rebase origin main || true
          git push origin main
# inspect retry
