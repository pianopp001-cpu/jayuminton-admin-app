name: Diagnose user wait1 push live
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-user-wait1-push.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      JAYUMINTON_PUSH_APPS_SCRIPT_URL: ${{ secrets.JAYUMINTON_PUSH_APPS_SCRIPT_URL }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --global @google/clasp@latest
      - name: Locate relay project by deployment id
        shell: bash
        run: |
          set -euo pipefail
          test -n "$JAYUMINTON_PUSH_APPS_SCRIPT_URL"
          test -n "$CLASPRC_JSON"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          DEPLOYMENT_ID="$(python3 - <<'PY'
          import os,re
          u=os.environ['JAYUMINTON_PUSH_APPS_SCRIPT_URL']
          m=re.search(r'/macros/s/([^/]+)/exec',u)
          print(m.group(1) if m else '')
          PY
          )"
          test -n "$DEPLOYMENT_ID"
          echo "TARGET_DEPLOYMENT_ID_PRESENT=true"

          clasp list > "$RUNNER_TEMP/projects.txt"
          echo "CLASP_PROJECT_COUNT=$(grep -c '^' "$RUNNER_TEMP/projects.txt" || true)"
          : > "$RUNNER_TEMP/found.txt"
          while IFS= read -r line; do
            SCRIPT_ID="$(printf '%s' "$line" | grep -oE '[A-Za-z0-9_-]{30,}' | tail -1 || true)"
            [ -n "$SCRIPT_ID" ] || continue
            W="$RUNNER_TEMP/check-$RANDOM"
            mkdir -p "$W"
            printf '{"scriptId":"%s","rootDir":"."}\n' "$SCRIPT_ID" > "$W/.clasp.json"
            if (cd "$W" && clasp deployments) > "$W/deployments.txt" 2>/dev/null; then
              if grep -F "$DEPLOYMENT_ID" "$W/deployments.txt" >/dev/null; then
                printf '%s' "$SCRIPT_ID" > "$RUNNER_TEMP/found.txt"
                echo 'RELAY_SCRIPT_MATCH_FOUND=true'
                echo "RELAY_SCRIPT_ID_LENGTH=${#SCRIPT_ID}"
                break
              fi
            fi
          done < "$RUNNER_TEMP/projects.txt"
          if [ ! -s "$RUNNER_TEMP/found.txt" ]; then
            echo 'RELAY_SCRIPT_MATCH_FOUND=false'
          fi
