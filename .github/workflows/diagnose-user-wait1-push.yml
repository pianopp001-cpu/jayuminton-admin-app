name: Diagnose user wait1 push live
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-user-wait1-push.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      JAYUMINTON_PUSH_APPS_SCRIPT_URL: ${{ secrets.JAYUMINTON_PUSH_APPS_SCRIPT_URL }}
      JAYUMINTON_PUSH_SHARED_SECRET: ${{ secrets.JAYUMINTON_PUSH_SHARED_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Test relay auth contract with nonexistent member only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$JAYUMINTON_PUSH_APPS_SCRIPT_URL"
          test -n "$JAYUMINTON_PUSH_SHARED_SECRET"

          post_and_follow() {
            local url="$1"
            local payload="$2"
            local prefix="$3"
            curl -sS -D "$RUNNER_TEMP/$prefix.headers" -o "$RUNNER_TEMP/$prefix.first" -X POST \
              --data-urlencode "payload=$payload" "$url" || true
            local loc
            loc="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]*:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' "$RUNNER_TEMP/$prefix.headers")"
            if [ -n "$loc" ]; then
              curl -sS -o "$RUNNER_TEMP/$prefix.final" "$loc" || true
            else
              cp "$RUNNER_TEMP/$prefix.first" "$RUNNER_TEMP/$prefix.final"
            fi
          }

          # Old contract: ?key=<shared secret>. The fake member ID cannot match any real registration.
          SAFE_PAYLOAD='{"action":"main_state_event","type":"wait1_ready","assignmentId":"diagnostic-auth-contract-123456","expectedCourtNo":1,"members":[{"id":"__diag_nonexistent_member__","name":"DIAG"}]}'
          post_and_follow "$JAYUMINTON_PUSH_APPS_SCRIPT_URL?key=$JAYUMINTON_PUSH_SHARED_SECRET" "$SAFE_PAYLOAD" oldauth

          # New contract: internalKey in JSON body.
          SAFE_PAYLOAD_NEW="{\"action\":\"main_state_event\",\"internalKey\":\"$JAYUMINTON_PUSH_SHARED_SECRET\",\"type\":\"wait1_ready\",\"assignmentId\":\"diagnostic-auth-contract-654321\",\"expectedCourtNo\":1,\"members\":[{\"id\":\"__diag_nonexistent_member__\",\"name\":\"DIAG\"}]}"
          post_and_follow "$JAYUMINTON_PUSH_APPS_SCRIPT_URL" "$SAFE_PAYLOAD_NEW" newauth

          python3 - "$RUNNER_TEMP/oldauth.final" "$RUNNER_TEMP/newauth.final" <<'PY'
          from pathlib import Path
          import json,sys
          def load(p):
              try:return json.loads(Path(p).read_text(encoding='utf-8',errors='ignore'))
              except Exception:return {}
          old=load(sys.argv[1]); new=load(sys.argv[2])
          print('OLD_QUERY_KEY_CONTRACT_ACCEPTED=', bool(old.get('ok')) and old.get('sent') == 0)
          print('OLD_QUERY_KEY_SENT_ZERO=', old.get('sent') == 0 if old else False)
          print('NEW_INTERNAL_KEY_CONTRACT_ACCEPTED=', bool(new.get('ok')) and new.get('sent') == 0)
          print('NEW_INTERNAL_KEY_REJECTED=', bool(new) and new.get('ok') is False)
          print('NEW_INTERNAL_KEY_ERROR_PRESENT=', bool(new.get('error')) if new else False)
          PY
