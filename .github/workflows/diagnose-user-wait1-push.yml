name: Diagnose user wait1 push live
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-user-wait1-push.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --global @google/clasp@latest
      - name: Pull live main script
        shell: bash
        run: |
          set -euo pipefail
          C="$RUNNER_TEMP/deploy.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$C"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          MAIN_SCRIPT_ID="$(jq -r '.mainScriptId' "$C")"
          mkdir -p "$RUNNER_TEMP/main"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$MAIN_SCRIPT_ID" > "$RUNNER_TEMP/main/.clasp.json"
          (cd "$RUNNER_TEMP/main" && clasp pull)
      - name: Probe live relay with invalid key only
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/main/Code.js" "$RUNNER_TEMP/relay-url.txt" <<'PY'
          from pathlib import Path
          import re,sys
          src=Path(sys.argv[1]).read_text(encoding='utf-8')
          m=re.search(r"(?:const|let|var)\s+JAYUMINTON_STATE_PUSH_RELAY_URL_\s*=\s*['\"]([^'\"]+)['\"]",src)
          if not m: raise SystemExit('relay URL missing')
          Path(sys.argv[2]).write_text(m.group(1).strip(),encoding='utf-8')
          PY
          URL="$(cat "$RUNNER_TEMP/relay-url.txt")"
          STATUS="$(curl -L -sS -o "$RUNNER_TEMP/relay-response.txt" -w '%{http_code}' -X POST \
            --data-urlencode 'payload={"action":"main_state_event","internalKey":"__diagnostic_invalid_key__","type":"wait1_ready","assignmentId":"diagnostic","members":[]}' \
            "$URL" || true)"
          echo "RELAY_HTTP_STATUS=$STATUS"
          echo "RELAY_RESPONSE_BYTES=$(wc -c < "$RUNNER_TEMP/relay-response.txt" 2>/dev/null || echo 0)"
          python3 - "$RUNNER_TEMP/relay-response.txt" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); t=p.read_text(encoding='utf-8',errors='ignore').lower() if p.exists() else ''
          print('RELAY_LOOKS_AUTH_REJECTION=', any(x in t for x in ['invalid','unauthorized','forbidden','internalkey','internal key','인증','권한']))
          print('RELAY_LOOKS_GOOGLE_LOGIN=', 'accounts.google.com' in t or 'sign in' in t)
          print('RELAY_LOOKS_NOT_FOUND=', 'not found' in t or '페이지를 찾을 수' in t)
          PY
