name: Diagnose user wait1 push live
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-user-wait1-push.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --global @google/clasp@latest
      - name: Pull live main script
        shell: bash
        run: |
          set -euo pipefail
          C="$RUNNER_TEMP/deploy.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$C"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          MAIN_SCRIPT_ID="$(jq -r '.mainScriptId' "$C")"
          mkdir -p "$RUNNER_TEMP/main"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$MAIN_SCRIPT_ID" > "$RUNNER_TEMP/main/.clasp.json"
          (cd "$RUNNER_TEMP/main" && clasp pull)
      - name: Inspect live relay constants and call site
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/main/Code.js" <<'PY'
          from pathlib import Path
          import re,sys,urllib.parse
          src=Path(sys.argv[1]).read_text(encoding='utf-8')
          for name in ['JAYUMINTON_STATE_PUSH_RELAY_URL_','JAYUMINTON_STATE_PUSH_INTERNAL_KEY_']:
              m=re.search(r'(?:const|let|var)\s+'+re.escape(name)+r'\s*=\s*([^;]+);',src)
              if not m:
                  print(name,'= NOT_FOUND')
                  continue
              expr=m.group(1).strip()
              if name.endswith('URL_'):
                  sm=re.match(r"['\"]([^'\"]+)['\"]",expr)
                  if sm:
                      u=urllib.parse.urlparse(sm.group(1))
                      print(name,'HOST=',u.scheme+'://'+u.netloc,'PATH_PRESENT=',bool(u.path.strip('/')))
                  else:
                      print(name,'= NON_LITERAL',expr[:120])
              else:
                  sm=re.match(r"['\"]([^'\"]*)['\"]",expr)
                  print(name,'LENGTH=',len(sm.group(1)) if sm else -1,'LITERAL=',bool(sm))
          i=src.find('function postStatePushEvent_(')
          print('POST_FUNCTION_PRESENT=',i>=0)
          print('USES_URLFETCH=', 'UrlFetchApp.fetch(JAYUMINTON_STATE_PUSH_RELAY_URL_' in src)
          print('USES_INTERNAL_KEY=', 'event.internalKey = JAYUMINTON_STATE_PUSH_INTERNAL_KEY_' in src)
          PY
