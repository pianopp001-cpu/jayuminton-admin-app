name: Diagnose user wait1 push live
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-user-wait1-push.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      JAYUMINTON_PUSH_APPS_SCRIPT_URL: ${{ secrets.JAYUMINTON_PUSH_APPS_SCRIPT_URL }}
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --global @google/clasp@latest
      - name: Test live main key with legacy relay contract
        shell: bash
        run: |
          set -euo pipefail
          test -n "$JAYUMINTON_PUSH_APPS_SCRIPT_URL"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$RUNNER_TEMP/deploy.json"
          MAIN_SCRIPT_ID="$(jq -r '.mainScriptId' "$RUNNER_TEMP/deploy.json")"
          test -n "$MAIN_SCRIPT_ID"
          mkdir -p "$RUNNER_TEMP/main"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$MAIN_SCRIPT_ID" > "$RUNNER_TEMP/main/.clasp.json"
          (cd "$RUNNER_TEMP/main" && clasp pull)

          python3 - "$RUNNER_TEMP/main/Code.js" "$RUNNER_TEMP/live-key.txt" <<'PY'
          from pathlib import Path
          import re,sys
          src=Path(sys.argv[1]).read_text(encoding='utf-8')
          m=re.search(r"(?:const|let|var)\s+JAYUMINTON_STATE_PUSH_INTERNAL_KEY_\s*=\s*['\"]([^'\"]+)['\"]",src)
          if not m: raise SystemExit('live internal key missing')
          key=m.group(1)
          print('LIVE_INTERNAL_KEY_LENGTH=',len(key))
          Path(sys.argv[2]).write_text(key,encoding='utf-8')
          PY
          LIVE_KEY="$(cat "$RUNNER_TEMP/live-key.txt")"
          SAFE_PAYLOAD='{"action":"main_state_event","type":"wait1_ready","assignmentId":"diagnostic-live-main-key-123456","expectedCourtNo":1,"members":[{"id":"__diag_nonexistent_member__","name":"DIAG"}]}'

          curl -sS -D "$RUNNER_TEMP/h" -o "$RUNNER_TEMP/first" -X POST \
            --data-urlencode "payload=$SAFE_PAYLOAD" \
            "$JAYUMINTON_PUSH_APPS_SCRIPT_URL?key=$LIVE_KEY" || true
          LOC="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]*:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' "$RUNNER_TEMP/h")"
          if [ -n "$LOC" ]; then curl -sS -o "$RUNNER_TEMP/final" "$LOC" || true; else cp "$RUNNER_TEMP/first" "$RUNNER_TEMP/final"; fi
          python3 - "$RUNNER_TEMP/final" <<'PY'
          from pathlib import Path
          import json,sys
          try:j=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8',errors='ignore'))
          except Exception:j={}
          print('LIVE_MAIN_KEY_QUERY_ACCEPTED=', bool(j.get('ok')) and j.get('sent') == 0)
          print('LIVE_MAIN_KEY_SENT_ZERO=', j.get('sent') == 0 if j else False)
          print('LIVE_MAIN_KEY_REJECTED=', bool(j) and j.get('ok') is False)
          print('LIVE_MAIN_KEY_ERROR_PRESENT=', bool(j.get('error')) if j else False)
          PY
