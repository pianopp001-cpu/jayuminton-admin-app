name: Repair user wait1 push live
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-user-wait1-push.yml'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      JAYUMINTON_PUSH_APPS_SCRIPT_URL: ${{ secrets.JAYUMINTON_PUSH_APPS_SCRIPT_URL }}
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --global @google/clasp@latest
      - name: Repair and verify live relay idempotently
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deployment/status
          STATUS=deployment/status/user-push-relay-repair-stage.txt
          echo 'stage=start' > "$STATUS"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$RUNNER_TEMP/deploy.json"
          MAIN_SCRIPT_ID="$(jq -r '.mainScriptId' "$RUNNER_TEMP/deploy.json")"
          RELAY_DEPLOYMENT_ID="$(python3 - <<'PY'
          import os,re
          m=re.search(r'/macros/s/([^/]+)/exec',os.environ['JAYUMINTON_PUSH_APPS_SCRIPT_URL'])
          print(m.group(1) if m else '')
          PY
          )"
          test -n "$MAIN_SCRIPT_ID"; test -n "$RELAY_DEPLOYMENT_ID"
          echo 'stage=ids-resolved' > "$STATUS"

          MW="$RUNNER_TEMP/main"; mkdir -p "$MW"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$MAIN_SCRIPT_ID" > "$MW/.clasp.json"
          (cd "$MW" && clasp pull >/dev/null)
          LIVE_KEY="$(python3 - "$MW/Code.js" <<'PY'
          from pathlib import Path
          import re,sys
          s=Path(sys.argv[1]).read_text(encoding='utf-8')
          m=re.search(r"(?:const|let|var)\s+JAYUMINTON_STATE_PUSH_INTERNAL_KEY_\s*=\s*['\"]([^'\"]+)['\"]",s)
          print(m.group(1) if m else '')
          PY
          )"
          test "${#LIVE_KEY}" -eq 64
          echo 'stage=main-key-read' > "$STATUS"

          clasp list > "$RUNNER_TEMP/projects.txt"
          : > "$RUNNER_TEMP/relay-script.txt"
          while IFS= read -r line; do
            SID="$(printf '%s' "$line" | grep -oE '[A-Za-z0-9_-]{30,}' | tail -1 || true)"
            [ -n "$SID" ] || continue
            W="$RUNNER_TEMP/check-$RANDOM"; mkdir -p "$W"
            printf '{"scriptId":"%s","rootDir":"."}\n' "$SID" > "$W/.clasp.json"
            if (cd "$W" && clasp deployments) > "$W/d.txt" 2>/dev/null && grep -F "$RELAY_DEPLOYMENT_ID" "$W/d.txt" >/dev/null; then
              printf '%s' "$SID" > "$RUNNER_TEMP/relay-script.txt"; break
            fi
          done < "$RUNNER_TEMP/projects.txt"
          test -s "$RUNNER_TEMP/relay-script.txt"
          RELAY_SCRIPT_ID="$(cat "$RUNNER_TEMP/relay-script.txt")"
          echo 'stage=relay-project-found' > "$STATUS"

          RW="$RUNNER_TEMP/relay"; mkdir -p "$RW"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$RELAY_SCRIPT_ID" > "$RW/.clasp.json"
          (cd "$RW" && clasp pull >/dev/null)
          RELAY_CODE="$(find "$RW" -maxdepth 1 -type f \( -name 'Code.js' -o -name 'Code.gs' \) | head -1)"
          test -n "$RELAY_CODE"
          echo 'stage=relay-source-pulled' > "$STATUS"

          python3 - "$RELAY_CODE" "$LIVE_KEY" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]); key=sys.argv[2]; s=p.read_text(encoding='utf-8')
          if 'verifyAdminSecret_(e, body);' not in s:
              if 'verifyAdminSecret_(e);' not in s: raise SystemExit('verifyAdminSecret call missing')
              s=s.replace('verifyAdminSecret_(e);','verifyAdminSecret_(e, body);',1)
          legacy='function verifyAdminSecret_(e) {'; modern='function verifyAdminSecret_(e, body) {'
          sig=legacy if legacy in s else modern if modern in s else None
          if not sig: raise SystemExit('verifyAdminSecret function missing')
          start=s.find(sig); b=s.find('{',start); d=0; q=None; esc=False; end=None
          for i in range(b,len(s)):
              c=s[i]
              if q:
                  if esc: esc=False
                  elif c=='\\': esc=True
                  elif c==q:q=None
                  continue
              if c in "'\"`": q=c
              elif c=='{': d+=1
              elif c=='}':
                  d-=1
                  if d==0: end=i+1; break
          if end is None: raise SystemExit('unbalanced verifier')
          repl="""function verifyAdminSecret_(e, body) {
  const expected = String(PropertiesService.getScriptProperties().getProperty('JAYUMINTON_PUSH_SHARED_SECRET') || '');
  const supplied = String((e && e.parameter && e.parameter.key) || (body && body.internalKey) || '');
  const synchronizedKey = '""" + key + """';
  if (!(secureEquals_(supplied, expected) || secureEquals_(supplied, synchronizedKey))) {
    throw new Error('unauthorized');
  }
}"""
          s=s[:start]+repl+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
          echo 'stage=relay-source-ready' > "$STATUS"
          (cd "$RW" && clasp push --force)
          echo 'stage=relay-source-pushed' > "$STATUS"
          (cd "$RW" && clasp create-deployment --deploymentId "$RELAY_DEPLOYMENT_ID" --description "repair user push auth $GITHUB_RUN_ID")
          echo 'stage=relay-redeployed' > "$STATUS"

          PAYLOAD="{\"action\":\"main_state_event\",\"internalKey\":\"$LIVE_KEY\",\"type\":\"wait1_ready\",\"assignmentId\":\"repair-$GITHUB_RUN_ID\",\"expectedCourtNo\":1,\"members\":[{\"id\":\"__diag_nonexistent_member__\",\"name\":\"DIAG\"}]}"
          curl -sS -D "$RUNNER_TEMP/h" -o "$RUNNER_TEMP/first" -X POST --data-urlencode "payload=$PAYLOAD" "$JAYUMINTON_PUSH_APPS_SCRIPT_URL"
          LOC="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]*:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' "$RUNNER_TEMP/h")"
          if [ -n "$LOC" ]; then curl -sS -o "$RUNNER_TEMP/final" "$LOC"; else cp "$RUNNER_TEMP/first" "$RUNNER_TEMP/final"; fi
          python3 - "$RUNNER_TEMP/final" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1],encoding='utf-8'))
          if j.get('ok') is not True: raise SystemExit('relay verification failed: '+repr(j))
          if j.get('sent') not in (0,'0',None): raise SystemExit('unexpected diagnostic send count: '+repr(j))
          PY
          echo 'stage=success' > "$STATUS"
      - name: Record repair stage
        if: always()
        shell: bash
        run: |
          mkdir -p deployment/status
          test -f deployment/status/user-push-relay-repair-stage.txt || echo 'stage=workflow-failed-before-status' > deployment/status/user-push-relay-repair-stage.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment/status/user-push-relay-repair-stage.txt
          git commit -m 'Record user push relay repair stage' || exit 0
          git pull --rebase origin main || true
          git push origin main
# trigger live repair 2026-08-21
