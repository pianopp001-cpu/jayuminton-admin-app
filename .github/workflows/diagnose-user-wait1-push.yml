name: Diagnose user wait1 push live
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-user-wait1-push.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --global @google/clasp@latest
      - name: Discover accessible relay Apps Script project
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          clasp list > "$RUNNER_TEMP/clasp-list.txt"
          echo 'CLASP_LIST_OK=true'
          python3 - "$RUNNER_TEMP/clasp-list.txt" "$RUNNER_TEMP/candidates.txt" <<'PY'
          from pathlib import Path
          import re,sys
          text=Path(sys.argv[1]).read_text(encoding='utf-8',errors='ignore')
          ids=[]
          for m in re.finditer(r'https://script\.google\.com/d/([A-Za-z0-9_-]+)/edit', text):
              if m.group(1) not in ids: ids.append(m.group(1))
          Path(sys.argv[2]).write_text('\n'.join(ids),encoding='utf-8')
          print('ACCESSIBLE_SCRIPT_COUNT=',len(ids))
          PY
          found=0
          n=0
          while IFS= read -r SID; do
            [ -n "$SID" ] || continue
            n=$((n+1))
            WORK="$RUNNER_TEMP/candidate-$n"
            mkdir -p "$WORK"
            printf '{"scriptId":"%s","rootDir":"."}\n' "$SID" > "$WORK/.clasp.json"
            if (cd "$WORK" && clasp pull >/dev/null 2>&1); then
              if grep -R -l -E 'jayuminton-free-web-push-relay|JAYUMINTON_WEB_PUSH_TOKENS_V1|registerWebToken_' "$WORK" >/dev/null 2>&1; then
                echo "RELAY_PROJECT_FOUND=true"
                echo "RELAY_SCRIPT_ID_LENGTH=${#SID}"
                echo "RELAY_SCRIPT_ID_PREFIX=${SID:0:6}"
                printf '%s' "$SID" > "$RUNNER_TEMP/found-relay-script-id.txt"
                found=1
                break
              fi
            fi
          done < "$RUNNER_TEMP/candidates.txt"
          echo "RELAY_PROJECT_FOUND_FINAL=$([ "$found" -eq 1 ] && echo true || echo false)"
