name: Diagnose user wait1 push live
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-user-wait1-push.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --global @google/clasp@latest
      - name: Pull live main script
        shell: bash
        run: |
          set -euo pipefail
          C="$RUNNER_TEMP/deploy.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$C"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          MAIN_SCRIPT_ID="$(jq -r '.mainScriptId' "$C")"
          mkdir -p "$RUNNER_TEMP/main"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$MAIN_SCRIPT_ID" > "$RUNNER_TEMP/main/.clasp.json"
          (cd "$RUNNER_TEMP/main" && clasp pull)
      - name: Compare relay config safely
        shell: bash
        run: |
          set -euo pipefail
          C="$RUNNER_TEMP/deploy.json"
          python3 - "$RUNNER_TEMP/main/Code.js" "$C" <<'PY'
          from pathlib import Path
          import json,re,sys,urllib.parse
          src=Path(sys.argv[1]).read_text(encoding='utf-8')
          cfg=json.loads(Path(sys.argv[2]).read_text(encoding='utf-8'))
          m=re.search(r"(?:const|let|var)\s+JAYUMINTON_STATE_PUSH_RELAY_URL_\s*=\s*['\"]([^'\"]+)['\"]",src)
          live=m.group(1).strip() if m else ''
          configured=str(cfg.get('pushUrl') or '').strip()
          push_script=str(cfg.get('pushScriptId') or '').strip()
          def norm(u): return u.rstrip('/')
          print('LIVE_RELAY_PRESENT=',bool(live))
          print('CONFIG_PUSH_URL_PRESENT=',bool(configured))
          print('RELAY_URL_MATCH=',bool(live and configured and norm(live)==norm(configured)))
          print('LIVE_HOST=',urllib.parse.urlparse(live).netloc if live else '')
          print('CONFIG_HOST=',urllib.parse.urlparse(configured).netloc if configured else '')
          print('PUSH_SCRIPT_ID_PRESENT=',bool(push_script))
          print('PUSH_SCRIPT_ID_LENGTH=',len(push_script))
          print('PUSH_SCRIPT_ID_HAS_SLASH=', '/' in push_script)
          print('PUSH_SCRIPT_ID_LOOKS_DEPLOYMENT=', push_script.startswith('AKfycb'))
          print('PUSH_SCRIPT_ID_LOOKS_SCRIPT_ID=', len(push_script)>30 and not push_script.startswith('AKfycb') and '/' not in push_script)
          PY
