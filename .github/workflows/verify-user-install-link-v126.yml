name: Verify live v1.2.6 user install link

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-user-install-link-v126.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --global @google/clasp@latest

      - name: Verify hosting and main user install routing
        shell: bash
        run: |
          set -euo pipefail
          C="$RUNNER_TEMP/deploy.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$C"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          HOSTING_URL="$(jq -r '.hostingUrl' "$C")"
          MAIN_SCRIPT_ID="$(jq -r '.mainScriptId' "$C")"
          EXPECT='jayuminton-courtstatus-v1.2.6-stop-controller.apk?build=eafe8975'

          ok=0
          for attempt in $(seq 1 18); do
            if curl --fail --location --silent --show-error -H 'Cache-Control: no-cache' \
                "${HOSTING_URL%/}/setup-v205.js?verify=v126-$GITHUB_RUN_ID-$attempt" \
                -o "$RUNNER_TEMP/live-setup.js" && \
               grep -F 'JAYUMINTON_NATIVE_APK_DOWNLOAD_V126' "$RUNNER_TEMP/live-setup.js" >/dev/null && \
               grep -F "$EXPECT" "$RUNNER_TEMP/live-setup.js" >/dev/null; then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" = 1

          W="$RUNNER_TEMP/main"
          mkdir -p "$W"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$MAIN_SCRIPT_ID" > "$W/.clasp.json"
          cd "$W"
          clasp pull
          grep -F "$EXPECT" Script.html >/dev/null

          curl --fail --location --retry 5 \
            'https://raw.githubusercontent.com/pianopp001-cpu/jayuminton-admin-app/main/releases/jayuminton-courtstatus-v1.2.6-stop-controller.apk?build=eafe8975' \
            -o "$RUNNER_TEMP/live-v126.apk"
          test "$(sha256sum "$RUNNER_TEMP/live-v126.apk" | awk '{print $1}')" = \
            'eafe8975dfb05f2da9bf744db63b42b89e79d2a0550e4974a89b224dcd34f537'

          cd "$GITHUB_WORKSPACE"
          cat > deployment/status/user-v126-install-link-live.txt <<EOF
          status=success
          version=1.2.6
          apk=jayuminton-courtstatus-v1.2.6-stop-controller.apk
          apk_sha256=eafe8975dfb05f2da9bf744db63b42b89e79d2a0550e4974a89b224dcd34f537
          hosting_button=v1.2.6
          main_button=v1.2.6
          admin_logic_changed=no
          verified_at=$(date -u +%FT%TZ)
          EOF

      - name: Publish verification status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment/status/user-v126-install-link-live.txt
          git commit -m 'Record live v1.2.6 user install link verification' || true
          git pull --rebase origin main
          git push origin main
