name: Fix Jayuminton member and install

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-member-install.yml'
      - 'deployment/jayuminton/exact-v1637-web/**'
      - 'deployment/jayuminton/v1637-web/index.html'
      - 'deployment/jayuminton/v1637-web/setup-v205.css'
      - 'deployment/jayuminton/v1637-web/manifest.webmanifest'
      - 'deployment/jayuminton/v1637-web/firebase-messaging-sw.js'
      - 'deployment/jayuminton/v1637-web/config-v204.template.js'

permissions:
  contents: read

concurrency:
  group: jayuminton-member-install-fix-live-v1
  cancel-in-progress: true

jobs:
  deploy:
    name: Keep v1.6.37 UI and restore fixed behavior
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@latest

      - name: Authenticate Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Read deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$JAYUMINTON_DEPLOY_CONFIG_JSON" || { echo 'JAYUMINTON_DEPLOY_CONFIG_JSON is missing.'; exit 1; }
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || { echo 'FIREBASE_SERVICE_ACCOUNT_JSON is missing.'; exit 1; }
          CONFIG="$RUNNER_TEMP/jayuminton-deploy-config.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$CONFIG"
          jq -e '.mainDeploymentId and .pushDeploymentId and .firebaseProjectId and .hostingUrl' "$CONFIG" >/dev/null
          MAIN_ID="$(jq -r '.mainDeploymentId' "$CONFIG")"
          PUSH_ID="$(jq -r '.pushDeploymentId' "$CONFIG")"
          [[ "$MAIN_ID" =~ ^[A-Za-z0-9_-]+$ ]] || { echo 'Invalid MAIN deployment ID.'; exit 1; }
          [[ "$PUSH_ID" =~ ^[A-Za-z0-9_-]+$ ]] || { echo 'Invalid PUSH deployment ID.'; exit 1; }
          {
            echo "MAIN_URL=https://script.google.com/macros/s/$MAIN_ID/exec"
            echo "PUSH_URL=https://script.google.com/macros/s/$PUSH_ID/exec"
            echo "FIREBASE_PROJECT_ID=$(jq -r '.firebaseProjectId' "$CONFIG")"
            echo "HOSTING_URL=$(jq -r '.hostingUrl' "$CONFIG")"
            echo "BUILD_ROOT=$RUNNER_TEMP/jayuminton-member-install-fix"
          } >> "$GITHUB_ENV"

      - name: Verify current member page endpoint
        shell: bash
        run: |
          set -euo pipefail
          BODY="$RUNNER_TEMP/member-page.html"
          FINAL="$RUNNER_TEMP/member-final-url.txt"
          curl --fail --location --retry 4 --retry-delay 3 --max-time 90 \
            --output "$BODY" --write-out '%{url_effective}' \
            "$MAIN_URL?mode=user&app=user&source=pwa-fix" > "$FINAL"
          test -s "$BODY"
          if grep -Eiq 'drive\.google\.com|docs\.google\.com|주소를 확인한 다음 다시 시도|요청한 파일이 존재하지|file you have requested does not exist' "$FINAL" "$BODY"; then
            echo 'MAIN member page is not valid.'
            cat "$FINAL"
            exit 1
          fi
          grep -F 'memberSelfSearchInput' "$BODY" >/dev/null || { echo 'Member name search is missing from MAIN.'; exit 1; }

      - name: Build v1.6.37 UI with fixed behavior only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$BUILD_ROOT"
          mkdir -p "$BUILD_ROOT/web-push"
          cp deployment/jayuminton/firebase.json "$BUILD_ROOT/firebase.json"

          cp deployment/jayuminton/v1637-web/index.html "$BUILD_ROOT/web-push/index.html"
          cp deployment/jayuminton/v1637-web/setup-v205.css "$BUILD_ROOT/web-push/setup-v205.css"
          cp deployment/jayuminton/v1637-web/manifest.webmanifest "$BUILD_ROOT/web-push/manifest.webmanifest"
          cp deployment/jayuminton/v1637-web/firebase-messaging-sw.js "$BUILD_ROOT/web-push/firebase-messaging-sw.js"

          # Use the repaired source parts, never the old ZIP-compressed setup copy.
          cat deployment/jayuminton/exact-v1637-web/setup-v205.js.part-* > "$BUILD_ROOT/web-push/setup-v205.js"

          python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ['BUILD_ROOT']) / 'web-push'
          setup_path = root / 'setup-v205.js'
          setup = setup_path.read_text(encoding='utf-8')

          standalone_anchor = "  syncStandaloneInstallState();\n  frame.src = userOnlyMemberPageUrl(cfg.memberPageUrl, transferredMemberSession) || 'about:blank';\n"
          standalone_fix = """  syncStandaloneInstallState();
  if (!isStandaloneApp()) {
    try {
      localStorage.removeItem(STORAGE.installConfirmed);
      if (localStorage.getItem(STORAGE.installChoice) === 'on') {
        localStorage.removeItem(STORAGE.installChoice);
      }
    } catch (_) {}
  }
  frame.src = userOnlyMemberPageUrl(cfg.memberPageUrl, transferredMemberSession) || 'about:blank';
"""
          if standalone_anchor not in setup:
              raise SystemExit('Standalone install-state anchor not found.')
          setup = setup.replace(standalone_anchor, standalone_fix, 1)

          listener_anchor = "  connectButton.addEventListener('click', handleAlarmButton);\n"
          listener_fix = """  connectButton.addEventListener('click', handleAlarmButton);
  nameInput.addEventListener('input', () => {
    const typed = firstTwoSearchChars(nameInput.value);
    const saved = member && member.name ? firstTwoSearchChars(member.name) : '';
    if (member && typed && typed !== saved) {
      member = null;
      try { localStorage.removeItem(STORAGE.member); } catch (_) {}
      isConnected = false;
      setOff('새 이름을 입력한 뒤 아래 이름 검색 결과에서 본인을 눌러 주세요.');
      sendBootstrap();
    }
  });
"""
          if listener_anchor not in setup:
              raise SystemExit('Name-input listener anchor not found.')
          setup = setup.replace(listener_anchor, listener_fix, 1)

          old_match = """    const exactSelected = member && member.id
      ? members.find((item) => String(item.id) === String(member.id))
      : null;
    const matches = exactSelected
      ? [exactSelected]
      : members.filter((item) => firstTwoSearchChars(item.name) === typed);
"""
          new_match = """    const typedMatchesSavedMember = Boolean(
      member && member.id && firstTwoSearchChars(member.name) === typed
    );
    const exactSelected = typedMatchesSavedMember
      ? members.find((item) => String(item.id) === String(member.id))
      : null;
    const matches = exactSelected
      ? [exactSelected]
      : members.filter((item) => firstTwoSearchChars(item.name) === typed);
"""
          if old_match not in setup:
              raise SystemExit('Saved-member search anchor not found.')
          setup = setup.replace(old_match, new_match, 1)

          branch_marker = "} else if (data.type === 'JAYUMINTON_MEMBER_SELECTED' || data.type === 'JAYUMINTON_MEMBER_CLICKED') {"
          branch_start = setup.find(branch_marker)
          if branch_start < 0:
              raise SystemExit('Member-selection branch not found.')
          assignment = """        member = {id:String(data.member.id), name:String(data.member.name)};
        saveJson(STORAGE.member, member);
        nameInput.value = shortName(member.name);
"""
          assignment_pos = setup.find(assignment, branch_start)
          if assignment_pos < 0 or assignment_pos > branch_start + 1200:
              raise SystemExit('Member replacement assignment not found.')
          replacement = """        const nextMember = {id:String(data.member.id), name:String(data.member.name)};
        const memberChanged = Boolean(member && String(member.id) !== String(nextMember.id));
        member = nextMember;
        saveJson(STORAGE.member, member);
        nameInput.value = shortName(member.name);
        if (memberChanged) {
          try { localStorage.removeItem(STORAGE.token); } catch (_) {}
          isConnected = false;
          setOff(member.name + '님으로 변경했습니다. 완료를 눌러 알림을 다시 연결해 주세요.');
        }
"""
          setup = setup[:assignment_pos] + replacement + setup[assignment_pos + len(assignment):]
          setup_path.write_text(setup, encoding='utf-8')

          index_path = root / 'index.html'
          index = index_path.read_text(encoding='utf-8')
          index = index.replace('/setup-v205.js?v=1637', '/setup-v205.js?v=1637-name-install-fix2')
          index = index.replace('/config-v204.js?v=1637', '/config-v204.js?v=1637-name-install-fix2')
          index_path.write_text(index, encoding='utf-8')

          worker_path = root / 'firebase-messaging-sw.js'
          worker = worker_path.read_text(encoding='utf-8')
          worker = worker.replace("const JAYUMINTON_SW_VERSION = '1.6.37';", "const JAYUMINTON_SW_VERSION = '1.6.37-name-install-fix2';")
          worker = worker.replace("const JAYUMINTON_CACHE = 'jayuminton-shell-v205';", "const JAYUMINTON_CACHE = 'jayuminton-shell-v205-name-install-fix2';")
          worker_path.write_text(worker, encoding='utf-8')
          PY

          node --check "$BUILD_ROOT/web-push/setup-v205.js"
          grep -F 'typedMatchesSavedMember' "$BUILD_ROOT/web-push/setup-v205.js" >/dev/null
          grep -F 'memberChanged' "$BUILD_ROOT/web-push/setup-v205.js" >/dev/null
          grep -F 'Never refresh or reopen this page' "$BUILD_ROOT/web-push/setup-v205.js" >/dev/null
          grep -F "appInstallClickProxy.removeAttribute('href')" "$BUILD_ROOT/web-push/setup-v205.js" >/dev/null
          if grep -F 'S.browser_fallback_url=' "$BUILD_ROOT/web-push/setup-v205.js" >/dev/null; then
            echo 'Unsafe Android browser fallback is still present.'
            exit 1
          fi

          python3 - <<'PY'
          import os
          from pathlib import Path
          src = Path('deployment/jayuminton/v1637-web/config-v204.template.js').read_text(encoding='utf-8')
          out = src.replace('__MEMBER_PAGE_URL__', os.environ['MAIN_URL']).replace('__RELAY_URL__', os.environ['PUSH_URL'])
          if '__MEMBER_PAGE_URL__' in out or '__RELAY_URL__' in out:
              raise SystemExit('URL injection failed.')
          root = Path(os.environ['BUILD_ROOT']) / 'web-push'
          for name in ('config-v202.js', 'config-v203.js', 'config-v204.js'):
              (root / name).write_text(out, encoding='utf-8')
          PY

          BASE="${HOSTING_URL%/}"
          for asset in icon-198.png icon-512.png apple-touch-icon-180.png badge-96.png; do
            curl --fail --location --retry 3 --max-time 60 -H 'Cache-Control: no-cache' \
              "$BASE/$asset?behaviorfix=$GITHUB_RUN_ID" -o "$BUILD_ROOT/web-push/$asset"
            test -s "$BUILD_ROOT/web-push/$asset"
          done
          for optional in icon.svg badge.svg; do
            curl --fail --location --retry 1 --max-time 30 \
              "$BASE/$optional?behaviorfix=$GITHUB_RUN_ID" -o "$BUILD_ROOT/web-push/$optional" || rm -f "$BUILD_ROOT/web-push/$optional"
          done
          for version in 170 190 191 192 193 194 195 196 197 198 199 200 201 202 203 204 205; do
            cat > "$BUILD_ROOT/web-push/firebase-messaging-sw-v${version}.js" <<'EOF'
          importScripts('/firebase-messaging-sw.js');
          self.addEventListener('install', () => self.skipWaiting());
          self.addEventListener('activate', (event) => event.waitUntil(self.clients.claim()));
          EOF
          done

      - name: Deploy Firebase Hosting
        working-directory: ${{ env.BUILD_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          firebase deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive \
            --message "Restore name change and no-reload install ${GITHUB_SHA::7}"

      - name: Verify live behavior fix
        shell: bash
        run: |
          set -euo pipefail
          BASE="${HOSTING_URL%/}"
          BUST="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          curl --fail --location --max-time 60 -H 'Cache-Control: no-cache' "$BASE/?verify=$BUST" -o "$RUNNER_TEMP/live-index.html"
          curl --fail --location --max-time 60 -H 'Cache-Control: no-cache' "$BASE/setup-v205.js?verify=$BUST" -o "$RUNNER_TEMP/live-setup.js"
          curl --fail --location --max-time 60 -H 'Cache-Control: no-cache' "$BASE/config-v204.js?verify=$BUST" -o "$RUNNER_TEMP/live-config.js"
          curl --fail --location --max-time 60 -H 'Cache-Control: no-cache' "$BASE/firebase-messaging-sw.js?verify=$BUST" -o "$RUNNER_TEMP/live-worker.js"
          grep -F 'setup-v205.js?v=1637-name-install-fix2' "$RUNNER_TEMP/live-index.html" >/dev/null
          grep -F 'typedMatchesSavedMember' "$RUNNER_TEMP/live-setup.js" >/dev/null
          grep -F 'memberChanged' "$RUNNER_TEMP/live-setup.js" >/dev/null
          grep -F 'Never refresh or reopen this page' "$RUNNER_TEMP/live-setup.js" >/dev/null
          if grep -F 'S.browser_fallback_url=' "$RUNNER_TEMP/live-setup.js" >/dev/null; then
            echo 'Unsafe Android browser fallback is live.'
            exit 1
          fi
          grep -F "$MAIN_URL" "$RUNNER_TEMP/live-config.js" >/dev/null
          grep -F 'jayuminton-shell-v205-name-install-fix2' "$RUNNER_TEMP/live-worker.js" >/dev/null
          echo 'Name replacement and no-reload PWA install behavior are live.'
