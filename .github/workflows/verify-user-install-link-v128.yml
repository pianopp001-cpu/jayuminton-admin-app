name: Verify live v1.2.8 user install link

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-user-install-link-v128.yml'
      - 'deployment/status/user-native-push-v1.2.8.txt'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --global @google/clasp@latest

      - name: Verify hosting, main routing and APK bytes
        shell: bash
        run: |
          set -euo pipefail
          C="$RUNNER_TEMP/deploy.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$C"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          HOSTING_URL="$(jq -r '.hostingUrl' "$C")"
          MAIN_SCRIPT_ID="$(jq -r '.mainScriptId' "$C")"
          EXPECT='jayuminton-courtstatus-v1.2.8-repeat-switch.apk?build=128-repeat-switch'
          STATUS_SRC='deployment/status/user-native-push-v1.2.8.txt'
          SHA="$(sed -n 's/^apk_sha256=//p' "$STATUS_SRC" | tail -1)"
          test -n "$SHA"

          ok=0
          for attempt in $(seq 1 24); do
            if curl --fail --location --silent --show-error -H 'Cache-Control: no-cache' \
                "${HOSTING_URL%/}/setup-v205.js?verify=v128-$GITHUB_RUN_ID-$attempt" \
                -o "$RUNNER_TEMP/live-setup.js" && \
               grep -F 'JAYUMINTON_NATIVE_APK_DOWNLOAD_V128' "$RUNNER_TEMP/live-setup.js" >/dev/null && \
               grep -F "$EXPECT" "$RUNNER_TEMP/live-setup.js" >/dev/null; then
              ok=1; break
            fi
            sleep 10
          done
          test "$ok" = 1

          W="$RUNNER_TEMP/main"; mkdir -p "$W"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$MAIN_SCRIPT_ID" > "$W/.clasp.json"
          ok=0
          for attempt in $(seq 1 12); do
            rm -f "$W/Script.html"
            (cd "$W" && clasp pull) || true
            if grep -F "$EXPECT" "$W/Script.html" >/dev/null 2>&1; then ok=1; break; fi
            sleep 8
          done
          test "$ok" = 1

          curl --fail --location --retry 5 \
            'https://raw.githubusercontent.com/pianopp001-cpu/jayuminton-admin-app/main/releases/jayuminton-courtstatus-v1.2.8-repeat-switch.apk?build=128-repeat-switch' \
            -o "$RUNNER_TEMP/live-v128.apk"
          test "$(sha256sum "$RUNNER_TEMP/live-v128.apk" | awk '{print $1}')" = "$SHA"

          cat > deployment/status/user-v128-install-link-live.txt <<EOF
          status=success
          version=1.2.8
          apk=jayuminton-courtstatus-v1.2.8-repeat-switch.apk
          apk_sha256=$SHA
          hosting_button=v1.2.8
          main_button=v1.2.8
          repeated_member_switch=current-member-only-vibration
          previous_member_alert=stopped-on-member-change
          admin_logic_changed=no
          verified_at=$(date -u +%FT%TZ)
          EOF

      - name: Publish verification status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment/status/user-v128-install-link-live.txt
          git commit -m 'Record live v1.2.8 user install link verification' || exit 0
          git pull --rebase origin main || true
          git push origin main
