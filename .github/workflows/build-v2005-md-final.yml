name: Build MD-aligned admin v200.5 final APK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-v2005-md-final.yml'
      - 'deployment/jayuminton/admin_cloudflare_post_contract_patch.py'
      - 'deployment/jayuminton/admin_top_controls_final_patch.py'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.7'}

      - name: Prepare MD-aligned admin HTML
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 8 --retry-delay 2 "https://jayuminton-push--admin-cloudflare-vnext-z3bgvi2g.web.app/?v2005=${GITHUB_RUN_ID}" -o "$RUNNER_TEMP/admin.html"
          python3 deployment/jayuminton/admin_cloudflare_post_contract_patch.py "$RUNNER_TEMP/admin.html"
          python3 deployment/jayuminton/admin_top_controls_final_patch.py "$RUNNER_TEMP/admin.html"
          required=(
            'JAYUMINTON_ADMIN_CLOUDFLARE_FINAL_V1'
            '__JAYUMINTON_ADMIN_VOICE_TEST_REMOVED__'
            '__JAYUMINTON_ADMIN_NEW_BADGE_KO__'
            '__JAYUMINTON_ADMIN_REFRESH_BOUND__'
            '__JAYUMINTON_ADMIN_BLOCKING_SAVE__'
            '__JAYUMINTON_ADMIN_EMPTY_COURT_FINISH_V1__'
            '__JAYUMINTON_ADMIN_TRANSITION_ALERT_BRIDGE_V1__'
            '__JAYUMINTON_ADMIN_FAST_SAVE_CLIENT_V1__'
            '__JAYUMINTON_ADMIN_STATISTICS_NO_CLIP_FINAL__'
            '__JAYUMINTON_ADMIN_EXCLUDED_ALWAYS_VISIBLE_V1__'
            "memberWaitAlert:'member-device-only'"
            "memberCourtAlert:'member-device-only'"
            'adminTransitionVibration:false'
            'adminCourtVoice:true'
            'voiceRepeatCount:3'
            'emptyCourtAllowed:true'
            'vibrationSets:8'
            'vibrationsPerSet:3'
            '번 코트 나왔습니다.'
            '대기 1번 '
            '번 코트로 들어가 주세요.'
            'data-jm-bottom-controls'
            '__JAYUMINTON_ADMIN_BOTTOM_CONTROLS_FINAL_V2__'
            '실행취소'
            '새로고침'
            '자동배정'
            'z-index:2147483647'
          )
          missing=0
          for marker in "${required[@]}"; do
            if ! grep -F "$marker" "$RUNNER_TEMP/admin.html" >/dev/null; then
              echo "MISSING_MD_MARKER=$marker" >&2
              missing=1
            fi
          done
          test "$missing" = 0
          if grep -F 'adminVoiceTestButton' "$RUNNER_TEMP/admin.html" >/dev/null; then echo 'LEGACY_VOICE_TEST_SURVIVED' >&2; exit 1; fi
          if grep -F '>음성테스트<' "$RUNNER_TEMP/admin.html" >/dev/null; then echo 'VOICE_TEST_TEXT_SURVIVED' >&2; exit 1; fi
          if grep -F 'script.google.com/macros/s/' "$RUNNER_TEMP/admin.html" >/dev/null; then echo 'DIRECT_APPS_SCRIPT_URL_SURVIVED' >&2; exit 1; fi
          mkdir -p app/src/main/assets/admin
          cp "$RUNNER_TEMP/admin.html" app/src/main/assets/admin/index.html

      - name: Prepare v200.5 native admin shell
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          java=Path('app/src/main/java/com/jayuminton/admin/MainActivity.java')
          s=java.read_text(encoding='utf-8')
          s,n=re.subn(r'private static final String ADMIN_URL =\s*\n?\s*"[^"]+";', 'private static final String ADMIN_URL =\n            "file:///android_asset/admin/index.html?app=admin&native=1&appVersion=200.5";', s, count=1)
          if n != 1: raise SystemExit('ADMIN_URL replacement failed')
          s,n=re.subn(r'private static final String APK_WEB_BUILD = "[^"]+";', 'private static final String APK_WEB_BUILD = "2005-md-final";', s, count=1)
          if n != 1: raise SystemExit('APK_WEB_BUILD replacement failed')
          s=re.sub(r'JayumintonNative/[0-9.]+ CloudflareAdmin/[0-9]+','JayumintonNative/200.5 CloudflareAdmin/2005',s,count=1)
          s=s.replace('int duckedMusic = Math.max(0, Math.min(MEDIA_DUCK_VOLUME_STEP, maxMedia));','int duckedMusic = Math.min(originalMediaVolume, Math.max(0, Math.min(MEDIA_DUCK_VOLUME_STEP, maxMedia)));')
          java.write_text(s,encoding='utf-8')
          gradle=Path('app/build.gradle')
          g=gradle.read_text(encoding='utf-8')
          g=re.sub(r"applicationId\s+['\"][^'\"]+['\"]", "applicationId 'com.jayuminton.admin'", g, count=1)
          g=re.sub(r'versionCode\s+\d+', 'versionCode 2005', g, count=1)
          g=re.sub(r"versionName\s+['\"][^'\"]+['\"]", "versionName '200.5'", g, count=1)
          gradle.write_text(g,encoding='utf-8')
          PY
          grep -F 'VOICE_REPEAT_COUNT = 3' app/src/main/java/com/jayuminton/admin/MainActivity.java >/dev/null
          grep -F 'AUDIOFOCUS_GAIN_TRANSIENT_MAY_DUCK' app/src/main/java/com/jayuminton/admin/MainActivity.java >/dev/null
          grep -F 'setWillPauseWhenDucked(false)' app/src/main/java/com/jayuminton/admin/MainActivity.java >/dev/null
          grep -F 'Math.min(originalMediaVolume' app/src/main/java/com/jayuminton/admin/MainActivity.java >/dev/null

      - name: Restore launcher icon and release signer
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode app/src/main/res/drawable/icon_from_library.b64 > app/src/main/res/drawable/icon.png
          test "$(sha256sum app/src/main/res/drawable/icon.png | awk '{print $1}')" = 'a64eaa06107cd20478fe49ab7c10b5b2afd2347533b95c383a439f8705d4a58e'
          rm -f app/src/main/res/drawable/icon_from_library.b64
          mkdir -p signing
          base64 --decode signing/jayuminton-release.keystore.b64 > signing/jayuminton-release.jks
          keytool -list -keystore signing/jayuminton-release.jks -storepass 'JayuMinton14!' -alias jayuminton >/dev/null

      - name: Build signed release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify APK against MD contract
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          unzip -p "$APK" assets/admin/index.html > "$RUNNER_TEMP/apk-admin.html"
          for marker in JAYUMINTON_ADMIN_CLOUDFLARE_FINAL_V1 __JAYUMINTON_ADMIN_BLOCKING_SAVE__ __JAYUMINTON_ADMIN_EMPTY_COURT_FINISH_V1__ __JAYUMINTON_ADMIN_TRANSITION_ALERT_BRIDGE_V1__ __JAYUMINTON_ADMIN_STATISTICS_NO_CLIP_FINAL__ __JAYUMINTON_ADMIN_EXCLUDED_ALWAYS_VISIBLE_V1__ 'adminTransitionVibration:false' 'voiceRepeatCount:3' 'vibrationSets:8' 'vibrationsPerSet:3' '번 코트 나왔습니다.' '대기 1번 ' '번 코트로 들어가 주세요.' 'data-jm-bottom-controls' '__JAYUMINTON_ADMIN_BOTTOM_CONTROLS_FINAL_V2__' '실행취소' '새로고침' '자동배정' 'z-index:2147483647'; do
            if ! grep -F "$marker" "$RUNNER_TEMP/apk-admin.html" >/dev/null; then echo "MISSING_APK_MD_MARKER=$marker" >&2; exit 1; fi
          done

      - name: Publish MD-aligned final APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p releases deployment/status
          cp app/build/outputs/apk/release/app-release.apk releases/jayuminton-admin-v200.5-md-final.apk
          SHA=$(sha256sum releases/jayuminton-admin-v200.5-md-final.apk | awk '{print $1}')
          printf 'status=success\nversion=200.5\nrun_id=%s\nsha256=%s\nbuild=md-final\n' "$GITHUB_RUN_ID" "$SHA" > deployment/status/v2005-md-final.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/jayuminton-admin-v200.5-md-final.apk deployment/status/v2005-md-final.txt
          git commit -m 'Publish MD-aligned Jayuminton admin v200.5 APK'
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          git push origin main
