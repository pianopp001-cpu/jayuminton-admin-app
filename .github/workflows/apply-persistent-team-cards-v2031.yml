name: Apply persistent team cards v2031

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-persistent-team-cards-v2031.yml'
      - 'deployment/jayuminton/fix_persistent_team_cards_v2031.py'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply persistent team-card patch
        run: |
          set -euo pipefail
          python3 deployment/jayuminton/fix_persistent_team_cards_v2031.py
          grep -F "card.classList.add('has-member-team')" deployment/jayuminton/cloudflare_v6_frontend_bridge.js >/dev/null
          grep -F "cardSelector.split(',').join(',#adminApp ')" deployment/jayuminton/cloudflare_v6_frontend_bridge.js >/dev/null
          grep -F 'jayuminton-admin-team-safety-v2037' deployment/jayuminton/cloudflare_v6_frontend_bridge.js >/dev/null
      - name: Commit patched bridge
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment/jayuminton/cloudflare_v6_frontend_bridge.js
          git commit -m 'fix: persist bottom team labels across admin rerenders' || exit 0
          git push origin HEAD:main
