name: Trigger and watch v200.4 post-contract final
on:
  push:
    branches: [main]
    paths: ['.github/workflows/trigger-watch-v2004-direct3.yml']
  workflow_dispatch: {}
permissions:
  actions: write
  contents: write
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - name: Dispatch and watch final build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          OLD=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-v2004-final-direct3.yml --branch main --limit 1 --json databaseId --jq '.[0].databaseId // 0')
          gh workflow run build-v2004-final-direct3.yml --repo "$GITHUB_REPOSITORY" --ref main
          RUN=0
          for i in $(seq 1 60); do
            RUN=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-v2004-final-direct3.yml --branch main --limit 1 --json databaseId --jq '.[0].databaseId // 0')
            if [ "$RUN" != "0" ] && [ "$RUN" != "$OLD" ]; then break; fi
            sleep 2
          done
          test "$RUN" != "0"; test "$RUN" != "$OLD"
          set +e
          gh run watch "$RUN" --repo "$GITHUB_REPOSITORY" --exit-status
          RC=$?
          set -e
          CONCLUSION=$(gh run view "$RUN" --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion')
          FAILED=$(gh run view "$RUN" --repo "$GITHUB_REPOSITORY" --json jobs --jq '[.jobs[].steps[] | select(.conclusion=="failure") | .name] | join(",")')
          gh run view "$RUN" --repo "$GITHUB_REPOSITORY" --log > "$RUNNER_TEMP/build.log" || true
          DETAIL=$(grep -E 'MISSING_|POST_CONTRACT|TOP_CONTROLS|replacement failed|anchor missing|FAILURE:|error:|BUILD SUCCESSFUL|apksigner' "$RUNNER_TEMP/build.log" | tail -40 | tr '\n' '|' || true)
          mkdir -p deployment/status
          printf 'run_id=%s\nconclusion=%s\nfailed_steps=%s\ndetail=%s\nworkflow_url=https://github.com/%s/actions/runs/%s\n' "$RUN" "$CONCLUSION" "$FAILED" "$DETAIL" "$GITHUB_REPOSITORY" "$RUN" > deployment/status/v2004-direct3-watch.txt
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment/status/v2004-direct3-watch.txt
          git commit -m "Record watched v200.4 post-contract build $RUN" || true
          git pull --rebase origin main
          git push origin main
          exit $RC
