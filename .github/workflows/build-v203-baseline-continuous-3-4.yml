name: Build v203 baseline continuous 3-4 selection

on:
  push:
    branches: [main]
    paths:
      - 'deployment/jayuminton/patch_v203_baseline_continuous_3_4.py'
      - '.github/workflows/build-v203-baseline-continuous-3-4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore exact v203 baseline shell
        shell: bash
        run: |
          set -euo pipefail
          PROVEN_COMMIT=20823018b13bba64082b09b76db617680a9d16b5
          BASE_APK=releases/jayuminton-admin-v203.0-complete-pair-recording-clear-team-cards.apk
          test -s "$BASE_APK"
          rm -rf app
          git archive "$PROVEN_COMMIT" app | tar -x
          mkdir -p app/src/main/assets/admin
          unzip -p "$BASE_APK" assets/admin/index.html > app/src/main/assets/admin/index.html
          test -s app/src/main/assets/admin/index.html
          grep -F '__JAYUMINTON_ADMIN_MULTI_ACTION_V2053__' app/src/main/assets/admin/index.html >/dev/null
          grep -F '__JAYUMINTON_ADMIN_CONTINUE_SELECTION_V2067__' app/src/main/assets/admin/index.html >/dev/null

      - name: Apply only 3-4 continuous selection fix
        shell: bash
        run: |
          set -euo pipefail
          HTML=app/src/main/assets/admin/index.html
          python3 deployment/jayuminton/patch_v203_baseline_continuous_3_4.py "$HTML"
          grep -F 'JAYUMINTON_V203_BASELINE_CONTINUOUS_3_4_MINIMAL' "$HTML" >/dev/null
          grep -F "if(same){if(selected.length<4){selected.push(id);renderGreen();renderPanel();return;}" "$HTML" >/dev/null
          grep -F "if(selected.length>=2&&selected.length<=4){beginAutoTarget({kind:'member',id:id});return;}" "$HTML" >/dev/null
          grep -F "if(ids.length!==2)throw new Error('팀설정은 2명 선택일 때만 사용할 수 있습니다.')" "$HTML" >/dev/null
          grep -F 'jm-v203-two-team-only' "$HTML" >/dev/null

      - name: Set identity and signer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          java=Path('app/src/main/java/com/jayuminton/admin/MainActivity.java')
          s=java.read_text(encoding='utf-8')
          s,n=re.subn(r'private static final String ADMIN_URL =\s*\n?\s*"[^"]+";', 'private static final String ADMIN_URL =\n            "file:///android_asset/admin/index.html?app=admin&native=1&appVersion=203.1";',s,count=1)
          if n!=1: raise SystemExit('ADMIN_URL replacement failed')
          java.write_text(s,encoding='utf-8')
          gradle=Path('app/build.gradle')
          g=gradle.read_text(encoding='utf-8')
          g=re.sub(r'versionCode\s+\d+','versionCode 2031',g,count=1)
          g=re.sub(r"versionName\s+['\"][^'\"]+['\"]","versionName '203.1'",g,count=1)
          gradle.write_text(g,encoding='utf-8')
          PY
          base64 --decode app/src/main/res/drawable/icon_from_library.b64 > app/src/main/res/drawable/icon.png
          rm -f app/src/main/res/drawable/icon_from_library.b64
          base64 --decode signing/jayuminton-release.keystore.b64 > signing/jayuminton-release.jks

      - name: Build verify publish
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleRelease
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          unzip -p "$APK" assets/admin/index.html > "$RUNNER_TEMP/apk-admin.html"
          grep -F 'JAYUMINTON_V203_BASELINE_CONTINUOUS_3_4_MINIMAL' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F "if(same){if(selected.length<4){selected.push(id);renderGreen();renderPanel();return;}" "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F "if(ids.length!==2)throw new Error('팀설정은 2명 선택일 때만 사용할 수 있습니다.')" "$RUNNER_TEMP/apk-admin.html" >/dev/null
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          mkdir -p releases deployment/status
          cp "$APK" releases/jayuminton-admin-v203.1-baseline-continuous-3-4.apk
          printf 'status=success\nversion=203.1\nbase=v203.0-complete-pair-recording-clear-team-cards\nchange=continuous-3-4-selection-only\nrun_id=%s\nsha256=%s\n' "$GITHUB_RUN_ID" "$SHA" > deployment/status/v2031-baseline-continuous-3-4.txt
          git add releases/jayuminton-admin-v203.1-baseline-continuous-3-4.apk deployment/status/v2031-baseline-continuous-3-4.txt
          git commit -m 'Publish v203.1 baseline continuous 3-4 selection APK' || exit 0
          git push origin HEAD:main
