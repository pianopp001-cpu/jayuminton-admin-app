name: Build v199 PIN + CSS text cleanup APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Apply PIN patch and remove leaked CSS text only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/src/main/java/com/jayuminton/admin/MainActivity.java')
          t=p.read_text(encoding='utf-8')
          t=re.sub(r'https://script\.google\.com/macros/s/[^"\\]+/exec\?mode=admin(?:&appVersion=[^"\\]+)?','https://script.google.com/macros/s/AKfycbzaExnvUwO1FWcLhXQxUUJyHLXgC7mZHM0Z2T33Z4EvNap3lqHPryOV-FlQ09NJKt48Ww/exec?mode=admin&appVersion=199',t,count=1)
          t=re.sub(r'JayumintonNative/[0-9A-Za-z.\-]+','JayumintonNative/199.5',t)
          old='"window.__JAYUMINTON_NATIVE_APP__=true;" +\n                        "document.documentElement.setAttribute(\'data-native-app\',\'1\');"'
          new='"window.__JAYUMINTON_NATIVE_APP__=true;" +\n                        "document.documentElement.setAttribute(\'data-native-app\',\'1\');" +\n                        "(function(){" +\n                        "var removeLeakedCss=function(){try{var nodes=[].slice.call(document.body.childNodes);nodes.forEach(function(n){var t=(n.nodeType===3?n.nodeValue:(n.nodeType===1?n.textContent:\'\'))||\'\';var s=t.trim();if((s.indexOf(\':root{\')===0||s.indexOf(\':root {\')===0)&&s.indexOf(\'--bg\')>-1&&s.indexOf(\'--primary\')>-1){if(n.parentNode)n.parentNode.removeChild(n);}});}catch(e){}};" +\n                        "var readSession=function(){var keys=[\'jayuminton_admin_session_v1\',\'adminSession\',\'adminPin\',\'adminPIN\'];for(var i=0;i<keys.length;i++){try{var v=localStorage.getItem(keys[i])||sessionStorage.getItem(keys[i]);if(v)return String(v);}catch(e){}}try{if(typeof ADMIN_PIN_VALUE!==\'undefined\'&&ADMIN_PIN_VALUE)return String(ADMIN_PIN_VALUE);}catch(e){}return \'\';};" +\n                        "var install=function(){removeLeakedCss();if(typeof window.runAction!==\'function\')return false;if(window.__JAYUMINTON_PIN_FIX__)return true;window.__JAYUMINTON_PIN_FIX__=true;var original=window.addMember;window.addMember=async function(){var c=readSession();if(!c&&typeof original===\'function\')return original.apply(this,arguments);var n=document.getElementById(\'newName\'),g=document.getElementById(\'newGender\'),r=document.getElementById(\'newGrade\'),x=document.getElementById(\'newExperience\');return window.runAction(\'addMember\',[c,n?String(n.value||\'\').trim():\'\',g?String(g.value||\'\'):\'\',r?String(r.value||\'\').trim():\'\',x?String(x.value||\'\').trim():\'\']);};return true;};" +\n                        "removeLeakedCss();var q=setInterval(function(){removeLeakedCss();if(install())clearInterval(q);},100);setTimeout(function(){clearInterval(q);removeLeakedCss();},10000);" +\n                        "})();"'
          if old not in t: raise SystemExit('WebView marker not found')
          p.write_text(t.replace(old,new),encoding='utf-8')
          g=Path('app/build.gradle'); s=g.read_text(encoding='utf-8'); s=re.sub(r'versionCode\s+\d+','versionCode 1995',s,count=1); s=re.sub(r"versionName\s+['\"][^'\"]+['\"]","versionName '199.5'",s,count=1); g.write_text(s,encoding='utf-8')
          PY
          grep -F 'removeLeakedCss' app/src/main/java/com/jayuminton/admin/MainActivity.java
          grep -F 'JAYUMINTON_PIN_FIX' app/src/main/java/com/jayuminton/admin/MainActivity.java
          ! grep -F 'jayuminton-repaired-style' app/src/main/java/com/jayuminton/admin/MainActivity.java

      - name: Build fresh-install APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jayuminton-v199.5-pin-css-text-cleanup
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
