name: Build v199 PIN-only APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Apply PIN session patch only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          java_path = Path('app/src/main/java/com/jayuminton/admin/MainActivity.java')
          text = java_path.read_text(encoding='utf-8')

          text = re.sub(
              r'https://script\.google\.com/macros/s/[^"\\]+/exec\?mode=admin(?:&appVersion=[^"\\]+)?',
              'https://script.google.com/macros/s/AKfycbzaExnvUwO1FWcLhXQxUUJyHLXgC7mZHM0Z2T33Z4EvNap3lqHPryOV-FlQ09NJKt48Ww/exec?mode=admin&appVersion=199',
              text,
              count=1
          )
          text = re.sub(r'JayumintonNative/[0-9A-Za-z.\-]+', 'JayumintonNative/199-pin-only', text)

          old_js = (
              '"window.__JAYUMINTON_NATIVE_APP__=true;" +\n'
              '                        "document.documentElement.setAttribute(\'data-native-app\',\'1\');"'
          )
          new_js = (
              '"window.__JAYUMINTON_NATIVE_APP__=true;" +\n'
              '                        "document.documentElement.setAttribute(\'data-native-app\',\'1\');" +\n'
              '                        "(function(){" +\n'
              '                        "var readSession=function(){var keys=[\'jayuminton_admin_session_v1\',\'adminSession\',\'adminPin\',\'adminPIN\'];for(var i=0;i<keys.length;i++){try{var v=localStorage.getItem(keys[i])||sessionStorage.getItem(keys[i]);if(v)return String(v);}catch(e){}}try{if(typeof ADMIN_PIN_VALUE!==\'undefined\'&&ADMIN_PIN_VALUE)return String(ADMIN_PIN_VALUE);}catch(e){}return \'\';};" +\n'
              '                        "var install=function(){if(typeof window.runAction!==\'function\')return false;if(window.__JAYUMINTON_PIN_ONLY__)return true;window.__JAYUMINTON_PIN_ONLY__=true;var original=window.addMember;window.addMember=async function(){var c=readSession();if(!c&&typeof original===\'function\')return original.apply(this,arguments);var n=document.getElementById(\'newName\'),g=document.getElementById(\'newGender\'),r=document.getElementById(\'newGrade\'),x=document.getElementById(\'newExperience\');return window.runAction(\'addMember\',[c,n?String(n.value||\'\').trim():\'\',g?String(g.value||\'\'):\'\',r?String(r.value||\'\').trim():\'\',x?String(x.value||\'\').trim():\'\']);};return true;};" +\n'
              '                        "if(!install()){var t=setInterval(function(){if(install())clearInterval(t);},100);setTimeout(function(){clearInterval(t);},10000);}" +\n'
              '                        "})();"'
          )
          if old_js not in text:
              raise SystemExit('WebView injection marker not found')
          text = text.replace(old_js, new_js)
          java_path.write_text(text, encoding='utf-8')

          gradle_path = Path('app/build.gradle')
          gradle = gradle_path.read_text(encoding='utf-8')
          gradle = re.sub(r'versionCode\s+\d+', 'versionCode 1994', gradle, count=1)
          gradle = re.sub(r"versionName\s+['\"][^'\"]+['\"]", "versionName '199.4-pin-only'", gradle, count=1)
          gradle_path.write_text(gradle, encoding='utf-8')
          PY

          grep -F 'JAYUMINTON_PIN_ONLY' app/src/main/java/com/jayuminton/admin/MainActivity.java
          if grep -F 'repairCss' app/src/main/java/com/jayuminton/admin/MainActivity.java; then
            echo 'CSS repair code must not be injected' >&2
            exit 1
          fi

      - name: Build fresh-install APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jayuminton-v199.4-pin-only
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
