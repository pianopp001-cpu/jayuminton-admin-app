name: Build v1.5 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Apply v1.5 admin session fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          java_path = Path('app/src/main/java/com/jayuminton/admin/MainActivity.java')
          text = java_path.read_text(encoding='utf-8')
          text = text.replace(
            'https://script.google.com/macros/s/AKfycbwVgdQG-DXbgxCgd8L11WA57-DCVaOwF4Sc_lktAZZ0yPJSCIosOOKkmKe3oU8a5pfJ7Q/exec?mode=admin',
            'https://script.google.com/macros/s/AKfycbzaExnvUwO1FWcLhXQxUUJyHLXgC7mZHM0Z2T33Z4EvNap3lqHPryOV-FlQ09NJKt48Ww/exec?mode=admin&appVersion=1.5'
          )
          text = text.replace(
            'settings.setUserAgentString(settings.getUserAgentString() + " JayumintonNative/1.4");',
            'settings.setUserAgentString(settings.getUserAgentString() + " JayumintonNative/1.5");\n        settings.setCacheMode(WebSettings.LOAD_NO_CACHE);'
          )
          text = text.replace(
            'int minimumMusic = maxMedia > 0 ? 1 : 0;',
            'int minimumMusic = maxMedia > 0 ? Math.min(6, maxMedia) : 0;'
          )
          text = text.replace(
            'webView.loadUrl(ADMIN_URL);',
            'webView.clearCache(true);\n        webView.loadUrl(ADMIN_URL);'
          )
          java_path.write_text(text, encoding='utf-8')

          gradle_path = Path('app/build.gradle')
          gradle = gradle_path.read_text(encoding='utf-8')
          gradle = gradle.replace('versionCode 14', 'versionCode 19')
          gradle = gradle.replace("versionName '1.4'", "versionName '1.5'")
          gradle_path.write_text(gradle, encoding='utf-8')
          PY

      - name: Decode signing key
        run: |
          mkdir -p signing
          base64 --decode signing/jayuminton-release.keystore.b64 > signing/jayuminton-release.jks

      - name: Build signed release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Save APK
        run: |
          mkdir -p releases
          cp app/build/outputs/apk/release/app-release.apk releases/jayuminton-admin-v1.5-session-fix.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jayuminton-admin-v1.5-session-fix
          path: releases/jayuminton-admin-v1.5-session-fix.apk
          if-no-files-found: error
          retention-days: 30

      - name: Commit APK to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/jayuminton-admin-v1.5-session-fix.apk
          git commit -m "Add fixed Jayuminton v1.5 APK" || exit 0
          git push
