name: DISABLED legacy v199.6 GAS APK build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blocked:
    runs-on: ubuntu-latest
    steps:
      - name: Block legacy GAS/v199.6 build
        run: |
          echo 'DISABLED: this workflow previously rebuilt v199.6 against Google Apps Script and can overwrite the recovered v203 Cloudflare baseline.'
          echo 'Use the v203 Cloudflare admin APK workflow instead.'
          exit 1
