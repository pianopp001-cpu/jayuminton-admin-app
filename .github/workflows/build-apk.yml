# v199.5 fresh-install rebuild trigger 2026-08-08
name: Build signed Jayuminton v199.5 fresh APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'app/**'

permissions:
  contents: write

concurrency:
  group: jayuminton-v1995-apk
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      DOG_ICON_SHA256: c64778554936a98100ef4a277a007bd4d619e75f22804a8b86deaae86a4af4ed

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Resolve current admin deployment
        shell: bash
        run: |
          set -euo pipefail
          CONFIG="$RUNNER_TEMP/deploy.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$CONFIG"
          jq -e '.mainDeploymentId' "$CONFIG" >/dev/null
          echo "ADMIN_DEPLOYMENT_ID=$(jq -r '.mainDeploymentId' "$CONFIG")" >> "$GITHUB_ENV"

      - name: Restore exact original dog launcher icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/drawable
          FOUND="$RUNNER_TEMP/dog-icon.png"
          rm -f "$FOUND"

          check_apk() {
            local apk="$1"
            local tmp="$RUNNER_TEMP/icon-candidate.png"
            rm -f "$tmp"
            unzip -p "$apk" res/drawable/icon.png > "$tmp" 2>/dev/null || return 0
            test -s "$tmp" || return 0
            local sum
            sum=$(sha256sum "$tmp" | awk '{print $1}')
            if [ "$sum" = "$DOG_ICON_SHA256" ]; then
              cp "$tmp" "$FOUND"
              echo "Original dog icon restored from $apk"
            fi
          }

          while IFS= read -r apk; do
            [ -f "$FOUND" ] && break
            check_apk "$apk"
          done < <(find releases -type f -name '*.apk' 2>/dev/null | sort)

          if [ ! -f "$FOUND" ]; then
            COUNT=0
            while IFS= read -r commit; do
              COUNT=$((COUNT+1))
              [ "$COUNT" -gt 180 ] && break
              while IFS= read -r apkpath; do
                [ -f "$FOUND" ] && break 2
                tmpapk="$RUNNER_TEMP/history.apk"
                git show "$commit:$apkpath" > "$tmpapk" 2>/dev/null || continue
                check_apk "$tmpapk"
              done < <(git ls-tree -r --name-only "$commit" 2>/dev/null | grep -E '^releases/.*\.apk$' | head -n 20 || true)
            done < <(git rev-list --all)
          fi

          if [ ! -f "$FOUND" ]; then
            echo 'Exact original dog icon was not found in APK history.'
            exit 1
          fi

          cp "$FOUND" app/src/main/res/drawable/icon.png
          file app/src/main/res/drawable/icon.png
          test "$(sha256sum app/src/main/res/drawable/icon.png | awk '{print $1}')" = "$DOG_ICON_SHA256"

      - name: Prepare v199.5 fresh-install source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os, re

          deployment_id = os.environ['ADMIN_DEPLOYMENT_ID'].strip()
          if not deployment_id:
              raise SystemExit('ADMIN_DEPLOYMENT_ID is empty')

          java_path = Path('app/src/main/java/com/jayuminton/admin/MainActivity.java')
          text = java_path.read_text(encoding='utf-8')
          admin_url = (
              'https://script.google.com/macros/s/' + deployment_id +
              '/exec?mode=admin&appVersion=199.5&freshAdmin=1'
          )
          text, count = re.subn(
              r'https://script\.google\.com/macros/s/[^"\\]+/exec\?mode=admin[^"\\]*',
              admin_url,
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('ADMIN_URL replacement failed')

          text = re.sub(
              r'JayumintonNative/[0-9A-Za-z.\-]+(?: FreshAdmin/[0-9A-Za-z.\-]+)?',
              'JayumintonNative/199.5 FreshAdmin/1995',
              text,
          )
          text = re.sub(
              r'private static final String APK_WEB_BUILD = "[^"]+";',
              'private static final String APK_WEB_BUILD = "1995-fresh-admin";',
              text,
              count=1,
          )
          java_path.write_text(text, encoding='utf-8')

          gradle_path = Path('app/build.gradle')
          gradle = gradle_path.read_text(encoding='utf-8')
          gradle = re.sub(
              r"applicationId\s+['\"][^'\"]+['\"]",
              "applicationId 'com.jayuminton.admin199'",
              gradle,
              count=1,
          )
          gradle = re.sub(r'versionCode\s+\d+', 'versionCode 1995', gradle, count=1)
          gradle = re.sub(
              r"versionName\s+['\"][^'\"]+['\"]",
              "versionName '199.5'",
              gradle,
              count=1,
          )
          gradle_path.write_text(gradle, encoding='utf-8')
          PY

          grep -F "applicationId 'com.jayuminton.admin199'" app/build.gradle
          grep -F 'versionCode 1995' app/build.gradle
          grep -F "versionName '199.5'" app/build.gradle
          grep -F "$ADMIN_DEPLOYMENT_ID" app/src/main/java/com/jayuminton/admin/MainActivity.java
          grep -F 'NativeBrowser' app/src/main/java/com/jayuminton/admin/MainActivity.java
          grep -F 'jayuminton-push.web.app' app/src/main/java/com/jayuminton/admin/MainActivity.java
          grep -F 'android:icon="@drawable/icon"' app/src/main/AndroidManifest.xml

      - name: Restore release signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signing
          base64 --decode signing/jayuminton-release.keystore.b64 > signing/jayuminton-release.jks
          keytool -list -keystore signing/jayuminton-release.jks -storepass 'JayuMinton14!' -alias jayuminton >/dev/null

      - name: Build signed release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify signed APK and dog icon
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          unzip -p "$APK" res/drawable/icon.png > "$RUNNER_TEMP/final-icon.png"
          test "$(sha256sum "$RUNNER_TEMP/final-icon.png" | awk '{print $1}')" = "$DOG_ICON_SHA256"
          ls -lh "$APK"

      - name: Save fresh-install APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p releases
          cp app/build/outputs/apk/release/app-release.apk releases/jayuminton-v199.5-fresh-install.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jayuminton-v199.5-fresh-install
          path: releases/jayuminton-v199.5-fresh-install.apk
          if-no-files-found: error
          retention-days: 30

      - name: Commit verified APK
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/jayuminton-v199.5-fresh-install.apk
          git commit -m 'Add verified Jayuminton v199.5 fresh-install APK' || exit 0
          git pull --rebase origin main || true
          git push origin main
