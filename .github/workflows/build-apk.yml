name: Build v1.6.6 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Apply v1.6.6 admin session fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          java_path = Path('app/src/main/java/com/jayuminton/admin/MainActivity.java')
          text = java_path.read_text(encoding='utf-8')

          old_urls = [
              'https://script.google.com/macros/s/AKfycbwVgdQG-DXbgxCgd8L11WA57-DCVaOwF4Sc_lktAZZ0yPJSCIosOOKkmKe3oU8a5pfJ7Q/exec?mode=admin',
              'https://script.google.com/macros/s/AKfycbzaExnvUwO1FWcLhXQxUUJyHLXgC7mZHM0Z2T33Z4EvNap3lqHPryOV-FlQ09NJKt48Ww/exec?mode=admin&appVersion=1.5',
          ]
          admin_url = 'https://script.google.com/macros/s/AKfycbzaExnvUwO1FWcLhXQxUUJyHLXgC7mZHM0Z2T33Z4EvNap3lqHPryOV-FlQ09NJKt48Ww/exec?mode=admin&appVersion=1.6.6'
          for old_url in old_urls:
              text = text.replace(old_url, admin_url)

          text = text.replace('JayumintonNative/1.4', 'JayumintonNative/1.6.6')
          text = text.replace('JayumintonNative/1.5', 'JayumintonNative/1.6.6')

          if 'settings.setCacheMode(WebSettings.LOAD_NO_CACHE);' not in text:
              marker = 'settings.setUserAgentString(settings.getUserAgentString() + " JayumintonNative/1.6.6");'
              text = text.replace(marker, marker + '\n        settings.setCacheMode(WebSettings.LOAD_NO_CACHE);')

          text = text.replace(
              'int minimumMusic = maxMedia > 0 ? 1 : 0;',
              'int minimumMusic = maxMedia > 0 ? Math.min(6, maxMedia) : 0;'
          )

          if 'webView.clearCache(true);' not in text:
              text = text.replace(
                  'webView.loadUrl(ADMIN_URL);',
                  'webView.clearCache(true);\n        webView.loadUrl(ADMIN_URL);'
              )

          java_path.write_text(text, encoding='utf-8')

          gradle_path = Path('app/build.gradle')
          gradle = gradle_path.read_text(encoding='utf-8')
          import re
          gradle = re.sub(r'versionCode\s+\d+', 'versionCode 20', gradle, count=1)
          gradle = re.sub(r"versionName\s+['\"][^'\"]+['\"]", "versionName '1.6.6'", gradle, count=1)
          gradle_path.write_text(gradle, encoding='utf-8')
          PY

          grep -F 'appVersion=1.6.6' app/src/main/java/com/jayuminton/admin/MainActivity.java
          grep -F 'JayumintonNative/1.6.6' app/src/main/java/com/jayuminton/admin/MainActivity.java
          grep -F 'WebSettings.LOAD_NO_CACHE' app/src/main/java/com/jayuminton/admin/MainActivity.java
          grep -F 'webView.clearCache(true)' app/src/main/java/com/jayuminton/admin/MainActivity.java
          grep -F 'versionCode 20' app/build.gradle
          grep -F "versionName '1.6.6'" app/build.gradle

      - name: Decode signing key
        run: |
          mkdir -p signing
          base64 --decode signing/jayuminton-release.keystore.b64 > signing/jayuminton-release.jks

      - name: Build signed release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Save APK
        run: |
          mkdir -p releases
          cp app/build/outputs/apk/release/app-release.apk releases/jayuminton-admin-v1.6.6.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jayuminton-admin-v1.6.6
          path: releases/jayuminton-admin-v1.6.6.apk
          if-no-files-found: error
          retention-days: 30

      - name: Commit APK to repository
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/jayuminton-admin-v1.6.6.apk
          git commit -m "Add Jayuminton v1.6.6 APK" || exit 0
          git push
