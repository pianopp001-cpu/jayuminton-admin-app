name: Build v1.4 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Apply v1.4 media volume level 6
        run: |
          sed -i 's/int minimumMusic = maxMedia > 0 ? 1 : 0;/int minimumMusic = maxMedia > 0 ? Math.min(6, maxMedia) : 0;/' app/src/main/java/com/jayuminton/admin/MainActivity.java
          sed -i 's/versionCode 14/versionCode 18/' app/build.gradle
          grep -F 'int minimumMusic = maxMedia > 0 ? Math.min(6, maxMedia) : 0;' app/src/main/java/com/jayuminton/admin/MainActivity.java
          grep -F 'versionCode 18' app/build.gradle

      - name: Decode signing key
        run: |
          mkdir -p signing
          base64 --decode signing/jayuminton-release.keystore.b64 > signing/jayuminton-release.jks

      - name: Build signed release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk jayuminton-admin-v1.4.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jayuminton-admin-v1.4-volume6
          path: jayuminton-admin-v1.4.apk
          if-no-files-found: error
          retention-days: 30
