name: Build verified Jayuminton v199.6 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'app/**'
      - 'deployment/status/stable-admin-interactions.txt'
      - 'deployment/status/verified-push-live.txt'

permissions:
  contents: write

concurrency:
  group: jayuminton-v1996-apk
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      OLD_APK_CERT_SHA256: 1C54FD8A5912E6E6F3A04D80DEAF904CC1FE78CF089A3048105CC5652F4973C9

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Require verified live admin and push states
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'status=success' deployment/status/stable-admin-interactions.txt >/dev/null
          grep -F 'verification=deployed-project-pull-and-js-syntax' deployment/status/stable-admin-interactions.txt >/dev/null
          grep -F 'admin_push_button=removed' deployment/status/stable-admin-interactions.txt >/dev/null
          grep -F 'excluded_double_tap=active' deployment/status/stable-admin-interactions.txt >/dev/null

          grep -F 'status=success' deployment/status/verified-push-live.txt >/dev/null
          grep -F 'hosting_verification=live-bytes-checked' deployment/status/verified-push-live.txt >/dev/null
          grep -F 'pwa_install=chrome-native-prompt-only' deployment/status/verified-push-live.txt >/dev/null
          grep -F 'legacy_handoff=intent-drive-resolver-absent' deployment/status/verified-push-live.txt >/dev/null
          grep -F 'token_registration=server-verified-before-on' deployment/status/verified-push-live.txt >/dev/null
          grep -F 'wait1_vibration=3-pulse-x2' deployment/status/verified-push-live.txt >/dev/null
          grep -F 'court_vibration=3-pulse-x4' deployment/status/verified-push-live.txt >/dev/null

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Resolve current admin deployment
        shell: bash
        run: |
          set -euo pipefail
          CONFIG="$RUNNER_TEMP/deploy.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$CONFIG"
          jq -e '.mainDeploymentId' "$CONFIG" >/dev/null
          DEPLOYMENT_ID="$(jq -r '.mainDeploymentId' "$CONFIG")"
          test -n "$DEPLOYMENT_ID"
          echo "ADMIN_DEPLOYMENT_ID=$DEPLOYMENT_ID" >> "$GITHUB_ENV"

      - name: Restore pinned original dog launcher icon
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_B64=app/src/main/res/drawable/icon_from_library.b64
          TARGET=app/src/main/res/drawable/icon.png
          test -s "$SOURCE_B64"
          base64 --decode "$SOURCE_B64" > "$TARGET"
          test -s "$TARGET"
          file "$TARGET" | grep -F 'PNG image data' >/dev/null

          python3 - <<'PY'
          from pathlib import Path
          import struct
          p = Path('app/src/main/res/drawable/icon.png')
          data = p.read_bytes()
          if data[:8] != b'\x89PNG\r\n\x1a\n':
              raise SystemExit('launcher icon is not PNG')
          width, height = struct.unpack('>II', data[16:24])
          if width != height or width < 128:
              raise SystemExit(f'launcher icon must be square and >=128px, got {width}x{height}')
          print(f'Pinned launcher icon: {width}x{height}, {len(data)} bytes')
          PY
          sha256sum "$TARGET" | tee "$RUNNER_TEMP/source-icon.sha256"

      - name: Prepare v199.6 source from current deployment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os, re

          deployment_id = os.environ['ADMIN_DEPLOYMENT_ID'].strip()
          java_path = Path('app/src/main/java/com/jayuminton/admin/MainActivity.java')
          text = java_path.read_text(encoding='utf-8')
          admin_url = (
              'https://script.google.com/macros/s/' + deployment_id +
              '/exec?mode=admin&appVersion=199.6&freshAdmin=1'
          )
          text, count = re.subn(
              r'https://script\.google\.com/macros/s/[^"\\]+/exec\?mode=admin[^"\\]*',
              admin_url,
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('ADMIN_URL replacement failed')

          text = re.sub(
              r'JayumintonNative/[0-9A-Za-z.\-]+(?: FreshAdmin/[0-9A-Za-z.\-]+)?',
              'JayumintonNative/199.6 FreshAdmin/1996',
              text,
          )
          text = re.sub(
              r'private static final String APK_WEB_BUILD = "[^"]+";',
              'private static final String APK_WEB_BUILD = "1996-verified-admin";',
              text,
              count=1,
          )
          java_path.write_text(text, encoding='utf-8')

          gradle_path = Path('app/build.gradle')
          gradle = gradle_path.read_text(encoding='utf-8')
          gradle = re.sub(
              r"applicationId\s+['\"][^'\"]+['\"]",
              "applicationId 'com.jayuminton.admin199'",
              gradle,
              count=1,
          )
          gradle = re.sub(r'versionCode\s+\d+', 'versionCode 1996', gradle, count=1)
          gradle = re.sub(
              r"versionName\s+['\"][^'\"]+['\"]",
              "versionName '199.6'",
              gradle,
              count=1,
          )
          gradle_path.write_text(gradle, encoding='utf-8')
          PY

          grep -F "applicationId 'com.jayuminton.admin199'" app/build.gradle >/dev/null
          grep -F 'versionCode 1996' app/build.gradle >/dev/null
          grep -F "versionName '199.6'" app/build.gradle >/dev/null
          grep -F "$ADMIN_DEPLOYMENT_ID" app/src/main/java/com/jayuminton/admin/MainActivity.java >/dev/null
          grep -F 'JayumintonNative/199.6 FreshAdmin/1996' app/src/main/java/com/jayuminton/admin/MainActivity.java >/dev/null
          grep -F 'APK_WEB_BUILD = "1996-verified-admin"' app/src/main/java/com/jayuminton/admin/MainActivity.java >/dev/null
          grep -F 'WebSettings.LOAD_NO_CACHE' app/src/main/java/com/jayuminton/admin/MainActivity.java >/dev/null
          grep -F 'WebStorage.getInstance().deleteAllData();' app/src/main/java/com/jayuminton/admin/MainActivity.java >/dev/null
          grep -F 'webView.clearCache(true);' app/src/main/java/com/jayuminton/admin/MainActivity.java >/dev/null
          grep -F 'webView.clearHistory();' app/src/main/java/com/jayuminton/admin/MainActivity.java >/dev/null
          grep -F 'removeSessionCookies' app/src/main/java/com/jayuminton/admin/MainActivity.java >/dev/null
          grep -F 'private static final int VOICE_VOLUME_STEP = 6;' app/src/main/java/com/jayuminton/admin/MainActivity.java >/dev/null
          grep -F 'setStreamVolume(AudioManager.STREAM_MUSIC, minimumMusic, 0);' app/src/main/java/com/jayuminton/admin/MainActivity.java >/dev/null
          grep -F 'setStreamVolume(AudioManager.STREAM_ALARM, voiceStep, 0);' app/src/main/java/com/jayuminton/admin/MainActivity.java >/dev/null
          grep -F 'android.permission.MODIFY_AUDIO_SETTINGS' app/src/main/AndroidManifest.xml >/dev/null
          grep -F 'android:icon="@drawable/icon"' app/src/main/AndroidManifest.xml >/dev/null
          grep -F '<string name="app_name">자유민턴 관리자</string>' app/src/main/res/values/strings.xml >/dev/null

          # Refuse the two stale deployment IDs that caused previous APK regressions.
          if grep -F 'AKfycbzaExnvUwO1FWcLhXQxUUJyHLXgC7mZHM0Z2T33Z4EvNap3lqHPryOV-FlQ09NJKt48Ww' app/src/main/java/com/jayuminton/admin/MainActivity.java >/dev/null; then
            echo 'Old v199 deployment ID remains in MainActivity' >&2
            exit 1
          fi
          if grep -F 'AKfycbwVgdQG-DXbgxCgd8L11WA57-DCVaOwF4Sc_lktAZZ0yPJSCIosOOKkmKe3oU8a5pfJ7Q' app/src/main/java/com/jayuminton/admin/MainActivity.java >/dev/null; then
            echo 'Old repository deployment ID remains in MainActivity' >&2
            exit 1
          fi

      - name: Restore release signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signing
          base64 --decode signing/jayuminton-release.keystore.b64 > signing/jayuminton-release.jks
          test -s signing/jayuminton-release.jks

      - name: Build signed release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify APK package version signature source and icon
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          test -x "$APKSIGNER"
          test -x "$AAPT"

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner.txt"
          "$AAPT" dump badging "$APK" | tee "$RUNNER_TEMP/badging.txt"
          "$AAPT" dump permissions "$APK" | tee "$RUNNER_TEMP/permissions.txt"

          grep -F "package: name='com.jayuminton.admin199' versionCode='1996' versionName='199.6'" "$RUNNER_TEMP/badging.txt" >/dev/null
          grep -F "application-label:'자유민턴 관리자'" "$RUNNER_TEMP/badging.txt" >/dev/null
          grep -F "uses-permission: name='android.permission.INTERNET'" "$RUNNER_TEMP/permissions.txt" >/dev/null
          grep -F "uses-permission: name='android.permission.MODIFY_AUDIO_SETTINGS'" "$RUNNER_TEMP/permissions.txt" >/dev/null

          unzip -p "$APK" classes.dex > "$RUNNER_TEMP/classes.dex"
          strings "$RUNNER_TEMP/classes.dex" > "$RUNNER_TEMP/classes.strings"
          grep -F "$ADMIN_DEPLOYMENT_ID" "$RUNNER_TEMP/classes.strings" >/dev/null
          grep -F 'JayumintonNative/199.6 FreshAdmin/1996' "$RUNNER_TEMP/classes.strings" >/dev/null
          grep -F '1996-verified-admin' "$RUNNER_TEMP/classes.strings" >/dev/null
          if grep -F 'AKfycbzaExnvUwO1FWcLhXQxUUJyHLXgC7mZHM0Z2T33Z4EvNap3lqHPryOV-FlQ09NJKt48Ww' "$RUNNER_TEMP/classes.strings" >/dev/null; then
            echo 'Old installed-APK deployment ID found in final classes.dex' >&2
            exit 1
          fi
          if grep -F 'AKfycbwVgdQG-DXbgxCgd8L11WA57-DCVaOwF4Sc_lktAZZ0yPJSCIosOOKkmKe3oU8a5pfJ7Q' "$RUNNER_TEMP/classes.strings" >/dev/null; then
            echo 'Old repository deployment ID found in final classes.dex' >&2
            exit 1
          fi

          unzip -p "$APK" res/drawable/icon.png > "$RUNNER_TEMP/final-icon.png"
          test -s "$RUNNER_TEMP/final-icon.png"

          cat > "$RUNNER_TEMP/VerifyIcon.java" <<'JAVA'
          import java.awt.image.BufferedImage;
          import java.io.File;
          import javax.imageio.ImageIO;

          public final class VerifyIcon {
            public static void main(String[] args) throws Exception {
              BufferedImage source = ImageIO.read(new File(args[0]));
              BufferedImage built = ImageIO.read(new File(args[1]));
              if (source == null || built == null) throw new RuntimeException("PNG decode failed");
              if (source.getWidth() != built.getWidth() || source.getHeight() != built.getHeight()) {
                throw new RuntimeException("launcher icon dimensions changed");
              }
              for (int y = 0; y < source.getHeight(); y++) {
                for (int x = 0; x < source.getWidth(); x++) {
                  if (source.getRGB(x, y) != built.getRGB(x, y)) {
                    throw new RuntimeException("launcher icon pixels changed at " + x + "," + y);
                  }
                }
              }
              System.out.println("Launcher icon pixels verified: " + source.getWidth() + "x" + source.getHeight());
            }
          }
          JAVA
          javac "$RUNNER_TEMP/VerifyIcon.java"
          java -cp "$RUNNER_TEMP" VerifyIcon app/src/main/res/drawable/icon.png "$RUNNER_TEMP/final-icon.png"

          SIGNER_SHA=$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {gsub(":", "", $2); print toupper($2); exit}' "$RUNNER_TEMP/apksigner.txt")
          test -n "$SIGNER_SHA"
          if [ "$SIGNER_SHA" = "$OLD_APK_CERT_SHA256" ]; then
            echo 'APK_UPGRADE_COMPATIBLE=yes' >> "$GITHUB_ENV"
          else
            echo 'APK_UPGRADE_COMPATIBLE=no' >> "$GITHUB_ENV"
          fi
          echo "APK_SIGNER_SHA256=$SIGNER_SHA" >> "$GITHUB_ENV"
          sha256sum "$APK" | tee "$RUNNER_TEMP/apk.sha256"
          ls -lh "$APK"

      - name: Save verified APK and status
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p releases deployment/status
          APK_OUT=releases/jayuminton-v199.6-verified.apk
          cp app/build/outputs/apk/release/app-release.apk "$APK_OUT"
          APK_SHA=$(sha256sum "$APK_OUT" | awk '{print $1}')
          ICON_SHA=$(sha256sum app/src/main/res/drawable/icon.png | awk '{print $1}')
          {
            echo 'workflow=Build verified Jayuminton v199.6 APK'
            echo 'status=success'
            echo 'version=199.6'
            echo 'version_code=1996'
            echo 'application_id=com.jayuminton.admin199'
            echo "admin_deployment_id=$ADMIN_DEPLOYMENT_ID"
            echo 'cache_mode=LOAD_NO_CACHE'
            echo 'web_storage=cleared_on_launch'
            echo 'session_cookies=cleared_on_launch'
            echo 'voice_volume_step=6'
            echo 'media_ducking=minimum-then-restored'
            echo 'audio_permission=verified'
            echo 'launcher_label=자유민턴 관리자'
            echo "launcher_icon_sha256=$ICON_SHA"
            echo "apk_sha256=$APK_SHA"
            echo "signer_sha256=$APK_SIGNER_SHA256"
            echo "old_apk_upgrade_compatible=$APK_UPGRADE_COMPATIBLE"
            date -u '+updated_at=%Y-%m-%dT%H:%M:%SZ'
          } > deployment/status/apk-v1996.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jayuminton-v199.6-verified
          path: releases/jayuminton-v199.6-verified.apk
          if-no-files-found: error
          retention-days: 30

      - name: Commit verified APK and verification status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/jayuminton-v199.6-verified.apk deployment/status/apk-v1996.txt
          git commit -m 'Add fully verified Jayuminton v199.6 APK' || exit 0
          git pull --rebase origin main || true
          git push origin main
