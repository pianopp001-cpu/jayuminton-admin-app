name: Inspect live native device path summary

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-live-native-fcm-failure.yml'
      - 'deployment/status/trigger-live-native-device-path.txt'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch only privacy-safe live native path summary
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$RUNNER_TEMP/deploy.json"
          PUSH_DEPLOYMENT_ID="$(jq -r '.pushDeploymentId' "$RUNNER_TEMP/deploy.json")"
          test -n "$PUSH_DEPLOYMENT_ID"
          test "$PUSH_DEPLOYMENT_ID" != "null"
          URL="https://script.google.com/macros/s/$PUSH_DEPLOYMENT_ID/exec?action=native_delivery_summary&run=$GITHUB_RUN_ID"
          curl --fail --location --retry 5 --retry-delay 2 "$URL" -o "$RUNNER_TEMP/native-summary.json"
          jq -e '.ok == true and (.deviceAckHistory | type == "array")' "$RUNNER_TEMP/native-summary.json" >/dev/null
          jq '{
            ok,
            generatedAt,
            totalTokens,
            nativeUserTokens,
            nativeMemberTokens,
            browserTokens,
            newestNativeUserAgeSeconds,
            lastDelivery,
            lastDeviceAck,
            deviceAckHistory:(.deviceAckHistory[-80:] // [])
          }' "$RUNNER_TEMP/native-summary.json" > deployment/status/live-native-device-path-summary.json

          # Reject accidental raw identifiers/tokens: the V2 endpoint is expected
          # to expose only fingerprints and aggregate delivery counters.
          if jq -e '.. | objects | has("memberId") or has("memberName") or has("token")' \
              deployment/status/live-native-device-path-summary.json >/dev/null; then
            echo 'unsafe identifier field found in diagnostic summary' >&2
            exit 1
          fi

      - name: Publish safe live path snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment/status/live-native-device-path-summary.json
          git commit -m 'Record live native device path summary' || true
          git pull --rebase origin main
          git push origin main
