name: Verify current Firebase Hosting v1.2.8 download route

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-hosting-v128-static.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Inspect live Hosting only
        shell: bash
        run: |
          set -euo pipefail
          C="$RUNNER_TEMP/deploy.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$C"
          BASE="$(jq -r '.hostingUrl' "$C")"
          BASE="${BASE%/}"
          EXPECTED="$(sed -n 's/^apk_sha256=//p' deployment/status/user-native-push-v1.2.8.txt | tail -1)"
          test -n "$EXPECTED"

          curl --fail --location --retry 5 -H 'Cache-Control: no-cache, no-store' \
            "$BASE/setup-v205.js?verify=static-check-$GITHUB_RUN_ID" -o "$RUNNER_TEMP/setup.js"
          V128_COUNT="$(grep -Fc 'jayuminton-courtstatus-v1.2.8-repeat-switch.apk' "$RUNNER_TEMP/setup.js" || true)"
          V124_COUNT="$(grep -Fc 'v1.2.4-confirmed-overlay.apk' "$RUNNER_TEMP/setup.js" || true)"
          SAME_ORIGIN_COUNT="$(grep -Fc '/jayuminton-courtstatus-v1.2.8-repeat-switch.apk?build=128-hosting-' "$RUNNER_TEMP/setup.js" || true)"

          APK_HTTP=fail
          APK_HASH=unavailable
          HASH_MATCH=no
          if curl --fail --location --retry 3 -H 'Cache-Control: no-cache, no-store' \
             "$BASE/jayuminton-courtstatus-v1.2.8-repeat-switch.apk?verify=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/apk"; then
            APK_HTTP=ok
            APK_HASH="$(sha256sum "$RUNNER_TEMP/apk" | awk '{print $1}')"
            if [ "$APK_HASH" = "$EXPECTED" ]; then HASH_MATCH=yes; fi
          fi

          cat > deployment/status/user-v128-static-hosting-check.txt <<EOF
          status=success
          version=1.2.8
          live_setup_v128_count=$V128_COUNT
          live_setup_v124_count=$V124_COUNT
          same_origin_v128_count=$SAME_ORIGIN_COUNT
          live_apk_http=$APK_HTTP
          live_apk_hash_match=$HASH_MATCH
          expected_apk_sha256=$EXPECTED
          observed_apk_sha256=$APK_HASH
          admin_logic_changed=no
          checked_at=$(date -u +%FT%TZ)
          EOF
      - name: Publish check
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment/status/user-v128-static-hosting-check.txt
          git commit -m 'Record current Firebase Hosting v1.2.8 route check' || exit 0
          git pull --rebase origin main || true
          git push origin main
