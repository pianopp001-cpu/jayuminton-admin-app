name: Verify current Firebase Hosting v1.2.8 download route

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-hosting-v128-static.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Inspect live Hosting and its current APK target
        shell: bash
        run: |
          set -euo pipefail
          C="$RUNNER_TEMP/deploy.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$C"
          BASE="$(jq -r '.hostingUrl' "$C")"
          BASE="${BASE%/}"
          EXPECTED="$(sed -n 's/^apk_sha256=//p' deployment/status/user-native-push-v1.2.8.txt | tail -1)"
          test -n "$EXPECTED"

          curl --fail --location --retry 5 -H 'Cache-Control: no-cache, no-store' \
            "$BASE/setup-v205.js?verify=target-check-$GITHUB_RUN_ID" -o "$RUNNER_TEMP/setup.js"
          V128_COUNT="$(grep -Fc 'jayuminton-courtstatus-v1.2.8-repeat-switch.apk' "$RUNNER_TEMP/setup.js" || true)"
          V124_COUNT="$(grep -Fc 'v1.2.4-confirmed-overlay.apk' "$RUNNER_TEMP/setup.js" || true)"
          SAME_ORIGIN_COUNT="$(grep -Fc '/jayuminton-courtstatus-v1.2.8-repeat-switch.apk?build=128-hosting-' "$RUNNER_TEMP/setup.js" || true)"

          TARGET="$(sed -n "s/.*const JAYUMINTON_USER_APK_V128 = '\([^']*\)'.*/\1/p" "$RUNNER_TEMP/setup.js" | head -1)"
          test -n "$TARGET"
          TARGET_KIND=other
          case "$TARGET" in
            /jayuminton-courtstatus-v1.2.8-repeat-switch.apk*) TARGET_KIND=same-origin-v128; TARGET="$BASE$TARGET" ;;
            https://raw.githubusercontent.com/*jayuminton-courtstatus-v1.2.8-repeat-switch.apk*) TARGET_KIND=raw-github-v128 ;;
          esac

          TARGET_HTTP=fail
          TARGET_HASH=unavailable
          HASH_MATCH=no
          if curl --fail --location --retry 5 -H 'Cache-Control: no-cache, no-store' "$TARGET" -o "$RUNNER_TEMP/target.apk"; then
            TARGET_HTTP=ok
            TARGET_HASH="$(sha256sum "$RUNNER_TEMP/target.apk" | awk '{print $1}')"
            if [ "$TARGET_HASH" = "$EXPECTED" ]; then HASH_MATCH=yes; fi
          fi

          cat > deployment/status/user-v128-hosting-target-check.txt <<EOF
          status=success
          version=1.2.8
          live_setup_v128_count=$V128_COUNT
          live_setup_v124_count=$V124_COUNT
          same_origin_v128_count=$SAME_ORIGIN_COUNT
          target_kind=$TARGET_KIND
          target_http=$TARGET_HTTP
          target_hash_match=$HASH_MATCH
          expected_apk_sha256=$EXPECTED
          observed_target_sha256=$TARGET_HASH
          admin_logic_changed=no
          checked_at=$(date -u +%FT%TZ)
          EOF
      - name: Publish check
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment/status/user-v128-hosting-target-check.txt
          git commit -m 'Record exact Firebase Hosting v1.2.8 APK target check' || exit 0
          git pull --rebase origin main || true
          git push origin main
