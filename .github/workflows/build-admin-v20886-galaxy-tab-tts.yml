name: Build admin v208.86 Galaxy Tab TTS fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-admin-v20886-galaxy-tab-tts.yml'
      - 'deployment/jayuminton/admin_v20886_galaxy_tab_tts_patch.py'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: jayuminton-admin-v20886-galaxy-tab-tts
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null

      - name: Build native TTS-fixed APK with verified v208.85 web UI
        shell: bash
        run: |
          set -euo pipefail
          BASE='releases/jayuminton-admin-v208.85-restore-kok-total.apk'
          JAVA='app/src/main/java/com/jayuminton/admin/MainActivity.java'
          PATCH='deployment/jayuminton/admin_v20886_galaxy_tab_tts_patch.py'
          HTML='app/src/main/assets/admin/index.html'
          OUT='app/build/outputs/apk/release/app-release.apk'
          BUILD_TOOLS="${ANDROID_HOME}/build-tools/35.0.0"

          test -s "$BASE"
          test -s "$JAVA"
          test -s "$PATCH"
          mkdir -p app/src/main/assets/admin

          # Preserve the exact verified v208.85 web UI/features; only native Android TTS changes.
          unzip -p "$BASE" assets/admin/index.html > "$HTML"
          test -s "$HTML"
          grep -F 'jmAdminRestoreKokTotalV20885' "$HTML" >/dev/null
          grep -F 'jmAdminUniversalUndoV20884' "$HTML" >/dev/null
          grep -F 'jmAdminReplyRepositionV20883' "$HTML" >/dev/null
          grep -F 'jmAdminKokCompactV20882' "$HTML" >/dev/null
          grep -F 'jmAdminFixedQuickMenuV20880' "$HTML" >/dev/null
          grep -F '총 콕개수 0개  완료: 총 0명 (남자: 0명 여자: 0명)' "$HTML" >/dev/null

          python3 "$PATCH" "$JAVA"

          # Native invariants: retry after TTS settings/install and route speech through media.
          grep -F 'JAYUMINTON_GALAXY_TAB_TTS_V20886' "$JAVA" >/dev/null
          grep -F 'private void initTts(boolean force)' "$JAVA" >/dev/null
          grep -F 'private void scheduleTtsRetry()' "$JAVA" >/dev/null
          grep -F 'protected void onResume()' "$JAVA" >/dev/null
          grep -F 'AudioAttributes.USAGE_MEDIA' "$JAVA" >/dev/null
          grep -F 'TextToSpeech.Engine.KEY_PARAM_STREAM, AudioManager.STREAM_MUSIC' "$JAVA" >/dev/null
          ! grep -F 'TextToSpeech.Engine.KEY_PARAM_STREAM, AudioManager.STREAM_ALARM' "$JAVA" >/dev/null

          # Make this installable over the current APK regardless of its native versionCode.
          "$BUILD_TOOLS/aapt" dump badging "$BASE" > "$RUNNER_TEMP/v20886-base-badging.txt"
          BASE_CODE="$(sed -n "s/.*versionCode='\([0-9][0-9]*\)'.*/\1/p" "$RUNNER_TEMP/v20886-base-badging.txt" | sed -n '1p')"
          test -n "$BASE_CODE"
          NEW_CODE=$((BASE_CODE + 1))
          python3 - "$NEW_CODE" <<'PY'
          from pathlib import Path
          import re, sys
          p=Path('app/build.gradle')
          s=p.read_text(encoding='utf-8')
          code=sys.argv[1]
          s,n=re.subn(r'(?m)^\s*versionCode\s+\d+\s*$', f'        versionCode {code}', s, count=1)
          if n!=1: raise SystemExit('versionCode anchor mismatch')
          s,n=re.subn(r"(?m)^\s*versionName\s+'[^']*'\s*$", "        versionName '208.86'", s, count=1)
          if n!=1: raise SystemExit('versionName anchor mismatch')
          p.write_text(s,encoding='utf-8')
          PY

          test -s signing/jayuminton-release.keystore.b64
          base64 --decode signing/jayuminton-release.keystore.b64 > signing/jayuminton-release.jks
          test -s signing/jayuminton-release.jks

          gradle :app:assembleRelease --no-daemon --stacktrace
          test -s "$OUT"
          "$BUILD_TOOLS/apksigner" verify --verbose "$OUT"
          unzip -t "$OUT" >/dev/null

          "$BUILD_TOOLS/aapt" dump badging "$OUT" > "$RUNNER_TEMP/v20886-new-badging.txt"
          grep -F "versionCode='$NEW_CODE'" "$RUNNER_TEMP/v20886-new-badging.txt" >/dev/null
          grep -F "versionName='208.86'" "$RUNNER_TEMP/v20886-new-badging.txt" >/dev/null

          unzip -p "$OUT" assets/admin/index.html > "$RUNNER_TEMP/v20886-html"
          grep -F 'jmAdminRestoreKokTotalV20885' "$RUNNER_TEMP/v20886-html" >/dev/null
          grep -F 'jmAdminUniversalUndoV20884' "$RUNNER_TEMP/v20886-html" >/dev/null
          grep -F 'jmAdminReplyRepositionV20883' "$RUNNER_TEMP/v20886-html" >/dev/null
          grep -F 'jmAdminKokCompactV20882' "$RUNNER_TEMP/v20886-html" >/dev/null
          grep -F '총 콕개수 0개  완료: 총 0명 (남자: 0명 여자: 0명)' "$RUNNER_TEMP/v20886-html" >/dev/null
          grep -F 'function installThreeStepUndo()' "$RUNNER_TEMP/v20886-html" >/dev/null

          # Avoid unzip/strings/grep SIGPIPE under pipefail: materialize before checking.
          unzip -p "$OUT" classes.dex > "$RUNNER_TEMP/v20886-classes.dex"
          strings "$RUNNER_TEMP/v20886-classes.dex" > "$RUNNER_TEMP/v20886-dex-strings.txt"
          grep -F 'JAYUMINTON_GALAXY_TAB_TTS_V20886' "$RUNNER_TEMP/v20886-dex-strings.txt" >/dev/null

          SHA="$(sha256sum "$OUT" | awk '{print $1}')"
          echo "APK_PATH=$OUT" >> "$GITHUB_ENV"
          echo "APK_SHA256=$SHA" >> "$GITHUB_ENV"
          echo "BASE_VERSION_CODE=$BASE_CODE" >> "$GITHUB_ENV"
          echo "NEW_VERSION_CODE=$NEW_CODE" >> "$GITHUB_ENV"

      - name: Publish v208.86 APK
        shell: bash
        run: |
          set -euo pipefail
          test -s "$APK_PATH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          mkdir -p releases deployment/status
          cp "$APK_PATH" releases/jayuminton-admin-v208.86-galaxy-tab-tts.apk
          printf 'status=success\nversion=208.86\nbase=v208.85-restore-kok-total\nfeature=galaxy-tab-tts-reinit-and-media-routing\nbase_version_code=%s\nnew_version_code=%s\nrun_id=%s\nsha256=%s\n' "$BASE_VERSION_CODE" "$NEW_VERSION_CODE" "$GITHUB_RUN_ID" "$APK_SHA256" > deployment/status/v20886-galaxy-tab-tts.txt
          git add releases/jayuminton-admin-v208.86-galaxy-tab-tts.apk deployment/status/v20886-galaxy-tab-tts.txt
          git commit -m 'Publish admin v208.86: Galaxy Tab TTS fix' || exit 0
          git push origin HEAD:main
