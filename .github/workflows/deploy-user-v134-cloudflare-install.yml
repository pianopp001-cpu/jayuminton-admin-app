name: Deploy verified user v1.3.4 APK to Cloudflare install URL

on:
  push:
    branches: [fix/user-native-separate-package-v1]
    paths:
      - '.github/workflows/deploy-user-v134-cloudflare-install.yml'
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read

jobs:
  deploy-install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ARTIFACT_ID: '9461153871'
      WORKER_NAME: jayuminton-user-install
      INSTALL_URL: https://jayuminton-user-install.pianopp001.workers.dev
      APK_NAME: jayuminton-user-v1.3.4.apk

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install wrangler
        run: npm install --global wrangler@latest

      - name: Download already verified APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/artifact" "$RUNNER_TEMP/site"
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > "$RUNNER_TEMP/artifact.zip"
          unzip -q "$RUNNER_TEMP/artifact.zip" -d "$RUNNER_TEMP/artifact"
          test -s "$RUNNER_TEMP/artifact/jayuminton-user-v1.3.4.apk"
          cp "$RUNNER_TEMP/artifact/jayuminton-user-v1.3.4.apk" "$RUNNER_TEMP/site/$APK_NAME"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$RUNNER_TEMP/site/$APK_NAME" > "$RUNNER_TEMP/badging.txt"
          grep -F "package: name='com.jayuminton.user' versionCode='134' versionName='1.3.4'" "$RUNNER_TEMP/badging.txt" >/dev/null

      - name: Build Cloudflare install worker with static APK asset
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/install-worker"
          mkdir -p "$ROOT/public"
          cp "$RUNNER_TEMP/site/$APK_NAME" "$ROOT/public/$APK_NAME"
          cat > "$ROOT/public/index.html" <<EOF
          <!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>자유민턴 사용자 앱 설치</title></head><body style="font-family:sans-serif;padding:24px"><h2>자유민턴 사용자 앱 v1.3.4</h2><p>Cloudflare 사용자 웹 연결 검증본</p><p><a href="/$APK_NAME" download style="font-size:20px">사용자 앱 APK 다운로드</a></p></body></html>
          EOF
          cat > "$ROOT/worker.js" <<'EOF'
          export default { async fetch(request, env) { return env.ASSETS.fetch(request); } };
          EOF
          cat > "$ROOT/wrangler.toml" <<EOF
          name = "$WORKER_NAME"
          main = "worker.js"
          compatibility_date = "2026-08-21"
          workers_dev = true
          [assets]
          directory = "./public"
          binding = "ASSETS"
          EOF
          cd "$ROOT"
          wrangler deploy --config wrangler.toml

      - name: Verify stable Cloudflare APK download
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          curl --fail --location --retry 6 --retry-delay 2 --max-time 60 "$INSTALL_URL/$APK_NAME?verify=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/downloaded.apk"
          test -s "$RUNNER_TEMP/downloaded.apk"
          LOCAL_SHA="$(sha256sum "$RUNNER_TEMP/site/$APK_NAME" | awk '{print $1}')"
          LIVE_SHA="$(sha256sum "$RUNNER_TEMP/downloaded.apk" | awk '{print $1}')"
          test "$LOCAL_SHA" = "$LIVE_SHA"
          echo "INSTALL_PAGE=$INSTALL_URL/"
          echo "APK_URL=$INSTALL_URL/$APK_NAME"
          echo "APK_SHA256=$LIVE_SHA"
