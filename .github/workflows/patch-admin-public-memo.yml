name: Patch admin public memo

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch_admin_public_memo_v1.py'
      - 'deploy-triggers/admin-public-memo-v1.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply admin public memo patch
        run: python scripts/patch_admin_public_memo_v1.py
      - name: Commit patched source
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source-snapshot/current-main/Script.html source-snapshot/current-main/Style.html
          git commit -m "fix: show user public memo on every admin card"
          git push
