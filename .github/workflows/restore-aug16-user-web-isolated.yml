name: Restore Aug 16 working user web as isolated URL

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-aug16-user-web-isolated.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: jayuminton-aug16-user-web-isolated
  cancel-in-progress: false

jobs:
  restore-user-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      SAFE_VERSION: '327'
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install clasp
        run: npm install --global @google/clasp@latest
      - name: Create isolated URL from Aug 16 known-working version
        shell: bash
        run: |
          set -euo pipefail
          CONFIG="$RUNNER_TEMP/deploy.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$CONFIG"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          SCRIPT_ID="$(jq -r '.mainScriptId' "$CONFIG")"
          ADMIN_ID="$(jq -r '.mainDeploymentId' "$CONFIG")"
          test -n "$SCRIPT_ID"; test "$SCRIPT_ID" != null
          test -n "$ADMIN_ID"; test "$ADMIN_ID" != null
          WORK="$RUNNER_TEMP/aug16-user"
          mkdir -p "$WORK"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$SCRIPT_ID" > "$WORK/.clasp.json"
          cd "$WORK"
          BEFORE="$(clasp deployments)"
          printf '%s\n' "$BEFORE" | grep -F "$ADMIN_ID" >/dev/null
          OUTPUT="$(clasp create-deployment --versionNumber "$SAFE_VERSION" --description "isolated user restore Aug16 v$SAFE_VERSION ${GITHUB_RUN_ID}")"
          printf '%s\n' "$OUTPUT"
          USER_ID="$(printf '%s\n' "$OUTPUT" | sed -n 's/.*\(AKfy[a-zA-Z0-9_-]*\).*/\1/p' | head -1)"
          test -n "$USER_ID"
          test "$USER_ID" != "$ADMIN_ID"
          AFTER="$(clasp deployments)"
          printf '%s\n' "$AFTER" | grep -F "$ADMIN_ID" >/dev/null
          printf '%s\n' "$AFTER" | grep -F "$USER_ID" >/dev/null
          URL="https://script.google.com/macros/s/$USER_ID/exec"
          sleep 7
          CODE="$(curl -L -sS --retry 5 --retry-delay 2 --max-time 60 -o "$RUNNER_TEMP/live.html" -w '%{http_code}' "$URL?mode=user&app=user&restore=aug16" || true)"
          test "$CODE" = 200
          ! grep -Eqi 'Google Drive|unable to open|파일을 열 수|요청한 파일|Sorry, unable to open' "$RUNNER_TEMP/live.html"
          {
            echo "KNOWN_WORKING_VERSION=$SAFE_VERSION"
            echo "USER_DEPLOYMENT_ID=$USER_ID"
            echo "USER_URL=$URL"
            echo "SOURCE_PUSH=no"
            echo "EXISTING_ADMIN_DEPLOYMENT_MODIFIED=no"
            echo "HTTP=$CODE"
          } | tee "$RUNNER_TEMP/aug16-user-url.txt"
          echo "::notice title=Aug 16 restored user URL::$URL"
      - name: Upload verified URL record
        uses: actions/upload-artifact@v4
        with:
          name: aug16-working-user-url-${{ github.run_id }}
          path: ${{ runner.temp }}/aug16-user-url.txt
          retention-days: 30
