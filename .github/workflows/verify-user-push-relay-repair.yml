name: Verify user push relay repair
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-user-push-relay-repair.yml'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JAYUMINTON_PUSH_APPS_SCRIPT_URL: ${{ secrets.JAYUMINTON_PUSH_APPS_SCRIPT_URL }}
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --global @google/clasp@latest
      - name: Atomically synchronize main and relay push auth
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$RUNNER_TEMP/deploy.json"
          MAIN_SID="$(jq -r '.mainScriptId // empty' "$RUNNER_TEMP/deploy.json")"
          MAIN_DID="$(jq -r '.mainDeploymentId // empty' "$RUNNER_TEMP/deploy.json")"
          RELAY_DID="$(python3 - <<'PY'
          import os,re
          m=re.search(r'/macros/s/([^/]+)/exec', os.environ.get('JAYUMINTON_PUSH_APPS_SCRIPT_URL',''))
          print(m.group(1) if m else '')
          PY
          )"
          test -n "$MAIN_SID"; test -n "$MAIN_DID"; test -n "$RELAY_DID"

          # Find the existing relay Apps Script project by its still-live deployment ID.
          clasp list > "$RUNNER_TEMP/projects.txt"
          : > "$RUNNER_TEMP/relay-sid.txt"
          while IFS= read -r line; do
            SID="$(printf '%s' "$line" | grep -oE '[A-Za-z0-9_-]{30,}' | tail -1 || true)"
            [ -n "$SID" ] || continue
            W="$RUNNER_TEMP/check-$RANDOM"; mkdir -p "$W"
            printf '{"scriptId":"%s","rootDir":"."}\n' "$SID" > "$W/.clasp.json"
            if (cd "$W" && clasp deployments) > "$W/deployments.txt" 2>/dev/null && grep -F "$RELAY_DID" "$W/deployments.txt" >/dev/null; then
              printf '%s' "$SID" > "$RUNNER_TEMP/relay-sid.txt"
              break
            fi
          done < "$RUNNER_TEMP/projects.txt"
          test -s "$RUNNER_TEMP/relay-sid.txt"
          RELAY_SID="$(cat "$RUNNER_TEMP/relay-sid.txt")"

          MAIN="$RUNNER_TEMP/main"; RELAY="$RUNNER_TEMP/relay"
          mkdir -p "$MAIN" "$RELAY"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$MAIN_SID" > "$MAIN/.clasp.json"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$RELAY_SID" > "$RELAY/.clasp.json"
          (cd "$MAIN" && clasp pull >/dev/null)
          (cd "$RELAY" && clasp pull >/dev/null)
          MAIN_CODE="$(find "$MAIN" -maxdepth 1 -type f \( -name 'Code.js' -o -name 'Code.gs' \) | head -1)"
          RELAY_CODE="$(find "$RELAY" -maxdepth 1 -type f \( -name 'Code.js' -o -name 'Code.gs' \) | head -1)"
          test -n "$MAIN_CODE"; test -n "$RELAY_CODE"

          KEY="$(openssl rand -hex 32)"
          test "${#KEY}" -eq 64
          python3 deployment/scripts/patch_live_admin_production_push.py \
            "$MAIN_CODE" "$RELAY_CODE" "$JAYUMINTON_PUSH_APPS_SCRIPT_URL" "$KEY"
          grep -F 'JAYUMINTON_SERVER_STATE_PUSH_V1' "$MAIN_CODE" >/dev/null
          grep -F "action === 'main_state_event'" "$RELAY_CODE" >/dev/null
          grep -F "type: 'wait1_ready'" "$MAIN_CODE" >/dev/null
          grep -F "type: 'court_assignment'" "$MAIN_CODE" >/dev/null

          # Preserve the existing relay project/token properties and only update source + same deployments.
          (cd "$RELAY" && clasp push --force >/dev/null)
          (cd "$RELAY" && clasp create-deployment --deploymentId "$RELAY_DID" --description "atomic wait1 relay auth repair $GITHUB_RUN_ID" >/dev/null)
          (cd "$MAIN" && clasp push --force >/dev/null)
          (cd "$MAIN" && clasp create-deployment --deploymentId "$MAIN_DID" --description "atomic main push auth repair $GITHUB_RUN_ID" >/dev/null)

          sleep 6
          PAYLOAD="{\"action\":\"main_state_event\",\"internalKey\":\"$KEY\",\"type\":\"wait1_ready\",\"assignmentId\":\"verify-$GITHUB_RUN_ID\",\"expectedCourtNo\":1,\"members\":[{\"id\":\"__diag_nonexistent_member__\",\"name\":\"DIAG\"}]}"
          curl -sS -D "$RUNNER_TEMP/h" -o "$RUNNER_TEMP/first" -X POST --data-urlencode "payload=$PAYLOAD" "$JAYUMINTON_PUSH_APPS_SCRIPT_URL"
          LOC="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]*:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' "$RUNNER_TEMP/h")"
          if [ -n "$LOC" ]; then curl -sS -o "$RUNNER_TEMP/final" "$LOC"; else cp "$RUNNER_TEMP/first" "$RUNNER_TEMP/final"; fi
          RESULT="$(python3 - "$RUNNER_TEMP/final" <<'PY'
          import json,sys
          try:j=json.load(open(sys.argv[1],encoding='utf-8'))
          except Exception:j={}
          print('success' if j.get('ok') is True and j.get('sent') in (0,'0',None) else 'failed')
          PY
          )"
          mkdir -p deployment/status
          printf 'relay_repair=%s\nverification=fake-member-zero-delivery\nstrategy=atomic-main-relay-key-sync\nrun_id=%s\n' "$RESULT" "$GITHUB_RUN_ID" > deployment/status/user-push-relay-repair.txt
          test "$RESULT" = success
      - name: Record result
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+users.noreply.github.com'
          git add deployment/status/user-push-relay-repair.txt || true
          git commit -m 'Record user push relay repair verification' || exit 0
          git pull --rebase origin main || true
          git push origin main
# atomic main+relay auth repair trigger 2026-08-21
