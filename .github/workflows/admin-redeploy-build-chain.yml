name: Redeploy admin Cloudflare only

# v203 recovery trigger 2026-08-25
# rerun after disabling legacy GAS/v199.6 workflows
# observed rerun: record result through record-cloudflare-recovery-results.yml
# shared temp-pair server-state redeploy trigger 2026-08-26
# shared temp-pair verified redeploy trigger 2026-08-26 09:28 KST
# hardened shared temp-pair frontend redeploy trigger 2026-08-26 09:55 KST
# server-authoritative tempPairs redeploy trigger 2026-08-26 14:05 KST
on:
  push:
    branches: [main]
    paths:
      - 'deployment/jayuminton/admin_cloudflare_post_contract_patch.py'
      - '.github/workflows/deploy-cloudflare-admin-save-lock-memo.yml'
      - '.github/workflows/admin-redeploy-build-chain.yml'
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read

jobs:
  redeploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Deploy Cloudflare-only admin and wait
        shell: bash
        run: |
          set -euo pipefail
          WF='deploy-cloudflare-admin-save-lock-memo.yml'
          old="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$WF" --branch main --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          gh workflow run "$WF" --repo "$GITHUB_REPOSITORY" --ref main
          run_id=''
          for i in $(seq 1 90); do
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$WF" --branch main --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
            if [ "$run_id" != "0" ] && [ "$run_id" != "$old" ]; then break; fi
            sleep 2
          done
          test -n "$run_id"; test "$run_id" != "0"; test "$run_id" != "$old"
          echo "CLOUDFLARE_ADMIN_RUN_ID=$run_id"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
      - name: Confirm no GAS deployment path
        run: echo 'ADMIN_CLOUDFLARE_ONLY_REDEPLOY_OK'
