name: Kick v200.1 Cloudflare UI cleanup APK rebuild

# PR-merge rerun marker: alert-v19-empty-transition-fast-save
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kick-v2001-ui-fix.yml'
      - '.github/workflows/preview-admin-cloudflare.yml'
      - '.github/workflows/build-v1995-direct.yml'
      - 'deployment/jayuminton/admin_cloudflare_final_contract.py'
      - 'deployment/jayuminton/admin_cloudflare_post_contract_patch.py'
      - 'deployment/jayuminton/admin_finish_alert_v12_patch.py'
      - 'deployment/jayuminton/apply_admin_vnext_patches.py'
      - 'deployment/jayuminton/admin_vnext_fast_save_patch.py'
      - 'deployment/jayuminton/admin_vnext_badge_cleanup_patch.py'
      - 'deployment/jayuminton/admin_vnext_empty_court_patch.py'
      - 'deployment/jayuminton/admin_vnext_transition_alert_patch.py'
      - 'deployment/jayuminton/admin_vnext_notification_contract_test.py'
  workflow_dispatch: {}
permissions:
  actions: write
  contents: write
concurrency:
  group: jayuminton-v2001-ui-apk-orchestrator
  cancel-in-progress: true
jobs:
  kick:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PREVIEW_WORKFLOW: preview-admin-cloudflare.yml
      LIVE_URL: https://jayuminton-push--admin-cloudflare-vnext-z3bgvi2g.web.app/
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - name: Record v19 orchestrator start
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deployment/status
          printf 'started=%s\nsource_commit=%s\nkick_run=%s\nstate=started\ncontract=alert-v19-empty-transition-fast-save\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_SHA" "$GITHUB_RUN_ID" > deployment/status/v2001-kick-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment/status/v2001-kick-status.txt
          git commit -m 'Record v200.1 alert v19 rebuild start'
          git pull --rebase origin main
          git push origin main
      - name: Dispatch Cloudflare admin redeploy
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          DISPATCHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "PREVIEW_DISPATCHED_AT=$DISPATCHED_AT" >> "$GITHUB_ENV"
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/$PREVIEW_WORKFLOW/dispatches" \
            -d '{"ref":"main"}'
      - name: Resolve dispatched preview run
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID=''
          for i in $(seq 1 30); do
            JSON="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/$PREVIEW_WORKFLOW/runs?event=workflow_dispatch&branch=main&per_page=20")"
            RUN_ID="$(printf '%s' "$JSON" | jq -r --arg t "$PREVIEW_DISPATCHED_AT" '[.workflow_runs[] | select(.created_at >= $t)] | sort_by(.created_at) | last | .id // empty')"
            if [ -n "$RUN_ID" ]; then break; fi
            sleep 2
          done
          test -n "$RUN_ID"
          echo "PREVIEW_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "Resolved preview run: $RUN_ID"
      - name: Wait for actual preview run and fail fast with failed steps
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 180); do
            RUN_JSON="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$PREVIEW_RUN_ID")"
            STATUS="$(printf '%s' "$RUN_JSON" | jq -r '.status')"
            CONCLUSION="$(printf '%s' "$RUN_JSON" | jq -r '.conclusion // ""')"
            echo "preview_run=$PREVIEW_RUN_ID status=$STATUS conclusion=$CONCLUSION"
            if [ "$STATUS" = completed ]; then
              if [ "$CONCLUSION" != success ]; then
                echo 'Cloudflare preview failed; dumping job/step summary:' >&2
                curl --fail --silent --show-error \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  -H 'Accept: application/vnd.github+json' \
                  -H 'X-GitHub-Api-Version: 2022-11-28' \
                  "https://api.github.com/repos/${{ github.repository }}/actions/runs/$PREVIEW_RUN_ID/jobs?per_page=100" \
                  | jq -r '.jobs[] | "JOB \(.name): \(.conclusion)\n" + ([.steps[] | select(.conclusion != "success" and .conclusion != "skipped") | "  STEP \(.number) \(.name): \(.conclusion)"] | join("\n"))' >&2
                exit 1
              fi
              exit 0
            fi
            sleep 10
          done
          echo 'Timed out waiting for actual Cloudflare preview run.' >&2
          exit 1
      - name: Verify live v19 admin contract
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            curl --fail --location --silent --show-error "$LIVE_URL?alertV19=$GITHUB_RUN_ID-$i" -o "$RUNNER_TEMP/live.html" || true
            if grep -F 'jayuminton-admin-finish-alert-v19' "$RUNNER_TEMP/live.html" >/dev/null 2>&1 \
              && grep -F '__JAYUMINTON_ADMIN_FINISH_ALERT_V19__' "$RUNNER_TEMP/live.html" >/dev/null 2>&1 \
              && grep -F '__JAYUMINTON_TRANSITION_ALERT__' "$RUNNER_TEMP/live.html" >/dev/null 2>&1 \
              && grep -F 'transitionAlertBridge:true' "$RUNNER_TEMP/live.html" >/dev/null 2>&1 \
              && grep -F 'emptyCourtAllowed:true' "$RUNNER_TEMP/live.html" >/dev/null 2>&1 \
              && grep -F '__JAYUMINTON_ADMIN_EMPTY_COURT_FINISH_V1__' "$RUNNER_TEMP/live.html" >/dev/null 2>&1 \
              && grep -F '__JAYUMINTON_ADMIN_TRANSITION_ALERT_BRIDGE_V1__' "$RUNNER_TEMP/live.html" >/dev/null 2>&1 \
              && grep -F 'vibrationSets:8' "$RUNNER_TEMP/live.html" >/dev/null 2>&1 \
              && grep -F 'vibrationsPerSet:3' "$RUNNER_TEMP/live.html" >/dev/null 2>&1 \
              && grep -F 'cancelOnAlertDismiss:true' "$RUNNER_TEMP/live.html" >/dev/null 2>&1 \
              && grep -F 'alertBeforeServerCompletion:true' "$RUNNER_TEMP/live.html" >/dev/null 2>&1 \
              && grep -F '__JAYUMINTON_ADMIN_FAST_SAVE_CLIENT_V1__' "$RUNNER_TEMP/live.html" >/dev/null 2>&1 \
              && grep -F '__JAYUMINTON_ADMIN_STATISTICS_NO_CLIP_FINAL__' "$RUNNER_TEMP/live.html" >/dev/null 2>&1 \
              && grep -F '__JAYUMINTON_ADMIN_BLOCKING_SAVE__' "$RUNNER_TEMP/live.html" >/dev/null 2>&1 \
              && ! grep -F 'adminVoiceTestButton' "$RUNNER_TEMP/live.html" >/dev/null 2>&1 \
              && ! grep -F '>음성테스트<' "$RUNNER_TEMP/live.html" >/dev/null 2>&1 \
              && ! grep -F 'NEW <small>신규</small>' "$RUNNER_TEMP/live.html" >/dev/null 2>&1; then
              echo 'Alert-v19 Cloudflare admin is live and verified.'
              exit 0
            fi
            sleep 5
          done
          echo 'Preview run succeeded but live v19 HTML contract did not appear.' >&2
          exit 1
      - name: Dispatch fresh-install APK build
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/build-v1995-direct.yml/dispatches \
            -d '{"ref":"main"}'
          echo 'Fresh APK build dispatched after v19 preview run + live HTML verification.'