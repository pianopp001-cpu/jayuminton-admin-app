name: Kick v200.1 Cloudflare UI cleanup APK rebuild
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kick-v2001-ui-fix.yml'
  workflow_dispatch: {}
permissions:
  actions: write
  contents: read
jobs:
  kick:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for cleaned Cloudflare admin frontend
        shell: bash
        run: |
          set -euo pipefail
          URL='https://jayuminton-push--admin-cloudflare-vnext-z3bgvi2g.web.app/'
          for i in $(seq 1 60); do
            curl --fail --location --silent --show-error "$URL?uiFix=$GITHUB_RUN_ID-$i" -o "$RUNNER_TEMP/live.html" || true
            if grep -F '__JAYUMINTON_ADMIN_VOICE_TEST_REMOVED__' "$RUNNER_TEMP/live.html" >/dev/null 2>&1 \
              && grep -F '__JAYUMINTON_ADMIN_NEW_BADGE_KO__' "$RUNNER_TEMP/live.html" >/dev/null 2>&1; then
              echo 'Clean Cloudflare admin is live.'
              exit 0
            fi
            sleep 10
          done
          echo 'Timed out waiting for cleaned Cloudflare admin.' >&2
          exit 1
      - name: Dispatch fresh-install APK build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/build-v1995-direct.yml/dispatches \
            -d '{"ref":"main"}'
          echo 'Fresh APK build dispatched.'
