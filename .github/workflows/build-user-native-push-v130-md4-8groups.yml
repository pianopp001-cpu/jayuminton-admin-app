name: Build v1.3.0 MD4 eight-group user APK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-user-native-push-v130-md4-8groups.yml'
      - 'deployment/scripts/patch_build_user_native_v130_md4_8groups.py'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: jayuminton-user-native-v130-md4-8groups
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.7'}
      - run: npm install --global firebase-tools@latest @google/clasp@latest
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      - name: Resolve config and Firebase user app
        shell: bash
        run: |
          set -euo pipefail
          C="$RUNNER_TEMP/deploy.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$C"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          MAIN_DEPLOYMENT_ID="$(jq -r '.mainDeploymentId' "$C")"
          PUSH_URL="$(jq -r '.pushUrl' "$C")"
          PUSH_SCRIPT_ID="$(jq -r '.pushScriptId' "$C")"
          FIREBASE_PROJECT_ID="$(jq -r '.firebaseProjectId' "$C")"
          for value in "$MAIN_DEPLOYMENT_ID" "$PUSH_URL" "$PUSH_SCRIPT_ID" "$FIREBASE_PROJECT_ID"; do test -n "$value"; test "$value" != null; done
          { echo "MAIN_DEPLOYMENT_ID=$MAIN_DEPLOYMENT_ID"; echo "PUSH_URL=$PUSH_URL"; echo "PUSH_SCRIPT_ID=$PUSH_SCRIPT_ID"; echo "FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID"; } >> "$GITHUB_ENV"
          PACKAGE='com.jayuminton.user'
          firebase apps:list ANDROID --project "$FIREBASE_PROJECT_ID" --json > "$RUNNER_TEMP/apps.json"
          APP_ID="$(jq -r --arg pkg "$PACKAGE" '[.. | objects | select(((.packageName? == $pkg) or (.package_name? == $pkg) or (.androidClientInfo?.packageName? == $pkg)) and ((.appId? // .app_id?) != null)) | (.appId? // .app_id?)] | first // empty' "$RUNNER_TEMP/apps.json")"
          test -n "$APP_ID"
          firebase apps:sdkconfig ANDROID "$APP_ID" --project "$FIREBASE_PROJECT_ID" > app/google-services.json
          grep -F 'com.jayuminton.user' app/google-services.json >/dev/null
      - name: Build v1.3.0
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT='deployment/scripts/build_user_native_push_fresh_v110.sh'
          python3 deployment/scripts/patch_build_user_native_v111.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v112.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v113.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v114.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v115.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v116.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v117.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v118.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v119.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v120_diagnostic.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v121.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v122.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v124_confirmed_overlay.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v126_stop_controller.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v126_raceguard.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v127_member_switch.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v128_repeat_switch.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v130_md4_8groups.py "$SCRIPT"
          grep -F 'VERSION="1.3.0"' "$SCRIPT" >/dev/null
          grep -F 'VERSION_CODE="130"' "$SCRIPT" >/dev/null
          grep -F 'private static final int MAX_GROUPS = 8;' "$SCRIPT" >/dev/null
          grep -F 'if (groupsPlayed >= MAX_GROUPS)' "$SCRIPT" >/dev/null
          bash "$SCRIPT"
          test -s releases/jayuminton-courtstatus-v1.3.0-md4-8groups.apk
          test -s deployment/status/user-native-push-v1.3.0.txt
          grep -F 'status=success' deployment/status/user-native-push-v1.3.0.txt >/dev/null
          grep -F 'version=1.3.0' deployment/status/user-native-push-v1.3.0.txt >/dev/null
          grep -F 'version_code=130' deployment/status/user-native-push-v1.3.0.txt >/dev/null
          cp releases/jayuminton-courtstatus-v1.3.0-md4-8groups.apk "$RUNNER_TEMP/v130.apk"
          cp deployment/status/user-native-push-v1.3.0.txt "$RUNNER_TEMP/v130-status.txt"
      - name: Publish verified v1.3.0
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          cp "$RUNNER_TEMP/v130.apk" releases/jayuminton-courtstatus-v1.3.0-md4-8groups.apk
          cp "$RUNNER_TEMP/v130-status.txt" deployment/status/user-native-push-v1.3.0.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/jayuminton-courtstatus-v1.3.0-md4-8groups.apk deployment/status/user-native-push-v1.3.0.txt
          git commit -m 'Publish v1.3.0 MD4 eight-group user APK' || exit 0
          git pull --rebase origin main || true
          git push origin main
