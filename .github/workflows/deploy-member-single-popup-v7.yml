name: Deploy member original popup no memo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-member-single-popup-v7.yml'
      - 'deployment/jayuminton/patch_member_self_longpress_v6.py'
      - 'deployment/jayuminton/patch_team_visuals_v6.py'
      - 'deployment/jayuminton/remove_member_team_text_creators.py'
      - 'deployment/jayuminton/v130_firebase_member_preview.py'
      - 'deployment/jayuminton/patch_member_login_recovery_addons.py'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: jayuminton-unified-member-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      LIVE_USER_URL: https://jayuminton-push.web.app/
      CLOUDFLARE_RPC_URL: https://shy-morning-f0e4.pianopp001.workers.dev/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Authenticate Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      - name: Install Firebase CLI
        run: npm install --global firebase-tools@latest
      - name: Resolve Firebase project
        shell: bash
        run: |
          set -euo pipefail
          CONFIG="$RUNNER_TEMP/deploy.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$CONFIG"
          FIREBASE_PROJECT_ID="$(jq -r '.firebaseProjectId // empty' "$CONFIG")"
          test -n "$FIREBASE_PROJECT_ID"
          echo "FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID" >> "$GITHUB_ENV"
      - name: Preserve production page remove memo popup and apply shared team visuals
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/member-original-popup"
          PUBLIC="$ROOT/public"
          mkdir -p "$PUBLIC"
          curl --fail --location --retry 5 --max-time 60 -H 'Cache-Control: no-cache, no-store' "$LIVE_USER_URL?teamLines=$GITHUB_RUN_ID" -o "$PUBLIC/index.html"

          if ! grep -F 'function initialize()' "$PUBLIC/index.html" >/dev/null || ! grep -F 'function server(name, args)' "$PUBLIC/index.html" >/dev/null; then
            SOURCE_COMMIT=c41ab20
            WORK="$RUNNER_TEMP/member-login-recovery-source"
            mkdir -p "$WORK"
            for file in Index.html Style.html Script.html; do
              git show "$SOURCE_COMMIT:source-snapshot/current-main/$file" > "$WORK/$file"
            done
            python3 deployment/jayuminton/v130_firebase_member_preview.py \
              build-frontend --work "$WORK" --out "$PUBLIC" --rpc-url "$CLOUDFLARE_RPC_URL"
          fi

          python3 deployment/jayuminton/patch_member_login_recovery_addons.py "$PUBLIC/index.html"
          python3 deployment/jayuminton/patch_member_self_longpress_v6.py "$PUBLIC/index.html"
          python3 deployment/jayuminton/remove_member_team_text_creators.py "$PUBLIC/index.html"
          python3 deployment/jayuminton/patch_team_visuals_v6.py "$PUBLIC/index.html"
          grep -F 'function initialize()' "$PUBLIC/index.html" >/dev/null
          grep -F 'function server(name, args)' "$PUBLIC/index.html" >/dev/null
          grep -F 'function memberLogin()' "$PUBLIC/index.html" >/dev/null
          grep -F "'getMemberPasswordVersion'" "$PUBLIC/index.html" >/dev/null
          grep -F "'verifyMemberPassword'" "$PUBLIC/index.html" >/dev/null
          grep -F "'resumeMemberSession'" "$PUBLIC/index.html" >/dev/null
          grep -F 'memberPreviewLoginButton' "$PUBLIC/index.html" >/dev/null
          grep -F "$CLOUDFLARE_RPC_URL" "$PUBLIC/index.html" >/dev/null
          ! grep -F 'JAYUMINTON_MD7_SINGLE_ACTION_POPUP_V1' "$PUBLIC/index.html"
          ! grep -F 'jayuminton-md7-single-action-popup' "$PUBLIC/index.html"
          ! grep -F 'jayuminton-member-self-profile-edit-v1' "$PUBLIC/index.html"
          ! grep -F 'JAYUMINTON_MEMBER_SELF_MEMO_ONLY_V2' "$PUBLIC/index.html"
          ! grep -F 'JAYUMINTON_MEMBER_TEAM_STATUS_BADGES_V1' "$PUBLIC/index.html"
          ! grep -F 'JAYUMINTON_MEMBER_TEAM_ONLY_BADGES_V2' "$PUBLIC/index.html"
          grep -F 'JAYUMINTON_TEAM_VISUALS_V8' "$PUBLIC/index.html" >/dev/null
          grep -F '#memberApp [data-member-id].jm-has-team' "$PUBLIC/index.html" >/dev/null
          grep -F 'border:2px solid var(--jm-team-color' "$PUBLIC/index.html" >/dev/null
          grep -F '0 0 0 2px rgba(255,255,255' "$PUBLIC/index.html" >/dev/null
          grep -F '0 0 0 4px var(--jm-team-color' "$PUBLIC/index.html" >/dev/null
          grep -F 'card.style.setProperty('"'"'--jm-team-color'"'"',colorFor(label))' "$PUBLIC/index.html" >/dev/null
          ! grep -F 'box-shadow:inset 4px 0 0 var(--jm-team-color)' "$PUBLIC/index.html" >/dev/null
          ! grep -F 'outline:1px solid var(--jm-team-color' "$PUBLIC/index.html" >/dev/null
          ! grep -F 'outline-offset:-5px' "$PUBLIC/index.html" >/dev/null
          grep -F '#memberApp [data-member-id].jm-temp-pair' "$PUBLIC/index.html" >/dev/null
          python3 - "$PUBLIC/index.html" "$RUNNER_TEMP/member-original-popup-inline.js" <<'PY'
          from pathlib import Path
          import re, sys
          source=Path(sys.argv[1]).read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',source,flags=re.I)
          Path(sys.argv[2]).write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check "$RUNNER_TEMP/member-original-popup-inline.js"
          cat > "$ROOT/firebase.json" <<'JSON'
          {"hosting":{"public":"public","ignore":["firebase.json","**/.*","**/node_modules/**"],"headers":[{"source":"/**","headers":[{"key":"Cache-Control","value":"no-store, no-cache, must-revalidate, max-age=0"}]}],"rewrites":[{"source":"**","destination":"/index.html"}]}}
          JSON
      - name: Deploy user web shared team visuals
        shell: bash
        run: |
          set -euo pipefail
          firebase deploy --only hosting --project "$FIREBASE_PROJECT_ID" --config "$RUNNER_TEMP/member-original-popup/firebase.json" --non-interactive
      - name: Verify production one popup and line-only team cards
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          curl --fail --location --retry 5 --max-time 60 -H 'Cache-Control: no-cache, no-store' "$LIVE_USER_URL?verifyTeamLines=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/member-original-popup-live.html"
          ! grep -F 'JAYUMINTON_MD7_SINGLE_ACTION_POPUP_V1' "$RUNNER_TEMP/member-original-popup-live.html"
          ! grep -F 'jayuminton-md7-single-action-popup' "$RUNNER_TEMP/member-original-popup-live.html"
          ! grep -F 'jayuminton-member-self-profile-edit-v1' "$RUNNER_TEMP/member-original-popup-live.html"
          ! grep -F 'JAYUMINTON_MEMBER_SELF_MEMO_ONLY_V2' "$RUNNER_TEMP/member-original-popup-live.html"
          ! grep -F 'JAYUMINTON_MEMBER_TEAM_STATUS_BADGES_V1' "$RUNNER_TEMP/member-original-popup-live.html"
          ! grep -F 'JAYUMINTON_MEMBER_TEAM_ONLY_BADGES_V2' "$RUNNER_TEMP/member-original-popup-live.html"
          grep -F 'function initialize()' "$RUNNER_TEMP/member-original-popup-live.html" >/dev/null
          grep -F 'function server(name, args)' "$RUNNER_TEMP/member-original-popup-live.html" >/dev/null
          grep -F 'function memberLogin()' "$RUNNER_TEMP/member-original-popup-live.html" >/dev/null
          grep -F "'getMemberPasswordVersion'" "$RUNNER_TEMP/member-original-popup-live.html" >/dev/null
          grep -F "'verifyMemberPassword'" "$RUNNER_TEMP/member-original-popup-live.html" >/dev/null
          grep -F "'resumeMemberSession'" "$RUNNER_TEMP/member-original-popup-live.html" >/dev/null
          grep -F 'memberPreviewLoginButton' "$RUNNER_TEMP/member-original-popup-live.html" >/dev/null
          grep -F "$CLOUDFLARE_RPC_URL" "$RUNNER_TEMP/member-original-popup-live.html" >/dev/null
          grep -F 'JAYUMINTON_TEAM_VISUALS_V8' "$RUNNER_TEMP/member-original-popup-live.html" >/dev/null
          grep -F '#memberApp [data-member-id].jm-has-team' "$RUNNER_TEMP/member-original-popup-live.html" >/dev/null
          grep -F 'border:2px solid var(--jm-team-color' "$RUNNER_TEMP/member-original-popup-live.html" >/dev/null
          grep -F '0 0 0 2px rgba(255,255,255' "$RUNNER_TEMP/member-original-popup-live.html" >/dev/null
          grep -F '0 0 0 4px var(--jm-team-color' "$RUNNER_TEMP/member-original-popup-live.html" >/dev/null
          grep -F 'card.style.setProperty('"'"'--jm-team-color'"'"',colorFor(label))' "$RUNNER_TEMP/member-original-popup-live.html" >/dev/null
          ! grep -F 'box-shadow:inset 4px 0 0 var(--jm-team-color)' "$RUNNER_TEMP/member-original-popup-live.html" >/dev/null
          ! grep -F 'outline:1px solid var(--jm-team-color' "$RUNNER_TEMP/member-original-popup-live.html" >/dev/null
          ! grep -F 'outline-offset:-5px' "$RUNNER_TEMP/member-original-popup-live.html" >/dev/null
          grep -F '#memberApp [data-member-id].jm-temp-pair' "$RUNNER_TEMP/member-original-popup-live.html" >/dev/null
          echo 'MEMBER_ONE_POPUP_LINE_ONLY_TEAM_CARDS_OK'
