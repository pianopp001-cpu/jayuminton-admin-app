name: Build admin v208.81 edge UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-admin-v20881-edge-ui.yml'
      - 'deployment/jayuminton/admin_v20881_edge_ui_patch.py'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: jayuminton-admin-v20881-edge-ui
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: android-actions/setup-android@v3

      - name: Install signing tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'build-tools;35.0.0' >/dev/null

      - name: Patch verified v208.80 APK only
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/jm20881"
          BASE='releases/jayuminton-admin-v208.80-undo3-direct-placement.apk'
          PATCH='deployment/jayuminton/admin_v20881_edge_ui_patch.py'
          HTML="$ROOT/assets/admin/index.html"
          UNSIGNED="$ROOT/jayuminton-admin-v208.81-unsigned.apk"
          ALIGNED="$ROOT/jayuminton-admin-v208.81-aligned.apk"
          OUT="$ROOT/jayuminton-admin-v208.81-edge-ui.apk"
          VERIFY="$ROOT/verify.html"

          rm -rf "$ROOT"
          mkdir -p "$ROOT/assets/admin"
          test -s "$BASE"
          test -s "$PATCH"
          unzip -p "$BASE" assets/admin/index.html > "$HTML"
          test -s "$HTML"

          # v208.80 기능 보존 확인
          grep -F 'jmAdminFixedQuickMenuV20880' "$HTML" >/dev/null
          grep -F 'function installThreeStepUndo()' "$HTML" >/dev/null
          grep -F "batchAssignToTarget([memberId],targetGroup.type,Number(targetGroup.index))" "$HTML" >/dev/null

          # UI 두 부분만 패치. 이 스크립트가 자체적으로 모든 v208.81 UI anchor를 검증한다.
          python3 "$PATCH" "$HTML"

          # 검증된 기존 overlay APK 제작 방식 사용
          cp "$BASE" "$UNSIGNED"
          zip -d "$UNSIGNED" 'META-INF/*' 'assets/admin/index.html' >/dev/null || true
          (cd "$ROOT" && zip -q -u "$UNSIGNED" assets/admin/index.html)

          BUILD_TOOLS="${ANDROID_HOME}/build-tools/35.0.0"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$BUILD_TOOLS/zipalign" -c -p 4 "$ALIGNED"

          test -s signing/jayuminton-release.keystore.b64
          base64 --decode signing/jayuminton-release.keystore.b64 > "$ROOT/release.jks"
          test -s "$ROOT/release.jks"

          KS_PASS="$(sed -n "s/^[[:space:]]*storePassword '\(.*\)'[[:space:]]*$/\1/p" app/build.gradle | head -n1)"
          KEY_ALIAS="$(sed -n "s/^[[:space:]]*keyAlias '\(.*\)'[[:space:]]*$/\1/p" app/build.gradle | head -n1)"
          KEY_PASS="$(sed -n "s/^[[:space:]]*keyPassword '\(.*\)'[[:space:]]*$/\1/p" app/build.gradle | head -n1)"
          test -n "$KS_PASS"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASS"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$ROOT/release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --out "$OUT" \
            "$ALIGNED"

          "$BUILD_TOOLS/apksigner" verify --verbose "$OUT"
          unzip -t "$OUT" >/dev/null
          unzip -p "$OUT" assets/admin/index.html > "$VERIFY"
          test -s "$VERIFY"

          # v208.81 UI 적용 확인
          grep -F 'jmAdminEdgeUiV20881' "$VERIFY" >/dev/null
          grep -F 'left:max(5px,env(safe-area-inset-left))' "$VERIFY" >/dev/null
          grep -F 'top:max(5px,env(safe-area-inset-top))' "$VERIFY" >/dev/null
          grep -F 'width:28px!important;height:82px!important' "$VERIFY" >/dev/null
          grep -F "button.innerHTML=opening?'콕<br>체<br>크<br>▶':'콕<br>체<br>크<br>◀'" "$VERIFY" >/dev/null
          grep -F "button.innerHTML='콕<br>체<br>크<br>◀'" "$VERIFY" >/dev/null

          # v208.80 핵심 기능이 최종 APK에도 그대로 남았는지 확인
          grep -F 'jmAdminFixedQuickMenuV20880' "$VERIFY" >/dev/null
          grep -F 'function installThreeStepUndo()' "$VERIFY" >/dev/null
          grep -F "batchAssignToTarget([memberId],targetGroup.type,Number(targetGroup.index))" "$VERIFY" >/dev/null
          grep -F "make('jmQuickUndo','실행취소'" "$VERIFY" >/dev/null
          grep -F "make('jmQuickGameMinus','게임 -1'" "$VERIFY" >/dev/null
          grep -F 'function updateEligibleCounts()' "$VERIFY" >/dev/null

          SHA="$(sha256sum "$OUT" | awk '{print $1}')"
          echo "APK_SHA256=$SHA" >> "$GITHUB_ENV"
          echo "APK_PATH=$OUT" >> "$GITHUB_ENV"

      - name: Publish v208.81 APK
        shell: bash
        run: |
          set -euo pipefail
          test -s "$APK_PATH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          mkdir -p releases deployment/status
          cp "$APK_PATH" releases/jayuminton-admin-v208.81-edge-ui.apk
          printf 'status=success\nversion=208.81\nbase=v208.80-undo3-direct-placement\nfeature=vertical-kok-edge-tab-top-left-selection-badge\nrun_id=%s\nsha256=%s\n' "$GITHUB_RUN_ID" "$APK_SHA256" > deployment/status/v20881-edge-ui.txt
          git add releases/jayuminton-admin-v208.81-edge-ui.apk deployment/status/v20881-edge-ui.txt
          git commit -m 'Publish admin v208.81: edge UI placement' || exit 0
          git push origin HEAD:main
