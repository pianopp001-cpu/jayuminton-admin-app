name: Continue exact Jayuminton v1.6.37 restore

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/continue-exact-v1637-restore.yml'
      - 'deployment/jayuminton/exact-v1637-web/**'

permissions:
  contents: write

concurrency:
  group: jayuminton-exact-v1637-direct-live
  cancel-in-progress: true

jobs:
  deploy:
    name: Restore original controls and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$JAYUMINTON_DEPLOY_CONFIG_JSON"
          test -n "$CLASPRC_JSON"
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deployment tools
        run: npm install --global @google/clasp@latest firebase-tools@latest

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Read config
        shell: bash
        run: |
          set -euo pipefail
          CONFIG="$RUNNER_TEMP/deploy.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$CONFIG"
          jq -e '.mainScriptId and .mainDeploymentId and .pushScriptId and .pushDeploymentId and .firebaseProjectId and .hostingUrl' "$CONFIG" >/dev/null
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          {
            echo "MAIN_SCRIPT_ID=$(jq -r '.mainScriptId' "$CONFIG")"
            echo "MAIN_DEPLOYMENT_ID=$(jq -r '.mainDeploymentId' "$CONFIG")"
            echo "PUSH_SCRIPT_ID=$(jq -r '.pushScriptId' "$CONFIG")"
            echo "PUSH_DEPLOYMENT_ID=$(jq -r '.pushDeploymentId' "$CONFIG")"
            echo "FIREBASE_PROJECT_ID=$(jq -r '.firebaseProjectId' "$CONFIG")"
            echo "HOSTING_URL=$(jq -r '.hostingUrl' "$CONFIG")"
            echo "MAIN_URL=https://script.google.com/macros/s/$(jq -r '.mainDeploymentId' "$CONFIG")/exec"
            echo "PUSH_URL=https://script.google.com/macros/s/$(jq -r '.pushDeploymentId' "$CONFIG")/exec"
            echo "BUILD_ROOT=$RUNNER_TEMP/v1637-build"
          } >> "$GITHUB_ENV"

      - name: Restore exact v1.6.37 MAIN Script and original top controls
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/main-v1637"
          rm -rf "$WORK" && mkdir -p "$WORK"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$MAIN_SCRIPT_ID" > "$WORK/.clasp.json"
          cd "$WORK"
          clasp pull

          # The current MAIN already has the exact v1.6.37 HTML/CSS. Verify that before touching anything.
          printf '%s  %s\n' \
            '34d5a1469b1abdefc57fe3ca2395fe3ec6c00ef6cd14855fb554af70086e38d0' Admin.html \
            '7342d7051bf125f771c5951e4c54f114f9eb57949327d874be63e6ba5781522b' Code.js \
            '6b61b90e1b6a0955ba0c00524e3556605f46eafa3b969f60a3c420aeb654ae6c' Index.html \
            'f74408c53654e38ff1646f31693b1ed6701e6a625efeb28258edc62bffe12625' Style.html | sha256sum --check

          grep -F 'id="memberSelfSearchInput"' Index.html
          grep -F 'id="memberSelfMatches"' Index.html
          grep -F 'id="memberAlertToggle"' Index.html
          grep -F 'id="memberVibrationToggle"' Index.html
          grep -F 'id="memberAppInstallToggle"' Index.html
          grep -F 'id="memberSelfDone"' Index.html
          grep -F '>알림 ON</button>' Index.html
          grep -F '>진동 ON</button>' Index.html
          grep -F '>앱/웹</button>' Index.html
          grep -F '>완료</button>' Index.html

          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          path = Path('Script.html')
          text = path.read_text(encoding='utf-8')
          expected = '05163359efbcc64c4308bcb8cd42a490441f2012eaa84ea01eae128dd67a5441'
          current = hashlib.sha256(text.encode('utf-8')).hexdigest()

          if current != expected:
              start_marker = 'function openMemberInstallInChrome(installUrl) {'
              next_marker = 'function openMemberInstallInSafari(installUrl) {'
              start = text.find(start_marker)
              end = text.find(next_marker, start)
              if start < 0 or end < 0:
                  raise SystemExit('Could not locate the v1.6.40 Chrome install function in Script.html')

              original_function = """function openMemberInstallInChrome(installUrl) {
            // Google Apps Script의 샌드박스 안에서 intent://를 직접 실행하면
            // Google Drive 문서 링크로 잘못 해석되는 기기가 있다.
            // 고정된 Firebase 사용자 페이지로 이동한다. Chrome 실행은 최상위 직접 클릭 링크가 담당한다.
            try {
              const target = new URL(installUrl);
              if (target.origin !== UNIFIED_MEMBER_APP_ORIGIN) {
                throw new Error('invalid member app origin');
              }
              target.searchParams.set('external', '1');
              target.searchParams.set('source', 'embedded');
              navigateMemberTop(target.toString());
              return;
            } catch (error) {}
            navigateMemberTop(UNIFIED_MEMBER_APP_URL + '?install=choose&external=1&source=embedded&app=user&mode=user');
          }

          """
              text = text[:start] + original_function + text[end:]

              text = text.replace(
                  "installLabel = remain > 0 ? '설치 준비중' : '앱 설치';",
                  "installLabel = remain > 0 ? '설치 준비 ' + remain + '초' : '설치 확인 중';",
                  1
              )
              path.write_text(text, encoding='utf-8')

          restored = hashlib.sha256(path.read_bytes()).hexdigest()
          print('Script.html restored hash:', restored)
          if restored != expected:
              raise SystemExit('Script.html is still not the exact v1.6.37 source: ' + restored)
          PY

          # Exact source markers for the original compact top row.
          grep -F 'memberSelfSummary' Index.html
          grep -F 'member-self-unified-toggle-row' Index.html
          grep -F 'function openMemberSelfSettings()' Script.html
          grep -F 'function renderMemberSelfSettings()' Script.html

          clasp push --force
          clasp create-deployment --deploymentId "$MAIN_DEPLOYMENT_ID" --description "Exact v1.6.37 top controls ${GITHUB_SHA::7}"

      - name: Refresh PUSH deployment
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/push-v1637"
          rm -rf "$WORK" && mkdir -p "$WORK"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$PUSH_SCRIPT_ID" > "$WORK/.clasp.json"
          cd "$WORK"
          clasp pull
          clasp create-deployment --deploymentId "$PUSH_DEPLOYMENT_ID" --description "v1.6.37 ${GITHUB_SHA::7}"

      - name: Verify live MAIN original controls
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          BODY="$RUNNER_TEMP/live-main.html"
          FINAL="$RUNNER_TEMP/live-main-url.txt"
          curl --fail --location --retry 5 --retry-delay 3 --max-time 90 \
            --output "$BODY" --write-out '%{url_effective}' \
            "$MAIN_URL?mode=user&app=user&source=exact-v1637-$GITHUB_RUN_ID" > "$FINAL"
          if grep -Eiq 'drive\.google\.com|docs\.google\.com|주소를 확인한 다음 다시 시도|요청한 파일이 존재하지' "$FINAL" "$BODY"; then
            echo 'MAIN endpoint is invalid'; cat "$FINAL"; exit 1
          fi
          python3 - "$BODY" <<'PY'
          import sys
          s=open(sys.argv[1],encoding='utf-8').read()
          keys=['memberSelfSearchInput','memberSelfMatches','memberAlertToggle','memberVibrationToggle','memberAppInstallToggle','memberSelfDone','queue-panel']
          positions=[s.find(k) for k in keys]
          if any(p < 0 for p in positions):
              raise SystemExit('Original top control missing: '+str(list(zip(keys,positions))))
          if positions != sorted(positions):
              raise SystemExit('Original top control order is wrong: '+str(list(zip(keys,positions))))
          for label in ['알림 ON','진동 ON','앱/웹','완료']:
              if label not in s:
                  raise SystemExit('Original label missing: '+label)
          print('Live MAIN original top controls verified.')
          PY

      - name: Build and deploy exact v1.6.37 PWA
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$BUILD_ROOT" && mkdir -p "$BUILD_ROOT/web-push"
          cp deployment/jayuminton/firebase.json "$BUILD_ROOT/firebase.json"
          cp deployment/jayuminton/exact-v1637-web/index.html "$BUILD_ROOT/web-push/index.html"
          cp deployment/jayuminton/exact-v1637-web/setup-v205.css "$BUILD_ROOT/web-push/setup-v205.css"
          cat deployment/jayuminton/exact-v1637-web/setup-v205.js.part-* > "$BUILD_ROOT/web-push/setup-v205.js"
          cp deployment/jayuminton/exact-v1637-web/config-v204.js "$BUILD_ROOT/web-push/config-v204.js"
          cp deployment/jayuminton/exact-v1637-web/manifest.webmanifest "$BUILD_ROOT/web-push/manifest.webmanifest"
          cp deployment/jayuminton/exact-v1637-web/firebase-messaging-sw.js "$BUILD_ROOT/web-push/firebase-messaging-sw.js"

          printf '%s  %s\n' 'ca0b8d7fbb11179638abe211af282100731cd1ad4246c66f561472dfddc238f0' "$BUILD_ROOT/web-push/setup-v205.js" | sha256sum --check
          ! grep -F 'S.browser_fallback_url' "$BUILD_ROOT/web-push/setup-v205.js"
          grep -F 'category=android.intent.category.BROWSABLE;end' "$BUILD_ROOT/web-push/setup-v205.js"
          node --check "$BUILD_ROOT/web-push/setup-v205.js"

          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ['BUILD_ROOT'])/'web-push'/'config-v204.js'
          s=p.read_text(encoding='utf-8')
          s=s.replace('__MEMBER_PAGE_URL__',os.environ['MAIN_URL']).replace('__RELAY_URL__',os.environ['PUSH_URL'])
          if '__MEMBER_PAGE_URL__' in s or '__RELAY_URL__' in s:
              raise SystemExit('URL injection failed')
          p.write_text(s,encoding='utf-8')
          PY

          BASE="${HOSTING_URL%/}"
          for a in icon-198.png icon-512.png apple-touch-icon-180.png badge-96.png; do
            curl --fail --location --retry 3 --max-time 60 "$BASE/$a?src=$GITHUB_RUN_ID" -o "$BUILD_ROOT/web-push/$a"
            test -s "$BUILD_ROOT/web-push/$a"
          done

          cd "$BUILD_ROOT"
          firebase deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive \
            --message "Exact v1.6.37 top controls ${GITHUB_SHA::7}"

      - name: Verify Firebase Drive fix
        shell: bash
        run: |
          set -euo pipefail
          BASE="${HOSTING_URL%/}"
          BUST="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          curl --fail --location -H 'Cache-Control: no-cache' "$BASE/setup-v205.js?verify=$BUST" > "$RUNNER_TEMP/setup.js"
          curl --fail --location -H 'Cache-Control: no-cache' "$BASE/config-v204.js?verify=$BUST" > "$RUNNER_TEMP/config.js"
          ! grep -F 'S.browser_fallback_url' "$RUNNER_TEMP/setup.js"
          grep -F "$MAIN_URL" "$RUNNER_TEMP/config.js"
          grep -F "$PUSH_URL" "$RUNNER_TEMP/config.js"

      - name: Record live restore result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          STATUS='${{ job.status }}'
          printf 'status=%s\ncommit=%s\nrun=%s\n' "$STATUS" "$GITHUB_SHA" "$GITHUB_RUN_ID" > deployment/jayuminton/EXACT_V1637_LIVE_RESULT.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment/jayuminton/EXACT_V1637_LIVE_RESULT.txt
          git commit -m "Record exact v1.6.37 live restore: $STATUS" || exit 0
          git pull --rebase origin main || true
          git push
