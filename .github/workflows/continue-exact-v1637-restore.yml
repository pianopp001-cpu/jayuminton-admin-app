name: Continue exact Jayuminton v1.6.37 restore

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/continue-exact-v1637-restore.yml'
      - 'deployment/jayuminton/v1637-web/**'

permissions:
  contents: write

concurrency:
  group: jayuminton-exact-v1637-direct-live
  cancel-in-progress: true

jobs:
  deploy:
    name: Fix v1.6.37 behavior without UI changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global @google/clasp@latest firebase-tools@latest
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Read config
        shell: bash
        run: |
          set -euo pipefail
          CONFIG="$RUNNER_TEMP/deploy.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$CONFIG"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          jq -e '.mainScriptId and .mainDeploymentId and .pushDeploymentId and .firebaseProjectId and .hostingUrl' "$CONFIG" >/dev/null
          {
            echo "MAIN_SCRIPT_ID=$(jq -r '.mainScriptId' "$CONFIG")"
            echo "MAIN_DEPLOYMENT_ID=$(jq -r '.mainDeploymentId' "$CONFIG")"
            echo "MAIN_URL=https://script.google.com/macros/s/$(jq -r '.mainDeploymentId' "$CONFIG")/exec"
            echo "PUSH_URL=https://script.google.com/macros/s/$(jq -r '.pushDeploymentId' "$CONFIG")/exec"
            echo "FIREBASE_PROJECT_ID=$(jq -r '.firebaseProjectId' "$CONFIG")"
            echo "HOSTING_URL=$(jq -r '.hostingUrl' "$CONFIG")"
            echo "BUILD_ROOT=$RUNNER_TEMP/v1637-final9"
          } >> "$GITHUB_ENV"

      - name: Patch MAIN behavior only
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/main"
          rm -rf "$WORK" && mkdir -p "$WORK"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$MAIN_SCRIPT_ID" > "$WORK/.clasp.json"
          cd "$WORK"
          clasp pull

          # Freeze all visible v1.6.37 files byte-for-byte.
          printf '%s  %s\n' \
            '34d5a1469b1abdefc57fe3ca2395fe3ec6c00ef6cd14855fb554af70086e38d0' Admin.html \
            '7342d7051bf125f771c5951e4c54f114f9eb57949327d874be63e6ba5781522b' Code.js \
            '6b61b90e1b6a0955ba0c00524e3556605f46eafa3b969f60a3c420aeb654ae6c' Index.html \
            'f74408c53654e38ff1646f31693b1ed6701e6a625efeb28258edc62bffe12625' Style.html | sha256sum --check

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('Script.html')
          s = p.read_text(encoding='utf-8')

          # Never render deployment/debug markers after </script>.
          end = s.rfind('</script>')
          if end < 0:
              raise SystemExit('Script closing tag missing')
          tail = s[end + len('</script>'):]
          if tail.strip() and not re.fullmatch(r'(?:\s*//\s*v1637-[^\n]*-main\s*)+', tail):
              raise SystemExit('Unexpected content after </script>')
          s = s[:end + len('</script>')] + '\n'

          # Apps Script iframe only requests install from the Firebase top page.
          a = s.find('function openMemberInstallInChrome(installUrl) {')
          b = s.find('function openMemberInstallInSafari(installUrl) {', a)
          if a < 0 or b < 0:
              raise SystemExit('Chrome install function missing')
          s = s[:a] + """function openMemberInstallInChrome(installUrl) {
            if (isUnifiedMemberFrame()) {
              postUnifiedMemberMessage('JAYUMINTON_APP_INSTALL_REQUEST', {
                platform: 'android',
                browserContext: detectMemberInstallBrowserContext(),
                installUrl: installUrl
              });
              return;
            }
            try {
              const target = new URL(installUrl);
              if (target.origin !== UNIFIED_MEMBER_APP_ORIGIN) throw new Error('invalid member app origin');
              target.searchParams.set('install', 'choose');
              target.searchParams.set('external', '1');
              target.searchParams.set('source', 'embedded');
              target.searchParams.set('app', 'user');
              target.searchParams.set('mode', 'user');
              navigateMemberTop(target.toString());
              return;
            } catch (error) {}
            navigateMemberTop(UNIFIED_MEMBER_APP_URL + '?install=choose&external=1&source=embedded&app=user&mode=user');
          }

          """ + s[b:]

          # Explicit edit state: typing must never be overwritten by the saved member.
          a = s.find('function openMemberSelfSettings() {')
          b = s.find('function renderMemberSelfSettings() {', a)
          if a < 0 or b < 0:
              raise SystemExit('Member settings block missing')
          s = s[:a] + """function openMemberSelfSettings() {
            try { localStorage.setItem(MEMBER_SELF_PANEL_COMPACT_KEY, 'false'); }
            catch (error) {}
            const input = document.getElementById('memberSelfSearchInput');
            if (input) {
              input.value = '';
              input.dataset.userEditing = '1';
            }
            renderMemberSelfSettings();
            setTimeout(function() {
              const currentInput = document.getElementById('memberSelfSearchInput');
              if (currentInput) currentInput.focus();
            }, 0);
          }

          """ + s[b:]

          s, n = re.subn(
              r"^\s*if \(input && selected && !input\.value(?: && [^\n]*)?\) input\.value = selected\.name;\s*$",
              "  if (input && selected && !input.value && input.dataset.userEditing !== '1') input.value = selected.name;",
              s, count=1, flags=re.M
          )
          if n != 1 and "input.dataset.userEditing !== '1'" not in s:
              raise SystemExit('Saved-name render guard missing')

          a = s.find('function selectMemberSelf(memberId) {')
          b = s.find('function clearMemberSelfSelection() {', a)
          if a < 0 or b < 0:
              raise SystemExit('Member select block missing')
          block = s[a:b]
          if "memberInput.dataset.userEditing = '0'" not in block:
              block, n = re.subn(
                  r"(?m)^(\s*)if \(!member\) return;\s*$",
                  lambda m: m.group(0) + "\n" + m.group(1) + "const memberInput = document.getElementById('memberSelfSearchInput');\n" + m.group(1) + "if (memberInput) {\n" + m.group(1) + "  memberInput.dataset.userEditing = '0';\n" + m.group(1) + "  memberInput.value = String(member.name || '').trim();\n" + m.group(1) + "}",
                  block, count=1
              )
              if n != 1:
                  raise SystemExit('Member selection insertion point missing')
              s = s[:a] + block + s[b:]

          p.write_text(s, encoding='utf-8')
          PY

          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path('Script.html').read_text(encoding='utf-8')
          if not s.rstrip().endswith('</script>'):
              raise SystemExit('Visible text remains after </script>')
          if re.search(r'^//\s*v1637-.*-main\s*$', s, re.M):
              raise SystemExit('Visible debug marker remains')
          a = s.find('function openMemberInstallInChrome(installUrl) {')
          b = s.find('function openMemberInstallInSafari(installUrl) {', a)
          if 'intent://' in s[a:b]:
              raise SystemExit('MAIN still launches Android intent directly')
          for marker in ["dataset.userEditing = '1'", "dataset.userEditing !== '1'", "dataset.userEditing = '0'"]:
              if marker not in s:
                  raise SystemExit('Name-edit marker missing: ' + marker)
          PY

          clasp push --force
          clasp create-deployment --deploymentId "$MAIN_DEPLOYMENT_ID" --description "v1.6.37 behavior final9 ${GITHUB_SHA::7}"

      - name: Verify MAIN live
        shell: bash
        run: |
          set -euo pipefail
          sleep 7
          BODY="$RUNNER_TEMP/main.html"
          FINAL="$RUNNER_TEMP/main-url.txt"
          curl --fail --location --retry 5 --retry-delay 3 --max-time 90 --output "$BODY" --write-out '%{url_effective}' "$MAIN_URL?mode=user&app=user&verify=$GITHUB_RUN_ID" > "$FINAL"
          if grep -Eiq 'drive\.google\.com|docs\.google\.com|주소를 확인한 다음 다시 시도|현재 파일을 열 수 없습니다' "$FINAL" "$BODY"; then exit 1; fi
          for key in memberSelfSearchInput memberSelfMatches memberAlertToggle memberVibrationToggle memberAppInstallToggle memberSelfDone; do grep -F "$key" "$BODY" >/dev/null; done
          if grep -E '// v1637-final[0-9]+-main' "$BODY" >/dev/null; then exit 1; fi

      - name: Build genuine v1.6.37 PWA with behavior fixes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$BUILD_ROOT" && mkdir -p "$BUILD_ROOT/web-push"
          cp deployment/jayuminton/firebase.json "$BUILD_ROOT/firebase.json"
          cp deployment/jayuminton/v1637-web/index.html "$BUILD_ROOT/web-push/index.html"
          cp deployment/jayuminton/v1637-web/setup-v205.css "$BUILD_ROOT/web-push/setup-v205.css"
          cp deployment/jayuminton/v1637-web/manifest.webmanifest "$BUILD_ROOT/web-push/manifest.webmanifest"
          cp deployment/jayuminton/v1637-web/firebase-messaging-sw.js "$BUILD_ROOT/web-push/firebase-messaging-sw.js"
          cat deployment/jayuminton/v1637-web/setup-v205.js.gz.b64.part-* | tr -d '\r\n' | base64 -d > "$RUNNER_TEMP/setup-v205.js.gz"
          gzip -dc "$RUNNER_TEMP/setup-v205.js.gz" > "$BUILD_ROOT/web-push/setup-v205.js"

          printf '%s  %s\n' \
            '89f3203c79f62e32aabfeaeee275a3b1fd425326fd1f66866c95a58d91cb559d' "$BUILD_ROOT/web-push/index.html" \
            '5e5483ec6a1554d028587ec48cc750c56e4d75b05330a57221201352cda6500f' "$BUILD_ROOT/web-push/setup-v205.css" \
            '53828f38565e057b865750b9fbf66737b8841451ac4afebc34150b0f93d8fd9b' "$BUILD_ROOT/web-push/setup-v205.js" \
            'd1bad15093aa92ab3ab89097e2bb783763666350b4fcba5c24f5365e6d53de5a' "$BUILD_ROOT/web-push/manifest.webmanifest" \
            '2b8fea2e2051fd265ec2e5d4ef1f988e149e4575f252c2a3d18b2020913278b1' "$BUILD_ROOT/web-push/firebase-messaging-sw.js" | sha256sum --check

          python3 - <<'PY'
          import os, re
          from pathlib import Path

          root = Path(os.environ['BUILD_ROOT']) / 'web-push'
          p = root / 'setup-v205.js'
          s = p.read_text(encoding='utf-8')

          required = [
              "appInstallChromeLink.addEventListener('click', handleEmbeddedChromeLinkClick);",
              "appInstallChromeLink.addEventListener('touchstart'",
              "appInstallChromeLink.setAttribute('target', '_top');",
              "appInstallChromeLink.href = links.intentUrl;",
              "promptEvent.prompt()",
              "registration.showNotification(",
              "navigator.vibrate(",
              "vibrationPattern(type)"
          ]
          for marker in required:
              if marker not in s:
                  raise SystemExit('Required v1.6.37 behavior missing: ' + marker)

          # 1) Keep the real top-level Chrome intent, remove Drive-risk fallback.
          pattern = re.compile(
              r"(?ms)^(?P<i>[ \t]*)const intentUrl\s*=\s*'intent://'\s*\+\s*hostAndPath\s*\+\s*"
              r"'#Intent;scheme=https;package=com\.android\.chrome;action=android\.intent\.action\.VIEW;'\s*\+\s*"
              r"'category=android\.intent\.category\.BROWSABLE;S\.browser_fallback_url='\s*\+\s*"
              r"encodeURIComponent\(targetUrl\)\s*\+\s*';end';"
          )
          def intent_repl(m):
              i = m.group('i')
              return (i + "const intentUrl = 'intent://' + hostAndPath +\n" +
                      i + "  '#Intent;scheme=https;package=com.android.chrome;action=android.intent.action.VIEW;' +\n" +
                      i + "  'category=android.intent.category.BROWSABLE;end';")
          s, n = pattern.subn(intent_repl, s, count=1)
          if n != 1:
              raise SystemExit('Chrome intent block not found')

          # 2) A timer/postMessage cannot refresh or reopen the same Firebase page.
          pattern = re.compile(
              r"(?ms)^(?P<i>[ \t]*)if \(!hasActivation\) \{(?P<body>.*?)^(?P=i)\}"
          )
          replaced = False
          def activation_repl(m):
              global replaced
              body = m.group('body')
              if 'window.location.href = links.targetUrl' not in body:
                  return m.group(0)
              replaced = True
              i = m.group('i')
              return (i + "if (!hasActivation) {\n" +
                      i + "  setInstallMessage('앱설치 버튼을 다시 눌러 Chrome으로 이동해 주세요.', 'success');\n" +
                      i + "  sendAppInstallStatus('Chrome 직접 터치 대기');\n" +
                      i + "  refreshInstallProxyPosition();\n" +
                      i + "  return;\n" + i + "}")
          s = pattern.sub(activation_repl, s)
          if not replaced:
              raise SystemExit('Activation refresh fallback block not found')

          # 3) iframe install request only re-arms the top-level transparent link in embedded browsers.
          pattern = re.compile(
              r"(?ms)^(?P<i>[ \t]*)\}\s*else if \(data\.type === 'JAYUMINTON_APP_INSTALL_REQUEST'\) \{\s*"
              r"handleAppInstallButton\(true\);\s*^(?P=i)\}"
          )
          def request_repl(m):
              i = m.group('i')
              return (i + "} else if (data.type === 'JAYUMINTON_APP_INSTALL_REQUEST') {\n" +
                      i + "  if (androidDevice && embeddedBrowser) {\n" +
                      i + "    setInstallMessage('앱설치 버튼을 다시 눌러 Chrome으로 이동해 주세요.', 'success');\n" +
                      i + "    sendAppInstallStatus('Chrome 직접 링크 대기');\n" +
                      i + "    refreshInstallProxyPosition();\n" +
                      i + "    return;\n" +
                      i + "  }\n" +
                      i + "  handleAppInstallButton(true);\n" + i + "}")
          s, n = pattern.subn(request_repl, s, count=1)
          if n != 1:
              raise SystemExit('Install request message block not found')

          # 4) Only a real new beforeinstallprompt proves an old installed flag is stale.
          pattern = re.compile(
              r"(?m)^(?P<i>[ \t]*)deferredInstallPrompt\s*=\s*event;\s*\n(?P=i)window\.__JAYUMINTON_EARLY_INSTALL_PROMPT\s*=\s*null;"
          )
          def bip_repl(m):
              i = m.group('i')
              return (i + "deferredInstallPrompt = event;\n" +
                      i + "try {\n" +
                      i + "  localStorage.removeItem(STORAGE.installConfirmed);\n" +
                      i + "  if (localStorage.getItem(STORAGE.installChoice) === 'on') localStorage.removeItem(STORAGE.installChoice);\n" +
                      i + "} catch (_) {}\n" +
                      i + "window.__JAYUMINTON_EARLY_INSTALL_PROMPT = null;")
          s, n = pattern.subn(bip_repl, s, count=1)
          if n != 1:
              raise SystemExit('beforeinstallprompt state block not found')

          # 5) Parent PWA must not force the saved member while a different name is being typed.
          listener = "  connectButton.addEventListener('click', handleAlarmButton);\n"
          if listener in s and "nameInput.addEventListener('input'" not in s:
              s = s.replace(listener, listener + """  nameInput.addEventListener('input', () => {
            const typed = firstTwoSearchChars(nameInput.value);
            const saved = member && member.name ? firstTwoSearchChars(member.name) : '';
            if (member && typed && typed !== saved) {
              member = null;
              try { localStorage.removeItem(STORAGE.member); } catch (_) {}
              isConnected = false;
              setOff('새 이름을 입력한 뒤 아래 이름 검색 결과에서 본인을 눌러 주세요.');
              sendBootstrap();
            }
          });
          """, 1)

          # 6) Selecting another member replaces the old member and invalidates the old token mapping.
          marker = "} else if (data.type === 'JAYUMINTON_MEMBER_SELECTED' || data.type === 'JAYUMINTON_MEMBER_CLICKED') {"
          start = s.find(marker)
          if start < 0:
              raise SystemExit('Member selection message branch missing')
          if 'const nextMember =' not in s[start:start + 1800]:
              pattern = re.compile(
                  r"(?ms)(?P<i>^[ \t]*)member\s*=\s*\{id:String\(data\.member\.id\), name:String\(data\.member\.name\)\};\s*\n"
                  r"(?P=i)saveJson\(STORAGE\.member, member\);\s*\n(?P=i)nameInput\.value\s*=\s*shortName\(member\.name\);"
              )
              def member_repl(m):
                  i = m.group('i')
                  return (i + "const nextMember = {id:String(data.member.id), name:String(data.member.name)};\n" +
                          i + "const memberChanged = Boolean(member && String(member.id) !== String(nextMember.id));\n" +
                          i + "member = nextMember;\n" +
                          i + "saveJson(STORAGE.member, member);\n" +
                          i + "nameInput.value = shortName(member.name);\n" +
                          i + "if (memberChanged) {\n" +
                          i + "  try { localStorage.removeItem(STORAGE.token); } catch (_) {}\n" +
                          i + "  isConnected = false;\n" +
                          i + "  setOff(member.name + '님으로 변경했습니다. 완료를 눌러 알림을 다시 연결해 주세요.');\n" +
                          i + "}")
              tail = s[start:]
              tail, n = pattern.subn(member_repl, tail, count=1)
              if n != 1:
                  raise SystemExit('Member replacement assignment missing')
              s = s[:start] + tail

          p.write_text(s, encoding='utf-8')

          # Cache bust only. No DOM/CSS/layout changes.
          idx = root / 'index.html'
          t = idx.read_text(encoding='utf-8')
          t = t.replace('/setup-v205.js?v=1637', '/setup-v205.js?v=1637-final9')
          t = t.replace('/config-v204.js?v=1637', '/config-v204.js?v=1637-final9')
          idx.write_text(t, encoding='utf-8')

          template = Path('deployment/jayuminton/v1637-web/config-v204.template.js').read_text(encoding='utf-8')
          cfg = template.replace('__MEMBER_PAGE_URL__', os.environ['MAIN_URL']).replace('__RELAY_URL__', os.environ['PUSH_URL'])
          for name in ('config-v202.js', 'config-v203.js', 'config-v204.js'):
              (root / name).write_text(cfg, encoding='utf-8')

          sw = root / 'firebase-messaging-sw.js'
          t = sw.read_text(encoding='utf-8')
          t = t.replace("const JAYUMINTON_SW_VERSION = '1.6.37';", "const JAYUMINTON_SW_VERSION = '1.6.37-final9';")
          t = t.replace("const JAYUMINTON_CACHE = 'jayuminton-shell-v205';", "const JAYUMINTON_CACHE = 'jayuminton-shell-v219';")
          sw.write_text(t, encoding='utf-8')
          PY

          node --check "$BUILD_ROOT/web-push/setup-v205.js"
          grep -F "appInstallChromeLink.addEventListener('click', handleEmbeddedChromeLinkClick);" "$BUILD_ROOT/web-push/setup-v205.js" >/dev/null
          grep -F "appInstallChromeLink.addEventListener('touchstart'" "$BUILD_ROOT/web-push/setup-v205.js" >/dev/null
          grep -F "appInstallChromeLink.setAttribute('target', '_top');" "$BUILD_ROOT/web-push/setup-v205.js" >/dev/null
          grep -F 'appInstallChromeLink.href = links.intentUrl' "$BUILD_ROOT/web-push/setup-v205.js" >/dev/null
          grep -F 'promptEvent.prompt()' "$BUILD_ROOT/web-push/setup-v205.js" >/dev/null
          grep -F 'memberChanged' "$BUILD_ROOT/web-push/setup-v205.js" >/dev/null
          grep -F 'registration.showNotification(' "$BUILD_ROOT/web-push/setup-v205.js" >/dev/null
          grep -F 'navigator.vibrate(' "$BUILD_ROOT/web-push/setup-v205.js" >/dev/null
          grep -F 'vibrationPattern(type)' "$BUILD_ROOT/web-push/setup-v205.js" >/dev/null
          if grep -F 'S.browser_fallback_url' "$BUILD_ROOT/web-push/setup-v205.js" >/dev/null; then echo 'Drive-risk fallback remains'; exit 1; fi
          if grep -F 'window.location.href = links.targetUrl' "$BUILD_ROOT/web-push/setup-v205.js" >/dev/null; then echo 'Same-page refresh fallback remains'; exit 1; fi

          BASE="${HOSTING_URL%/}"
          for a in icon-198.png icon-512.png apple-touch-icon-180.png badge-96.png; do
            curl --fail --location --retry 3 --max-time 60 "$BASE/$a?src=$GITHUB_RUN_ID" -o "$BUILD_ROOT/web-push/$a"
            test -s "$BUILD_ROOT/web-push/$a"
          done

      - name: Deploy Firebase Hosting
        working-directory: ${{ env.BUILD_ROOT }}
        run: firebase deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive --message "v1.6.37 behavior final9 ${GITHUB_SHA::7}"

      - name: Verify Firebase live
        shell: bash
        run: |
          set -euo pipefail
          sleep 8
          BASE="${HOSTING_URL%/}"
          BUST="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-final9"
          curl --fail --location -H 'Cache-Control: no-cache' "$BASE/?v=$BUST" > "$RUNNER_TEMP/index"
          curl --fail --location -H 'Cache-Control: no-cache' "$BASE/setup-v205.js?v=$BUST" > "$RUNNER_TEMP/setup"
          curl --fail --location -H 'Cache-Control: no-cache' "$BASE/config-v204.js?v=$BUST" > "$RUNNER_TEMP/config"
          curl --fail --location -H 'Cache-Control: no-cache' "$BASE/firebase-messaging-sw.js?v=$BUST" > "$RUNNER_TEMP/sw"
          grep -F 'setup-v205.js?v=1637-final9' "$RUNNER_TEMP/index" >/dev/null
          grep -F "appInstallChromeLink.addEventListener('click', handleEmbeddedChromeLinkClick);" "$RUNNER_TEMP/setup" >/dev/null
          grep -F "appInstallChromeLink.addEventListener('touchstart'" "$RUNNER_TEMP/setup" >/dev/null
          grep -F "appInstallChromeLink.setAttribute('target', '_top');" "$RUNNER_TEMP/setup" >/dev/null
          grep -F 'appInstallChromeLink.href = links.intentUrl' "$RUNNER_TEMP/setup" >/dev/null
          grep -F 'promptEvent.prompt()' "$RUNNER_TEMP/setup" >/dev/null
          grep -F 'memberChanged' "$RUNNER_TEMP/setup" >/dev/null
          grep -F 'registration.showNotification(' "$RUNNER_TEMP/setup" >/dev/null
          grep -F 'navigator.vibrate(' "$RUNNER_TEMP/setup" >/dev/null
          grep -F 'vibrationPattern(type)' "$RUNNER_TEMP/setup" >/dev/null
          if grep -F 'S.browser_fallback_url' "$RUNNER_TEMP/setup" >/dev/null; then exit 1; fi
          if grep -F 'window.location.href = links.targetUrl' "$RUNNER_TEMP/setup" >/dev/null; then exit 1; fi
          grep -F "$MAIN_URL" "$RUNNER_TEMP/config" >/dev/null
          grep -F "$PUSH_URL" "$RUNNER_TEMP/config" >/dev/null
          grep -F "jayuminton-shell-v219" "$RUNNER_TEMP/sw" >/dev/null

      - name: Record result
        if: always()
        shell: bash
        run: |
          STATUS='${{ job.status }}'
          printf 'status=%s\ncommit=%s\nrun=%s\n' "$STATUS" "$GITHUB_SHA" "$GITHUB_RUN_ID" > deployment/jayuminton/EXACT_V1637_LIVE_RESULT.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment/jayuminton/EXACT_V1637_LIVE_RESULT.txt
          git commit -m "Record v1.6.37 final9: $STATUS" || exit 0
          git pull --rebase origin main || true
          git push
