name: Continue exact Jayuminton v1.6.37 restore

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/continue-exact-v1637-restore.yml'
      - 'deployment/jayuminton/v1637-web/**'

permissions:
  contents: write

concurrency:
  group: jayuminton-exact-v1637-direct-live
  cancel-in-progress: true

jobs:
  deploy:
    name: Restore real v1.6.37 Chrome tap without UI changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global @google/clasp@latest firebase-tools@latest
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Read config
        shell: bash
        run: |
          set -euo pipefail
          CONFIG="$RUNNER_TEMP/deploy.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$CONFIG"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          jq -e '.mainScriptId and .mainDeploymentId and .pushDeploymentId and .firebaseProjectId and .hostingUrl' "$CONFIG" >/dev/null
          {
            echo "MAIN_SCRIPT_ID=$(jq -r '.mainScriptId' "$CONFIG")"
            echo "MAIN_DEPLOYMENT_ID=$(jq -r '.mainDeploymentId' "$CONFIG")"
            echo "MAIN_URL=https://script.google.com/macros/s/$(jq -r '.mainDeploymentId' "$CONFIG")/exec"
            echo "PUSH_URL=https://script.google.com/macros/s/$(jq -r '.pushDeploymentId' "$CONFIG")/exec"
            echo "FIREBASE_PROJECT_ID=$(jq -r '.firebaseProjectId' "$CONFIG")"
            echo "HOSTING_URL=$(jq -r '.hostingUrl' "$CONFIG")"
            echo "BUILD_ROOT=$RUNNER_TEMP/v1637-final8"
          } >> "$GITHUB_ENV"

      - name: Fix MAIN behavior and remove visible debug text
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/main"
          rm -rf "$WORK" && mkdir -p "$WORK"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$MAIN_SCRIPT_ID" > "$WORK/.clasp.json"
          cd "$WORK"
          clasp pull

          # Visible v1.6.37 UI files must stay byte-for-byte unchanged.
          printf '%s  %s\n' \
            '34d5a1469b1abdefc57fe3ca2395fe3ec6c00ef6cd14855fb554af70086e38d0' Admin.html \
            '7342d7051bf125f771c5951e4c54f114f9eb57949327d874be63e6ba5781522b' Code.js \
            '6b61b90e1b6a0955ba0c00524e3556605f46eafa3b969f60a3c420aeb654ae6c' Index.html \
            'f74408c53654e38ff1646f31693b1ed6701e6a625efeb28258edc62bffe12625' Style.html | sha256sum --check

          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('Script.html')
          s=p.read_text(encoding='utf-8')

          # Remove every accidentally rendered deployment marker after the real </script>.
          end=s.rfind('</script>')
          if end < 0:
              raise SystemExit('Script closing tag missing')
          tail=s[end+len('</script>'):]
          if tail.strip() and not re.fullmatch(r'(?:\s*//\s*v1637-[^\n]*-main\s*)+', tail):
              raise SystemExit('Unexpected content exists after </script>; refusing to cut it')
          s=s[:end+len('</script>')]+'\n'

          # MAIN iframe never launches Android intent itself. It only asks the Firebase top page.
          a=s.find('function openMemberInstallInChrome(installUrl) {')
          b=s.find('function openMemberInstallInSafari(installUrl) {',a)
          if a<0 or b<0:
              raise SystemExit('Chrome install function missing')
          s=s[:a]+"""function openMemberInstallInChrome(installUrl) {
            if (isUnifiedMemberFrame()) {
              postUnifiedMemberMessage('JAYUMINTON_APP_INSTALL_REQUEST', {
                platform: 'android',
                browserContext: detectMemberInstallBrowserContext(),
                installUrl: installUrl
              });
              return;
            }
            try {
              const target = new URL(installUrl);
              if (target.origin !== UNIFIED_MEMBER_APP_ORIGIN) throw new Error('invalid member app origin');
              target.searchParams.set('install', 'choose');
              target.searchParams.set('external', '1');
              target.searchParams.set('source', 'embedded');
              target.searchParams.set('app', 'user');
              target.searchParams.set('mode', 'user');
              navigateMemberTop(target.toString());
              return;
            } catch (error) {}
            navigateMemberTop(UNIFIED_MEMBER_APP_URL + '?install=choose&external=1&source=embedded&app=user&mode=user');
          }

          """+s[b:]

          # Name edit: opening settings means the user is changing the saved member.
          a=s.find('function openMemberSelfSettings() {')
          b=s.find('function renderMemberSelfSettings() {',a)
          if a<0 or b<0:
              raise SystemExit('Member settings block missing')
          s=s[:a]+"""function openMemberSelfSettings() {
            try { localStorage.setItem(MEMBER_SELF_PANEL_COMPACT_KEY, 'false'); }
            catch (error) {}
            const input = document.getElementById('memberSelfSearchInput');
            if (input) {
              input.value = '';
              input.dataset.userEditing = '1';
            }
            renderMemberSelfSettings();
            setTimeout(function() {
              const currentInput = document.getElementById('memberSelfSearchInput');
              if (currentInput) currentInput.focus();
            }, 0);
          }

          """+s[b:]

          s=re.sub(
            r"^\s*if \(input && selected && !input\.value(?: && [^\n]*)?\) input\.value = selected\.name;\s*$",
            "  if (input && selected && !input.value && input.dataset.userEditing !== '1') input.value = selected.name;",
            s,count=1,flags=re.M
          )

          a=s.find('function selectMemberSelf(memberId) {')
          b=s.find('function clearMemberSelfSelection() {',a)
          if a<0 or b<0:
              raise SystemExit('Member select block missing')
          block=s[a:b]
          if "memberInput.dataset.userEditing = '0'" not in block:
              needle='  if (!member) return;\n'
              if needle not in block:
                  raise SystemExit('Member selection insertion point missing')
              block=block.replace(needle,"""  if (!member) return;
            const memberInput = document.getElementById('memberSelfSearchInput');
            if (memberInput) {
              memberInput.dataset.userEditing = '0';
              memberInput.value = String(member.name || '').trim();
            }
          """,1)
              s=s[:a]+block+s[b:]

          # Kakao/Daangn WebView often blanks or rewrites document.referrer, which made
          # isUnifiedMemberFrame() wrongly return false on the 2nd install tap and fall
          # through to a full top-level reload instead of asking the parent to hand off
          # to Chrome (the "누르면 새로고침만 됨" symptom). postMessage's own targetOrigin
          # (UNIFIED_MEMBER_APP_ORIGIN) is already the real security boundary here.
          def extract_block(src, start_idx):
              brace_open = src.find('{', start_idx)
              depth = 0
              i = brace_open
              while i < len(src):
                  if src[i] == '{':
                      depth += 1
                  elif src[i] == '}':
                      depth -= 1
                      if depth == 0:
                          return src[start_idx:i+1], start_idx, i+1
                  i += 1
              raise SystemExit('unbalanced braces')

          a=s.find('function isUnifiedMemberFrame() {')
          if a<0:
              raise SystemExit('isUnifiedMemberFrame missing')
          fblock,fstart,fend=extract_block(s,a)
          if 'document.referrer' in fblock:
              new_fblock="""function isUnifiedMemberFrame() {
            return !IS_ADMIN && window.parent !== window;
          }"""
              s=s[:fstart]+new_fblock+s[fend:]

          # The parent's transparent Chrome-intent overlay is positioned from the last
          # JAYUMINTON_APP_INSTALL_BUTTON_RECT message. If that data is stale (layout
          # shifted since it was last published), the overlay sits over the wrong spot
          # and every tap keeps hitting the real button again, which looks like nothing
          # happens. Publish a fresh rect synchronously at the moment of the tap itself.
          a=s.find('function requestMemberAppInstall() {')
          if a<0:
              raise SystemExit('requestMemberAppInstall missing')
          brace=s.find('{',a)
          after=s[brace+1:brace+120]
          if 'publishMemberAppInstallButtonRect();' not in after:
              s=s[:brace+1]+"\n  publishMemberAppInstallButtonRect();"+s[brace+1:]

          # Diagnostic (temporary): show immediately, without waiting for a parent reply,
          # whether postUnifiedMemberMessage actually attempted the send and what
          # window.top/window.parent look like from inside this frame. This splits the
          # "no reaction at all" symptom into send-side vs receive-side.
          a=s.find('function openMemberInstallInChrome(installUrl) {')
          if a<0:
              raise SystemExit('openMemberInstallInChrome missing')
          ofn_block,ofn_start,ofn_end=extract_block(s,a)
          old_inner='\n'.join([
            '  if (isUnifiedMemberFrame()) {',
            "    postUnifiedMemberMessage('JAYUMINTON_APP_INSTALL_REQUEST', {",
            "      platform: 'android',",
            '      browserContext: detectMemberInstallBrowserContext(),',
            '      installUrl: installUrl',
            '    });',
            '    return;',
            '  }',
          ])
          if old_inner not in ofn_block:
              raise SystemExit('openMemberInstallInChrome inner block mismatch')
          new_inner='\n'.join([
            '  if (isUnifiedMemberFrame()) {',
            "    var __sendOk = postUnifiedMemberMessage('JAYUMINTON_APP_INSTALL_REQUEST', {",
            "      platform: 'android',",
            '      browserContext: detectMemberInstallBrowserContext(),',
            '      installUrl: installUrl',
            '    });',
            "    showMemberSettingMessage('[진단A] 전송=' + __sendOk + ' top!=window:' + (window.top !== window) + ' top!=parent:' + (window.top !== window.parent));",
            '    return;',
            '  }',
          ])
          ofn_block=ofn_block.replace(old_inner,new_inner,1)
          s=s[:ofn_start]+ofn_block+s[ofn_end:]

          p.write_text(s,encoding='utf-8')
          PY

          # No debug text may exist after the closing script tag.
          python3 - <<'PY'
          from pathlib import Path
          s=Path('Script.html').read_text(encoding='utf-8')
          if s.rstrip().endswith('</script>') is False:
              raise SystemExit('Script.html has visible text after </script>')
          if re := __import__('re'):
              if re.search(r'^//\s*v1637-.*-main\s*$', s, re.M):
                  raise SystemExit('Visible v1637 debug marker remains')
          a=s.find('function openMemberInstallInChrome(installUrl) {')
          b=s.find('function openMemberInstallInSafari(installUrl) {',a)
          if 'intent://' in s[a:b]:
              raise SystemExit('MAIN still launches intent://')
          PY

          clasp push --force
          clasp create-deployment --deploymentId "$MAIN_DEPLOYMENT_ID" --description "v1.6.37 real Chrome tap final8 ${GITHUB_SHA::7}"

      - name: Verify MAIN endpoint and no visible debug text
        shell: bash
        run: |
          set -euo pipefail
          sleep 7
          BODY="$RUNNER_TEMP/main.html"
          FINAL="$RUNNER_TEMP/main-url.txt"
          curl --fail --location --retry 5 --retry-delay 3 --max-time 90 --output "$BODY" --write-out '%{url_effective}' "$MAIN_URL?mode=user&app=user&verify=$GITHUB_RUN_ID" > "$FINAL"
          if grep -Eiq 'drive\.google\.com|docs\.google\.com' "$FINAL"; then echo 'Drive redirect'; cat "$FINAL"; exit 1; fi
          for key in memberSelfSearchInput memberSelfMatches memberAlertToggle memberVibrationToggle memberAppInstallToggle memberSelfDone; do grep -F "$key" "$BODY" >/dev/null; done
          if grep -E '// v1637-final[0-9]+-main' "$BODY" >/dev/null; then echo 'Visible debug marker still live'; exit 1; fi

      - name: Build from the real v1.6.37 PWA source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$BUILD_ROOT" && mkdir -p "$BUILD_ROOT/web-push"
          cp deployment/jayuminton/firebase.json "$BUILD_ROOT/firebase.json"
          cp deployment/jayuminton/v1637-web/index.html "$BUILD_ROOT/web-push/index.html"
          cp deployment/jayuminton/v1637-web/setup-v205.css "$BUILD_ROOT/web-push/setup-v205.css"
          cp deployment/jayuminton/v1637-web/manifest.webmanifest "$BUILD_ROOT/web-push/manifest.webmanifest"
          cp deployment/jayuminton/v1637-web/firebase-messaging-sw.js "$BUILD_ROOT/web-push/firebase-messaging-sw.js"
          cat deployment/jayuminton/v1637-web/setup-v205.js.gz.b64.part-* | tr -d '\r\n' | base64 -d > "$RUNNER_TEMP/setup-v205.js.gz"
          gzip -dc "$RUNNER_TEMP/setup-v205.js.gz" > "$BUILD_ROOT/web-push/setup-v205.js"

          printf '%s  %s\n' \
            '89f3203c79f62e32aabfeaeee275a3b1fd425326fd1f66866c95a58d91cb559d' "$BUILD_ROOT/web-push/index.html" \
            '5e5483ec6a1554d028587ec48cc750c56e4d75b05330a57221201352cda6500f' "$BUILD_ROOT/web-push/setup-v205.css" \
            '53828f38565e057b865750b9fbf66737b8841451ac4afebc34150b0f93d8fd9b' "$BUILD_ROOT/web-push/setup-v205.js" \
            'd1bad15093aa92ab3ab89097e2bb783763666350b4fcba5c24f5365e6d53de5a' "$BUILD_ROOT/web-push/manifest.webmanifest" \
            '2b8fea2e2051fd265ec2e5d4ef1f988e149e4575f252c2a3d18b2020913278b1' "$BUILD_ROOT/web-push/firebase-messaging-sw.js" | sha256sum --check

          python3 - <<'PY'
          import os
          from pathlib import Path
          root=Path(os.environ['BUILD_ROOT'])/'web-push'
          p=root/'setup-v205.js'
          s=p.read_text(encoding='utf-8')

          # Real v1.6.37 direct anchor behavior must exist before patching.
          required=[
            "appInstallChromeLink.addEventListener('click', handleEmbeddedChromeLinkClick);",
            "appInstallChromeLink.addEventListener('touchstart'",
            "appInstallChromeLink.setAttribute('target', '_top');",
            "appInstallChromeLink.href = links.intentUrl;"
          ]
          for marker in required:
              if marker not in s:
                  raise SystemExit('Real v1.6.37 Chrome anchor marker missing: '+marker)

          # Whitespace-independent function/block extraction. Exact triple-quoted string
          # matching previously broke this step ("intent block changed unexpectedly")
          # whenever indentation differed by even one space.
          def extract_block(src, start_idx):
              brace_open = src.find('{', start_idx)
              depth = 0
              i = brace_open
              while i < len(src):
                  if src[i] == '{':
                      depth += 1
                  elif src[i] == '}':
                      depth -= 1
                      if depth == 0:
                          return src[start_idx:i+1], start_idx, i+1
                  i += 1
              raise SystemExit('unbalanced braces from '+str(start_idx))

          # Keep the real anchor intent, but remove browser_fallback_url completely.
          a=s.find('function buildAndroidChromeIntent() {')
          if a<0:
              raise SystemExit('buildAndroidChromeIntent function missing')
          block,bstart,bend=extract_block(s,a)
          if 'S.browser_fallback_url' not in block:
              raise SystemExit('v1.6.37 intent block changed unexpectedly (fallback param not found)')
          new_block="""function buildAndroidChromeIntent() {
            const target = buildChromeUserTarget();
            const targetUrl = target.toString();
            const hostAndPath = target.host + target.pathname + target.search + target.hash;
            const intentUrl = 'intent://' + hostAndPath +
              '#Intent;scheme=https;package=com.android.chrome;action=android.intent.action.VIEW;' +
              'category=android.intent.category.BROWSABLE;end';
            return { targetUrl, intentUrl };
          }"""
          s=s[:bstart]+new_block+s[bend:]

          # A postMessage/timer is not a trusted tap. Never turn it into same-page navigation.
          a=s.find('function launchChromeFromFirebaseTop() {')
          if a<0:
              raise SystemExit('launchChromeFromFirebaseTop function missing')
          fn_block,fstart,fend=extract_block(s,a)
          ifa=fn_block.find('if (!hasActivation) {')
          if ifa<0:
              raise SystemExit('v1.6.37 activation fallback block changed unexpectedly (guard not found)')
          if_block,istart,iend=extract_block(fn_block,ifa)
          if 'window.location.href = links.targetUrl' not in if_block:
              raise SystemExit('v1.6.37 activation fallback block changed unexpectedly (same-page refresh not found)')
          new_if="""if (!hasActivation) {
              setInstallMessage('앱설치 버튼을 다시 눌러 Chrome으로 이동해 주세요.', 'success');
              sendAppInstallStatus('Chrome 직접 터치 대기');
              refreshInstallProxyPosition();
              return;
            }"""
          fn_block=fn_block[:istart]+new_if+fn_block[iend:]
          s=s[:fstart]+fn_block+s[fend:]

          # Apps Script wraps the served MAIN page in its own googleusercontent.com sandbox
          # iframe, so a real postMessage's event.source is one level deeper than
          # frame.contentWindow, so it always failed this check and got silently dropped
          # (this is why the diagnostic showed "전송=true" but nothing ever happened next).
          # postMessage's own targetOrigin is already the real security boundary, so this
          # becomes an origin allow-list instead of a brittle exact-window-identity check.
          old_guard='\n'.join([
            '  function handleCourtMessage(event) {',
            '    if (event.source !== frame.contentWindow) return;',
          ])
          if old_guard not in s:
              raise SystemExit('handleCourtMessage guard changed unexpectedly')
          new_guard='\n'.join([
            '  function handleCourtMessage(event) {',
            '    const originOk = event.source === frame.contentWindow ||',
            "      /^https:\\/\\/([a-z0-9-]+\\.)*(script\\.google\\.com|googleusercontent\\.com)$/i.test(String(event.origin || ''));",
            '    if (!originOk) return;',
          ])
          s=s.replace(old_guard,new_guard,1)

          # If the iframe button receives a tap instead of the transparent real link,
          # do not refresh/reopen this Firebase page. Re-arm the real top-level link only.
          import re
          pattern=re.compile(
            r"(\}\s*else if\s*\(data\.type === 'JAYUMINTON_APP_INSTALL_REQUEST'\)\s*\{\n)(\s*)handleAppInstallButton\(true\);\n"
          )
          m=pattern.search(s)
          if not m:
              raise SystemExit('install request message block changed unexpectedly')
          indent=m.group(2)
          replacement=(
            m.group(1)
            +indent+"if (androidDevice && embeddedBrowser) {\n"
            +indent+"  refreshInstallProxyPosition();\n"
            +indent+"  var __r=lastInstallButtonRect;\n"
            +indent+"  var __diag='[진단1] rect='+(__r?(__r.visible?'보임':'숨김')+' '+Math.round(__r.left)+','+Math.round(__r.top)+' '+Math.round(__r.width)+'x'+Math.round(__r.height):'없음')+' link.hidden='+appInstallChromeLink.hidden;\n"
            +indent+"  setInstallMessage(__diag, 'success');\n"
            +indent+"  sendAppInstallStatus(__diag);\n"
            +indent+"  return;\n"
            +indent+"}\n"
            +indent+"sendAppInstallStatus('[진단2] 오버레이 대신 원버튼 재클릭 감지');\n"
            +indent+"handleAppInstallButton(true);\n"
          )
          s=s[:m.start()]+replacement+s[m.end():]

          # Diagnostic: confirm whether the real top-level anchor is actually the element
          # that receives the 2nd tap (if this text never appears, the overlay is being
          # missed and the tap keeps landing on the original button instead).
          a=s.find('function handleEmbeddedChromeLinkClick() {')
          if a<0:
              raise SystemExit('handleEmbeddedChromeLinkClick missing')
          cblock,cstart,cend=extract_block(s,a)
          new_cblock="""function handleEmbeddedChromeLinkClick() {
            setInstallMessage('[진단3] 투명링크 실제로 클릭됨 → Chrome 이동 시도', 'success');
            sendAppInstallStatus('[진단3] 투명링크 클릭됨');
          }"""
          s=s[:cstart]+new_cblock+s[cend:]

          # Uninstalling a PWA does not clear localStorage. Clear stale installed state only
          # when Chrome itself proves the app is installable again.
          anchor_pattern=re.compile(
            r"(\s*)deferredInstallPrompt = event;\n(\s*)window\.__JAYUMINTON_EARLY_INSTALL_PROMPT = null;\n"
          )
          m2=anchor_pattern.search(s)
          if not m2:
              raise SystemExit('beforeinstallprompt anchor missing')
          indent1,indent2=m2.group(1),m2.group(2)
          new_anchor=(
            indent1+"deferredInstallPrompt = event;\n"
            +indent1+"try {\n"
            +indent1+"  localStorage.removeItem(STORAGE.installConfirmed);\n"
            +indent1+"  if (localStorage.getItem(STORAGE.installChoice) === 'on') localStorage.removeItem(STORAGE.installChoice);\n"
            +indent1+"} catch (_) {}\n"
            +indent2+"window.__JAYUMINTON_EARLY_INSTALL_PROMPT = null;\n"
          )
          s=s[:m2.start()]+new_anchor+s[m2.end():]

          p.write_text(s,encoding='utf-8')

          # Cache bust only; visible DOM/CSS/layout are unchanged.
          idx=root/'index.html'
          t=idx.read_text(encoding='utf-8')
          t=t.replace('/setup-v205.js?v=1637','/setup-v205.js?v=1637-final8')
          t=t.replace('/config-v204.js?v=1637','/config-v204.js?v=1637-final8')
          idx.write_text(t,encoding='utf-8')

          template=Path('deployment/jayuminton/v1637-web/config-v204.template.js').read_text(encoding='utf-8')
          cfg=template.replace('__MEMBER_PAGE_URL__',os.environ['MAIN_URL']).replace('__RELAY_URL__',os.environ['PUSH_URL'])
          for name in ('config-v202.js','config-v203.js','config-v204.js'):
              (root/name).write_text(cfg,encoding='utf-8')

          sw=root/'firebase-messaging-sw.js'
          t=sw.read_text(encoding='utf-8')
          t=t.replace("const JAYUMINTON_SW_VERSION = '1.6.37';","const JAYUMINTON_SW_VERSION = '1.6.37-final8';")
          t=t.replace("const JAYUMINTON_CACHE = 'jayuminton-shell-v205';","const JAYUMINTON_CACHE = 'jayuminton-shell-v218';")
          sw.write_text(t,encoding='utf-8')
          PY

          node --check "$BUILD_ROOT/web-push/setup-v205.js"
          grep -F "appInstallChromeLink.addEventListener('click', handleEmbeddedChromeLinkClick);" "$BUILD_ROOT/web-push/setup-v205.js" >/dev/null
          grep -F "appInstallChromeLink.addEventListener('touchstart'" "$BUILD_ROOT/web-push/setup-v205.js" >/dev/null
          grep -F "appInstallChromeLink.setAttribute('target', '_top');" "$BUILD_ROOT/web-push/setup-v205.js" >/dev/null
          grep -F 'appInstallChromeLink.href = links.intentUrl' "$BUILD_ROOT/web-push/setup-v205.js" >/dev/null
          grep -F 'promptResult = promptEvent.prompt()' "$BUILD_ROOT/web-push/setup-v205.js" >/dev/null
          if grep -F 'S.browser_fallback_url' "$BUILD_ROOT/web-push/setup-v205.js" >/dev/null; then echo 'Drive-risk fallback remains'; exit 1; fi
          if grep -F 'window.location.href = links.targetUrl' "$BUILD_ROOT/web-push/setup-v205.js" >/dev/null; then echo 'Same-page refresh fallback remains'; exit 1; fi

          BASE="${HOSTING_URL%/}"
          for a in icon-198.png icon-512.png apple-touch-icon-180.png badge-96.png; do
            curl --fail --location --retry 3 --max-time 60 "$BASE/$a?src=$GITHUB_RUN_ID" -o "$BUILD_ROOT/web-push/$a"
            test -s "$BUILD_ROOT/web-push/$a"
          done

      - name: Deploy Firebase Hosting
        working-directory: ${{ env.BUILD_ROOT }}
        run: firebase deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive --message "real v1.6.37 Chrome tap final8 ${GITHUB_SHA::7}"

      - name: Verify live Firebase after propagation
        shell: bash
        run: |
          set -euo pipefail
          sleep 8
          BASE="${HOSTING_URL%/}"
          BUST="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-final8"
          curl --fail --location -H 'Cache-Control: no-cache' "$BASE/?v=$BUST" > "$RUNNER_TEMP/index"
