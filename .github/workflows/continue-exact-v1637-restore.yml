name: Continue exact Jayuminton v1.6.37 restore

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/continue-exact-v1637-restore.yml'
      - 'deployment/jayuminton/exact-v1637-web/**'
      - 'deployment/jayuminton/v1637-source/**'

permissions:
  contents: read

concurrency:
  group: jayuminton-exact-v1637-live
  cancel-in-progress: true

jobs:
  deploy:
    name: Restore original controls and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up deployment tools
        shell: bash
        run: |
          set -euo pipefail
          test -n "$JAYUMINTON_DEPLOY_CONFIG_JSON"
          test -n "$CLASPRC_JSON"
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global @google/clasp@latest firebase-tools@latest
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Read config
        shell: bash
        run: |
          set -euo pipefail
          CONFIG="$RUNNER_TEMP/deploy.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$CONFIG"
          jq -e '.mainScriptId and .mainDeploymentId and .pushScriptId and .pushDeploymentId and .firebaseProjectId and .hostingUrl' "$CONFIG" >/dev/null
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          {
            echo "MAIN_SCRIPT_ID=$(jq -r '.mainScriptId' "$CONFIG")"
            echo "MAIN_DEPLOYMENT_ID=$(jq -r '.mainDeploymentId' "$CONFIG")"
            echo "PUSH_SCRIPT_ID=$(jq -r '.pushScriptId' "$CONFIG")"
            echo "PUSH_DEPLOYMENT_ID=$(jq -r '.pushDeploymentId' "$CONFIG")"
            echo "FIREBASE_PROJECT_ID=$(jq -r '.firebaseProjectId' "$CONFIG")"
            echo "HOSTING_URL=$(jq -r '.hostingUrl' "$CONFIG")"
            echo "MAIN_URL=https://script.google.com/macros/s/$(jq -r '.mainDeploymentId' "$CONFIG")/exec"
            echo "PUSH_URL=https://script.google.com/macros/s/$(jq -r '.pushDeploymentId' "$CONFIG")/exec"
            echo "BUILD_ROOT=$RUNNER_TEMP/v1637-build"
          } >> "$GITHUB_ENV"

      - name: Restore exact original MAIN design and position
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/v1637-source"
          rm -rf "$ROOT" && mkdir -p "$ROOT"
          cat deployment/jayuminton/v1637-source/part-*.b64 | tr -d '\r\n' | base64 -d > "$RUNNER_TEMP/src.gz"
          gzip -dc "$RUNNER_TEMP/src.gz" > "$RUNNER_TEMP/src.tar"
          tar -xf "$RUNNER_TEMP/src.tar" -C "$ROOT"
          INDEX="$(find "$ROOT" -type f -name Index.html | head -n1)"
          SRC="$(dirname "$INDEX")"
          for f in Admin.html Code.gs Index.html Script.html Style.html; do test -s "$SRC/$f"; done
          printf '%s  %s\n' \
            '34d5a1469b1abdefc57fe3ca2395fe3ec6c00ef6cd14855fb554af70086e38d0' "$SRC/Admin.html" \
            '7342d7051bf125f771c5951e4c54f114f9eb57949327d874be63e6ba5781522b' "$SRC/Code.gs" \
            '6b61b90e1b6a0955ba0c00524e3556605f46eafa3b969f60a3c420aeb654ae6c' "$SRC/Index.html" \
            '05163359efbcc64c4308bcb8cd42a490441f2012eaa84ea01eae128dd67a5441' "$SRC/Script.html" \
            'f74408c53654e38ff1646f31693b1ed6701e6a625efeb28258edc62bffe12625' "$SRC/Style.html" | sha256sum --check
          grep -F '>알림 ON</button>' "$SRC/Index.html"
          grep -F '>진동 ON</button>' "$SRC/Index.html"
          grep -F '>앱/웹</button>' "$SRC/Index.html"
          grep -F '>완료</button>' "$SRC/Index.html"
          grep -F 'grid-template-columns:repeat(4,minmax(0,1fr))!important' "$SRC/Style.html"
          grep -F 'height:28px!important' "$SRC/Style.html"
          grep -F 'gap:3px!important' "$SRC/Style.html"

          WORK="$RUNNER_TEMP/main"
          rm -rf "$WORK" && mkdir -p "$WORK"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$MAIN_SCRIPT_ID" > "$WORK/.clasp.json"
          cd "$WORK"
          clasp pull
          find . -maxdepth 1 -type f \( -name '*.js' -o -name '*.gs' -o -name '*.html' \) -delete
          cp "$SRC/Admin.html" "$SRC/Code.gs" "$SRC/Index.html" "$SRC/Script.html" "$SRC/Style.html" .
          clasp push --force
          clasp create-deployment --deploymentId "$MAIN_DEPLOYMENT_ID" --description "v1.6.37 original controls ${GITHUB_SHA::7}"

      - name: Refresh PUSH deployment
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/push"
          rm -rf "$WORK" && mkdir -p "$WORK"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$PUSH_SCRIPT_ID" > "$WORK/.clasp.json"
          cd "$WORK"
          clasp pull
          clasp create-deployment --deploymentId "$PUSH_DEPLOYMENT_ID" --description "v1.6.37 ${GITHUB_SHA::7}"

      - name: Verify live original buttons and their position
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          BODY="$RUNNER_TEMP/main.html"
          FINAL="$RUNNER_TEMP/main-url.txt"
          curl --fail --location --retry 5 --retry-delay 3 --max-time 90 --output "$BODY" --write-out '%{url_effective}' "$MAIN_URL?mode=user&app=user&v=$GITHUB_RUN_ID" > "$FINAL"
          if grep -Eiq 'drive\.google\.com|docs\.google\.com|주소를 확인한 다음 다시 시도|요청한 파일이 존재하지' "$FINAL" "$BODY"; then exit 1; fi
          python3 - "$BODY" <<'PY'
          import sys
          s=open(sys.argv[1],encoding='utf-8').read()
          keys=['memberSelfSearchInput','memberSelfMatches','memberAlertToggle','memberVibrationToggle','memberAppInstallToggle','memberSelfDone','queue-panel']
          p=[s.find(k) for k in keys]
          if any(x<0 for x in p) or p!=sorted(p): raise SystemExit('original control position/order missing: '+str(list(zip(keys,p))))
          for x in ['알림 ON','진동 ON','앱/웹','완료','grid-template-columns:repeat(4,minmax(0,1fr))!important','height:28px!important','gap:3px!important']:
              if x not in s: raise SystemExit('original design marker missing: '+x)
          PY

      - name: Build and deploy exact PWA
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$BUILD_ROOT" && mkdir -p "$BUILD_ROOT/web-push"
          cp deployment/jayuminton/firebase.json "$BUILD_ROOT/firebase.json"
          cp deployment/jayuminton/exact-v1637-web/index.html "$BUILD_ROOT/web-push/index.html"
          cp deployment/jayuminton/exact-v1637-web/setup-v205.css "$BUILD_ROOT/web-push/setup-v205.css"
          cat deployment/jayuminton/exact-v1637-web/setup-v205.js.part-* > "$BUILD_ROOT/web-push/setup-v205.js"
          cp deployment/jayuminton/exact-v1637-web/config-v204.js "$BUILD_ROOT/web-push/config-v204.js"
          cp deployment/jayuminton/exact-v1637-web/manifest.webmanifest "$BUILD_ROOT/web-push/manifest.webmanifest"
          cp deployment/jayuminton/exact-v1637-web/firebase-messaging-sw.js "$BUILD_ROOT/web-push/firebase-messaging-sw.js"
          printf '%s  %s\n' 'ca0b8d7fbb11179638abe211af282100731cd1ad4246c66f561472dfddc238f0' "$BUILD_ROOT/web-push/setup-v205.js" | sha256sum --check
          ! grep -F 'S.browser_fallback_url' "$BUILD_ROOT/web-push/setup-v205.js"
          node --check "$BUILD_ROOT/web-push/setup-v205.js"
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ['BUILD_ROOT'])/'web-push'/'config-v204.js'
          s=p.read_text(encoding='utf-8').replace('__MEMBER_PAGE_URL__',os.environ['MAIN_URL']).replace('__RELAY_URL__',os.environ['PUSH_URL'])
          p.write_text(s,encoding='utf-8')
          PY
          BASE="${HOSTING_URL%/}"
          for a in icon-198.png icon-512.png apple-touch-icon-180.png badge-96.png; do curl --fail --location --retry 3 "$BASE/$a?src=$GITHUB_RUN_ID" -o "$BUILD_ROOT/web-push/$a"; done
          cd "$BUILD_ROOT"
          firebase deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive --message "v1.6.37 original controls ${GITHUB_SHA::7}"

      - name: Verify Firebase fix
        shell: bash
        run: |
          set -euo pipefail
          BASE="${HOSTING_URL%/}"
          curl --fail --location -H 'Cache-Control: no-cache' "$BASE/setup-v205.js?verify=$GITHUB_RUN_ID" > "$RUNNER_TEMP/setup.js"
          curl --fail --location -H 'Cache-Control: no-cache' "$BASE/config-v204.js?verify=$GITHUB_RUN_ID" > "$RUNNER_TEMP/config.js"
          ! grep -F 'S.browser_fallback_url' "$RUNNER_TEMP/setup.js"
          grep -F "$MAIN_URL" "$RUNNER_TEMP/config.js"
          grep -F "$PUSH_URL" "$RUNNER_TEMP/config.js"
