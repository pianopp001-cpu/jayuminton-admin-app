name: Continue exact Jayuminton v1.6.37 restore

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/continue-exact-v1637-restore.yml'
      - 'deployment/jayuminton/exact-v1637-web/**'

permissions:
  contents: write

concurrency:
  group: jayuminton-exact-v1637-direct-live
  cancel-in-progress: true

jobs:
  deploy:
    name: Keep v1.6.37 design and fix behavior only
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global @google/clasp@latest firebase-tools@latest
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Read config
        shell: bash
        run: |
          set -euo pipefail
          CONFIG="$RUNNER_TEMP/deploy.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$CONFIG"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          jq -e '.mainScriptId and .mainDeploymentId and .pushDeploymentId and .firebaseProjectId and .hostingUrl' "$CONFIG" >/dev/null
          {
            echo "MAIN_SCRIPT_ID=$(jq -r '.mainScriptId' "$CONFIG")"
            echo "MAIN_DEPLOYMENT_ID=$(jq -r '.mainDeploymentId' "$CONFIG")"
            echo "MAIN_URL=https://script.google.com/macros/s/$(jq -r '.mainDeploymentId' "$CONFIG")/exec"
            echo "PUSH_URL=https://script.google.com/macros/s/$(jq -r '.pushDeploymentId' "$CONFIG")/exec"
            echo "FIREBASE_PROJECT_ID=$(jq -r '.firebaseProjectId' "$CONFIG")"
            echo "HOSTING_URL=$(jq -r '.hostingUrl' "$CONFIG")"
            echo "BUILD_ROOT=$RUNNER_TEMP/v1637-final-behavior"
          } >> "$GITHUB_ENV"

      - name: Patch MAIN behavior only
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/main"
          rm -rf "$WORK" && mkdir -p "$WORK"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$MAIN_SCRIPT_ID" > "$WORK/.clasp.json"
          cd "$WORK"
          clasp pull

          # Visible UI files must remain byte-for-byte v1.6.37.
          printf '%s  %s\n' \
            '34d5a1469b1abdefc57fe3ca2395fe3ec6c00ef6cd14855fb554af70086e38d0' Admin.html \
            '7342d7051bf125f771c5951e4c54f114f9eb57949327d874be63e6ba5781522b' Code.js \
            '6b61b90e1b6a0955ba0c00524e3556605f46eafa3b969f60a3c420aeb654ae6c' Index.html \
            'f74408c53654e38ff1646f31693b1ed6701e6a625efeb28258edc62bffe12625' Style.html | sha256sum --check

          python3 - <<'PY'
          from pathlib import Path
          p=Path('Script.html')
          s=p.read_text(encoding='utf-8')

          # v1.6.40 proven Android Chrome handoff: Firebase origin only, no browser_fallback_url.
          a=s.find('function openMemberInstallInChrome(installUrl) {')
          b=s.find('function openMemberInstallInSafari(installUrl) {', a)
          if a < 0 or b < 0:
              raise SystemExit('Chrome install function not found')
          fixed="""function openMemberInstallInChrome(installUrl) {
            try {
              const target = new URL(installUrl);
              if (target.origin !== UNIFIED_MEMBER_APP_ORIGIN) throw new Error('invalid member app origin');
              target.searchParams.set('install', '1');
              target.searchParams.set('external', '1');
              target.searchParams.set('source', 'chrome');
              target.searchParams.set('app', 'user');
              target.searchParams.set('mode', 'user');
              const hostPath = target.host + target.pathname + target.search + target.hash;
              navigateMemberTop('intent://' + hostPath +
                '#Intent;scheme=https;package=com.android.chrome;action=android.intent.action.VIEW;' +
                'category=android.intent.category.BROWSABLE;end');
              return;
            } catch (error) {}
            navigateMemberTop('intent://jayuminton-push.web.app/?install=1&external=1&source=chrome&app=user&mode=user' +
              '#Intent;scheme=https;package=com.android.chrome;action=android.intent.action.VIEW;' +
              'category=android.intent.category.BROWSABLE;end');
          }

          """
          s=s[:a]+fixed+s[b:]

          # User name editing fix: while the visible search input has focus, never put the old saved name back.
          old="if (input && selected && !input.value) input.value = selected.name;"
          new="if (input && selected && !input.value && document.activeElement !== input) input.value = selected.name;"
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('member name autofill line not found')

          p.write_text(s,encoding='utf-8')
          PY

          grep -F "target.searchParams.set('source', 'chrome')" Script.html >/dev/null
          grep -F 'category=android.intent.category.BROWSABLE;end' Script.html >/dev/null
          grep -F 'document.activeElement !== input' Script.html >/dev/null
          ! grep -F 'S.browser_fallback_url' Script.html >/dev/null
          clasp push --force
          clasp create-deployment --deploymentId "$MAIN_DEPLOYMENT_ID" --description "v1.6.37 UI + Drive/name fix ${GITHUB_SHA::7}"

      - name: Build PWA behavior fix
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$BUILD_ROOT" && mkdir -p "$BUILD_ROOT/web-push"
          cp deployment/jayuminton/firebase.json "$BUILD_ROOT/firebase.json"
          cp deployment/jayuminton/exact-v1637-web/index.html "$BUILD_ROOT/web-push/index.html"
          cp deployment/jayuminton/exact-v1637-web/setup-v205.css "$BUILD_ROOT/web-push/setup-v205.css"
          cat deployment/jayuminton/exact-v1637-web/setup-v205.js.part-* > "$BUILD_ROOT/web-push/setup-v205.js"
          cp deployment/jayuminton/exact-v1637-web/config-v204.js "$BUILD_ROOT/web-push/config-v204.js"
          cp deployment/jayuminton/exact-v1637-web/manifest.webmanifest "$BUILD_ROOT/web-push/manifest.webmanifest"
          cp deployment/jayuminton/exact-v1637-web/firebase-messaging-sw.js "$BUILD_ROOT/web-push/firebase-messaging-sw.js"

          python3 - <<'PY'
          import os,re
          from pathlib import Path
          root=Path(os.environ['BUILD_ROOT'])/'web-push'
          p=root/'setup-v205.js'
          s=p.read_text(encoding='utf-8')

          # Never preserve a false installed state after the PWA has been deleted.
          anchor="  syncStandaloneInstallState();\n  frame.src = userOnlyMemberPageUrl(cfg.memberPageUrl, transferredMemberSession) || 'about:blank';\n"
          if anchor in s:
              s=s.replace(anchor,"""  syncStandaloneInstallState();
          if (!isStandaloneApp()) {
            try {
              localStorage.removeItem(STORAGE.installConfirmed);
              if (localStorage.getItem(STORAGE.installChoice) === 'on') localStorage.removeItem(STORAGE.installChoice);
            } catch (_) {}
          }
          frame.src = userOnlyMemberPageUrl(cfg.memberPageUrl, transferredMemberSession) || 'about:blank';
          """,1)

          # memberId/memberName are a one-time Chrome handoff only. Remove them from the address
          # immediately after importing so a later reload cannot resurrect the old user.
          handoff_marker="""  if ((!member || !member.id) && query.get('memberId') && query.get('memberName')) {
            member = {id:String(query.get('memberId')), name:String(query.get('memberName'))};
            saveJson(STORAGE.member, member);
          }
          if (member && member.name) nameInput.value = shortName(member.name);
          """
          if 'member-handoff-consumed' not in s:
              if handoff_marker not in s:
                  raise SystemExit('member handoff block missing')
              handoff_fix="""  if ((!member || !member.id) && query.get('memberId') && query.get('memberName')) {
            member = {id:String(query.get('memberId')), name:String(query.get('memberName'))};
            saveJson(STORAGE.member, member);
          }
          if (query.has('memberId') || query.has('memberName')) {
            try {
              query.delete('memberId');
              query.delete('memberName');
              const cleanMemberUrl = window.location.pathname + (query.toString() ? '?' + query.toString() : '') + window.location.hash;
              window.history.replaceState({}, document.title, cleanMemberUrl);
            } catch (_) {}
          }
          // member-handoff-consumed
          if (member && member.name) nameInput.value = shortName(member.name);
          """
              s=s.replace(handoff_marker,handoff_fix,1)

          # Typing another name releases the old saved member instead of forcing it back.
          if 'typedMatchesSavedMember' not in s:
              marker="  connectButton.addEventListener('click', handleAlarmButton);\n"
              if marker not in s: raise SystemExit('name listener marker missing')
              s=s.replace(marker,"""  connectButton.addEventListener('click', handleAlarmButton);
          nameInput.addEventListener('input', () => {
            const typed = firstTwoSearchChars(nameInput.value);
            const saved = member && member.name ? firstTwoSearchChars(member.name) : '';
            if (member && typed && typed !== saved) {
              member = null;
              try { localStorage.removeItem(STORAGE.member); } catch (_) {}
              isConnected = false;
              setOff('새 이름을 입력한 뒤 아래 말풍선에서 본인을 눌러 주세요.');
              sendBootstrap();
            }
          });
          """,1)
              pat=re.compile(r"    const exactSelected = member && member\.id\n      \? members\.find\(\(item\) => String\(item\.id\) === String\(member\.id\)\)\n      : null;\n    const matches = exactSelected\n      \? \[exactSelected\]\n      : members\.filter\(\(item\) => firstTwoSearchChars\(item\.name\) === typed\);",re.M)
              rep="""    const typedMatchesSavedMember = Boolean(
              member && member.id && firstTwoSearchChars(member.name) === typed
            );
            const exactSelected = typedMatchesSavedMember
              ? members.find((item) => String(item.id) === String(member.id))
              : null;
            const matches = exactSelected
              ? [exactSelected]
              : members.filter((item) => firstTwoSearchChars(item.name) === typed);"""
              s,n=pat.subn(rep,s,count=1)
              if n!=1: raise SystemExit('saved member search block missing')

          # Selecting another speech-bubble result replaces the old user and token.
          if 'const memberChanged = Boolean' not in s:
              branch=s.find("} else if (data.type === 'JAYUMINTON_MEMBER_SELECTED' || data.type === 'JAYUMINTON_MEMBER_CLICKED') {")
              if branch<0: raise SystemExit('member selected branch missing')
              pat=re.compile(r"        member = \{id:String\(data\.member\.id\), name:String\(data\.member\.name\)\};\n        saveJson\(STORAGE\.member, member\);\n        nameInput\.value = shortName\(member\.name\);",re.M)
              m=pat.search(s,branch,branch+1400)
              if not m: raise SystemExit('member assignment missing')
              rep="""        const nextMember = {id:String(data.member.id), name:String(data.member.name)};
                const memberChanged = Boolean(member && String(member.id) !== String(nextMember.id));
                member = nextMember;
                saveJson(STORAGE.member, member);
                nameInput.value = shortName(member.name);
                if (memberChanged) {
                  try { localStorage.removeItem(STORAGE.token); } catch (_) {}
                  isConnected = false;
                  setOff(member.name + '님으로 변경했습니다. 완료를 눌러 알림을 다시 연결해 주세요.');
                }"""
              s=s[:m.start()]+rep+s[m.end():]

          p.write_text(s+'\n// v1637-drive-name-final4\n',encoding='utf-8')

          # Cache-bust behavior only. DOM/CSS/layout are unchanged.
          idx=root/'index.html'
          t=idx.read_text(encoding='utf-8')
          t=t.replace('/setup-v205.js?v=1637','/setup-v205.js?v=1637-final4')
          t=t.replace('/config-v204.js?v=1637','/config-v204.js?v=1637-final4')
          idx.write_text(t,encoding='utf-8')

          cfg=root/'config-v204.js'
          t=cfg.read_text(encoding='utf-8').replace('__MEMBER_PAGE_URL__',os.environ['MAIN_URL']).replace('__RELAY_URL__',os.environ['PUSH_URL'])
          cfg.write_text(t,encoding='utf-8')

          sw=root/'firebase-messaging-sw.js'
          t=sw.read_text(encoding='utf-8').replace("const JAYUMINTON_SW_VERSION = '1.6.37-fix1';","const JAYUMINTON_SW_VERSION = '1.6.37-final4';").replace("const JAYUMINTON_CACHE = 'jayuminton-shell-v211';","const JAYUMINTON_CACHE = 'jayuminton-shell-v214';")
          sw.write_text(t,encoding='utf-8')
          PY

          node --check "$BUILD_ROOT/web-push/setup-v205.js"
          grep -F 'member-handoff-consumed' "$BUILD_ROOT/web-push/setup-v205.js" >/dev/null
          grep -F 'typedMatchesSavedMember' "$BUILD_ROOT/web-push/setup-v205.js" >/dev/null
          grep -F 'const memberChanged = Boolean' "$BUILD_ROOT/web-push/setup-v205.js" >/dev/null
          grep -F 'promptResult = promptEvent.prompt()' "$BUILD_ROOT/web-push/setup-v205.js" >/dev/null
          grep -F 'appInstallChromeLink.href = links.intentUrl' "$BUILD_ROOT/web-push/setup-v205.js" >/dev/null
          ! grep -F 'S.browser_fallback_url' "$BUILD_ROOT/web-push/setup-v205.js" >/dev/null
          ! grep -F 'window.location.href = links.targetUrl' "$BUILD_ROOT/web-push/setup-v205.js" >/dev/null
          ! grep -F 'drive.google.com' "$BUILD_ROOT/web-push/setup-v205.js" >/dev/null
          ! grep -F 'docs.google.com' "$BUILD_ROOT/web-push/setup-v205.js" >/dev/null

          BASE="${HOSTING_URL%/}"
          for a in icon-198.png icon-512.png apple-touch-icon-180.png badge-96.png; do
            curl --fail --location --retry 3 --max-time 60 "$BASE/$a?src=$GITHUB_RUN_ID" -o "$BUILD_ROOT/web-push/$a"
          done

      - name: Deploy Firebase Hosting
        working-directory: ${{ env.BUILD_ROOT }}
        run: firebase deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive --message "v1.6.37 UI unchanged Drive/name final4 ${GITHUB_SHA::7}"

      - name: Verify live Firebase
        shell: bash
        run: |
          set -euo pipefail
          BASE="${HOSTING_URL%/}"
          curl --fail --location -H 'Cache-Control: no-cache' "$BASE/?v=$GITHUB_RUN_ID" > "$RUNNER_TEMP/index"
          curl --fail --location -H 'Cache-Control: no-cache' "$BASE/setup-v205.js?v=$GITHUB_RUN_ID" > "$RUNNER_TEMP/setup"
          grep -F 'setup-v205.js?v=1637-final4' "$RUNNER_TEMP/index" >/dev/null
          grep -F 'v1637-drive-name-final4' "$RUNNER_TEMP/setup" >/dev/null
          grep -F 'member-handoff-consumed' "$RUNNER_TEMP/setup" >/dev/null
          grep -F 'typedMatchesSavedMember' "$RUNNER_TEMP/setup" >/dev/null
          grep -F 'const memberChanged = Boolean' "$RUNNER_TEMP/setup" >/dev/null
          grep -F 'promptResult = promptEvent.prompt()' "$RUNNER_TEMP/setup" >/dev/null
          ! grep -F 'S.browser_fallback_url' "$RUNNER_TEMP/setup" >/dev/null
          ! grep -F 'window.location.href = links.targetUrl' "$RUNNER_TEMP/setup" >/dev/null

      - name: Record result
        if: always()
        shell: bash
        run: |
          STATUS='${{ job.status }}'
          printf 'status=%s\ncommit=%s\nrun=%s\n' "$STATUS" "$GITHUB_SHA" "$GITHUB_RUN_ID" > deployment/jayuminton/EXACT_V1637_LIVE_RESULT.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment/jayuminton/EXACT_V1637_LIVE_RESULT.txt
          git commit -m "Record exact v1.6.37 Drive/name final4: $STATUS" || exit 0
          git pull --rebase origin main || true
          git push
