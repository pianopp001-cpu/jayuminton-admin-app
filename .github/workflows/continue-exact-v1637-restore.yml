name: Continue exact Jayuminton v1.6.37 restore

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/continue-exact-v1637-restore.yml'
      - 'deployment/jayuminton/exact-v1637-web/**'

permissions:
  contents: write

concurrency:
  group: jayuminton-exact-v1637-direct-live
  cancel-in-progress: true

jobs:
  deploy:
    name: Keep v1.6.37 design and fix name/install only
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global @google/clasp@latest firebase-tools@latest
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Read config
        shell: bash
        run: |
          set -euo pipefail
          CONFIG="$RUNNER_TEMP/deploy.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$CONFIG"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          jq -e '.mainScriptId and .mainDeploymentId and .pushDeploymentId and .firebaseProjectId and .hostingUrl' "$CONFIG" >/dev/null
          {
            echo "MAIN_SCRIPT_ID=$(jq -r '.mainScriptId' "$CONFIG")"
            echo "MAIN_DEPLOYMENT_ID=$(jq -r '.mainDeploymentId' "$CONFIG")"
            echo "MAIN_URL=https://script.google.com/macros/s/$(jq -r '.mainDeploymentId' "$CONFIG")/exec"
            echo "PUSH_URL=https://script.google.com/macros/s/$(jq -r '.pushDeploymentId' "$CONFIG")/exec"
            echo "FIREBASE_PROJECT_ID=$(jq -r '.firebaseProjectId' "$CONFIG")"
            echo "HOSTING_URL=$(jq -r '.hostingUrl' "$CONFIG")"
            echo "BUILD_ROOT=$RUNNER_TEMP/v1637-final5"
          } >> "$GITHUB_ENV"

      - name: Patch MAIN behavior only
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/main"
          rm -rf "$WORK" && mkdir -p "$WORK"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$MAIN_SCRIPT_ID" > "$WORK/.clasp.json"
          cd "$WORK"
          clasp pull

          # Visible design stays byte-for-byte v1.6.37.
          printf '%s  %s\n' \
            '34d5a1469b1abdefc57fe3ca2395fe3ec6c00ef6cd14855fb554af70086e38d0' Admin.html \
            '7342d7051bf125f771c5951e4c54f114f9eb57949327d874be63e6ba5781522b' Code.js \
            '6b61b90e1b6a0955ba0c00524e3556605f46eafa3b969f60a3c420aeb654ae6c' Index.html \
            'f74408c53654e38ff1646f31693b1ed6701e6a625efeb28258edc62bffe12625' Style.html | sha256sum --check

          python3 - <<'PY'
          from pathlib import Path
          p=Path('Script.html')
          s=p.read_text(encoding='utf-8')

          # 1) Apps Script MAIN never launches intent://. This removes the Google Drive misroute path.
          a=s.find('function openMemberInstallInChrome(installUrl) {')
          b=s.find('function openMemberInstallInSafari(installUrl) {',a)
          if a<0 or b<0: raise SystemExit('Chrome install function not found')
          chrome="""function openMemberInstallInChrome(installUrl) {
            if (isUnifiedMemberFrame()) {
              postUnifiedMemberMessage('JAYUMINTON_APP_INSTALL_REQUEST', {
                platform: 'android',
                browserContext: detectMemberInstallBrowserContext(),
                installUrl: installUrl
              });
              return;
            }
            try {
              const target = new URL(installUrl);
              if (target.origin !== UNIFIED_MEMBER_APP_ORIGIN) throw new Error('invalid member app origin');
              target.searchParams.set('install', 'choose');
              target.searchParams.set('external', '1');
              target.searchParams.set('source', 'embedded');
              target.searchParams.set('app', 'user');
              target.searchParams.set('mode', 'user');
              navigateMemberTop(target.toString());
              return;
            } catch (error) {}
            navigateMemberTop(UNIFIED_MEMBER_APP_URL + '?install=choose&external=1&source=embedded&app=user&mode=user');
          }

          """
          s=s[:a]+chrome+s[b:]

          # 2) Opening the compact name setting starts a real edit session with an empty field.
          a=s.find('function openMemberSelfSettings() {')
          b=s.find('function renderMemberSelfSettings() {',a)
          if a<0 or b<0: raise SystemExit('member settings block not found')
          open_edit="""function openMemberSelfSettings() {
            try { localStorage.setItem(MEMBER_SELF_PANEL_COMPACT_KEY, 'false'); }
            catch (error) {}
            const input = document.getElementById('memberSelfSearchInput');
            if (input) {
              input.value = '';
              input.dataset.userEditing = '1';
            }
            renderMemberSelfSettings();
            setTimeout(function() {
              const currentInput = document.getElementById('memberSelfSearchInput');
              if (currentInput) currentInput.focus();
            }, 0);
          }

          """
          s=s[:a]+open_edit+s[b:]

          # Any legacy old-name autofill line must either be guarded or absent.
          old="  if (input && selected && !input.value) input.value = selected.name;"
          focus_old="  if (input && selected && !input.value && document.activeElement !== input) input.value = selected.name;"
          guarded="  if (input && selected && !input.value && input.dataset.userEditing !== '1') input.value = selected.name;"
          if old in s: s=s.replace(old,guarded,1)
          if focus_old in s: s=s.replace(focus_old,guarded,1)

          # Selecting a new speech-bubble result ends edit mode and confirms that member.
          a=s.find('function selectMemberSelf(memberId) {')
          b=s.find('function clearMemberSelfSelection() {',a)
          if a<0 or b<0: raise SystemExit('selectMemberSelf block not found')
          block=s[a:b]
          if "memberInput.dataset.userEditing = '0'" not in block:
              needle="  if (!member) return;\n"
              insert="""  if (!member) return;
            const memberInput = document.getElementById('memberSelfSearchInput');
            if (memberInput) {
              memberInput.dataset.userEditing = '0';
              memberInput.value = String(member.name || '').trim();
            }
          """
              if needle not in block: raise SystemExit('member selection insertion point missing')
              block=block.replace(needle,insert,1)
              s=s[:a]+block+s[b:]

          # Parent bootstrap may update status, but cannot refill the visible edit field.
          p.write_text(s+'\n// v1637-final5-main\n',encoding='utf-8')
          PY

          grep -F 'v1637-final5-main' Script.html >/dev/null
          grep -F "input.dataset.userEditing = '1'" Script.html >/dev/null
          grep -F "memberInput.dataset.userEditing = '0'" Script.html >/dev/null
          if grep -F 'if (input && selected && !input.value) input.value = selected.name;' Script.html >/dev/null; then
            echo 'Old automatic name refill still exists'; exit 1
          fi
          if grep -F 'S.browser_fallback_url' Script.html >/dev/null; then
            echo 'browser_fallback_url still exists in MAIN'; exit 1
          fi
          if grep -F "navigateMemberTop('intent://" Script.html >/dev/null; then
            echo 'MAIN still directly launches intent://'; exit 1
          fi

          clasp push --force
          clasp create-deployment --deploymentId "$MAIN_DEPLOYMENT_ID" --description "v1.6.37 UI final5 name/install ${GITHUB_SHA::7}"

      - name: Verify live MAIN
        shell: bash
        run: |
          set -euo pipefail
          sleep 7
          curl --fail --location --retry 5 --retry-delay 3 --max-time 90 \
            "$MAIN_URL?mode=user&app=user&verify=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/main.html"
          for key in memberSelfSearchInput memberSelfMatches memberAlertToggle memberVibrationToggle memberAppInstallToggle memberSelfDone; do
            grep -F "$key" "$RUNNER_TEMP/main.html" >/dev/null
          done
          grep -F 'v1637-final5-main' "$RUNNER_TEMP/main.html" >/dev/null
          grep -F "input.dataset.userEditing = '1'" "$RUNNER_TEMP/main.html" >/dev/null
          if grep -F 'S.browser_fallback_url' "$RUNNER_TEMP/main.html" >/dev/null; then exit 1; fi
          if grep -F "navigateMemberTop('intent://" "$RUNNER_TEMP/main.html" >/dev/null; then exit 1; fi

      - name: Build PWA without design changes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$BUILD_ROOT" && mkdir -p "$BUILD_ROOT/web-push"
          cp deployment/jayuminton/firebase.json "$BUILD_ROOT/firebase.json"
          cp deployment/jayuminton/exact-v1637-web/index.html "$BUILD_ROOT/web-push/index.html"
          cp deployment/jayuminton/exact-v1637-web/setup-v205.css "$BUILD_ROOT/web-push/setup-v205.css"
          cat deployment/jayuminton/exact-v1637-web/setup-v205.js.part-* > "$BUILD_ROOT/web-push/setup-v205.js"
          cp deployment/jayuminton/exact-v1637-web/config-v204.js "$BUILD_ROOT/web-push/config-v204.js"
          cp deployment/jayuminton/exact-v1637-web/manifest.webmanifest "$BUILD_ROOT/web-push/manifest.webmanifest"
          cp deployment/jayuminton/exact-v1637-web/firebase-messaging-sw.js "$BUILD_ROOT/web-push/firebase-messaging-sw.js"

          python3 - <<'PY'
          import os
          from pathlib import Path
          root=Path(os.environ['BUILD_ROOT'])/'web-push'
          p=root/'setup-v205.js'
          s=p.read_text(encoding='utf-8')

          # Stale install-complete state is cleared ONLY when Chrome emits beforeinstallprompt,
          # which proves this PWA is installable/not currently installed.
          old="""    deferredInstallPrompt = event;
            window.__JAYUMINTON_EARLY_INSTALL_PROMPT = null;
          """
          if 'final5-stale-install-reset' not in s:
              if old not in s: raise SystemExit('beforeinstallprompt anchor missing')
              new="""    deferredInstallPrompt = event;
            try {
              localStorage.removeItem(STORAGE.installConfirmed);
              if (localStorage.getItem(STORAGE.installChoice) === 'on') localStorage.removeItem(STORAGE.installChoice);
            } catch (_) {}
            // final5-stale-install-reset
            window.__JAYUMINTON_EARLY_INSTALL_PROMPT = null;
          """
              s=s.replace(old,new,1)

          # memberId/memberName are a one-time handoff. Remove them from URL after import,
          # so refresh/back cannot resurrect the old member automatically.
          handoff="""  if ((!member || !member.id) && query.get('memberId') && query.get('memberName')) {
            member = {id:String(query.get('memberId')), name:String(query.get('memberName'))};
            saveJson(STORAGE.member, member);
          }
          if (member && member.name) nameInput.value = shortName(member.name);
          """
          if 'final5-member-handoff-consumed' not in s:
              if handoff not in s: raise SystemExit('member handoff anchor missing')
              fixed="""  if ((!member || !member.id) && query.get('memberId') && query.get('memberName')) {
            member = {id:String(query.get('memberId')), name:String(query.get('memberName'))};
            saveJson(STORAGE.member, member);
          }
          if (query.has('memberId') || query.has('memberName')) {
            try {
              query.delete('memberId');
              query.delete('memberName');
              const cleanMemberUrl = window.location.pathname + (query.toString() ? '?' + query.toString() : '') + window.location.hash;
              window.history.replaceState({}, document.title, cleanMemberUrl);
            } catch (_) {}
          }
          // final5-member-handoff-consumed
          if (member && member.name) nameInput.value = shortName(member.name);
          """
              s=s.replace(handoff,fixed,1)

          s += '\n// v1637-final5-pwa\n'
          p.write_text(s,encoding='utf-8')

          idx=root/'index.html'
          t=idx.read_text(encoding='utf-8')
          t=t.replace('/setup-v205.js?v=1637','/setup-v205.js?v=1637-final5')
          t=t.replace('/config-v204.js?v=1637','/config-v204.js?v=1637-final5')
          idx.write_text(t,encoding='utf-8')

          cfg=root/'config-v204.js'
          t=cfg.read_text(encoding='utf-8').replace('__MEMBER_PAGE_URL__',os.environ['MAIN_URL']).replace('__RELAY_URL__',os.environ['PUSH_URL'])
          cfg.write_text(t,encoding='utf-8')

          sw=root/'firebase-messaging-sw.js'
          t=sw.read_text(encoding='utf-8').replace("const JAYUMINTON_SW_VERSION = '1.6.37-fix1';","const JAYUMINTON_SW_VERSION = '1.6.37-final5';").replace("const JAYUMINTON_CACHE = 'jayuminton-shell-v211';","const JAYUMINTON_CACHE = 'jayuminton-shell-v215';")
          sw.write_text(t,encoding='utf-8')
          PY

          node --check "$BUILD_ROOT/web-push/setup-v205.js"
          grep -F 'final5-stale-install-reset' "$BUILD_ROOT/web-push/setup-v205.js" >/dev/null
          grep -F 'final5-member-handoff-consumed' "$BUILD_ROOT/web-push/setup-v205.js" >/dev/null
          grep -F 'appInstallChromeLink.href = links.intentUrl' "$BUILD_ROOT/web-push/setup-v205.js" >/dev/null
          grep -F 'promptResult = promptEvent.prompt()' "$BUILD_ROOT/web-push/setup-v205.js" >/dev/null
          if grep -F 'S.browser_fallback_url' "$BUILD_ROOT/web-push/setup-v205.js" >/dev/null; then exit 1; fi
          if grep -F 'window.location.href = links.targetUrl' "$BUILD_ROOT/web-push/setup-v205.js" >/dev/null; then exit 1; fi

          BASE="${HOSTING_URL%/}"
          for a in icon-198.png icon-512.png apple-touch-icon-180.png badge-96.png; do
            curl --fail --location --retry 3 --max-time 60 "$BASE/$a?src=$GITHUB_RUN_ID" -o "$BUILD_ROOT/web-push/$a"
            test -s "$BUILD_ROOT/web-push/$a"
          done

      - name: Deploy Firebase Hosting
        working-directory: ${{ env.BUILD_ROOT }}
        run: firebase deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive --message "v1.6.37 UI unchanged final5 ${GITHUB_SHA::7}"

      - name: Verify live Firebase
        shell: bash
        run: |
          set -euo pipefail
          BASE="${HOSTING_URL%/}"
          BUST="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          curl --fail --location -H 'Cache-Control: no-cache' "$BASE/?v=$BUST" > "$RUNNER_TEMP/index"
          curl --fail --location -H 'Cache-Control: no-cache' "$BASE/setup-v205.js?v=$BUST" > "$RUNNER_TEMP/setup"
          curl --fail --location -H 'Cache-Control: no-cache' "$BASE/config-v204.js?v=$BUST" > "$RUNNER_TEMP/config"
          grep -F 'setup-v205.js?v=1637-final5' "$RUNNER_TEMP/index" >/dev/null
          grep -F 'v1637-final5-pwa' "$RUNNER_TEMP/setup" >/dev/null
          grep -F 'final5-stale-install-reset' "$RUNNER_TEMP/setup" >/dev/null
          grep -F 'final5-member-handoff-consumed' "$RUNNER_TEMP/setup" >/dev/null
          grep -F 'promptResult = promptEvent.prompt()' "$RUNNER_TEMP/setup" >/dev/null
          if grep -F 'S.browser_fallback_url' "$RUNNER_TEMP/setup" >/dev/null; then exit 1; fi
          if grep -F 'window.location.href = links.targetUrl' "$RUNNER_TEMP/setup" >/dev/null; then exit 1; fi
          grep -F "$MAIN_URL" "$RUNNER_TEMP/config" >/dev/null
          grep -F "$PUSH_URL" "$RUNNER_TEMP/config" >/dev/null

      - name: Record result
        if: always()
        shell: bash
        run: |
          STATUS='${{ job.status }}'
          printf 'status=%s\ncommit=%s\nrun=%s\n' "$STATUS" "$GITHUB_SHA" "$GITHUB_RUN_ID" > deployment/jayuminton/EXACT_V1637_LIVE_RESULT.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment/jayuminton/EXACT_V1637_LIVE_RESULT.txt
          git commit -m "Record exact v1.6.37 final5: $STATUS" || exit 0
          git pull --rebase origin main || true
          git push
