name: Deploy unified member web production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-unified-member-web-production.yml'
      - 'deployment/jayuminton/patch_member_user_requirements_v1.py'
      - 'deployment/jayuminton/cloudflare_v6_frontend_bridge.js'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: jayuminton-unified-member-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      LIVE_USER_URL: https://jayuminton-push.web.app/
      CLOUDFLARE_RPC_URL: https://jayuminton-state.pianopp001.workers.dev/api/compat/rpc

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Authenticate Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@latest

      - name: Resolve Firebase project
        shell: bash
        run: |
          set -euo pipefail
          CONFIG="$RUNNER_TEMP/deploy.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$CONFIG"
          FIREBASE_PROJECT_ID="$(jq -r '.firebaseProjectId // empty' "$CONFIG")"
          test -n "$FIREBASE_PROJECT_ID"
          echo "FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID" >> "$GITHUB_ENV"

      - name: Verify Cloudflare RPC before changing frontend
        shell: bash
        run: |
          set -euo pipefail
          # The live page's google.script.run polyfill (see
          # jayuminton-v130-firebase-member-preview) POSTs JSON to this
          # endpoint -- it does not accept the older JSONP-style
          # ?rpc=...&callback=... GET request this preflight used to send.
          # getPublicState requires a member/admin token we don't have here,
          # so a well-formed "unauthorized" response is the healthy signal:
          # it proves the endpoint is live and speaking the right protocol.
          curl --fail --location --retry 5 --max-time 60 \
            -X POST "$CLOUDFLARE_RPC_URL" \
            -H 'content-type: application/json' \
            --data '{"name":"getPublicState","args":[]}' \
            -o "$RUNNER_TEMP/rpc-preflight.json"
          grep -F '"ok"' "$RUNNER_TEMP/rpc-preflight.json" >/dev/null

      - name: Preserve and patch current production user page
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/member-user-requirements"
          PUBLIC="$ROOT/public"
          mkdir -p "$PUBLIC"
          curl --fail --location --retry 5 --max-time 60 \
            -H 'Cache-Control: no-cache, no-store' \
            "$LIVE_USER_URL?source=$GITHUB_RUN_ID" \
            -o "$PUBLIC/index.html"

          cp "$PUBLIC/index.html" "$RUNNER_TEMP/member-before.html"
          python3 deployment/jayuminton/patch_member_user_requirements_v1.py "$PUBLIC/index.html"
          python3 - "$PUBLIC/index.html" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text(encoding='utf-8')
          old = "server('updateMyProfile',[String(member.id),memo])"
          new = "server('updateMyProfile',[null,String(member.id),memo])"
          if old in text:
              text = text.replace(old, new)
          if new not in text:
              raise SystemExit('member memo RPC transport compatibility patch missing')
          path.write_text(text, encoding='utf-8')
          PY

          python3 - "$PUBLIC/index.html" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text(encoding='utf-8')
          old = "function handleMemberWaitOtherTap(groupIndex,targetMemberId,event){\n  if(IS_ADMIN)return;\n  if(event){event.preventDefault();event.stopPropagation();}\n  const target=(STATE.members||[]).find(function(item){return item&&String(item.id)===String(targetMemberId);});\n  if(!target)return;\n  const selected=currentStoredWebPushMember();\n  if(!selected||!selected.id){\n    if(confirm(String(target.name||'선택한 회원')+'님이 본인인가요?')){\n      selectMemberSelf(target.id);\n      showMemberSettingMessage(String(target.name||'')+'님으로 설정했어요.');\n    }\n    return;\n  }\n  const a=memberWaitSeatSessionArgs(); if(!a)return;\n  if(String(targetMemberId)===String(a.member.id))return;\n  if(MEMBER_WAIT_SEAT_PICK&&MEMBER_WAIT_SEAT_PICK.type==='self'){\n    MEMBER_WAIT_SEAT_PICK={type:'other',groupIndex:Number(groupIndex),memberId:String(targetMemberId),fromSelf:true};\n    renderWaitGroups();\n    setTimeout(function(){\n      const ok=confirm(String(target.name||'선택한 회원')+'님과 자리를 바꿀까요?');\n      if(ok){memberRequestWaitSwap(targetMemberId);return;}\n      MEMBER_WAIT_SEAT_PICK={type:'self',groupIndex:Number(groupIndex)};\n      renderWaitGroups();\n    },0);\n    return;\n  }\n  MEMBER_WAIT_SEAT_PICK={type:'other',groupIndex:Number(groupIndex),memberId:String(targetMemberId)};\n  renderWaitGroups();\n  showMemberSettingMessage('내 자리를 선택하면 '+String(target.name||'상대')+'님과 자리 바꾸기를 요청할 수 있어요.');\n}"
          new = "function handleMemberWaitOtherTap(groupIndex,targetMemberId,event){\n  if(IS_ADMIN)return;\n  if(event){event.preventDefault();event.stopPropagation();}\n  const target=(STATE.members||[]).find(function(item){return item&&String(item.id)===String(targetMemberId);});\n  if(!target)return;\n  const selected=currentStoredWebPushMember();\n  if(!selected||!selected.id){\n    if(confirm(String(target.name||'선택한 회원')+'님이 본인인가요?')){\n      selectMemberSelf(target.id);\n      showMemberSettingMessage(String(target.name||'')+'님으로 설정했어요.');\n    }\n    return;\n  }\n  const a=memberWaitSeatSessionArgs(); if(!a)return;\n  if(String(targetMemberId)===String(a.member.id))return;\n  /* JAYUMINTON_MEMBER_ONE_TAP_SWAP_V1: self identity is already known from login, so tapping the other member alone is enough -- no separate 'select my own seat' step. */\n  clearMemberWaitSeatPick();\n  const ok=confirm(String(target.name||'선택한 회원')+'님과 자리를 바꿀까요?');\n  if(ok){memberRequestWaitSwap(targetMemberId);}\n}"
          if old not in text:
              raise SystemExit('handleMemberWaitOtherTap anchor text not found -- live source has drifted, aborting to avoid corrupting the page')
          text = text.replace(old, new)
          if 'JAYUMINTON_MEMBER_ONE_TAP_SWAP_V1' not in text:
              raise SystemExit('one-tap swap-request patch did not apply')
          path.write_text(text, encoding='utf-8')
          PY

          grep -F 'JAYUMINTON_MEMBER_USER_REQUIREMENTS_V1' "$PUBLIC/index.html" >/dev/null
          grep -F 'JAYUMINTON_MEMBER_NATIVE_IDENTITY_SYNC_V2' "$PUBLIC/index.html" >/dev/null
          grep -F 'JAYUMINTON_MEMBER_TEAM_STATUS_BADGES_V1' "$PUBLIC/index.html" >/dev/null
          grep -F 'JAYUMINTON_MEMBER_TEAM_ONLY_BADGES_V2' "$PUBLIC/index.html" >/dev/null
          grep -F 'JAYUMINTON_MEMBER_SELF_MEMO_ONLY_V2' "$PUBLIC/index.html" >/dev/null
          grep -F 'JAYUMINTON_MEMBER_TEAM_CARD_LAYOUT_V5' "$PUBLIC/index.html" >/dev/null
          grep -F 'outline:1px solid var(--jm-team-color' "$PUBLIC/index.html" >/dev/null
          grep -F 'outline-offset:2px' "$PUBLIC/index.html" >/dev/null
          grep -F '0 0 0 5px var(--jm-team-color' "$PUBLIC/index.html" >/dev/null
          ! grep -F 'box-shadow:inset 4px 0 0 var(--jm-team-color)' "$PUBLIC/index.html" >/dev/null
          grep -F '.jm-status-badge{display:none!important}' "$PUBLIC/index.html" >/dev/null
          grep -F "server('updateMyProfile',[null,String(member.id),memo])" "$PUBLIC/index.html" >/dev/null
          grep -F 'member.teamLabel' "$PUBLIC/index.html" >/dev/null
          grep -F 'JAYUMINTON_MEMBER_ONE_TAP_SWAP_V1' "$PUBLIC/index.html" >/dev/null
          grep -F 'JAYUMINTON_MEMBER_DIRECT_MESSAGE_ALERT_V1' "$PUBLIC/index.html" >/dev/null
          grep -F 'window.confirmJmDirectMessage=function()' "$PUBLIC/index.html" >/dev/null
          grep -F 'vibrationTimer=setInterval(vibrate,14500)' "$PUBLIC/index.html" >/dev/null
          grep -F 'window.NativeUserApp.setMember(memberId, memberName)' "$PUBLIC/index.html" >/dev/null
          grep -F 'window.NativeUserApp.clearMember()' "$PUBLIC/index.html" >/dev/null
          grep -F 'window.NativeUserApp.setPushEnabled' "$PUBLIC/index.html" >/dev/null
          grep -F 'window.NativeUserApp.setVibrationEnabled' "$PUBLIC/index.html" >/dev/null
          grep -F 'typeof selectedWebPushMember' "$PUBLIC/index.html" >/dev/null
          grep -F '5 * 60 * 1000' "$PUBLIC/index.html" >/dev/null
          grep -F 'for (var round = 0; round < 8; round += 1)' "$PUBLIC/index.html" >/dev/null
          grep -F 'navigator.vibrate(0)' "$PUBLIC/index.html" >/dev/null
          grep -F 'JAYUMINTON_STOP_MEMBER_ALERT' "$PUBLIC/index.html" >/dev/null
          grep -F "names.join(', ')" "$PUBLIC/index.html" >/dev/null
          grep -F '5분 동안 응답이 없어' "$PUBLIC/index.html" >/dev/null
          grep -F 'function initialize()' "$PUBLIC/index.html" >/dev/null
          grep -F 'function refreshMemberState()' "$PUBLIC/index.html" >/dev/null
          grep -F '↻ 현황 갱신' "$PUBLIC/index.html" >/dev/null
          grep -F '🎁 찬조' "$PUBLIC/index.html" >/dev/null
          grep -F 'NEW 신규' "$PUBLIC/index.html" >/dev/null
          grep -F 'jayuminton-courtstatus-v1.3.4-cloudflare-complete.apk' "$PUBLIC/index.html" >/dev/null
          grep -F "$CLOUDFLARE_RPC_URL" "$PUBLIC/index.html" >/dev/null
          ! grep -Eqi '<iframe' "$PUBLIC/index.html"
          ! grep -F 'script.google.com/macros/s/' "$PUBLIC/index.html"

          python3 - "$PUBLIC/index.html" "$RUNNER_TEMP/member-inline.js" <<'PY'
          from pathlib import Path
          import re, sys
          source = Path(sys.argv[1]).read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', source, flags=re.I)
          Path(sys.argv[2]).write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check "$RUNNER_TEMP/member-inline.js"

          cat > "$ROOT/firebase.json" <<'JSON'
          {
            "hosting": {
              "public": "public",
              "ignore": ["firebase.json", "**/.*", "**/node_modules/**"],
              "headers": [
                {"source":"/**","headers":[{"key":"Cache-Control","value":"no-store, no-cache, must-revalidate, max-age=0"}]}
              ],
              "rewrites": [{"source":"**","destination":"/index.html"}]
            }
          }
          JSON

      - name: Deploy only the Cloudflare user frontend
        shell: bash
        run: |
          set -euo pipefail
          firebase deploy --only hosting \
            --project "$FIREBASE_PROJECT_ID" \
            --config "$RUNNER_TEMP/member-user-requirements/firebase.json" \
            --non-interactive

      - name: Verify production user web
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          curl --fail --location --retry 5 --max-time 60 \
            -H 'Cache-Control: no-cache, no-store' \
            "$LIVE_USER_URL?verify=$GITHUB_RUN_ID" \
            -o "$RUNNER_TEMP/member-live-after.html"
          for marker in \
            'JAYUMINTON_MEMBER_USER_REQUIREMENTS_V1' \
            'JAYUMINTON_MEMBER_NATIVE_IDENTITY_SYNC_V2' \
            'JAYUMINTON_MEMBER_TEAM_STATUS_BADGES_V1' \
            'JAYUMINTON_MEMBER_TEAM_ONLY_BADGES_V2' \
            'JAYUMINTON_MEMBER_SELF_MEMO_ONLY_V2' \
            'JAYUMINTON_MEMBER_TEAM_CARD_LAYOUT_V5' \
            'outline:1px solid var(--jm-team-color' \
            'outline-offset:2px' \
            '0 0 0 5px var(--jm-team-color' \
            '.jm-status-badge{display:none!important}' \
            "server('updateMyProfile',[null,String(member.id),memo])" \
            'member.teamLabel' \
            'JAYUMINTON_MEMBER_ONE_TAP_SWAP_V1' \
            'JAYUMINTON_MEMBER_DIRECT_MESSAGE_ALERT_V1' \
            'window.confirmJmDirectMessage=function()' \
            'vibrationTimer=setInterval(vibrate,14500)' \
            'window.NativeUserApp.setMember(memberId, memberName)' \
            'window.NativeUserApp.clearMember()' \
            'window.NativeUserApp.setPushEnabled' \
            'window.NativeUserApp.setVibrationEnabled' \
            '5 * 60 * 1000' \
            'navigator.vibrate(0)' \
            'JAYUMINTON_STOP_MEMBER_ALERT' \
            '5분 동안 응답이 없어' \
            '↻ 현황 갱신' \
            '🎁 찬조' \
            'NEW 신규'; do
            grep -F "$marker" "$RUNNER_TEMP/member-live-after.html" >/dev/null
          done
          ! grep -F 'box-shadow:inset 4px 0 0 var(--jm-team-color)' "$RUNNER_TEMP/member-live-after.html"
          grep -F 'jayuminton-courtstatus-v1.3.4-cloudflare-complete.apk' "$RUNNER_TEMP/member-live-after.html" >/dev/null
          grep -F "$CLOUDFLARE_RPC_URL" "$RUNNER_TEMP/member-live-after.html" >/dev/null
          ! grep -Eqi '<iframe' "$RUNNER_TEMP/member-live-after.html"
          ! grep -F 'script.google.com/macros/s/' "$RUNNER_TEMP/member-live-after.html"
          echo 'PRODUCTION_MEMBER_USER_REQUIREMENTS_AND_NATIVE_IDENTITY_SYNC_OK'
          echo 'MEMBER_MEMO_RPC_TRANSPORT_COMPAT_OK'
          echo 'MAIN_ADMIN_DEPLOYMENTS_NOT_UPDATED'
          echo 'USER_APK_BINARY_NOT_REPLACED_WEBVIEW_USES_UPDATED_CLOUDFLARE_PAGE'
