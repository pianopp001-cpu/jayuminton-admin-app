name: Deploy unified member web production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-unified-member-web-production.yml'
      - 'deployment/jayuminton/patch_member_user_requirements_v1.py'
      - 'deployment/jayuminton/patch_member_single_tap_move_v1.py'
      - 'deployment/jayuminton/cloudflare_v6_frontend_bridge.js'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: jayuminton-unified-member-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      LIVE_USER_URL: https://jayuminton-push.web.app/
      CLOUDFLARE_RPC_URL: https://jayuminton-state.pianopp001.workers.dev/api/compat/rpc

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Authenticate Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@latest

      - name: Resolve Firebase project
        shell: bash
        run: |
          set -euo pipefail
          CONFIG="$RUNNER_TEMP/deploy.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$CONFIG"
          FIREBASE_PROJECT_ID="$(jq -r '.firebaseProjectId // empty' "$CONFIG")"
          test -n "$FIREBASE_PROJECT_ID"
          echo "FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID" >> "$GITHUB_ENV"

      - name: Verify Cloudflare RPC before changing frontend
        shell: bash
        run: |
          set -euo pipefail
          # The live page's google.script.run polyfill (see
          # jayuminton-v130-firebase-member-preview) POSTs JSON to this
          # endpoint -- it does not accept the older JSONP-style
          # ?rpc=...&callback=... GET request this preflight used to send.
          # getPublicState requires a member/admin token we don't have here,
          # so a well-formed "unauthorized" response is the healthy signal:
          # it proves the endpoint is live and speaking the right protocol.
          curl --fail --location --retry 5 --max-time 60 \
            -X POST "$CLOUDFLARE_RPC_URL" \
            -H 'content-type: application/json' \
            --data '{"name":"getPublicState","args":[]}' \
            -o "$RUNNER_TEMP/rpc-preflight.json"
          grep -F '"ok"' "$RUNNER_TEMP/rpc-preflight.json" >/dev/null

      - name: Preserve and patch current production user page
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/member-user-requirements"
          PUBLIC="$ROOT/public"
          mkdir -p "$PUBLIC"
          curl --fail --location --retry 5 --max-time 60 \
            -H 'Cache-Control: no-cache, no-store' \
            "$LIVE_USER_URL?source=$GITHUB_RUN_ID" \
            -o "$PUBLIC/index.html"

          cp "$PUBLIC/index.html" "$RUNNER_TEMP/member-before.html"
          python3 deployment/jayuminton/patch_member_user_requirements_v1.py "$PUBLIC/index.html"
          python3 deployment/jayuminton/patch_member_single_tap_move_v1.py "$PUBLIC/index.html"
          python3 - "$PUBLIC/index.html" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text(encoding='utf-8')
          old = "server('updateMyProfile',[String(member.id),memo])"
          new = "server('updateMyProfile',[null,String(member.id),memo])"
          if old in text:
              text = text.replace(old, new)
          if new not in text:
              raise SystemExit('member memo RPC transport compatibility patch missing')
          path.write_text(text, encoding='utf-8')
          PY

          python3 - "$PUBLIC/index.html" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text(encoding='utf-8')
          marker = 'JAYUMINTON_MEMBER_ALERT_VIBRATION_STOP_V1'
          if marker not in text:
              old = "function playMemberAlertCue(type, title, body, eventId) {\n  const repeatCount = memberAlertRepeatCount(type);\n  for (let index = 0; index < repeatCount; index += 1) {\n    setTimeout(function() {\n      playSingleMemberAlertCue(type);\n      showSingleNativeMemberNotification(title, body, eventId, index + 1);\n    }, index * 1700);\n  }\n}"
              new = "var __jmMemberAlertTimersV1 = [];\nfunction playMemberAlertCue(type, title, body, eventId) {\n  const repeatCount = memberAlertRepeatCount(type);\n  for (let index = 0; index < repeatCount; index += 1) {\n    __jmMemberAlertTimersV1.push(setTimeout(function() {\n      playSingleMemberAlertCue(type);\n      showSingleNativeMemberNotification(title, body, eventId, index + 1);\n    }, index * 1700));\n  }\n}"
              if old not in text:
                  raise SystemExit('playMemberAlertCue anchor text not found -- live source has drifted, aborting to avoid corrupting the page')
              text = text.replace(old, new, 1)

              old2 = "function closeMemberForegroundAlert() {\n  const box = document.getElementById('memberForegroundAlert');\n  if (box) box.classList.add('hidden');\n}"
              new2 = "function closeMemberForegroundAlert() {\n  /* JAYUMINTON_MEMBER_ALERT_VIBRATION_STOP_V1: mid-repeat confirm must stop\n     the vibration immediately, not just hide the popup and let the\n     remaining scheduled rounds keep buzzing. */\n  __jmMemberAlertTimersV1.forEach(function(timerId) { clearTimeout(timerId); });\n  __jmMemberAlertTimersV1 = [];\n  try { if (navigator.vibrate) navigator.vibrate(0); } catch (error) {}\n  const box = document.getElementById('memberForegroundAlert');\n  if (box) box.classList.add('hidden');\n}"
              if old2 not in text:
                  raise SystemExit('closeMemberForegroundAlert anchor text not found -- live source has drifted, aborting to avoid corrupting the page')
              text = text.replace(old2, new2, 1)

          if marker not in text:
              raise SystemExit('alert vibration-stop patch did not apply')
          path.write_text(text, encoding='utf-8')
          PY

          python3 - "$PUBLIC/index.html" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text(encoding='utf-8')
          old = "function handleMemberWaitOtherTap(groupIndex,targetMemberId,event){\n  if(IS_ADMIN)return;\n  if(event){event.preventDefault();event.stopPropagation();}\n  const target=(STATE.members||[]).find(function(item){return item&&String(item.id)===String(targetMemberId);});\n  if(!target)return;\n  const selected=currentStoredWebPushMember();\n  if(!selected||!selected.id){\n    if(confirm(String(target.name||'선택한 회원')+'님이 본인인가요?')){\n      selectMemberSelf(target.id);\n      showMemberSettingMessage(String(target.name||'')+'님으로 설정했어요.');\n    }\n    return;\n  }\n  const a=memberWaitSeatSessionArgs(); if(!a)return;\n  if(String(targetMemberId)===String(a.member.id))return;\n  if(MEMBER_WAIT_SEAT_PICK&&MEMBER_WAIT_SEAT_PICK.type==='self'){\n    MEMBER_WAIT_SEAT_PICK={type:'other',groupIndex:Number(groupIndex),memberId:String(targetMemberId),fromSelf:true};\n    renderWaitGroups();\n    setTimeout(function(){\n      const ok=confirm(String(target.name||'선택한 회원')+'님과 자리를 바꿀까요?');\n      if(ok){memberRequestWaitSwap(targetMemberId);return;}\n      MEMBER_WAIT_SEAT_PICK={type:'self',groupIndex:Number(groupIndex)};\n      renderWaitGroups();\n    },0);\n    return;\n  }\n  MEMBER_WAIT_SEAT_PICK={type:'other',groupIndex:Number(groupIndex),memberId:String(targetMemberId)};\n  renderWaitGroups();\n  showMemberSettingMessage('내 자리를 선택하면 '+String(target.name||'상대')+'님과 자리 바꾸기를 요청할 수 있어요.');\n}"
          new = "function handleMemberWaitOtherTap(groupIndex,targetMemberId,event){\n  if(IS_ADMIN)return;\n  if(event){event.preventDefault();event.stopPropagation();}\n  const target=(STATE.members||[]).find(function(item){return item&&String(item.id)===String(targetMemberId);});\n  if(!target)return;\n  const selected=currentStoredWebPushMember();\n  if(!selected||!selected.id){\n    if(confirm(String(target.name||'선택한 회원')+'님이 본인인가요?')){\n      selectMemberSelf(target.id);\n      showMemberSettingMessage(String(target.name||'')+'님으로 설정했어요.');\n    }\n    return;\n  }\n  const a=memberWaitSeatSessionArgs(); if(!a)return;\n  if(String(targetMemberId)===String(a.member.id))return;\n  /* JAYUMINTON_MEMBER_ONE_TAP_SWAP_V1: self identity is already known from login, so tapping the other member alone is enough -- no separate 'select my own seat' step. */\n  clearMemberWaitSeatPick();\n  const ok=confirm(String(target.name||'선택한 회원')+'님과 자리를 바꿀까요?');\n  if(ok){memberRequestWaitSwap(targetMemberId);}\n}"
          if 'JAYUMINTON_MEMBER_ONE_TAP_SWAP_V1' not in text:
              if old not in text:
                  raise SystemExit('handleMemberWaitOtherTap anchor text not found -- live source has drifted, aborting to avoid corrupting the page')
              text = text.replace(old, new)
          if 'JAYUMINTON_MEMBER_ONE_TAP_SWAP_V1' not in text:
              raise SystemExit('one-tap swap-request patch did not apply')
          path.write_text(text, encoding='utf-8')
          PY

          python3 - "$PUBLIC/index.html" <<'PY'
