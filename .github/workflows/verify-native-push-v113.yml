name: Verify native push v1.1.3 binary and live link

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-native-push-v113.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global @google/clasp@latest
      - name: Verify APK and live link
        shell: bash
        run: |
          set -euo pipefail
          APK="releases/jayuminton-courtstatus-v1.1.3-fresh-install.apk"
          test -s "$APK"
          unzip -p "$APK" classes.dex | strings > "$RUNNER_TEMP/classes.txt"
          grep -F 'NativeAlertProbe' "$RUNNER_TEMP/classes.txt" >/dev/null
          grep -F 'verifyRegistered' "$RUNNER_TEMP/classes.txt" >/dev/null
          grep -F 'registrationStatus' "$RUNNER_TEMP/classes.txt" >/dev/null
          grep -F 'token_status' "$RUNNER_TEMP/classes.txt" >/dev/null
          grep -F 'registration_failed' "$RUNNER_TEMP/classes.txt" >/dev/null
          grep -F 'JayumintonFirebaseMessagingService' "$RUNNER_TEMP/classes.txt" >/dev/null
          grep -F 'jayuminton_wait1_native_v113' "$RUNNER_TEMP/classes.txt" >/dev/null
          grep -F 'jayuminton_court_native_v113' "$RUNNER_TEMP/classes.txt" >/dev/null

          CONFIG="$RUNNER_TEMP/deploy.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$CONFIG"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          MAIN_SCRIPT_ID="$(jq -r '.mainScriptId' "$CONFIG")"
          WORK="$RUNNER_TEMP/live"
          mkdir -p "$WORK"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$MAIN_SCRIPT_ID" > "$WORK/.clasp.json"
          cd "$WORK"
          clasp pull
          grep -F 'jayuminton-courtstatus-v1.1.3-fresh-install.apk' Script.html >/dev/null
          ! grep -F 'window is not defined' check.js
          cd "$GITHUB_WORKSPACE"
          printf 'status=success\nversion=1.1.3\nnative_probe=yes\nserver_registration_verify=yes\nregistration_retry=yes\nbackground_fcm_service=yes\nnew_notification_channels=yes\nlive_apk_link=yes\napk_sha256=%s\nverified_at=%s\n' "$(sha256sum "$APK" | awk '{print $1}')" "$(date -u +%FT%TZ)" > deployment/status/native-push-v113-verified.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment/status/native-push-v113-verified.txt
          git commit -m 'Verify native push v1.1.3 binary and live link'
          git pull --rebase origin main
          git push origin main
