name: Deploy Jayuminton

on:
  workflow_dispatch:
    inputs:
      target:
        description: '배포 범위'
        required: true
        default: all
        type: choice
        options:
          - all
          - web-only
  push:
    branches: [main]
    paths:
      - 'deployment/jayuminton/**'
      - '.github/workflows/deploy-pwa.yml'

permissions:
  contents: read

concurrency:
  group: jayuminton-production-deploy-v4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'all' }}
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check one-time deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$JAYUMINTON_DEPLOY_CONFIG_JSON" || { echo 'JAYUMINTON_DEPLOY_CONFIG_JSON secret is missing.'; exit 1; }
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || { echo 'FIREBASE_SERVICE_ACCOUNT_JSON secret is missing.'; exit 1; }
          if [[ "$DEPLOY_TARGET" == 'all' ]]; then
            test -n "$CLASPRC_JSON" || { echo 'CLASPRC_JSON secret is missing.'; exit 1; }
          fi

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deployment tools
        run: npm install --global firebase-tools@latest @google/clasp@latest

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Read deployment IDs and build canonical URLs
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          CONFIG_FILE="$RUNNER_TEMP/jayuminton-deploy-config.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$CONFIG_FILE"

          jq -e '.mainScriptId and .mainDeploymentId and .pushScriptId and .pushDeploymentId and .firebaseProjectId and .hostingUrl' "$CONFIG_FILE" >/dev/null

          MAIN_DEPLOYMENT_ID_VALUE="$(jq -r '.mainDeploymentId' "$CONFIG_FILE")"
          PUSH_DEPLOYMENT_ID_VALUE="$(jq -r '.pushDeploymentId' "$CONFIG_FILE")"

          [[ "$MAIN_DEPLOYMENT_ID_VALUE" =~ ^[A-Za-z0-9_-]+$ ]] || { echo 'Invalid MAIN deployment ID.'; exit 1; }
          [[ "$PUSH_DEPLOYMENT_ID_VALUE" =~ ^[A-Za-z0-9_-]+$ ]] || { echo 'Invalid PUSH deployment ID.'; exit 1; }

          {
            echo "MAIN_SCRIPT_ID=$(jq -r '.mainScriptId' "$CONFIG_FILE")"
            echo "MAIN_DEPLOYMENT_ID=$MAIN_DEPLOYMENT_ID_VALUE"
            echo "MAIN_URL=https://script.google.com/macros/s/$MAIN_DEPLOYMENT_ID_VALUE/exec"
            echo "PUSH_SCRIPT_ID=$(jq -r '.pushScriptId' "$CONFIG_FILE")"
            echo "PUSH_DEPLOYMENT_ID=$PUSH_DEPLOYMENT_ID_VALUE"
            echo "PUSH_URL=https://script.google.com/macros/s/$PUSH_DEPLOYMENT_ID_VALUE/exec"
            echo "FIREBASE_PROJECT_ID=$(jq -r '.firebaseProjectId' "$CONFIG_FILE")"
            echo "HOSTING_URL=$(jq -r '.hostingUrl' "$CONFIG_FILE")"
            echo "RELEASE_VERSION=$(tr -d '\r\n ' < deployment/jayuminton/RELEASE_VERSION)"
            echo "BUILD_ROOT=$RUNNER_TEMP/jayuminton-build"
          } >> "$GITHUB_ENV"

          if [[ "$DEPLOY_TARGET" == 'all' ]]; then
            printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          fi

      - name: Pull, overlay and redeploy MAIN Apps Script
        if: env.DEPLOY_TARGET == 'all'
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/apps-script-main"
          rm -rf "$WORK" && mkdir -p "$WORK"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$MAIN_SCRIPT_ID" > "$WORK/.clasp.json"
          cd "$WORK"
          clasp pull
          rsync -a --exclude='.gitkeep' "$GITHUB_WORKSPACE/deployment/jayuminton/apps-script-main-overrides/" ./
          clasp push --force
          clasp create-deployment --deploymentId "$MAIN_DEPLOYMENT_ID" --description "GitHub Actions ${GITHUB_SHA::7}"

      - name: Pull, overlay and redeploy PUSH Apps Script
        if: env.DEPLOY_TARGET == 'all'
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/apps-script-push"
          rm -rf "$WORK" && mkdir -p "$WORK"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$PUSH_SCRIPT_ID" > "$WORK/.clasp.json"
          cd "$WORK"
          clasp pull
          rsync -a --exclude='.gitkeep' "$GITHUB_WORKSPACE/deployment/jayuminton/apps-script-push-overrides/" ./
          clasp push --force
          clasp create-deployment --deploymentId "$PUSH_DEPLOYMENT_ID" --description "GitHub Actions ${GITHUB_SHA::7}"

      - name: Verify Apps Script endpoints
        if: env.DEPLOY_TARGET == 'all'
        shell: bash
        run: |
          set -euo pipefail
          for pair in "main:$MAIN_URL" "push:$PUSH_URL"; do
            name="${pair%%:*}"
            url="${pair#*:}"
            body="$RUNNER_TEMP/${name}-app.html"
            final="$RUNNER_TEMP/${name}-final-url.txt"
            curl --fail --location --retry 3 --max-time 60 \
              --output "$body" --write-out '%{url_effective}' \
              "$url?verify=$GITHUB_RUN_ID" > "$final"
            if grep -Eiq 'drive\.google\.com|docs\.google\.com' "$final"; then
              echo "$name Apps Script redirected to Google Drive."
              cat "$final"
              exit 1
            fi
            if grep -Eiq 'file you have requested does not exist|주소를 확인한 다음 다시 시도|요청한 파일이 존재하지' "$body"; then
              echo "$name Apps Script returned a missing-file page."
              exit 1
            fi
          done

      - name: Build fixed v1.6.41 PWA source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$BUILD_ROOT"
          mkdir -p "$BUILD_ROOT/web-push"
          cp deployment/jayuminton/firebase.json "$BUILD_ROOT/firebase.json"

          BASE="${HOSTING_URL%/}"
          for asset in config-v203.js icon-198.png icon-512.png apple-touch-icon-180.png badge-96.png; do
            curl --fail --location --retry 3 --max-time 60 -H 'Cache-Control: no-cache' \
              "$BASE/$asset?source=github-actions-$GITHUB_RUN_ID" \
              --output "$BUILD_ROOT/web-push/$asset"
            test -s "$BUILD_ROOT/web-push/$asset"
          done

          git fetch --no-tags --depth=1 origin agent/github-auto-deploy
          git show FETCH_HEAD:deployment/jayuminton/web-push/setup-v208.css > "$BUILD_ROOT/web-push/setup-v208.css"
          : > "$BUILD_ROOT/web-push/setup-v208.js"
          for number in $(seq -w 1 16); do
            git show "FETCH_HEAD:deployment/jayuminton/web-push/setup-v208.js.part-$number" >> "$BUILD_ROOT/web-push/setup-v208.js"
          done

          rsync -a --exclude='.gitkeep' deployment/jayuminton/web-push-overrides/ "$BUILD_ROOT/web-push/"

          for version in 170 190 191 192 193 194 195 196 197 198 199 200 201 202 203 204 205 206 207; do
            cat > "$BUILD_ROOT/web-push/firebase-messaging-sw-v${version}.js" <<'EOF'
          /* Legacy service-worker migration shim. */
          importScripts('/firebase-messaging-sw.js');
          self.addEventListener('install', () => self.skipWaiting());
          self.addEventListener('activate', (event) => event.waitUntil(self.clients.claim()));
          EOF
          done

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['BUILD_ROOT']) / 'web-push'
          config_path = root / 'config-v203.js'
          text = config_path.read_text(encoding='utf-8')
          main_url = os.environ['MAIN_URL']
          push_url = os.environ['PUSH_URL']

          override = (
              "\n;window.JAYUMINTON_PUSH_SETUP_CONFIG = Object.freeze(Object.assign({}, "
              "window.JAYUMINTON_PUSH_SETUP_CONFIG || {}, {"
              f"memberPageUrl:{json.dumps(main_url)},"
              f"relayUrl:{json.dumps(push_url)}"
              "}));\n"
          )
          config_path.write_text(text.rstrip() + override, encoding='utf-8')

          required = [
              'index.html', 'manifest.webmanifest', 'setup-v208.css', 'setup-v208.js',
              'config-v203.js', 'firebase-messaging-sw.js', 'icon-198.png', 'icon-512.png',
              'apple-touch-icon-180.png', 'badge-96.png'
          ]
          missing = [name for name in required if not (root / name).is_file() or (root / name).stat().st_size == 0]
          if missing:
              raise SystemExit('Required PWA files are missing: ' + ', '.join(missing))

          index = (root / 'index.html').read_text(encoding='utf-8')
          setup = (root / 'setup-v208.js').read_text(encoding='utf-8')
          worker = (root / 'firebase-messaging-sw.js').read_text(encoding='utf-8')
          config = config_path.read_text(encoding='utf-8')

          if '/setup-v208.js' not in index or '/setup-v208.css' not in index:
              raise SystemExit('index.html does not reference setup-v208 assets')
          if os.environ['RELEASE_VERSION'] != '1.6.41':
              raise SystemExit('Unexpected release version')
          if '1.6.41' not in (index + '\n' + setup + '\n' + worker):
              raise SystemExit('v1.6.41 marker is missing')
          if 'directInstallScreen' not in index or 'direct-install-mode' not in setup:
              raise SystemExit('v1.6.41 direct install screen is missing')
          if main_url not in config or push_url not in config:
              raise SystemExit('Canonical Apps Script URLs were not injected into config-v203.js')

          print('Validated PWA source with canonical MAIN/PUSH URLs')
          PY

      - name: Deploy Firebase Hosting
        working-directory: ${{ env.BUILD_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          firebase deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive \
            --message "GitHub Actions v${RELEASE_VERSION} ${GITHUB_SHA::7}"

      - name: Verify live PWA and canonical URLs
        shell: bash
        run: |
          set -euo pipefail
          BASE="${HOSTING_URL%/}"
          CACHE_BUST="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          curl --fail --location --max-time 60 -H 'Cache-Control: no-cache' \
            "$BASE/?verify=$CACHE_BUST" > "$RUNNER_TEMP/live-index.html"
          grep -F '1.6.41' "$RUNNER_TEMP/live-index.html"
          grep -F 'setup-v208.js' "$RUNNER_TEMP/live-index.html"

          curl --fail --location --max-time 60 -H 'Cache-Control: no-cache' \
            "$BASE/config-v203.js?verify=$CACHE_BUST" > "$RUNNER_TEMP/live-config.js"
          grep -F "$MAIN_URL" "$RUNNER_TEMP/live-config.js"
          grep -F "$PUSH_URL" "$RUNNER_TEMP/live-config.js"

          curl --fail --location --max-time 60 -H 'Cache-Control: no-cache' \
            "$BASE/firebase-messaging-sw.js?verify=$CACHE_BUST" > "$RUNNER_TEMP/live-worker.js"
          grep -F '1.6.41' "$RUNNER_TEMP/live-worker.js"

      - name: Deployment summary
        shell: bash
        run: |
          {
            echo '## 자유민턴 자동 배포 완료'
            echo
            echo "- Version: $RELEASE_VERSION"
            echo "- Target: $DEPLOY_TARGET"
            echo "- Firebase Hosting: $HOSTING_URL"
            echo '- MAIN/PUSH URL: Deployment ID에서 다시 생성해 주입'
          } >> "$GITHUB_STEP_SUMMARY"
