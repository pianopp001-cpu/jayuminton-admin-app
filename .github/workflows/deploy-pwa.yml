name: Deploy Jayuminton PWA

on:
  pull_request:
    branches: [main]
    paths:
      - 'deployment/**'
      - '.github/workflows/deploy-pwa.yml'
  push:
    branches: [main]
    paths:
      - 'deployment/**'
      - '.github/workflows/deploy-pwa.yml'
  workflow_dispatch:
    inputs:
      scope:
        description: '배포 범위'
        required: true
        default: web
        type: choice
        options:
          - web
          - full

permissions:
  contents: read

concurrency:
  group: jayuminton-production-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Validate deployment bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode deployment bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/jayuminton-deploy"
          mkdir -p "$RUNNER_TEMP/jayuminton-deploy"
          base64 --decode deployment/jayuminton-deploy-v1.6.41.zip.b64 > "$RUNNER_TEMP/jayuminton-deploy.zip"
          unzip -q "$RUNNER_TEMP/jayuminton-deploy.zip" -d "$RUNNER_TEMP/jayuminton-deploy"

      - name: Validate required files and version
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/jayuminton-deploy"
          test -s "$ROOT/firebase.json"
          test -s "$ROOT/web-push/index.html"
          test -s "$ROOT/web-push/setup-v208.js"
          test -s "$ROOT/web-push/setup-v208.css"
          test -s "$ROOT/web-push/firebase-messaging-sw.js"
          test -s "$ROOT/web-push/manifest.webmanifest"
          test -s "$ROOT/apps-script-main/Code.gs"
          test -s "$ROOT/apps-script-push/Code.gs"
          grep -Fq '/setup-v208.js' "$ROOT/web-push/index.html"
          grep -Fq 'v1.6.41' "$ROOT/web-push/setup-v208.js"
          grep -Fq "JAYUMINTON_SW_VERSION = '1.6.41'" "$ROOT/web-push/firebase-messaging-sw.js"
          unzip -t "$RUNNER_TEMP/jayuminton-deploy.zip"

      - name: Upload validated bundle
        uses: actions/upload-artifact@v4
        with:
          name: jayuminton-deploy-v1.6.41
          path: ${{ runner.temp }}/jayuminton-deploy.zip
          retention-days: 30

  deploy:
    name: Deploy production
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      FIREBASE_PROJECT_ID: jayuminton-push
      HOSTING_URL: https://jayuminton-push.web.app
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JAYUMINTON_PUSH }}
      MAIN_WEB_APP_URL: ${{ vars.JAYUMINTON_MAIN_WEB_APP_URL || secrets.JAYUMINTON_MAIN_WEB_APP_URL }}
      PUSH_WEB_APP_URL: ${{ vars.JAYUMINTON_PUSH_APPS_SCRIPT_URL || secrets.JAYUMINTON_PUSH_APPS_SCRIPT_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Decode deployment bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/jayuminton-deploy"
          mkdir -p "$RUNNER_TEMP/jayuminton-deploy"
          base64 --decode deployment/jayuminton-deploy-v1.6.41.zip.b64 > "$RUNNER_TEMP/jayuminton-deploy.zip"
          unzip -q "$RUNNER_TEMP/jayuminton-deploy.zip" -d "$RUNNER_TEMP/jayuminton-deploy"
          echo "DEPLOY_ROOT=$RUNNER_TEMP/jayuminton-deploy" >> "$GITHUB_ENV"

      - name: Render current Apps Script URLs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MAIN_WEB_APP_URL" || { echo 'JAYUMINTON_MAIN_WEB_APP_URL variable/secret is missing.'; exit 1; }
          test -n "$PUSH_WEB_APP_URL" || { echo 'JAYUMINTON_PUSH_APPS_SCRIPT_URL variable/secret is missing.'; exit 1; }
          python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ['DEPLOY_ROOT'])
          template = root / 'web-push' / 'config-v203.template.js'
          output = root / 'web-push' / 'config-v203.js'
          text = template.read_text(encoding='utf-8')
          text = text.replace('__MEMBER_PAGE_URL__', os.environ['MAIN_WEB_APP_URL'].strip())
          text = text.replace('__RELAY_URL__', os.environ['PUSH_WEB_APP_URL'].strip())
          if '__MEMBER_PAGE_URL__' in text or '__RELAY_URL__' in text:
              raise SystemExit('Apps Script URL replacement failed')
          output.write_text(text, encoding='utf-8')
          PY

      - name: Require Firebase deployment credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || {
            echo 'FIREBASE_SERVICE_ACCOUNT_JAYUMINTON_PUSH secret is missing.'
            exit 1
          }

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JAYUMINTON_PUSH }}

      - name: Install Firebase CLI
        shell: bash
        run: npm install --global firebase-tools@latest

      - name: Deploy Firebase Hosting
        shell: bash
        working-directory: ${{ env.DEPLOY_ROOT }}
        run: |
          set -euo pipefail
          firebase deploy \
            --only hosting \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive \
            --message "GitHub Actions ${GITHUB_SHA}"

      - name: Verify production PWA
        shell: bash
        run: |
          set -euo pipefail
          CACHE_BUST="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          curl -fsSL -H 'Cache-Control: no-cache' "$HOSTING_URL/?verify=$CACHE_BUST" | grep -Fq '/setup-v208.js'
          curl -fsSL -H 'Cache-Control: no-cache' "$HOSTING_URL/setup-v208.js?verify=$CACHE_BUST" | grep -Fq 'v1.6.41'
          curl -fsSL -H 'Cache-Control: no-cache' "$HOSTING_URL/firebase-messaging-sw.js?verify=$CACHE_BUST" | grep -Fq "JAYUMINTON_SW_VERSION = '1.6.41'"

      - name: Prepare Apps Script full deployment
        if: github.event_name == 'workflow_dispatch' && inputs.scope == 'full'
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          MAIN_MANIFEST_JSON: ${{ secrets.JAYUMINTON_MAIN_MANIFEST_JSON }}
          MAIN_SCRIPT_ID: ${{ vars.JAYUMINTON_MAIN_SCRIPT_ID || secrets.JAYUMINTON_MAIN_SCRIPT_ID }}
          MAIN_DEPLOYMENT_ID: ${{ vars.JAYUMINTON_MAIN_DEPLOYMENT_ID || secrets.JAYUMINTON_MAIN_DEPLOYMENT_ID }}
          PUSH_SCRIPT_ID: ${{ vars.JAYUMINTON_PUSH_SCRIPT_ID || secrets.JAYUMINTON_PUSH_SCRIPT_ID }}
          PUSH_DEPLOYMENT_ID: ${{ vars.JAYUMINTON_PUSH_DEPLOYMENT_ID || secrets.JAYUMINTON_PUSH_DEPLOYMENT_ID }}
        run: |
          set -euo pipefail
          for required in CLASPRC_JSON MAIN_MANIFEST_JSON MAIN_SCRIPT_ID MAIN_DEPLOYMENT_ID PUSH_SCRIPT_ID PUSH_DEPLOYMENT_ID; do
            test -n "${!required:-}" || { echo "$required is missing."; exit 1; }
          done
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '%s' "$MAIN_MANIFEST_JSON" > "$DEPLOY_ROOT/apps-script-main/appsscript.json"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$MAIN_SCRIPT_ID" > "$DEPLOY_ROOT/apps-script-main/.clasp.json"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$PUSH_SCRIPT_ID" > "$DEPLOY_ROOT/apps-script-push/.clasp.json"
          echo "MAIN_DEPLOYMENT_ID=$MAIN_DEPLOYMENT_ID" >> "$GITHUB_ENV"
          echo "PUSH_DEPLOYMENT_ID=$PUSH_DEPLOYMENT_ID" >> "$GITHUB_ENV"

      - name: Deploy MAIN Apps Script
        if: github.event_name == 'workflow_dispatch' && inputs.scope == 'full'
        shell: bash
        working-directory: ${{ env.DEPLOY_ROOT }}/apps-script-main
        run: |
          set -euo pipefail
          npx --yes @google/clasp@latest push --force
          npx --yes @google/clasp@latest create-deployment \
            --deploymentId "$MAIN_DEPLOYMENT_ID" \
            --description "GitHub Actions ${GITHUB_SHA}"

      - name: Deploy PUSH Apps Script
        if: github.event_name == 'workflow_dispatch' && inputs.scope == 'full'
        shell: bash
        working-directory: ${{ env.DEPLOY_ROOT }}/apps-script-push
        run: |
          set -euo pipefail
          npx --yes @google/clasp@latest push --force
          npx --yes @google/clasp@latest create-deployment \
            --deploymentId "$PUSH_DEPLOYMENT_ID" \
            --description "GitHub Actions ${GITHUB_SHA}"

      - name: Deployment summary
        shell: bash
        run: |
          {
            echo '## 자유민턴 배포 완료'
            echo
            echo "- Firebase Hosting: $HOSTING_URL"
            echo "- Commit: $GITHUB_SHA"
            if [[ '${{ github.event_name }}' == 'workflow_dispatch' && '${{ inputs.scope }}' == 'full' ]]; then
              echo '- Apps Script: MAIN/PUSH 전체 배포'
            else
              echo '- Apps Script: 변경 없음 (웹 자동 배포)'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
