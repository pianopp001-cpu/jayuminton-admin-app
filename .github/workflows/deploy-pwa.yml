name: Deploy Jayuminton PWA

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: '배포할 Git 브랜치 또는 커밋'
        required: true
        default: 'v1.5-firebase'
        type: string
      scope:
        description: '배포 범위'
        required: true
        default: web
        type: choice
        options:
          - web
          - full
  push:
    branches: [main]
    paths:
      - 'web-push/**'
      - 'firebase.json'
      - 'apps-script-main/**'
      - 'apps-script-push/**'

permissions:
  contents: read

concurrency:
  group: jayuminton-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      FIREBASE_PROJECT_ID: jayuminton-push
      HOSTING_URL: https://jayuminton-push.web.app
      MAIN_WEB_APP_URL: ${{ vars.JAYUMINTON_MAIN_WEB_APP_URL || secrets.JAYUMINTON_MAIN_WEB_APP_URL }}
      PUSH_WEB_APP_URL: ${{ vars.JAYUMINTON_PUSH_APPS_SCRIPT_URL || secrets.JAYUMINTON_PUSH_APPS_SCRIPT_URL }}
    steps:
      - name: Resolve source ref
        shell: bash
        run: |
          if [[ '${{ github.event_name }}' == 'workflow_dispatch' ]]; then
            echo "SOURCE_REF=${{ inputs.source_ref }}" >> "$GITHUB_ENV"
            echo "DEPLOY_SCOPE=${{ inputs.scope }}" >> "$GITHUB_ENV"
          else
            echo "SOURCE_REF=${GITHUB_SHA}" >> "$GITHUB_ENV"
            echo "DEPLOY_SCOPE=web" >> "$GITHUB_ENV"
          fi

      - name: Checkout deployment source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate deployment source
        shell: bash
        run: |
          set -euo pipefail
          test -s firebase.json
          test -s web-push/index.html
          test -s web-push/firebase-messaging-sw.js
          test -s web-push/manifest.webmanifest
          if [[ ! -f web-push/config.template.js ]] && ! compgen -G 'web-push/config-v*.template.js' >/dev/null; then
            echo 'web-push config template is missing.'
            exit 1
          fi
          grep -Eq 'firebase-messaging-sw|app\.js|setup-v[0-9]+\.js' web-push/index.html

      - name: Render Apps Script URLs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PUSH_WEB_APP_URL" || { echo 'JAYUMINTON_PUSH_APPS_SCRIPT_URL variable/secret is missing.'; exit 1; }
          python3 - <<'PY'
          import glob
          import os
          import re
          from pathlib import Path

          candidates = sorted(
              glob.glob('web-push/config-v*.template.js'),
              key=lambda p: int(re.search(r'config-v(\d+)', p).group(1)),
              reverse=True,
          )
          template = Path(candidates[0] if candidates else 'web-push/config.template.js')
          output = Path(str(template).replace('.template.js', '.js'))
          text = template.read_text(encoding='utf-8')
          text = text.replace('__RELAY_URL__', os.environ['PUSH_WEB_APP_URL'].strip())
          if '__MEMBER_PAGE_URL__' in text:
              main_url = os.environ.get('MAIN_WEB_APP_URL', '').strip()
              if not main_url:
                  raise SystemExit('JAYUMINTON_MAIN_WEB_APP_URL variable/secret is missing.')
              text = text.replace('__MEMBER_PAGE_URL__', main_url)
          if '__RELAY_URL__' in text or '__MEMBER_PAGE_URL__' in text:
              raise SystemExit('Apps Script URL replacement failed.')
          output.write_text(text, encoding='utf-8')
          print(f'Rendered {output}')
          PY

      - name: Require Firebase credential
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JAYUMINTON_PUSH }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || {
            echo 'FIREBASE_SERVICE_ACCOUNT_JAYUMINTON_PUSH secret is missing.'
            exit 1
          }

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JAYUMINTON_PUSH }}

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@latest

      - name: Deploy Firebase Hosting
        shell: bash
        run: |
          set -euo pipefail
          firebase deploy \
            --only hosting \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive \
            --message "GitHub Actions source=${SOURCE_REF} run=${GITHUB_RUN_ID}"

      - name: Verify Firebase Hosting
        shell: bash
        run: |
          set -euo pipefail
          CACHE_BUST="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          curl -fsSL -H 'Cache-Control: no-cache' "$HOSTING_URL/?verify=$CACHE_BUST" >/tmp/jayuminton-index.html
          grep -Eq 'firebase-messaging-sw|app\.js|setup-v[0-9]+\.js' /tmp/jayuminton-index.html
          curl -fsSL -H 'Cache-Control: no-cache' "$HOSTING_URL/firebase-messaging-sw.js?verify=$CACHE_BUST" | grep -Eq 'firebase|JAYUMINTON'

      - name: Prepare clasp authentication
        if: env.DEPLOY_SCOPE == 'full'
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -euo pipefail
          test -n "$CLASPRC_JSON" || { echo 'CLASPRC_JSON secret is missing.'; exit 1; }
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"

      - name: Deploy MAIN Apps Script when present
        if: env.DEPLOY_SCOPE == 'full'
        shell: bash
        env:
          MAIN_SCRIPT_ID: ${{ vars.JAYUMINTON_MAIN_SCRIPT_ID || secrets.JAYUMINTON_MAIN_SCRIPT_ID }}
          MAIN_DEPLOYMENT_ID: ${{ vars.JAYUMINTON_MAIN_DEPLOYMENT_ID || secrets.JAYUMINTON_MAIN_DEPLOYMENT_ID }}
          MAIN_MANIFEST_JSON: ${{ secrets.JAYUMINTON_MAIN_MANIFEST_JSON }}
        run: |
          set -euo pipefail
          if [[ ! -d apps-script-main ]]; then
            echo 'apps-script-main directory is not present in this source ref; skipping MAIN.'
            exit 0
          fi
          test -n "$MAIN_SCRIPT_ID" || { echo 'JAYUMINTON_MAIN_SCRIPT_ID is missing.'; exit 1; }
          test -n "$MAIN_DEPLOYMENT_ID" || { echo 'JAYUMINTON_MAIN_DEPLOYMENT_ID is missing.'; exit 1; }
          if [[ ! -f apps-script-main/appsscript.json ]]; then
            test -n "$MAIN_MANIFEST_JSON" || { echo 'JAYUMINTON_MAIN_MANIFEST_JSON is missing.'; exit 1; }
            printf '%s' "$MAIN_MANIFEST_JSON" > apps-script-main/appsscript.json
          fi
          printf '{"scriptId":"%s","rootDir":"."}\n' "$MAIN_SCRIPT_ID" > apps-script-main/.clasp.json
          cd apps-script-main
          npx --yes @google/clasp@latest push --force
          npx --yes @google/clasp@latest create-deployment --deploymentId "$MAIN_DEPLOYMENT_ID" --description "GitHub Actions ${GITHUB_SHA}"

      - name: Deploy PUSH Apps Script when present
        if: env.DEPLOY_SCOPE == 'full'
        shell: bash
        env:
          PUSH_SCRIPT_ID: ${{ vars.JAYUMINTON_PUSH_SCRIPT_ID || secrets.JAYUMINTON_PUSH_SCRIPT_ID }}
          PUSH_DEPLOYMENT_ID: ${{ vars.JAYUMINTON_PUSH_DEPLOYMENT_ID || secrets.JAYUMINTON_PUSH_DEPLOYMENT_ID }}
        run: |
          set -euo pipefail
          if [[ ! -d apps-script-push ]]; then
            echo 'apps-script-push directory is not present in this source ref; skipping PUSH.'
            exit 0
          fi
          test -n "$PUSH_SCRIPT_ID" || { echo 'JAYUMINTON_PUSH_SCRIPT_ID is missing.'; exit 1; }
          test -n "$PUSH_DEPLOYMENT_ID" || { echo 'JAYUMINTON_PUSH_DEPLOYMENT_ID is missing.'; exit 1; }
          test -s apps-script-push/appsscript.json
          printf '{"scriptId":"%s","rootDir":"."}\n' "$PUSH_SCRIPT_ID" > apps-script-push/.clasp.json
          cd apps-script-push
          npx --yes @google/clasp@latest push --force
          npx --yes @google/clasp@latest create-deployment --deploymentId "$PUSH_DEPLOYMENT_ID" --description "GitHub Actions ${GITHUB_SHA}"

      - name: Deployment summary
        shell: bash
        run: |
          {
            echo '## 자유민턴 배포 완료'
            echo
            echo "- Source ref: $SOURCE_REF"
            echo "- Scope: $DEPLOY_SCOPE"
            echo "- Firebase Hosting: $HOSTING_URL"
          } >> "$GITHUB_STEP_SUMMARY"
