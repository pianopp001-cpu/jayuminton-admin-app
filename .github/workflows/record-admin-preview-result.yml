name: Record admin preview result

on:
  workflow_run:
    workflows: ["Deploy separate admin web via Cloudflare RPC"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Record preview conclusion and URL
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deployment/status
          LOG="$RUNNER_TEMP/preview.log"
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log > "$LOG" 2>/dev/null || true
          URL="$(grep -Eo 'ADMIN_TEST_URL=https://[^ ]+|https://[^ ]+--admin-cloudflare-vnext-[a-z0-9]+\.web\.app' "$LOG" | tail -1 | sed 's/^ADMIN_TEST_URL=//' || true)"
          printf 'run_id=%s\nhead_sha=%s\nconclusion=%s\nadmin_preview_url=%s\nrecorded_at=%s\n' \
            "$RUN_ID" "$RUN_HEAD_SHA" "$RUN_CONCLUSION" "$URL" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > deployment/status/admin-preview-latest.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment/status/admin-preview-latest.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record admin preview result $RUN_ID"
          git pull --rebase origin main
          git push origin main
