name: Link user app-install button directly to clean v1.1.5 APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-user-v115-test-link.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global @google/clasp@latest
      - name: Patch only user APK link and deploy
        shell: bash
        run: |
          set -euo pipefail
          CONFIG="$RUNNER_TEMP/deploy.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$CONFIG"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          MAIN_SCRIPT_ID="$(jq -r '.mainScriptId' "$CONFIG")"
          MAIN_DEPLOYMENT_ID="$(jq -r '.mainDeploymentId' "$CONFIG")"
          WORK="$RUNNER_TEMP/main"
          BEFORE="$RUNNER_TEMP/before"
          mkdir -p "$WORK" "$BEFORE"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$MAIN_SCRIPT_ID" > "$WORK/.clasp.json"
          cd "$WORK"
          clasp pull
          cp -a . "$BEFORE/"
          python3 "$GITHUB_WORKSPACE/deployment/scripts/patch_user_apk_v115_test_link.py" "$WORK"
          python3 - "$BEFORE" "$WORK" <<'PY'
          from pathlib import Path
          import sys
          before,after=map(Path,sys.argv[1:3])
          names={p.name for p in before.iterdir() if p.is_file()}|{p.name for p in after.iterdir() if p.is_file()}
          changed=set()
          for name in names:
              if name=='.clasp.json': continue
              a,b=before/name,after/name
              if (a.read_bytes() if a.exists() else None)!=(b.read_bytes() if b.exists() else None):
                  changed.add(name)
          if changed!={'Script.html'}:
              raise SystemExit('Unexpected live files changed: '+','.join(sorted(changed)))
          PY
          python3 - <<'PY'
          from pathlib import Path
          s=Path('Script.html').read_text(encoding='utf-8')
          a=s.find('<script>');b=s.rfind('</script>')
          if a<0 or b<=a: raise SystemExit('Script wrapper missing')
          Path(__import__('os').environ['RUNNER_TEMP'],'user-script-check.js').write_text(s[a+8:b],encoding='utf-8')
          PY
          node --check "$RUNNER_TEMP/user-script-check.js"
          grep -F 'jayuminton-courtstatus-v1.1.5-fresh-install.apk' Script.html >/dev/null
          grep -F 'function handleMemberSelfCardTap' Script.html >/dev/null
          grep -F 'member-new-badge' Script.html >/dev/null
          clasp push --force
          clasp create-deployment --deploymentId "$MAIN_DEPLOYMENT_ID" --description "user APK v1.1.5 test link $GITHUB_RUN_ID"
          VERIFY="$RUNNER_TEMP/verify"
          mkdir -p "$VERIFY"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$MAIN_SCRIPT_ID" > "$VERIFY/.clasp.json"
          cd "$VERIFY"
          clasp pull
          grep -F 'jayuminton-courtstatus-v1.1.5-fresh-install.apk' Script.html >/dev/null
          grep -F 'function handleMemberSelfCardTap' Script.html >/dev/null
          grep -F 'member-new-badge' Script.html >/dev/null
          cd "$GITHUB_WORKSPACE"
          printf 'status=success\nversion=1.1.5\nfilename=jayuminton-courtstatus-v1.1.5-fresh-install.apk\nchanged_files=Script.html\nadmin_files_changed=no\ndeployed_at=%s\n' "$(date -u +%FT%TZ)" > deployment/status/user-v115-test-link-live.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment/status/user-v115-test-link-live.txt
          git commit -m 'Verify live user v1.1.5 test install link'
          git pull --rebase origin main
          git push origin main
