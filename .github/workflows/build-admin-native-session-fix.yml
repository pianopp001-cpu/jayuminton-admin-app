name: Build admin group target-first, compact kok, wait game count v208.77
# retrigger: base v208.52 toolbar APK (member-replies freeze fix) now published on main

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-admin-native-session-fix.yml'
      - 'app/src/main/java/com/jayuminton/admin/MainActivity.java'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/build.gradle'
      - 'deployment/jayuminton/admin_member_replies_v1.js'
      - 'deployment/jayuminton/force_cloudflare_admin_login_v2050.py'
      - 'deployment/jayuminton/admin_game_count_selection_fix_patch.py'
      - 'deployment/jayuminton/admin_bottom_game_minus_layout_patch.py'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: jayuminton-admin-native-session-fix
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore proven shell
        shell: bash
        run: |
          set -euo pipefail
          PROVEN_COMMIT=20823018b13bba64082b09b76db617680a9d16b5
          rm -rf app
          git archive "$PROVEN_COMMIT" app | tar -x
          mkdir -p app/src/main/assets/admin
          BASE=releases/jayuminton-admin-v208.57-guaranteed-clear-fix.apk
          test -s "$BASE"
          unzip -p "$BASE" assets/admin/index.html > app/src/main/assets/admin/index.html
          test -s app/src/main/assets/admin/index.html

      - name: Apply the kok-check, cross-swap, long-press-message, and finish-court UI patches
        shell: bash
        run: |
          set -euo pipefail
          HTML=app/src/main/assets/admin/index.html
          python3 deployment/jayuminton/admin_court_wait_cross_swap_patch.py "$HTML"
          python3 deployment/jayuminton/admin_kok_submission_check_patch.py "$HTML"
          python3 deployment/jayuminton/admin_longpress_member_message_patch.py "$HTML"
          python3 deployment/jayuminton/admin_finish_court_speed_patch.py "$HTML"
          python3 deployment/jayuminton/admin_toolbar_selection_leak_fix_patch.py "$HTML"
          python3 deployment/jayuminton/admin_game_count_selection_fix_patch.py "$HTML"
          python3 deployment/jayuminton/admin_bottom_game_minus_layout_patch.py "$HTML"

          grep -F 'jmCourtWaitCrossSwapV1' "$HTML" >/dev/null
          grep -F "'swapCourtAndWaitGroup'" "$HTML" >/dev/null
          grep -F 'jmKokSubmitCheckV5' "$HTML" >/dev/null
          grep -F 'id="kokSubmitRoster"' "$HTML" >/dev/null
          grep -F 'id="kokSubmitTotal"' "$HTML" >/dev/null
          grep -F "server('setMemberKokInactive'" "$HTML" >/dev/null
          grep -F 'function setKokSubmitTab(' "$HTML" >/dev/null
          grep -F 'jm-kok-tab' "$HTML" >/dev/null
          grep -F 'jm-kok-roster-list' "$HTML" >/dev/null
          grep -F 'function completeKokMember(' "$HTML" >/dev/null
          grep -F 'text-decoration:line-through' "$HTML" >/dev/null
          grep -F "'jm-kok-row '" "$HTML" >/dev/null
          grep -F 'data-jm-kok-member-id="' "$HTML" >/dev/null
          grep -F 'jmLongPressMemberMessageV1' "$HTML" >/dev/null
          grep -F 'onclick="openMemberActionMessage()"' "$HTML" >/dev/null
          grep -F 'jmFinishCourtBigButtonAndOptimisticV3' "$HTML" >/dev/null
          grep -F 'function applyFinishCourtLocally(' "$HTML" >/dev/null
          grep -F 'class="finish-court-button"' "$HTML" >/dev/null
          grep -F "'코트 종료'" "$HTML" >/dev/null
          grep -F 'word-break:keep-all' "$HTML" >/dev/null
          grep -F 'jmToolbarSelectionLeakFixV1' "$HTML" >/dev/null
          grep -F "if(__jmNestedCtl&&__jmNestedCtl!==c)c=null;" "$HTML" >/dev/null
          grep -F "if(typeof window.__jmClearUnlimitedSelectedV1==='function')window.__jmClearUnlimitedSelectedV1();" "$HTML" >/dev/null
          grep -F 'jmGameCountSelectionUnifiedV20867' "$HTML" >/dev/null
          grep -F 'id="jmGameCountClearSelection"' "$HTML" >/dev/null
          grep -F '>전체 해제</button>' "$HTML" >/dev/null
          grep -F 'window.__jmUnlimitedSelected||[]' "$HTML" >/dev/null
          grep -F 'jmAdminFixedQuickMenuV20877' "$HTML" >/dev/null
          grep -F "menu.id='jmAdminFixedQuickMenu'" "$HTML" >/dev/null
          grep -F "make('jmQuickUndo','실행취소'" "$HTML" >/dev/null
          grep -F "make('jmQuickGameMinus','게임 -1'" "$HTML" >/dev/null
          grep -F "make('jmQuickMultiSwap','다중교환'" "$HTML" >/dev/null
          grep -F "make('jmQuickToggle','▼'" "$HTML" >/dev/null
          grep -F "['jmQuickGamePlus','게임 +1'" "$HTML" >/dev/null
          grep -F "['jmQuickGameZero','게임 모두 0'" "$HTML" >/dev/null
          grep -F "selection.id='jmQuickSelectionCount'" "$HTML" >/dev/null
          grep -F 'function removeAutoAssign()' "$HTML" >/dev/null
          grep -F 'function removeDuplicatePanels()' "$HTML" >/dev/null
          grep -F '멤버등록·비밀번호·콕제출체크' "$HTML" >/dev/null
          ! grep -F '멤버등록·비밀번호·게임횟수·콕제출체크' "$HTML" >/dev/null
          grep -F 'function manualGroupFromEmpty(el)' "$HTML" >/dev/null
          grep -F "kok.textContent='콕 닫기'" "$HTML" >/dev/null
          grep -F "closest('#kokSubmitRoster .jm-kok-row .name')" "$HTML" >/dev/null
          grep -F '#adminApp #jmUnlimitedToolbar{display:none!important' "$HTML" >/dev/null
          grep -F '#adminApp .jm-unlimited-check{display:none!important' "$HTML" >/dev/null
          ! grep -F "make('jmToolbarAutoAssign','자동배정'" "$HTML" >/dev/null
          ! grep -F 'id="adminBottomAutoAssign"' "$HTML" >/dev/null

      - name: Verify the pair-request/reply merge is present (baked into BASE by build-admin-toolbar-v2073.yml, which re-injects deployment/jayuminton/admin_member_replies_v1.js verbatim on every run)
        shell: bash
        run: |
          set -euo pipefail
          HTML=app/src/main/assets/admin/index.html

          grep -F "id='jmAdminReplyButton';b.innerHTML='회원쪽지" "$HTML" >/dev/null
          grep -F '<strong>회원쪽지</strong>' "$HTML" >/dev/null
          grep -F 'class="jm-admin-reply-popup-title">회원쪽지 도착' "$HTML" >/dev/null
          grep -F 'function flattenPairRequests(' "$HTML" >/dev/null
          grep -F 'jm-admin-reply-complete' "$HTML" >/dev/null
          grep -F "server('dismissPairNotice',[null,requestId])" "$HTML" >/dev/null
          ! grep -F "b.innerHTML='회원 답장" "$HTML" >/dev/null

      - name: Apply the RPC fetch-timeout fix (실행취소/새로고침 stuck disabled forever on a hung request)
        shell: bash
        run: |
          set -euo pipefail
          HTML=app/src/main/assets/admin/index.html

          # window.server(...) is the directServer() bridge injected by
          # force_cloudflare_admin_login_v2050.py, baked into the live BASE
          # apk from a much earlier build with no timeout on its fetch(). A
          # single hung mobile-network request then leaves that fetch's
          # promise pending forever -- never resolving, never rejecting -- so
          # any button awaiting it (새로고침, 자동배정, and anything that only
          # re-enables 실행취소 on success) stays disabled permanently with no
          # error and no recovery short of force-closing the app. This is the
          # "실행취소/새로고침 버튼이 아예 안 먹힌다" bug reported in
          # production. The script strips the stale pre-timeout block (found
          # via its old marker) and rebuilds it with an AbortController-based
          # timeout so a hang always eventually rejects instead.
          python3 deployment/jayuminton/force_cloudflare_admin_login_v2050.py

          grep -F '__JAYUMINTON_ADMIN_DIRECT_CLOUDFLARE_LOGIN_V2050_FETCH_TIMEOUT_V1__' "$HTML" >/dev/null
          grep -F 'var RPC_TIMEOUT_MS=20000;' "$HTML" >/dev/null
          grep -F 'new AbortController()' "$HTML" >/dev/null
          grep -F "signal:controller?controller.signal:undefined" "$HTML" >/dev/null
          grep -F '서버 응답이 없습니다. 네트워크 상태를 확인하고 다시 시도해주세요.' "$HTML" >/dev/null
          grep -F 'window.server=directServer;' "$HTML" >/dev/null
          [ "$(grep -o 'window.server=directServer;' "$HTML" | wc -l)" = "1" ]

      - name: Apply the session-persistence fix
        shell: bash
        run: |
          set -euo pipefail
          JAVA=app/src/main/java/com/jayuminton/admin/MainActivity.java
          HTML=app/src/main/assets/admin/index.html

          python3 - "$JAVA" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text(encoding='utf-8')

          old_import = "import android.webkit.WebSettings;\nimport android.webkit.WebStorage;\nimport android.webkit.WebView;"
          new_import = "import android.webkit.WebSettings;\nimport android.webkit.WebView;"
          if old_import not in text:
              raise SystemExit('import block anchor not found -- proven commit source has drifted')
          text = text.replace(old_import, new_import, 1)

          old_wipe = (
              "        webView.clearCache(true);\n"
              "        webView.clearHistory();\n"
              "        WebStorage.getInstance().deleteAllData();\n"
              "\n"
              "        CookieManager cookieManager = CookieManager.getInstance();\n"
              "        cookieManager.setAcceptCookie(true);\n"
              "        cookieManager.setAcceptThirdPartyCookies(webView, true);\n"
              "        cookieManager.removeSessionCookies(null);\n"
              "        cookieManager.flush();"
          )
          new_wipe = (
              "        // Do NOT clear WebStorage or session cookies here: the admin page\n"
              "        // stores its login token (ADMIN_AUTH_KEY) in localStorage and reads\n"
              "        // it back on load to skip the PIN prompt. Wiping storage on every\n"
              "        // onCreate() defeated that -- Android can and does kill this\n"
              "        // Activity's process while backgrounded (no foreground service),\n"
              "        // so every such restart was forcing a fresh PIN entry even though\n"
              "        // nothing about the login actually changed. clearCache/clearHistory\n"
              "        // stay: they only affect the HTTP resource cache and back/forward\n"
              "        // history, not localStorage, and LOAD_NO_CACHE below already makes\n"
              "        // the resource cache moot for this local asset anyway.\n"
              "        webView.clearCache(true);\n"
              "        webView.clearHistory();\n"
              "\n"
              "        CookieManager cookieManager = CookieManager.getInstance();\n"
              "        cookieManager.setAcceptCookie(true);\n"
              "        cookieManager.setAcceptThirdPartyCookies(webView, true);\n"
              "        cookieManager.flush();"
          )
          if old_wipe not in text:
              raise SystemExit('WebStorage wipe block anchor not found -- proven commit source has drifted')
          text = text.replace(old_wipe, new_wipe, 1)

          path.write_text(text, encoding='utf-8')
          PY

          python3 - "$JAVA" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text(encoding='utf-8')

          old_chrome = "        webView.setWebChromeClient(new WebChromeClient());"
          new_chrome = (
              "        webView.setWebChromeClient(new WebChromeClient() {\n"
              "            // Default WebView JS-dialog chrome prefixes the message with the\n"
              "            // page's own URL (\"file:///android_asset/...\" says / 페이지 내용),\n"
              "            // which is meaningless to the admin and just clutters every\n"
              "            // confirm()/alert() call (백업 저장, 백업 복원, 전체 초기화, ...).\n"
              "            // Showing a plain AlertDialog with just the message removes that.\n"
              "            //\n"
              "            // confirm()/alert() BLOCK the WebView's JS thread until result.confirm()\n"
              "            // or result.cancel() is called -- nothing else on the page can run until\n"
              "            // then. If AlertDialog.Builder(...).show() ever throws (e.g.\n"
              "            // BadTokenException from an invalid window state), that callback never\n"
              "            // runs, so the JS call never returns and the entire page freezes\n"
              "            // permanently with no error and no recovery -- no JS-side fix can help\n"
              "            // since the JS event loop itself is stuck. Guarantee result.cancel()/\n"
              "            // confirm() fires even on failure.\n"
              "            @Override\n"
              "            public boolean onJsAlert(WebView view, String url, String message, android.webkit.JsResult result) {\n"
              "                try {\n"
              "                    new android.app.AlertDialog.Builder(MainActivity.this)\n"
              "                            .setMessage(message)\n"
              "                            .setCancelable(false)\n"
              "                            .setPositiveButton(\"확인\", (dialog, which) -> result.confirm())\n"
              "                            .show();\n"
              "                } catch (Exception e) {\n"
              "                    result.confirm();\n"
              "                }\n"
              "                return true;\n"
              "            }\n"
              "\n"
              "            @Override\n"
              "            public boolean onJsConfirm(WebView view, String url, String message, android.webkit.JsResult result) {\n"
              "                try {\n"
              "                    new android.app.AlertDialog.Builder(MainActivity.this)\n"
              "                            .setMessage(message)\n"
              "                            .setCancelable(false)\n"
              "                            .setPositiveButton(\"확인\", (dialog, which) -> result.confirm())\n"
              "                            .setNegativeButton(\"취소\", (dialog, which) -> result.cancel())\n"
              "                            .show();\n"
              "                } catch (Exception e) {\n"
              "                    result.cancel();\n"
              "                }\n"
              "                return true;\n"
              "            }\n"
              "        });"
          )
          if 'try {' in text and 'onJsConfirm' in text and 'result.cancel();' in text:
              pass
          elif old_chrome not in text:
              raise SystemExit('WebChromeClient anchor not found -- proven commit source has drifted')
          else:
              text = text.replace(old_chrome, new_chrome, 1)

          path.write_text(text, encoding='utf-8')
          PY

          ! grep -F 'WebStorage.getInstance().deleteAllData()' "$JAVA" >/dev/null
          ! grep -F 'cookieManager.removeSessionCookies(null)' "$JAVA" >/dev/null
          ! grep -F 'import android.webkit.WebStorage;' "$JAVA" >/dev/null
          grep -F 'Do NOT clear WebStorage or session cookies here' "$JAVA" >/dev/null
          grep -F 'webView.clearCache(true)' "$JAVA" >/dev/null
          grep -F 'onJsAlert' "$JAVA" >/dev/null
          grep -F 'onJsConfirm' "$JAVA" >/dev/null
          grep -F 'result.cancel();' "$JAVA" >/dev/null

          grep -F '__JAYUMINTON_ADMIN_SMART_PLACEMENT_V2081__' "$HTML" >/dev/null
          grep -F '수동배정' "$HTML" >/dev/null
          grep -F 'swapBtn.click()' "$HTML" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_SERVER_TIMEOUT_V1__' "$HTML" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_RENDER_RESILIENCE_V1__' "$HTML" >/dev/null
          grep -F 'jmMemberFormSingleFieldV1' "$HTML" >/dev/null
          grep -F 'jmHideBrokenQuickMessageButtonV1' "$HTML" >/dev/null
          grep -F 'jmBottomTeamButtonV1' "$HTML" >/dev/null
          grep -F 'jmBottomTeamButton' "$HTML" >/dev/null
          grep -F 'jmVnextMemoFontSizeFixV1' "$HTML" >/dev/null
          grep -F 'jmRenderResilienceChainFixV1' "$HTML" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_LOGIN_LOAD_RESILIENCE_V1__' "$HTML" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_LOCK_WATCHDOG_V1__' "$HTML" >/dev/null
          grep -F 'jmSyncPublicMemosIdempotentFix' "$HTML" >/dev/null
          grep -F 'jmUnlimitedPaintIdempotentFix' "$HTML" >/dev/null
          grep -F 'jmTempTeamVisualStyleIdempotentFix' "$HTML" >/dev/null
          grep -F 'jmBadgesIdempotentFix' "$HTML" >/dev/null
          grep -F 'jmTagReturnButtonIdempotentFix' "$HTML" >/dev/null
          grep -F 'jmAdminLoginDiagnosticV1' "$HTML" >/dev/null
          grep -F 'jmGlobalErrorDiagnosticV1' "$HTML" >/dev/null
          grep -F 'jmServerWrapChainFixV1' "$HTML" >/dev/null
          grep -F 'jmLoginLoadDiagnosticV1' "$HTML" >/dev/null
          grep -F 'jmSkipAutoSystemStatusV1' "$HTML" >/dev/null
          grep -F 'jmSyncPublicMemosNodePlacementFixV1' "$HTML" >/dev/null
          grep -F 'jmSyncPublicMemosDisabledDuplicateFixV1' "$HTML" >/dev/null
          grep -F 'jmUnifiedSwapMoveFixV1' "$HTML" >/dev/null
          grep -F 'jmBatchFillEmptyLocationV1' "$HTML" >/dev/null
          grep -F 'jmWait4BoxScopeFixV1' "$HTML" >/dev/null
          grep -F 'jmBatchAssignSingleRpcV1' "$HTML" >/dev/null
          grep -F 'jmBottomActiveButtonV1' "$HTML" >/dev/null
          grep -F 'jmBottomActiveButton' "$HTML" >/dev/null
          grep -F 'jmAutoAssignTargetFillFixV1' "$HTML" >/dev/null
          grep -F 'window.__jmDuplicateNameFixV1' "$HTML" >/dev/null
          grep -F '__jmFullNameEverywhereV1' "$HTML" >/dev/null
          grep -F 'jmMarkAdminNewCardsFullNameFixV1' "$HTML" >/dev/null
          grep -F 'jmQuickRosterGridV1' "$HTML" >/dev/null
          grep -F 'jmRemoveDuplicateCheckboxV1' "$HTML" >/dev/null

      - name: Set APK identity and signer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          java=Path('app/src/main/java/com/jayuminton/admin/MainActivity.java')
          s=java.read_text(encoding='utf-8')
          s,n=re.subn(r'private static final String ADMIN_URL =\s*\n?\s*"[^"]+";', 'private static final String ADMIN_URL =\n            "file:///android_asset/admin/index.html?app=admin&native=1&appVersion=208.77";',s,count=1)
          if n!=1: raise SystemExit('ADMIN_URL replacement failed')
          java.write_text(s,encoding='utf-8')
          gradle=Path('app/build.gradle')
          g=gradle.read_text(encoding='utf-8')
          g=re.sub(r'versionCode\s+\d+','versionCode 65',g,count=1)
          g=re.sub(r"versionName\s+['\"][^'\"]+['\"]","versionName '1.55'",g,count=1)
          gradle.write_text(g,encoding='utf-8')
          PY
          base64 --decode app/src/main/res/drawable/icon_from_library.b64 > app/src/main/res/drawable/icon.png
          rm -f app/src/main/res/drawable/icon_from_library.b64
          base64 --decode signing/jayuminton-release.keystore.b64 > signing/jayuminton-release.jks

      - name: Build verify publish
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleRelease
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          unzip -p "$APK" assets/admin/index.html > "$RUNNER_TEMP/apk-admin.html"
          grep -F '__JAYUMINTON_ADMIN_SMART_PLACEMENT_V2081__' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F '수동배정' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_SERVER_TIMEOUT_V1__' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_RENDER_RESILIENCE_V1__' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F 'jmMemberFormSingleFieldV1' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F 'jmHideBrokenQuickMessageButtonV1' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F 'jmBottomTeamButtonV1' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F 'jmBottomTeamButton' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F 'jmVnextMemoFontSizeFixV1' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F 'jmRenderResilienceChainFixV1' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_LOGIN_LOAD_RESILIENCE_V1__' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_LOCK_WATCHDOG_V1__' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F 'jmSyncPublicMemosIdempotentFix' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F 'jmUnlimitedPaintIdempotentFix' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F 'jmTempTeamVisualStyleIdempotentFix' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F 'jmBadgesIdempotentFix' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F 'jmTagReturnButtonIdempotentFix' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F 'jmAdminLoginDiagnosticV1' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F 'jmGlobalErrorDiagnosticV1' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F 'jmServerWrapChainFixV1' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F 'jmLoginLoadDiagnosticV1' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F 'jmSkipAutoSystemStatusV1' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F 'jmSyncPublicMemosNodePlacementFixV1' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F 'jmSyncPublicMemosDisabledDuplicateFixV1' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F 'jmUnifiedSwapMoveFixV1' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F 'jmBatchFillEmptyLocationV1' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F 'jmWait4BoxScopeFixV1' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F 'jmBatchAssignSingleRpcV1' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F 'jmBottomActiveButtonV1' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F 'jmBottomActiveButton' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F 'jmAutoAssignTargetFillFixV1' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F 'window.__jmDuplicateNameFixV1' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F '__jmFullNameEverywhereV1' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F 'jmMarkAdminNewCardsFullNameFixV1' "$RUNNER_TEMP/apk-admin.html" >/dev/null
