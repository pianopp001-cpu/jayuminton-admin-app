name: Build admin native session fix v208.5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-admin-native-session-fix.yml'
      - 'app/src/main/java/com/jayuminton/admin/MainActivity.java'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/build.gradle'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: jayuminton-admin-native-session-fix
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify the WebStorage wipe is actually gone from source
        shell: bash
        run: |
          set -euo pipefail
          JAVA=app/src/main/java/com/jayuminton/admin/MainActivity.java
          test -s "$JAVA"
          ! grep -F 'WebStorage.getInstance().deleteAllData()' "$JAVA" >/dev/null
          ! grep -F 'cookieManager.removeSessionCookies(null)' "$JAVA" >/dev/null
          grep -F 'Do NOT clear WebStorage or session cookies here' "$JAVA" >/dev/null
          grep -F 'webView.clearCache(true)' "$JAVA" >/dev/null

      - name: Prepare current admin web asset and signing identity
        shell: bash
        run: |
          set -euo pipefail
          BASE=releases/jayuminton-admin-v208.4-auto-assign-fix.apk
          test -s "$BASE"
          mkdir -p app/src/main/assets/admin
          unzip -p "$BASE" assets/admin/index.html > app/src/main/assets/admin/index.html
          test -s app/src/main/assets/admin/index.html
          HTML=app/src/main/assets/admin/index.html
          grep -F '__JAYUMINTON_ADMIN_UNLIMITED_SELECTION_V2072__' "$HTML" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_TOOLBAR_V2073__' "$HTML" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_LAYOUT_WAIT4_COMPACT_V2079__' "$HTML" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_TOOLBAR_ACTIONS_V2077__' "$HTML" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_DEAD_UI_CLEANUP_V2080__' "$HTML" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_SMART_PLACEMENT_V2081__' "$HTML" >/dev/null
          grep -F '자리교환' "$HTML" >/dev/null
          grep -F 'swapBtn.click()' "$HTML" >/dev/null

          base64 --decode app/src/main/res/drawable/icon_from_library.b64 > app/src/main/res/drawable/icon.png
          base64 --decode signing/jayuminton-release.keystore.b64 > signing/jayuminton-release.jks

          python3 - <<'PY'
          from pathlib import Path
          import re
          gradle = Path('app/build.gradle')
          g = gradle.read_text(encoding='utf-8')
          g, n1 = re.subn(r'versionCode\s+\d+', 'versionCode 15', g, count=1)
          g, n2 = re.subn(r"versionName\s+['\"][^'\"]+['\"]", "versionName '1.5'", g, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit('versionCode/versionName bump failed')
          gradle.write_text(g, encoding='utf-8')
          PY

      - name: Gradle assembleRelease
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify built APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          unzip -p "$APK" assets/admin/index.html > "$RUNNER_TEMP/apk-admin.html"
          grep -F '__JAYUMINTON_ADMIN_SMART_PLACEMENT_V2081__' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F '자리교환' "$RUNNER_TEMP/apk-admin.html" >/dev/null

      - name: Publish APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          mkdir -p releases deployment/status
          cp "$APK" releases/jayuminton-admin-v208.5-native-session-fix.apk
          printf 'status=success\nversion=208.5\nfeature=native-session-fix\nbase=source-build\nrun_id=%s\nsha256=%s\n' "$GITHUB_RUN_ID" "$SHA" > deployment/status/v2085-native-session-fix.txt
          git add releases/jayuminton-admin-v208.5-native-session-fix.apk deployment/status/v2085-native-session-fix.txt
          git commit -m 'Publish admin v208.5 native session fix APK' || exit 0
          git push origin HEAD:main
