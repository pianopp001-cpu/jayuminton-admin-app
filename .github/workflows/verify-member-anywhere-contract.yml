name: Verify member anywhere contract

on:
  push:
    branches:
      - member-anywhere-controls-v3
    paths:
      - 'source-snapshot/current-main/MemberAnywhereSwap.js'
      - 'source-snapshot/current-main/MemberSwapClient.html'
      - 'source-snapshot/current-main/MemberSwapAction.html'
      - 'source-snapshot/current-main/MemberControls.html'
      - 'source-snapshot/current-main/MemberSwapInbox.html'
      - 'source-snapshot/current-main/Index.html'
      - '.github/workflows/verify-member-anywhere-contract.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: member-anywhere-controls-v3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify member anywhere integration contract
        shell: bash
        run: |
          set -euo pipefail
          SRC='source-snapshot/current-main'

          # The member page must load every layer used by the anywhere-swap flow.
          grep -F "include('MemberSwapClient')" "$SRC/Index.html" >/dev/null
          grep -F "include('MemberSwapAction')" "$SRC/Index.html" >/dev/null
          grep -F "include('MemberControls')" "$SRC/Index.html" >/dev/null
          grep -F "include('MemberSwapInbox')" "$SRC/Index.html" >/dev/null

          # Outgoing completion verification depends on the server returning targetId.
          grep -F 'function memberGetAnywhereOutgoingSwap(' "$SRC/MemberAnywhereSwap.js" >/dev/null
          grep -F 'targetId:String(targetId)' "$SRC/MemberAnywhereSwap.js" >/dev/null
          grep -F 'outgoing.targetId' "$SRC/MemberSwapAction.html" >/dev/null
          grep -F 'partnerCurrent===memberAnywhereOutgoingBaseline_' "$SRC/MemberSwapAction.html" >/dev/null

          # A request can expire between resolving the outgoing target and re-reading its cache entry.
          # The second read must be null-safe and must only clear the same outgoing pointer it resolved.
          grep -F "var request=memberAnywhereReadSwapRequest_(targetId);if(!request||String(request.requesterId)!==memberId||String(request.targetId)!==String(targetId))" "$SRC/MemberAnywhereSwap.js" >/dev/null
          grep -F "if(String(outgoingTarget||'')===String(targetId))CacheService.getDocumentCache().remove(memberAnywhereOutgoingCacheKey_(memberId))" "$SRC/MemberAnywhereSwap.js" >/dev/null

          # The shared active-outgoing resolver has the same race: stale cleanup must re-read the
          # outgoing pointer and remove it only if it still points at the target originally resolved.
          grep -F "function memberAnywhereReadActiveOutgoingTarget_(memberId)" "$SRC/MemberAnywhereSwap.js" >/dev/null
          grep -F "var outgoingTarget=memberAnywhereReadOutgoingTarget_(memberId);if(String(outgoingTarget||'')===String(targetId))CacheService.getDocumentCache().remove(memberAnywhereOutgoingCacheKey_(memberId));return '';" "$SRC/MemberAnywhereSwap.js" >/dev/null

          # Request actions must stay bound to the request identity shown on screen.
          grep -F 'expectedTargetId,expectedCreatedAt' "$SRC/MemberAnywhereSwap.js" >/dev/null
          grep -F 'expectedRequesterId,expectedCreatedAt' "$SRC/MemberAnywhereSwap.js" >/dev/null
          grep -F 'memberAnywhereCancelOutgoingServer_(expectedTargetId,expectedCreatedAt)' "$SRC/MemberSwapAction.html" >/dev/null
          grep -F 'memberAnywhereAcceptServer_(request)' "$SRC/MemberSwapInbox.html" >/dev/null
          grep -F 'memberAnywhereRejectServer_(request)' "$SRC/MemberSwapInbox.html" >/dev/null

          # Rejection must only report success when the exact displayed request was actually cleared.
          grep -F "if(!memberAnywhereClearSwapRequest_(memberId,request))return {ok:false,message:'자리교환 요청이 변경되었거나 이미 만료됐어요. 새 요청을 확인해 주세요.'};" "$SRC/MemberAnywhereSwap.js" >/dev/null
          grep -F "return {ok:true,message:'자리 교환 요청을 거절했어요.'};" "$SRC/MemberAnywhereSwap.js" >/dev/null
          # Any request-change or expiry race returned by accept/reject must re-poll instead of leaving a stale failure modal.
          grep -F "message.indexOf('자리교환 요청이 변경')===0||message==='교환 요청이 없거나 만료됐어요.'" "$SRC/MemberSwapInbox.html" >/dev/null
          grep -F "if(requestChanged_(result)){showLatestRequestAfterChange_(root);return;}" "$SRC/MemberSwapInbox.html" >/dev/null

          # Stale async responses must not cross member/login session boundaries.
          grep -F 'function memberAnywhereSameSession_(expected)' "$SRC/MemberSwapAction.html" >/dev/null
          grep -F "var expectedAuth=typeof memberAnywhereReadySession_==='function'?memberAnywhereReadySession_():null" "$SRC/MemberSwapAction.html" >/dev/null
          grep -F 'if(expectedAuth&&!memberAnywhereSameSession_(expectedAuth))' "$SRC/MemberSwapAction.html" >/dev/null
          grep -F 'function displayedSessionStillCurrent_()' "$SRC/MemberSwapInbox.html" >/dev/null
          grep -F 'if(!displayedSessionStillCurrent_())' "$SRC/MemberSwapInbox.html" >/dev/null
          grep -F "String(current.token||'')===displayedToken" "$SRC/MemberSwapInbox.html" >/dev/null

          # A stale incoming swap response must never close a different member-action modal.
          # Only the exact incoming request prompt may be closed before polling the latest request.
          grep -F "function showLatestRequestAfterChange_(root){var shouldClose=incomingPromptVisible_(activeRequestKey);" "$SRC/MemberSwapInbox.html" >/dev/null
          grep -F "if(shouldClose&&root&&typeof root.close==='function')root.close();" "$SRC/MemberSwapInbox.html" >/dev/null

          # Accepted swap state must use the same member-profile normalization path as normal state refreshes.
          grep -F "STATE=typeof normalizeStateMemberProfiles==='function'?normalizeStateMemberProfiles(result.state):result.state" "$SRC/MemberSwapInbox.html" >/dev/null
          grep -F "var targetId=String(request.targetId||'')" "$SRC/MemberSwapInbox.html" >/dev/null

          # Closing the outgoing pending modal must keep it dismissed while the same request is alive.
          # A new outgoing request must clear that suppression so its pending state can be shown normally.
          grep -F "if(memberAnywhereSuppressForegroundOnce_)return false;" "$SRC/MemberSwapAction.html" >/dev/null
          grep -F "memberAnywhereSuppressForegroundOnce_=true;root.close();" "$SRC/MemberSwapAction.html" >/dev/null
          grep -F "memberAnywhereSuppressForegroundOnce_=false;memberAnywhereOutgoingMemberId_=" "$SRC/MemberSwapAction.html" >/dev/null

          node --check "$SRC/MemberAnywhereSwap.js"

          python3 - <<'PY'
          from pathlib import Path
          src = Path('source-snapshot/current-main')
          for name in ['MemberSwapClient.html','MemberSwapAction.html','MemberControls.html','MemberSwapInbox.html']:
              text = (src / name).read_text(encoding='utf-8')
              start = text.find('<script>')
              end = text.rfind('</script>')
              if start < 0 or end <= start:
                  raise SystemExit(f'{name}: script block missing')
              (Path('/tmp') / f'{name}.js').write_text(text[start + 8:end], encoding='utf-8')
          PY

          for file in /tmp/Member*.html.js; do
            node --check "$file"
          done

          echo 'MEMBER_ANYWHERE_CONTRACT_OK'
