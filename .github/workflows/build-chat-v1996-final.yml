name: Build Jayuminton v199.6 chat final APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-chat-v1996-final.yml'
      - 'deployment/trigger-v1996-chat.txt'

permissions:
  contents: write

concurrency:
  group: jayuminton-v1996-chat-final
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare final v199.6 source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          java = Path('app/src/main/java/com/jayuminton/admin/MainActivity.java')
          text = java.read_text(encoding='utf-8')
          current_url = 'https://script.google.com/macros/s/AKfycbwVgdQG-DXbgxCgd8L11WA57-DCVaOwF4Sc_lktAZZ0yPJSCIosOOKkmKe3oU8a5pfJ7Q/exec?mode=admin'
          text = re.sub(r'https://script\.google\.com/macros/s/[^"\\]+/exec\?mode=admin[^"\\]*', current_url, text, count=1)
          text = re.sub(r'private static final String APK_WEB_BUILD = "[^"]+";', 'private static final String APK_WEB_BUILD = "1996-all-current";', text, count=1)
          text = re.sub(r'JayumintonNative/[0-9A-Za-z.\-]+(?: FreshAdmin/[0-9A-Za-z.\-]+)?', 'JayumintonNative/199.6 FreshAdmin/1996', text)
          if 'WebSettings.LOAD_NO_CACHE' not in text:
              raise SystemExit('LOAD_NO_CACHE missing')
          if 'WebStorage.getInstance().deleteAllData()' not in text:
              raise SystemExit('WebStorage reset missing')
          if 'NativeBrowser' not in text or 'jayuminton-push.web.app' not in text:
              raise SystemExit('PWA browser bridge missing')
          java.write_text(text, encoding='utf-8')

          gradle = Path('app/build.gradle')
          g = gradle.read_text(encoding='utf-8')
          g = re.sub(r"applicationId\s+['\"][^'\"]+['\"]", "applicationId 'com.jayuminton.admin199'", g, count=1)
          g = re.sub(r'versionCode\s+\d+', 'versionCode 1996', g, count=1)
          g = re.sub(r"versionName\s+['\"][^'\"]+['\"]", "versionName '199.6'", g, count=1)
          gradle.write_text(g, encoding='utf-8')

          manifest = Path('app/src/main/AndroidManifest.xml')
          m = manifest.read_text(encoding='utf-8')
          m = re.sub(r'\s+android:icon="[^"]*"', '', m)
          m = re.sub(r'\s+android:roundIcon="[^"]*"', '', m)
          m = m.replace('<application', '<application\n        android:icon="@drawable/jayuminton_dog"\n        android:roundIcon="@drawable/jayuminton_dog"', 1)
          manifest.write_text(m, encoding='utf-8')
          PY

          mkdir -p app/src/main/res/drawable
          rm -f app/src/main/res/drawable/icon.png
          cat > app/src/main/res/drawable/jayuminton_dog.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#0B6B49" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M24,45C20,30 30,19 42,25C49,19 59,19 66,25C79,19 89,31 84,45C93,53 93,74 82,83C71,94 37,94 26,83C15,73 15,54 24,45Z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M24,41C14,36 13,24 21,19C29,16 37,23 38,32Z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M84,41C94,36 95,24 87,19C79,16 71,23 70,32Z"/>
              <path android:fillColor="#111111" android:pathData="M38,52a4,4 0,1 0,8 0a4,4 0,1 0,-8 0"/>
              <path android:fillColor="#111111" android:pathData="M62,52a4,4 0,1 0,8 0a4,4 0,1 0,-8 0"/>
              <path android:fillColor="#111111" android:pathData="M49,60C49,56 59,56 59,60C59,64 55,66 54,66C53,66 49,64 49,60Z"/>
              <path android:fillColor="#111111" android:pathData="M39,67C45,76 63,76 69,67C67,79 43,79 39,67Z"/>
              <path android:fillColor="#F04438" android:pathData="M49,72C51,77 57,77 59,72C59,82 49,82 49,72Z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M18,18L28,11L35,22L25,28Z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M20,11L22,5L25,12ZM25,10L29,5L29,13ZM30,12L35,8L33,16Z"/>
          </vector>
          XML

          grep -F "applicationId 'com.jayuminton.admin199'" app/build.gradle
          grep -F 'versionCode 1996' app/build.gradle
          grep -F "versionName '199.6'" app/build.gradle
          grep -F '1996-all-current' app/src/main/java/com/jayuminton/admin/MainActivity.java
          grep -F 'jayuminton-push.web.app' app/src/main/java/com/jayuminton/admin/MainActivity.java
          grep -F 'android:icon="@drawable/jayuminton_dog"' app/src/main/AndroidManifest.xml

      - name: Restore release signing key
        shell: bash
        run: |
          set -euo pipefail
          test -s signing/jayuminton-release.keystore.b64
          base64 -d signing/jayuminton-release.keystore.b64 > signing/jayuminton-release.jks
          test -s signing/jayuminton-release.jks

      - name: Build signed release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.jayuminton.admin199'"
          "$AAPT" dump badging "$APK" | grep -F "versionCode='1996'"
          mkdir -p releases deployment/status
          cp "$APK" releases/jayuminton-v199.6-all-current.apk
          sha256sum releases/jayuminton-v199.6-all-current.apk | tee releases/jayuminton-v199.6-all-current.apk.sha256

      - name: Commit verified APK
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/jayuminton-v199.6-all-current.apk releases/jayuminton-v199.6-all-current.apk.sha256
          git commit -m 'Add verified Jayuminton v199.6 all-current APK' || true
          git pull --rebase origin main || true
          git push origin main

      - name: Record result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deployment/status
          cat > deployment/status/v1996-chat-final.txt <<EOF
          workflow=Build Jayuminton v199.6 chat final APK
          conclusion=${{ job.status }}
          run_id=${{ github.run_id }}
          head_sha=${{ github.sha }}
          updated_at=$(date -u +%FT%TZ)
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment/status/v1996-chat-final.txt
          git commit -m 'Record v199.6 chat final result: ${{ job.status }}' || true
          git pull --rebase origin main || true
          git push origin main || true
