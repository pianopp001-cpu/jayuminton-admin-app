name: Build v199.6 safe APK

on:
  push:
    branches: [main]
    paths:
      - 'deploy-triggers/apk-build-safe.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build and verify APK
        run: bash deployment/scripts/build_verified_v1996.sh
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: jayuminton-v199.6-verified
          path: releases/jayuminton-v199.6-verified.apk
          if-no-files-found: error
          retention-days: 30
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/jayuminton-v199.6-verified.apk deployment/status/apk-v1996.txt
          git commit -m 'Add fully verified Jayuminton v199.6 APK' || exit 0
          git pull --rebase origin main || true
          git push origin main
