name: Apply member wait-seat swap phase 2
'on':
  workflow_dispatch: {}
  push:
    branches:
      - phase4-exchange-patch
    paths:
      - .github/workflows/apply-member-wait-seat-swap-phase2.yml
permissions:
  contents: write
jobs:
  verify-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase4-exchange-patch
      - name: Verify phase 3 base is intact
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'MEMBER_WAIT_SEAT_PICK' source-snapshot/current-main/Script.html
          grep -q 'function memberMoveToWaitGroup' source-snapshot/current-main/Code.js
          grep -q 'function memberLeaveWaitGroup' source-snapshot/current-main/Code.js
          echo 'phase4 isolated branch base verified'
