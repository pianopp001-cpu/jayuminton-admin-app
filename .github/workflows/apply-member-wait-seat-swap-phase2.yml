name: Apply member wait-seat swap phase 2
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-member-wait-seat-swap-phase2.yml'
permissions:
  contents: write
concurrency:
  group: jayuminton-member-wait-seat-swap-phase2
  cancel-in-progress: true
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch swap approval safely
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          sp=Path('source-snapshot/current-main/Script.html')
          cp=Path('source-snapshot/current-main/Code.js')
          s=sp.read_text(encoding='utf-8')
          c=cp.read_text(encoding='utf-8')

          if 'function memberRequestWaitSwap(' not in s:
              anchor="async function memberLeaveWaitGroup(){\n  const a=memberWaitSeatSessionArgs(); if(!a||ACTION_IN_FLIGHT)return;\n  try{const state=await server('memberLeaveWaitGroup',[a.token,String(a.member.id)]);clearMemberWaitSeatPick();renderState(state);}\n  catch(e){clearMemberWaitSeatPick();alert(e.message||e);}\n}\n"
              if anchor not in s: raise SystemExit('unsafe: member leave client anchor missing')
              add=r'''async function memberRequestWaitSwap(targetMemberId){
  const a=memberWaitSeatSessionArgs(); if(!a||ACTION_IN_FLIGHT)return;
  try{
    const result=await server('memberRequestWaitSwap',[a.token,String(a.member.id),String(targetMemberId)]);
    clearMemberWaitSeatPick();
    showMemberSettingMessage(result&&result.message?result.message:'자리 교환을 요청했어요.');
  }catch(e){clearMemberWaitSeatPick();alert(e.message||e);}
}
function handleMemberWaitOtherTap(groupIndex,targetMemberId,event){
  if(IS_ADMIN)return;
  if(event){event.preventDefault();event.stopPropagation();}
  const a=memberWaitSeatSessionArgs(); if(!a)return;
  if(String(targetMemberId)===String(a.member.id))return;
  if(MEMBER_WAIT_SEAT_PICK&&MEMBER_WAIT_SEAT_PICK.type==='self'){
    clearMemberWaitSeatPick(); memberRequestWaitSwap(targetMemberId); return;
  }
  MEMBER_WAIT_SEAT_PICK={type:'other',groupIndex:Number(groupIndex),memberId:String(targetMemberId)};
  showMemberSettingMessage('내 자리를 터치하면 교환 요청을 보냅니다.');
}
let MEMBER_WAIT_SWAP_CHECKING=false;
let MEMBER_WAIT_SWAP_SHOWN='';
async function checkMemberWaitSwapRequest(){
  if(IS_ADMIN||MEMBER_WAIT_SWAP_CHECKING||ACTION_IN_FLIGHT)return;
  const a=memberWaitSeatSessionArgs(); if(!a)return;
  MEMBER_WAIT_SWAP_CHECKING=true;
  try{
    const req=await server('memberGetWaitSwapRequest',[a.token,String(a.member.id)]);
    if(!req||!req.id||String(req.id)===MEMBER_WAIT_SWAP_SHOWN)return;
    MEMBER_WAIT_SWAP_SHOWN=String(req.id);
    const accepted=confirm(String(req.requesterName||'다른 회원')+'님이 자리 교환을 요청했어요.\n\n서로 상의하셨다면 확인을 눌러 교환하세요.');
    const state=await server('memberRespondWaitSwap',[a.token,String(a.member.id),String(req.id),accepted]);
    if(state&&state.members)renderState(state);
    else if(!accepted)showMemberSettingMessage('자리 교환 요청을 거절했습니다.');
  }catch(e){if(String(e&&e.message||e).indexOf('요청')<0)console.warn(e);}
  finally{MEMBER_WAIT_SWAP_CHECKING=false;}
}
setInterval(checkMemberWaitSwapRequest,5000);
'''
              s=s.replace(anchor,anchor+add,1)

              old="""    if(MEMBER_WAIT_SEAT_PICK&&MEMBER_WAIT_SEAT_PICK.type==='empty'){const g=MEMBER_WAIT_SEAT_PICK.groupIndex;clearMemberWaitSeatPick();memberMoveToWaitGroup(g);return;}\n    MEMBER_WAIT_SEAT_PICK={type:'self',groupIndex:Number(groupIndex)};"""
              new="""    if(MEMBER_WAIT_SEAT_PICK&&MEMBER_WAIT_SEAT_PICK.type==='empty'){const g=MEMBER_WAIT_SEAT_PICK.groupIndex;clearMemberWaitSeatPick();memberMoveToWaitGroup(g);return;}\n    if(MEMBER_WAIT_SEAT_PICK&&MEMBER_WAIT_SEAT_PICK.type==='other'){const target=MEMBER_WAIT_SEAT_PICK.memberId;clearMemberWaitSeatPick();memberRequestWaitSwap(target);return;}\n    MEMBER_WAIT_SEAT_PICK={type:'self',groupIndex:Number(groupIndex)};"""
              if old not in s: raise SystemExit('unsafe: self tap anchor missing')
              s=s.replace(old,new,1)

              old="                return memberCard(member, false, false);\n              }\n\n              return (\n                '<div class=\"person ' +"
              new="                return '<div class=\"person member-info-card ' + genderClass(member) + '\" data-member-id=\"' + member.id + '\" onclick=\"handleMemberWaitOtherTap(' + groupIndex + ',\\\'' + member.id + '\\\',event)\">' + '<span class=\"name\">' + escapeMemberInfo(member.name) + '</span>' + memberInfoDetailHtml(member) + '</div>';\n              }\n\n              return (\n                '<div class=\"person ' +"
              if old not in s: raise SystemExit('unsafe: other wait member anchor missing')
              s=s.replace(old,new,1)

              old="    'memberMoveToWaitGroup','memberLeaveWaitGroup',\n    'createManualBackup'"
              new="    'memberMoveToWaitGroup','memberLeaveWaitGroup',\n    'memberRequestWaitSwap','memberRespondWaitSwap',\n    'createManualBackup'"
              if old not in s: raise SystemExit('unsafe: mutation list phase2 anchor missing')
              s=s.replace(old,new,1)

          if 'function memberRequestWaitSwap(' not in c:
              anchor='function changeMemberPassword(pin, newPassword) {'
              if anchor not in c: raise SystemExit('unsafe: server change password anchor missing')
              add=r'''function memberWaitLocation_(waitGroups,memberId){
  for(var g=0;g<waitGroups.length;g+=1){
    var p=(waitGroups[g]||[]).indexOf(String(memberId));
    if(p>=0)return {group:g,position:p};
  }
  return null;
}
function memberWaitSwapCacheKey_(memberId){return 'JAYUMINTON_WAIT_SWAP_'+String(memberId);}
function memberRequestWaitSwap(sessionToken,requesterId,targetId){
  return withDocumentLock_('회원 자리 교환 요청',function(){
    requesterId=memberSessionAuth_(sessionToken,requesterId); targetId=String(targetId||'');
    if(!targetId||targetId===requesterId)throw new Error('교환할 다른 회원을 선택하세요.');
    if(!readMembers_().some(function(m){return String(m.id)===targetId;}))throw new Error('상대 회원을 찾을 수 없습니다.');
    var waitGroups=readWaitGroups_(),a=memberWaitLocation_(waitGroups,requesterId),b=memberWaitLocation_(waitGroups,targetId);
    if(!a||!b)throw new Error('두 사람 모두 대기자리에 있을 때만 교환할 수 있습니다.');
    var req={id:Utilities.getUuid(),requesterId:requesterId,targetId:targetId,createdAt:Date.now()};
    CacheService.getDocumentCache().put(memberWaitSwapCacheKey_(targetId),JSON.stringify(req),300);
    return {ok:true,message:'자리 교환을 요청했어요.'};
  });
}
function memberGetWaitSwapRequest(sessionToken,memberId){
  memberId=memberSessionAuth_(sessionToken,memberId);
  var cache=CacheService.getDocumentCache(),key=memberWaitSwapCacheKey_(memberId),raw=cache.get(key);
  if(!raw)return null;
  var req;try{req=JSON.parse(raw);}catch(e){cache.remove(key);return null;}
  if(!req||String(req.targetId)!==memberId)return null;
  var waitGroups=readWaitGroups_();
  if(!memberWaitLocation_(waitGroups,req.requesterId)||!memberWaitLocation_(waitGroups,memberId)){cache.remove(key);return null;}
  var member=readMembers_().find(function(m){return String(m.id)===String(req.requesterId);});
  return {id:String(req.id),requesterId:String(req.requesterId),requesterName:member?String(member.name):'다른 회원'};
}
function memberRespondWaitSwap(sessionToken,targetId,requestId,accept){
  return withDocumentLock_('회원 자리 교환 응답',function(){
    targetId=memberSessionAuth_(sessionToken,targetId); requestId=String(requestId||'');
    var cache=CacheService.getDocumentCache(),key=memberWaitSwapCacheKey_(targetId),raw=cache.get(key);
    if(!raw)throw new Error('교환 요청이 만료되었어요.');
    var req=JSON.parse(raw);
    if(String(req.id)!==requestId||String(req.targetId)!==targetId)throw new Error('교환 요청이 변경되었어요.');
    cache.remove(key);
    if(!accept)return {ok:true,rejected:true};
    var waitGroups=readWaitGroups_(),a=memberWaitLocation_(waitGroups,req.requesterId),b=memberWaitLocation_(waitGroups,targetId);
    if(!a||!b)throw new Error('대기자리가 변경되어 교환할 수 없습니다. 다시 요청해 주세요.');
    waitGroups[a.group][a.position]=targetId;
    waitGroups[b.group][b.position]=String(req.requesterId);
    writeWaitGroups_(waitGroups);touch_();return getPublicState();
  });
}
'''
              c=c.replace(anchor,add+anchor,1)

          sp.write_text(s,encoding='utf-8')
          cp.write_text(c,encoding='utf-8')
          PY
      - name: Safety checks and commit
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'function memberRequestWaitSwap' source-snapshot/current-main/Script.html
          grep -q 'function memberRespondWaitSwap' source-snapshot/current-main/Code.js
          grep -q 'setInterval(checkMemberWaitSwapRequest,5000)' source-snapshot/current-main/Script.html
          grep -q '서로 상의하셨다면 확인' source-snapshot/current-main/Script.html
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected=$'source-snapshot/current-main/Code.js\nsource-snapshot/current-main/Script.html'
          test "$changed" = "$expected"
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source-snapshot/current-main/Script.html source-snapshot/current-main/Code.js
          git commit -m 'feat: add member wait-seat swap approval'
          git push origin HEAD:main
