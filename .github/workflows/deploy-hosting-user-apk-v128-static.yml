name: Deploy v1.2.8 user APK directly on Firebase Hosting

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-hosting-user-apk-v128-static.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: jayuminton-user-v128-static-hosting
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --global firebase-tools@latest
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Resolve Hosting and verify exact APK bytes
        shell: bash
        run: |
          set -euo pipefail
          C="$RUNNER_TEMP/deploy.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$C"
          FIREBASE_PROJECT_ID="$(jq -r '.firebaseProjectId' "$C")"
          HOSTING_URL="$(jq -r '.hostingUrl' "$C")"
          MAIN_DEPLOYMENT_ID="$(jq -r '.mainDeploymentId' "$C")"
          PUSH_DEPLOYMENT_ID="$(jq -r '.pushDeploymentId' "$C")"
          for value in "$FIREBASE_PROJECT_ID" "$HOSTING_URL" "$MAIN_DEPLOYMENT_ID" "$PUSH_DEPLOYMENT_ID"; do
            test -n "$value"; test "$value" != null
          done
          {
            echo "FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID"
            echo "HOSTING_URL=$HOSTING_URL"
            echo "MAIN_URL=https://script.google.com/macros/s/$MAIN_DEPLOYMENT_ID/exec"
            echo "PUSH_URL=https://script.google.com/macros/s/$PUSH_DEPLOYMENT_ID/exec"
          } >> "$GITHUB_ENV"

          STATUS='deployment/status/user-native-push-v1.2.8.txt'
          APK='releases/jayuminton-courtstatus-v1.2.8-repeat-switch.apk'
          test -s "$STATUS"; test -s "$APK"
          grep -F 'status=success' "$STATUS" >/dev/null
          grep -F 'version=1.2.8' "$STATUS" >/dev/null
          grep -F 'version_code=128' "$STATUS" >/dev/null
          EXPECTED="$(sed -n 's/^apk_sha256=//p' "$STATUS" | tail -1)"
          test -n "$EXPECTED"
          test "$(sha256sum "$APK" | awk '{print $1}')" = "$EXPECTED"
          echo "EXPECTED_APK_SHA=$EXPECTED" >> "$GITHUB_ENV"

      - name: Build Hosting with same-origin v1.2.8 APK
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/deployment/jayuminton/v1637-web"
          ROOT="$RUNNER_TEMP/hosting-v128-static"
          PUBLIC="$ROOT/public"
          mkdir -p "$PUBLIC"
          cp "$SRC/index.html" "$PUBLIC/index.html"
          cp "$SRC/setup-v205.css" "$PUBLIC/setup-v205.css"
          cp "$SRC/manifest.webmanifest" "$PUBLIC/manifest.webmanifest"
          cp "$SRC/firebase-messaging-sw.js" "$PUBLIC/firebase-messaging-sw.js"
          cp "$SRC/alert-self-test.js" "$PUBLIC/alert-self-test.js"
          cp releases/jayuminton-courtstatus-v1.2.8-repeat-switch.apk "$PUBLIC/jayuminton-courtstatus-v1.2.8-repeat-switch.apk"

          BASE="${HOSTING_URL%/}"
          for asset in icon-198.png icon-512.png apple-touch-icon-180.png badge-96.png; do
            curl --fail --location --retry 5 "$BASE/$asset?source=$GITHUB_RUN_ID" -o "$PUBLIC/$asset"
          done

          cat "$SRC"/setup-v205.js.gz.b64.part-* | tr -d '\r\n' | base64 -d > "$RUNNER_TEMP/setup.gz"
          gzip -dc "$RUNNER_TEMP/setup.gz" > "$PUBLIC/setup-v205.js"
          python3 deployment/scripts/patch_push_setup_verification.py "$PUBLIC/setup-v205.js"
          python3 deployment/scripts/patch_embedded_browser_push.py "$PUBLIC/setup-v205.js"
          python3 deployment/scripts/patch_native_host_bridge.py "$PUBLIC/setup-v205.js"
          python3 deployment/scripts/patch_user_install_link_v128.py hosting "$PUBLIC/setup-v205.js"

          python3 - <<'PY'
          from pathlib import Path
          import os, re
          public=Path(os.environ['RUNNER_TEMP'])/'hosting-v128-static'/'public'
          run=os.environ['GITHUB_RUN_ID']
          apk=f"/jayuminton-courtstatus-v1.2.8-repeat-switch.apk?build=128-hosting-{run}"

          setup=public/'setup-v205.js'
          s=setup.read_text(encoding='utf-8')
          s=re.sub(
              r"const JAYUMINTON_USER_APK_V128 = '[^']+';",
              f"const JAYUMINTON_USER_APK_V128 = '{apk}';",
              s,
              count=1,
          )
          if apk not in s:
              raise SystemExit('same-origin v1.2.8 APK route missing')
          if 'v1.2.4-confirmed-overlay.apk' in s or 'v1.1.7-fresh-install.apk' in s:
              raise SystemExit('old APK route remained in Hosting setup')
          setup.write_text(s,encoding='utf-8')

          template=Path('deployment/jayuminton/v1637-web/config-v204.template.js').read_text(encoding='utf-8')
          config=template.replace('__MEMBER_PAGE_URL__',os.environ['MAIN_URL']).replace('__RELAY_URL__',os.environ['PUSH_URL'])
          for name in ('config-v202.js','config-v203.js','config-v204.js'):
              (public/name).write_text(config,encoding='utf-8')

          index=public/'index.html'
          h=index.read_text(encoding='utf-8')
          h=h.replace('/setup-v205.js?v=1637',f'/setup-v205.js?v=v128-static-{run}')
          h=h.replace('/config-v204.js?v=1637',f'/config-v204.js?v=v128-static-{run}')
          index.write_text(h,encoding='utf-8')

          sw=public/'firebase-messaging-sw.js'
          w=sw.read_text(encoding='utf-8')
          w=re.sub(r"const JAYUMINTON_SW_VERSION = '[^']+';",f"const JAYUMINTON_SW_VERSION = 'v128-static-{run}';",w,count=1)
          w=re.sub(r"const JAYUMINTON_CACHE = '[^']+';",f"const JAYUMINTON_CACHE = 'jayuminton-v128-static-{run}';",w,count=1)
          sw.write_text(w,encoding='utf-8')
          PY

          node --check "$PUBLIC/setup-v205.js"
          node --check "$PUBLIC/firebase-messaging-sw.js"
          grep -F '/jayuminton-courtstatus-v1.2.8-repeat-switch.apk?build=128-hosting-' "$PUBLIC/setup-v205.js" >/dev/null
          ! grep -F 'v1.2.4-confirmed-overlay.apk' "$PUBLIC/setup-v205.js"
          test "$(sha256sum "$PUBLIC/jayuminton-courtstatus-v1.2.8-repeat-switch.apk" | awk '{print $1}')" = "$EXPECTED_APK_SHA"

          cat > "$ROOT/firebase.json" <<'JSON'
          {"hosting":{"public":"public","ignore":["firebase.json","**/.*","**/node_modules/**"],"headers":[{"source":"/index.html","headers":[{"key":"Cache-Control","value":"no-cache, no-store, must-revalidate"}]},{"source":"/setup-v205.js","headers":[{"key":"Cache-Control","value":"no-cache, no-store, must-revalidate"}]},{"source":"/firebase-messaging-sw.js","headers":[{"key":"Cache-Control","value":"no-cache, no-store, must-revalidate"}]},{"source":"/*.apk","headers":[{"key":"Cache-Control","value":"no-cache, no-store, must-revalidate"},{"key":"Content-Type","value":"application/vnd.android.package-archive"}]}],"rewrites":[{"source":"**","destination":"/index.html"}]}}
          JSON
          firebase deploy --only hosting --project "$FIREBASE_PROJECT_ID" --config "$ROOT/firebase.json" --non-interactive

      - name: Verify actual Hosting button and downloaded APK bytes
        shell: bash
        run: |
          set -euo pipefail
          BASE="${HOSTING_URL%/}"
          ok=0
          for attempt in $(seq 1 20); do
            curl --fail --location --silent --show-error -H 'Cache-Control: no-cache, no-store' \
              "$BASE/setup-v205.js?verify=v128-static-$GITHUB_RUN_ID-$attempt" -o "$RUNNER_TEMP/live-setup.js" || true
            if grep -F '/jayuminton-courtstatus-v1.2.8-repeat-switch.apk?build=128-hosting-' "$RUNNER_TEMP/live-setup.js" >/dev/null 2>&1 && \
               ! grep -F 'v1.2.4-confirmed-overlay.apk' "$RUNNER_TEMP/live-setup.js" >/dev/null 2>&1; then
              ok=1; break
            fi
            sleep 6
          done
          test "$ok" = 1

          curl --fail --location --retry 5 -H 'Cache-Control: no-cache, no-store' \
            "$BASE/jayuminton-courtstatus-v1.2.8-repeat-switch.apk?verify=$GITHUB_RUN_ID" \
            -o "$RUNNER_TEMP/live-v128.apk"
          test "$(sha256sum "$RUNNER_TEMP/live-v128.apk" | awk '{print $1}')" = "$EXPECTED_APK_SHA"

          cat > deployment/status/user-v128-static-hosting-live.txt <<EOF
          status=success
          version=1.2.8
          version_code=128
          apk=jayuminton-courtstatus-v1.2.8-repeat-switch.apk
          apk_sha256=$EXPECTED_APK_SHA
          hosting_download=same-origin
          hosting_button=v1.2.8-only
          old_v124_link_present=no
          live_apk_hash_match=yes
          apps_script_version_limit_detected=yes
          admin_logic_changed=no
          verified_at=$(date -u +%FT%TZ)
          EOF

      - name: Publish Hosting verification
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment/status/user-v128-static-hosting-live.txt
          git commit -m 'Verify Firebase Hosting serves v1.2.8 APK directly' || exit 0
          git pull --rebase origin main || true
          git push origin main
