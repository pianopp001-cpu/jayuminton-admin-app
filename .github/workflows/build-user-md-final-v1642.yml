name: Build unified MD-final user APK v1.6.42

# Canonical Cloudflare-only user APK. Workflow edits do not self-trigger builds.
on:
  push:
    branches: [main]
    paths:
      - 'deployment/scripts/patch_user_native_v1642_md_final.py'
      - 'deployment/jayuminton/patch_member_user_requirements_v1.py'
      - 'cloudflare/state-worker/worker-md-entry.js'
      - 'cloudflare/user-push/worker-do.js'
      - 'cloudflare/user-push/*.test.mjs'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: jayuminton-user-md-final-v1642
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      FIREBASE_PROJECT_CONFIG: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      WORKER_URL: https://jayuminton-user-push.pianopp001.workers.dev
      APK_PATH: releases/jayuminton-courtstatus-v1.6.42-md-final.apk
      AAB_PATH: releases/jayuminton-courtstatus-v1.6.42-md-final.aab
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
      PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
      PLAY_UPLOAD_KEYSTORE_B64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.7'}
      - uses: google-github-actions/auth@v2
        with: {credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}'}
      - run: npm install --global firebase-tools@latest
      - name: Verify Cloudflare state and push contracts
        shell: bash
        run: |
          set -euo pipefail
          node cloudflare/state-worker/worker.test.mjs
          node cloudflare/state-worker/md4-autoassign.test.mjs
          node cloudflare/state-worker/md-entry-autoassign.test.mjs
          node cloudflare/state-worker/md-final-entry.test.mjs
          node cloudflare/user-push/worker-do.test.mjs
          curl -fsS --retry 5 "$WORKER_URL/health" > "$RUNNER_TEMP/push-health.json"
          jq -e '.ok==true and .storage=="durable-object"' "$RUNNER_TEMP/push-health.json" >/dev/null
          grep -F "repeatCount: '8'" cloudflare/user-push/worker-do.js >/dev/null
          grep -F "pulsesPerGroup: '3'" cloudflare/user-push/worker-do.js >/dev/null
          grep -F 'rosterNames' cloudflare/user-push/worker-do.js >/dev/null
      - name: Prepare Firebase Android config
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_PROJECT_CONFIG" > "$RUNNER_TEMP/deploy.json"
          FIREBASE_PROJECT_ID="$(jq -r '.firebaseProjectId // empty' "$RUNNER_TEMP/deploy.json")"
          test -n "$FIREBASE_PROJECT_ID"
          echo "FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID" >> "$GITHUB_ENV"
          firebase apps:list ANDROID --project "$FIREBASE_PROJECT_ID" --json > "$RUNNER_TEMP/apps.json"
          APP_ID="$(jq -r '[.. | objects | select(((.packageName? == "com.jayuminton.user") or (.package_name? == "com.jayuminton.user") or (.androidClientInfo?.packageName? == "com.jayuminton.user")) and ((.appId? // .app_id?) != null)) | (.appId? // .app_id?)] | first // empty' "$RUNNER_TEMP/apps.json")"
          test -n "$APP_ID"
          firebase apps:sdkconfig ANDROID "$APP_ID" --project "$FIREBASE_PROJECT_ID" > app/google-services.json
      - name: Build MD-final native user APK
        shell: bash
        run: |
          set -euo pipefail
          export PUSH_URL="$WORKER_URL"
          BUILD="$RUNNER_TEMP/build-v1642.sh"
          cp deployment/scripts/build_user_native_push_fresh_v110.sh "$BUILD"
          for patch in patch_build_user_native_v111.py patch_build_user_native_v112.py patch_build_user_native_v113.py patch_build_user_native_v114.py patch_build_user_native_v115.py patch_build_user_native_v116.py patch_build_user_native_v117.py patch_build_user_native_v118.py patch_build_user_native_v119.py patch_build_user_native_v120_diagnostic.py patch_build_user_native_v121.py patch_build_user_native_v122.py patch_build_user_native_v124_confirmed_overlay.py patch_build_user_native_v126_stop_controller.py patch_build_user_native_v126_raceguard.py patch_build_user_native_v127_member_switch.py patch_build_user_native_v128_repeat_switch.py patch_build_user_native_v129_background_registration.py; do
            python3 "deployment/scripts/$patch" "$BUILD"
          done
          python3 deployment/scripts/patch_user_native_v130_vibration_cap8.py "$BUILD"
          python3 deployment/scripts/patch_user_native_v132_strict_current_member.py "$BUILD"
          python3 deployment/scripts/patch_user_native_v133_install_safe.py "$BUILD"
          python3 deployment/scripts/patch_user_native_v134_cloudflare_complete.py "$BUILD"
          python3 deployment/scripts/patch_user_native_v1642_md_final.py "$BUILD"
          python3 deployment/scripts/patch_user_native_target_sdk35_v1.py "$BUILD"
          grep -F 'VERSION="1.6.42"' "$BUILD" >/dev/null
          grep -F 'MAX_GROUPS = 8' "$BUILD" >/dev/null
          grep -F 'NativePushRegistrar.isCurrentMember' "$BUILD" >/dev/null
          grep -F 'targetSdk 35' "$BUILD" >/dev/null
          bash "$BUILD"

          # Play Console has already accepted a release signed with the
          # dedicated "Jayuminton Play Upload" key (fingerprint
          # 6B:3A:77:5B:54:B1:EB:F8:26:C9:3C:73:F8:6A:FD:E1:41:CB:C6:8D:49:8A:
          # 22:43:BC:0A:69:D8:A8:7C:A6:6F) -- Play requires every future
          # upload for this app to keep using that exact key, so the AAB
          # CANNOT reuse signing/jayuminton-release.jks (that one signs the
          # sideload APK and the admin app; confirmed by inspecting its own
          # cert, subject CN=Jayuminton/OU=Admin App, a completely different
          # certificate). android.injected.signing.* properties override
          # build.gradle's signingConfigs.release for just this one gradle
          # invocation without needing a second product flavor, so the
          # sideload APK above is unaffected.
          test -n "$PLAY_UPLOAD_KEYSTORE_B64"
          test -n "$PLAY_UPLOAD_KEY_ALIAS"
          test -n "$PLAY_UPLOAD_KEY_PASSWORD"
          printf '%s' "$PLAY_UPLOAD_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/play-upload.jks"
          test -s "$RUNNER_TEMP/play-upload.jks"
          gradle --no-daemon bundleRelease \
            "-Pandroid.injected.signing.store.file=$RUNNER_TEMP/play-upload.jks" \
            "-Pandroid.injected.signing.store.password=$PLAY_UPLOAD_KEY_PASSWORD" \
            "-Pandroid.injected.signing.key.alias=$PLAY_UPLOAD_KEY_ALIAS" \
            "-Pandroid.injected.signing.key.password=$PLAY_UPLOAD_KEY_PASSWORD"
      - name: Verify and publish APK + AAB
        shell: bash
        run: |
          set -euo pipefail
          SRC=app/build/outputs/apk/release/app-release.apk
          test -s "$SRC"
          mkdir -p releases deployment/status
          cp "$SRC" "$APK_PATH"
          if unzip -p "$APK_PATH" classes.dex 2>/dev/null | strings | grep -F 'script.google.com/macros/s/' >/dev/null; then
            echo 'Forbidden GAS URL detected in final user APK' >&2
            exit 1
          fi
          SHA="$(sha256sum "$APK_PATH" | awk '{print $1}')"

          # Play Console (공개/비공개 테스트 등 모든 트랙) requires an .aab
          # upload for new releases. Unlike the APK above, this AAB is
          # deliberately signed with a DIFFERENT key (PLAY_UPLOAD_KEY_* in
          # the previous step) -- Play Console already accepted a release
          # under the dedicated "Jayuminton Play Upload" cert and will
          # reject any future upload signed with a different one, so the
          # fingerprint is verified below rather than assumed.
          AAB_SRC=app/build/outputs/bundle/release/app-release.aab
          test -s "$AAB_SRC"
          cp "$AAB_SRC" "$AAB_PATH"
          if unzip -p "$AAB_PATH" base/dex/classes.dex 2>/dev/null | strings | grep -F 'script.google.com/macros/s/' >/dev/null; then
            echo 'Forbidden GAS URL detected in final user AAB' >&2
            exit 1
          fi
          EXPECTED_AAB_FINGERPRINT='6B:3A:77:5B:54:B1:EB:F8:26:C9:3C:73:F8:6A:FD:E1:41:CB:C6:8D:49:8A:22:43:BC:0A:69:D8:A8:7C:A6:6F'
          unzip -p "$AAB_PATH" 'META-INF/*.RSA' > "$RUNNER_TEMP/aab-signer.rsa"
          test -s "$RUNNER_TEMP/aab-signer.rsa"
          ACTUAL_AAB_FINGERPRINT="$(openssl pkcs7 -inform DER -in "$RUNNER_TEMP/aab-signer.rsa" -print_certs 2>/dev/null | openssl x509 -noout -fingerprint -sha256 | sed 's/^sha256 Fingerprint=//')"
          if [ "$ACTUAL_AAB_FINGERPRINT" != "$EXPECTED_AAB_FINGERPRINT" ]; then
            echo "AAB signed with the wrong key: expected $EXPECTED_AAB_FINGERPRINT, got $ACTUAL_AAB_FINGERPRINT" >&2
            exit 1
          fi
          AAB_SHA="$(sha256sum "$AAB_PATH" | awk '{print $1}')"

          NOW="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          {
            echo 'status=success'
            echo 'version=1.6.42'
            echo 'backend=cloudflare-only'
            echo 'push=cloudflare-durable-object-fcm'
            echo 'vibration=3x8'
            echo 'current_member_only=true'
            echo 'push_target_contract=tested'
            echo "run_id=$GITHUB_RUN_ID"
            echo "sha256=$SHA"
            echo "aab_path=$AAB_PATH"
            echo "aab_sha256=$AAB_SHA"
            echo "updated_at=$NOW"
          } > deployment/status/user-apk-v1642.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$APK_PATH" "$AAB_PATH" deployment/status/user-apk-v1642.txt
          git commit -m 'Publish MD-final user APK v1.6.42 + Play Console AAB' || exit 0
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          git push origin HEAD:main
