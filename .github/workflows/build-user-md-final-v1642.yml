name: Legacy MD-final user build compatibility check

# This workflow used to publish the Play artifact itself. The canonical publisher
# is now build-user-2001648.yml. Keep this file only as a manual compatibility
# check so native patch changes cannot start two competing artifact publishers.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - name: Verify canonical 2001648 user build contract
        shell: bash
        run: |
          set -euo pipefail
          CANONICAL=.github/workflows/build-user-2001648.yml
          PATCH=deployment/scripts/patch_user_native_v1642_md_final.py
          VERSION_PATCH=deployment/scripts/patch_user_native_versioncode_2001645_v1.py
          STATUS=deployment/status/user-apk-v1642.txt

          test -s "$CANONICAL"
          test -s "$PATCH"
          test -s "$VERSION_PATCH"
          test -s "$STATUS"

          grep -F 'VERSION_CODE="2001648"' "$CANONICAL" >/dev/null
          grep -F 'USER_ONLY_LAYOUT_V2001648' "$CANONICAL" >/dev/null
          grep -F 'startAdminMessageVibration' "$CANONICAL" >/dev/null
          grep -F 'stopAdminMessageVibration' "$CANONICAL" >/dev/null
          grep -F 'version_code=2001648' "$STATUS" >/dev/null
          grep -F 'admin_message_native_vibration=true' "$STATUS" >/dev/null
          grep -F 'admin_message_confirm_stops_vibration=true' "$STATUS" >/dev/null

          if grep -F 'VERSION_CODE="2001647"' "$CANONICAL" >/dev/null; then
            echo 'Stale 2001647 version marker remains in canonical workflow' >&2
            exit 1
          fi
          if grep -F 'USER_ONLY_LAYOUT_V2001647' "$CANONICAL" >/dev/null; then
            echo 'Stale 2001647 layout marker remains in canonical workflow' >&2
            exit 1
          fi

          echo 'LEGACY_MD_FINAL_COMPAT_OK canonical=build-user-2001648 versionCode=2001648'
