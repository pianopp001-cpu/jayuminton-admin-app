name: Build unified MD-final user APK v1.6.42

# Cloudflare-only user APK. Do not rebuild merely because state-worker regression tests changed.
on:
  push:
    branches: [main]
    paths:
      - 'deployment/scripts/patch_user_native_v1642_md_final.py'
      - '.github/workflows/build-user-md-final-v1642.yml'
      - 'deployment/jayuminton/patch_member_user_requirements_v1.py'
      - 'cloudflare/state-worker/worker-md-entry.js'
      - 'cloudflare/user-push/worker-do.js'
      - 'cloudflare/user-push/*.test.mjs'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: jayuminton-user-md-final-v1642
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      FIREBASE_PROJECT_CONFIG: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      WORKER_URL: https://jayuminton-user-push.pianopp001.workers.dev
      APK_PATH: releases/jayuminton-courtstatus-v1.6.42-md-final.apk
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Rebuild user APK from current Cloudflare-only source
        shell: bash
        run: |
          set -euo pipefail
          python3 deployment/scripts/patch_user_native_v1642_md_final.py
      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail
          test -s "$APK_PATH"
