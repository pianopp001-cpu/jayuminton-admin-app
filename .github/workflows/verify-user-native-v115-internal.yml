name: Verify internal APK FCM acceptance path redirect-fixed

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-user-native-v115-internal.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Inspect published APK bytecode
        shell: bash
        run: |
          set -euo pipefail
          APK="releases/jayuminton-courtstatus-v1.1.5-fresh-install.apk"
          test -s "$APK"
          unzip -p "$APK" classes.dex > "$RUNNER_TEMP/classes.dex"
          strings "$RUNNER_TEMP/classes.dex" > "$RUNNER_TEMP/classes.txt"
          missing=0
          : > "$RUNNER_TEMP/missing.txt"
          for marker in \
            'test_native_push' \
            'setInstanceFollowRedirects' \
            'Location' \
            'fcm_accepted' \
            'fcm_test_failed' \
            'fcm_test_message_id' \
            'jayuminton_wait1_system_v114' \
            'jayuminton_court_system_v114' \
            'JayumintonNativeAndroid/1.1.5' \
            'NativeSystemChannels' \
            'JayumintonFirebaseMessagingService'
          do
            if ! grep -F "$marker" "$RUNNER_TEMP/classes.txt" >/dev/null; then
              echo "$marker" >> "$RUNNER_TEMP/missing.txt"
              missing=1
            fi
          done
          SHA="$(sha256sum "$APK" | awk '{print $1}')"
          EXPECTED_SHA="$(sed -n 's/^apk_sha256=//p' deployment/status/user-native-push-v1.1.5.txt)"
          test -n "$EXPECTED_SHA"
          test "$SHA" = "$EXPECTED_SHA"
          RESULT=success
          if [ "$missing" != 0 ]; then RESULT=failure; fi
          printf 'status=%s\nversion=1.1.5\napk_sha256=%s\nserver_test_action=yes\nfcm_acceptance_required=yes\nfcm_failure_recorded=yes\nsystem_channels=yes\nbackground_service=yes\nlive_install_link_changed=no\nverified_at=%s\nmissing=%s\n' "$RESULT" "$SHA" "$(date -u +%FT%TZ)" "$(tr '\n' ',' < "$RUNNER_TEMP/missing.txt")" > deployment/status/native-v115-binary-verified.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment/status/native-v115-binary-verified.txt
          git commit -m 'Verify native v1.1.5 FCM acceptance bytecode'
          git pull --rebase origin main
          git push origin main
          test "$missing" = 0
