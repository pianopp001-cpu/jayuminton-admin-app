name: Deploy Android system-rendered background push

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-android-system-background-push.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global @google/clasp@latest

      - name: Verify APK link then patch only push sender Code.js
        shell: bash
        run: |
          set -euo pipefail
          CONFIG="$RUNNER_TEMP/deploy.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$CONFIG"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          MAIN_SCRIPT_ID="$(jq -r '.mainScriptId' "$CONFIG")"
          PUSH_SCRIPT_ID="$(jq -r '.pushScriptId' "$CONFIG")"
          PUSH_DEPLOYMENT_ID="$(jq -r '.pushDeploymentId' "$CONFIG")"

          MAIN="$RUNNER_TEMP/main"
          mkdir -p "$MAIN"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$MAIN_SCRIPT_ID" > "$MAIN/.clasp.json"
          cd "$MAIN"
          clasp pull
          grep -F 'jayuminton-courtstatus-v1.1.4-fresh-install.apk' Script.html >/dev/null

          PUSH="$RUNNER_TEMP/push"
          BEFORE="$RUNNER_TEMP/push-before"
          mkdir -p "$PUSH" "$BEFORE"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$PUSH_SCRIPT_ID" > "$PUSH/.clasp.json"
          cd "$PUSH"
          clasp pull
          cp -a . "$BEFORE/"
          python3 "$GITHUB_WORKSPACE/deployment/scripts/patch_push_sender_system_notification.py" "$PUSH"

          python3 - "$BEFORE" "$PUSH" <<'PY'
          from pathlib import Path
          import sys
          before, after = map(Path, sys.argv[1:3])
          names = {p.name for p in before.iterdir() if p.is_file()} | {p.name for p in after.iterdir() if p.is_file()}
          changed = set()
          for name in names:
              if name == '.clasp.json':
                  continue
              a, b = before/name, after/name
              av = a.read_bytes() if a.exists() else None
              bv = b.read_bytes() if b.exists() else None
              if av != bv: changed.add(name)
          if changed != {'Code.js'}:
              raise SystemExit('Unexpected push files changed: ' + ', '.join(sorted(changed)))
          PY

          node --check Code.js
          grep -F "restricted_package_name: 'com.jayuminton.user'" Code.js >/dev/null
          grep -F 'jayuminton_wait1_system_v114' Code.js >/dev/null
          grep -F 'jayuminton_court_system_v114' Code.js >/dev/null
          grep -F "notification_priority: 'PRIORITY_MAX'" Code.js >/dev/null
          grep -F 'vibrate_timings:' Code.js >/dev/null
          if grep -F 'default_sound:' Code.js >/dev/null; then
            echo 'Conflicting Android default_sound payload remains' >&2
            exit 1
          fi

          clasp push --force
          deployed=0
          for attempt in 1 2 3; do
            if clasp create-deployment --deploymentId "$PUSH_DEPLOYMENT_ID" --description "Android system background notification v114 $GITHUB_RUN_ID"; then
              deployed=1
              break
            fi
            sleep 15
          done
          test "$deployed" = 1

          VERIFY="$RUNNER_TEMP/verify-push"
          mkdir -p "$VERIFY"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$PUSH_SCRIPT_ID" > "$VERIFY/.clasp.json"
          cd "$VERIFY"
          clasp pull
          grep -F 'jayuminton_wait1_system_v114' Code.js >/dev/null
          grep -F 'jayuminton_court_system_v114' Code.js >/dev/null
          grep -F "notification_priority: 'PRIORITY_MAX'" Code.js >/dev/null
          grep -F 'vibrate_timings:' Code.js >/dev/null
          if grep -F 'default_sound:' Code.js >/dev/null; then
            echo 'Conflicting Android default_sound payload was deployed' >&2
            exit 1
          fi

          cd "$GITHUB_WORKSPACE"
          printf 'status=success\nmode=android-system-notification\npackage=com.jayuminton.user\nwait_channel=jayuminton_wait1_system_v114\ncourt_channel=jayuminton_court_system_v114\npriority=high\nnotification_priority=PRIORITY_MAX\nsystem_tray_background=yes\nlong_vibration=yes\ndeployed_at=%s\n' "$(date -u +%FT%TZ)" > deployment/status/android-system-background-push-v114.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment/status/android-system-background-push-v114.txt
          git commit -m 'Verify Android system background push v1.1.4'
          git pull --rebase origin main
          git push origin main
