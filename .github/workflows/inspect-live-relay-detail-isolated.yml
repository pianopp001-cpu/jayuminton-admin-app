name: Inspect live relay detail isolated
on:
  push:
    branches: [isolated-user-push-recovery]
    paths:
      - '.github/workflows/inspect-live-relay-detail-isolated.yml'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      JAYUMINTON_PUSH_APPS_SCRIPT_URL: ${{ secrets.JAYUMINTON_PUSH_APPS_SCRIPT_URL }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: isolated-user-push-recovery
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --global @google/clasp@latest
      - name: Read live relay source only
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          RELAY_DEPLOYMENT_ID="$(python3 - <<'PY'
          import os,re
          m=re.search(r'/macros/s/([^/]+)/exec', os.environ['JAYUMINTON_PUSH_APPS_SCRIPT_URL'])
          print(m.group(1) if m else '')
          PY
          )"
          test -n "$RELAY_DEPLOYMENT_ID"
          clasp list > "$RUNNER_TEMP/projects.txt"
          : > "$RUNNER_TEMP/relay-script.txt"
          while IFS= read -r line; do
            SID="$(printf '%s' "$line" | grep -oE '[A-Za-z0-9_-]{30,}' | tail -1 || true)"
            [ -n "$SID" ] || continue
            W="$RUNNER_TEMP/check-$RANDOM"; mkdir -p "$W"
            printf '{"scriptId":"%s","rootDir":"."}\n' "$SID" > "$W/.clasp.json"
            if (cd "$W" && clasp deployments) > "$W/d.txt" 2>/dev/null && grep -F "$RELAY_DEPLOYMENT_ID" "$W/d.txt" >/dev/null; then printf '%s' "$SID" > "$RUNNER_TEMP/relay-script.txt"; break; fi
          done < "$RUNNER_TEMP/projects.txt"
          test -s "$RUNNER_TEMP/relay-script.txt"
          SID="$(cat "$RUNNER_TEMP/relay-script.txt")"
          RW="$RUNNER_TEMP/relay"; mkdir -p "$RW"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$SID" > "$RW/.clasp.json"
          (cd "$RW" && clasp pull >/dev/null)
          CODE="$(find "$RW" -maxdepth 1 -type f \( -name 'Code.js' -o -name 'Code.gs' \) | head -1)"
          test -n "$CODE"
          python3 deployment/scripts/inspect_relay_assignment_target.py "$CODE" > deployment/status/relay-assignment-target-detail.txt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('deployment/status/relay-assignment-target-detail.txt')
          s=p.read_text(encoding='utf-8')
          # keep only the functions/control flow needed for diagnosis; redact long token/key-like literals
          import re
          s=re.sub(r'([A-Za-z0-9_-]{40,})','__REDACTED_LONG_VALUE__',s)
          p.write_text('run_id=${{ github.run_id }}\nsource=live-relay-read-only\n'+s,encoding='utf-8')
          PY
      - name: Record isolated inspection
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment/status/relay-assignment-target-detail.txt
          git commit -m 'Record detailed live relay assignment inspection' || exit 0
          git push origin isolated-user-push-recovery
