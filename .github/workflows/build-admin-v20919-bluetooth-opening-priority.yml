name: Build admin v209.34 three critical fixes
# v209.34: court/wait card stack + complete bulk away/status + fixed-gain Bluetooth opening.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-admin-v20919-bluetooth-opening-priority.yml'
      - 'deployment/jayuminton/admin_v20934_three_critical_fixes_patch.py'
      - 'deployment/jayuminton/admin_v20933_report_square_layout_single_file_patch.py'
      - 'deployment/jayuminton/admin_v20932_report_carrot_chat_split_patch.py'
      - 'deployment/jayuminton/admin_v20931_report_save_race_fix_patch.py'
      - 'deployment/jayuminton/admin_v20915_single_full_expanded_export_patch.py'
      - 'deployment/jayuminton/admin_v20916_member_memo_ownership_patch.py'
      - 'deployment/jayuminton/admin_v20917_member_info_color_split_patch.py'
      - 'deployment/jayuminton/admin_v20918_single_report_readable_reflow_patch.py'
      - 'deployment/jayuminton/admin_v20919_bluetooth_court_opening_priority_patch.py'
      - 'deployment/jayuminton/admin_v20920_high_resolution_single_report_patch.py'
      - 'deployment/jayuminton/admin_v20921_full_history_export_layout_patch.py'
      - 'deployment/jayuminton/admin_v20922_marketplace_readable_full_report_patch.py'
      - 'deployment/jayuminton/admin_v20923_report_no_green_tile_readable_patch.py'
      - 'deployment/jayuminton/admin_v20924_report_tile_retry_patch.py'
      - 'deployment/jayuminton/admin_v20925_report_single_column_sharp_text_patch.py'
      - 'deployment/jayuminton/admin_v20926_direct_vector_report_patch.py'
      - 'deployment/jayuminton/admin_v20927_native_canvas_report_patch.py'
      - 'deployment/jayuminton/admin_v20928_native_canvas_polish_patch.py'
      - 'deployment/jayuminton/admin_v20929_native_report_complete_smooth_patch.py'
      - 'deployment/jayuminton/admin_v20930_top_summary_crisp_report_patch.py'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: jayuminton-admin-v20934-three-critical-fixes
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          # v209.13 fix: android-actions/setup-android@v3 now fails during its own
          # setup ("Failed to find package 'tools'") because Google's SDK repo has
          # dropped the legacy 'tools' package that action's default install
          # depends on. This is a runner/action drift, unrelated to this patch, and
          # confirmed persistent (fails again on retry). GitHub's ubuntu-latest
          # image already ships a working Android SDK cmdline-tools install at
          # $ANDROID_HOME (that's what the failing action itself found and used),
          # so skip the action entirely and just point PATH at it directly.
          echo "${ANDROID_HOME}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME}/platform-tools" >> "$GITHUB_PATH"
          export PATH="${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/platform-tools:${PATH}"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null

