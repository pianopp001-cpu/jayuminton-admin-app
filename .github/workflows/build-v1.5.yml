name: Build v1.5 Unified Browser Push

on:
  workflow_dispatch:
  push:
    branches: [ v1.5-firebase ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAYUMINTON_PUSH_SHARED_SECRET: ${{ secrets.JAYUMINTON_PUSH_SHARED_SECRET }}
      JAYUMINTON_PUSH_APPS_SCRIPT_URL: ${{ secrets.JAYUMINTON_PUSH_APPS_SCRIPT_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore signing key
        run: |
          mkdir -p signing
          base64 --decode signing/jayuminton-release.keystore.b64 > signing/jayuminton-release.jks

      - name: Check admin push configuration
        shell: bash
        run: |
          test -n "$JAYUMINTON_PUSH_SHARED_SECRET"
          test -n "$JAYUMINTON_PUSH_APPS_SCRIPT_URL"

      - name: Validate unified web files
        run: |
          node --check web-push/app.js
          node --check web-push/firebase-messaging-sw.js
          node --check < apps-script-push/Code.gs
          python - <<'PY'
          from pathlib import Path
          source = Path('apps-script-main/Script.html').read_text(encoding='utf-8')
          assert source.startswith('<script>') and source.rstrip().endswith('</script>')
          Path('/tmp/jayuminton-member-script.js').write_text(
              source[len('<script>'):source.rfind('</script>')],
              encoding='utf-8'
          )
          PY
          node --check /tmp/jayuminton-member-script.js

      - name: Build v1.5 admin app
        run: gradle --no-daemon :app:assembleRelease

      - name: Prepare deliverables
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk artifacts/jayuminton-admin-v1.5-unified.apk
          zip -r artifacts/jayuminton-v1.5-unified-member-setup.zip \
            apps-script-main apps-script-push web-push firebase.json \
            deploy-web-push.bat V1_5_UNIFIED_MEMBER_SETUP.md

      - name: Upload admin APK
        uses: actions/upload-artifact@v4
        with:
          name: jayuminton-admin-v1.5-unified
          path: artifacts/jayuminton-admin-v1.5-unified.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload unified member setup
        uses: actions/upload-artifact@v4
        with:
          name: jayuminton-v1.5-unified-member-setup
          path: artifacts/jayuminton-v1.5-unified-member-setup.zip
          if-no-files-found: error
          retention-days: 30
