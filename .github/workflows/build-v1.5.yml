name: Build v1.5 Browser Push Admin

on:
  workflow_dispatch:
  push:
    branches: [ v1.5-firebase ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAYUMINTON_PUSH_SHARED_SECRET: ${{ secrets.JAYUMINTON_PUSH_SHARED_SECRET }}
      JAYUMINTON_PUSH_APPS_SCRIPT_URL: ${{ secrets.JAYUMINTON_PUSH_APPS_SCRIPT_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore signing key
        run: |
          mkdir -p signing
          base64 --decode signing/jayuminton-release.keystore.b64 > signing/jayuminton-release.jks

      - name: Check admin push configuration
        shell: bash
        run: |
          test -n "$JAYUMINTON_PUSH_SHARED_SECRET"
          test -n "$JAYUMINTON_PUSH_APPS_SCRIPT_URL"

      - name: Build v1.5 admin app
        run: gradle --no-daemon :app:assembleRelease

      - name: Prepare admin APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk artifacts/jayuminton-admin-v1.5-web.apk

      - name: Upload admin APK
        uses: actions/upload-artifact@v4
        with:
          name: jayuminton-admin-v1.5-web
          path: artifacts/jayuminton-admin-v1.5-web.apk
          if-no-files-found: error
          retention-days: 30
