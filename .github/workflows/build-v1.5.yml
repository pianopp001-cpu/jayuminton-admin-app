name: Build v1.5 Browser Push

on:
  workflow_dispatch:
  push:
    branches: [ v1.5-firebase ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAYUMINTON_PUSH_SHARED_SECRET: ${{ secrets.JAYUMINTON_PUSH_SHARED_SECRET }}
      JAYUMINTON_PUSH_APPS_SCRIPT_URL: ${{ secrets.JAYUMINTON_PUSH_APPS_SCRIPT_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore signing key
        run: |
          mkdir -p signing
          base64 --decode signing/jayuminton-release.keystore.b64 > signing/jayuminton-release.jks

      - name: Validate Apps Script relay
        run: node --check < apps-script-push/Code.gs

      - name: Validate browser push scripts
        run: |
          node --check web-push/app.js
          node --check web-push/firebase-messaging-sw.js

      - name: Check final build configuration
        id: config
        shell: bash
        run: |
          if [[ -n "$JAYUMINTON_PUSH_SHARED_SECRET" && -n "$JAYUMINTON_PUSH_APPS_SCRIPT_URL" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build v1.5 admin app
        run: gradle --no-daemon :app:assembleRelease

      - name: Prepare deliverables
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk artifacts/jayuminton-admin-v1.5-web.apk
          zip -r artifacts/jayuminton-browser-push-setup-v1.5.zip \
            apps-script-push web-push firebase.json deploy-web-push.bat V1_5_BROWSER_PUSH_SETUP.md

      - name: Upload admin APK
        if: steps.config.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: jayuminton-admin-v1.5-web
          path: artifacts/jayuminton-admin-v1.5-web.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload browser setup files
        uses: actions/upload-artifact@v4
        with:
          name: jayuminton-browser-push-setup-v1.5
          path: artifacts/jayuminton-browser-push-setup-v1.5.zip
          if-no-files-found: error
          retention-days: 30

      - name: Record configuration warning
        if: steps.config.outputs.ready != 'true'
        run: |
          {
            echo "## Admin source build succeeded"
            echo ""
            echo "The browser setup ZIP was uploaded, but the installable admin APK was not uploaded because one of the two repository secrets is missing."
          } >> "$GITHUB_STEP_SUMMARY"
