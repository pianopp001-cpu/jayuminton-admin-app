# Final build trigger after Apps Script URL secret registration
name: Build v1.5 Firebase APKs

on:
  workflow_dispatch:
  push:
    branches: [ v1.5-firebase ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIREBASE_GOOGLE_SERVICES_JSON_B64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_B64 }}
      JAYUMINTON_PUSH_SHARED_SECRET: ${{ secrets.JAYUMINTON_PUSH_SHARED_SECRET }}
      JAYUMINTON_PUSH_APPS_SCRIPT_URL: ${{ secrets.JAYUMINTON_PUSH_APPS_SCRIPT_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore signing key
        run: |
          mkdir -p signing
          base64 --decode signing/jayuminton-release.keystore.b64 > signing/jayuminton-release.jks

      - name: Validate free Apps Script relay syntax
        run: node --check < apps-script-push/Code.gs

      - name: Check final build configuration
        id: firebase_config
        shell: bash
        run: |
          if [[ -n "$FIREBASE_GOOGLE_SERVICES_JSON_B64" && -n "$JAYUMINTON_PUSH_SHARED_SECRET" && -n "$JAYUMINTON_PUSH_APPS_SCRIPT_URL" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare member Firebase configuration
        shell: bash
        run: |
          if [[ -n "$FIREBASE_GOOGLE_SERVICES_JSON_B64" ]]; then
            printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON_B64" | base64 --decode > member/google-services.json
          else
            cat > member/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "jayuminton-build-validation",
              "storage_bucket": "jayuminton-build-validation.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:0123456789abcdef012345",
                  "android_client_info": {
                    "package_name": "com.jayuminton.member"
                  }
                },
                "api_key": [
                  {
                    "current_key": "AIzaSyBuildValidationOnly000000000000000"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON
          fi

      - name: Build v1.5 admin app
        run: gradle --no-daemon :app:assembleRelease

      - name: Build v1.5 member app
        run: gradle --no-daemon :member:assembleRelease

      - name: Record source validation
        if: steps.firebase_config.outputs.ready != 'true'
        run: |
          {
            echo "## v1.5 source validation succeeded"
            echo ""
            echo "Both Android apps compiled and the free Apps Script relay passed syntax validation."
            echo "The final APK artifact is waiting only for JAYUMINTON_PUSH_APPS_SCRIPT_URL."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare final APKs
        if: steps.firebase_config.outputs.ready == 'true'
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk artifacts/jayuminton-admin-v1.5.apk
          cp member/build/outputs/apk/release/member-release.apk artifacts/jayuminton-member-v1.5.apk

      - name: Upload v1.5 APKs
        if: steps.firebase_config.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: jayuminton-v1.5-apks
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30
