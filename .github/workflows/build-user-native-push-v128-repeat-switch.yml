name: Build v1.2.8 repeated member-switch user APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-user-native-push-v128-repeat-switch.yml'
      - 'deployment/scripts/patch_build_user_native_v128_repeat_switch.py'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: jayuminton-user-native-v128-repeat-switch
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.7'}
      - run: npm install --global firebase-tools@latest @google/clasp@latest
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Resolve config and Firebase user app
        shell: bash
        run: |
          set -euo pipefail
          C="$RUNNER_TEMP/deploy.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$C"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          PUSH_SCRIPT_ID="$(jq -r '.pushScriptId' "$C")"
          FIREBASE_PROJECT_ID="$(jq -r '.firebaseProjectId' "$C")"
          test -n "$PUSH_SCRIPT_ID"; test "$PUSH_SCRIPT_ID" != null
          test -n "$FIREBASE_PROJECT_ID"; test "$FIREBASE_PROJECT_ID" != null
          echo "PUSH_SCRIPT_ID=$PUSH_SCRIPT_ID" >> "$GITHUB_ENV"
          echo "FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID" >> "$GITHUB_ENV"

          PACKAGE='com.jayuminton.user'
          firebase apps:list ANDROID --project "$FIREBASE_PROJECT_ID" --json > "$RUNNER_TEMP/apps.json"
          APP_ID="$(jq -r --arg pkg "$PACKAGE" '[.. | objects | select(((.packageName? == $pkg) or (.package_name? == $pkg) or (.androidClientInfo?.packageName? == $pkg)) and ((.appId? // .app_id?) != null)) | (.appId? // .app_id?)] | first // empty' "$RUNNER_TEMP/apps.json")"
          test -n "$APP_ID"
          firebase apps:sdkconfig ANDROID "$APP_ID" --project "$FIREBASE_PROJECT_ID" > app/google-services.json
          grep -F 'com.jayuminton.user' app/google-services.json >/dev/null

      - name: Verify live member-switch server guard
        shell: bash
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/push-check"; mkdir -p "$W"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$PUSH_SCRIPT_ID" > "$W/.clasp.json"
          ok=0
          for attempt in 1 2 3 4 5; do
            rm -f "$W/Code.js"
            (cd "$W" && clasp pull) || true
            if grep -F 'JAYUMINTON_MEMBER_TOKEN_SWITCH_ATOMIC_V1' "$W/Code.js" >/dev/null 2>&1; then ok=1; break; fi
            sleep 4
          done
          test "$ok" = 1

      - name: Build v1.2.8
        id: build_apk
        shell: bash
        run: |
          set +e
          LOG="$RUNNER_TEMP/v128-build.log"
          (
            set -euo pipefail
            SCRIPT='deployment/scripts/build_user_native_push_fresh_v110.sh'
            python3 deployment/scripts/patch_build_user_native_v111.py "$SCRIPT"
            python3 deployment/scripts/patch_build_user_native_v112.py "$SCRIPT"
            python3 deployment/scripts/patch_build_user_native_v113.py "$SCRIPT"
            python3 deployment/scripts/patch_build_user_native_v114.py "$SCRIPT"
            python3 deployment/scripts/patch_build_user_native_v115.py "$SCRIPT"
            python3 deployment/scripts/patch_build_user_native_v116.py "$SCRIPT"
            python3 deployment/scripts/patch_build_user_native_v117.py "$SCRIPT"
            python3 deployment/scripts/patch_build_user_native_v118.py "$SCRIPT"
            python3 deployment/scripts/patch_build_user_native_v119.py "$SCRIPT"
            python3 deployment/scripts/patch_build_user_native_v120_diagnostic.py "$SCRIPT"
            python3 deployment/scripts/patch_build_user_native_v121.py "$SCRIPT"
            python3 deployment/scripts/patch_build_user_native_v122.py "$SCRIPT"
            python3 deployment/scripts/patch_build_user_native_v124_confirmed_overlay.py "$SCRIPT"
            python3 deployment/scripts/patch_build_user_native_v126_stop_controller.py "$SCRIPT"
            python3 deployment/scripts/patch_build_user_native_v126_raceguard.py "$SCRIPT"
            python3 deployment/scripts/patch_build_user_native_v127_member_switch.py "$SCRIPT"
            python3 deployment/scripts/patch_build_user_native_v128_repeat_switch.py "$SCRIPT"
            grep -F 'VERSION="1.2.8"' "$SCRIPT" >/dev/null
            grep -F 'stopPreviousMemberAlert(app);' "$SCRIPT" >/dev/null
            grep -F 'NativePushRegistrar.isCurrentMember(this, targetMemberId)' "$SCRIPT" >/dev/null
            grep -F 'AlertVibrationController.start(this, assignmentId)' "$SCRIPT" >/dev/null
            bash "$SCRIPT"
            APK='releases/jayuminton-courtstatus-v1.2.8-repeat-switch.apk'
            STATUS='deployment/status/user-native-push-v1.2.8.txt'
            test -s "$APK"; test -s "$STATUS"
            grep -F 'status=success' "$STATUS" >/dev/null
            grep -F 'version=1.2.8' "$STATUS" >/dev/null
            grep -F 'version_code=128' "$STATUS" >/dev/null
            grep -F 'application_id=com.jayuminton.user' "$STATUS" >/dev/null
            grep -F 'repeat-switch-v128-current-member-only' "$STATUS" >/dev/null
            cp "$APK" "$RUNNER_TEMP/v128.apk"
            cp "$STATUS" "$RUNNER_TEMP/v128-status.txt"
          ) 2>&1 | tee "$LOG"
          RC=${PIPESTATUS[0]}
          echo "exit_code=$RC" >> "$GITHUB_OUTPUT"
          exit "$RC"

      - name: Publish verified APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          cp "$RUNNER_TEMP/v128.apk" releases/jayuminton-courtstatus-v1.2.8-repeat-switch.apk
          cp "$RUNNER_TEMP/v128-status.txt" deployment/status/user-native-push-v1.2.8.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/jayuminton-courtstatus-v1.2.8-repeat-switch.apk deployment/status/user-native-push-v1.2.8.txt
          git commit -m 'Publish v1.2.8 repeated member-switch user APK' || exit 0
          git pull --rebase origin main || true
          git push origin main

      - name: Publish visible build failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          STATUS='deployment/status/native-v128-build-failure.txt'
          {
            echo 'status=failure'
            echo 'build_exit_code=${{ steps.build_apk.outputs.exit_code }}'
            echo '--- safe log tail ---'
            tail -n 220 "$RUNNER_TEMP/v128-build.log" 2>/dev/null || echo 'build log unavailable'
          } > "$STATUS"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$STATUS"
          git commit -m 'Record v1.2.8 repeated-switch build failure' || exit 0
          git pull --rebase origin main || true
          git push origin main
