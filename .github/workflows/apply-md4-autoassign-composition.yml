name: Apply MD4 autoassign composition

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-md4-autoassign-composition.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch worker and regression tests
        run: |
          python3 - <<'PY'
          from pathlib import Path

          worker = Path('cloudflare/state-worker/worker.js')
          s = worker.read_text()
          old = '''export function autoAssignMutation(input, candidateIds, destinations) {
  let state = normalizeState(input);
  const memberById = new Map(state.members.map(m => [String(m.id), m]));
  const available = uniqueIds(candidateIds, 200).filter(id => memberById.has(id) && !locationOf(state, id));
  const ordered = [];
  const men = available.filter(id => String(memberById.get(id).gender || '').toLowerCase().startsWith('m') || memberById.get(id).gender === '남');
  const women = available.filter(id => !men.includes(id));
  while (men.length || women.length) { if (men.length) ordered.push(men.shift()); if (women.length) ordered.push(women.shift()); }
  const assigned = [];
  for (const destination of Array.isArray(destinations) ? destinations : []) {
    const free = Math.max(0, 4 - container(state, destination).length); const ids = ordered.splice(0, free);
    if (!ids.length) continue;
    state = moveMutation(state, ids, destination).state; assigned.push({ destination, memberIds: ids });
  }
  return { state, event: { type: 'auto_assigned', assigned } };
}'''
          new = '''export function autoAssignMutation(input, candidateIds, destinations) {
  let state = normalizeState(input);
  const memberById = new Map(state.members.map(m => [String(m.id), m]));
  const available = uniqueIds(candidateIds, 200).filter(id => memberById.has(id) && !locationOf(state, id));
  const isMale = id => String(memberById.get(id)?.gender || '').toLowerCase().startsWith('m') || memberById.get(id)?.gender === '남';
  const assigned = [];

  function take(pool, count, predicate) {
    const picked = [];
    for (let i = 0; i < pool.length && picked.length < count; i += 1) {
      if (predicate(pool[i])) picked.push(pool[i]);
    }
    if (picked.length !== count) return [];
    const pickedSet = new Set(picked);
    for (let i = pool.length - 1; i >= 0; i -= 1) if (pickedSet.has(pool[i])) pool.splice(i, 1);
    return picked;
  }

  function chooseForDestination(pool, destination) {
    const target = container(state, destination);
    const free = Math.max(0, 4 - target.length);
    if (!free || !pool.length) return [];

    const existingMen = target.filter(isMale).length;
    const existingWomen = target.length - existingMen;

    // When a full four-person team can be formed, MD4 allows only 4M, 4F, or 2M+2F.
    if (target.length + pool.length >= 4) {
      const needs = [
        [2 - existingMen, 2 - existingWomen],
        [4 - existingMen, 0 - existingWomen],
        [0 - existingMen, 4 - existingWomen],
      ].filter(([m, w]) => m >= 0 && w >= 0 && m + w === free);

      for (const [needMen, needWomen] of needs) {
        const men = pool.filter(isMale);
        const women = pool.filter(id => !isMale(id));
        if (men.length < needMen || women.length < needWomen) continue;
        const selected = [];
        selected.push(...take(pool, needMen, isMale));
        selected.push(...take(pool, needWomen, id => !isMale(id)));
        return selected;
      }
    }

    // Only the final remainder may relax the doubles composition rule; fill as many as possible.
    return pool.splice(0, Math.min(free, pool.length));
  }

  const pool = [...available];
  for (const destination of Array.isArray(destinations) ? destinations : []) {
    const ids = chooseForDestination(pool, destination);
    if (!ids.length) continue;
    state = moveMutation(state, ids, destination).state;
    assigned.push({ destination, memberIds: ids });
  }
  return { state, event: { type: 'auto_assigned', assigned } };
}'''
          if old not in s:
            raise SystemExit('autoAssignMutation source block changed; refusing unsafe patch')
          worker.write_text(s.replace(old, new, 1))

          test = Path('cloudflare/state-worker/md4-autoassign.test.mjs')
          t = test.read_text()
          marker = "console.log('MD4_AUTOASSIGN_TESTS_OK');"
          addition = r'''
{
  const state = base([
    member('m1','male'), member('m2','male'), member('m3','male'),
    member('f1','female'), member('f2','female'), member('f3','female'),
  ]);
  const out = autoAssignMutation(state, ['m1','m2','m3','f1','f2','f3'], [{type:'court',key:'1'}]).state;
  const ids = out.courts['1'];
  assert.equal(ids.length, 4);
  assert.equal(ids.filter(id => id.startsWith('m')).length, 2, '3M+1F must not be used when a valid 2M+2F team is available');
  assert.equal(ids.filter(id => id.startsWith('f')).length, 2);
}

{
  const state = base([member('m1','male'),member('m2','male'),member('m3','male'),member('f1','female')]);
  const out = autoAssignMutation(state, ['m1','m2','m3','f1'], [{type:'court',key:'1'}]).state;
  assert.equal(out.courts['1'].length, 4, 'when only an invalid four-person remainder exists, MD4 says to relax the composition rule and fill it');
}

'''
          if addition.strip() not in t:
            if marker not in t:
              raise SystemExit('test marker missing')
            test.write_text(t.replace(marker, addition + marker))
          PY
      - name: Run MD4 worker regression tests
        run: |
          node cloudflare/state-worker/md4-autoassign.test.mjs
          node cloudflare/state-worker/worker.test.mjs
      - name: Commit patch to main
        run: |
          if git diff --quiet; then
            echo 'No changes required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/state-worker/worker.js cloudflare/state-worker/md4-autoassign.test.mjs
          git commit -m 'fix(md4): enforce valid doubles composition with remainder fallback'
          git push origin main
