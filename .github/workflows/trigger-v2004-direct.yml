name: Trigger final v200.4 direct build
on:
  push:
    branches: [main]
    paths:
      - 'deployment/jayuminton/admin_v2004_top_controls_patch.py'
      - '.github/workflows/trigger-v2004-direct.yml'
  workflow_dispatch: {}
permissions:
  actions: write
  contents: write
jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - name: Dispatch repaired final direct build and watch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          OLD=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-v2004-final-direct2.yml --branch main --limit 1 --json databaseId --jq '.[0].databaseId // 0')
          gh workflow run build-v2004-final-direct2.yml --repo "$GITHUB_REPOSITORY" --ref main
          RUN=0
          for i in $(seq 1 60); do
            RUN=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-v2004-final-direct2.yml --branch main --limit 1 --json databaseId --jq '.[0].databaseId // 0')
            if [ "$RUN" != "0" ] && [ "$RUN" != "$OLD" ]; then break; fi
            sleep 2
          done
          test "$RUN" != "0"; test "$RUN" != "$OLD"
          echo "RUN_ID=$RUN" >> "$GITHUB_ENV"
          set +e
          gh run watch "$RUN" --repo "$GITHUB_REPOSITORY" --exit-status
          RC=$?
          set -e
          CONCLUSION=$(gh run view "$RUN" --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion')
          FAILED=$(gh run view "$RUN" --repo "$GITHUB_REPOSITORY" --json jobs --jq '[.jobs[].steps[] | select(.conclusion=="failure") | .name] | join(",")')
          mkdir -p deployment/status
          printf 'run_id=%s\nconclusion=%s\nfailed_steps=%s\n' "$RUN" "$CONCLUSION" "$FAILED" > deployment/status/v2004-direct-watch.txt
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment/status/v2004-direct-watch.txt
          git commit -m "Record watched v200.4 build $RUN" || true
          git pull --rebase origin main
          git push origin main
          exit $RC
