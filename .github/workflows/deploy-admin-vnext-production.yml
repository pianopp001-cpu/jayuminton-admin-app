name: Deploy admin vNext production
# Production deployment explicitly approved on 2026-08-19.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-admin-vnext-production.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: jayuminton-admin-vnext-production
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve production deployment
        shell: bash
        run: |
          set -euo pipefail
          CONFIG="$RUNNER_TEMP/deploy.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$CONFIG"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          jq -e '.mainScriptId and .mainDeploymentId' "$CONFIG" >/dev/null
          MAIN_SCRIPT_ID="$(jq -r '.mainScriptId' "$CONFIG")"
          MAIN_DEPLOYMENT_ID="$(jq -r '.mainDeploymentId' "$CONFIG")"
          PUSH_SCRIPT_ID="$(jq -r '.pushScriptId // empty' "$CONFIG")"
          PUSH_DEPLOYMENT_ID="$(jq -r '.pushDeploymentId // empty' "$CONFIG")"
          if [ -z "$PUSH_DEPLOYMENT_ID" ]; then
            PUSH_DEPLOYMENT_ID="$(sed -n 's/^push_deployment_id=//p' deployment/status/apps-script-deployments-now.txt | head -1)"
          fi
          test -n "$PUSH_DEPLOYMENT_ID"
          PUSH_URL="$(jq -r '.pushUrl // empty' "$CONFIG")"
          if [ -z "$PUSH_URL" ]; then
            PUSH_URL="https://script.google.com/macros/s/$PUSH_DEPLOYMENT_ID/exec"
          fi
          {
            echo "MAIN_SCRIPT_ID=$MAIN_SCRIPT_ID"
            echo "MAIN_DEPLOYMENT_ID=$MAIN_DEPLOYMENT_ID"
            echo "PUSH_SCRIPT_ID=$PUSH_SCRIPT_ID"
            echo "PUSH_DEPLOYMENT_ID=$PUSH_DEPLOYMENT_ID"
            echo "PUSH_URL=$PUSH_URL"
          } >> "$GITHUB_ENV"
      - name: Install clasp
        run: npm install --global @google/clasp@latest
      - name: Discover existing push Apps Script project
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -n "$PUSH_SCRIPT_ID" ]; then
            exit 0
          fi
          PROJECTS="$(clasp list)"
          CANDIDATES="$(
            printf '%s\n' "$PROJECTS" |
              sed -n -e 's#.*script.google.com/d/\([^/ ]*\)/edit.*#\1#p' \
                     -e 's#.*script.google.com/home/projects/\([^/ ]*\)/edit.*#\1#p' |
              sort -u
          )"
          test -n "$CANDIDATES"
          FOUND=""
          while IFS= read -r candidate; do
            [ -n "$candidate" ] || continue
            CHECK="$RUNNER_TEMP/push-project-$candidate"
            mkdir -p "$CHECK"
            printf '{"scriptId":"%s","rootDir":"."}\n' "$candidate" > "$CHECK/.clasp.json"
            if (cd "$CHECK" && clasp deployments 2>/dev/null) | grep -F "$PUSH_DEPLOYMENT_ID" >/dev/null; then
              FOUND="$candidate"
              break
            fi
          done <<< "$CANDIDATES"
          test -n "$FOUND"
          echo "PUSH_SCRIPT_ID=$FOUND" >> "$GITHUB_ENV"
      - name: Pull live, back up, patch, and verify
        shell: bash
        run: |
          set -Eeuo pipefail
          LIVE="$RUNNER_TEMP/admin-vnext-live"
          PUSH="$RUNNER_TEMP/admin-vnext-push"
          BACKUP="$RUNNER_TEMP/admin-vnext-live-before"
          mkdir -p "$LIVE" "$PUSH" "$BACKUP"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$MAIN_SCRIPT_ID" > "$LIVE/.clasp.json"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$PUSH_SCRIPT_ID" > "$PUSH/.clasp.json"
          (cd "$LIVE" && clasp pull)
          (cd "$PUSH" && clasp pull)
          cp -R "$LIVE"/. "$BACKUP"/
          sha256sum "$LIVE/Index.html" "$LIVE/Style.html" > "$RUNNER_TEMP/protected-before.sha256"

          INTERNAL_KEY="$(openssl rand -hex 32)"
          python3 deployment/scripts/patch_live_admin_production_push.py \
            "$LIVE/Code.js" "$PUSH/Code.js" "$PUSH_URL" "$INTERNAL_KEY"
          python3 deployment/jayuminton/apply_admin_vnext_patches.py "$LIVE"
          python3 deployment/jayuminton/admin_vnext_notification_contract_test.py "$LIVE/Code.js"
          python3 deployment/jayuminton/admin_vnext_push_compatibility_check.py "$LIVE/Code.js"
          grep -F 'JAYUMINTON_MAIN_EVENT_RELAY_V1' "$PUSH/Code.js" >/dev/null
          grep -F "action === 'main_state_event'" "$PUSH/Code.js" >/dev/null
          grep -F 'sendAssignmentEvent_(cleanEvent_(body))' "$PUSH/Code.js" >/dev/null

          sha256sum "$LIVE/Index.html" "$LIVE/Style.html" > "$RUNNER_TEMP/protected-after.sha256"
          diff -u "$RUNNER_TEMP/protected-before.sha256" "$RUNNER_TEMP/protected-after.sha256"
          node --check "$LIVE/Code.js"
          python3 - "$LIVE/Script.html" "$RUNNER_TEMP/admin-vnext-script.js" <<'PY'
          from pathlib import Path
          import sys
          source=Path(sys.argv[1]).read_text(encoding='utf-8')
          start=source.find('<script>'); end=source.rfind('</script>')
          if start < 0 or end <= start: raise SystemExit('Script.html wrapper missing')
          Path(sys.argv[2]).write_text(source[start+8:end],encoding='utf-8')
          PY
          node --check "$RUNNER_TEMP/admin-vnext-script.js"

          for protected in Index.html Style.html appsscript.json; do
            cmp "$BACKUP/$protected" "$LIVE/$protected"
          done
          {
            echo 'Verified protected files unchanged:'
            echo '  Index.html'
            echo '  Style.html'
            echo '  appsscript.json'
            echo 'Expected patched files:'
            for changed in Admin.html Code.js Script.html; do
              if ! cmp -s "$BACKUP/$changed" "$LIVE/$changed"; then
                echo "  $changed"
              fi
            done
          } | tee "$RUNNER_TEMP/changed-files.txt"
      - name: Preserve pre-deployment live backup
        uses: actions/upload-artifact@v4
        with:
          name: admin-vnext-live-before-${{ github.run_id }}
          path: ${{ runner.temp }}/admin-vnext-live-before
          retention-days: 30
          include-hidden-files: true
      - name: Deploy synchronized push relay and existing production web app
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/admin-vnext-push"
          clasp push --force
          clasp create-deployment --deploymentId "$PUSH_DEPLOYMENT_ID" --description "admin vNext push relay ${GITHUB_SHA::7}"
          clasp deployments | grep -F "$PUSH_DEPLOYMENT_ID" >/dev/null
          cd "$RUNNER_TEMP/admin-vnext-live"
          clasp push --force
          clasp create-deployment --deploymentId "$MAIN_DEPLOYMENT_ID" --description "admin vNext production ${GITHUB_SHA::7}"
          clasp deployments | grep -F "$MAIN_DEPLOYMENT_ID" >/dev/null
      - name: Record production status
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'status=success'
            echo "commit=$GITHUB_SHA"
            echo 'deployment=existing-main'
            echo 'protected_user_files_unchanged=yes'
            echo 'member_apk_aab_changed=no'
            echo 'notification_contract_verified=yes'
            echo 'production_push_compatibility=yes'
            echo 'push_relay_deployed=yes'
            echo 'relay_credentials_synchronized=yes'
            echo "deployed_at=$(date -u +%FT%TZ)"
          } > deployment/status/admin-vnext-production-live.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment/status/admin-vnext-production-live.txt
          git commit -m 'Record live admin vNext production deployment'
          git pull --rebase origin main
          git push origin main
