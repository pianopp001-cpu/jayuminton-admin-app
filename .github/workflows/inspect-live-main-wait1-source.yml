name: Inspect live main wait1 transition source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-live-main-wait1-source.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --global @google/clasp@latest
      - name: Pull and extract transition source
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          ID="$(printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" | jq -r '.mainScriptId')"
          W="$RUNNER_TEMP/main"; mkdir -p "$W"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$ID" > "$W/.clasp.json"
          cd "$W"; clasp pull >/dev/null
          python3 - "$GITHUB_WORKSPACE/deployment/status/live-main-wait1-source.txt" <<'PY'
          from pathlib import Path
          import re,sys
          s=Path('Code.js').read_text(encoding='utf-8')
          names=('captureStatePushSnapshot_','sendStateTransitionPushes_','withDocumentLock_','finishCourtUnlocked_')
          out=[]
          for name in names:
              m=re.search(r'function\s+'+re.escape(name)+r'\s*\([^)]*\)\s*\{',s)
              if not m: out.append('NOT_FOUND '+name); continue
              depth=0; q=None; esc=False; end=None
              for j in range(m.end()-1,len(s)):
                  ch=s[j]
                  if q:
                      if esc: esc=False
                      elif ch=='\\': esc=True
                      elif ch==q:q=None
                      continue
                  if ch in "'\"\`":q=ch
                  elif ch=='{':depth+=1
                  elif ch=='}':
                      depth-=1
                      if depth==0:end=j+1;break
              out.append('--- '+name+' ---\n'+s[m.start():end or m.start()+8000])
          Path(sys.argv[1]).write_text('\n\n'.join(out),encoding='utf-8')
          PY
      - name: Publish inspection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment/status/live-main-wait1-source.txt
          git commit -m 'Record live wait1 transition source' || true
          git pull --rebase origin main
          git push origin main
