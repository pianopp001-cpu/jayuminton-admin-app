name: Build Jayuminton user APK v1.5.2 simple

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-user-v152-simple.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MAIN_DEPLOYMENT_ID: AKfycbzhiLS6mrum8Izipu_1a1Osa88x4zg_qhHKTzWiaN38fJ0tADMRcWsLE-ERDSPZuKC_
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      FINAL_APK: releases/jayuminton-courtstatus-v1.5.2-restored-fresh.apk
      FINAL_STATUS: deployment/status/user-v1.5.2-restored-fresh.txt
      EVIDENCE: deployment/status/user-v1.5.2-build-evidence.txt

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build verify and record
        shell: bash
        run: |
          set +e
          mkdir -p deployment/status releases
          ROUTE=not-run
          BUILD=not-run
          VERIFY=not-run
          PUBLISH=not-run
          FAIL_REASON=''

          URL="https://script.google.com/macros/s/${MAIN_DEPLOYMENT_ID}/exec?mode=user&apkUser=1&userAppVersion=1.5.2"
          curl -L --fail --silent --show-error --max-time 40 "$URL" -o "$RUNNER_TEMP/user-live.html"
          RC=$?
          if [ $RC -eq 0 ] && grep -Fq '자유민턴 코트배정 현황' "$RUNNER_TEMP/user-live.html" && grep -Fq 'memberSelfSettings' "$RUNNER_TEMP/user-live.html" && grep -Fq 'memberForegroundAlert' "$RUNNER_TEMP/user-live.html" && ! grep -Fq '관리자 화면을 불러오는 중입니다' "$RUNNER_TEMP/user-live.html"; then
            ROUTE=success
          else
            ROUTE=failure
            FAIL_REASON='user-route-preflight'
          fi

          if [ "$ROUTE" = success ]; then
            cp deployment/scripts/build_user_apk_v100.sh "$RUNNER_TEMP/build_user_v152.sh"
            python3 - "$RUNNER_TEMP/build_user_v152.sh" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text(encoding='utf-8')
          s = s.replace('releases/jayuminton-user-v1.0.0.apk', 'releases/jayuminton-courtstatus-v1.5.2-restored-fresh.apk')
          s = s.replace('deployment/status/user-apk-v1.0.0.txt', 'deployment/status/user-v1.5.2-restored-fresh.txt')
          s = s.replace('com.jayuminton.user', 'com.jayuminton.user.restored152')
          s = s.replace('1.0.0', '1.5.2')
          s = s.replace('versionCode 100', 'versionCode 152')
          s = s.replace('version_code=100', 'version_code=152')
          p.write_text(s, encoding='utf-8')
          PY
            chmod +x "$RUNNER_TEMP/build_user_v152.sh"
            bash "$RUNNER_TEMP/build_user_v152.sh" > "$RUNNER_TEMP/build-v152.log" 2>&1
            RC=$?
            if [ $RC -eq 0 ]; then
              BUILD=success
            else
              BUILD=failure
              FAIL_REASON='apk-build'
            fi
          fi

          if [ "$BUILD" = success ]; then
            BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
            "$BUILD_TOOLS/aapt" dump badging "$FINAL_APK" > "$RUNNER_TEMP/final-badging.txt"
            AAPT_RC=$?
            "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$FINAL_APK" > "$RUNNER_TEMP/final-signer.txt"
            SIGN_RC=$?
            unzip -p "$FINAL_APK" classes.dex > "$RUNNER_TEMP/final-classes.dex"
            strings "$RUNNER_TEMP/final-classes.dex" > "$RUNNER_TEMP/final-classes.txt"

            if [ $AAPT_RC -eq 0 ] && [ $SIGN_RC -eq 0 ] \
              && grep -Fq "package: name='com.jayuminton.user.restored152' versionCode='152' versionName='1.5.2'" "$RUNNER_TEMP/final-badging.txt" \
              && grep -Fq "$MAIN_DEPLOYMENT_ID" "$RUNNER_TEMP/final-classes.txt" \
              && grep -Fq '?mode=user' "$RUNNER_TEMP/final-classes.txt" \
              && grep -Fq 'NativeUserApp' "$RUNNER_TEMP/final-classes.txt" \
              && ! grep -Fq '?mode=admin' "$RUNNER_TEMP/final-classes.txt" \
              && ! grep -Fq '관리자 화면을 불러오는 중입니다' "$RUNNER_TEMP/final-classes.txt"; then
              VERIFY=success
              SIZE="$(stat -c%s "$FINAL_APK")"
              SHA="$(sha256sum "$FINAL_APK" | awk '{print $1}')"
              {
                echo 'route_preflight=success'
                echo 'user_page_marker=memberSelfSettings'
                echo 'admin_loader_absent=verified'
                echo 'install_mode=new-application-id'
                echo "apk_size_bytes=$SIZE"
                echo "apk_sha256=$SHA"
              } >> "$FINAL_STATUS"
            else
              VERIFY=failure
              FAIL_REASON='apk-contract'
            fi
          fi

          {
            echo 'workflow=Build Jayuminton user APK v1.5.2 simple'
            echo 'source_structure=verified-v1.0.0-webview-native-user-app'
            echo "route=$ROUTE"
            echo "build_apk=$BUILD"
            echo "verify_apk=$VERIFY"
            echo "failure_reason=$FAIL_REASON"
            if [ -f "$RUNNER_TEMP/build-v152.log" ]; then
              echo 'build_log_tail_begin'
              tail -n 100 "$RUNNER_TEMP/build-v152.log" | tr '\n' ' '
              echo
              echo 'build_log_tail_end'
            fi
            if [ -f "$FINAL_STATUS" ]; then
              echo 'final_status_begin'
              cat "$FINAL_STATUS"
              echo 'final_status_end'
            fi
            echo "updated_at=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          } > "$EVIDENCE"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$VERIFY" = success ]; then
            git add "$FINAL_APK" "$FINAL_STATUS" "$EVIDENCE"
            PUBLISH=success
          else
            git add "$EVIDENCE"
          fi
          git commit -m 'Record user APK v1.5.2 build result' || true
          git pull --rebase origin main
          git push origin main
          exit 0
