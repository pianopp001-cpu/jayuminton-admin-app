name: Emergency Firebase direct member RPC

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/emergency-firebase-direct-member-rpc.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jayuminton-emergency-firebase-direct-member-rpc
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: member-anywhere-controls-v3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install tools
        run: npm install --global @google/clasp@latest firebase-tools@latest

      - name: Authenticate Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Resolve config
        shell: bash
        run: |
          set -euo pipefail
          CONFIG="$RUNNER_TEMP/deploy.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$CONFIG"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          echo "MAIN_SCRIPT_ID=$(jq -r '.mainScriptId' "$CONFIG")" >> "$GITHUB_ENV"
          echo "MAIN_DEPLOYMENT_ID=$(jq -r '.mainDeploymentId' "$CONFIG")" >> "$GITHUB_ENV"
          echo "FIREBASE_PROJECT_ID=$(jq -r '.firebaseProjectId' "$CONFIG")" >> "$GITHUB_ENV"
          echo "HOSTING_URL=$(jq -r '.hostingUrl' "$CONFIG")" >> "$GITHUB_ENV"

      - name: Pull live and patch RPC
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/main-live"
          SRC="$GITHUB_WORKSPACE/source-snapshot/current-main"
          mkdir -p "$WORK"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$MAIN_SCRIPT_ID" > "$WORK/.clasp.json"
          cd "$WORK"
          clasp pull
          cp "$SRC/Index.html" Index.html
          cp "$SRC/MemberAnywhereSwap.js" MemberAnywhereSwap.js
          cp "$SRC/MemberControls.html" MemberControls.html
          cp "$SRC/MemberSwapAction.html" MemberSwapAction.html
          cp "$SRC/MemberSwapClient.html" MemberSwapClient.html
          cp "$SRC/MemberSwapInbox.html" MemberSwapInbox.html
          python3 "$GITHUB_WORKSPACE/deployment/jayuminton/emergency_direct_member.py" patch --work "$WORK"
          node --check Code.js
          grep -F 'memberFirebaseJsonpRpc_' Code.js

      - name: Update existing Apps Script deployment
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/main-live"
          clasp push --force
          clasp create-deployment --deploymentId "$MAIN_DEPLOYMENT_ID" --description "firebase direct rpc $GITHUB_RUN_ID"
          echo "MEMBER_RPC_URL=https://script.google.com/macros/s/$MAIN_DEPLOYMENT_ID/exec" >> "$GITHUB_ENV"
          sleep 5

      - name: Verify JSONP RPC
        shell: bash
        run: |
          set -euo pipefail
          CALLBACK="jmProbe$GITHUB_RUN_ID"
          curl --fail --location --retry 4 --max-time 60 "$MEMBER_RPC_URL?rpc=getPublicState&callback=$CALLBACK&payload=W10&nonce=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/rpc.js"
          grep -F "$CALLBACK(" "$RUNNER_TEMP/rpc.js"
          grep -F '"ok":true' "$RUNNER_TEMP/rpc.js"

      - name: Build direct Firebase page
        shell: bash
        run: |
          set -euo pipefail
          BUILD="$RUNNER_TEMP/firebase-direct"
          mkdir -p "$BUILD/web-push"
          python3 "$GITHUB_WORKSPACE/deployment/jayuminton/emergency_direct_member.py" build --work "$RUNNER_TEMP/main-live" --out "$BUILD/web-push" --rpc-url "$MEMBER_RPC_URL" --hosting-url "$HOSTING_URL"
          printf '%s\n' '{"hosting":{"public":"web-push","cleanUrls":true,"headers":[{"source":"/**","headers":[{"key":"Cache-Control","value":"no-store, no-cache, must-revalidate, max-age=0"}]}],"rewrites":[{"source":"**","destination":"/index.html"}]}}' > "$BUILD/firebase.json"
          grep -F 'firebase-direct-rpc-v1' "$BUILD/web-push/index.html"
          grep -F '__JAYUMINTON_FIREBASE_DIRECT_RPC__' "$BUILD/web-push/index.html"
          ! grep -Eqi '<iframe|window\.location\.(replace|href)[[:space:]]*=' "$BUILD/web-push/index.html"

      - name: Deploy Firebase
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/firebase-direct"
          firebase deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive --message "direct member rpc ${GITHUB_SHA::7}"

      - name: Verify live Firebase
        shell: bash
        run: |
          set -euo pipefail
          BASE="${HOSTING_URL%/}"
          sleep 5
          curl --fail --location --retry 4 --max-time 60 -H 'Cache-Control: no-cache' "$BASE/?verify=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/live.html"
          grep -F 'firebase-direct-rpc-v1' "$RUNNER_TEMP/live.html"
          grep -F '__JAYUMINTON_FIREBASE_DIRECT_RPC__' "$RUNNER_TEMP/live.html"
          grep -F 'memberSelfSearchInput' "$RUNNER_TEMP/live.html"
          ! grep -Eqi '<iframe|window\.location\.(replace|href)[[:space:]]*=' "$RUNNER_TEMP/live.html"
          echo firebase-direct-member-rpc-live-ok
