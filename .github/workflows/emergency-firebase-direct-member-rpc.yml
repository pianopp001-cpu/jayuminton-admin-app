name: Emergency Firebase direct member RPC

on:
  push:
    branches: [member-anywhere-controls-v3]
    paths:
      - '.github/workflows/emergency-firebase-direct-member-rpc.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: jayuminton-emergency-firebase-direct-member-rpc
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: member-anywhere-controls-v3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deployment tools
        run: npm install --global @google/clasp@latest firebase-tools@latest

      - name: Authenticate Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Resolve deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          CONFIG="$RUNNER_TEMP/deploy.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$CONFIG"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          jq -e '.mainScriptId and .mainDeploymentId and .firebaseProjectId and .hostingUrl' "$CONFIG" >/dev/null
          echo "MAIN_SCRIPT_ID=$(jq -r '.mainScriptId' "$CONFIG")" >> "$GITHUB_ENV"
          echo "MAIN_DEPLOYMENT_ID=$(jq -r '.mainDeploymentId' "$CONFIG")" >> "$GITHUB_ENV"
          echo "FIREBASE_PROJECT_ID=$(jq -r '.firebaseProjectId' "$CONFIG")" >> "$GITHUB_ENV"
          echo "HOSTING_URL=$(jq -r '.hostingUrl' "$CONFIG")" >> "$GITHUB_ENV"

      - name: Pull live Apps Script and overlay latest member v3 files
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/main-live"
          SRC="$GITHUB_WORKSPACE/source-snapshot/current-main"
          mkdir -p "$WORK"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$MAIN_SCRIPT_ID" > "$WORK/.clasp.json"
          cd "$WORK"
          clasp pull
          cp "$SRC/Index.html" Index.html
          cp "$SRC/MemberAnywhereSwap.js" MemberAnywhereSwap.js
          cp "$SRC/MemberControls.html" MemberControls.html
          cp "$SRC/MemberSwapAction.html" MemberSwapAction.html
          cp "$SRC/MemberSwapClient.html" MemberSwapClient.html
          cp "$SRC/MemberSwapInbox.html" MemberSwapInbox.html

          python3 - <<'PY'
          from pathlib import Path

          p = Path('Code.js')
          s = p.read_text(encoding='utf-8')
          old = """function doGet(e) {\n  ensureSetup_();"""
          new = """function doGet(e) {\n  if (e && e.parameter && e.parameter.rpc) {\n    return memberFirebaseJsonpRpc_(e);\n  }\n  ensureSetup_();"""
          if 'memberFirebaseJsonpRpc_' not in s:
              if old not in s:
                  raise SystemExit('doGet marker missing')
              s = s.replace(old, new, 1)
              helper = r'''
function memberFirebaseJsonpRpc_(e) {
  ensureSetup_();
  const p = e && e.parameter ? e.parameter : {};
  const callback = String(p.callback || '');
  const name = String(p.rpc || '');
  if (!/^[A-Za-z_$][A-Za-z0-9_$]{0,80}$/.test(callback)) {
    throw new Error('잘못된 callback입니다.');
  }
  if (!/^[A-Za-z][A-Za-z0-9]{0,80}$/.test(name) || /_$/.test(name)) {
    return ContentService.createTextOutput(
      callback + '(' + JSON.stringify({ok:false,error:'허용되지 않은 서버 함수입니다.'}) + ');'
    ).setMimeType(ContentService.MimeType.JAVASCRIPT);
  }
  const blocked = {doGet:true, doPost:true, include:true};
  if (blocked[name]) {
    return ContentService.createTextOutput(
      callback + '(' + JSON.stringify({ok:false,error:'허용되지 않은 서버 함수입니다.'}) + ');'
    ).setMimeType(ContentService.MimeType.JAVASCRIPT);
  }
  let args = [];
  try {
    const encoded = String(p.payload || '');
    if (encoded) {
      const normalized = encoded.replace(/-/g, '+').replace(/_/g, '/');
      const pad = '='.repeat((4 - normalized.length % 4) % 4);
      args = JSON.parse(Utilities.newBlob(Utilities.base64Decode(normalized + pad)).getDataAsString('UTF-8'));
    }
    if (!Array.isArray(args)) throw new Error('args');
  } catch (error) {
    return ContentService.createTextOutput(
      callback + '(' + JSON.stringify({ok:false,error:'요청 데이터를 읽을 수 없습니다.'}) + ');'
    ).setMimeType(ContentService.MimeType.JAVASCRIPT);
  }
  try {
    const fn = eval(name);
    if (typeof fn !== 'function') throw new Error('함수를 찾을 수 없습니다.');
    const result = fn.apply(null, args);
    return ContentService.createTextOutput(
      callback + '(' + JSON.stringify({ok:true,result:result}) + ');'
    ).setMimeType(ContentService.MimeType.JAVASCRIPT);
  } catch (error) {
    return ContentService.createTextOutput(
      callback + '(' + JSON.stringify({ok:false,error:String(error && error.message || error || '서버 오류')}) + ');'
    ).setMimeType(ContentService.MimeType.JAVASCRIPT);
  }
}

'''
              marker = 'function include(filename) {'
              if marker not in s:
                  raise SystemExit('include marker missing')
              s = s.replace(marker, helper + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY

          grep -F 'memberFirebaseJsonpRpc_' Code.js >/dev/null
          grep -F "include('MemberSwapClient')" Index.html >/dev/null
          node --check Code.js

      - name: Push and update existing MAIN deployment
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/main-live"
          clasp push --force
          clasp create-deployment --deploymentId "$MAIN_DEPLOYMENT_ID" --description "firebase direct member rpc $GITHUB_RUN_ID"
          echo "MEMBER_RPC_URL=https://script.google.com/macros/s/$MAIN_DEPLOYMENT_ID/exec" >> "$GITHUB_ENV"
          sleep 4

      - name: Verify Apps Script JSONP RPC
        shell: bash
        run: |
          set -euo pipefail
          CALLBACK="jmProbe$GITHUB_RUN_ID"
          PAYLOAD="W10"
          URL="$MEMBER_RPC_URL?rpc=getPublicState&callback=$CALLBACK&payload=$PAYLOAD&nonce=$GITHUB_RUN_ID"
          curl --fail --location --retry 4 --max-time 60 "$URL" -o "$RUNNER_TEMP/rpc.js"
          grep -F "$CALLBACK(" "$RUNNER_TEMP/rpc.js" >/dev/null
          grep -F '"ok":true' "$RUNNER_TEMP/rpc.js" >/dev/null
          echo 'apps-script-jsonp-rpc-ok'

      - name: Build Firebase direct member page
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/main-live"
          BUILD="$RUNNER_TEMP/firebase-direct-member"
          mkdir -p "$BUILD/web-push"
          python3 - "$WORK" "$BUILD/web-push/index.html" "$MEMBER_RPC_URL" "$HOSTING_URL" <<'PY'
          from pathlib import Path
          import json, sys

          work = Path(sys.argv[1])
          out = Path(sys.argv[2])
          rpc_url = sys.argv[3]
          hosting_url = sys.argv[4].rstrip('/') + '/'
          index = (work / 'Index.html').read_text(encoding='utf-8')
          style = (work / 'Style.html').read_text(encoding='utf-8')
          index = index.replace("<?!= include('Style'); ?>", style)
          index = index.replace("<?!= JSON.stringify(memberPageUrl || '') ?>", json.dumps(hosting_url))
          index = index.replace("<?!= pushReturn || '{\"connected\":false,\"memberId\":\"\",\"memberName\":\"\"}' ?>", json.dumps('{"connected":false,"memberId":"","memberName":""}'))

          bridge = r'''<script>
          /* firebase-direct-rpc-v1: Apps Script is used only as a background JSONP endpoint. */
          (function(){
            var endpoint = RPC_URL_JSON;
            var seq = 0;
            function encodeArgs(args){
              var bytes = new TextEncoder().encode(JSON.stringify(args || []));
              var binary = '';
              for(var i=0;i<bytes.length;i++) binary += String.fromCharCode(bytes[i]);
              return btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
            }
            function invoke(name,args,success,failure){
              var callback = '__jmRpc' + Date.now() + '_' + (++seq);
              var script = document.createElement('script');
              var done = false;
              var timer = setTimeout(function(){ finish(new Error('서버 응답 시간이 초과되었습니다.')); }, 20000);
              function cleanup(){
                clearTimeout(timer);
                try{ delete window[callback]; }catch(e){ window[callback]=undefined; }
                if(script.parentNode) script.parentNode.removeChild(script);
              }
              function finish(error,value){
                if(done) return; done=true; cleanup();
                try{ if(error){ if(typeof failure==='function') failure(error); } else if(typeof success==='function') success(value); }catch(e){}
              }
              window[callback] = function(packet){
                if(packet && packet.ok) finish(null, packet.result);
                else finish(new Error(String(packet && packet.error || '서버 요청에 실패했습니다.')));
              };
              script.onerror = function(){ finish(new Error('서버에 연결할 수 없습니다.')); };
              script.src = endpoint + '?rpc=' + encodeURIComponent(String(name)) +
                '&callback=' + encodeURIComponent(callback) +
                '&payload=' + encodeURIComponent(encodeArgs(args)) +
                '&nonce=' + Date.now() + '_' + seq;
              document.head.appendChild(script);
            }
            function runner(success,failure){
              return new Proxy({}, {get:function(_,prop){
                if(prop === 'withSuccessHandler') return function(fn){ return runner(fn,failure); };
                if(prop === 'withFailureHandler') return function(fn){ return runner(success,fn); };
                if(prop === 'then') return undefined;
                return function(){ invoke(String(prop), Array.prototype.slice.call(arguments), success, failure); };
              }});
            }
            window.google = window.google || {};
            window.google.script = window.google.script || {};
            window.google.script.run = runner(null,null);
            window.__JAYUMINTON_FIREBASE_DIRECT_RPC__ = true;
          })();
          </script>'''.replace('RPC_URL_JSON', json.dumps(rpc_url))

          index = index.replace('<script>const IS_ADMIN = false;</script>', '<script>const IS_ADMIN = false;</script>\n' + bridge)
          for name in ['Script','MemberSwapClient','MemberSwapAction','MemberControls','MemberSwapInbox']:
              token = "<?!= include('%s'); ?>" % name
              content = (work / (name + '.html')).read_text(encoding='utf-8')
              if token not in index:
                  raise SystemExit('include token missing: ' + name)
              index = index.replace(token, content, 1)
          if '<?!=' in index or '<iframe' in index or 'window.location.replace' in index:
              raise SystemExit('unsafe template/iframe/redirect remains')
          out.write_text(index, encoding='utf-8')
          PY

          cat > "$BUILD/web-push/manifest.webmanifest" <<'EOF'
          {"name":"자유민턴 코트현황","short_name":"자유민턴","start_url":"/","scope":"/","display":"standalone","background_color":"#ffffff","theme_color":"#315efb"}
          EOF

          cat > "$BUILD/firebase.json" <<'EOF'
          {
            "hosting": {
              "public": "web-push",
              "cleanUrls": true,
              "headers": [
                {"source":"/**","headers":[{"key":"Cache-Control","value":"no-store, no-cache, must-revalidate, max-age=0"}]}
              ],
              "rewrites": [{"source":"**","destination":"/index.html"}]
            }
          }
          EOF

          grep -F 'firebase-direct-rpc-v1' "$BUILD/web-push/index.html" >/dev/null
          grep -F '__JAYUMINTON_FIREBASE_DIRECT_RPC__' "$BUILD/web-push/index.html" >/dev/null
          if grep -Eqi '<iframe|window\.location\.(replace|href)[[:space:]]*=' "$BUILD/web-push/index.html"; then
            echo 'ERROR: browser handoff remains in Firebase page' >&2
            exit 1
          fi

      - name: Deploy Firebase direct member page
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/firebase-direct-member"
          firebase deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive --message "direct member rpc ${GITHUB_SHA::7}"

      - name: Verify live Firebase is direct and iframe-free
        shell: bash
        run: |
          set -euo pipefail
          BASE="${HOSTING_URL%/}"
          sleep 5
          curl --fail --location --retry 4 --max-time 60 -H 'Cache-Control: no-cache' "$BASE/?verify=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/live.html"
          grep -F 'firebase-direct-rpc-v1' "$RUNNER_TEMP/live.html" >/dev/null
          grep -F '__JAYUMINTON_FIREBASE_DIRECT_RPC__' "$RUNNER_TEMP/live.html" >/dev/null
          grep -F 'memberSelfSearchInput' "$RUNNER_TEMP/live.html" >/dev/null
          if grep -Eqi '<iframe|window\.location\.(replace|href)[[:space:]]*=' "$RUNNER_TEMP/live.html"; then
            echo 'ERROR: live Firebase still redirects or embeds Apps Script' >&2
            exit 1
          fi
          echo 'firebase-direct-member-rpc-live-ok'
