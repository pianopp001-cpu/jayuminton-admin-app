name: Force-fix live user install route to v1.2.8

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/force-fix-user-install-link-v128.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: jayuminton-user-install-forcefix-v128
  cancel-in-progress: false

jobs:
  forcefix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --global firebase-tools@latest @google/clasp@latest
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Resolve endpoints and verify exact v1.2.8 APK
        shell: bash
        run: |
          set -euo pipefail
          C="$RUNNER_TEMP/deploy.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$C"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          {
            echo "FIREBASE_PROJECT_ID=$(jq -r '.firebaseProjectId' "$C")"
            echo "HOSTING_URL=$(jq -r '.hostingUrl' "$C")"
            echo "MAIN_SCRIPT_ID=$(jq -r '.mainScriptId' "$C")"
            echo "MAIN_DEPLOYMENT_ID=$(jq -r '.mainDeploymentId' "$C")"
            echo "MAIN_URL=https://script.google.com/macros/s/$(jq -r '.mainDeploymentId' "$C")/exec"
            echo "PUSH_URL=https://script.google.com/macros/s/$(jq -r '.pushDeploymentId' "$C")/exec"
          } >> "$GITHUB_ENV"

          STATUS='deployment/status/user-native-push-v1.2.8.txt'
          APK='releases/jayuminton-courtstatus-v1.2.8-repeat-switch.apk'
          test -s "$STATUS"; test -s "$APK"
          grep -F 'status=success' "$STATUS" >/dev/null
          grep -F 'version=1.2.8' "$STATUS" >/dev/null
          grep -F 'version_code=128' "$STATUS" >/dev/null
          grep -F 'application_id=com.jayuminton.user' "$STATUS" >/dev/null
          EXPECTED="$(sed -n 's/^apk_sha256=//p' "$STATUS" | tail -1)"
          test -n "$EXPECTED"
          test "$(sha256sum "$APK" | awk '{print $1}')" = "$EXPECTED"
          echo "EXPECTED_APK_SHA=$EXPECTED" >> "$GITHUB_ENV"

      - name: Force fresh Hosting shell and v1.2.8 install button
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/deployment/jayuminton/v1637-web"
          ROOT="$RUNNER_TEMP/hosting-v128-force"
          PUBLIC="$ROOT/public"
          mkdir -p "$PUBLIC"
          cp "$SRC/index.html" "$PUBLIC/index.html"
          cp "$SRC/setup-v205.css" "$PUBLIC/setup-v205.css"
          cp "$SRC/manifest.webmanifest" "$PUBLIC/manifest.webmanifest"
          cp "$SRC/firebase-messaging-sw.js" "$PUBLIC/firebase-messaging-sw.js"
          cp "$SRC/alert-self-test.js" "$PUBLIC/alert-self-test.js"
          BASE="${HOSTING_URL%/}"
          for asset in icon-198.png icon-512.png apple-touch-icon-180.png badge-96.png; do
            curl --fail --location --retry 5 "$BASE/$asset?source=$GITHUB_RUN_ID" -o "$PUBLIC/$asset"
          done
          cat "$SRC"/setup-v205.js.gz.b64.part-* | tr -d '\r\n' | base64 -d > "$RUNNER_TEMP/setup.gz"
          gzip -dc "$RUNNER_TEMP/setup.gz" > "$PUBLIC/setup-v205.js"
          python3 deployment/scripts/patch_push_setup_verification.py "$PUBLIC/setup-v205.js"
          python3 deployment/scripts/patch_embedded_browser_push.py "$PUBLIC/setup-v205.js"
          python3 deployment/scripts/patch_native_host_bridge.py "$PUBLIC/setup-v205.js"
          python3 deployment/scripts/patch_user_install_link_v128.py hosting "$PUBLIC/setup-v205.js"

          python3 - <<'PY'
          from pathlib import Path
          import os, re
          public=Path(os.environ['RUNNER_TEMP'])/'hosting-v128-force'/'public'
          run=os.environ['GITHUB_RUN_ID']
          template=Path('deployment/jayuminton/v1637-web/config-v204.template.js').read_text(encoding='utf-8')
          config=template.replace('__MEMBER_PAGE_URL__',os.environ['MAIN_URL']).replace('__RELAY_URL__',os.environ['PUSH_URL'])
          for name in ('config-v202.js','config-v203.js','config-v204.js'):
              (public/name).write_text(config,encoding='utf-8')

          p=public/'index.html'
          s=p.read_text(encoding='utf-8')
          s=s.replace('/setup-v205.js?v=1637',f'/setup-v205.js?v=native-apk-128-force-{run}')
          s=s.replace('/config-v204.js?v=1637',f'/config-v204.js?v=native-apk-128-force-{run}')
          p.write_text(s,encoding='utf-8')

          sw=public/'firebase-messaging-sw.js'
          w=sw.read_text(encoding='utf-8')
          w=re.sub(r"const JAYUMINTON_SW_VERSION = '[^']+';",f"const JAYUMINTON_SW_VERSION = 'v128-install-force-{run}';",w,count=1)
          w=re.sub(r"const JAYUMINTON_CACHE = '[^']+';",f"const JAYUMINTON_CACHE = 'jayuminton-v128-install-force-{run}';",w,count=1)
          sw.write_text(w,encoding='utf-8')
          PY

          node --check "$PUBLIC/setup-v205.js"
          node --check "$PUBLIC/firebase-messaging-sw.js"
          grep -F 'JAYUMINTON_NATIVE_APK_DOWNLOAD_V128' "$PUBLIC/setup-v205.js" >/dev/null
          grep -F 'jayuminton-courtstatus-v1.2.8-repeat-switch.apk?build=128-repeat-switch' "$PUBLIC/setup-v205.js" >/dev/null
          ! grep -F 'v1.2.4-confirmed-overlay.apk' "$PUBLIC/setup-v205.js"
          ! grep -F 'v1.1.7-fresh-install.apk' "$PUBLIC/setup-v205.js"
          ! grep -F 'JAYUMINTON_NATIVE_APK_DOWNLOAD_V124' "$PUBLIC/setup-v205.js"

          cat > "$ROOT/firebase.json" <<'JSON'
          {"hosting":{"public":"public","ignore":["firebase.json","**/.*","**/node_modules/**"],"headers":[{"source":"/index.html","headers":[{"key":"Cache-Control","value":"no-cache, no-store, must-revalidate"}]},{"source":"/setup-v205.js","headers":[{"key":"Cache-Control","value":"no-cache, no-store, must-revalidate"}]},{"source":"/firebase-messaging-sw.js","headers":[{"key":"Cache-Control","value":"no-cache, no-store, must-revalidate"}]}],"rewrites":[{"source":"**","destination":"/index.html"}]}}
          JSON
          firebase deploy --only hosting --project "$FIREBASE_PROJECT_ID" --config "$ROOT/firebase.json" --non-interactive

      - name: Force only user APK URL in live main Script
        shell: bash
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/main-force"; mkdir -p "$W"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$MAIN_SCRIPT_ID" > "$W/.clasp.json"
          cd "$W"
          clasp pull
          sha256sum Admin.html Code.js Index.html Style.html > "$RUNNER_TEMP/main-nonscript.before"
          python3 "$GITHUB_WORKSPACE/deployment/scripts/patch_user_install_link_v128.py" main "$W/Script.html"
          sha256sum Admin.html Code.js Index.html Style.html > "$RUNNER_TEMP/main-nonscript.after"
          cmp "$RUNNER_TEMP/main-nonscript.before" "$RUNNER_TEMP/main-nonscript.after"
          grep -F 'jayuminton-courtstatus-v1.2.8-repeat-switch.apk?build=128-repeat-switch' Script.html >/dev/null
          ! grep -F 'v1.2.4-confirmed-overlay.apk' Script.html
          ! grep -F 'v1.1.7-fresh-install.apk' Script.html
          clasp push --force
          clasp create-deployment --deploymentId "$MAIN_DEPLOYMENT_ID" --description "force user APK v1.2.8 only $GITHUB_RUN_ID"

      - name: Verify live pages contain no old user APK route
        shell: bash
        run: |
          set -euo pipefail
          BASE="${HOSTING_URL%/}"
          EXPECT='jayuminton-courtstatus-v1.2.8-repeat-switch.apk?build=128-repeat-switch'
          ok=0
          for attempt in $(seq 1 20); do
            INDEX_URL="$BASE/index.html?verify=v128-force-$GITHUB_RUN_ID-$attempt"
            SETUP_URL="$BASE/setup-v205.js?verify=v128-force-$GITHUB_RUN_ID-$attempt"
            if curl --fail --location --silent --show-error -H 'Cache-Control: no-cache, no-store' "$INDEX_URL" -o "$RUNNER_TEMP/live-index.html" && \
               curl --fail --location --silent --show-error -H 'Cache-Control: no-cache, no-store' "$SETUP_URL" -o "$RUNNER_TEMP/live-setup.js" && \
               grep -F "native-apk-128-force-$GITHUB_RUN_ID" "$RUNNER_TEMP/live-index.html" >/dev/null && \
               grep -F 'JAYUMINTON_NATIVE_APK_DOWNLOAD_V128' "$RUNNER_TEMP/live-setup.js" >/dev/null && \
               grep -F "$EXPECT" "$RUNNER_TEMP/live-setup.js" >/dev/null && \
               ! grep -F 'v1.2.4-confirmed-overlay.apk' "$RUNNER_TEMP/live-setup.js" >/dev/null && \
               ! grep -F 'v1.1.7-fresh-install.apk' "$RUNNER_TEMP/live-setup.js" >/dev/null; then
              ok=1; break
            fi
            sleep 8
          done
          test "$ok" = 1

          W="$RUNNER_TEMP/main-force-verify"; mkdir -p "$W"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$MAIN_SCRIPT_ID" > "$W/.clasp.json"
          (cd "$W" && clasp pull)
          grep -F "$EXPECT" "$W/Script.html" >/dev/null
          ! grep -F 'v1.2.4-confirmed-overlay.apk' "$W/Script.html"
          ! grep -F 'v1.1.7-fresh-install.apk' "$W/Script.html"

          curl --fail --location --retry 5 \
            'https://raw.githubusercontent.com/pianopp001-cpu/jayuminton-admin-app/main/releases/jayuminton-courtstatus-v1.2.8-repeat-switch.apk?build=128-repeat-switch&r=20260810-2113' \
            -o "$RUNNER_TEMP/live-v128.apk"
          test "$(sha256sum "$RUNNER_TEMP/live-v128.apk" | awk '{print $1}')" = "$EXPECTED_APK_SHA"

          cat > deployment/status/user-v128-install-link-forcefix.txt <<EOF
          status=success
          version=1.2.8
          version_code=128
          apk=jayuminton-courtstatus-v1.2.8-repeat-switch.apk
          apk_sha256=$EXPECTED_APK_SHA
          hosting_button=v1.2.8-only
          main_button=v1.2.8-only
          old_v124_link_present=no
          old_v117_link_present=no
          hosting_shell_cache=forced-new
          admin_logic_changed=no
          verified_at=$(date -u +%FT%TZ)
          EOF

      - name: Publish force-fix verification
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment/status/user-v128-install-link-forcefix.txt
          git commit -m 'Record forced live v1.2.8-only install route verification' || exit 0
          git pull --rebase origin main || true
          git push origin main
