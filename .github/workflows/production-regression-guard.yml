name: Guard canonical Cloudflare production matrix

on:
  push:
    branches: [main]
    paths:
      - 'PROJECT_RULES.md'
      - 'PROJECT_SPEC_20260825.md'
      - 'deployment/status/production-matrix-v203-v1642.txt'
      - '.github/workflows/deploy-cloudflare-state-shadow.yml'
      - '.github/workflows/deploy-cloudflare-admin-save-lock-memo.yml'
      - '.github/workflows/build-v2015-known-good-shell.yml'
      - '.github/workflows/deploy-md6-self-longpress-production.yml'
      - '.github/workflows/build-user-md-final-v1642.yml'
      - '.github/workflows/build-apk.yml'
      - '.github/workflows/build-v2006-md-clean-final.yml'
      - '.github/workflows/production-regression-guard.yml'
      - 'cloudflare/state-worker/**'
      - 'cloudflare/user-push/worker-do.js'
      - 'cloudflare/user-push/worker-do.test.mjs'
      - 'deployment/jayuminton/inject_cloudflare_v6_frontend_bridge.py'
      - 'deployment/jayuminton/admin_cloudflare_post_contract_patch.py'
      - 'deployment/jayuminton/patch_member_self_longpress_v6.py'
      - 'deployment/scripts/patch_user_native_v1642_md_final.py'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify canonical production matrix
        shell: bash
        run: |
          set -euo pipefail
          MATRIX=deployment/status/production-matrix-v203-v1642.txt
          test -s "$MATRIX"
          grep -F 'apps_script_runtime=forbidden' "$MATRIX" >/dev/null
          grep -F 'workflow=.github/workflows/deploy-cloudflare-state-shadow.yml' "$MATRIX" >/dev/null
          grep -F 'verified_run=32795396956' "$MATRIX" >/dev/null
          grep -F 'autoassign_pair_stats_single_record=verified' "$MATRIX" >/dev/null
          grep -F 'pair_stats_reset_consistency=verified' "$MATRIX" >/dev/null
          grep -F 'pair_stats_restore_consistency=verified' "$MATRIX" >/dev/null
          grep -F 'workflow=.github/workflows/deploy-cloudflare-admin-save-lock-memo.yml' "$MATRIX" >/dev/null
          grep -F 'verified_run=32756280670' "$MATRIX" >/dev/null
          grep -F 'workflow=.github/workflows/build-v2015-known-good-shell.yml' "$MATRIX" >/dev/null
          grep -F 'verified_run=32795439226' "$MATRIX" >/dev/null
          grep -F 'workflow=.github/workflows/deploy-md6-self-longpress-production.yml' "$MATRIX" >/dev/null
          grep -F 'verified_run=32753455501' "$MATRIX" >/dev/null
          grep -F 'workflow=.github/workflows/build-user-md-final-v1642.yml' "$MATRIX" >/dev/null
          grep -F 'verified_run=32795371944' "$MATRIX" >/dev/null
          grep -F 'push_target_contract=verified' "$MATRIX" >/dev/null
          grep -F 'verified_run=32795371778' "$MATRIX" >/dev/null
          grep -F 'state_worker_run=32795396956' "$MATRIX" >/dev/null
          grep -F 'admin_apk_run=32795439226' "$MATRIX" >/dev/null

      - name: Verify backend concurrency, pair statistics and push contracts
        shell: bash
        run: |
          set -euo pipefail
          test -s .github/workflows/deploy-cloudflare-state-shadow.yml
          grep -F 'main = "worker-md-final-entry.js"' cloudflare/state-worker/wrangler.toml.template >/dev/null
          grep -F 'liveIdsInGroup(sourceA,body.idsA)' cloudflare/state-worker/worker-md-compat-entry.js >/dev/null
          node cloudflare/state-worker/worker.test.mjs
          node cloudflare/state-worker/md4-autoassign.test.mjs
          node cloudflare/state-worker/md-entry-autoassign.test.mjs
          node cloudflare/state-worker/md-final-entry.test.mjs
          node cloudflare/user-push/worker-do.test.mjs
          grep -F "await env.DB.prepare('DELETE FROM pair_stats').run();" cloudflare/state-worker/worker-md-entry.js >/dev/null
          grep -F "const isRestore = body.name === 'restoreManualBackup';" cloudflare/state-worker/worker-md-entry.js >/dev/null
          grep -F 'isRestore ? null : before' cloudflare/state-worker/worker-md-entry.js >/dev/null
          grep -F "body.name === 'resetAllOperationData' || isRestore" cloudflare/state-worker/worker-md-entry.js >/dev/null
          grep -F "repeatCount: '8'" cloudflare/user-push/worker-do.js >/dev/null
          grep -F "pulsesPerGroup: '3'" cloudflare/user-push/worker-do.js >/dev/null
          grep -F "stopOnConfirm: 'true'" cloudflare/user-push/worker-do.js >/dev/null

      - name: Verify admin v203 canonical paths
        shell: bash
        run: |
          set -euo pipefail
          BRIDGE=deployment/jayuminton/inject_cloudflare_v6_frontend_bridge.py
          POST=deployment/jayuminton/admin_cloudflare_post_contract_patch.py
          test -s .github/workflows/deploy-cloudflare-admin-save-lock-memo.yml
          test -s .github/workflows/build-v2015-known-good-shell.yml
          grep -F 'JAYUMINTON_ADMIN_CLOUDFLARE_SAVE_LOCK_V24' "$POST" >/dev/null
          grep -F 'CLOUDFLARE_V6_FRONTEND_BRIDGE_OK' "$BRIDGE" >/dev/null
          grep -F 'build-v2015-known-good-shell.yml' PROJECT_RULES.md >/dev/null
          grep -F '32795396956' PROJECT_RULES.md >/dev/null
          grep -F '32795439226' PROJECT_RULES.md >/dev/null
          grep -F '32756280670' PROJECT_RULES.md >/dev/null

      - name: Verify exact restored admin UI contract
        shell: bash
        run: |
          set -euo pipefail
          BRIDGE=deployment/jayuminton/inject_cloudflare_v6_frontend_bridge.py
          POST=deployment/jayuminton/admin_cloudflare_post_contract_patch.py
          grep -F '>같은 팀 설정</button>' "$BRIDGE" >/dev/null
          grep -F '>팀 해제</button>' "$BRIDGE" >/dev/null
          grep -F '#adminApp .member-team-badge{display:none!important}' "$BRIDGE" >/dev/null
          grep -F 'box-shadow:inset 5px 0 0 var(--member-team-color)!important' "$BRIDGE" >/dev/null
          grep -F 'id="jayuminton-pair-statistics-disclosure-v2028"' "$BRIDGE" >/dev/null
          grep -F 'max-height:none!important;height:auto!important' "$POST" >/dev/null
          grep -F 'overflow:visible!important;white-space:normal!important' "$POST" >/dev/null
          grep -F '>▶ 1회 재생</button>' "$BRIDGE" >/dev/null
          grep -F '>🔁 반복재생</button>' "$BRIDGE" >/dev/null
          grep -F 'onclick="stopVoiceAnnouncement()">■ 멈춤</button>' "$BRIDGE" >/dev/null
          grep -F '>🔇 멘트 음소거</button>' "$BRIDGE" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_SAVING__' "$POST" >/dev/null
          grep -F "['pointerdown','click','dblclick','contextmenu']" "$POST" >/dev/null
          grep -F 'if(!window.__JAYUMINTON_ADMIN_SAVING__||isVoice(e.target))return;' "$POST" >/dev/null
          grep -F '.court-voice-controls,.admin-voice-controls,[data-voice-control]' "$POST" >/dev/null
          grep -F 'member-public-memo' "$POST" >/dev/null
          grep -F 'publicMemo' "$POST" >/dev/null
          grep -F 'font-size:9px!important' "$POST" >/dev/null

      - name: Verify user v1.6.42 canonical paths
        shell: bash
        run: |
          set -euo pipefail
          test -s .github/workflows/deploy-md6-self-longpress-production.yml
          test -s .github/workflows/build-user-md-final-v1642.yml
          grep -F 'Build unified MD-final user APK v1.6.42' .github/workflows/build-user-md-final-v1642.yml >/dev/null
          grep -F 'VERSION="1.6.42"' .github/workflows/build-user-md-final-v1642.yml >/dev/null
          grep -F 'MAX_GROUPS = 8' .github/workflows/build-user-md-final-v1642.yml >/dev/null
          grep -F 'NativePushRegistrar.isCurrentMember' .github/workflows/build-user-md-final-v1642.yml >/dev/null
          grep -F 'node cloudflare/user-push/worker-do.test.mjs' .github/workflows/build-user-md-final-v1642.yml >/dev/null
          grep -F 'JAYUMINTON_MD6_SELF_LONGPRESS_V2' .github/workflows/deploy-md6-self-longpress-production.yml >/dev/null
          grep -F 'box-shadow:inset 4px 0 0 var(--jm-team-color)!important' .github/workflows/deploy-md6-self-longpress-production.yml >/dev/null
          grep -F 'publicMemo' .github/workflows/deploy-md6-self-longpress-production.yml >/dev/null
          grep -F "server('memberMoveSelf'" .github/workflows/deploy-md6-self-longpress-production.yml >/dev/null
          grep -F "server('updateMyProfile'" .github/workflows/deploy-md6-self-longpress-production.yml >/dev/null
          grep -F '32795371944' PROJECT_RULES.md >/dev/null
          grep -F '32753455501' PROJECT_RULES.md >/dev/null

      - name: Verify all known legacy APK routes remain blocked
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'DISABLED legacy v199.6 GAS APK build' .github/workflows/build-apk.yml >/dev/null
          grep -F 'exit 1' .github/workflows/build-apk.yml >/dev/null
          grep -F 'DISABLED legacy admin v201.4 APK build' .github/workflows/build-v2006-md-clean-final.yml >/dev/null
          grep -F 'DISABLED: legacy v201.4 admin APK build must never replace canonical v203.0.' .github/workflows/build-v2006-md-clean-final.yml >/dev/null
          grep -F 'exit 1' .github/workflows/build-v2006-md-clean-final.yml >/dev/null
          if grep -F "push:" .github/workflows/build-v2006-md-clean-final.yml >/dev/null; then
            echo 'legacy v201.4 workflow must not have a push trigger' >&2
            exit 1
          fi
          ! grep -aF 'script.google.com/macros/s/' releases/jayuminton-courtstatus-v1.6.42-md-final.apk 2>/dev/null || {
            echo 'Forbidden GAS URL detected in current user APK'; exit 1;
          }

      - name: Verify project rules retain Cloudflare-only priority
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'PROJECT_SPEC_20260825.md' PROJECT_RULES.md >/dev/null
          grep -F 'Google Apps Script를 운영 런타임으로 사용하지 않는다.' PROJECT_RULES.md >/dev/null
          grep -F '공식 운영 고정점 (2026-08-25)' PROJECT_RULES.md >/dev/null
          grep -F '자동배정의 함께 경기통계는 요청 단위 전후 상태를 기준으로 정확히 한 번만 기록한다.' PROJECT_RULES.md >/dev/null
          grep -F '운영 초기화 `resetAll`/`resetAllOperationData`가 성공한 경우에만' PROJECT_RULES.md >/dev/null
          grep -F '`restoreManualBackup`은 복원 전후 위치 차이를 새 경기로 기록하지 않는다.' PROJECT_RULES.md >/dev/null
          echo 'CANONICAL_PRODUCTION_GUARD_OK v203 v1.6.42'

      - name: Record verified guard success
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deployment/status
          NOW="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          {
            echo 'status=success'
            echo 'guard=canonical-production-v203-v1642'
            echo 'exact_ui_contract=verified'
            echo 'state_worker_run=32795396956'
            echo 'admin_web_run=32756280670'
            echo 'admin_apk_run=32795439226'
            echo 'user_web_run=32753455501'
            echo 'user_apk_run=32795371944'
            echo 'full_rollout_run=32795371778'
            echo 'pair_stats_single_record=verified'
            echo 'pair_stats_reset_consistency=verified'
            echo 'pair_stats_restore_consistency=verified'
            echo 'push_target_3x8=verified'
            echo 'apps_script_runtime=forbidden'
            echo 'legacy_v2014_rebuild=blocked'
            echo "run_id=$GITHUB_RUN_ID"
            echo "head_sha=$GITHUB_SHA"
            echo "updated_at=$NOW"
          } > deployment/status/production-regression-guard.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment/status/production-regression-guard.txt
          git commit -m 'status: verify canonical production regression guard' || exit 0
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          git push origin HEAD:main