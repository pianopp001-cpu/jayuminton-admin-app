name: Rebuild v200.1 after native TTS3 contract
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rebuild-v2001-tts3-on-push.yml
      - app/src/main/java/com/jayuminton/admin/MainActivity.java
      - deployment/jayuminton/admin_native_tts3_patch.py
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Verify TTS3 contract exists on main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify native contract
        run: |
          set -euo pipefail
          JAVA=app/src/main/java/com/jayuminton/admin/MainActivity.java
          grep -F 'VOICE_REPEAT_COUNT = 3' "$JAVA"
          grep -F 'MEDIA_DUCK_VOLUME_STEP = 6' "$JAVA"
          grep -F 'setStreamVolume(AudioManager.STREAM_ALARM, maxAlarm, 0)' "$JAVA"
          grep -F 'remainingVoiceRepeats = VOICE_REPEAT_COUNT' "$JAVA"
      - name: Dispatch verified fresh-install APK build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/build-v1995-direct.yml/dispatches" \
            -d '{"ref":"main"}'
          echo 'v200.1 TTS3 fresh-install APK build dispatched.'
