name: DISABLED legacy v200.1 native TTS3 rollback

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blocked:
    runs-on: ubuntu-latest
    steps:
      - name: Block legacy v200.1/v199.5 rebuild path
        run: |
          echo 'DISABLED: this workflow forces the obsolete v200.1 TTS contract and dispatches a v199.5 APK rebuild.'
          echo 'Production baseline is Cloudflare/v203 with current voice controls.'
          exit 1
