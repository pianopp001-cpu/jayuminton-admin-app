name: Build isolated v1.3.3 Cloudflare user recovery

on:
  push:
    branches: [isolated-user-push-recovery]
    paths:
      - '.github/workflows/build-user-v133-cloudflare-isolated.yml'
      - 'deployment/scripts/patch_cloudflare_user_push_target_v133.py'
      - 'deployment/scripts/patch_user_native_v133_cloudflare_web.py'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: jayuminton-user-v133-isolated
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      WORKER_NAME: jayuminton-user-push
      WORKER_URL: https://jayuminton-user-push.pianopp001.workers.dev

    steps:
      - uses: actions/checkout@v4
        with:
          ref: isolated-user-push-recovery
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.7'}
      - run: npm install --global wrangler@latest firebase-tools@latest
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Prepare exact current Cloudflare worker with strict target contract
        shell: bash
        run: |
          set -euo pipefail
          for v in "$CLOUDFLARE_API_TOKEN" "$CLOUDFLARE_ACCOUNT_ID" "$FIREBASE_SERVICE_ACCOUNT_JSON" "$JAYUMINTON_DEPLOY_CONFIG_JSON"; do test -n "$v"; done
          ROOT="$RUNNER_TEMP/cf-worker"; mkdir -p "$ROOT"
          curl -fsSL "https://raw.githubusercontent.com/pianopp001-cpu/jayuminton-admin-app/main/cloudflare/user-push/worker-do.js" -o "$ROOT/worker.js"
          grep -F "memberId: String(member.id)" "$ROOT/worker.js" >/dev/null
          python3 deployment/scripts/patch_cloudflare_user_push_target_v133.py "$ROOT/worker.js"
          grep -F "targetMemberId: String(member.id)" "$ROOT/worker.js" >/dev/null
          node --check "$ROOT/worker.js"
          cat > "$ROOT/wrangler.toml" <<EOF
          name = "$WORKER_NAME"
          main = "worker.js"
          compatibility_date = "2026-08-21"
          workers_dev = true
          account_id = "$CLOUDFLARE_ACCOUNT_ID"

          [[durable_objects.bindings]]
          name = "PUSH_REGISTRY"
          class_name = "PushRegistry"

          [[migrations]]
          tag = "v1"
          new_sqlite_classes = ["PushRegistry"]
          EOF

      - name: Deploy only the targetMemberId hotfix to existing Cloudflare worker
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/cf-worker"
          wrangler deploy --config wrangler.toml | tee "$RUNNER_TEMP/wrangler-v133.txt"
          grep -F "$WORKER_URL" "$RUNNER_TEMP/wrangler-v133.txt" >/dev/null || true
          sleep 3
          curl -fsS "$WORKER_URL/health" > "$RUNNER_TEMP/health.json"
          jq -e '.ok==true and .service=="jayuminton-cloudflare-user-push" and .storage=="durable-object"' "$RUNNER_TEMP/health.json" >/dev/null

      - name: Resolve Firebase and legacy config used only to generate Android project
        shell: bash
        run: |
          set -euo pipefail
          C="$RUNNER_TEMP/deploy.json"; printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$C"
          MAIN_DEPLOYMENT_ID="$(jq -r '.mainDeploymentId // empty' "$C")"
          FIREBASE_PROJECT_ID="$(jq -r '.firebaseProjectId // empty' "$C")"
          test -n "$MAIN_DEPLOYMENT_ID"; test -n "$FIREBASE_PROJECT_ID"
          printf 'MAIN_DEPLOYMENT_ID=%s\nFIREBASE_PROJECT_ID=%s\nPUSH_URL=%s\n' "$MAIN_DEPLOYMENT_ID" "$FIREBASE_PROJECT_ID" "$WORKER_URL" >> "$GITHUB_ENV"
          firebase apps:list ANDROID --project "$FIREBASE_PROJECT_ID" --json > "$RUNNER_TEMP/apps.json"
          APP_ID="$(jq -r '[.. | objects | select(((.packageName? == "com.jayuminton.user") or (.package_name? == "com.jayuminton.user") or (.androidClientInfo?.packageName? == "com.jayuminton.user")) and ((.appId? // .app_id?) != null)) | (.appId? // .app_id?)] | first // empty' "$RUNNER_TEMP/apps.json")"
          test -n "$APP_ID"
          firebase apps:sdkconfig ANDROID "$APP_ID" --project "$FIREBASE_PROJECT_ID" > app/google-services.json
          grep -F 'com.jayuminton.user' app/google-services.json >/dev/null

      - name: Build v1.3.3 without Apps Script user WebView
        shell: bash
        run: |
          set -euo pipefail
          S="$RUNNER_TEMP/build-v133.sh"
          cp deployment/scripts/build_user_native_push_fresh_v110.sh "$S"
          for patch in \
            patch_build_user_native_v111.py patch_build_user_native_v112.py patch_build_user_native_v113.py patch_build_user_native_v114.py \
            patch_build_user_native_v115.py patch_build_user_native_v116.py patch_build_user_native_v117.py patch_build_user_native_v118.py \
            patch_build_user_native_v119.py patch_build_user_native_v120_diagnostic.py patch_build_user_native_v121.py patch_build_user_native_v122.py \
            patch_build_user_native_v124_confirmed_overlay.py patch_build_user_native_v126_stop_controller.py patch_build_user_native_v126_raceguard.py \
            patch_build_user_native_v127_member_switch.py patch_build_user_native_v128_repeat_switch.py patch_build_user_native_v129_background_registration.py; do
            python3 "deployment/scripts/$patch" "$S"
          done
          python3 deployment/scripts/patch_user_native_v130_vibration_cap8.py "$S"
          python3 deployment/scripts/patch_user_native_v132_strict_current_member.py "$S"
          python3 deployment/scripts/patch_user_native_v133_cloudflare_web.py "$S"
          grep -F 'VERSION="1.3.3"' "$S" >/dev/null
          grep -F 'https://jayuminton-push.web.app/' "$S" >/dev/null
          ! grep -F 'USER_URL="https://script.google.com/macros/s/' "$S"
          grep -F 'NativePushRegistrar.isCurrentMember(this, targetMemberId)' "$S" >/dev/null
          grep -F 'private static final int MAX_GROUPS = 8;' "$S" >/dev/null
          export MAIN_DEPLOYMENT_ID PUSH_URL FIREBASE_PROJECT_ID
          bash "$S"
          SRC='releases/jayuminton-courtstatus-v1.3.3-cloudflare-user-web.apk'
          test -s "$SRC"
          cp "$SRC" "$RUNNER_TEMP/jayuminton-user-v1.3.3-cloudflare.apk"

      - name: Publish isolated APK and verification result
        shell: bash
        run: |
          set -euo pipefail
          APK='releases/jayuminton-user-v1.3.3-cloudflare-isolated.apk'
          cp "$RUNNER_TEMP/jayuminton-user-v1.3.3-cloudflare.apk" "$APK"
          sha256sum "$APK" > deployment/status/user-v133-cloudflare-isolated.sha256
          cat > deployment/status/user-v133-cloudflare-isolated.txt <<EOF
          status=success
          branch=isolated-user-push-recovery
          user_web=https://jayuminton-push.web.app/
          apps_script_user_web=disabled
          push_backend=$WORKER_URL
          push_storage=cloudflare-durable-object
          fcm_target_field=targetMemberId
          version=1.3.3
          application_id=com.jayuminton.user
          vibration_groups=8
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$APK" deployment/status/user-v133-cloudflare-isolated.*
          git commit -m 'Publish isolated v1.3.3 Cloudflare user APK' || exit 0
          git push origin isolated-user-push-recovery

      - uses: actions/upload-artifact@v4
        with:
          name: jayuminton-user-v1.3.3-cloudflare-isolated
          path: ${{ runner.temp }}/jayuminton-user-v1.3.3-cloudflare.apk
          retention-days: 30
          if-no-files-found: error
