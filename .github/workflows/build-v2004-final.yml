name: Build final Jayuminton admin v200.4 APK
run-name: Final Jayuminton admin v200.4 APK

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-v2004-final.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: jayuminton-v2004-final-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      APK_OUTPUT: releases/jayuminton-admin-v200.4-final.apk
      DOG_ICON_SHA256: a64eaa06107cd20478fe49ab7c10b5b2afd2347533b95c383a439f8705d4a58e
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Resolve latest successful verified admin preview URL
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow preview-admin-cloudflare.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          test "$RUN_ID" != "0"
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log > "$RUNNER_TEMP/preview.log"
          URL="$(grep -Eo 'ADMIN_TEST_URL=https://[^ ]+' "$RUNNER_TEMP/preview.log" | tail -1 | sed 's/^ADMIN_TEST_URL=//')"
          if [ -z "$URL" ]; then
            URL="$(grep -Eo 'https://[^ ]+--admin-cloudflare-vnext-[a-z0-9]+\.web\.app' "$RUNNER_TEMP/preview.log" | tail -1)"
          fi
          test -n "$URL"
          echo "ADMIN_PREVIEW_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "ADMIN_PREVIEW_URL=$URL" >> "$GITHUB_ENV"
          printf 'preview_run=%s\npreview_url=%s\n' "$RUN_ID" "$URL" | tee "$RUNNER_TEMP/preview-source.txt"

      - name: Download and verify final admin frontend
        shell: bash
        run: |
          set -euo pipefail
          URL="$ADMIN_PREVIEW_URL/?apkFinalVerify=$GITHUB_RUN_ID"
          curl --fail --location --retry 8 --retry-delay 3 "$URL" -o "$RUNNER_TEMP/admin-final.html"
          for marker in \
            JAYUMINTON_ADMIN_CLOUDFLARE_FINAL_V1 \
            __JAYUMINTON_ADMIN_VOICE_TEST_REMOVED__ \
            __JAYUMINTON_ADMIN_NEW_BADGE_KO__ \
            __JAYUMINTON_ADMIN_REFRESH_BOUND__ \
            __JAYUMINTON_ADMIN_BLOCKING_SAVE__ \
            jayuminton-admin-finish-alert-v19 \
            __JAYUMINTON_ADMIN_FINISH_ALERT_V19__ \
            __JAYUMINTON_TRANSITION_ALERT__ \
            'emptyCourtAllowed:true' \
            __JAYUMINTON_ADMIN_EMPTY_COURT_FINISH_V1__ \
            __JAYUMINTON_ADMIN_TRANSITION_ALERT_BRIDGE_V1__ \
            __JAYUMINTON_ADMIN_FAST_SAVE_CLIENT_V1__ \
            __JAYUMINTON_ADMIN_STATISTICS_NO_CLIP_FINAL__ \
            "memberWaitAlert:'member-device-only'" \
            "memberCourtAlert:'member-device-only'" \
            'adminTransitionVibration:true' \
            'adminCourtVoice:true' \
            'vibrationSets:8' \
            'vibrationsPerSet:3' \
            '번 코트 종료되었습니다.' \
            '번 코트로 들어가 주세요.' \
            'data-jm-top-controls'; do
            grep -F "$marker" "$RUNNER_TEMP/admin-final.html" >/dev/null
          done
          if grep -F 'adminVoiceTestButton' "$RUNNER_TEMP/admin-final.html" >/dev/null; then exit 1; fi
          if grep -F '>음성테스트<' "$RUNNER_TEMP/admin-final.html" >/dev/null; then exit 1; fi
          if grep -F 'script.google.com/macros/s/' "$RUNNER_TEMP/admin-final.html" >/dev/null; then exit 1; fi
          mkdir -p app/src/main/assets/admin
          cp "$RUNNER_TEMP/admin-final.html" app/src/main/assets/admin/index.html

      - name: Prepare v200.4 native shell and vibration bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          java=Path('app/src/main/java/com/jayuminton/admin/MainActivity.java')
          text=java.read_text(encoding='utf-8')
          text,n=re.subn(r'private static final String ADMIN_URL =\s*\n?\s*"[^"]+";', 'private static final String ADMIN_URL =\n            "file:///android_asset/admin/index.html?app=admin&native=1&appVersion=200.4";', text, count=1)
          if n != 1: raise SystemExit('ADMIN_URL replacement failed')
          text,n=re.subn(r'private static final String APK_WEB_BUILD = "[^"]+";', 'private static final String APK_WEB_BUILD = "2004-final";', text, count=1)
          if n != 1: raise SystemExit('APK_WEB_BUILD replacement failed')
          text=text.replace('JayumintonNative/199.7 CloudflareAdmin/1997','JayumintonNative/200.4 CloudflareAdmin/2004')
          if 'import android.os.VibrationEffect;' not in text:
              text=text.replace('import android.os.Bundle;\n','import android.os.Bundle;\nimport android.os.VibrationEffect;\nimport android.os.Vibrator;\n')
          anchor='''        @JavascriptInterface\n        public boolean isSpeaking() {\n            return speaking.get() || (tts != null && tts.isSpeaking());\n        }\n'''
          methods='''        @JavascriptInterface\n        public boolean isSpeaking() {\n            return speaking.get() || (tts != null && tts.isSpeaking());\n        }\n\n        @JavascriptInterface\n        public void vibrate() {\n            runOnUiThread(() -> {\n                Vibrator vibrator = (Vibrator) getSystemService(VIBRATOR_SERVICE);\n                if (vibrator == null || !vibrator.hasVibrator()) return;\n                long[] pattern = new long[] {\n                    0,360,150,360,150,360,520,\n                    360,150,360,150,360,520,\n                    360,150,360,150,360,520,\n                    360,150,360,150,360,520,\n                    360,150,360,150,360,520,\n                    360,150,360,150,360,520,\n                    360,150,360,150,360,520,\n                    360,150,360,150,360\n                };\n                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {\n                    vibrator.vibrate(VibrationEffect.createWaveform(pattern, -1));\n                } else {\n                    vibrator.vibrate(pattern, -1);\n                }\n            });\n        }\n\n        @JavascriptInterface\n        public void cancelVibration() {\n            runOnUiThread(() -> {\n                Vibrator vibrator = (Vibrator) getSystemService(VIBRATOR_SERVICE);\n                if (vibrator != null) vibrator.cancel();\n            });\n        }\n'''
          if 'public void vibrate()' not in text:
              if anchor not in text: raise SystemExit('VoiceBridge anchor missing')
              text=text.replace(anchor, methods, 1)
          java.write_text(text,encoding='utf-8')
          manifest=Path('app/src/main/AndroidManifest.xml')
          m=manifest.read_text(encoding='utf-8')
          if 'android.permission.VIBRATE' not in m:
              tag=m.find('<manifest')
              end=m.find('>', tag)
              if tag < 0 or end < 0: raise SystemExit('manifest tag missing')
              m=m[:end+1]+'\n    <uses-permission android:name="android.permission.VIBRATE" />'+m[end+1:]
          manifest.write_text(m,encoding='utf-8')
          gradle=Path('app/build.gradle')
          g=gradle.read_text(encoding='utf-8')
          g=re.sub(r"applicationId\s+['\"][^'\"]+['\"]", "applicationId 'com.jayuminton.admin'", g, count=1)
          g=re.sub(r'versionCode\s+\d+', 'versionCode 2004', g, count=1)
          g=re.sub(r"versionName\s+['\"][^'\"]+['\"]", "versionName '200.4'", g, count=1)
          gradle.write_text(g,encoding='utf-8')
          PY
          grep -F 'public void vibrate()' app/src/main/java/com/jayuminton/admin/MainActivity.java
          grep -F 'public void cancelVibration()' app/src/main/java/com/jayuminton/admin/MainActivity.java
          grep -F 'AUDIOFOCUS_GAIN_TRANSIENT_MAY_DUCK' app/src/main/java/com/jayuminton/admin/MainActivity.java
          grep -F 'setWillPauseWhenDucked(false)' app/src/main/java/com/jayuminton/admin/MainActivity.java
          grep -F 'VOICE_REPEAT_COUNT = 3' app/src/main/java/com/jayuminton/admin/MainActivity.java
          grep -F 'android.permission.VIBRATE' app/src/main/AndroidManifest.xml

      - name: Restore launcher icon and signing key
        shell: bash
        run: |
          set -euo pipefail
          SRC='app/src/main/res/drawable/icon_from_library.b64'
          ICON='app/src/main/res/drawable/icon.png'
          base64 --decode "$SRC" > "$ICON"
          test "$(sha256sum "$ICON" | awk '{print $1}')" = "$DOG_ICON_SHA256"
          mkdir -p signing
          base64 --decode signing/jayuminton-release.keystore.b64 > signing/jayuminton-release.jks
          keytool -list -keystore signing/jayuminton-release.jks -storepass 'JayuMinton14!' -alias jayuminton >/dev/null

      - name: Build signed release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify final APK contents and signature
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          unzip -p "$APK" assets/admin/index.html > "$RUNNER_TEMP/apk-admin.html"
          for marker in \
            JAYUMINTON_ADMIN_CLOUDFLARE_FINAL_V1 \
            __JAYUMINTON_ADMIN_BLOCKING_SAVE__ \
            __JAYUMINTON_ADMIN_EMPTY_COURT_FINISH_V1__ \
            __JAYUMINTON_ADMIN_TRANSITION_ALERT_BRIDGE_V1__ \
            __JAYUMINTON_ADMIN_STATISTICS_NO_CLIP_FINAL__ \
            'adminTransitionVibration:true' \
            'vibrationSets:8' \
            'vibrationsPerSet:3' \
            '번 코트 종료되었습니다.' \
            'data-jm-top-controls'; do
            grep -F "$marker" "$RUNNER_TEMP/apk-admin.html" >/dev/null
          done
          unzip -p "$APK" classes.dex | strings | grep -F 'cancelVibration' >/dev/null
          unzip -p "$APK" classes.dex | strings | grep -F 'VibrationEffect' >/dev/null

      - name: Publish final verified APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p releases deployment/status
          cp app/build/outputs/apk/release/app-release.apk "$APK_OUTPUT"
          SHA="$(sha256sum "$APK_OUTPUT" | awk '{print $1}')"
          printf 'status=success\nversion=200.4\nfile=%s\nsha256=%s\npreview_run=%s\npreview_url=%s\nbuilt_at=%s\n' \
            "$APK_OUTPUT" "$SHA" "$ADMIN_PREVIEW_RUN_ID" "$ADMIN_PREVIEW_URL" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > deployment/status/v2004-final.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$APK_OUTPUT" deployment/status/v2004-final.txt
          git commit -m 'Add final Jayuminton admin v200.4 APK'
          git pull --rebase origin main
          git push origin main

      - name: Upload final APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jayuminton-admin-v200.4-final
          path: releases/jayuminton-admin-v200.4-final.apk
          if-no-files-found: error
          retention-days: 30
