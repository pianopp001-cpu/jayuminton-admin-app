name: Verify admin excluded roster always visible

on:
  push:
    branches: [main]
    paths:
      - 'deployment/jayuminton/admin_excluded_always_visible_patch.py'
      - 'deployment/jayuminton/apply_admin_vnext_patches.py'
      - 'deployment/jayuminton/admin_md_ui_cleanup_patch.py'
      - 'docs/JAYUMINTON_COMPLETE_OPERATIONS_REQUIREMENTS.md'
      - '.github/workflows/verify-admin-excluded-always-visible.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: verify-admin-excluded-always-visible
  cancel-in-progress: true

jobs:
  verify-current-admin-structure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch to current rendered admin snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/admin"
          curl --fail --location --retry 5 'https://jayuminton-push--admin-cloudflare-vnext-z3bgvi2g.web.app/?verify=excluded-always-visible' -o "$RUNNER_TEMP/admin/Admin.html"
          python3 deployment/jayuminton/admin_excluded_always_visible_patch.py "$RUNNER_TEMP/admin"
          python3 - "$RUNNER_TEMP/admin/Admin.html" <<'PY'
          from pathlib import Path
          import sys
          html=Path(sys.argv[1]).read_text(encoding='utf-8')
          start=html.index('<details class="admin-setup-details"')
          end=html.index('</details>',start)
          excluded=html.index('class="card excluded-panel admin-excluded-always-visible"')
          assert not start < excluded < end
          assert html.count('id="excludedMembers"') == 1
          assert '멤버등록·비밀번호·게임횟수·제외인원 관리' in html
          assert '게임횟수 카운트 조정' in html[start:end]
          wait=html.index('class="v4-wait-summary"',excluded)
          block=html[excluded:wait]
          assert "setSelectedStatus('active')" in block
          assert 'decreaseSelectedGames()' not in block
          print('ADMIN_EXCLUDED_ALWAYS_VISIBLE_VERIFIED')
          PY
