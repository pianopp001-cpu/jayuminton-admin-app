name: Deploy verified user alerts 3x3 3x5

on:
  pull_request:
    branches: [main]
    paths:
      - 'deployment/status/trigger-alert-3x3-3x5.txt'
      - '.github/workflows/deploy-alert-3x3-3x5.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: jayuminton-alert-3x3-3x5
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deploy tools
        run: npm install --global @google/clasp@latest firebase-tools@latest

      - name: Authenticate Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Resolve live projects
        shell: bash
        run: |
          set -euo pipefail
          CONFIG="$RUNNER_TEMP/deploy.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$CONFIG"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          jq -e '.mainScriptId and .mainDeploymentId and .pushScriptId and .pushDeploymentId and .firebaseProjectId and .hostingUrl' "$CONFIG" >/dev/null
          {
            echo "MAIN_SCRIPT_ID=$(jq -r '.mainScriptId' "$CONFIG")"
            echo "MAIN_DEPLOYMENT_ID=$(jq -r '.mainDeploymentId' "$CONFIG")"
            echo "PUSH_SCRIPT_ID=$(jq -r '.pushScriptId' "$CONFIG")"
            echo "PUSH_DEPLOYMENT_ID=$(jq -r '.pushDeploymentId' "$CONFIG")"
            echo "FIREBASE_PROJECT_ID=$(jq -r '.firebaseProjectId' "$CONFIG")"
            echo "HOSTING_URL=$(jq -r '.hostingUrl' "$CONFIG")"
          } >> "$GITHUB_ENV"

      - name: Patch and verify live user foreground alert
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/main-script"
          mkdir -p "$WORK"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$MAIN_SCRIPT_ID" > "$WORK/.clasp.json"
          cd "$WORK"
          clasp pull
          cp Style.html "$RUNNER_TEMP/style-before.html"
          python3 "$GITHUB_WORKSPACE/deployment/scripts/patch_alert_3x3_3x5.py" "$WORK"
          cmp Style.html "$RUNNER_TEMP/style-before.html"
          python3 - <<'PY'
          from pathlib import Path
          s=Path('Script.html').read_text(encoding='utf-8')
          a=s.find('<script>'); b=s.rfind('</script>')
          if a<0 or b<=a: raise SystemExit('Script wrapper missing')
          Path('check.js').write_text(s[a+8:b],encoding='utf-8')
          PY
          node --check check.js
          grep -F "if (type === 'court_assignment') return 5;" Script.html >/dev/null
          grep -F "if (type === 'wait1_ready') return 3;" Script.html >/dev/null
          grep -F '[650, 220, 650, 220, 650]' Script.html >/dev/null
          grep -F 'index * 3500' Script.html >/dev/null

      - name: Patch and verify FCM sender for web and Android
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/push-script"
          mkdir -p "$WORK"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$PUSH_SCRIPT_ID" > "$WORK/.clasp.json"
          cd "$WORK"
          clasp pull
          python3 "$GITHUB_WORKSPACE/deployment/scripts/patch_push_sender_android.py" "$WORK"
          node --check Code.js
          grep -F "repeatCount: event.type === 'court_assignment' ? '5' : '3'" Code.js >/dev/null
          grep -F "priority: 'high'" Code.js >/dev/null
          grep -F "ttl: '600s'" Code.js >/dev/null
          grep -F "Urgency: 'high'" Code.js >/dev/null

      - name: Mirror current live Hosting without design changes
        shell: bash
        run: |
          set -euo pipefail
          BASE="${HOSTING_URL%/}"
          ROOT="$RUNNER_TEMP/hosting"
          PUBLIC="$ROOT/web-push"
          mkdir -p "$PUBLIC"
          cp deployment/jayuminton/firebase.json "$ROOT/firebase.json"
          curl --fail --location --retry 5 -H 'Cache-Control: no-cache' "$BASE/index.html?mirror=$GITHUB_RUN_ID" -o "$PUBLIC/index.html"
          cp "$PUBLIC/index.html" "$RUNNER_TEMP/live-index-before.html"
          python3 - "$PUBLIC/index.html" "$RUNNER_TEMP/asset-list.txt" <<'PY'
          from pathlib import Path
          import re,sys,json
          html=Path(sys.argv[1]).read_text(encoding='utf-8',errors='ignore')
          paths=set(['/manifest.webmanifest','/setup-v205.css','/setup-v205.js','/config-v204.js','/icon-198.png','/icon-512.png','/apple-touch-icon-180.png','/badge-96.png'])
          for value in re.findall(r'(?:src|href)=["\']([^"\']+)',html):
              if value.startswith('/') and not value.startswith('//'):
                  paths.add(value.split('?',1)[0].split('#',1)[0])
          manifest_match=re.search(r'<link[^>]+rel=["\']manifest["\'][^>]+href=["\']([^"\']+)',html,re.I)
          if manifest_match and manifest_match.group(1).startswith('/'):
              paths.add(manifest_match.group(1).split('?',1)[0])
          Path(sys.argv[2]).write_text('\n'.join(sorted(p for p in paths if p and p!='/'))+'\n')
          PY
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            target="$PUBLIC/${path#/}"
            mkdir -p "$(dirname "$target")"
            code="$(curl --location --retry 3 --silent --show-error -w '%{http_code}' -o "$target" "$BASE$path?mirror=$GITHUB_RUN_ID")"
            if [ "$code" != '200' ]; then
              rm -f "$target"
              echo "Skipping unavailable live asset $path ($code)"
              continue
            fi
            if [[ "$path" != *.html && "$path" != '/' ]] && head -c 80 "$target" | grep -qi '<!doctype html'; then
              rm -f "$target"
              echo "Skipping rewrite fallback for $path"
            fi
          done < "$RUNNER_TEMP/asset-list.txt"
          # Manifest icons may not be directly referenced by index.
          if [ -s "$PUBLIC/manifest.webmanifest" ]; then
            python3 - "$PUBLIC/manifest.webmanifest" "$RUNNER_TEMP/manifest-assets.txt" <<'PY'
          import json,sys
          from pathlib import Path
          try: data=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          except Exception: data={}
          paths=[]
          for icon in data.get('icons',[]):
              src=str(icon.get('src',''))
              if src.startswith('/'): paths.append(src.split('?',1)[0])
          Path(sys.argv[2]).write_text('\n'.join(sorted(set(paths)))+'\n')
          PY
            while IFS= read -r path; do
              [ -n "$path" ] || continue
              target="$PUBLIC/${path#/}"
              [ -s "$target" ] && continue
              mkdir -p "$(dirname "$target")"
              curl --fail --location --retry 3 "$BASE$path?mirror=$GITHUB_RUN_ID" -o "$target"
            done < "$RUNNER_TEMP/manifest-assets.txt"
          fi
          # The only Hosting file intentionally changed is the messaging service worker.
          cp deployment/jayuminton/v1637-web/firebase-messaging-sw.js "$PUBLIC/firebase-messaging-sw.js"
          grep -F "const sets = String(type || '') === 'court_assignment' ? 5 : 3;" "$PUBLIC/firebase-messaging-sw.js" >/dev/null
          grep -F 'return [650, 220, 650, 220, 650];' "$PUBLIC/firebase-messaging-sw.js" >/dev/null
          cmp "$PUBLIC/index.html" "$RUNNER_TEMP/live-index-before.html"

      - name: Deploy Apps Scripts
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/main-script"
          clasp push --force
          clasp create-deployment --deploymentId "$MAIN_DEPLOYMENT_ID" --description "user alerts 3x3 3x5 $GITHUB_RUN_ID"
          cd "$RUNNER_TEMP/push-script"
          clasp push --force
          clasp create-deployment --deploymentId "$PUSH_DEPLOYMENT_ID" --description "web+android high priority 3x3 3x5 $GITHUB_RUN_ID"

      - name: Deploy Hosting service worker only over mirrored live assets
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/hosting"
          firebase deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive

      - name: Re-pull and verify Apps Script deployments
        shell: bash
        run: |
          set -euo pipefail
          VMAIN="$RUNNER_TEMP/verify-main"; VPUSH="$RUNNER_TEMP/verify-push"
          mkdir -p "$VMAIN" "$VPUSH"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$MAIN_SCRIPT_ID" > "$VMAIN/.clasp.json"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$PUSH_SCRIPT_ID" > "$VPUSH/.clasp.json"
          cd "$VMAIN"; clasp pull
          grep -F "if (type === 'court_assignment') return 5;" Script.html >/dev/null
          grep -F "if (type === 'wait1_ready') return 3;" Script.html >/dev/null
          grep -F '[650, 220, 650, 220, 650]' Script.html >/dev/null
          grep -F 'index * 3500' Script.html >/dev/null
          cd "$VPUSH"; clasp pull
          grep -F "repeatCount: event.type === 'court_assignment' ? '5' : '3'" Code.js >/dev/null
          grep -F "priority: 'high'" Code.js >/dev/null
          grep -F "ttl: '600s'" Code.js >/dev/null

      - name: Verify live Hosting and unchanged design shell
        shell: bash
        run: |
          set -euo pipefail
          BASE="${HOSTING_URL%/}"
          sleep 6
          curl --fail --location --retry 5 -H 'Cache-Control: no-cache' "$BASE/firebase-messaging-sw.js?verify=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/live-sw.js"
          grep -F "const sets = String(type || '') === 'court_assignment' ? 5 : 3;" "$RUNNER_TEMP/live-sw.js" >/dev/null
          grep -F 'return [650, 220, 650, 220, 650];' "$RUNNER_TEMP/live-sw.js" >/dev/null
          curl --fail --location --retry 5 -H 'Cache-Control: no-cache' "$BASE/index.html?verify=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/live-index-after.html"
          cmp "$RUNNER_TEMP/live-index-before.html" "$RUNNER_TEMP/live-index-after.html"
          echo 'Verified: web users wait1=3x3, court=3x5; Android sender high priority; Hosting design shell unchanged.'
