name: Deploy verified user alerts 3x3 3x5

on:
  pull_request:
    branches: [main]
    paths:
      - 'deployment/status/trigger-alert-3x3-3x5.txt'
      - '.github/workflows/deploy-alert-3x3-3x5.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: jayuminton-alert-3x3-3x5
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deploy tools
        run: npm install --global @google/clasp@latest firebase-tools@latest

      - name: Authenticate Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Resolve live projects
        shell: bash
        run: |
          set -euo pipefail
          CONFIG="$RUNNER_TEMP/deploy.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$CONFIG"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          jq -e '.mainScriptId and .mainDeploymentId and .pushScriptId and .pushDeploymentId and .firebaseProjectId and .hostingUrl' "$CONFIG" >/dev/null
          {
            echo "MAIN_SCRIPT_ID=$(jq -r '.mainScriptId' "$CONFIG")"
            echo "MAIN_DEPLOYMENT_ID=$(jq -r '.mainDeploymentId' "$CONFIG")"
            echo "PUSH_SCRIPT_ID=$(jq -r '.pushScriptId' "$CONFIG")"
            echo "PUSH_DEPLOYMENT_ID=$(jq -r '.pushDeploymentId' "$CONFIG")"
            echo "FIREBASE_PROJECT_ID=$(jq -r '.firebaseProjectId' "$CONFIG")"
            echo "HOSTING_URL=$(jq -r '.hostingUrl' "$CONFIG")"
            echo "MAIN_URL=https://script.google.com/macros/s/$(jq -r '.mainDeploymentId' "$CONFIG")/exec"
            echo "PUSH_URL=https://script.google.com/macros/s/$(jq -r '.pushDeploymentId' "$CONFIG")/exec"
          } >> "$GITHUB_ENV"

      - name: Patch and verify live user foreground alert
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/main-script"
          mkdir -p "$WORK"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$MAIN_SCRIPT_ID" > "$WORK/.clasp.json"
          cd "$WORK"
          clasp pull
          cp Style.html "$RUNNER_TEMP/style-before.html"
          cp Index.html "$RUNNER_TEMP/index-before.html"
          python3 "$GITHUB_WORKSPACE/deployment/scripts/patch_alert_3x3_3x5.py" "$WORK"
          cmp Style.html "$RUNNER_TEMP/style-before.html"
          cmp Index.html "$RUNNER_TEMP/index-before.html"
          python3 - <<'PY'
          from pathlib import Path
          s=Path('Script.html').read_text(encoding='utf-8')
          a=s.find('<script>'); b=s.rfind('</script>')
          if a<0 or b<=a: raise SystemExit('Script wrapper missing')
          Path('check.js').write_text(s[a+8:b],encoding='utf-8')
          PY
          node --check check.js
          grep -F "if (type === 'court_assignment') return 5;" Script.html >/dev/null
          grep -F "if (type === 'wait1_ready') return 3;" Script.html >/dev/null
          grep -F '[650, 220, 650, 220, 650]' Script.html >/dev/null
          grep -F 'index * 3500' Script.html >/dev/null

      - name: Patch and verify FCM sender for web and Android
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/push-script"
          mkdir -p "$WORK"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$PUSH_SCRIPT_ID" > "$WORK/.clasp.json"
          cd "$WORK"
          clasp pull
          python3 "$GITHUB_WORKSPACE/deployment/scripts/patch_push_sender_android.py" "$WORK"
          node --check Code.js
          grep -F "repeatCount: event.type === 'court_assignment' ? '5' : '3'" Code.js >/dev/null
          grep -F "priority: 'high'" Code.js >/dev/null
          grep -F "ttl: '600s'" Code.js >/dev/null
          grep -F "Urgency: 'high'" Code.js >/dev/null

      - name: Rebuild the verified hidden PWA push shell without design changes
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/hosting"
          PUBLIC="$ROOT/web-push"
          SRC="deployment/jayuminton/v1637-web"
          mkdir -p "$PUBLIC"
          cp deployment/jayuminton/firebase.json "$ROOT/firebase.json"
          cp "$SRC/index.html" "$PUBLIC/index.html"
          cp "$SRC/setup-v205.css" "$PUBLIC/setup-v205.css"
          cp "$SRC/manifest.webmanifest" "$PUBLIC/manifest.webmanifest"
          cp "$SRC/firebase-messaging-sw.js" "$PUBLIC/firebase-messaging-sw.js"
          cp "$SRC/icon-198.png" "$PUBLIC/icon-198.png"
          cp "$SRC/icon-512.png" "$PUBLIC/icon-512.png"
          cp "$SRC/apple-touch-icon-180.png" "$PUBLIC/apple-touch-icon-180.png"
          cp "$SRC/badge-96.png" "$PUBLIC/badge-96.png"
          cat "$SRC"/setup-v205.js.gz.b64.part-* | tr -d '\r\n' | base64 -d > "$RUNNER_TEMP/setup-v205.js.gz"
          gzip -dc "$RUNNER_TEMP/setup-v205.js.gz" > "$PUBLIC/setup-v205.js"
          python3 - "$SRC/config-v204.template.js" "$PUBLIC" <<'PY'
          from pathlib import Path
          import os,sys
          template=Path(sys.argv[1]).read_text(encoding='utf-8')
          cfg=template.replace('__MEMBER_PAGE_URL__',os.environ['MAIN_URL']).replace('__RELAY_URL__',os.environ['PUSH_URL'])
          root=Path(sys.argv[2])
          for name in ('config-v202.js','config-v203.js','config-v204.js'):
              (root/name).write_text(cfg,encoding='utf-8')
          PY
          node --check "$PUBLIC/setup-v205.js"
          node --check "$PUBLIC/firebase-messaging-sw.js"
          grep -F 'hidden-infrastructure' "$PUBLIC/index.html" >/dev/null
          grep -F '<title>자유민턴 코트현황</title>' "$PUBLIC/index.html" >/dev/null
          grep -F "const sets = String(type || '') === 'court_assignment' ? 5 : 3;" "$PUBLIC/firebase-messaging-sw.js" >/dev/null
          grep -F 'return [650, 220, 650, 220, 650];' "$PUBLIC/firebase-messaging-sw.js" >/dev/null
          grep -F "$MAIN_URL" "$PUBLIC/config-v204.js" >/dev/null
          grep -F "$PUSH_URL" "$PUBLIC/config-v204.js" >/dev/null

      - name: Deploy Apps Scripts
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/main-script"
          clasp push --force
          clasp create-deployment --deploymentId "$MAIN_DEPLOYMENT_ID" --description "user alerts 3x3 3x5 $GITHUB_RUN_ID"
          cd "$RUNNER_TEMP/push-script"
          clasp push --force
          clasp create-deployment --deploymentId "$PUSH_DEPLOYMENT_ID" --description "web+android high priority 3x3 3x5 $GITHUB_RUN_ID"

      - name: Deploy verified PWA push shell
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/hosting"
          firebase deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive

      - name: Re-pull and verify Apps Script deployments
        shell: bash
        run: |
          set -euo pipefail
          VMAIN="$RUNNER_TEMP/verify-main"; VPUSH="$RUNNER_TEMP/verify-push"
          mkdir -p "$VMAIN" "$VPUSH"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$MAIN_SCRIPT_ID" > "$VMAIN/.clasp.json"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$PUSH_SCRIPT_ID" > "$VPUSH/.clasp.json"
          cd "$VMAIN"; clasp pull
          grep -F "if (type === 'court_assignment') return 5;" Script.html >/dev/null
          grep -F "if (type === 'wait1_ready') return 3;" Script.html >/dev/null
          grep -F '[650, 220, 650, 220, 650]' Script.html >/dev/null
          grep -F 'index * 3500' Script.html >/dev/null
          cd "$VPUSH"; clasp pull
          grep -F "repeatCount: event.type === 'court_assignment' ? '5' : '3'" Code.js >/dev/null
          grep -F "priority: 'high'" Code.js >/dev/null
          grep -F "ttl: '600s'" Code.js >/dev/null

      - name: Verify live Hosting service worker and shell title
        shell: bash
        run: |
          set -euo pipefail
          BASE="${HOSTING_URL%/}"
          sleep 6
          curl --fail --location --retry 5 -H 'Cache-Control: no-cache' "$BASE/firebase-messaging-sw.js?verify=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/live-sw.js"
          grep -F "const sets = String(type || '') === 'court_assignment' ? 5 : 3;" "$RUNNER_TEMP/live-sw.js" >/dev/null
          grep -F 'return [650, 220, 650, 220, 650];' "$RUNNER_TEMP/live-sw.js" >/dev/null
          curl --fail --location --retry 5 -H 'Cache-Control: no-cache' "$BASE/?verify=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/live-index.html"
          grep -F '<title>자유민턴 코트현황</title>' "$RUNNER_TEMP/live-index.html" >/dev/null
          grep -F 'hidden-infrastructure' "$RUNNER_TEMP/live-index.html" >/dev/null
          echo 'Verified: web users wait1=3x3, court=3x5; Android sender high priority; user shell remains hidden infrastructure.'
