name: Restore main to last working version
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Known working Apps Script version'
        required: true
        default: '327'
permissions:
  contents: read
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --global @google/clasp@latest
      - name: Restore SAME main deployment ID to selected existing version
        shell: bash
        run: |
          set -euo pipefail
          C="$RUNNER_TEMP/deploy.json"; printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$C"; printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          SCRIPT_ID="$(jq -r '.mainScriptId' "$C")"; MAIN_ID="$(jq -r '.mainDeploymentId' "$C")"; VER='${{ inputs.version }}'
          test -n "$SCRIPT_ID"; test "$SCRIPT_ID" != null; test -n "$MAIN_ID"; test "$MAIN_ID" != null
          W="$RUNNER_TEMP/main"; mkdir -p "$W"; printf '{"scriptId":"%s","rootDir":"."}\n' "$SCRIPT_ID" > "$W/.clasp.json"; cd "$W"
          echo 'BEFORE:'; clasp deployments
          clasp create-deployment --deploymentId "$MAIN_ID" --versionNumber "$VER" --description "EMERGENCY RESTORE known working v$VER $GITHUB_RUN_ID"
          echo 'AFTER:'; clasp deployments
          URL="https://script.google.com/macros/s/$MAIN_ID/exec"; sleep 7
          code=$(curl -L -sS --retry 5 --retry-delay 2 --max-time 60 -o "$RUNNER_TEMP/live.html" -w '%{http_code}' "$URL?mode=user&app=user&restore=$GITHUB_RUN_ID" || true)
          echo "RESTORED_VERSION=$VER HTTP=$code URL=$URL"
          test "$code" = 200
          ! grep -Eqi 'Google Drive|unable to open|파일을 열 수|요청한 파일|Sorry, unable to open' "$RUNNER_TEMP/live.html"
          echo MAIN_RESTORE_COMPLETE
