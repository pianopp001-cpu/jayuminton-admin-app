name: Build admin v202.6 selected member messaging

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-v2015-known-good-shell.yml'
      - 'deployment/jayuminton/cloudflare_v6_frontend_bridge.js'
      - 'deployment/jayuminton/inject_cloudflare_v6_frontend_bridge.py'
      - 'deployment/jayuminton/admin_native_audio_v2021_patch.py'
      - 'deployment/jayuminton/admin_native_vibration_v2023_patch.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore exact v200.5 Android shell with latest v200.8 UI
        shell: bash
        run: |
          set -euo pipefail
          PROVEN_COMMIT=20823018b13bba64082b09b76db617680a9d16b5
          rm -rf app
          git archive "$PROVEN_COMMIT" app | tar -x
          mkdir -p app/src/main/assets/admin
          unzip -p releases/jayuminton-admin-v200.8-webview-js-fixed.apk assets/admin/index.html > app/src/main/assets/admin/index.html
          test -s app/src/main/assets/admin/index.html

      - name: Replace only legacy RPC bridge with direct Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          HTML=app/src/main/assets/admin/index.html
          python3 deployment/jayuminton/inject_cloudflare_v6_frontend_bridge.py "$HTML"
          grep -F 'https://jayuminton-state.pianopp001.workers.dev/api/compat/rpc' "$HTML" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_PIN_INPUT_READY__' "$HTML" >/dev/null
          grep -F "b.removeAttribute('onclick')" "$HTML" >/dev/null
          grep -F "b.addEventListener('click',submit)" "$HTML" >/dev/null
          grep -F '멤버등록·비밀번호·게임횟수·제외인원 관리' "$HTML" >/dev/null
          grep -F "applyMdSelectedStatus('away')" "$HTML" >/dev/null
          grep -F 'id="announcementMuteButton"' "$HTML" >/dev/null
          grep -F 'id="voiceSaveEmergency"' "$HTML" >/dev/null
          grep -F "stopVoiceAnnouncement();" "$HTML" >/dev/null
          grep -F '.admin-save-notice{z-index:2147483600!important;background:' "$HTML" >/dev/null
          grep -F 'backdrop-filter:none!important' "$HTML" >/dev/null
          grep -F "if(locked)app.setAttribute('inert','')" "$HTML" >/dev/null
          grep -F "result.reason='muted';result.engine='muted'" "$HTML" >/dev/null
          grep -F 'id="newIsDuplicate"' "$HTML" >/dev/null
          grep -F 'window.setMdSelectedTeam=function()' "$HTML" >/dev/null
          grep -F '>코트배정대기</button>' "$HTML" >/dev/null
          grep -F '>같은 팀</button>' "$HTML" >/dev/null
          grep -F 'id="quickMemberMessageButton"' "$HTML" >/dev/null
          grep -F 'window.sendQuickMemberMessage=async function()' "$HTML" >/dev/null
          ! grep -F 'id="newTeam"' "$HTML" >/dev/null
          grep -F 'function usesAdminFullName(member)' "$HTML" >/dev/null
          grep -F "event.target.closest('#voiceSaveEmergency')" "$HTML" >/dev/null
          ! grep -F '아이콘 · 신규' "$HTML" >/dev/null
          ! grep -F '아이콘 · 찬조' "$HTML" >/dev/null
          grep -F 'filter:none!important;backdrop-filter:none!important' "$HTML" >/dev/null
          test "$(grep -o 'id=\"newIsNew\"' "$HTML" | wc -l)" -eq 1
          ! grep -F 'id="mdIsNew"' "$HTML" >/dev/null
          grep -F '경기통계' "$HTML" >/dev/null
          grep -F '빠른 코트배정' "$HTML" >/dev/null
          grep -F '코트배정 제외' "$HTML" >/dev/null
          grep -F 'autoFillWaitGroup' "$HTML" >/dev/null
          grep -F 'assignWaitGroupToCourt' "$HTML" >/dev/null
          grep -F '게임횟수 카운트 조정' "$HTML" >/dev/null
          grep -F 'if (el.textContent !== nextText) el.textContent = nextText;' "$HTML" >/dev/null
          ! grep -F 'script.google.com' "$HTML" >/dev/null
          ! grep -F 'jayuminton-admin-rpc.pianopp001.workers.dev' "$HTML" >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html = Path('app/src/main/assets/admin/index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S|re.I)
          for i, js in enumerate(blocks):
              if not js.strip():
                  continue
              p = Path(tempfile.gettempdir()) / f'v2015-inline-{i}.js'
              p.write_text(js, encoding='utf-8')
              subprocess.run(['node', '--check', str(p)], check=True)
          print('INLINE_JS_SYNTAX_OK', len(blocks))
          PY

      - name: Set v202.6 identity and sanitize native status text
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          java = Path('app/src/main/java/com/jayuminton/admin/MainActivity.java')
          s = java.read_text(encoding='utf-8')
          s, n = re.subn(r'private static final String ADMIN_URL =\s*\n?\s*"[^"]+";',
                         'private static final String ADMIN_URL =\n            "file:///android_asset/admin/index.html?app=admin&native=1&appVersion=202.6";', s, count=1)
          if n != 1: raise SystemExit('ADMIN_URL replacement failed')
          s, n = re.subn(r'private static final String APK_WEB_BUILD = "[^"]+";',
                         'private static final String APK_WEB_BUILD = "2026-selected-member-message-alert";', s, count=1)
          if n != 1: raise SystemExit('APK_WEB_BUILD replacement failed')
          s = re.sub(r'JayumintonNative/[0-9.]+ CloudflareAdmin/[0-9]+',
                     'JayumintonNative/202.6 CloudflareAdmin/2026', s, count=1)
          # Never display a bundled file:// URL (or another raw URL) in a native
          # loading/saving status message. URLs remain internal to WebView.
          old = 'adminLoadMessage.setText(message);'
          new = '''String safeMessage = message == null ? "처리 중입니다." : message;
            if (safeMessage.contains("file:/") || safeMessage.contains("://")) {
                safeMessage = "처리 중입니다.";
            }
            adminLoadMessage.setText(safeMessage);'''
          if s.count(old) != 1: raise SystemExit('native status text anchor mismatch')
          s = s.replace(old, new, 1)
          page_finished = r'(\s+@Override\s+public void onPageFinished\(WebView view, String url\) \{)'
          page_commit = '''
            @Override
            public void onPageCommitVisible(WebView view, String url) {
                super.onPageCommitVisible(view, url);
                // The administrator page is a bundled local asset. Once its first
                // frame is committed, never let a delayed JS callback cover it.
                view.postDelayed(() -> adminLoadPanel.setVisibility(View.GONE), 350);
            }

            @Override
            public void onPageFinished(WebView view, String url) {'''
          s, n = re.subn(page_finished, page_commit, s, count=1)
          if n != 1: raise SystemExit('onPageFinished insertion point missing')
          java.write_text(s, encoding='utf-8')
          gradle = Path('app/build.gradle')
          g = gradle.read_text(encoding='utf-8')
          g = re.sub(r'versionCode\s+\d+', 'versionCode 2026', g, count=1)
          g = re.sub(r"versionName\s+['\"][^'\"]+['\"]", "versionName '202.6'", g, count=1)
          gradle.write_text(g, encoding='utf-8')
          PY
          python3 deployment/jayuminton/admin_native_audio_v2021_patch.py
          python3 deployment/jayuminton/admin_native_vibration_v2023_patch.py
          grep -F 'int levelSix = Math.max(1, Math.min(MEDIA_DUCK_VOLUME_STEP, maxMedia));' app/src/main/java/com/jayuminton/admin/MainActivity.java >/dev/null
          grep -F 'Math.min(originalMediaVolume, levelSix)' app/src/main/java/com/jayuminton/admin/MainActivity.java >/dev/null
          grep -F 'new MemberAlertBridge(), "NativeMemberAlert"' app/src/main/java/com/jayuminton/admin/MainActivity.java >/dev/null
          grep -F 'VibrationEffect.createWaveform(pattern, -1)' app/src/main/java/com/jayuminton/admin/MainActivity.java >/dev/null
          grep -F 'safeMessage.contains("file:/")' app/src/main/java/com/jayuminton/admin/MainActivity.java >/dev/null
          ! grep -R -F 'onRenderProcessGone' app/src/main/java app/src/main/AndroidManifest.xml >/dev/null
          ! grep -R -F 'LAYER_TYPE_SOFTWARE' app/src/main/java app/src/main/AndroidManifest.xml >/dev/null
          ! grep -R -F 'android:hardwareAccelerated="false"' app/src/main/AndroidManifest.xml >/dev/null

      - name: Restore icon and release signer
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode app/src/main/res/drawable/icon_from_library.b64 > app/src/main/res/drawable/icon.png
          rm -f app/src/main/res/drawable/icon_from_library.b64
          base64 --decode signing/jayuminton-release.keystore.b64 > signing/jayuminton-release.jks
          test -s signing/jayuminton-release.jks

      - name: Build and verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleRelease
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          unzip -p "$APK" assets/admin/index.html > "$RUNNER_TEMP/apk-admin.html"
          grep -F 'https://jayuminton-state.pianopp001.workers.dev/api/compat/rpc' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          ! grep -F 'script.google.com' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          ! grep -F 'jayuminton-admin-rpc.pianopp001.workers.dev' "$RUNNER_TEMP/apk-admin.html" >/dev/null

      - name: Publish v202.6 selected-member-message APK
        shell: bash
        run: |
          set -euo pipefail
          APK_TMP="$RUNNER_TEMP/jayuminton-admin-v202.6-member-message-alert.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK_TMP"
          SHA=$(sha256sum "$APK_TMP" | awk '{print $1}')
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            mkdir -p releases deployment/status
            cp "$APK_TMP" releases/jayuminton-admin-v202.6-member-message-alert.apk
            printf 'status=success\nversion=202.6\nrun_id=%s\nsha256=%s\nbuild=selected-member-message-user-popup-confirm-stops-vibration\n' "$GITHUB_RUN_ID" "$SHA" > deployment/status/v2026-member-message-alert.txt
            git add releases/jayuminton-admin-v202.6-member-message-alert.apk deployment/status/v2026-member-message-alert.txt
            git commit -m 'Publish admin v202.6 member message alert APK' || true
            if git push origin HEAD:main; then
              echo "V2015_PUBLISH_OK sha256=$SHA"
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Report v202.6 build failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          mkdir -p deployment/status
          printf 'status=failure\nversion=202.6\nrun_id=%s\nsha256=%s\nbuild=selected-member-message-user-popup-confirm-stops-vibration\n' "$GITHUB_RUN_ID" "" > deployment/status/v2026-member-message-alert.txt
          git add deployment/status/v2026-member-message-alert.txt
          git commit -m 'Record admin v202.6 build failure' || true
          git push origin HEAD:main
