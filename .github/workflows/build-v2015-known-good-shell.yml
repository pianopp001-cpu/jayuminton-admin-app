name: Build admin v203.2 attendance statistics

on:
  push:
    branches: [main]
    paths:
      - 'deployment/jayuminton/admin_attendance_statistics_patch.py'
      - '.github/workflows/build-v2015-known-good-shell.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: jayuminton-attendance-admin-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Prepare and verify current admin interaction contract
        shell: bash
        run: |
          set -euo pipefail
          node cloudflare/state-worker/temp-pairs.test.mjs
          node deployment/jayuminton/admin_multiaction_v2067.test.mjs
          grep -F '__JAYUMINTON_ADMIN_FREE_2_TO_4_V2069__' deployment/jayuminton/admin_card_interaction_v2042.js >/dev/null
      - name: Restore proven shell
        shell: bash
        run: |
          set -euo pipefail
          PROVEN_COMMIT=20823018b13bba64082b09b76db617680a9d16b5
          rm -rf app
          git archive "$PROVEN_COMMIT" app | tar -x
          mkdir -p app/src/main/assets/admin
          unzip -p releases/jayuminton-admin-v200.8-webview-js-fixed.apk assets/admin/index.html > app/src/main/assets/admin/index.html
          test -s app/src/main/assets/admin/index.html
      - name: Inject and verify current admin with attendance statistics
        shell: bash
        run: |
          set -euo pipefail
          HTML=app/src/main/assets/admin/index.html
          python3 deployment/jayuminton/patch_bridge_admin_multiselect_v2048.py
          python3 deployment/jayuminton/inject_cloudflare_v6_frontend_bridge.py "$HTML"
          node deployment/jayuminton/admin_team_layout_v2064.test.mjs
          python3 deployment/jayuminton/admin_native_audio_v2021_patch.py
          python3 deployment/jayuminton/admin_native_vibration_v2023_patch.py
          python3 deployment/jayuminton/force_cloudflare_admin_login_v2050.py
          python3 deployment/jayuminton/patch_admin_pair_notice_v1.py "$HTML"
          python3 deployment/jayuminton/admin_attendance_statistics_patch.py "$HTML"
          grep -F '__JAYUMINTON_ADMIN_FREE_2_TO_4_V2069__' "$HTML" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_MULTI_ACTION_V2053__' "$HTML" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_FAST_MULTI_MOVE_V2067__' "$HTML" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_DIRECT_CLOUDFLARE_LOGIN_V2050__' "$HTML" >/dev/null
          grep -F 'JAYUMINTON_ADMIN_PAIR_NOTICE_V1' "$HTML" >/dev/null
          grep -F 'JAYUMINTON_ADMIN_ATTENDANCE_STATS_V1' "$HTML" >/dev/null
          grep -F '도착: ' "$HTML" >/dev/null
          grep -F '귀가: ' "$HTML" >/dev/null
          grep -F '총 게임 ' "$HTML" >/dev/null
          grep -F '함께 경기:' "$HTML" >/dev/null
          grep -F "timeZone:'Asia/Seoul'" "$HTML" >/dev/null
          grep -F 'jayuminton-state.pianopp001.workers.dev/api/compat/rpc' "$HTML" >/dev/null
          ! grep -F 'window.confirm(' deployment/jayuminton/admin_card_interaction_v2042.js >/dev/null
          ! grep -F 'script.google.com' "$HTML" >/dev/null
      - name: Set APK identity and signer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          java=Path('app/src/main/java/com/jayuminton/admin/MainActivity.java')
          s=java.read_text(encoding='utf-8')
          s,n=re.subn(r'private static final String ADMIN_URL =\s*\n?\s*"[^"]+";', 'private static final String ADMIN_URL =\n            "file:///android_asset/admin/index.html?app=admin&native=1&appVersion=203.2";',s,count=1)
          if n!=1: raise SystemExit('ADMIN_URL replacement failed')
          java.write_text(s,encoding='utf-8')
          gradle=Path('app/build.gradle')
          g=gradle.read_text(encoding='utf-8')
          g=re.sub(r'versionCode\s+\d+','versionCode 2032',g,count=1)
          g=re.sub(r"versionName\s+['\"][^'\"]+['\"]","versionName '203.2'",g,count=1)
          gradle.write_text(g,encoding='utf-8')
          PY
          base64 --decode app/src/main/res/drawable/icon_from_library.b64 > app/src/main/res/drawable/icon.png
          rm -f app/src/main/res/drawable/icon_from_library.b64
          base64 --decode signing/jayuminton-release.keystore.b64 > signing/jayuminton-release.jks
      - name: Build verify publish
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleRelease
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          unzip -p "$APK" assets/admin/index.html > "$RUNNER_TEMP/apk-admin.html"
          grep -F '__JAYUMINTON_ADMIN_FREE_2_TO_4_V2069__' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_FAST_MULTI_MOVE_V2067__' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_DIRECT_CLOUDFLARE_LOGIN_V2050__' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F 'JAYUMINTON_ADMIN_PAIR_NOTICE_V1' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F 'JAYUMINTON_ADMIN_ATTENDANCE_STATS_V1' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F '도착: ' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F '귀가: ' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F '총 게임 ' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F '함께 경기:' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F "timeZone:'Asia/Seoul'" "$RUNNER_TEMP/apk-admin.html" >/dev/null
          ! grep -F 'script.google.com' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          mkdir -p releases deployment/status
          cp "$APK" releases/jayuminton-admin-v203.2-attendance-statistics.apk
          printf 'status=success\nversion=203.2\nrun_id=%s\nsha256=%s\nbuild=current-cloudflare-admin-attendance-statistics\nattendance=before-to-active\ndeparture=active-assignment-pool-to-away\nstats=games-partners-arrival-departure\ntimezone=Asia/Seoul\n' "$GITHUB_RUN_ID" "$SHA" > deployment/status/v2032-attendance-statistics.txt
          git add releases/jayuminton-admin-v203.2-attendance-statistics.apk deployment/status/v2032-attendance-statistics.txt
          git commit -m 'Publish admin v203.2 attendance statistics APK' || exit 0
          git push origin HEAD:main
