name: Build admin v201.5 from proven v200.5 shell

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-v2015-known-good-shell.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore exact v200.5 Android shell and HTML
        shell: bash
        run: |
          set -euo pipefail
          PROVEN_COMMIT=20823018b13bba64082b09b76db617680a9d16b5
          rm -rf app
          git archive "$PROVEN_COMMIT" app | tar -x
          mkdir -p app/src/main/assets/admin
          unzip -p releases/jayuminton-admin-v200.5-md-final.apk assets/admin/index.html > app/src/main/assets/admin/index.html
          test -s app/src/main/assets/admin/index.html

      - name: Replace only legacy RPC bridge with direct Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          HTML=app/src/main/assets/admin/index.html
          python3 deployment/jayuminton/inject_cloudflare_v6_frontend_bridge.py "$HTML"
          grep -F 'https://jayuminton-state.pianopp001.workers.dev/api/compat/rpc' "$HTML" >/dev/null
          ! grep -F 'script.google.com' "$HTML" >/dev/null
          ! grep -F 'jayuminton-admin-rpc.pianopp001.workers.dev' "$HTML" >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html = Path('app/src/main/assets/admin/index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S|re.I)
          for i, js in enumerate(blocks):
              if not js.strip():
                  continue
              p = Path(tempfile.gettempdir()) / f'v2015-inline-{i}.js'
              p.write_text(js, encoding='utf-8')
              subprocess.run(['node', '--check', str(p)], check=True)
          print('INLINE_JS_SYNTAX_OK', len(blocks))
          PY

      - name: Set v201.5 identity only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          java = Path('app/src/main/java/com/jayuminton/admin/MainActivity.java')
          s = java.read_text(encoding='utf-8')
          s, n = re.subn(r'private static final String ADMIN_URL =\s*\n?\s*"[^"]+";',
                         'private static final String ADMIN_URL =\n            "file:///android_asset/admin/index.html?app=admin&native=1&appVersion=201.5";', s, count=1)
          if n != 1: raise SystemExit('ADMIN_URL replacement failed')
          s, n = re.subn(r'private static final String APK_WEB_BUILD = "[^"]+";',
                         'private static final String APK_WEB_BUILD = "2015-proven-shell-cloudflare-direct";', s, count=1)
          if n != 1: raise SystemExit('APK_WEB_BUILD replacement failed')
          s = re.sub(r'JayumintonNative/[0-9.]+ CloudflareAdmin/[0-9]+',
                     'JayumintonNative/201.5 CloudflareAdmin/2015', s, count=1)
          java.write_text(s, encoding='utf-8')
          gradle = Path('app/build.gradle')
          g = gradle.read_text(encoding='utf-8')
          g = re.sub(r'versionCode\s+\d+', 'versionCode 2015', g, count=1)
          g = re.sub(r"versionName\s+['\"][^'\"]+['\"]", "versionName '201.5'", g, count=1)
          gradle.write_text(g, encoding='utf-8')
          PY
          ! grep -R -F 'onRenderProcessGone' app/src/main/java app/src/main/AndroidManifest.xml >/dev/null
          ! grep -R -F 'LAYER_TYPE_SOFTWARE' app/src/main/java app/src/main/AndroidManifest.xml >/dev/null
          ! grep -R -F 'android:hardwareAccelerated="false"' app/src/main/AndroidManifest.xml >/dev/null

      - name: Restore icon and release signer
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode app/src/main/res/drawable/icon_from_library.b64 > app/src/main/res/drawable/icon.png
          rm -f app/src/main/res/drawable/icon_from_library.b64
          base64 --decode signing/jayuminton-release.keystore.b64 > signing/jayuminton-release.jks
          test -s signing/jayuminton-release.jks

      - name: Build and verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleRelease
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          unzip -p "$APK" assets/admin/index.html > "$RUNNER_TEMP/apk-admin.html"
          grep -F 'https://jayuminton-state.pianopp001.workers.dev/api/compat/rpc' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          ! grep -F 'script.google.com' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          ! grep -F 'jayuminton-admin-rpc.pianopp001.workers.dev' "$RUNNER_TEMP/apk-admin.html" >/dev/null

      - name: Publish v201.5 proven-shell APK
        shell: bash
        run: |
          set -euo pipefail
          APK_TMP="$RUNNER_TEMP/jayuminton-admin-v201.5-proven-shell.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK_TMP"
          SHA=$(sha256sum "$APK_TMP" | awk '{print $1}')
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            mkdir -p releases deployment/status
            cp "$APK_TMP" releases/jayuminton-admin-v201.5-proven-shell.apk
            printf 'status=success\nversion=201.5\nrun_id=%s\nsha256=%s\nbuild=exact-v2005-shell-cloudflare-direct-no-gas\n' "$GITHUB_RUN_ID" "$SHA" > deployment/status/v2015-proven-shell.txt
            git add releases/jayuminton-admin-v201.5-proven-shell.apk deployment/status/v2015-proven-shell.txt
            git commit -m 'Publish admin v201.5 proven shell APK' || true
            if git push origin HEAD:main; then
              echo "V2015_PUBLISH_OK sha256=$SHA"
              exit 0
            fi
            sleep 2
          done
          exit 1
