name: Fix wait4 slot2 worker state

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-wait4-slot2-worker.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch stale occupancy
        run: node deployment/jayuminton/repair_wait4_slot2_worker.mjs
      - name: Verify repair
        run: |
          grep -F 'validMemberIds' cloudflare/state-worker/worker.js
          grep -F '!validMemberIds.has(id) || occupied.has(id)' cloudflare/state-worker/worker.js
      - name: Run worker tests
        run: node cloudflare/state-worker/temp-pairs.test.mjs
      - name: Commit worker repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/state-worker/worker.js
          git commit -m 'fix: drop stale IDs blocking wait4 slot2'
          git push origin HEAD:main
