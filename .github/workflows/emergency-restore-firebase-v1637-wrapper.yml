name: Emergency restore Firebase v1.6.37 wrapper

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emergency-restore-firebase-v1637-wrapper.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emergency-restore-firebase-v1637-wrapper
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      MEMBER_URL: https://script.google.com/macros/s/AKfycbzYRVItaMK0WOFfo0sCnxmuKR8p3mZHwYYTXos4jeLUmIzR-S211NtfQCcdzNtTJz138w/exec
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global firebase-tools@latest
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      - name: Build known-good wrapper from repository sources
        shell: bash
        run: |
          set -euo pipefail
          CONFIG="$RUNNER_TEMP/deploy.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$CONFIG"
          FIREBASE_PROJECT_ID="$(jq -r '.firebaseProjectId' "$CONFIG")"
          HOSTING_URL="$(jq -r '.hostingUrl' "$CONFIG")"
          PUSH_URL="https://script.google.com/macros/s/$(jq -r '.pushDeploymentId' "$CONFIG")/exec"
          test -n "$FIREBASE_PROJECT_ID"
          test -n "$HOSTING_URL"
          test -n "$PUSH_URL"
          BUILD="$RUNNER_TEMP/v1637-firebase"
          rm -rf "$BUILD" && mkdir -p "$BUILD/web-push"
          cp deployment/jayuminton/firebase.json "$BUILD/firebase.json"
          cp deployment/jayuminton/exact-v1637-web/index.html "$BUILD/web-push/index.html"
          cp deployment/jayuminton/exact-v1637-web/setup-v205.css "$BUILD/web-push/setup-v205.css"
          cat deployment/jayuminton/exact-v1637-web/setup-v205.js.part-* > "$BUILD/web-push/setup-v205.js"
          cp deployment/jayuminton/exact-v1637-web/config-v204.js "$BUILD/web-push/config-v204.js"
          cp deployment/jayuminton/exact-v1637-web/manifest.webmanifest "$BUILD/web-push/manifest.webmanifest"
          cp deployment/jayuminton/exact-v1637-web/firebase-messaging-sw.js "$BUILD/web-push/firebase-messaging-sw.js"
          node --check "$BUILD/web-push/setup-v205.js"
          grep -q '^window.JAYUMINTON_PUSH_SETUP_CONFIG' "$BUILD/web-push/config-v204.js"
          python3 - "$BUILD/web-push/config-v204.js" "$MEMBER_URL" "$PUSH_URL" <<'PY'
          import sys
          from pathlib import Path
          p=Path(sys.argv[1]); member=sys.argv[2]; relay=sys.argv[3]
          s=p.read_text(encoding='utf-8').replace('__MEMBER_PAGE_URL__', member).replace('__RELAY_URL__', relay)
          if '__MEMBER_PAGE_URL__' in s or '__RELAY_URL__' in s: raise SystemExit('URL replacement failed')
          p.write_text(s,encoding='utf-8')
          PY
          grep -F "$MEMBER_URL" "$BUILD/web-push/config-v204.js"
          # Decode repository-owned icon and reuse it for all required icon paths to avoid SPA rewrite corruption.
          tr -d '\r\n' < deployment/jayuminton/exact-v1637-icons/icon-198.png.b64 | base64 -d > "$BUILD/web-push/icon-198.png"
          cp "$BUILD/web-push/icon-198.png" "$BUILD/web-push/icon-512.png"
          cp "$BUILD/web-push/icon-198.png" "$BUILD/web-push/apple-touch-icon-180.png"
          cp "$BUILD/web-push/icon-198.png" "$BUILD/web-push/badge-96.png"
          file "$BUILD/web-push/icon-198.png" | grep -qi png
          cd "$BUILD"
          firebase deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive --message "emergency known-good wrapper ${GITHUB_SHA::7}"
          sleep 5
          BASE="${HOSTING_URL%/}"
          curl --fail --location -H 'Cache-Control: no-cache' "$BASE/setup-v205.js?verify=$GITHUB_RUN_ID" -o /tmp/live-setup.js
          curl --fail --location -H 'Cache-Control: no-cache' "$BASE/config-v204.js?verify=$GITHUB_RUN_ID" -o /tmp/live-config.js
          curl --fail --location -H 'Cache-Control: no-cache' "$BASE/?verify=$GITHUB_RUN_ID" -o /tmp/live-index.html
          node --check /tmp/live-setup.js
          grep -F "$MEMBER_URL" /tmp/live-config.js
          grep -F 'setup-v205.js' /tmp/live-index.html
          ! grep -qi '<!doctype html' /tmp/live-setup.js
          echo 'known-good wrapper live verification passed'
