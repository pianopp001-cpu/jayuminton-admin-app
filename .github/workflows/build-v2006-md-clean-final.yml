name: Build MD-only clean admin v200.6 APK
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}

      - name: Verify Cloudflare state transitions before APK build
        shell: bash
        run: |
          set -euo pipefail
          node cloudflare/state-worker/worker.test.mjs
          grep -F "result = finishCourtMutation(current, body.courtNo)" cloudflare/state-worker/worker.js >/dev/null
          grep -F "publishAssignmentTransitions(this.env, current, saved, result.event)" cloudflare/state-worker/worker.js >/dev/null
          grep -F "sendPush(env, 'court_assignment'" cloudflare/state-worker/worker.js >/dev/null
          grep -F "sendPush(env, 'wait1_ready'" cloudflare/state-worker/worker.js >/dev/null
          grep -F "addGames(state, entrants, 1)" cloudflare/state-worker/worker.js >/dev/null

      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.7'}

      - name: Prepare strict MD-only Cloudflare admin HTML
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 8 --retry-delay 2 "https://jayuminton-push--admin-cloudflare-vnext-z3bgvi2g.web.app/?v2006=${GITHUB_RUN_ID}" -o "$RUNNER_TEMP/admin.html"
          python3 deployment/jayuminton/admin_cloudflare_post_contract_patch.py "$RUNNER_TEMP/admin.html"
          python3 deployment/jayuminton/admin_top_controls_final_patch.py "$RUNNER_TEMP/admin.html"
          python3 deployment/jayuminton/admin_md_final_form_patch.py "$RUNNER_TEMP/admin.html"
          python3 deployment/jayuminton/admin_md_ui_cleanup_patch.py "$RUNNER_TEMP/admin.html"
          grep -F '__JAYUMINTON_ADMIN_BOTTOM_CONTROLS_FIXED_V3__' "$RUNNER_TEMP/admin.html" >/dev/null
          grep -F 'position:fixed!important' "$RUNNER_TEMP/admin.html" >/dev/null
          grep -F 'bottom:0!important' "$RUNNER_TEMP/admin.html" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_MD_UI_CLEANUP_V4__' "$RUNNER_TEMP/admin.html" >/dev/null
          if grep -F 'script.google.com' "$RUNNER_TEMP/admin.html" >/dev/null; then
            echo 'GAS dependency survived in Cloudflare admin HTML' >&2
            exit 1
          fi
          mkdir -p app/src/main/assets/admin
          cp "$RUNNER_TEMP/admin.html" app/src/main/assets/admin/index.html

      - name: Prepare v200.6 native shell
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          java=Path('app/src/main/java/com/jayuminton/admin/MainActivity.java')
          s=java.read_text(encoding='utf-8')
          s,n=re.subn(r'private static final String ADMIN_URL =\s*\n?\s*"[^"]+";', 'private static final String ADMIN_URL =\n            "file:///android_asset/admin/index.html?app=admin&native=1&appVersion=200.6";', s, count=1)
          if n!=1: raise SystemExit('ADMIN_URL replacement failed')
          s,n=re.subn(r'private static final String APK_WEB_BUILD = "[^"]+";', 'private static final String APK_WEB_BUILD = "2006-md4-cloudflare-audited";', s, count=1)
          if n!=1: raise SystemExit('APK_WEB_BUILD replacement failed')
          s=re.sub(r'JayumintonNative/[0-9.]+ CloudflareAdmin/[0-9]+','JayumintonNative/200.6 CloudflareAdmin/2006',s,count=1)
          java.write_text(s,encoding='utf-8')
          gradle=Path('app/build.gradle')
          g=gradle.read_text(encoding='utf-8')
          g=re.sub(r"applicationId\s+['\"][^'\"]+['\"]", "applicationId 'com.jayuminton.admin'", g, count=1)
          g=re.sub(r'versionCode\s+\d+', 'versionCode 2006', g, count=1)
          g=re.sub(r"versionName\s+['\"][^'\"]+['\"]", "versionName '200.6'", g, count=1)
          gradle.write_text(g,encoding='utf-8')
          PY

      - name: Restore signer and icon
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode app/src/main/res/drawable/icon_from_library.b64 > app/src/main/res/drawable/icon.png
          rm -f app/src/main/res/drawable/icon_from_library.b64
          mkdir -p signing
          base64 --decode signing/jayuminton-release.keystore.b64 > signing/jayuminton-release.jks

      - name: Build signed APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify MD4 Cloudflare APK contract
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          unzip -p "$APK" assets/admin/index.html > "$RUNNER_TEMP/apk-admin.html"
          grep -F '__JAYUMINTON_ADMIN_BOTTOM_CONTROLS_FIXED_V3__' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F 'position:fixed!important' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F 'bottom:0!important' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          if grep -F 'script.google.com' "$RUNNER_TEMP/apk-admin.html" >/dev/null; then exit 1; fi

      - name: Publish audited v200.6
        shell: bash
        run: |
          set -euo pipefail
          APK_TMP="$RUNNER_TEMP/jayuminton-admin-v200.6-md4-cloudflare-audited.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK_TMP"
          SHA=$(sha256sum "$APK_TMP" | awk '{print $1}')
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            mkdir -p releases deployment/status
            cp "$APK_TMP" releases/jayuminton-admin-v200.6-md4-cloudflare-audited.apk
            printf 'status=success\nversion=200.6\nrun_id=%s\nsha256=%s\nbuild=md4-cloudflare-audited\n' "$GITHUB_RUN_ID" "$SHA" > deployment/status/v2006-md4-cloudflare-audited.txt
            git add releases/jayuminton-admin-v200.6-md4-cloudflare-audited.apk deployment/status/v2006-md4-cloudflare-audited.txt
            git commit -m 'Publish MD4 Cloudflare-audited Jayuminton admin v200.6 APK' || true
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
