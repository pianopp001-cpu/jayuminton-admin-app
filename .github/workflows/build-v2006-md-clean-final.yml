name: Build MD-only clean admin v200.6 APK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-v2006-md-clean-final.yml'
      - 'deployment/jayuminton/admin_cloudflare_post_contract_patch.py'
      - 'deployment/jayuminton/admin_top_controls_final_patch.py'
      - 'deployment/jayuminton/admin_md_final_form_patch.py'
      - 'deployment/jayuminton/admin_excluded_final_html_patch.py'
      - 'deployment/jayuminton/admin_md_ui_cleanup_patch.py'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.7'}

      - name: Prepare strict MD-only admin HTML
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 8 --retry-delay 2 "https://jayuminton-push--admin-cloudflare-vnext-z3bgvi2g.web.app/?v2006=${GITHUB_RUN_ID}" -o "$RUNNER_TEMP/admin.html"
          python3 deployment/jayuminton/admin_cloudflare_post_contract_patch.py "$RUNNER_TEMP/admin.html"
          python3 deployment/jayuminton/admin_top_controls_final_patch.py "$RUNNER_TEMP/admin.html"
          python3 deployment/jayuminton/admin_md_final_form_patch.py "$RUNNER_TEMP/admin.html"
          python3 deployment/jayuminton/admin_md_ui_cleanup_patch.py "$RUNNER_TEMP/admin.html"
          required=(
            'JAYUMINTON_ADMIN_CLOUDFLARE_FINAL_V1'
            '__JAYUMINTON_ADMIN_BLOCKING_SAVE__'
            '__JAYUMINTON_ADMIN_EMPTY_COURT_FINISH_V1__'
            '__JAYUMINTON_ADMIN_EXCLUDED_ALWAYS_VISIBLE_V1__'
            '__JAYUMINTON_ADMIN_MD_FINAL_FORM_V2__'
            '__JAYUMINTON_ADMIN_MD_UI_CLEANUP_V3__'
            '__JAYUMINTON_ADMIN_BOTTOM_CONTROLS_FIXED_V3__'
            'position:fixed!important'
            'bottom:0!important'
            'data-jm-bottom-controls'
            'md-only-top-actions'
            '>함께 경기통계</button>'
            '>백업 저장</button>'
            '>백업 복원</button>'
            '>전체 초기화</button>'
            'name="mdNewGender"'
            'mdMemberGenderSummary'
            "mdQuickMoveStatus('before')"
            "mdQuickMoveStatus('rest')"
            "mdQuickMoveStatus('away')"
            'onclick="increaseSelectedGames()"'
            'onclick="decreaseSelectedGames()"'
            'onclick="resetSelectedGames()"'
            'id="replayVoiceButton"'
            'id="repeatVoiceButton"'
            'onclick="stopVoiceAnnouncement()"'
            '실행취소'
            '새로고침'
            '자동배정'
          )
          for marker in "${required[@]}"; do
            grep -F "$marker" "$RUNNER_TEMP/admin.html" >/dev/null || { echo "MISSING_MD_ONLY=$marker" >&2; exit 1; }
          done
          forbidden=(
            '음성 테스트' '음성 안내 켜짐' '묶음 지정' '묶음 해제' '오늘의 운영 현황'
            'compact-admin-tools' 'dashboard-shell' 'quick-status-actions' 'quick-search-box' 'quick-filter-row' 'v4-court-action-grid'
            '선택 위치 자동배정' '위치 자동배정' 'id="undoButton"' 'onclick="testVoiceGuide()"' 'onclick="toggleVoiceGuide()"'
          )
          for marker in "${forbidden[@]}"; do
            if grep -F "$marker" "$RUNNER_TEMP/admin.html" >/dev/null; then echo "FORBIDDEN_MD_MENU_SURVIVED=$marker" >&2; exit 1; fi
          done
          TOP_COUNT=$(python3 - "$RUNNER_TEMP/admin.html" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read()
          m=re.search(r'<div\s+class=["\']top-actions md-only-top-actions["\'][^>]*>(.*?)</div>',s,re.S|re.I)
          print(len(re.findall(r'<button\b',m.group(1),re.I)) if m else -1)
          PY
          )
          test "$TOP_COUNT" = 4 || { echo "MANAGEMENT_MENU_COUNT=$TOP_COUNT" >&2; exit 1; }
          mkdir -p app/src/main/assets/admin
          cp "$RUNNER_TEMP/admin.html" app/src/main/assets/admin/index.html

      - name: Prepare v200.6 native shell
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          java=Path('app/src/main/java/com/jayuminton/admin/MainActivity.java')
          s=java.read_text(encoding='utf-8')
          s,n=re.subn(r'private static final String ADMIN_URL =\s*\n?\s*"[^"]+";', 'private static final String ADMIN_URL =\n            "file:///android_asset/admin/index.html?app=admin&native=1&appVersion=200.6";', s, count=1)
          if n!=1: raise SystemExit('ADMIN_URL replacement failed')
          s,n=re.subn(r'private static final String APK_WEB_BUILD = "[^"]+";', 'private static final String APK_WEB_BUILD = "2006-md-clean-final";', s, count=1)
          if n!=1: raise SystemExit('APK_WEB_BUILD replacement failed')
          s=re.sub(r'JayumintonNative/[0-9.]+ CloudflareAdmin/[0-9]+','JayumintonNative/200.6 CloudflareAdmin/2006',s,count=1)
          s=s.replace('int duckedMusic = Math.max(0, Math.min(MEDIA_DUCK_VOLUME_STEP, maxMedia));','int duckedMusic = Math.min(originalMediaVolume, Math.max(0, Math.min(MEDIA_DUCK_VOLUME_STEP, maxMedia)));')
          java.write_text(s,encoding='utf-8')
          gradle=Path('app/build.gradle')
          g=gradle.read_text(encoding='utf-8')
          g=re.sub(r"applicationId\s+['\"][^'\"]+['\"]", "applicationId 'com.jayuminton.admin'", g, count=1)
          g=re.sub(r'versionCode\s+\d+', 'versionCode 2006', g, count=1)
          g=re.sub(r"versionName\s+['\"][^'\"]+['\"]", "versionName '200.6'", g, count=1)
          gradle.write_text(g,encoding='utf-8')
          PY
          grep -F 'VOICE_REPEAT_COUNT = 3' app/src/main/java/com/jayuminton/admin/MainActivity.java >/dev/null
          grep -F 'AUDIOFOCUS_GAIN_TRANSIENT_MAY_DUCK' app/src/main/java/com/jayuminton/admin/MainActivity.java >/dev/null
          grep -F 'setWillPauseWhenDucked(false)' app/src/main/java/com/jayuminton/admin/MainActivity.java >/dev/null

      - name: Restore signer and icon
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode app/src/main/res/drawable/icon_from_library.b64 > app/src/main/res/drawable/icon.png
          rm -f app/src/main/res/drawable/icon_from_library.b64
          mkdir -p signing
          base64 --decode signing/jayuminton-release.keystore.b64 > signing/jayuminton-release.jks
          keytool -list -keystore signing/jayuminton-release.jks -storepass 'JayuMinton14!' -alias jayuminton >/dev/null

      - name: Build signed APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify final APK UI contract
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          unzip -p "$APK" assets/admin/index.html > "$RUNNER_TEMP/apk-admin.html"
          for marker in '__JAYUMINTON_ADMIN_MD_UI_CLEANUP_V3__' '__JAYUMINTON_ADMIN_BOTTOM_CONTROLS_FIXED_V3__' 'position:fixed!important' 'bottom:0!important' 'md-only-top-actions' '>함께 경기통계</button>' '>백업 저장</button>' '>백업 복원</button>' '>전체 초기화</button>' 'name="mdNewGender"' 'mdMemberGenderSummary' '실행취소' '새로고침' '자동배정'; do
            grep -F "$marker" "$RUNNER_TEMP/apk-admin.html" >/dev/null || { echo "MISSING_APK_MD_ONLY=$marker" >&2; exit 1; }
          done
          for marker in '음성 테스트' '음성 안내 켜짐' '오늘의 운영 현황' 'compact-admin-tools' 'dashboard-shell' 'quick-status-actions' 'quick-search-box' 'quick-filter-row' 'v4-court-action-grid' '선택 위치 자동배정' '위치 자동배정'; do
            if grep -F "$marker" "$RUNNER_TEMP/apk-admin.html" >/dev/null; then echo "FORBIDDEN_APK_MENU=$marker" >&2; exit 1; fi
          done

      - name: Publish v200.6
        shell: bash
        run: |
          set -euo pipefail
          APK_TMP="$RUNNER_TEMP/jayuminton-admin-v200.6-md-clean-final.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK_TMP"
          SHA=$(sha256sum "$APK_TMP" | awk '{print $1}')
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            mkdir -p releases deployment/status
            cp "$APK_TMP" releases/jayuminton-admin-v200.6-md-clean-final.apk
            printf 'status=success\nversion=200.6\nrun_id=%s\nsha256=%s\nbuild=md-only-clean-fixed-bottom\n' "$GITHUB_RUN_ID" "$SHA" > deployment/status/v2006-md-clean-final.txt
            git add releases/jayuminton-admin-v200.6-md-clean-final.apk deployment/status/v2006-md-clean-final.txt
            git commit -m 'Publish MD-only clean Jayuminton admin v200.6 APK' || true
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
