name: Build WebView loader fixed admin v200.8 APK
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'cloudflare/state-worker/**'
      - 'deployment/jayuminton/admin_md_member_fields_patch.py'
      - 'deployment/jayuminton/admin_vnext_md_exact_patch.py'
      - 'deployment/jayuminton/apply_admin_vnext_patches.py'
      - 'deployment/jayuminton/inject_cloudflare_v6_frontend_bridge.py'
      - 'deployment/jayuminton/cloudflare_v6_frontend_bridge.js'
      - 'deployment/jayuminton/admin_md_card_timer_patch.py'
      - 'deployment/jayuminton/admin_md_autoassign_slots_patch.py'
      - 'deployment/jayuminton/admin_md_self_alert_html_patch.py'
      - 'deployment/jayuminton/admin_native_self_alert_java_patch.py'
      - 'deployment/jayuminton/admin_multigroup_swap_patch.py'
      - 'deployment/jayuminton/admin_finish_alert_v12_patch.py'
      - 'deployment/jayuminton/admin_native_tts3_patch.py'
      - 'deployment/jayuminton/admin_native_audio_focus_patch.py'
      - '.github/workflows/build-v2006-md-clean-final.yml'
      - 'app/src/main/java/com/jayuminton/admin/MainActivity.java'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}

      - name: Verify Cloudflare state transitions before APK build
        shell: bash
        run: |
          set -euo pipefail
          node cloudflare/state-worker/worker.test.mjs
          node cloudflare/state-worker/md4-autoassign.test.mjs
          node cloudflare/state-worker/md-entry-autoassign.test.mjs
          node cloudflare/state-worker/md-final-entry.test.mjs
          grep -F 'main = "worker-md-final-entry.js"' cloudflare/state-worker/wrangler.toml.template >/dev/null
          grep -F "result = finishCourtMutation(current, body.courtNo)" cloudflare/state-worker/worker.js >/dev/null
          grep -F "publishAssignmentTransitions(this.env, current, saved, result.event)" cloudflare/state-worker/worker.js >/dev/null
          grep -F "sendPush(env, 'court_assignment'" cloudflare/state-worker/worker.js >/dev/null
          grep -F "sendPush(env, 'wait1_ready'" cloudflare/state-worker/worker.js >/dev/null
          grep -F "addGames(state, entrants, 1)" cloudflare/state-worker/worker.js >/dev/null
          grep -F "body.memberIds" cloudflare/state-worker/worker.js >/dev/null
          grep -F "members_deleted" cloudflare/state-worker/worker.js >/dev/null

      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.7'}

      - name: Prepare strict MD-only Cloudflare admin HTML
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$RUNNER_TEMP/admin-source"
          cp -a source-snapshot/current-main "$SOURCE"
          python3 deployment/jayuminton/apply_admin_vnext_patches.py "$SOURCE"
          python3 - "$SOURCE" "$RUNNER_TEMP/admin.html" <<'PY'
          from pathlib import Path
          import sys
          root=Path(sys.argv[1])
          html=(root/'Admin.html').read_text(encoding='utf-8')
          for name in ('Style','Script','MemberSwapClient','MemberSwapAction','MemberControls','MemberSwapInbox'):
              marker="<?!= include('%s'); ?>"%name
              path=root/(name+'.html')
              if marker in html:
                  if not path.exists(): raise SystemExit('missing include: '+name)
                  html=html.replace(marker,path.read_text(encoding='utf-8'))
          if '<?!=' in html: raise SystemExit('unresolved Apps Script template marker')
          Path(sys.argv[2]).write_text(html,encoding='utf-8')
          PY
          python3 deployment/jayuminton/inject_cloudflare_v6_frontend_bridge.py "$RUNNER_TEMP/admin.html"
          # Source snapshots do not contain finishText yet. Install the finish
          # contract before the post-contract verifier rewrites and validates it.
          python3 deployment/jayuminton/admin_finish_alert_v12_patch.py "$RUNNER_TEMP/admin.html"
          python3 deployment/jayuminton/admin_cloudflare_post_contract_patch.py "$RUNNER_TEMP/admin.html"
          python3 deployment/jayuminton/admin_top_controls_final_patch.py "$RUNNER_TEMP/admin.html"
          python3 deployment/jayuminton/admin_md_autoassign_slots_patch.py "$RUNNER_TEMP/admin.html"
          python3 deployment/jayuminton/admin_md_bulk_delete_autosync_patch.py "$RUNNER_TEMP/admin.html"
          python3 deployment/jayuminton/admin_md_card_timer_patch.py "$RUNNER_TEMP/admin.html"
          python3 deployment/jayuminton/admin_md_self_alert_html_patch.py "$RUNNER_TEMP/admin.html"
          python3 deployment/jayuminton/admin_multigroup_swap_patch.py "$RUNNER_TEMP/admin.html"
          grep -F '__JAYUMINTON_ADMIN_BOTTOM_CONTROLS_FIXED_V3__' "$RUNNER_TEMP/admin.html" >/dev/null
          grep -F '__JAYUMINTON_CLOUDFLARE_RPC_V6__' "$RUNNER_TEMP/admin.html" >/dev/null
          grep -F 'jayuminton-admin-multi-card-actions-v2' "$RUNNER_TEMP/admin.html" >/dev/null
          grep -F '>코트배정</button>' "$RUNNER_TEMP/admin.html" >/dev/null
          if grep -E 'script\\.google\\.com|googleusercontent\\.com|firebaseapp\\.com|web\\.app' "$RUNNER_TEMP/admin.html"; then exit 1; fi
          grep -F '__JAYUMINTON_ADMIN_MD_MEMBER_FIELDS_V1__' "$RUNNER_TEMP/admin.html" >/dev/null
          grep -F 'id="mdPublicMemo"' "$RUNNER_TEMP/admin.html" >/dev/null
          grep -F 'id="mdIsNew"' "$RUNNER_TEMP/admin.html" >/dev/null
          grep -F 'id="mdIsSponsor"' "$RUNNER_TEMP/admin.html" >/dev/null
          grep -F "server('getPairStatistics',[ADMIN_PIN_VALUE])" "$RUNNER_TEMP/admin.html" >/dev/null
          grep -F 'position:fixed!important' "$RUNNER_TEMP/admin.html" >/dev/null
          grep -F 'bottom:0!important' "$RUNNER_TEMP/admin.html" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_MD_UI_CLEANUP_V4__' "$RUNNER_TEMP/admin.html" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_MD_AUTOASSIGN_SLOTS_V1__' "$RUNNER_TEMP/admin.html" >/dev/null
          grep -F 'window.smartAssignSelected=async function()' "$RUNNER_TEMP/admin.html" >/dev/null
          grep -F '!occupied.has(String(m.id))' "$RUNNER_TEMP/admin.html" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_BULK_DELETE_AUTOSYNC_V1__' "$RUNNER_TEMP/admin.html" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_MD_CARD_TIMER_V1__' "$RUNNER_TEMP/admin.html" >/dev/null
          grep -F 'JAYUMINTON_ADMIN_SELF_ALERT_HTML_V1' "$RUNNER_TEMP/admin.html" >/dev/null
          grep -F 'adminSelfAlertSettingButton' "$RUNNER_TEMP/admin.html" >/dev/null
          grep -F 'NativeMemberAlert.vibrateThreeByEight' "$RUNNER_TEMP/admin.html" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_MULTIGROUP_SWAP_V1__' "$RUNNER_TEMP/admin.html" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_FINISH_ALERT_V19__' "$RUNNER_TEMP/admin.html" >/dev/null
          grep -F "[text,text,text].join(' ... ')" "$RUNNER_TEMP/admin.html" >/dev/null
          grep -F '선택 멤버 삭제' "$RUNNER_TEMP/admin.html" >/dev/null
          grep -F 'setInterval(autoSyncAdmin,1500)' "$RUNNER_TEMP/admin.html" >/dev/null
          grep -F 'new 신규' "$RUNNER_TEMP/admin.html" >/dev/null
          grep -F '🎁 찬조' "$RUNNER_TEMP/admin.html" >/dev/null
          grep -F "group.length>0&&!STATE.courtStartedAt[no]" "$RUNNER_TEMP/admin.html" >/dev/null
          if grep -F '급수·구력 미입력' "$RUNNER_TEMP/admin.html" >/dev/null; then
            echo 'legacy missing-value label survived' >&2
            exit 1
          fi
          if grep -F 'script.google.com' "$RUNNER_TEMP/admin.html" >/dev/null; then
            echo 'GAS dependency survived in Cloudflare admin HTML' >&2
            exit 1
          fi
          mkdir -p app/src/main/assets/admin
          cp "$RUNNER_TEMP/admin.html" app/src/main/assets/admin/index.html

      - name: Verify every embedded JavaScript block parses
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/admin-scripts"
          python3 - "$RUNNER_TEMP/admin.html" "$RUNNER_TEMP/admin-scripts" <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import sys
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.active=False
                  self.current=[]
                  self.blocks=[]
              def handle_starttag(self, tag, attrs):
                  if tag == 'script':
                      self.active=True
                      self.current=[]
              def handle_data(self, data):
                  if self.active:
                      self.current.append(data)
              def handle_endtag(self, tag):
                  if tag == 'script' and self.active:
                      self.blocks.append(''.join(self.current))
                      self.active=False
          parser=Scripts()
          parser.feed(Path(sys.argv[1]).read_text(encoding='utf-8'))
          output=Path(sys.argv[2])
          for index, block in enumerate(parser.blocks):
              (output / f'{index:03d}.js').write_text(block,encoding='utf-8')
          if not parser.blocks:
              raise SystemExit('no embedded JavaScript found')
          print(f'extracted {len(parser.blocks)} script blocks')
          PY
          for script in "$RUNNER_TEMP"/admin-scripts/*.js; do
            node --check "$script"
          done
          echo 'ALL_EMBEDDED_JAVASCRIPT_PARSE_OK'

      - name: Prepare v200.8 native shell
        shell: bash
        run: |
          set -euo pipefail
          python3 deployment/jayuminton/admin_native_tts3_patch.py app/src/main/java/com/jayuminton/admin/MainActivity.java
          python3 deployment/jayuminton/admin_native_audio_focus_patch.py app/src/main/java/com/jayuminton/admin/MainActivity.java
          python3 deployment/jayuminton/admin_native_self_alert_java_patch.py app/src/main/java/com/jayuminton/admin/MainActivity.java
          python3 - <<'PY'
          from pathlib import Path
          import re
          java=Path('app/src/main/java/com/jayuminton/admin/MainActivity.java')
          s=java.read_text(encoding='utf-8')
          s,n=re.subn(r'private static final String ADMIN_URL =\s*\n?\s*"[^"]+";', 'private static final String ADMIN_URL =\n            "file:///android_asset/admin/index.html?app=admin&native=1&appVersion=200.8";', s, count=1)
          if n!=1: raise SystemExit('ADMIN_URL replacement failed')
          s,n=re.subn(r'private static final String APK_WEB_BUILD = "[^"]+";', 'private static final String APK_WEB_BUILD = "2008-webview-js-fixed";', s, count=1)
          if n!=1: raise SystemExit('APK_WEB_BUILD replacement failed')
          s=re.sub(r'JayumintonNative/[0-9.]+ CloudflareAdmin/[0-9]+','JayumintonNative/200.8 CloudflareAdmin/2008',s,count=1)
          for needle in ('JAYUMINTON_ADMIN_SELF_ALERT_NATIVE_V1','NativeMemberAlert','vibrateThreeByEight()','VOICE_REPEAT_COUNT = 3','AUDIOFOCUS_GAIN_TRANSIENT_MAY_DUCK'):
            if needle not in s: raise SystemExit('native self-alert contract missing: '+needle)
          java.write_text(s,encoding='utf-8')
          gradle=Path('app/build.gradle')
          g=gradle.read_text(encoding='utf-8')
          g=re.sub(r"applicationId\s+['\"][^'\"]+['\"]", "applicationId 'com.jayuminton.admin'", g, count=1)
          g=re.sub(r'versionCode\s+\d+', 'versionCode 2008', g, count=1)
          g=re.sub(r"versionName\s+['\"][^'\"]+['\"]", "versionName '200.8'", g, count=1)
          gradle.write_text(g,encoding='utf-8')
          PY

      - name: Restore signer and icon
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode app/src/main/res/drawable/icon_from_library.b64 > app/src/main/res/drawable/icon.png
          rm -f app/src/main/res/drawable/icon_from_library.b64
          mkdir -p signing
          base64 --decode signing/jayuminton-release.keystore.b64 > signing/jayuminton-release.jks

      - name: Build signed APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify MD5 Cloudflare APK contract
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          unzip -p "$APK" assets/admin/index.html > "$RUNNER_TEMP/apk-admin.html"
          grep -F '__JAYUMINTON_ADMIN_BOTTOM_CONTROLS_FIXED_V3__' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_BULK_DELETE_AUTOSYNC_V1__' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_MD_CARD_TIMER_V1__' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_MD_AUTOASSIGN_SLOTS_V1__' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F 'window.smartAssignSelected=async function()' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F '!occupied.has(String(m.id))' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_MD_MEMBER_FIELDS_V1__' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F 'JAYUMINTON_ADMIN_SELF_ALERT_HTML_V1' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_MULTIGROUP_SWAP_V1__' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F '__JAYUMINTON_ADMIN_FINISH_ALERT_V19__' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F 'adminSelfAlertSettingButton' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F 'id="mdPublicMemo"' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F 'id="mdIsNew"' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F 'id="mdIsSponsor"' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F "server('getPairStatistics',[ADMIN_PIN_VALUE])" "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F '선택 멤버 삭제' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F 'setInterval(autoSyncAdmin,1500)' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F 'new 신규' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          grep -F '🎁 찬조' "$RUNNER_TEMP/apk-admin.html" >/dev/null
          if grep -F '급수·구력 미입력' "$RUNNER_TEMP/apk-admin.html" >/dev/null; then exit 1; fi
          if grep -F 'script.google.com' "$RUNNER_TEMP/apk-admin.html" >/dev/null; then exit 1; fi

      - name: Publish audited v200.8
        shell: bash
        run: |
          set -euo pipefail
          APK_TMP="$RUNNER_TEMP/jayuminton-admin-v200.8-webview-js-fixed.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK_TMP"
          SHA=$(sha256sum "$APK_TMP" | awk '{print $1}')
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            mkdir -p releases deployment/status
            cp "$APK_TMP" releases/jayuminton-admin-v200.8-webview-js-fixed.apk
            printf 'status=success\nversion=200.8\nrun_id=%s\nsha256=%s\nbuild=webview-js-syntax-fixed-cloudflare-audited\n' "$GITHUB_RUN_ID" "$SHA" > deployment/status/v2008-webview-js-fixed.txt
            git add releases/jayuminton-admin-v200.8-webview-js-fixed.apk deployment/status/v2008-webview-js-fixed.txt
            git commit -m 'Publish MD5 Cloudflare-audited Jayuminton admin v200.8 APK' || true
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
