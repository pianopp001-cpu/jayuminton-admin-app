name: Patch final v200.4 top controls before verify
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-v2004-final-top-controls.yml'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - name: Patch final workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/build-v2004-final.yml')
          s=p.read_text(encoding='utf-8')
          needle='''          curl --fail --location --retry 8 --retry-delay 3 "$URL" -o "$RUNNER_TEMP/admin-final.html"\n          for marker in \\\n'''
          repl='''          curl --fail --location --retry 8 --retry-delay 3 "$URL" -o "$RUNNER_TEMP/admin-final.html"\n          python3 deployment/jayuminton/admin_top_controls_final_patch.py "$RUNNER_TEMP/admin-final.html"\n          for marker in \\\n'''
          if 'admin_top_controls_final_patch.py "$RUNNER_TEMP/admin-final.html"' not in s:
              if needle not in s: raise SystemExit('final workflow download anchor missing')
              s=s.replace(needle,repl,1)
          old='''            grep -F "$marker" "$RUNNER_TEMP/admin-final.html" >/dev/null\n'''
          new='''            if ! grep -F "$marker" "$RUNNER_TEMP/admin-final.html" >/dev/null; then echo "MISSING_FINAL_HTML_MARKER=$marker" >&2; exit 1; fi\n'''
          if old in s: s=s.replace(old,new,1)
          old2='''            grep -F "$marker" "$RUNNER_TEMP/apk-admin.html" >/dev/null\n'''
          new2='''            if ! grep -F "$marker" "$RUNNER_TEMP/apk-admin.html" >/dev/null; then echo "MISSING_APK_HTML_MARKER=$marker" >&2; exit 1; fi\n'''
          if old2 in s: s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -F 'admin_top_controls_final_patch.py "$RUNNER_TEMP/admin-final.html"' .github/workflows/build-v2004-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/build-v2004-final.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Apply final top controls patch before v200.4 HTML verification'
          git pull --rebase origin main
          git push origin main
