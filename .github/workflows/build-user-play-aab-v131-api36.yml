name: Build Google Play AAB v1.3.1 API36

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-user-play-aab-v131-api36.yml'
      - 'deployment/scripts/patch_build_user_play_aab_v131_api36.py'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: jayuminton-user-play-aab-v131-api36
  cancel-in-progress: false

jobs:
  build-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      PLAY_UPLOAD_KEYSTORE_B64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_B64 }}
      PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
      PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android API 36 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -111 2>/dev/null | head -1)"
          fi
          test -n "$SDKMANAGER"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0'
          test -f "$ANDROID_SDK_ROOT/platforms/android-36/android.jar"

      - run: npm install --global firebase-tools@latest

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Verify required Play upload-key secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PLAY_UPLOAD_KEYSTORE_B64"
          test -n "$PLAY_UPLOAD_KEY_PASSWORD"
          test -n "$PLAY_UPLOAD_KEY_ALIAS"
          echo 'Play upload-key secrets are present.'

      - name: Resolve current user-app Firebase configuration
        shell: bash
        run: |
          set -euo pipefail
          # jmDropUnusedDeployConfigFieldsV1: mainDeploymentId/pushUrl used to be
          # validated here but are never actually read by anything later in this
          # workflow -- only firebaseProjectId is used (for the `firebase
          # apps:list --project` call below). This is leftover from an older,
          # unrelated deployment script this step's shape was copied from
          # (pushUrl was never added to JAYUMINTON_DEPLOY_CONFIG_JSON, since this
          # AAB build never needed it), and its presence-check was blocking every
          # build with an opaque `set -e` exit and no error text. Only validate
          # the one field this step actually uses.
          C="$RUNNER_TEMP/deploy.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$C"
          FIREBASE_PROJECT_ID="$(jq -r '.firebaseProjectId' "$C")"
          test -n "$FIREBASE_PROJECT_ID"
          test "$FIREBASE_PROJECT_ID" != null
          echo "FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID" >> "$GITHUB_ENV"

          PACKAGE='com.jayuminton.user'
          firebase apps:list ANDROID --project "$FIREBASE_PROJECT_ID" --json > "$RUNNER_TEMP/apps.json"
          APP_ID="$(jq -r --arg pkg "$PACKAGE" '[.. | objects | select(((.packageName? == $pkg) or (.package_name? == $pkg) or (.androidClientInfo?.packageName? == $pkg)) and ((.appId? // .app_id?) != null)) | (.appId? // .app_id?)] | first // empty' "$RUNNER_TEMP/apps.json")"
          test -n "$APP_ID"
          firebase apps:sdkconfig ANDROID "$APP_ID" --project "$FIREBASE_PROJECT_ID" > app/google-services.json
          grep -F 'com.jayuminton.user' app/google-services.json >/dev/null

      - name: Build signed Google Play AAB v1.3.1 targeting API 36
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT='deployment/scripts/build_user_native_push_fresh_v110.sh'

          python3 deployment/scripts/patch_build_user_native_v111.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v112.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v113.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v114.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v115.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v116.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v117.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v118.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v119.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v120_diagnostic.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v121.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v122.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v124_confirmed_overlay.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v126_stop_controller.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v126_raceguard.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v127_member_switch.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v128_repeat_switch.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v129_background_registration.py "$SCRIPT"
          python3 deployment/scripts/patch_user_native_v130_vibration_cap8.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_play_aab_v130.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_play_aab_v131_api36.py "$SCRIPT"
          python3 deployment/scripts/patch_user_native_v132_roster_text.py "$SCRIPT"

          grep -F 'VERSION="1.3.2"' "$SCRIPT" >/dev/null
          grep -F 'VERSION_CODE="132"' "$SCRIPT" >/dev/null
          grep -F 'jmRosterTextFixV1' "$SCRIPT" >/dev/null
          grep -F 'private static final int MAX_GROUPS = 8;' "$SCRIPT" >/dev/null
          grep -F 'compileSdk 36' "$SCRIPT" >/dev/null
          grep -F 'targetSdk 36' "$SCRIPT" >/dev/null
          grep -F "version '8.9.1' apply false" "$SCRIPT" >/dev/null
          grep -F 'gradle --no-daemon clean bundleRelease' "$SCRIPT" >/dev/null
          bash "$SCRIPT"

          AAB='releases/jayuminton-user-play-v1.3.2-code132.aab'
          STATUS='deployment/status/user-play-aab-v1.3.2.txt'
          test -s "$AAB"
          test -s "$STATUS"
          grep -F 'status=success' "$STATUS" >/dev/null
          grep -F 'version=1.3.2' "$STATUS" >/dev/null
          grep -F 'version_code=132' "$STATUS" >/dev/null
          grep -F 'application_id=com.jayuminton.user' "$STATUS" >/dev/null
          grep -F 'android_gradle_plugin=8.9.1' "$STATUS" >/dev/null
          grep -F 'compile_sdk=36' "$STATUS" >/dev/null
          grep -F 'target_sdk=36' "$STATUS" >/dev/null
          grep -F 'bundle_format=aab' "$STATUS" >/dev/null
          grep -F 'vibration_max_groups=8' "$STATUS" >/dev/null

      - name: Upload Play Console API36 AAB
        uses: actions/upload-artifact@v4
        with:
          name: Jayuminton-Play-v1.3.2-code132-API36-AAB
          path: |
            releases/jayuminton-user-play-v1.3.2-code132.aab
            deployment/status/user-play-aab-v1.3.2.txt
          if-no-files-found: error
          retention-days: 30
