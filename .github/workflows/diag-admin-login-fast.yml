name: Diagnose admin login fast

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-admin-login-fast.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Verify published APK login contract
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/admin.apk 'https://raw.githubusercontent.com/pianopp001-cpu/jayuminton-admin-app/main/releases/jayuminton-admin-v203.0-complete-pair-recording-clear-team-cards.apk'
          unzip -p /tmp/admin.apk assets/admin/index.html > /tmp/admin.html
          sha256sum /tmp/admin.apk
          grep -F '__JAYUMINTON_ADMIN_LOGIN_FALLBACK_V2051__' /tmp/admin.html
          grep -F 'window.server=function(name,args)' /tmp/admin.html
          grep -F 'window.adminLogin=async function()' /tmp/admin.html
          grep -F "document.getElementById('adminPinInput')" /tmp/admin.html
          grep -F "await window.server('createAdminSession',[pin])" /tmp/admin.html
          grep -F 'data-jm-cloudflare-login' /tmp/admin.html
          grep -F 'https://jayuminton-state.pianopp001.workers.dev/api/compat/rpc' /tmp/admin.html
          echo ADMIN_PUBLISHED_APK_DIRECT_CLOUDFLARE_LOGIN_OK
