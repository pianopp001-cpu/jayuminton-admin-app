name: Diagnose admin login fast

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-admin-login-fast.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Worker RPC and CORS
        shell: bash
        run: |
          set -euo pipefail
          ENDPOINT='https://jayuminton-state.pianopp001.workers.dev/api/compat/rpc'
          curl -sS -D /tmp/options.headers -o /tmp/options.body -X OPTIONS "$ENDPOINT" \
            -H 'Origin: null' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type,authorization' || true
          curl -sS -D /tmp/post.headers -o /tmp/post.body -X POST "$ENDPOINT" \
            -H 'Origin: null' \
            -H 'Content-Type: application/json' \
            --data '{"name":"createAdminSession","args":["__diagnostic_invalid_pin__"]}' || true
          grep -iE '^access-control-allow-origin: (\*|null)' /tmp/options.headers /tmp/post.headers >/dev/null
          grep -F '"ok"' /tmp/post.body >/dev/null
          echo WORKER_RPC_CORS_OK
      - name: Verify immutable published APK login contract
        shell: bash
        run: |
          set -euo pipefail
          COMMIT='04fcd9e'
          URL="https://raw.githubusercontent.com/pianopp001-cpu/jayuminton-admin-app/${COMMIT}/releases/jayuminton-admin-v203.0-complete-pair-recording-clear-team-cards.apk"
          curl -L --fail --retry 3 -o /tmp/admin.apk "$URL"
          ACTUAL=$(sha256sum /tmp/admin.apk | awk '{print $1}')
          echo "APK_SHA256=$ACTUAL"
          test "$ACTUAL" = '798531afd0cddb89be5a356760de20496d804f56493c6929a916f784f2bef3be'
          unzip -p /tmp/admin.apk assets/admin/index.html > /tmp/admin.html
          grep -F '__JAYUMINTON_ADMIN_DIRECT_CLOUDFLARE_LOGIN_V2050__' /tmp/admin.html
          grep -F 'window.server=directServer' /tmp/admin.html
          grep -F 'window.adminLogin=async function()' /tmp/admin.html
          grep -F "directServer('createAdminSession',[pin])" /tmp/admin.html
          grep -F 'https://jayuminton-state.pianopp001.workers.dev/api/compat/rpc' /tmp/admin.html
          echo ADMIN_IMMUTABLE_APK_DIRECT_CLOUDFLARE_LOGIN_OK
