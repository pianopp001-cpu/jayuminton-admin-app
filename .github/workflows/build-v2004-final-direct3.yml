name: Build v200.4 post-contract final APK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-v2004-final-direct3.yml'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.7'}

      - name: Prepare final admin HTML with post contract
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 8 --retry-delay 2 "https://jayuminton-push--admin-cloudflare-vnext-z3bgvi2g.web.app/?v2004direct3=${GITHUB_RUN_ID}" -o "$RUNNER_TEMP/admin.html"
          python3 deployment/jayuminton/admin_cloudflare_post_contract_patch.py "$RUNNER_TEMP/admin.html"
          python3 deployment/jayuminton/admin_top_controls_final_patch.py "$RUNNER_TEMP/admin.html"
          required=(
            'JAYUMINTON_ADMIN_CLOUDFLARE_FINAL_V1'
            '__JAYUMINTON_ADMIN_VOICE_TEST_REMOVED__'
            '__JAYUMINTON_ADMIN_NEW_BADGE_KO__'
            '__JAYUMINTON_ADMIN_REFRESH_BOUND__'
            '__JAYUMINTON_ADMIN_BLOCKING_SAVE__'
            '__JAYUMINTON_ADMIN_FINISH_ALERT_V19__'
            '__JAYUMINTON_ADMIN_EMPTY_COURT_FINISH_V1__'
            '__JAYUMINTON_ADMIN_TRANSITION_ALERT_BRIDGE_V1__'
            '__JAYUMINTON_ADMIN_FAST_SAVE_CLIENT_V1__'
            '__JAYUMINTON_ADMIN_STATISTICS_NO_CLIP_FINAL__'
            "memberWaitAlert:'member-device-only'"
            "memberCourtAlert:'member-device-only'"
            'adminTransitionVibration:true'
            'adminCourtVoice:true'
            'emptyCourtAllowed:true'
            'vibrationSets:8'
            'vibrationsPerSet:3'
            '번 코트 종료되었습니다.'
            '대기 1번 '
            '번 코트로 들어가 주세요.'
            'data-jm-top-controls'
            '__JAYUMINTON_ADMIN_TOP_CONTROLS_FINAL_V1__'
            'z-index:2147483647'
          )
          missing=0
          for marker in "${required[@]}"; do
            if ! grep -F "$marker" "$RUNNER_TEMP/admin.html" >/dev/null; then
              echo "MISSING_ADMIN_MARKER=$marker" >&2
              missing=1
            fi
          done
          test "$missing" = 0
          if grep -F 'adminVoiceTestButton' "$RUNNER_TEMP/admin.html" >/dev/null; then echo 'LEGACY_VOICE_TEST_SURVIVED' >&2; exit 1; fi
          if grep -F '>음성테스트<' "$RUNNER_TEMP/admin.html" >/dev/null; then echo 'VOICE_TEST_TEXT_SURVIVED' >&2; exit 1; fi
          if grep -F 'script.google.com/macros/s/' "$RUNNER_TEMP/admin.html" >/dev/null; then echo 'DIRECT_APPS_SCRIPT_URL_SURVIVED' >&2; exit 1; fi
          mkdir -p app/src/main/assets/admin
          cp "$RUNNER_TEMP/admin.html" app/src/main/assets/admin/index.html

      - name: Prepare v200.4 native voice and vibration shell
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          java=Path('app/src/main/java/com/jayuminton/admin/MainActivity.java')
          s=java.read_text(encoding='utf-8')
          s,n=re.subn(r'private static final String ADMIN_URL =\s*\n?\s*"[^"]+";', 'private static final String ADMIN_URL =\n            "file:///android_asset/admin/index.html?app=admin&native=1&appVersion=200.4";', s, count=1)
          if n != 1: raise SystemExit('ADMIN_URL replacement failed')
          s,n=re.subn(r'private static final String APK_WEB_BUILD = "[^"]+";', 'private static final String APK_WEB_BUILD = "2004-post-contract-final";', s, count=1)
          if n != 1: raise SystemExit('APK_WEB_BUILD replacement failed')
          s=s.replace('JayumintonNative/199.7 CloudflareAdmin/1997','JayumintonNative/200.4 CloudflareAdmin/2004')
          if 'import android.os.VibrationEffect;' not in s:
              s=s.replace('import android.os.Bundle;\n','import android.os.Bundle;\nimport android.os.VibrationEffect;\nimport android.os.Vibrator;\n',1)
          anchor='''        @JavascriptInterface\n        public boolean isSpeaking() {\n            return speaking.get() || (tts != null && tts.isSpeaking());\n        }\n'''
          methods='''        @JavascriptInterface\n        public boolean isSpeaking() {\n            return speaking.get() || (tts != null && tts.isSpeaking());\n        }\n\n        @JavascriptInterface\n        public void vibrate() {\n            runOnUiThread(() -> {\n                Vibrator vibrator = (Vibrator) getSystemService(VIBRATOR_SERVICE);\n                if (vibrator == null || !vibrator.hasVibrator()) return;\n                long[] pattern = new long[] {\n                    0,360,150,360,150,360,520,\n                    360,150,360,150,360,520,\n                    360,150,360,150,360,520,\n                    360,150,360,150,360,520,\n                    360,150,360,150,360,520,\n                    360,150,360,150,360,520,\n                    360,150,360,150,360,520,\n                    360,150,360,150,360\n                };\n                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) vibrator.vibrate(VibrationEffect.createWaveform(pattern, -1));\n                else vibrator.vibrate(pattern, -1);\n            });\n        }\n\n        @JavascriptInterface\n        public void cancelVibration() {\n            runOnUiThread(() -> {\n                Vibrator vibrator = (Vibrator) getSystemService(VIBRATOR_SERVICE);\n                if (vibrator != null) vibrator.cancel();\n            });\n        }\n'''
          if 'public void vibrate()' not in s:
              if anchor not in s: raise SystemExit('VoiceBridge anchor missing')
              s=s.replace(anchor,methods,1)
          s=s.replace('int duckedMusic = Math.max(0, Math.min(MEDIA_DUCK_VOLUME_STEP, maxMedia));','int duckedMusic = Math.min(originalMediaVolume, Math.max(0, Math.min(MEDIA_DUCK_VOLUME_STEP, maxMedia)));')
          java.write_text(s,encoding='utf-8')
          manifest=Path('app/src/main/AndroidManifest.xml')
          m=manifest.read_text(encoding='utf-8')
          if 'android.permission.VIBRATE' not in m:
              start=m.find('<manifest'); end=m.find('>',start)
              if start<0 or end<0: raise SystemExit('manifest tag missing')
              m=m[:end+1]+'\n    <uses-permission android:name="android.permission.VIBRATE" />'+m[end+1:]
          manifest.write_text(m,encoding='utf-8')
          gradle=Path('app/build.gradle')
          g=gradle.read_text(encoding='utf-8')
          g=re.sub(r"applicationId\s+['\"][^'\"]+['\"]", "applicationId 'com.jayuminton.admin'", g, count=1)
          g=re.sub(r'versionCode\s+\d+', 'versionCode 2004', g, count=1)
          g=re.sub(r"versionName\s+['\"][^'\"]+['\"]", "versionName '200.4'", g, count=1)
          gradle.write_text(g,encoding='utf-8')
          PY
          grep -F 'public void vibrate()' app/src/main/java/com/jayuminton/admin/MainActivity.java >/dev/null
          grep -F 'public void cancelVibration()' app/src/main/java/com/jayuminton/admin/MainActivity.java >/dev/null
          grep -F 'VOICE_REPEAT_COUNT = 3' app/src/main/java/com/jayuminton/admin/MainActivity.java >/dev/null
          grep -F 'AUDIOFOCUS_GAIN_TRANSIENT_MAY_DUCK' app/src/main/java/com/jayuminton/admin/MainActivity.java >/dev/null
          grep -F 'setWillPauseWhenDucked(false)' app/src/main/java/com/jayuminton/admin/MainActivity.java >/dev/null
          grep -F 'Math.min(originalMediaVolume' app/src/main/java/com/jayuminton/admin/MainActivity.java >/dev/null
          grep -F 'android.permission.VIBRATE' app/src/main/AndroidManifest.xml >/dev/null

      - name: Restore launcher icon and release signer
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode app/src/main/res/drawable/icon_from_library.b64 > app/src/main/res/drawable/icon.png
          test "$(sha256sum app/src/main/res/drawable/icon.png | awk '{print $1}')" = 'a64eaa06107cd20478fe49ab7c10b5b2afd2347533b95c383a439f8705d4a58e'
          mkdir -p signing
          base64 --decode signing/jayuminton-release.keystore.b64 > signing/jayuminton-release.jks
          keytool -list -keystore signing/jayuminton-release.jks -storepass 'JayuMinton14!' -alias jayuminton >/dev/null

      - name: Build signed release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify APK contents and signature
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          unzip -p "$APK" assets/admin/index.html > "$RUNNER_TEMP/apk-admin.html"
          for marker in JAYUMINTON_ADMIN_CLOUDFLARE_FINAL_V1 __JAYUMINTON_ADMIN_BLOCKING_SAVE__ __JAYUMINTON_ADMIN_EMPTY_COURT_FINISH_V1__ __JAYUMINTON_ADMIN_TRANSITION_ALERT_BRIDGE_V1__ __JAYUMINTON_ADMIN_STATISTICS_NO_CLIP_FINAL__ 'adminTransitionVibration:true' 'vibrationSets:8' 'vibrationsPerSet:3' '번 코트 종료되었습니다.' '대기 1번 ' '번 코트로 들어가 주세요.' 'data-jm-top-controls' '__JAYUMINTON_ADMIN_TOP_CONTROLS_FINAL_V1__' 'z-index:2147483647'; do
            if ! grep -F "$marker" "$RUNNER_TEMP/apk-admin.html" >/dev/null; then echo "MISSING_APK_MARKER=$marker" >&2; exit 1; fi
          done
          unzip -p "$APK" classes.dex | strings | grep -F 'cancelVibration' >/dev/null
          unzip -p "$APK" classes.dex | strings | grep -F 'VibrationEffect' >/dev/null

      - name: Publish final APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p releases deployment/status
          cp app/build/outputs/apk/release/app-release.apk releases/jayuminton-admin-v200.4-final.apk
          SHA=$(sha256sum releases/jayuminton-admin-v200.4-final.apk | awk '{print $1}')
          printf 'status=success\nversion=200.4\nrun_id=%s\nsha256=%s\nbuild=post-contract-final\n' "$GITHUB_RUN_ID" "$SHA" > deployment/status/v2004-final.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/jayuminton-admin-v200.4-final.apk deployment/status/v2004-final.txt
          git commit -m 'Publish final Jayuminton admin v200.4 APK'
          git pull --rebase origin main
          git push origin main
