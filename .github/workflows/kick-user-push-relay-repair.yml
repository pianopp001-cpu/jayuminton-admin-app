name: Kick user push relay repair
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kick-user-push-relay-repair.yml'
permissions:
  actions: write
  contents: read
jobs:
  kick:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch relay repair workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/workflows/diagnose-user-wait1-push.yml/dispatches" \
            -d '{"ref":"main"}'
# first install
