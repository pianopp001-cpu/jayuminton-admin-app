name: Build v1.2.6 stop-controller candidate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-user-native-push-v126-stop-controller.yml'
      - 'deployment/scripts/patch_build_user_native_v126_stop_controller.py'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: jayuminton-user-native-v126-stop-controller
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Initialize checkpoint
        run: echo 'node-ready' > "$RUNNER_TEMP/native-v126-stage.txt"

      - name: Resolve deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          CONFIG="$RUNNER_TEMP/deploy.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$CONFIG"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          jq -e '.pushScriptId and .pushDeploymentId and .firebaseProjectId and .pushUrl' "$CONFIG" >/dev/null
          {
            echo "PUSH_SCRIPT_ID=$(jq -r '.pushScriptId' "$CONFIG")"
            echo "PUSH_URL=$(jq -r '.pushUrl' "$CONFIG")"
            echo "FIREBASE_PROJECT_ID=$(jq -r '.firebaseProjectId' "$CONFIG")"
          } >> "$GITHUB_ENV"
          echo 'config-ready' > "$RUNNER_TEMP/native-v126-stage.txt"

      - name: Authenticate Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Install Firebase and clasp tools
        run: |
          npm install --global firebase-tools@latest @google/clasp@latest
          echo 'tools-ready' > "$RUNNER_TEMP/native-v126-stage.txt"

      - name: Download user-app Firebase configuration
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='com.jayuminton.user'
          firebase apps:list ANDROID --project "$FIREBASE_PROJECT_ID" --json > "$RUNNER_TEMP/apps.json"
          APP_ID="$(jq -r --arg pkg "$PACKAGE" '[.. | objects | select(((.packageName? == $pkg) or (.package_name? == $pkg) or (.androidClientInfo?.packageName? == $pkg)) and ((.appId? // .app_id?) != null)) | (.appId? // .app_id?)] | first // empty' "$RUNNER_TEMP/apps.json")"
          test -n "$APP_ID"
          firebase apps:sdkconfig ANDROID "$APP_ID" --project "$FIREBASE_PROJECT_ID" > app/google-services.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('app/google-services.json').read_text(encoding='utf-8'))
          packages=[]
          for client in data.get('client',[]):
              info=((client.get('client_info') or {}).get('android_client_info') or {})
              if info.get('package_name'): packages.append(info['package_name'])
          if 'com.jayuminton.user' not in packages:
              raise SystemExit('google-services.json package mismatch')
          PY
          echo 'firebase-app-ready' > "$RUNNER_TEMP/native-v126-stage.txt"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -n "$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | head -1)"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify live push sender and diagnostic endpoint
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/verify-push"
          mkdir -p "$WORK"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$PUSH_SCRIPT_ID" > "$WORK/.clasp.json"
          cd "$WORK"
          clasp pull
          grep -F "priority: 'high'" Code.js >/dev/null
          grep -F "ttl: '600s'" Code.js >/dev/null
          grep -F 'JAYUMINTON_NATIVE_DEVICE_ACK_V2' Code.js >/dev/null
          grep -F 'vibration_started' Code.js >/dev/null
          grep -F 'vibration_cancelled' Code.js >/dev/null
          echo 'push-ready' > "$RUNNER_TEMP/native-v126-stage.txt"

      - name: Build and verify v1.2.6 APK
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/native-v126-build.log") 2>&1
          echo 'native-build-started' > "$RUNNER_TEMP/native-v126-stage.txt"

          python3 deployment/scripts/patch_build_user_native_v111.py deployment/scripts/build_user_native_push_fresh_v110.sh
          python3 deployment/scripts/patch_build_user_native_v112.py deployment/scripts/build_user_native_push_fresh_v110.sh
          python3 deployment/scripts/patch_build_user_native_v113.py deployment/scripts/build_user_native_push_fresh_v110.sh
          python3 deployment/scripts/patch_build_user_native_v114.py deployment/scripts/build_user_native_push_fresh_v110.sh
          python3 deployment/scripts/patch_build_user_native_v115.py deployment/scripts/build_user_native_push_fresh_v110.sh
          python3 deployment/scripts/patch_build_user_native_v116.py deployment/scripts/build_user_native_push_fresh_v110.sh
          python3 deployment/scripts/patch_build_user_native_v117.py deployment/scripts/build_user_native_push_fresh_v110.sh
          python3 deployment/scripts/patch_build_user_native_v118.py deployment/scripts/build_user_native_push_fresh_v110.sh
          python3 deployment/scripts/patch_build_user_native_v119.py deployment/scripts/build_user_native_push_fresh_v110.sh
          python3 deployment/scripts/patch_build_user_native_v120_diagnostic.py deployment/scripts/build_user_native_push_fresh_v110.sh
          python3 deployment/scripts/patch_build_user_native_v121.py deployment/scripts/build_user_native_push_fresh_v110.sh
          python3 deployment/scripts/patch_build_user_native_v122.py deployment/scripts/build_user_native_push_fresh_v110.sh
          python3 deployment/scripts/patch_build_user_native_v124_confirmed_overlay.py deployment/scripts/build_user_native_push_fresh_v110.sh
          python3 deployment/scripts/patch_build_user_native_v126_stop_controller.py deployment/scripts/build_user_native_push_fresh_v110.sh

          SCRIPT='deployment/scripts/build_user_native_push_fresh_v110.sh'
          grep -F 'VERSION="1.2.6"' "$SCRIPT" >/dev/null
          grep -F 'VERSION_CODE="126"' "$SCRIPT" >/dev/null
          grep -F 'APP_VERSION = "1.2.6"' "$SCRIPT" >/dev/null
          grep -F 'class AlertVibrationController' "$SCRIPT" >/dev/null
          grep -F 'manager.cancel()' "$SCRIPT" >/dev/null
          grep -F 'GROUP_REPEAT_MS = 3490L' "$SCRIPT" >/dev/null
          grep -F 'createWaveform(GROUP_TIMINGS, GROUP_AMPLITUDES, -1)' "$SCRIPT" >/dev/null
          grep -F 'AlertVibrationController.start(this, assignmentId)' "$SCRIPT" >/dev/null
          grep -F 'AlertVibrationController.stop(this)' "$SCRIPT" >/dev/null
          test "$(grep -Fc 'AlertVibrationController.stop(context)' "$SCRIPT")" -ge 2
          grep -F 'NativeDeliveryReporter.report("vibration_started"' "$SCRIPT" >/dev/null
          grep -F 'confirm.setText("확인하고 닫기")' "$SCRIPT" >/dev/null
          grep -F '"확인 · 진동 끄기"' "$SCRIPT" >/dev/null
          grep -F '.setDeleteIntent(dismissPending)' "$SCRIPT" >/dev/null
          grep -F '"대기 1순위입니다. 라켓 들고 준비하세요."' "$SCRIPT" >/dev/null
          grep -F 'courtNo + "번 코트로 들어가세요."' "$SCRIPT" >/dev/null
          if grep -F '        vibrateStrong(court ? 5 : 3, overlayShown);' "$SCRIPT" >/dev/null; then
            echo 'legacy platform-repeat call is still active' >&2
            exit 1
          fi

          bash "$SCRIPT"

          APK='releases/jayuminton-courtstatus-v1.2.6-stop-controller.apk'
          STATUS='deployment/status/user-native-push-v1.2.6.txt'
          test -s "$APK"
          grep -F 'status=success' "$STATUS" >/dev/null
          grep -F 'version=1.2.6' "$STATUS" >/dev/null
          grep -F 'version_code=126' "$STATUS" >/dev/null
          grep -F 'application_id=com.jayuminton.user' "$STATUS" >/dev/null
          grep -F 'install_mode=uninstall-old-then-fresh-install' "$STATUS" >/dev/null
          grep -F 'wait1_vibration=controller-finite-3-pulse-groups-repeat-until-confirmed' "$STATUS" >/dev/null
          grep -F 'court_vibration=controller-finite-3-pulse-groups-repeat-until-confirmed' "$STATUS" >/dev/null

          unzip -p "$APK" classes.dex > "$RUNNER_TEMP/v126-classes.dex"
          strings "$RUNNER_TEMP/v126-classes.dex" > "$RUNNER_TEMP/v126-classes.txt"
          grep -F 'AlertVibrationController' "$RUNNER_TEMP/v126-classes.txt" >/dev/null
          grep -F 'JayumintonAlertVibration' "$RUNNER_TEMP/v126-classes.txt" >/dev/null
          grep -F 'vibration_started' "$RUNNER_TEMP/v126-classes.txt" >/dev/null
          grep -F 'vibration_cancelled' "$RUNNER_TEMP/v126-classes.txt" >/dev/null
          if grep -F '?mode=admin' "$RUNNER_TEMP/v126-classes.txt" >/dev/null; then
            echo 'admin URL leaked into user APK' >&2
            exit 1
          fi

          cp "$APK" "$RUNNER_TEMP/user-v126.apk"
          cp "$STATUS" "$RUNNER_TEMP/user-v126-status.txt"
          echo 'native-build-verified' > "$RUNNER_TEMP/native-v126-stage.txt"

      - name: Publish candidate only; do not touch live install routing
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          cp "$RUNNER_TEMP/user-v126.apk" releases/jayuminton-courtstatus-v1.2.6-stop-controller.apk
          cp "$RUNNER_TEMP/user-v126-status.txt" deployment/status/user-native-push-v1.2.6.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/jayuminton-courtstatus-v1.2.6-stop-controller.apk deployment/status/user-native-push-v1.2.6.txt
          git commit -m 'Publish v1.2.6 stop-controller user APK candidate' || true
          git pull --rebase origin main
          git push origin main

      - name: Confirm published candidate byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:releases/jayuminton-courtstatus-v1.2.6-stop-controller.apk > "$RUNNER_TEMP/remote-v126.apk"
          test -s "$RUNNER_TEMP/remote-v126.apk"
          test "$(sha256sum "$RUNNER_TEMP/remote-v126.apk" | awk '{print $1}')" = "$(sha256sum "$RUNNER_TEMP/user-v126.apk" | awk '{print $1}')"

      - name: Publish sanitized build failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          {
            echo 'status=failure'
            echo 'stage='"$(cat "$RUNNER_TEMP/native-v126-stage.txt" 2>/dev/null || echo unknown)"
            echo '--- build log tail ---'
            if [ -f "$RUNNER_TEMP/native-v126-build.log" ]; then
              tail -n 260 "$RUNNER_TEMP/native-v126-build.log"
            else
              echo 'build log was not created'
            fi
          } > deployment/status/native-v126-build-failure.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment/status/native-v126-build-failure.txt
          git commit -m 'Record v1.2.6 stop-controller build failure' || true
          git pull --rebase origin main
          git push origin main

      - name: Upload candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: jayuminton-courtstatus-v1.2.6-stop-controller
          path: releases/jayuminton-courtstatus-v1.2.6-stop-controller.apk
          if-no-files-found: error
          retention-days: 30
