name: Build Jayuminton user APK v1.5.5 no admin overlay evidence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-user-v155-no-admin-overlay-evidence.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MAIN_DEPLOYMENT_ID: AKfycbzhiLS6mrum8Izipu_1a1Osa88x4zg_qhHKTzWiaN38fJ0tADMRcWsLE-ERDSPZuKC_
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      FINAL_APK: releases/jayuminton-courtstatus-v1.5.5-no-admin-overlay-fresh.apk
      FINAL_STATUS: deployment/status/user-v1.5.5-no-admin-overlay.txt
      EVIDENCE: deployment/status/user-v1.5.5-build-evidence.txt

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build and record evidence
        shell: bash
        run: |
          set +e
          mkdir -p releases deployment/status
          ROUTE=failure; LAYOUT=failure; BUILD=failure; VERIFY=failure; PUBLISH=not-run; REASON=''
          URL="https://script.google.com/macros/s/${MAIN_DEPLOYMENT_ID}/exec?mode=user&apkUser=1&userAppVersion=1.5.5"

          curl -L --fail --silent --show-error --max-time 40 "$URL" -o "$RUNNER_TEMP/user-live.html"
          if [ $? -eq 0 ] && grep -Fq '자유민턴 코트배정 현황' "$RUNNER_TEMP/user-live.html" && grep -Fq 'memberSelfSettings' "$RUNNER_TEMP/user-live.html" && ! grep -Fq '관리자 화면을 불러오는 중입니다' "$RUNNER_TEMP/user-live.html"; then
            ROUTE=success
          else
            REASON='route'
          fi

          if [ "$ROUTE" = success ]; then
            cat > app/src/main/res/layout/activity_main.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:fitsSystemWindows="true">
              <WebView
                  android:id="@+id/webView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:overScrollMode="never" />
          </FrameLayout>
          XML
            if ! grep -Fq 'adminLoadPanel' app/src/main/res/layout/activity_main.xml && ! grep -Fq '관리자 화면을 불러오는 중입니다' app/src/main/res/layout/activity_main.xml; then
              LAYOUT=success
            else
              REASON='layout'
            fi
          fi

          if [ "$LAYOUT" = success ]; then
            cp deployment/scripts/build_user_apk_v100.sh "$RUNNER_TEMP/build.sh"
            python3 - "$RUNNER_TEMP/build.sh" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text(encoding='utf-8')
          s=s.replace('releases/jayuminton-user-v1.0.0.apk','releases/jayuminton-courtstatus-v1.5.5-no-admin-overlay-fresh.apk')
          s=s.replace('deployment/status/user-apk-v1.0.0.txt','deployment/status/user-v1.5.5-no-admin-overlay.txt')
          s=s.replace('com.jayuminton.user','com.jayuminton.user.final155')
          s=s.replace('1.0.0','1.5.5').replace('versionCode 100','versionCode 155').replace('version_code=100','version_code=155')
          marker='gradle --no-daemon clean assembleRelease\n'
          if marker not in s: raise SystemExit('gradle marker missing')
          s=s.split(marker,1)[0]+marker
          p.write_text(s,encoding='utf-8')
          PY
            chmod +x "$RUNNER_TEMP/build.sh"
            bash "$RUNNER_TEMP/build.sh" > "$RUNNER_TEMP/build-v155.log" 2>&1
            if [ $? -eq 0 ]; then BUILD=success; else REASON='build'; fi
          fi

          if [ "$BUILD" = success ]; then
            SRC_APK='app/build/outputs/apk/release/app-release.apk'
            cp "$SRC_APK" "$FINAL_APK"
            BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
            "$BT/aapt" dump badging "$FINAL_APK" > "$RUNNER_TEMP/badging.txt"
            A=$?
            "$BT/apksigner" verify --verbose --print-certs "$FINAL_APK" > "$RUNNER_TEMP/signer.txt"
            S=$?
            unzip -p "$FINAL_APK" classes.dex > "$RUNNER_TEMP/classes.dex"
            strings "$RUNNER_TEMP/classes.dex" > "$RUNNER_TEMP/classes.txt"
            unzip -p "$FINAL_APK" res/layout/activity_main.xml > "$RUNNER_TEMP/packed-layout.bin" 2>/dev/null
            strings "$RUNNER_TEMP/packed-layout.bin" > "$RUNNER_TEMP/packed-layout.txt" 2>/dev/null
            SIGNER=$(grep -Ei 'SHA-256 digest:' "$RUNNER_TEMP/signer.txt" | head -1 | sed -E 's/.*digest:[[:space:]]*//' | tr -d ':' | tr '[:lower:]' '[:upper:]')
            if [ $A -eq 0 ] && [ $S -eq 0 ] && grep -Fq "package: name='com.jayuminton.user.final155' versionCode='155' versionName='1.5.5'" "$RUNNER_TEMP/badging.txt" && grep -Fq "$MAIN_DEPLOYMENT_ID" "$RUNNER_TEMP/classes.txt" && grep -Fq '?mode=user' "$RUNNER_TEMP/classes.txt" && grep -Fq 'NativeUserApp' "$RUNNER_TEMP/classes.txt" && ! grep -Fq '?mode=admin' "$RUNNER_TEMP/classes.txt" && ! grep -Fq 'adminLoadPanel' "$RUNNER_TEMP/packed-layout.txt" && ! grep -Fq '관리자 화면을 불러오는 중입니다' "$RUNNER_TEMP/packed-layout.txt" && [ "$SIGNER" = 'D47ADB93363FF397601E63667E79F27F99AE499AADC1FD0013861809950FC787' ]; then
              VERIFY=success
            else
              REASON='verify'
            fi
          fi

          if [ "$VERIFY" = success ]; then
            SIZE=$(stat -c%s "$FINAL_APK"); SHA=$(sha256sum "$FINAL_APK" | awk '{print $1}')
            {
              echo 'status=success'
              echo 'version=1.5.5'
              echo 'version_code=155'
              echo 'application_id=com.jayuminton.user.final155'
              echo 'install_mode=true-new-package-fresh-install'
              echo "launch_url=$URL"
              echo 'route_preflight=success'
              echo 'admin_overlay_removed=verified'
              echo 'admin_loader_string_absent=verified'
              echo 'native_install_signal=NativeUserApp'
              echo "apk_size_bytes=$SIZE"
              echo "apk_sha256=$SHA"
              echo "signer_sha256=$SIGNER"
            } > "$FINAL_STATUS"
          fi

          {
            echo 'workflow=Build Jayuminton user APK v1.5.5 no admin overlay evidence'
            echo "route=$ROUTE"
            echo "layout=$LAYOUT"
            echo "build_apk=$BUILD"
            echo "verify_apk=$VERIFY"
            echo "publish=$PUBLISH"
            echo "failure_reason=$REASON"
            if [ -f "$RUNNER_TEMP/build-v155.log" ]; then echo 'build_log_tail_begin'; tail -n 80 "$RUNNER_TEMP/build-v155.log" | tr '\n' ' '; echo; echo 'build_log_tail_end'; fi
            if [ -f "$FINAL_STATUS" ]; then echo 'final_status_begin'; cat "$FINAL_STATUS"; echo 'final_status_end'; fi
            echo "updated_at=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          } > "$EVIDENCE"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$VERIFY" = success ]; then git add "$FINAL_APK" "$FINAL_STATUS" "$EVIDENCE"; else git add "$EVIDENCE"; fi
          git commit -m 'Record user APK v1.5.5 no-admin-overlay result' || true
          git pull --rebase origin main
          git push origin main
          exit 0
