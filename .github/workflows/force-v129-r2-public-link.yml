name: Force unique v1.2.9 r2 public install link

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/force-v129-r2-public-link.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22' }
      - run: npm install --global firebase-tools@latest
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Publish uniquely named v1.2.9 APK asset
        shell: bash
        run: |
          set -euo pipefail
          SRC_APK='releases/jayuminton-courtstatus-v1.2.9-background-registration.apk'
          STATUS='deployment/status/user-native-push-v1.2.9.txt'
          EXPECTED='5de666da2dd8febfe6c5dbef354b5aab1bd2ffa709d2419fb8406c80f02383ff'
          test -s "$SRC_APK"; test -s "$STATUS"
          grep -F 'version=1.2.9' "$STATUS" >/dev/null
          grep -F 'version_code=129' "$STATUS" >/dev/null
          test "$(sha256sum "$SRC_APK" | awk '{print $1}')" = "$EXPECTED"
          ASSET="$RUNNER_TEMP/Jayuminton-User-v1.2.9-code129-R2.apk"
          cp "$SRC_APK" "$ASSET"
          TAG='user-v1.2.9-r2'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" --title '자유민턴 사용자 앱 v1.2.9 (129) R2' --notes 'Unique-name v1.2.9 diagnostic APK to prevent stale 1.2.8 downloads.'
          fi
          RELEASE_URL="https://github.com/pianopp001-cpu/jayuminton-admin-app/releases/download/$TAG/Jayuminton-User-v1.2.9-code129-R2.apk"
          echo "RELEASE_URL=$RELEASE_URL" >> "$GITHUB_ENV"
          curl --fail --location --retry 5 -H 'Cache-Control: no-cache, no-store' "$RELEASE_URL?verify=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/check.apk"
          test "$(sha256sum "$RUNNER_TEMP/check.apk" | awk '{print $1}')" = "$EXPECTED"
          AAPT=''; for p in "$ANDROID_HOME"/build-tools/*/aapt; do [ -x "$p" ] && AAPT="$p"; done; test -n "$AAPT"
          "$AAPT" dump badging "$RUNNER_TEMP/check.apk" > "$RUNNER_TEMP/badging.txt"
          grep -F "package: name='com.jayuminton.user'" "$RUNNER_TEMP/badging.txt" >/dev/null
          grep -F "versionCode='129'" "$RUNNER_TEMP/badging.txt" >/dev/null
          grep -F "versionName='1.2.9'" "$RUNNER_TEMP/badging.txt" >/dev/null

      - name: Deploy web with unmistakable v1.2.9 button
        shell: bash
        run: |
          set -euo pipefail
          C="$RUNNER_TEMP/deploy.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$C"
          FIREBASE_PROJECT_ID="$(jq -r '.firebaseProjectId' "$C")"
          HOSTING_URL="$(jq -r '.hostingUrl' "$C")"
          MAIN_DEPLOYMENT_ID="$(jq -r '.mainDeploymentId' "$C")"
          PUSH_DEPLOYMENT_ID="$(jq -r '.pushDeploymentId' "$C")"
          BASE="${HOSTING_URL%/}"
          export MAIN_URL="https://script.google.com/macros/s/$MAIN_DEPLOYMENT_ID/exec"
          export PUSH_URL="https://script.google.com/macros/s/$PUSH_DEPLOYMENT_ID/exec"
          echo "FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID" >> "$GITHUB_ENV"
          echo "HOSTING_URL=$BASE" >> "$GITHUB_ENV"

          SRC="$GITHUB_WORKSPACE/deployment/jayuminton/v1637-web"
          ROOT="$RUNNER_TEMP/v129-r2-hosting"
          PUBLIC="$ROOT/public"
          mkdir -p "$PUBLIC"
          cp "$SRC/index.html" "$PUBLIC/index.html"
          cp "$SRC/setup-v205.css" "$PUBLIC/setup-v205.css"
          cp "$SRC/manifest.webmanifest" "$PUBLIC/manifest.webmanifest"
          cp "$SRC/firebase-messaging-sw.js" "$PUBLIC/firebase-messaging-sw.js"
          cp "$SRC/alert-self-test.js" "$PUBLIC/alert-self-test.js"
          for asset in icon-198.png icon-512.png apple-touch-icon-180.png badge-96.png; do
            curl --fail --location --retry 5 "$BASE/$asset?source=v129-r2-$GITHUB_RUN_ID" -o "$PUBLIC/$asset"
          done

          cat "$SRC"/setup-v205.js.gz.b64.part-* | tr -d '\r\n' | base64 -d > "$RUNNER_TEMP/setup.gz"
          gzip -dc "$RUNNER_TEMP/setup.gz" > "$PUBLIC/setup-v205.js"
          python3 deployment/scripts/patch_push_setup_verification.py "$PUBLIC/setup-v205.js"
          python3 deployment/scripts/patch_embedded_browser_push.py "$PUBLIC/setup-v205.js"
          python3 deployment/scripts/patch_native_host_bridge.py "$PUBLIC/setup-v205.js"
          python3 deployment/scripts/patch_user_install_link_v128.py hosting "$PUBLIC/setup-v205.js"

          python3 - <<'PY'
          from pathlib import Path
          import os,re
          public=Path(os.environ['RUNNER_TEMP'])/'v129-r2-hosting'/'public'
          target=os.environ['RELEASE_URL'] + '?download=1&build=129-r2-' + os.environ['GITHUB_RUN_ID']
          setup=public/'setup-v205.js'
          s=setup.read_text(encoding='utf-8')
          s=s.replace('JAYUMINTON_NATIVE_APK_DOWNLOAD_V128','JAYUMINTON_NATIVE_APK_DOWNLOAD_V129_R2')
          s=s.replace('JAYUMINTON_USER_APK_V128','JAYUMINTON_USER_APK_V129_R2')
          s=s.replace('자유민턴 사용자 앱 1.2.8을 다운로드합니다.','자유민턴 사용자 앱 1.2.9 (129)를 다운로드합니다.')
          s=re.sub(r"const JAYUMINTON_USER_APK_V129_R2 = '[^']+';",f"const JAYUMINTON_USER_APK_V129_R2 = '{target}';",s,count=1)
          if target not in s: raise SystemExit('v129-r2 target missing')
          if 'v1.2.8-repeat-switch.apk' in s: raise SystemExit('v128 route remained')
          setup.write_text(s,encoding='utf-8')

          template=Path('deployment/jayuminton/v1637-web/config-v204.template.js').read_text(encoding='utf-8')
          config=template.replace('__MEMBER_PAGE_URL__',os.environ['MAIN_URL']).replace('__RELAY_URL__',os.environ['PUSH_URL'])
          for n in ('config-v202.js','config-v203.js','config-v204.js'):
              (public/n).write_text(config,encoding='utf-8')

          base=(public/'index.html').read_text(encoding='utf-8')
          base=base.replace('>앱설치</button>','>앱설치 1.2.9 (129)</button>')
          for n in ('index.html','badminton.html'):
              h=base.replace('/setup-v205.js?v=1637',f'/setup-v205.js?v=v129-r2-{os.environ["GITHUB_RUN_ID"]}').replace('/config-v204.js?v=1637',f'/config-v204.js?v=v129-r2-{os.environ["GITHUB_RUN_ID"]}')
              h=h.replace('<meta name="jayuminton-build" content="1.6.37">',f'<meta name="jayuminton-build" content="1.6.37-v129-r2-{os.environ["GITHUB_RUN_ID"]}">')
              (public/n).write_text(h,encoding='utf-8')
          sw=public/'firebase-messaging-sw.js'
          w=sw.read_text(encoding='utf-8')
          w=re.sub(r"const JAYUMINTON_SW_VERSION = '[^']+';",f"const JAYUMINTON_SW_VERSION = 'v129-r2-{os.environ['GITHUB_RUN_ID']}';",w,count=1)
          w=re.sub(r"const JAYUMINTON_CACHE = '[^']+';",f"const JAYUMINTON_CACHE = 'jayuminton-v129-r2-{os.environ['GITHUB_RUN_ID']}';",w,count=1)
          sw.write_text(w,encoding='utf-8')
          PY

          node --check "$PUBLIC/setup-v205.js"
          grep -F 'Jayuminton-User-v1.2.9-code129-R2.apk' "$PUBLIC/setup-v205.js" >/dev/null
          grep -F '앱설치 1.2.9 (129)' "$PUBLIC/badminton.html" >/dev/null
          ! grep -F 'v1.2.8-repeat-switch.apk' "$PUBLIC/setup-v205.js"

          cat > "$ROOT/firebase.json" <<'JSON'
          {"hosting":{"public":"public","ignore":["firebase.json","**/.*","**/node_modules/**"],"headers":[{"source":"/index.html","headers":[{"key":"Cache-Control","value":"no-cache, no-store, must-revalidate"}]},{"source":"/badminton.html","headers":[{"key":"Cache-Control","value":"no-cache, no-store, must-revalidate"}]},{"source":"/setup-v205.js","headers":[{"key":"Cache-Control","value":"no-cache, no-store, must-revalidate"}]},{"source":"/firebase-messaging-sw.js","headers":[{"key":"Cache-Control","value":"no-cache, no-store, must-revalidate"}]}],"rewrites":[{"source":"**","destination":"/index.html"}]}}
          JSON
          firebase deploy --only hosting --project "$FIREBASE_PROJECT_ID" --config "$ROOT/firebase.json" --non-interactive

      - name: Verify live page and downloaded APK
        shell: bash
        run: |
          set -euo pipefail
          BASE="${HOSTING_URL%/}"
          EXPECTED='5de666da2dd8febfe6c5dbef354b5aab1bd2ffa709d2419fb8406c80f02383ff'
          ok=0
          for attempt in $(seq 1 20); do
            curl --fail --location --silent --show-error -H 'Cache-Control: no-cache, no-store' "$BASE/badminton.html?verify=v129-r2-$GITHUB_RUN_ID-$attempt" -o "$RUNNER_TEMP/live.html" || true
            curl --fail --location --silent --show-error -H 'Cache-Control: no-cache, no-store' "$BASE/setup-v205.js?verify=v129-r2-$GITHUB_RUN_ID-$attempt" -o "$RUNNER_TEMP/live.js" || true
            if grep -F '앱설치 1.2.9 (129)' "$RUNNER_TEMP/live.html" >/dev/null 2>&1 && grep -F 'Jayuminton-User-v1.2.9-code129-R2.apk' "$RUNNER_TEMP/live.js" >/dev/null 2>&1 && ! grep -F 'v1.2.8-repeat-switch.apk' "$RUNNER_TEMP/live.js" >/dev/null 2>&1; then ok=1; break; fi
            sleep 4
          done
          test "$ok" = 1
          TARGET="$(sed -n "s/.*const JAYUMINTON_USER_APK_V129_R2 = '\([^']*\)'.*/\1/p" "$RUNNER_TEMP/live.js" | head -1)"
          test -n "$TARGET"
          curl --fail --location --retry 5 -H 'Cache-Control: no-cache, no-store' "$TARGET" -o "$RUNNER_TEMP/live-v129-r2.apk"
          SHA="$(sha256sum "$RUNNER_TEMP/live-v129-r2.apk" | awk '{print $1}')"; test "$SHA" = "$EXPECTED"
          AAPT=''; for p in "$ANDROID_HOME"/build-tools/*/aapt; do [ -x "$p" ] && AAPT="$p"; done; test -n "$AAPT"
          "$AAPT" dump badging "$RUNNER_TEMP/live-v129-r2.apk" > "$RUNNER_TEMP/live-badging.txt"
          grep -F "versionCode='129'" "$RUNNER_TEMP/live-badging.txt" >/dev/null
          grep -F "versionName='1.2.9'" "$RUNNER_TEMP/live-badging.txt" >/dev/null
          cat > deployment/status/v129-r2-public-link-live.txt <<EOF
          status=success
          version=1.2.9
          version_code=129
          package=com.jayuminton.user
          user_url=$BASE/badminton.html
          visible_button=앱설치_1.2.9_(129)
          release_tag=user-v1.2.9-r2
          release_asset=Jayuminton-User-v1.2.9-code129-R2.apk
          apk_sha256=$SHA
          old_v128_link_present=no
          live_manifest_version_name=1.2.9
          live_manifest_version_code=129
          admin_logic_changed=no
          verified_at=$(date -u +%FT%TZ)
          EOF

      - name: Publish verification
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment/status/v129-r2-public-link-live.txt
          git commit -m 'Verify unique v1.2.9 r2 public install link' || exit 0
          git pull --rebase origin main || true
          git push origin main
