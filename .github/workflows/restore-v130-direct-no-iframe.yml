name: Restore v130 top-level form member login
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-v130-direct-no-iframe.yml'
      - 'deployment/jayuminton/v130_direct_member.py'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: jayuminton-v130-top-level-login
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Checkout exact v130 source
        uses: actions/checkout@v4
        with:
          ref: e88774455545529ab27e02d0587085a46351345b
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install tools
        run: npm install --global @google/clasp@latest firebase-tools@latest
      - name: Authenticate Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      - name: Resolve config and helper
        shell: bash
        run: |
          set -euo pipefail
          C="$RUNNER_TEMP/deploy.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$C"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          echo "MAIN_SCRIPT_ID=$(jq -r '.mainScriptId' "$C")" >> "$GITHUB_ENV"
          echo "MAIN_DEPLOYMENT_ID=$(jq -r '.mainDeploymentId' "$C")" >> "$GITHUB_ENV"
          echo "FIREBASE_PROJECT_ID=$(jq -r '.firebaseProjectId' "$C")" >> "$GITHUB_ENV"
          echo "HOSTING_URL=$(jq -r '.hostingUrl' "$C")" >> "$GITHUB_ENV"
          curl --fail --location --retry 4 https://raw.githubusercontent.com/pianopp001-cpu/jayuminton-admin-app/main/deployment/jayuminton/v130_direct_member.py -o "$RUNNER_TEMP/v130_direct_member.py"
      - name: Patch and deploy exact v130 Apps Script backend
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/v130-backend"
          mkdir -p "$WORK"
          cp source-snapshot/current-main/* "$WORK/"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$MAIN_SCRIPT_ID" > "$WORK/.clasp.json"
          python3 "$RUNNER_TEMP/v130_direct_member.py" patch --work "$WORK"
          grep -F 'function doPost(e)' "$WORK/Code.js" >/dev/null
          cd "$WORK"
          clasp push --force
          clasp create-deployment --deploymentId "$MAIN_DEPLOYMENT_ID" --description "v130 top level login $GITHUB_RUN_ID"
          echo "RPC_URL=https://script.google.com/macros/s/$MAIN_DEPLOYMENT_ID/exec" >> "$GITHUB_ENV"
          sleep 7
      - name: Verify top-level POST endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --max-time 60 \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'memberPassword=__wrong_probe_password__' \
            --data-urlencode 'returnUrl=https://jayuminton-push.firebaseapp.com/' \
            "$RPC_URL" -o "$RUNNER_TEMP/post.html"
          grep -F 'jayuminton-push.firebaseapp.com' "$RUNNER_TEMP/post.html" >/dev/null
          grep -F 'loginError=1' "$RUNNER_TEMP/post.html" >/dev/null
      - name: Build Firebase login gate
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/v130-top-login"
          mkdir -p "$ROOT/public"
          python3 "$RUNNER_TEMP/v130_direct_member.py" build \
            --work "$RUNNER_TEMP/v130-backend" \
            --out "$ROOT/public" \
            --rpc-url "$RPC_URL" \
            --hosting-url "$HOSTING_URL"
          grep -F 'jayuminton-v130-top-level-login' "$ROOT/public/index.html" >/dev/null
          grep -F 'method="post"' "$ROOT/public/index.html" >/dev/null
          grep -F "$MAIN_DEPLOYMENT_ID" "$ROOT/public/index.html" >/dev/null
          ! grep -F '/api/member' "$ROOT/public/index.html"
          ! grep -Eqi '<iframe' "$ROOT/public/index.html"
          cat > "$ROOT/firebase.json" <<'JSON'
          {"hosting":{"public":"public","headers":[{"source":"/**","headers":[{"key":"Cache-Control","value":"no-store, no-cache, must-revalidate, max-age=0"}]}],"rewrites":[{"source":"**","destination":"/index.html"}]}}
          JSON
      - name: Deploy Firebase login gate
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/v130-top-login"
          firebase deploy --only hosting --project "$FIREBASE_PROJECT_ID" --config firebase.json --non-interactive --message "v130 top level login $GITHUB_RUN_ID"
      - name: Android top-level login round-trip verify
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null 2>&1
          npm i playwright@1.54.2 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > verify.mjs <<'JS'
          import {chromium} from 'playwright';
          const base='https://jayuminton-push.firebaseapp.com';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:412,height:915},userAgent:'Mozilla/5.0 (Linux; Android 16; SM-S928N) AppleWebKit/537.36 Chrome/140.0.0.0 Mobile Safari/537.36'});
          const requests=[]; page.on('request',r=>requests.push({url:r.url(),type:r.resourceType(),method:r.method()}));
          await page.goto(base+'/?toplogin='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
          await page.locator('#memberPasswordInput').fill('__wrong_probe_password__');
          await page.locator('#memberLoginButton').click();
          await page.waitForURL(/jayuminton-push\.firebaseapp\.com\/\?loginError=1/,{timeout:60000});
          await page.waitForFunction(()=>getComputedStyle(document.getElementById('loginError')).display!=='none',null,{timeout:15000});
          const post=requests.find(r=>r.method==='POST'&&r.url.includes('script.google.com/macros/s/'));
          if(!post)throw new Error('top-level Apps Script POST missing');
          const forbidden=requests.filter(r=>r.type==='script'&&r.url.includes('script.google.com'));
          if(forbidden.length)throw new Error('Apps Script loaded as script subresource');
          console.log(JSON.stringify({finalUrl:page.url(),topLevelPost:true,scriptSubresource:false}));
          await browser.close();
          JS
          node verify.mjs
          echo V130_TOP_LEVEL_LOGIN_ANDROID_OK
