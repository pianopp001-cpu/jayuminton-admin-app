name: Restore v130 direct member without iframe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-v130-direct-no-iframe.yml'
      - 'deployment/jayuminton/v130_direct_member.py'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: jayuminton-v130-direct-no-iframe
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Checkout exact v130 source
        uses: actions/checkout@v4
        with:
          ref: e88774455545529ab27e02d0587085a46351345b
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install tools
        run: npm install --global @google/clasp@latest firebase-tools@latest
      - name: Authenticate Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      - name: Resolve config and helper
        shell: bash
        run: |
          set -euo pipefail
          C="$RUNNER_TEMP/deploy.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$C"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          echo "MAIN_SCRIPT_ID=$(jq -r '.mainScriptId' "$C")" >> "$GITHUB_ENV"
          echo "MAIN_DEPLOYMENT_ID=$(jq -r '.mainDeploymentId' "$C")" >> "$GITHUB_ENV"
          echo "FIREBASE_PROJECT_ID=$(jq -r '.firebaseProjectId' "$C")" >> "$GITHUB_ENV"
          echo "HOSTING_URL=$(jq -r '.hostingUrl' "$C")" >> "$GITHUB_ENV"
          curl --fail --location --retry 4 https://raw.githubusercontent.com/pianopp001-cpu/jayuminton-admin-app/main/deployment/jayuminton/v130_direct_member.py -o "$RUNNER_TEMP/v130_direct_member.py"
      - name: Patch v130 backend with safe JSONP
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/v130-backend"
          mkdir -p "$WORK"
          cp source-snapshot/current-main/* "$WORK/"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$MAIN_SCRIPT_ID" > "$WORK/.clasp.json"
          python3 "$RUNNER_TEMP/v130_direct_member.py" patch --work "$WORK"
          grep -F 'memberV130JsonpRpc_' "$WORK/Code.js" >/dev/null
          ! grep -F 'eval(name)' "$WORK/Code.js" >/dev/null
          cd "$WORK"
          clasp push --force
          clasp create-deployment --deploymentId "$MAIN_DEPLOYMENT_ID" --description "v130 direct no iframe $GITHUB_RUN_ID"
          echo "RPC_URL=https://script.google.com/macros/s/$MAIN_DEPLOYMENT_ID/exec" >> "$GITHUB_ENV"
          sleep 7
      - name: Verify JSONP login backend
        shell: bash
        run: |
          set -euo pipefail
          CB="jmV130Probe$GITHUB_RUN_ID"
          curl --fail --location --retry 5 --max-time 60 "$RPC_URL?rpc=getMemberPasswordVersion&callback=$CB&payload=W10&nonce=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/version.js"
          grep -F "$CB(" "$RUNNER_TEMP/version.js" >/dev/null
          grep -F '"ok":true' "$RUNNER_TEMP/version.js" >/dev/null
          CB2="jmV130Login$GITHUB_RUN_ID"
          P="$(printf '%s' '["__wrong_probe_password__"]' | base64 -w0 | tr '+/' '-_' | tr -d '=')"
          curl --fail --location --retry 5 --max-time 60 "$RPC_URL?rpc=verifyMemberPassword&callback=$CB2&payload=$P&nonce=login_$GITHUB_RUN_ID" -o "$RUNNER_TEMP/login.js"
          grep -F "$CB2(" "$RUNNER_TEMP/login.js" >/dev/null
          grep -F '"ok":true' "$RUNNER_TEMP/login.js" >/dev/null
      - name: Build iframe-free Firebase page
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/v130-direct-hosting"
          mkdir -p "$ROOT/public"
          python3 "$RUNNER_TEMP/v130_direct_member.py" build --work "$RUNNER_TEMP/v130-backend" --out "$ROOT/public" --rpc-url "$RPC_URL" --hosting-url "$HOSTING_URL"
          grep -F 'jayuminton-v130-direct' "$ROOT/public/index.html" >/dev/null
          grep -F '__JAYUMINTON_V130_DIRECT_RPC__' "$ROOT/public/index.html" >/dev/null
          grep -F 'memberV130LoginClick_(this)' "$ROOT/public/index.html" >/dev/null
          ! grep -Eqi '<iframe' "$ROOT/public/index.html"
          cat > "$ROOT/firebase.json" <<'JSON'
          {"hosting":{"public":"public","headers":[{"source":"/**","headers":[{"key":"Cache-Control","value":"no-store, no-cache, must-revalidate, max-age=0"}]}],"rewrites":[{"source":"**","destination":"/index.html"}]}}
          JSON
      - name: Deploy same Firebase URL
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/v130-direct-hosting"
          firebase deploy --only hosting --project "$FIREBASE_PROJECT_ID" --config firebase.json --non-interactive --message "v130 direct no iframe $GITHUB_RUN_ID"
      - name: Android login click end-to-end verify on both hosts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null 2>&1
          npm i playwright@1.54.2 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > verify.mjs <<'JS'
          import { chromium } from 'playwright';
          const web=process.env.HOSTING_URL.replace(/\/$/,'');
          const firebaseapp=web.replace('.web.app','.firebaseapp.com');
          const browser=await chromium.launch({headless:true});
          for (const base of [web,firebaseapp]) {
            const page=await browser.newPage({viewport:{width:412,height:915},userAgent:'Mozilla/5.0 (Linux; Android 16; SM-S928N) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Mobile Safari/537.36'});
            const errors=[]; page.on('pageerror',e=>errors.push(e.message));
            await page.goto(base+'/?direct='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>document.getElementById('memberLoginBox')&&!document.getElementById('memberLoginBox').classList.contains('hidden'),null,{timeout:30000});
            if(await page.locator('iframe').count()) throw new Error(base+' iframe remains');
            if(!(await page.evaluate(()=>window.__JAYUMINTON_V130_DIRECT_RPC__===true))) throw new Error(base+' direct RPC bridge missing');
            await page.locator('#memberPasswordInput').fill('__wrong_probe_password__');
            const dialogPromise=new Promise((resolve,reject)=>{
              const timer=setTimeout(()=>reject(new Error(base+' login click produced no dialog')),30000);
              page.once('dialog',async d=>{clearTimeout(timer);const msg=d.message();await d.accept();resolve(msg);});
            });
            await page.locator('#memberLoginBox button.primary').click();
            const msg=await dialogPromise;
            if(!msg.includes('멤버 비밀번호가 틀렸습니다.')) throw new Error(base+' unexpected login result: '+msg);
            if(errors.length) throw new Error(base+' page errors: '+errors.join(' | '));
            console.log(JSON.stringify({base,loginClick:true,message:msg,errors}));
            await page.close();
          }
          await browser.close();
          JS
          HOSTING_URL="$HOSTING_URL" node verify.mjs
          echo V130_DIRECT_ANDROID_LOGIN_CLICK_OK
