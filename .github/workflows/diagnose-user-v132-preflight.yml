name: Diagnose user v1.3.2 patch chain

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-user-v132-preflight.yml'
      - 'deployment/scripts/patch_user_native_v132_strict_current_member.py'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: jayuminton-user-v132-preflight
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - name: Run local-only patch chain and always write evidence
        shell: bash
        run: |
          set +e
          mkdir -p deployment/status
          LOG="$RUNNER_TEMP/v132-preflight.log"
          SCRIPT='deployment/scripts/build_user_native_push_fresh_v110.sh'
          status=success
          failed_step=''
          for patch in \
            patch_build_user_native_v111.py \
            patch_build_user_native_v112.py \
            patch_build_user_native_v113.py \
            patch_build_user_native_v114.py \
            patch_build_user_native_v115.py \
            patch_build_user_native_v116.py \
            patch_build_user_native_v117.py \
            patch_build_user_native_v118.py \
            patch_build_user_native_v119.py \
            patch_build_user_native_v120_diagnostic.py \
            patch_build_user_native_v121.py \
            patch_build_user_native_v122.py \
            patch_build_user_native_v124_confirmed_overlay.py \
            patch_build_user_native_v126_stop_controller.py \
            patch_build_user_native_v126_raceguard.py \
            patch_build_user_native_v127_member_switch.py \
            patch_build_user_native_v128_repeat_switch.py \
            patch_build_user_native_v129_background_registration.py \
            patch_user_native_v130_vibration_cap8.py \
            patch_user_native_v132_strict_current_member.py; do
            echo "=== $patch ===" >> "$LOG"
            python3 "deployment/scripts/$patch" "$SCRIPT" >> "$LOG" 2>&1
            rc=$?
            if [ $rc -ne 0 ]; then status=failure; failed_step="$patch"; break; fi
          done
          if [ "$status" = success ]; then
            for marker in \
              'VERSION="1.3.2"' \
              'VERSION_CODE="132"' \
              '"wait1_ready".equals(type)' \
              '"court_assignment".equals(type)' \
              'boolean selectedMemberMatches = hasTargetMemberId &&' \
              'assignmentType && (!hasTargetMemberId || !selectedMemberMatches)' \
              'NativePushRegistrar.isCurrentMember(this, targetMemberId)' \
              'stopPreviousMemberAlert(app);' \
              'private static final int MAX_GROUPS = 8;' \
              'jayuminton_web_push_selected_member_v1'; do
              grep -F "$marker" "$SCRIPT" >> "$LOG" 2>&1 || { status=failure; failed_step="verify:$marker"; break; }
            done
          fi
          if grep -F 'selectedMemberMatches = !hasTargetMemberId || NativePushRegistrar.isCurrentMember' "$SCRIPT" >> "$LOG" 2>&1; then
            status=failure; failed_step='unsafe-missing-target-rule-survived'
          fi
          {
            echo "status=$status"
            echo "failed_step=$failed_step"
            echo "source_sha=${GITHUB_SHA}"
            echo 'contract=current-selected-member-only'
            echo 'assignment_types=wait1_ready,court_assignment'
            echo 'missing_target=reject'
            echo 'unrelated_assignment=ignore_without_cancelling_current'
            echo 'vibration=3-pulses-max-8-groups'
            echo '--- log tail ---'
            tail -n 80 "$LOG"
          } > deployment/status/user-v132-preflight.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment/status/user-v132-preflight.txt
          git commit -m "Record user v1.3.2 preflight $status" || true
          git pull --rebase origin main
          git push origin main
          test "$status" = success
