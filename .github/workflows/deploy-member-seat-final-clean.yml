name: Deploy guarded member seat final clean

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/member-seat-deploy-trigger'

permissions:
  contents: read

concurrency:
  group: jayuminton-member-seat-final-clean
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          CONFIG="$RUNNER_TEMP/deploy.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$CONFIG"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          jq -e '.mainScriptId and .mainDeploymentId' "$CONFIG" >/dev/null
          echo "MAIN_SCRIPT_ID=$(jq -r '.mainScriptId' "$CONFIG")" >> "$GITHUB_ENV"
          echo "MAIN_DEPLOYMENT_ID=$(jq -r '.mainDeploymentId' "$CONFIG")" >> "$GITHUB_ENV"
      - name: Install clasp
        run: npm install --global @google/clasp@latest
      - name: Pull live and diagnose approved three files
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/main-live"
          mkdir -p "$WORK"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$MAIN_SCRIPT_ID" > "$WORK/.clasp.json"
          cd "$WORK"
          clasp pull
          mkdir -p "$RUNNER_TEMP/live-before"
          cp Admin.html Style.html Code.js Index.html Script.html check.js "$RUNNER_TEMP/live-before/"
          cp "$GITHUB_WORKSPACE/source-snapshot/current-main/Code.js" Code.js
          cp "$GITHUB_WORKSPACE/source-snapshot/current-main/Index.html" Index.html
          cp "$GITHUB_WORKSPACE/source-snapshot/current-main/Script.html" Script.html
          check_same() { if cmp -s "$1" "$2"; then echo "OK preserve: $3"; else echo "FAIL preserve: $3"; return 1; fi; }
          check_text() { if grep -Fq "$1" "$2"; then echo "OK text: $3"; else echo "FAIL text: $3"; return 1; fi; }
          FAIL=0
          check_same Admin.html "$RUNNER_TEMP/live-before/Admin.html" Admin.html || FAIL=1
          check_same Style.html "$RUNNER_TEMP/live-before/Style.html" Style.html || FAIL=1
          check_same check.js "$RUNNER_TEMP/live-before/check.js" check.js || FAIL=1
          check_text '대기자에서 내 카드를 한 번 터치하면 바로 본인 설정할 수 있어요.' Index.html 'identity help' || FAIL=1
          check_text '빈자리 선택 → 자리잡기 · 내 자리 선택 → 바꿀 사람 선택' Index.html 'seat help' || FAIL=1
          check_text 'memberRequestWaitSwap' Code.js 'server request swap' || FAIL=1
          check_text 'memberGetWaitSwapRequest' Code.js 'server get swap request' || FAIL=1
          check_text 'memberRespondWaitSwap' Code.js 'server respond swap' || FAIL=1
          check_text 'memberRequestWaitSwap' Script.html 'client request swap' || FAIL=1
          check_text 'checkMemberWaitSwapRequest' Script.html 'client receive swap' || FAIL=1
          python3 - <<'PY' || FAIL=1
          from pathlib import Path
          s=Path('Script.html').read_text(encoding='utf-8')
          a=s.find('<script>'); b=s.rfind('</script>')
          if a < 0 or b <= a: raise SystemExit('FAIL syntax prep: Script wrapper missing')
          Path('verify.js').write_text(s[a+8:b], encoding='utf-8')
          print('OK syntax prep: Script wrapper')
          PY
          if [ -f verify.js ]; then
            if node --check verify.js; then echo 'OK syntax: Script.html'; else echo 'FAIL syntax: Script.html'; FAIL=1; fi
            rm -f verify.js
          fi
          if [ "$FAIL" -ne 0 ]; then echo 'GUARD_RESULT=FAILED - nothing was pushed.'; exit 1; fi
          echo 'GUARD_RESULT=PASSED - push step may proceed.'
      - name: Push only after all guards pass
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/main-live"
          clasp push --force
          clasp create-deployment --deploymentId "$MAIN_DEPLOYMENT_ID" --description "member seat move and approved swap $GITHUB_RUN_ID"
