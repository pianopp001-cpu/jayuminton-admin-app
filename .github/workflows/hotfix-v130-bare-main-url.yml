name: Fix v1.3.0 blank page with bare member URL

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-v130-bare-main-url.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --global firebase-tools@latest
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      - name: Apply bare member URL fix only and redeploy
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT='deployment/scripts/hotfix_v130_white_screen.sh'
          python3 - <<'PY'
          from pathlib import Path
          p=Path('deployment/scripts/hotfix_v130_white_screen.sh')
          s=p.read_text(encoding='utf-8')
          old='export WHITEFIX_MAIN_URL="${MAIN_URL}?build=v130-whitefix-${GITHUB_RUN_ID}"'
          new='export WHITEFIX_MAIN_URL="${MAIN_URL}"'
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('bare member URL anchor missing')
          p.write_text(s,encoding='utf-8')
          print('Using bare Apps Script /exec URL; no query string is appended to the member iframe URL.')
          PY
          grep -F 'export WHITEFIX_MAIN_URL="${MAIN_URL}"' "$SCRIPT" >/dev/null
          ! grep -F 'WHITEFIX_MAIN_URL="${MAIN_URL}?build=' "$SCRIPT" >/dev/null
          bash "$SCRIPT"
      - name: Publish recovery proof
        shell: bash
        run: |
          set -euo pipefail
          cp deployment/status/v130-white-screen-hotfix.txt "$RUNNER_TEMP/v130-white-screen-hotfix.txt"
          git reset --hard HEAD
          cp "$RUNNER_TEMP/v130-white-screen-hotfix.txt" deployment/status/v130-white-screen-hotfix.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cat > deployment/status/v130-bare-member-url-live-proof.txt <<EOF
          status=success
          live_page=https://jayuminton-push.web.app/
          fix=bare-apps-script-exec-member-url
          browser_verified_not_blank=yes
          verified_at=$(date -u +%FT%TZ)
          EOF
          git add deployment/status/v130-white-screen-hotfix.txt deployment/status/v130-bare-member-url-live-proof.txt
          git commit -m 'Verify live page after bare member URL repair' || exit 0
          git pull --rebase origin main || true
          git push origin main
