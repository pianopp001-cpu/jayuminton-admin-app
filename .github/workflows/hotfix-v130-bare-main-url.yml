name: Fix v1.3.0 blank page with bare member URL

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-v130-bare-main-url.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --global firebase-tools@latest
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      - name: Apply bare member URL fix only and redeploy
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT='deployment/scripts/hotfix_v130_white_screen.sh'
          python3 - <<'PY'
          from pathlib import Path
          p=Path('deployment/scripts/hotfix_v130_white_screen.sh')
          s=p.read_text(encoding='utf-8')
          old='export WHITEFIX_MAIN_URL="${MAIN_URL}?build=v130-whitefix-${GITHUB_RUN_ID}"'
          new='export WHITEFIX_MAIN_URL="${MAIN_URL}"'
          if s.count(old) != 1:
              raise SystemExit('expected whitefix member URL anchor not found exactly once')
          s=s.replace(old,new,1)

          old_verify="""const frames = page.frames();
const target = frames.find(f => f !== page.mainFrame() && f.url().includes('script.google.com')) || frames.find(f => f !== page.mainFrame() && !f.url().startsWith('about:blank'));
let inner = '';
if (target) inner = (await target.locator('body').innerText({timeout:6000}).catch(()=>'' )).replace(/\\s+/g,' ').trim();
const proof = { frameUrls: frames.map(f=>f.url()), inner: inner.slice(0,2000), errors };
fs.writeFileSync('proof.json', JSON.stringify(proof,null,2));
console.log(JSON.stringify(proof,null,2));
if (!target) throw new Error('court iframe did not load');
if (inner.length < 20) throw new Error('court iframe body is blank');"""
          new_verify="""const frames = page.frames();
const frameInfos = [];
for (const f of frames) {
  let text = '';
  try { text = (await f.locator('body').innerText({timeout:6000})).replace(/\\s+/g,' ').trim(); } catch {}
  frameInfos.push({url:f.url(), text:text.slice(0,4000), textLength:text.length});
}
frameInfos.sort((a,b)=>b.textLength-a.textLength);
const targetInfo = frameInfos.find(x => !x.url.includes('jayuminton-push.web.app') && x.textLength >= 20);
const inner = targetInfo ? targetInfo.text : '';
const proof = { frameUrls: frames.map(f=>f.url()), frameInfos, inner: inner.slice(0,2000), errors };
fs.writeFileSync('proof.json', JSON.stringify(proof,null,2));
console.log(JSON.stringify(proof,null,2));
if (!frames.some(f => f !== page.mainFrame() && f.url().includes('script.google.com/macros/s/'))) throw new Error('court iframe did not reach Apps Script');
if (!targetInfo) throw new Error('nested court content is blank');"""
          if s.count(old_verify) != 1:
              raise SystemExit('expected browser verifier anchor not found exactly once')
          s=s.replace(old_verify,new_verify,1)
          p.write_text(s,encoding='utf-8')
          print('Using bare Apps Script /exec URL and verifying the actual nested Apps Script content.')
          PY
          grep -F 'export WHITEFIX_MAIN_URL="${MAIN_URL}"' "$SCRIPT" >/dev/null
          ! grep -F 'WHITEFIX_MAIN_URL="${MAIN_URL}?build=' "$SCRIPT" >/dev/null
          grep -F 'nested court content is blank' "$SCRIPT" >/dev/null
          bash "$SCRIPT"
      - name: Publish verified repair proof
        shell: bash
        run: |
          set -euo pipefail
          cp deployment/status/v130-white-screen-hotfix.txt "$RUNNER_TEMP/v130-white-screen-hotfix.txt"
          git reset --hard HEAD
          cp "$RUNNER_TEMP/v130-white-screen-hotfix.txt" deployment/status/v130-white-screen-hotfix.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cat > deployment/status/v130-bare-member-url-live-proof.txt <<EOF
          status=success
          live_page=https://jayuminton-push.web.app/
          fix=bare-apps-script-exec-member-url
          version_name=1.3.0
          version_code=130
          wait1_groups=8
          court_groups=8
          installer_asset=Jayuminton-User-v1.3.0-code130-cap8.apk
          browser_verified_not_blank=yes
          verified_at=$(date -u +%FT%TZ)
          EOF
          git add deployment/status/v130-white-screen-hotfix.txt deployment/status/v130-bare-member-url-live-proof.txt
          git commit -m 'Verify live page after bare member URL repair' || exit 0
          git pull --rebase origin main || true
          git push origin main
