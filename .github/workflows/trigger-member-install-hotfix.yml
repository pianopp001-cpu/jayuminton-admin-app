name: Trigger member edit deployment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-member-install-hotfix.yml'
  workflow_dispatch: {}

permissions:
  actions: write
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Dispatch member edit deployment workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BODY="$RUNNER_TEMP/dispatch-body.txt"
          CODE=$(curl -sS -o "$BODY" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/apply-member-edit-vibration.yml/dispatches" \
            -d '{"ref":"main"}')
          printf 'workflow=apply-member-edit-vibration.yml\nhttp_code=%s\nresponse=%s\n' \
            "$CODE" "$(tr '\n' ' ' < "$BODY" | head -c 1000)" \
            > deployment/status/member-edit-dispatch.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment/status/member-edit-dispatch.txt
          git commit -m "Record member edit dispatch HTTP $CODE" || true
          git pull --rebase origin main || true
          git push
          test "$CODE" = '204'
