name: Trigger member install hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-member-install-hotfix.yml'
  workflow_dispatch: {}

permissions:
  actions: write
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Dispatch actual member/install fix workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u
          BODY="$RUNNER_TEMP/dispatch-body.txt"
          CODE=$(curl -sS -o "$BODY" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/inspect-push-register.yml/dispatches \
            -d '{"ref":"main"}')
          printf 'http_code=%s\nresponse=%s\n' "$CODE" "$(tr '\n' ' ' < "$BODY" | head -c 1000)" > deployment/jayuminton/ACTUAL_FIX_DISPATCH_STATUS.txt
          git config user.name 'github-actions[bot]'
          git config user.email '4189822+github-actions[bot]@users.noreply.github.com'
          git add deployment/jayuminton/ACTUAL_FIX_DISPATCH_STATUS.txt
          git commit -m "Record actual fix dispatch HTTP $CODE" || true
          git pull --rebase origin main || true
          git push
          test "$CODE" = '204'
