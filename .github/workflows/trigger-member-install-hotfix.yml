name: Build verified Jayuminton v199.7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-member-install-hotfix.yml'
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: jayuminton-v1997-verified-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -n "$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | head -1)"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build and verify v199.7
        id: build_apk
        shell: bash
        run: |
          set +e
          LOG="$RUNNER_TEMP/v1997-build.log"
          bash deployment/scripts/run_verified_v1997.sh 2>&1 | tee "$LOG"
          RC=${PIPESTATUS[0]}
          echo "exit_code=$RC" >> "$GITHUB_OUTPUT"
          exit "$RC"

      - name: Upload verified v199.7 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jayuminton-v199.7-verified
          path: releases/jayuminton-v199.7-verified.apk
          if-no-files-found: error
          retention-days: 30

      - name: Record v199.7 result
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p deployment/status
          STATUS=deployment/status/registered-v1997-build.txt
          DIAG=deployment/status/registered-v1997-diagnostic.txt
          DETAIL=deployment/status/apk-v1997.txt
          APK=releases/jayuminton-v199.7-verified.apk
          LOG="$RUNNER_TEMP/v1997-build.log"

          {
            echo 'workflow=Build verified Jayuminton v199.7'
            echo 'run_id=${{ github.run_id }}'
            echo 'status=${{ job.status }}'
            echo 'build_step=${{ steps.build_apk.outcome }}'
            echo 'build_exit_code=${{ steps.build_apk.outputs.exit_code }}'
            echo 'head_sha=${{ github.sha }}'
            if [ -s "$APK" ]; then
              echo 'apk_exists=yes'
              echo "apk_sha256=$(sha256sum "$APK" | awk '{print $1}')"
            else
              echo 'apk_exists=no'
            fi
            if [ -s "$DETAIL" ]; then
              echo 'detailed_verification_status=present'
            else
              echo 'detailed_verification_status=absent'
            fi
            date -u '+updated_at=%Y-%m-%dT%H:%M:%SZ'
          } > "$STATUS"

          {
            echo 'safe_error_extract=v1'
            if [ -s "$LOG" ]; then
              grep -Ei '(FAILURE:|BUILD FAILED|Execution failed|ERROR:|error:|not found|missing|mismatch|stale|WebStorage|launcher|Pinned|session|volume|ADMIN_URL)' "$LOG" \
                | tail -n 120 \
                | sed -E 's/(storePassword|keyPassword)[^[:space:]]*/\1=[REDACTED]/g' \
                || true
            else
              echo 'build_log=missing'
            fi
          } > "$DIAG"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$STATUS" "$DIAG"
          [ -s "$DETAIL" ] && git add "$DETAIL" || true
          [ -s "$APK" ] && git add "$APK" || true
          git commit -m 'Record verified v199.7 APK build: ${{ job.status }}' || exit 0
          git push origin main
