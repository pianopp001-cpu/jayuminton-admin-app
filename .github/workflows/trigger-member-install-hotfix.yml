name: Build verified Jayuminton v199.6 through registered workflow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-member-install-hotfix.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: jayuminton-v1996-registered-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build and verify v199.6
        run: bash deployment/scripts/run_verified_v1996_fixed.sh

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: jayuminton-v199.6-verified
          path: releases/jayuminton-v199.6-verified.apk
          if-no-files-found: error
          retention-days: 30

      - name: Commit verified APK and status
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/jayuminton-v199.6-verified.apk deployment/status/apk-v1996.txt
          git commit -m 'Add fully verified Jayuminton v199.6 APK' || exit 0
          git pull --rebase origin main || true
          git push origin main
