name: Deploy member edit - existing member only
run-name: Existing member edit deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-member-install-hotfix.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: jayuminton-existing-member-edit
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install clasp
        run: npm install --global @google/clasp@latest

      - name: Resolve live MAIN deployment
        shell: bash
        run: |
          set -euo pipefail
          CONFIG="$RUNNER_TEMP/deploy.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$CONFIG"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          jq -e '.mainScriptId and .mainDeploymentId' "$CONFIG" >/dev/null
          echo "MAIN_SCRIPT_ID=$(jq -r '.mainScriptId' "$CONFIG")" >> "$GITHUB_ENV"
          echo "MAIN_DEPLOYMENT_ID=$(jq -r '.mainDeploymentId' "$CONFIG")" >> "$GITHUB_ENV"
          echo "MAIN_URL=https://script.google.com/macros/s/$(jq -r '.mainDeploymentId' "$CONFIG")/exec" >> "$GITHUB_ENV"

      - name: Pull, patch and validate live MAIN
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/main"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$MAIN_SCRIPT_ID" > "$WORK/.clasp.json"
          cd "$WORK"
          clasp pull
          python3 "$GITHUB_WORKSPACE/deployment/scripts/apply_member_edit_existing_only.py" "$WORK"

          grep -F 'onclick="applyMemberEdit()">수정</button>' Admin.html >/dev/null
          if grep -F '수정 저장' Admin.html >/dev/null; then
            echo 'Old edit/save wording remains'
            exit 1
          fi
          grep -F "server('updateMemberProfile'" Script.html >/dev/null
          grep -F "if (!IS_ADMIN) return '';" Script.html >/dev/null
          grep -F 'members[index].name = name;' Code.js >/dev/null
          grep -F 'JAYUMINTON_MEMBER_EDIT_EXISTING_ONLY_STYLE' Style.html >/dev/null

      - name: Deploy patched MAIN
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/main"
          cd "$WORK"
          clasp push --force
          clasp create-deployment --deploymentId "$MAIN_DEPLOYMENT_ID" --description "existing-member-only edit ${GITHUB_SHA::7}"

          cp Admin.html "$GITHUB_WORKSPACE/source-snapshot/current-main/Admin.html"
          cp Script.html "$GITHUB_WORKSPACE/source-snapshot/current-main/Script.html"
          cp Style.html "$GITHUB_WORKSPACE/source-snapshot/current-main/Style.html"
          cp Code.js "$GITHUB_WORKSPACE/source-snapshot/current-main/Code.js"

      - name: Verify live admin and user pages
        shell: bash
        run: |
          set -euo pipefail
          sleep 8
          BUST="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          curl --fail --location --retry 3 --max-time 90 -H 'Cache-Control: no-cache' \
            "$MAIN_URL?mode=admin&verify=$BUST" -o "$RUNNER_TEMP/admin-live.html"
          grep -F 'id="memberEditModal"' "$RUNNER_TEMP/admin-live.html" >/dev/null
          grep -F 'onclick="applyMemberEdit()">수정</button>' "$RUNNER_TEMP/admin-live.html" >/dev/null
          if grep -F '수정 저장' "$RUNNER_TEMP/admin-live.html" >/dev/null; then
            echo 'Live admin still contains old edit/save wording'
            exit 1
          fi

          curl --fail --location --retry 3 --max-time 90 -H 'Cache-Control: no-cache' \
            "$MAIN_URL?mode=user&app=user&verify=$BUST" -o "$RUNNER_TEMP/user-live.html"
          if grep -F 'id="memberEditModal"' "$RUNNER_TEMP/user-live.html" >/dev/null; then
            echo 'Admin edit modal leaked into user mode'
            exit 1
          fi

      - name: Record deployment result
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p deployment/status
          {
            echo 'workflow=Deploy member edit - existing member only'
            echo 'run_id=${{ github.run_id }}'
            echo 'status=${{ job.status }}'
            echo 'head_sha=${{ github.sha }}'
            echo 'mode=existing-member-overwrite-only'
            date -u '+updated_at=%Y-%m-%dT%H:%M:%SZ'
          } > deployment/status/member-edit-live.txt

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment/status/member-edit-live.txt
          if [ '${{ job.status }}' = 'success' ]; then
            git add source-snapshot/current-main/Admin.html \
                    source-snapshot/current-main/Script.html \
                    source-snapshot/current-main/Style.html \
                    source-snapshot/current-main/Code.js || true
          fi
          git commit -m 'Record existing-member edit deployment: ${{ job.status }}' || exit 0
          git pull --rebase origin main || true
          git push origin main
