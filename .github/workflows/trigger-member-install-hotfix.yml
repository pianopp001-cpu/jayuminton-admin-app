name: Trigger member install hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-member-install-hotfix.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch definitive v3 hotfix workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/hotfix-member-install-v3.yml/dispatches \
            -d '{"ref":"main"}'
