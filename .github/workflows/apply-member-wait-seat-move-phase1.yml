name: Apply member wait-seat move phase 1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-member-wait-seat-move-phase1.yml'

permissions:
  contents: write

concurrency:
  group: jayuminton-member-wait-seat-move-phase1
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch source safely
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          sp=Path('source-snapshot/current-main/Script.html')
          cp=Path('source-snapshot/current-main/Code.js')
          s=sp.read_text(encoding='utf-8')
          c=cp.read_text(encoding='utf-8')

          if 'MEMBER_WAIT_SEAT_PICK' not in s:
              a="let LAST_EMPTY_SLOT_TAP = {\n  key: '',\n  tappedAt: 0\n};"
              if a not in s: raise SystemExit('unsafe: Script state anchor missing')
              s=s.replace(a,a+"\nlet MEMBER_WAIT_SEAT_PICK=null;\nlet MEMBER_WAIT_EMPTY_TAP={key:'',tappedAt:0,timer:null};\nlet MEMBER_WAIT_SELF_TAP={memberId:'',tappedAt:0,timer:null};",1)

              a='function renderWaitGroups() {'
              f="""function clearMemberWaitSeatPick(){MEMBER_WAIT_SEAT_PICK=null;}\nfunction memberWaitSeatSessionArgs(){\n  const m=currentStoredWebPushMember();\n  if(!m||!m.id){showMemberSettingMessage('먼저 내 이름을 선택하세요.',true);return null;}\n  const t=currentMemberSessionToken();\n  if(!t){showMemberSettingMessage('회원 인증을 다시 해주세요.',true);return null;}\n  return {member:m,token:t};\n}\nasync function memberMoveToWaitGroup(groupIndex){\n  const a=memberWaitSeatSessionArgs(); if(!a||ACTION_IN_FLIGHT)return;\n  try{const state=await server('memberMoveToWaitGroup',[a.token,String(a.member.id),Number(groupIndex)]);clearMemberWaitSeatPick();renderState(state);}\n  catch(e){clearMemberWaitSeatPick();alert(e.message||e);}\n}\nasync function memberLeaveWaitGroup(){\n  const a=memberWaitSeatSessionArgs(); if(!a||ACTION_IN_FLIGHT)return;\n  try{const state=await server('memberLeaveWaitGroup',[a.token,String(a.member.id)]);clearMemberWaitSeatPick();renderState(state);}\n  catch(e){clearMemberWaitSeatPick();alert(e.message||e);}\n}\nfunction handleMemberWaitSelfTap(groupIndex,memberId,event){\n  if(IS_ADMIN||String(memberId)!==storedSelfMemberId())return;\n  if(event){event.preventDefault();event.stopPropagation();}\n  const now=Date.now(),dbl=MEMBER_WAIT_SELF_TAP.memberId===String(memberId)&&now-MEMBER_WAIT_SELF_TAP.tappedAt<=420;\n  if(MEMBER_WAIT_SELF_TAP.timer)clearTimeout(MEMBER_WAIT_SELF_TAP.timer);\n  MEMBER_WAIT_SELF_TAP={memberId:String(memberId),tappedAt:now,timer:null};\n  if(dbl){MEMBER_WAIT_SELF_TAP={memberId:'',tappedAt:0,timer:null};memberLeaveWaitGroup();return;}\n  MEMBER_WAIT_SELF_TAP.timer=setTimeout(function(){\n    MEMBER_WAIT_SELF_TAP.timer=null;\n    if(MEMBER_WAIT_SEAT_PICK&&MEMBER_WAIT_SEAT_PICK.type==='empty'){const g=MEMBER_WAIT_SEAT_PICK.groupIndex;clearMemberWaitSeatPick();memberMoveToWaitGroup(g);return;}\n    MEMBER_WAIT_SEAT_PICK={type:'self',groupIndex:Number(groupIndex)};\n  },430);\n}\nfunction handleMemberWaitEmptyTap(groupIndex,slotIndex,event){\n  if(IS_ADMIN)return; if(event){event.preventDefault();event.stopPropagation();}\n  if(!memberWaitSeatSessionArgs())return;\n  const key=String(groupIndex)+':'+String(slotIndex),now=Date.now(),dbl=MEMBER_WAIT_EMPTY_TAP.key===key&&now-MEMBER_WAIT_EMPTY_TAP.tappedAt<=420;\n  if(MEMBER_WAIT_EMPTY_TAP.timer)clearTimeout(MEMBER_WAIT_EMPTY_TAP.timer);\n  MEMBER_WAIT_EMPTY_TAP={key:key,tappedAt:now,timer:null};\n  if(dbl){MEMBER_WAIT_EMPTY_TAP={key:'',tappedAt:0,timer:null};memberMoveToWaitGroup(groupIndex);return;}\n  MEMBER_WAIT_EMPTY_TAP.timer=setTimeout(function(){\n    MEMBER_WAIT_EMPTY_TAP.timer=null;\n    if(MEMBER_WAIT_SEAT_PICK&&MEMBER_WAIT_SEAT_PICK.type==='self'){clearMemberWaitSeatPick();memberMoveToWaitGroup(groupIndex);return;}\n    MEMBER_WAIT_SEAT_PICK={type:'empty',groupIndex:Number(groupIndex),slotIndex:Number(slotIndex)};\n  },430);\n}\nfunction memberWaitEmptySlotCard(groupIndex,slotIndex){\n  return '<div class=\\\"person empty\\\" onclick=\\\"handleMemberWaitEmptyTap('+groupIndex+','+slotIndex+',event)\\\" title=\\\"두 번 터치하면 이 대기자리에 들어갑니다\\\"><span class=\\\"empty-slot-label\\\">비어 있음</span></div>';\n}\n"""
              if a not in s: raise SystemExit('unsafe: renderWaitGroups anchor missing')
              s=s.replace(a,f+a,1)

              old="""                if (IS_ADMIN) {\n                  return emptySlotCard('wait', groupIndex, slotIndex);\n                }\n                return memberCard(null, false, false);"""
              new="""                if (IS_ADMIN) {\n                  return emptySlotCard('wait', groupIndex, slotIndex);\n                }\n                return memberWaitEmptySlotCard(groupIndex, slotIndex);"""
              if old not in s: raise SystemExit('unsafe: wait empty anchor missing')
              s=s.replace(old,new,1)

              old="""              if (!IS_ADMIN) {\n                return memberCard(\n                  member,\n                  false,\n                  false\n                );\n              }"""
              new="""              if (!IS_ADMIN) {\n                if (isSelfMember(member)) {\n                  return '<div class=\"person member-info-card ' + genderClass(member) + ' is-self-member\" data-member-id=\"' + member.id + '\" onclick=\"handleMemberWaitSelfTap(' + groupIndex + ',\\\'' + member.id + '\\\',event)\">' + '<span class=\"member-self-star\" aria-label=\"내 이름\">나</span><span class=\"name\">' + escapeMemberInfo(member.name) + '</span>' + memberInfoDetailHtml(member) + '</div>';\n                }\n                return memberCard(member, false, false);\n              }"""
              p=s.find(old)
              p=s.find(old,p+1) if p>=0 else -1
              if p<0: raise SystemExit('unsafe: wait member anchor missing')
              s=s[:p]+new+s[p+len(old):]

              a="    'adjustCourtMembers','adjustWaitGroupMembers',\n    'createManualBackup','restoreManualBackup','changeMemberPassword'"
              b="    'adjustCourtMembers','adjustWaitGroupMembers',\n    'memberMoveToWaitGroup','memberLeaveWaitGroup',\n    'createManualBackup','restoreManualBackup','changeMemberPassword'"
              if a not in s: raise SystemExit('unsafe: mutation anchor missing')
              s=s.replace(a,b,1)

          if 'function memberMoveToWaitGroup(' not in c:
              a='function changeMemberPassword(pin, newPassword) {'
              f="""function memberSessionAuth_(sessionToken,memberId){\n  const session=resumeMemberSession(sessionToken);\n  if(!session||!session.ok)throw new Error('회원 인증이 만료되었습니다. 다시 접속해 주세요.');\n  memberId=String(memberId==null?'':memberId).trim();\n  if(!memberId)throw new Error('본인 정보가 없습니다.');\n  if(!readMembers_().some(function(m){return String(m.id)===memberId;}))throw new Error('회원을 찾을 수 없습니다.');\n  return memberId;\n}\nfunction memberMoveToWaitGroup(sessionToken,memberId,groupIndex){\n  return withDocumentLock_('회원 대기자리 이동',function(){\n    memberId=memberSessionAuth_(sessionToken,memberId); groupIndex=Number(groupIndex);\n    if(groupIndex<0||groupIndex>=WAIT_GROUP_COUNT)throw new Error('잘못된 대기자리입니다.');\n    const courts=readCourts_(),waitGroups=readWaitGroups_();\n    if(Object.keys(courts).some(function(k){return (courts[k]||[]).indexOf(memberId)>=0;}))throw new Error('경기 중에는 대기자리를 직접 변경할 수 없습니다.');\n    const target=(waitGroups[groupIndex]||[]).slice(),already=target.indexOf(memberId)>=0;\n    if(!already&&target.length>=GROUP_SIZE)throw new Error('방금 다른 회원이 선택한 자리예요.');\n    for(let i=0;i<waitGroups.length;i+=1)waitGroups[i]=(waitGroups[i]||[]).filter(function(id){return String(id)!==memberId;});\n    if(!already)waitGroups[groupIndex].push(memberId);\n    writeWaitGroups_(waitGroups);updateMemberStatuses_([memberId],'waiting');touch_();return getPublicState();\n  });\n}\nfunction memberLeaveWaitGroup(sessionToken,memberId){\n  return withDocumentLock_('회원 대기열 나가기',function(){\n    memberId=memberSessionAuth_(sessionToken,memberId);const waitGroups=readWaitGroups_();let found=false;\n    for(let i=0;i<waitGroups.length;i+=1){const before=waitGroups[i].length;waitGroups[i]=(waitGroups[i]||[]).filter(function(id){return String(id)!==memberId;});if(waitGroups[i].length!==before)found=true;}\n    if(!found)throw new Error('현재 대기열에 있는 본인 자리만 해제할 수 있습니다.');\n    writeWaitGroups_(waitGroups);updateMemberStatuses_([memberId],'active');touch_();return getPublicState();\n  });\n}\n"""
              if a not in c: raise SystemExit('unsafe: Code anchor missing')
              c=c.replace(a,f+a,1)

          sp.write_text(s,encoding='utf-8')
          cp.write_text(c,encoding='utf-8')
          PY

      - name: Safety checks and commit
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'MEMBER_WAIT_SEAT_PICK' source-snapshot/current-main/Script.html
          grep -q 'function memberMoveToWaitGroup' source-snapshot/current-main/Code.js
          grep -q '방금 다른 회원이 선택한 자리예요' source-snapshot/current-main/Code.js
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected=$'source-snapshot/current-main/Code.js\nsource-snapshot/current-main/Script.html'
          test "$changed" = "$expected"
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source-snapshot/current-main/Script.html source-snapshot/current-main/Code.js
          git commit -m 'feat: add safe member wait-seat move and leave'
          git push origin HEAD:main
