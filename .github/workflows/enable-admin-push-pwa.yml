          grep -F 'window.__JAYUMINTON_DIRECT_INSTALL_PROMPT = event' "$BUILD_ROOT/web-push/index.html" >/dev/null
          grep -F 'promptResult = promptEvent.prompt()' "$BUILD_ROOT/web-push/setup-v205.js" >/dev/null
          if grep -E 'drive\.google\.com|docs\.google\.com|S\.browser_fallback_url|intent://' "$BUILD_ROOT/web-push/setup-v205.js" >/dev/null; then
            echo 'Forbidden external/Drive install route remains'; exit 1
          fi

      - name: Deploy Firebase Hosting
        working-directory: ${{ env.BUILD_ROOT }}
