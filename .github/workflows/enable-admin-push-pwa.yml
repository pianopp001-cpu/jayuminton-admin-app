name: Deploy APK admin live fixes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enable-admin-push-pwa.yml'

permissions:
  contents: write

concurrency:
  group: jayuminton-apk-admin-live-fix
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install --global @google/clasp@latest

      - name: Read deploy config
        shell: bash
        run: |
          set -euo pipefail
          CONFIG="$RUNNER_TEMP/deploy.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$CONFIG"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          jq -e '.mainScriptId and .mainDeploymentId' "$CONFIG" >/dev/null
          {
            echo "MAIN_SCRIPT_ID=$(jq -r '.mainScriptId' "$CONFIG")"
            echo "MAIN_DEPLOYMENT_ID=$(jq -r '.mainDeploymentId' "$CONFIG")"
            echo "MAIN_URL=https://script.google.com/macros/s/$(jq -r '.mainDeploymentId' "$CONFIG")/exec"
          } >> "$GITHUB_ENV"

      - name: Pull and patch live MAIN
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/main-live"
          rm -rf "$WORK" && mkdir -p "$WORK"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$MAIN_SCRIPT_ID" > "$WORK/.clasp.json"
          cd "$WORK"
          clasp pull

          python3 - <<'PY'
          from pathlib import Path
          import re

          def extract_block(src, start_idx):
              brace = src.find('{', start_idx)
              if brace < 0:
                  raise SystemExit('opening brace missing')
              depth = 0
              i = brace
              while i < len(src):
                  if src[i] == '{': depth += 1
                  elif src[i] == '}':
                      depth -= 1
                      if depth == 0:
                          return src[start_idx:i+1], start_idx, i+1
                  i += 1
              raise SystemExit('unbalanced braces')

          # ---------------- Script.html ----------------
          p = Path('Script.html')
          s = p.read_text(encoding='utf-8')
          end = s.rfind('</script>')
          if end < 0:
              raise SystemExit('Script.html closing tag missing')
          s = s[:end + len('</script>')] + '\n'

          init = s.find('async function initialize() {')
          if init < 0:
              raise SystemExit('initialize() missing')
          block, bstart, bend = extract_block(s, init)
          if 'JAYUMINTON_NATIVE_FORCE_LOGIN_V1' not in block:
              needle = '  if (IS_ADMIN) {'
              if needle not in block:
                  raise SystemExit('admin initialize branch missing')
              replacement = '''  if (IS_ADMIN) {
    /* JAYUMINTON_NATIVE_FORCE_LOGIN_V1 */
    if (window.NativeVoice || window.__JAYUMINTON_NATIVE_APP__) {
      try { localStorage.removeItem(ADMIN_AUTH_KEY); } catch (error) {}
      try { sessionStorage.removeItem(ADMIN_AUTH_KEY); } catch (error) {}
      ADMIN_PIN_VALUE = '';
      return;
    }'''
              block = block.replace(needle, replacement, 1)
              s = s[:bstart] + block + s[bend:]

          a = s.find('function memberLongPressAttributes(memberId) {')
          if a < 0:
              raise SystemExit('memberLongPressAttributes missing')
          block, bstart, bend = extract_block(s, a)
          if "if (!IS_ADMIN) return '';" not in block:
              block = block.replace('{', "{\n  if (!IS_ADMIN) return '';", 1)
              s = s[:bstart] + block + s[bend:]

          a = s.find('function startMemberLongPress(memberId, event) {')
          if a < 0:
              raise SystemExit('startMemberLongPress missing')
          block, bstart, bend = extract_block(s, a)
          if 'if (!IS_ADMIN) return;' not in block[:140]:
              block = block.replace('{', '{\n  if (!IS_ADMIN) return;', 1)
              s = s[:bstart] + block + s[bend:]

          if 'let EDIT_MEMBER_ID' not in s:
              state_anchor = 'let MEMBER_ACTION_IDS = [];'
              if state_anchor not in s:
                  raise SystemExit('MEMBER_ACTION_IDS missing')
              s = s.replace(state_anchor, state_anchor + '\nlet EDIT_MEMBER_ID = null;', 1)

          if 'function startMemberEdit()' not in s:
              add_anchor = 'async function addMember() {'
              if add_anchor not in s:
                  raise SystemExit('addMember() missing')
              edit_js = r'''
function startMemberEdit() {
  if (!IS_ADMIN) return;
  if (MEMBER_ACTION_IDS.length !== 1) {
    alert('편집은 한 명만 선택했을 때 가능합니다.');
    return;
  }
  const member = memberById(MEMBER_ACTION_IDS[0]);
  if (!member) return;
  EDIT_MEMBER_ID = String(member.id);
  const nameInput = document.getElementById('newName');
  const genderInput = document.getElementById('newGender');
  const gradeInput = document.getElementById('newGrade');
  const experienceInput = document.getElementById('newExperience');
  const button = document.getElementById('addMemberButton');
  if (nameInput) nameInput.value = String(member.name || '');
  if (genderInput) genderInput.value = member.gender === 'female' ? 'female' : 'male';
  if (gradeInput) gradeInput.value = String(member.grade || '');
  if (experienceInput) experienceInput.value = String(member.experience || '');
  if (button) button.textContent = '수정 저장';
  closeMemberActionBar();
  const details = document.querySelector('.admin-setup-details');
  if (details) details.open = true;
  if (nameInput) {
    nameInput.scrollIntoView({behavior:'smooth', block:'center'});
    setTimeout(function() { nameInput.focus(); nameInput.select(); }, 150);
  }
}

function cancelMemberEdit() {
  EDIT_MEMBER_ID = null;
  const button = document.getElementById('addMemberButton');
  if (button) button.textContent = '등록';
  ['newName','newGrade','newExperience'].forEach(function(id) {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
  const gender = document.getElementById('newGender');
  if (gender) gender.value = '';
}

async function saveMemberEdit() {
  if (!IS_ADMIN || !EDIT_MEMBER_ID || ADD_MEMBER_IN_FLIGHT) return;
  const nameInput = document.getElementById('newName');
  const genderInput = document.getElementById('newGender');
  const gradeInput = document.getElementById('newGrade');
  const experienceInput = document.getElementById('newExperience');
  const button = document.getElementById('addMemberButton');
  const name = String(nameInput && nameInput.value || '').trim();
  const gender = String(genderInput && genderInput.value || '');
  const grade = String(gradeInput && gradeInput.value || '').trim();
  const experience = String(experienceInput && experienceInput.value || '').trim();
  if (!name) { alert('이름 또는 닉네임을 입력하세요.'); if (nameInput) nameInput.focus(); return; }
  if (!gender) { alert('성별을 선택하세요.'); if (genderInput) genderInput.focus(); return; }
  ADD_MEMBER_IN_FLIGHT = true;
  if (button) { button.disabled = true; button.textContent = '저장 중…'; }
  try {
    const state = await server('updateMemberProfile', [
      ADMIN_PIN_VALUE, EDIT_MEMBER_ID, name, gender, grade, experience
    ]);
    cancelMemberEdit();
    renderState(state);
  } catch (error) {
    alert(String((error && error.message) || error || '수정에 실패했습니다.'));
  } finally {
    ADD_MEMBER_IN_FLIGHT = false;
    if (button) button.disabled = false;
  }
}

'''
              s = s.replace(add_anchor, edit_js + add_anchor, 1)

          if 'if (EDIT_MEMBER_ID) return saveMemberEdit();' not in s:
              s, count = re.subn(
                  r'async function addMember\(\) \{\s*',
                  'async function addMember() {\n  if (EDIT_MEMBER_ID) return saveMemberEdit();\n  ',
                  s,
                  count=1,
              )
              if count != 1:
                  raise SystemExit('could not patch addMember edit delegation')

          if "'updateMemberProfile'" not in s:
              mutation_anchor = "'createManualBackup','restoreManualBackup','changeMemberPassword'"
              if mutation_anchor in s:
                  s = s.replace(
                      mutation_anchor,
                      mutation_anchor + ",'updateMemberProfile'",
                      1,
                  )

          if 'JAYUMINTON_ADMIN_PUSH_APP_BUTTON_V3' not in s:
              insert = s.rfind('</script>')
              launcher = r'''

/* JAYUMINTON_ADMIN_PUSH_APP_BUTTON_V3 */
(function() {
  function openPushApp() {
    const url = 'https://jayuminton-push.web.app/?source=admin-apk';
    try { window.location.assign(url); }
    catch (error) { window.location.href = url; }
  }
  function mount() {
    if (!IS_ADMIN) return;
    const host = document.querySelector('#adminApp header .wrap.toolbar');
    if (!host || document.getElementById('adminPushAppButton')) return;
    const button = document.createElement('button');
    button.id = 'adminPushAppButton';
    button.type = 'button';
    button.className = 'ghost-button';
    button.textContent = '📱 푸시앱';
    button.style.cssText = 'white-space:nowrap;background:#315efb;color:#fff;border-color:#315efb;font-weight:900;';
    button.addEventListener('click', openPushApp);
    const menu = host.querySelector('.top-admin-menu');
    host.insertBefore(button, menu || null);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount);
  else mount();
  setTimeout(mount, 500);
})();
'''
              s = s[:insert] + launcher + s[insert:]

          p.write_text(s, encoding='utf-8')

          # ---------------- Code.js ----------------
          p = Path('Code.js')
          c = p.read_text(encoding='utf-8')
          if 'function updateMemberProfile(' not in c:
              anchor = 'function addMember(pin, name, gender, grade, experience) {'
              if anchor not in c:
                  raise SystemExit('Code.js addMember anchor missing')
              fn = r'''
function updateMemberProfile(pin, memberId, name, gender, grade, experience) {
  auth_(pin);
  return withDocumentLock_('멤버 편집', function() {
    memberId = String(memberId == null ? '' : memberId).trim();
    name = String(name == null ? '' : name).trim();
    gender = String(gender == null ? '' : gender).trim();
    grade = String(grade == null ? '' : grade).trim();
    experience = String(experience == null ? '' : experience).trim();
    if (!memberId) throw new Error('편집할 멤버가 없습니다.');
    if (!name) throw new Error('이름 또는 닉네임을 입력하세요.');
    if (name.length > 20) throw new Error('이름은 20자 이내로 입력하세요.');
    if (gender !== 'male' && gender !== 'female') throw new Error('성별을 선택하세요.');
    if (grade.length > 12) throw new Error('급수는 12자 이내로 입력하세요.');
    if (experience.length > 20) throw new Error('구력은 20자 이내로 입력하세요.');
    const members = readMembers_();
    const member = members.find(function(item) { return String(item.id) === memberId; });
    if (!member) throw new Error('멤버를 찾을 수 없습니다.');
    const duplicate = members.some(function(item) {
      return String(item.id) !== memberId && String(item.name || '').trim() === name;
    });
    if (duplicate) throw new Error('같은 이름의 멤버가 이미 있습니다.');
    member.name = name;
    member.gender = gender;
    member.grade = grade;
    member.experience = experience;
    writeMembers_(members);
    touch_();
    return getPublicState();
  });
}

'''
              c = c.replace(anchor, fn + anchor, 1)
          p.write_text(c, encoding='utf-8')

          # ---------------- Admin.html ----------------
          p = Path('Admin.html')
          h = p.read_text(encoding='utf-8')
          pattern = re.compile(r'(<div id="quickMoveBar" class="quick-move-bar hidden">)(.*?)(</div>)', re.S)
          m = pattern.search(h)
          if not m:
              raise SystemExit('quickMoveBar missing')
          body = '''
    <strong id="quickMoveName">선택 인원</strong>
    <span>길게 누른 멤버 관리</span>
    <button onclick="sendQuickPickToActive()">배정대기로</button>
    <button class="danger" onclick="deleteQuickPickedMembers()">삭제</button>
    <button class="ghost-button" onclick="closeMemberActionBar()">취소</button>
    <button onclick="startMemberEdit()">편집</button>
  '''
          h = h[:m.start()] + m.group(1) + body + m.group(3) + h[m.end():]
          p.write_text(h, encoding='utf-8')
          PY

          grep -F 'JAYUMINTON_NATIVE_FORCE_LOGIN_V1' Script.html >/dev/null
          grep -F 'function startMemberEdit()' Script.html >/dev/null
          grep -F 'function updateMemberProfile(' Code.js >/dev/null
          grep -F '>배정대기로</button>' Admin.html >/dev/null
          grep -F '>삭제</button>' Admin.html >/dev/null
          grep -F '>취소</button>' Admin.html >/dev/null
          grep -F '>편집</button>' Admin.html >/dev/null

          clasp push --force
          clasp create-deployment --deploymentId "$MAIN_DEPLOYMENT_ID" --description "APK admin login + longpress edit ${GITHUB_SHA::7}"

          cp Script.html "$GITHUB_WORKSPACE/source-snapshot/current-main/Script.html"
          cp Code.js "$GITHUB_WORKSPACE/source-snapshot/current-main/Code.js"
          cp Admin.html "$GITHUB_WORKSPACE/source-snapshot/current-main/Admin.html"

      - name: Verify live admin endpoint
        shell: bash
        run: |
          set -euo pipefail
          sleep 8
          BODY="$RUNNER_TEMP/admin-live.html"
          curl --fail --location --retry 5 --retry-delay 3 --max-time 90 \
            -H 'Cache-Control: no-cache' \
            "$MAIN_URL?mode=admin&verify=$GITHUB_RUN_ID" > "$BODY"
          grep -F 'JAYUMINTON_NATIVE_FORCE_LOGIN_V1' "$BODY" >/dev/null
          grep -F 'function startMemberEdit()' "$BODY" >/dev/null
          grep -F 'onclick="startMemberEdit()"' "$BODY" >/dev/null
          grep -F '>배정대기로</button>' "$BODY" >/dev/null
          grep -F '>삭제</button>' "$BODY" >/dev/null
          grep -F '>취소</button>' "$BODY" >/dev/null
          grep -F '>편집</button>' "$BODY" >/dev/null

      - name: Sync live snapshot
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- source-snapshot/current-main/Script.html source-snapshot/current-main/Code.js source-snapshot/current-main/Admin.html; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source-snapshot/current-main/Script.html source-snapshot/current-main/Code.js source-snapshot/current-main/Admin.html
          git commit -m 'Sync APK admin login and long-press live fixes'
          git pull --rebase origin main || true
          git push origin main

      - name: Record live deploy result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deployment/jayuminton
          printf 'status=%s\ncommit=%s\nrun=%s\n' '${{ job.status }}' "$GITHUB_SHA" "$GITHUB_RUN_ID" \
            > deployment/jayuminton/APK_ADMIN_LIVE_RESULT.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment/jayuminton/APK_ADMIN_LIVE_RESULT.txt
          git commit -m "Record APK admin live deploy: ${{ job.status }}" || exit 0
          git pull --rebase origin main || true
          git push origin main || true
