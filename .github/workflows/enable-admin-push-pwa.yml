      - name: Verify live MAIN and PWA
        shell: bash
        run: |
          set -euo pipefail
          sleep 10
          BASE="${HOSTING_URL%/}"
          BUST="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-native4"

          curl --fail --location -H 'Cache-Control: no-cache' "$MAIN_URL?mode=admin&verify=$BUST" > "$RUNNER_TEMP/admin-live"
          for text in '배정대기로' '삭제' '취소' '편집' 'startMemberEdit()'; do grep -F "$text" "$RUNNER_TEMP/admin-live" >/dev/null; done

          curl --fail --location -H 'Cache-Control: no-cache' "$MAIN_URL?mode=user&app=user&verify=$BUST" > "$RUNNER_TEMP/user-live"
          if grep -F 'onclick="startMemberEdit()"' "$RUNNER_TEMP/user-live" >/dev/null; then echo 'Admin edit leaked into user HTML'; exit 1; fi

          FINAL="$RUNNER_TEMP/final-url"
          curl --fail --location -H 'Cache-Control: no-cache' --write-out '%{url_effective}' --output "$RUNNER_TEMP/index-live" "$BASE/?verify=$BUST" > "$FINAL"
          if grep -Eiq 'drive\.google\.com|docs\.google\.com' "$FINAL"; then echo 'Firebase redirected to Drive'; cat "$FINAL"; exit 1; fi
          curl --fail --location -H 'Cache-Control: no-cache' "$BASE/setup-v205.js?v=$BUST" > "$RUNNER_TEMP/setup-live"
          curl --fail --location -H 'Cache-Control: no-cache' "$BASE/manifest.webmanifest?v=$BUST" > "$RUNNER_TEMP/manifest-live"
          grep -F 'JAYUMINTON_NATIVE_PWA_INSTALL_PROXY_V4' "$RUNNER_TEMP/index-live" >/dev/null
          grep -F '"display": "standalone"' "$RUNNER_TEMP/manifest-live" >/dev/null
          if grep -E 'drive\.google\.com|docs\.google\.com|S\.browser_fallback_url|intent://' "$RUNNER_TEMP/setup-live" >/dev/null; then exit 1; fi

      - name: Sync patched MAIN snapshot
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- source-snapshot/current-main/Script.html source-snapshot/current-main/Code.js source-snapshot/current-main/Admin.html; then
