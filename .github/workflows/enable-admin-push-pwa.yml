name: Enable admin push launcher and PWA install

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enable-admin-push-pwa.yml'
  workflow_run:
    workflows: ['Continue exact Jayuminton v1.6.37 restore']
    types: [completed]

permissions:
  contents: write

concurrency:
  group: jayuminton-admin-push-pwa-live
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install --global @google/clasp@latest firebase-tools@latest

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Read deploy config
        shell: bash
        run: |
          set -euo pipefail
          CONFIG="$RUNNER_TEMP/deploy.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$CONFIG"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          jq -e '.mainScriptId and .mainDeploymentId and .pushDeploymentId and .firebaseProjectId and .hostingUrl' "$CONFIG" >/dev/null
          {
            echo "MAIN_SCRIPT_ID=$(jq -r '.mainScriptId' "$CONFIG")"
            echo "MAIN_DEPLOYMENT_ID=$(jq -r '.mainDeploymentId' "$CONFIG")"
            echo "MAIN_URL=https://script.google.com/macros/s/$(jq -r '.mainDeploymentId' "$CONFIG")/exec"
            echo "PUSH_URL=https://script.google.com/macros/s/$(jq -r '.pushDeploymentId' "$CONFIG")/exec"
            echo "FIREBASE_PROJECT_ID=$(jq -r '.firebaseProjectId' "$CONFIG")"
            echo "HOSTING_URL=$(jq -r '.hostingUrl' "$CONFIG")"
            echo "BUILD_ROOT=$RUNNER_TEMP/jayuminton-pwa-on"
          } >> "$GITHUB_ENV"

      - name: Add admin push-app launcher to MAIN Script.html
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/main-push-launcher"
          rm -rf "$WORK" && mkdir -p "$WORK"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$MAIN_SCRIPT_ID" > "$WORK/.clasp.json"
          cd "$WORK"
          clasp pull

          python3 - <<'PY'
          from pathlib import Path

          p = Path('Script.html')
          s = p.read_text(encoding='utf-8')
          marker = 'JAYUMINTON_ADMIN_PUSH_APP_BUTTON_V1'

          if marker not in s:
              end = s.rfind('</script>')
              if end < 0:
                  raise SystemExit('Script.html closing tag missing')

              patch = r'''

/* JAYUMINTON_ADMIN_PUSH_APP_BUTTON_V1 */
(function installJayumintonAdminPushAppButton() {
  const PUSH_APP_URL = 'https://jayuminton-push.web.app/';

  function openJayumintonPushApp() {
    let opened = null;
    try {
      opened = window.open(PUSH_APP_URL, '_blank', 'noopener,noreferrer');
    } catch (error) {}
    if (!opened) {
      try { window.location.href = PUSH_APP_URL; } catch (error) {}
    }
  }

  window.openJayumintonPushApp = openJayumintonPushApp;

  function mountJayumintonPushButton() {
    const adminApp = document.getElementById('adminApp');
    if (!adminApp) return;
    const host = adminApp.querySelector('header .wrap.toolbar');
    if (!host || document.getElementById('adminPushAppButton')) return;

    const button = document.createElement('button');
    button.id = 'adminPushAppButton';
    button.type = 'button';
    button.className = 'ghost-button admin-push-app-button';
    button.textContent = '📱 푸시앱';
    button.title = '자유민턴 푸시앱 열기';
    button.setAttribute('aria-label', '자유민턴 푸시앱 열기');
    button.style.cssText = 'white-space:nowrap;background:#315efb;color:#fff;border-color:#315efb;font-weight:900;';
    button.addEventListener('click', openJayumintonPushApp);

    const menu = host.querySelector('.top-admin-menu');
    host.insertBefore(button, menu || null);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', mountJayumintonPushButton);
  } else {
    mountJayumintonPushButton();
  }

  const observer = new MutationObserver(mountJayumintonPushButton);
  observer.observe(document.documentElement, { childList: true, subtree: true });
  setTimeout(function() { observer.disconnect(); }, 15000);
})();
'''
              s = s[:end] + patch + s[end:]
              p.write_text(s, encoding='utf-8')

          if marker not in p.read_text(encoding='utf-8'):
              raise SystemExit('admin push-app button patch failed')
          PY

          clasp push --force
          clasp create-deployment --deploymentId "$MAIN_DEPLOYMENT_ID" --description "admin push-app launcher ${GITHUB_SHA::7}"

          cp Script.html "$GITHUB_WORKSPACE/source-snapshot/current-main/Script.html"

      - name: Sync patched Script.html snapshot
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- source-snapshot/current-main/Script.html; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source-snapshot/current-main/Script.html
          git commit -m 'Sync admin push-app launcher into Script snapshot'
          git pull --rebase origin main
          git push origin main

      - name: Build PWA with install enabled
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$BUILD_ROOT" && mkdir -p "$BUILD_ROOT/web-push"
          cp deployment/jayuminton/firebase.json "$BUILD_ROOT/firebase.json"
          cp deployment/jayuminton/v1637-web/index.html "$BUILD_ROOT/web-push/index.html"
          cp deployment/jayuminton/v1637-web/setup-v205.css "$BUILD_ROOT/web-push/setup-v205.css"
          cp deployment/jayuminton/v1637-web/manifest.webmanifest "$BUILD_ROOT/web-push/manifest.webmanifest"
          cp deployment/jayuminton/v1637-web/firebase-messaging-sw.js "$BUILD_ROOT/web-push/firebase-messaging-sw.js"
          cat deployment/jayuminton/v1637-web/setup-v205.js.gz.b64.part-* | tr -d '\r\n' | base64 -d > "$RUNNER_TEMP/setup-v205.js.gz"
          gzip -dc "$RUNNER_TEMP/setup-v205.js.gz" > "$BUILD_ROOT/web-push/setup-v205.js"

          python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ['BUILD_ROOT']) / 'web-push'
          idx = root / 'index.html'
          s = idx.read_text(encoding='utf-8')

          marker = 'JAYUMINTON_VISIBLE_PWA_INSTALL_V1'
          if marker not in s:
              head_patch = r'''
  <!-- JAYUMINTON_VISIBLE_PWA_INSTALL_V1 -->
  <style>
    #jayumintonPwaInstallButton {
      position: fixed;
      right: 14px;
      bottom: calc(14px + env(safe-area-inset-bottom));
      z-index: 9999;
      min-height: 44px;
      padding: 0 16px;
      border: 0;
      border-radius: 999px;
      background: #315efb;
      color: #fff;
      font: 900 14px/1 -apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;
      box-shadow: 0 10px 28px rgba(49,94,251,.30);
      cursor: pointer;
    }
    #jayumintonPwaInstallButton[hidden] { display: none !important; }
  </style>
  <script>
  (() => {
    let deferredPwaInstallPrompt = null;

    function isStandalone() {
      return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    }

    function installButton() {
      return document.getElementById('jayumintonPwaInstallButton');
    }

    function refreshInstallButton() {
      const button = installButton();
      if (!button) return;
      button.hidden = isStandalone() || !deferredPwaInstallPrompt;
    }

    window.addEventListener('beforeinstallprompt', (event) => {
      event.preventDefault();
      deferredPwaInstallPrompt = event;
      refreshInstallButton();
    });

    window.addEventListener('appinstalled', () => {
      deferredPwaInstallPrompt = null;
      refreshInstallButton();
    });

    window.addEventListener('DOMContentLoaded', () => {
      if (window.__JAYUMINTON_EARLY_INSTALL_PROMPT) {
        deferredPwaInstallPrompt = window.__JAYUMINTON_EARLY_INSTALL_PROMPT;
      }
      refreshInstallButton();

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/firebase-messaging-sw.js', { scope: '/' }).catch(() => {});
      }

      const button = installButton();
      if (!button) return;
      button.addEventListener('click', async () => {
        const promptEvent = deferredPwaInstallPrompt || window.__JAYUMINTON_EARLY_INSTALL_PROMPT;
        if (!promptEvent) {
          refreshInstallButton();
          return;
        }
        button.disabled = true;
        try {
          await promptEvent.prompt();
          await promptEvent.userChoice;
        } catch (_) {}
        deferredPwaInstallPrompt = null;
        window.__JAYUMINTON_EARLY_INSTALL_PROMPT = null;
        button.disabled = false;
        refreshInstallButton();
      });
    });
  })();
  </script>
'''
              body_patch = '\n  <button id="jayumintonPwaInstallButton" type="button" hidden aria-label="자유민턴 앱 설치">📲 앱 설치</button>\n'
              s = s.replace('</head>', head_patch + '</head>', 1)
              s = s.replace('<main class="court-shell">', body_patch + '  <main class="court-shell">', 1)

          s = s.replace('/setup-v205.js?v=1637', '/setup-v205.js?v=1637-pwa-on1')
          s = s.replace('/config-v204.js?v=1637', '/config-v204.js?v=1637-pwa-on1')
          idx.write_text(s, encoding='utf-8')

          template = Path('deployment/jayuminton/v1637-web/config-v204.template.js').read_text(encoding='utf-8')
          cfg = template.replace('__MEMBER_PAGE_URL__', os.environ['MAIN_URL']).replace('__RELAY_URL__', os.environ['PUSH_URL'])
          for name in ('config-v202.js', 'config-v203.js', 'config-v204.js'):
              (root / name).write_text(cfg, encoding='utf-8')

          sw = root / 'firebase-messaging-sw.js'
          t = sw.read_text(encoding='utf-8')
          t = t.replace("const JAYUMINTON_SW_VERSION = '1.6.37';", "const JAYUMINTON_SW_VERSION = '1.6.37-pwa-on1';")
          t = t.replace("const JAYUMINTON_CACHE = 'jayuminton-shell-v205';", "const JAYUMINTON_CACHE = 'jayuminton-shell-v219';")
          sw.write_text(t, encoding='utf-8')
          PY

          node --check "$BUILD_ROOT/web-push/setup-v205.js"
          grep -F 'JAYUMINTON_VISIBLE_PWA_INSTALL_V1' "$BUILD_ROOT/web-push/index.html" >/dev/null
          grep -F 'navigator.serviceWorker.register' "$BUILD_ROOT/web-push/index.html" >/dev/null
          grep -F 'beforeinstallprompt' "$BUILD_ROOT/web-push/index.html" >/dev/null
          grep -F '"display": "standalone"' "$BUILD_ROOT/web-push/manifest.webmanifest" >/dev/null
          grep -F '"start_url": "/?app=user&mode=user&source=pwa"' "$BUILD_ROOT/web-push/manifest.webmanifest" >/dev/null
          grep -F '"scope": "/"' "$BUILD_ROOT/web-push/manifest.webmanifest" >/dev/null

          BASE="${HOSTING_URL%/}"
          for a in icon-198.png icon-512.png apple-touch-icon-180.png badge-96.png; do
            curl --fail --location --retry 3 --max-time 60 "$BASE/$a?src=$GITHUB_RUN_ID" -o "$BUILD_ROOT/web-push/$a"
            test -s "$BUILD_ROOT/web-push/$a"
          done

      - name: Deploy Firebase Hosting
        working-directory: ${{ env.BUILD_ROOT }}
        run: firebase deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive --message "PWA install ON ${GITHUB_SHA::7}"

      - name: Verify live PWA
        shell: bash
        run: |
          set -euo pipefail
          sleep 8
          BASE="${HOSTING_URL%/}"
          BUST="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-pwa-on1"
          curl --fail --location -H 'Cache-Control: no-cache' "$BASE/?v=$BUST" > "$RUNNER_TEMP/index-live"
          curl --fail --location -H 'Cache-Control: no-cache' "$BASE/manifest.webmanifest?v=$BUST" > "$RUNNER_TEMP/manifest-live"
          curl --fail --location -H 'Cache-Control: no-cache' "$BASE/firebase-messaging-sw.js?v=$BUST" > "$RUNNER_TEMP/sw-live"
          grep -F 'JAYUMINTON_VISIBLE_PWA_INSTALL_V1' "$RUNNER_TEMP/index-live" >/dev/null
          grep -F '📲 앱 설치' "$RUNNER_TEMP/index-live" >/dev/null
          grep -F '"display": "standalone"' "$RUNNER_TEMP/manifest-live" >/dev/null
          grep -F "1.6.37-pwa-on1" "$RUNNER_TEMP/sw-live" >/dev/null
