name: Deploy Jayuminton v199.5 user admin PWA fixes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enable-admin-push-pwa.yml'
  workflow_run:
    workflows: ['Continue exact Jayuminton v1.6.37 restore']
    types: [completed]

permissions:
  contents: write

concurrency:
  group: jayuminton-v1995-live-fixes
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install --global @google/clasp@latest firebase-tools@latest

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Read deploy config
        shell: bash
        run: |
          set -euo pipefail
          CONFIG="$RUNNER_TEMP/deploy.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$CONFIG"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          jq -e '.mainScriptId and .mainDeploymentId and .pushDeploymentId and .firebaseProjectId and .hostingUrl' "$CONFIG" >/dev/null
          {
            echo "MAIN_SCRIPT_ID=$(jq -r '.mainScriptId' "$CONFIG")"
            echo "MAIN_DEPLOYMENT_ID=$(jq -r '.mainDeploymentId' "$CONFIG")"
            echo "MAIN_URL=https://script.google.com/macros/s/$(jq -r '.mainDeploymentId' "$CONFIG")/exec"
            echo "PUSH_URL=https://script.google.com/macros/s/$(jq -r '.pushDeploymentId' "$CONFIG")/exec"
            echo "FIREBASE_PROJECT_ID=$(jq -r '.firebaseProjectId' "$CONFIG")"
            echo "HOSTING_URL=$(jq -r '.hostingUrl' "$CONFIG")"
            echo "BUILD_ROOT=$RUNNER_TEMP/jayuminton-v1995"
          } >> "$GITHUB_ENV"

      - name: Patch and deploy live Apps Script
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/main-live"
          rm -rf "$WORK" && mkdir -p "$WORK"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$MAIN_SCRIPT_ID" > "$WORK/.clasp.json"
          cd "$WORK"
          clasp pull

          python3 - <<'PY'
          from pathlib import Path
          import re

          def function_range(src, signature):
              start = src.find(signature)
              if start < 0:
                  return None
              brace = src.find('{', start)
              if brace < 0:
                  raise SystemExit('opening brace missing for ' + signature)
              depth = 0
              quote = None
              escape = False
              i = brace
              while i < len(src):
                  ch = src[i]
                  if quote:
                      if escape:
                          escape = False
                      elif ch == '\\':
                          escape = True
                      elif ch == quote:
                          quote = None
                  else:
                      if ch in ('"', "'", '`'):
                          quote = ch
                      elif ch == '{':
                          depth += 1
                      elif ch == '}':
                          depth -= 1
                          if depth == 0:
                              return start, i + 1
                  i += 1
              raise SystemExit('unbalanced function ' + signature)

          def replace_function(src, signature, replacement):
              rng = function_range(src, signature)
              if not rng:
                  return src, False
              a, b = rng
              return src[:a] + replacement + src[b:], True

          # ---------- Script.html ----------
          p = Path('Script.html')
          s = p.read_text(encoding='utf-8')
          end = s.rfind('</script>')
          if end < 0:
              raise SystemExit('Script.html closing tag missing')
          s = s[:end + len('</script>')] + '\n'

          # User mode must never receive administrator long-press edit/delete controls.
          sig = 'function memberLongPressAttributes(memberId) {'
          rng = function_range(s, sig)
          if not rng:
              raise SystemExit('memberLongPressAttributes missing')
          a, b = rng
          block = s[a:b]
          if "if (!IS_ADMIN) return '';" not in block:
              block = block.replace('{', "{\n  if (!IS_ADMIN) return '';", 1)
              s = s[:a] + block + s[b:]

          sig = 'function startMemberLongPress(memberId, event) {'
          rng = function_range(s, sig)
          if not rng:
              raise SystemExit('startMemberLongPress missing')
          a, b = rng
          block = s[a:b]
          if 'if (!IS_ADMIN) return;' not in block[:180]:
              block = block.replace('{', '{\n  if (!IS_ADMIN) return;', 1)
              s = s[:a] + block + s[b:]

          # Foreground vibration: each cue is exactly three strong pulses.
          vibration_repeat = """function memberAlertRepeatCount(type) {
            if (type === 'court_assignment') return 4;
            if (type === 'wait1_ready') return 2;
            return 1;
          }"""
          s, found = replace_function(s, 'function memberAlertRepeatCount(type) {', vibration_repeat)
          if not found:
              raise SystemExit('memberAlertRepeatCount missing')

          vibration_pattern = """function memberVibrationPattern() {
            return [380, 180, 380, 180, 380];
          }"""
          s, found = replace_function(s, 'function memberVibrationPattern() {', vibration_pattern)
          if not found:
              raise SystemExit('memberVibrationPattern missing')
          s = s.replace('}, index * 1300);', '}, index * 2000);')

          # The member install button only talks to the Firebase top page. No intent or Drive route.
          install_request = """function requestMemberAppInstall() {
            publishMemberAppInstallButtonRect();
            if (MEMBER_PWA_STANDALONE_HINT || MEMBER_APP_INSTALL_STATE.installed) {
              MEMBER_APP_INSTALL_STATE.installed = true;
              MEMBER_APP_INSTALL_STATE.choice = 'on';
              MEMBER_APP_INSTALL_STATE.browserContext = 'standalone';
              renderMemberSelfSettings();
              showMemberSettingMessage('자유민턴 앱이 이미 설치되어 있습니다.');
              return;
            }
            const sent = postUnifiedMemberMessage('JAYUMINTON_APP_INSTALL_REQUEST', {
              platform: detectMemberInstallPlatform(),
              browserContext: detectMemberInstallBrowserContext(),
              installUrl: 'https://jayuminton-push.web.app/'
            });
            if (sent) {
              showMemberSettingMessage('화면 아래의 앱 설치 버튼을 눌러 주세요.');
              return;
            }
            showMemberSettingMessage('Chrome에서 jayuminton-push.web.app 주소를 열어 설치해 주세요.', true);
          }"""
          s, found = replace_function(s, 'function requestMemberAppInstall() {', install_request)
          if not found:
              raise SystemExit('requestMemberAppInstall missing')

          # Reliable dedicated edit modal: name, gender, grade and experience.
          edit_code = r'''
function closeMemberEdit() {
  const modal = document.getElementById('memberEditModal');
  if (modal) modal.remove();
}

function startMemberEdit() {
  if (!IS_ADMIN) return;
  if (!Array.isArray(MEMBER_ACTION_IDS) || MEMBER_ACTION_IDS.length !== 1) {
    alert('편집할 멤버 한 명을 길게 눌러 주세요.');
    return;
  }
  const memberId = String(MEMBER_ACTION_IDS[0]);
  const member = (STATE.members || []).find(function(item) {
    return String(item.id) === memberId;
  });
  if (!member) {
    alert('멤버 정보를 찾을 수 없습니다.');
    return;
  }

  closeMemberActionBar();
  closeMemberEdit();

  const modal = document.createElement('div');
  modal.id = 'memberEditModal';
  modal.style.cssText = 'position:fixed;inset:0;z-index:2147483000;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:16px;';
  modal.innerHTML = `
    <div style="width:min(430px,100%);background:#fff;border-radius:18px;padding:18px;box-shadow:0 24px 70px rgba(0,0,0,.28)">
      <h2 style="margin:0 0 14px">멤버 편집</h2>
      <label style="display:block;font-weight:800;margin:8px 0 5px">이름</label>
      <input id="editMemberName" maxlength="20" style="width:100%" value="">
      <label style="display:block;font-weight:800;margin:12px 0 5px">성별</label>
      <select id="editMemberGender" style="width:100%">
        <option value="male">남자</option>
        <option value="female">여자</option>
      </select>
      <label style="display:block;font-weight:800;margin:12px 0 5px">급수</label>
      <input id="editMemberGrade" maxlength="12" style="width:100%" value="">
      <label style="display:block;font-weight:800;margin:12px 0 5px">구력</label>
      <input id="editMemberExperience" maxlength="20" style="width:100%" value="">
      <div style="display:flex;gap:8px;margin-top:18px">
        <button type="button" class="ghost-button" style="flex:1" onclick="closeMemberEdit()">취소</button>
        <button type="button" class="primary" style="flex:1" onclick="saveMemberEdit('${memberId.replace(/'/g, "\\'")}')">수정 저장</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
  document.getElementById('editMemberName').value = String(member.name || '');
  document.getElementById('editMemberGender').value = member.gender === 'female' ? 'female' : 'male';
  document.getElementById('editMemberGrade').value = String(member.grade || '');
  document.getElementById('editMemberExperience').value = String(member.experience || '');
  setTimeout(function() {
    const input = document.getElementById('editMemberName');
    if (input) { input.focus(); input.select(); }
  }, 100);
}

async function saveMemberEdit(memberId) {
  if (!IS_ADMIN || ACTION_IN_FLIGHT) return;
  const name = String(document.getElementById('editMemberName')?.value || '').trim();
  const gender = String(document.getElementById('editMemberGender')?.value || '');
  const grade = String(document.getElementById('editMemberGrade')?.value || '').trim();
  const experience = String(document.getElementById('editMemberExperience')?.value || '').trim();
  if (!name) { alert('이름을 입력하세요.'); return; }
  if (!gender) { alert('성별을 선택하세요.'); return; }
  try {
    const state = await server('updateMemberProfile', [
      ADMIN_PIN_VALUE, String(memberId), name, gender, grade, experience
    ]);
    closeMemberEdit();
    MEMBER_ACTION_IDS = [];
    renderState(state);
  } catch (error) {
    alert(String((error && error.message) || error || '멤버 수정에 실패했습니다.'));
  }
}
'''
          for signature in (
              'function closeMemberEdit() {',
              'function startMemberEdit() {',
              'async function saveMemberEdit(memberId) {',
              'async function saveMemberEdit() {'
          ):
              rng = function_range(s, signature)
              if rng:
                  a, b = rng
                  s = s[:a] + s[b:]
          insert_at = s.find('async function addMember() {')
          if insert_at < 0:
              raise SystemExit('addMember anchor missing')
          s = s[:insert_at] + edit_code + '\n' + s[insert_at:]

          if "'updateMemberProfile'" not in s:
              s = s.replace(
                  "'addMember','setMemberStatus'",
                  "'addMember','updateMemberProfile','setMemberStatus'",
                  1,
              )

          # Replace any old APK launcher with a NativeBrowser-aware launcher.
          marker = '/* JAYUMINTON_ADMIN_PUSH_NATIVE_V5 */'
          insert = s.rfind('</script>')
          launcher = r'''

/* JAYUMINTON_ADMIN_PUSH_NATIVE_V5 */
(function installNativePushLauncherV5() {
  function launchMemberPwa() {
    try {
      if (window.NativeBrowser && typeof window.NativeBrowser.openPwa === 'function') {
        window.NativeBrowser.openPwa();
        return;
      }
    } catch (error) {}
    const url = 'https://jayuminton-push.web.app/';
    const opened = window.open(url, '_blank', 'noopener,noreferrer');
    if (!opened) window.location.href = url;
  }
  function mount() {
    if (!IS_ADMIN) return;
    const host = document.querySelector('#adminApp header .wrap.toolbar');
    if (!host) return;
    const old = document.getElementById('adminPushAppButton');
    if (old) old.remove();
    const button = document.createElement('button');
    button.id = 'adminPushAppButton';
    button.type = 'button';
    button.className = 'ghost-button';
    button.textContent = '📱 푸시앱';
    button.style.cssText = 'white-space:nowrap;background:#315efb;color:#fff;border-color:#315efb;font-weight:900;';
    button.addEventListener('click', launchMemberPwa);
    const menu = host.querySelector('.top-admin-menu');
    host.insertBefore(button, menu || null);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function(){ setTimeout(mount,80); });
  else setTimeout(mount,80);
})();
'''
          s = s[:insert] + launcher + s[insert:]
          p.write_text(s, encoding='utf-8')

          # ---------- Code.js ----------
          p = Path('Code.js')
          c = p.read_text(encoding='utf-8')
          if 'function updateMemberProfile(' not in c:
              anchor = 'function addMember(pin, name, gender, grade, experience) {'
              if anchor not in c:
                  raise SystemExit('Code.js addMember anchor missing')
              fn = r'''
function updateMemberProfile(pin, memberId, name, gender, grade, experience) {
  auth_(pin);
  return withDocumentLock_('멤버 편집', function() {
    memberId = String(memberId == null ? '' : memberId).trim();
    name = String(name == null ? '' : name).trim();
    gender = String(gender == null ? '' : gender).trim();
    grade = String(grade == null ? '' : grade).trim();
    experience = String(experience == null ? '' : experience).trim();
    if (!memberId) throw new Error('편집할 멤버가 없습니다.');
    if (!name) throw new Error('이름을 입력하세요.');
    if (name.length > 20) throw new Error('이름은 20자 이내로 입력하세요.');
    if (gender !== 'male' && gender !== 'female') throw new Error('성별을 선택하세요.');
    if (grade.length > 12) throw new Error('급수는 12자 이내로 입력하세요.');
    if (experience.length > 20) throw new Error('구력은 20자 이내로 입력하세요.');

    const members = readMembers_();
    const member = members.find(function(item) { return String(item.id) === memberId; });
    if (!member) throw new Error('멤버를 찾을 수 없습니다.');
    const duplicate = members.some(function(item) {
      return String(item.id) !== memberId && String(item.name || '').trim() === name;
    });
    if (duplicate) throw new Error('같은 이름의 멤버가 이미 있습니다.');

    member.name = name;
    member.gender = gender;
    member.grade = grade;
    member.experience = experience;
    writeMembers_(members);
    touch_();
    return getPublicState();
  });
}

'''
              c = c.replace(anchor, fn + anchor, 1)
          p.write_text(c, encoding='utf-8')

          # ---------- Admin.html ----------
          p = Path('Admin.html')
          h = p.read_text(encoding='utf-8')
          pattern = re.compile(r'(<div id="quickMoveBar" class="quick-move-bar hidden">)(.*?)(</div>)', re.S)
          m = pattern.search(h)
          if not m:
              raise SystemExit('quickMoveBar missing')
          body = '''
    <strong id="quickMoveName">선택 인원</strong>
    <span>길게 누른 멤버 관리</span>
    <button onclick="sendQuickPickToActive()">배정대기로</button>
    <button class="danger" onclick="deleteQuickPickedMembers()">삭제</button>
    <button class="ghost-button" onclick="closeMemberActionBar()">취소</button>
    <button onclick="startMemberEdit()">편집</button>
  '''
          h = h[:m.start()] + m.group(1) + body + m.group(3) + h[m.end():]
          p.write_text(h, encoding='utf-8')

          # ---------- Style.html ----------
          p = Path('Style.html')
          css = p.read_text(encoding='utf-8')
          marker = '/* JAYUMINTON_QUICK_ACTION_ONE_ROW_V5 */'
          if marker not in css:
              css += r'''

/* JAYUMINTON_QUICK_ACTION_ONE_ROW_V5 */
@media(max-width:620px){
  #adminApp .quick-move-bar{
    display:flex!important;
    flex-wrap:nowrap!important;
    grid-template-columns:none!important;
    align-items:center!important;
    gap:4px!important;
    padding:7px!important
  }
  #adminApp .quick-move-bar.hidden{display:none!important}
  #adminApp .quick-move-bar strong,
  #adminApp .quick-move-bar span{display:none!important}
  #adminApp .quick-move-bar button{
    flex:1 1 0!important;
    width:auto!important;
    min-width:0!important;
    min-height:34px!important;
    height:34px!important;
    padding:0 2px!important;
    font-size:10px!important;
    white-space:nowrap!important
  }
}
'''
          p.write_text(css, encoding='utf-8')
          PY

          grep -F "if (!IS_ADMIN) return '';" Script.html >/dev/null
          grep -F 'function startMemberEdit()' Script.html >/dev/null
          grep -F 'editMemberName' Script.html >/dev/null
          grep -F "type === 'court_assignment') return 4" Script.html >/dev/null
          grep -F "type === 'wait1_ready') return 2" Script.html >/dev/null
          grep -F 'JAYUMINTON_ADMIN_PUSH_NATIVE_V5' Script.html >/dev/null
          grep -F 'function updateMemberProfile(' Code.js >/dev/null
          grep -F '>배정대기로</button>' Admin.html >/dev/null
          grep -F '>삭제</button>' Admin.html >/dev/null
          grep -F '>취소</button>' Admin.html >/dev/null
          grep -F '>편집</button>' Admin.html >/dev/null
          grep -F 'JAYUMINTON_QUICK_ACTION_ONE_ROW_V5' Style.html >/dev/null

          clasp push --force
          clasp create-deployment --deploymentId "$MAIN_DEPLOYMENT_ID" --description "v199.5 edit vibration PWA bridge ${GITHUB_SHA::7}"

          cp Script.html "$GITHUB_WORKSPACE/source-snapshot/current-main/Script.html"
          cp Code.js "$GITHUB_WORKSPACE/source-snapshot/current-main/Code.js"
          cp Admin.html "$GITHUB_WORKSPACE/source-snapshot/current-main/Admin.html"
          cp Style.html "$GITHUB_WORKSPACE/source-snapshot/current-main/Style.html"

      - name: Build clean installable PWA
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$BUILD_ROOT" && mkdir -p "$BUILD_ROOT/web-push"
          cp deployment/jayuminton/firebase.json "$BUILD_ROOT/firebase.json"
          cp deployment/jayuminton/v1637-web/index.html "$BUILD_ROOT/web-push/index.html"
          cp deployment/jayuminton/v1637-web/setup-v205.css "$BUILD_ROOT/web-push/setup-v205.css"
          cp deployment/jayuminton/v1637-web/manifest.webmanifest "$BUILD_ROOT/web-push/manifest.webmanifest"
          cp deployment/jayuminton/v1637-web/firebase-messaging-sw.js "$BUILD_ROOT/web-push/firebase-messaging-sw.js"
          cat deployment/jayuminton/v1637-web/setup-v205.js.gz.b64.part-* | tr -d '\r\n' | base64 -d > "$RUNNER_TEMP/setup-v205.js.gz"
          gzip -dc "$RUNNER_TEMP/setup-v205.js.gz" > "$BUILD_ROOT/web-push/setup-v205.js"

          BASE="${HOSTING_URL%/}"
          for a in icon-198.png icon-512.png apple-touch-icon-180.png badge-96.png; do
            curl --fail --location --retry 5 --retry-delay 2 --max-time 90 "$BASE/$a?src=$GITHUB_RUN_ID" -o "$BUILD_ROOT/web-push/$a"
            test -s "$BUILD_ROOT/web-push/$a"
          done

          python3 -m pip install --quiet pillow

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from PIL import Image

          root = Path(os.environ['BUILD_ROOT']) / 'web-push'
          with Image.open(root/'icon-198.png') as im:
              im.convert('RGBA').resize((192,192), Image.Resampling.LANCZOS).save(root/'icon-192.png')
          with Image.open(root/'icon-512.png') as im:
              im.convert('RGBA').resize((512,512), Image.Resampling.LANCZOS).save(root/'icon-512.png')

          manifest = json.loads((root/'manifest.webmanifest').read_text(encoding='utf-8'))
          manifest.update({
              'id':'/',
              'name':'자유민턴 코트현황',
              'short_name':'자유민턴',
              'scope':'/',
              'start_url':'/?app=user&mode=user&source=pwa',
              'display':'standalone',
              'background_color':'#f3f5fa',
              'theme_color':'#315efb',
              'prefer_related_applications':False,
              'icons':[
                  {'src':'/icon-192.png?v=1995','sizes':'192x192','type':'image/png','purpose':'any'},
                  {'src':'/icon-512.png?v=1995','sizes':'512x512','type':'image/png','purpose':'any'}
              ]
          })
          (root/'manifest.webmanifest').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Remove all legacy intent/Drive installation behavior from setup JS.
          p = root/'setup-v205.js'
          s = p.read_text(encoding='utf-8')

          def function_range(src, signature):
              start = src.find(signature)
              if start < 0: return None
              brace = src.find('{', start)
              depth = 0; quote = None; escape = False; i = brace
              while i < len(src):
                  ch = src[i]
                  if quote:
                      if escape: escape = False
                      elif ch == '\\': escape = True
                      elif ch == quote: quote = None
                  else:
                      if ch in ('"', "'", '`'): quote = ch
                      elif ch == '{': depth += 1
                      elif ch == '}':
                          depth -= 1
                          if depth == 0: return start, i+1
                  i += 1
              raise SystemExit('unbalanced '+signature)

          def replace(src, sig, code):
              rng=function_range(src,sig)
              if not rng: return src
              a,b=rng
              return src[:a]+code+src[b:]

          s = replace(s, 'function buildAndroidChromeIntent() {', """function buildAndroidChromeIntent() {
            const target = buildChromeUserTarget();
            const targetUrl = target.toString();
            return { targetUrl: targetUrl, intentUrl: targetUrl };
          }""")
          s = replace(s, 'function launchChromeFromFirebaseTop() {', """function launchChromeFromFirebaseTop() {
            setInstallMessage('Chrome 기본 PWA 설치 기능을 사용합니다.', 'success');
            sendAppInstallStatus('PWA 설치 준비');
            return false;
          }""")
          s = replace(s, 'function handleEmbeddedChromeLinkClick() {', """function handleEmbeddedChromeLinkClick() {
            setInstallMessage('외부 앱으로 이동하지 않습니다. 화면의 앱 설치 버튼을 눌러 주세요.', 'success');
            sendAppInstallStatus('PWA 설치 준비');
          }""")
          s = s.replace('window.location.href = links.targetUrl;', "setInstallMessage('PWA 설치 버튼을 눌러 주세요.', 'success');")
          s = s.replace("appInstallChromeLink.href = links.intentUrl;", "appInstallChromeLink.removeAttribute('href'); appInstallChromeLink.hidden = true;")
          if 'S.browser_fallback_url' in s or 'drive.google.com' in s or 'docs.google.com' in s or 'intent://' in s:
              raise SystemExit('legacy Drive/intent install route remains')
          p.write_text(s, encoding='utf-8')

          # Direct top-level install button keeps the user gesture in the Firebase page.
          idx = root/'index.html'
          html = idx.read_text(encoding='utf-8')
          direct = r'''
<style>
#jayumintonDirectInstallV5{position:fixed;right:12px;bottom:12px;z-index:2147483647;border:0;border-radius:14px;padding:12px 16px;background:#315efb;color:#fff;font-weight:900;font-size:14px;box-shadow:0 10px 30px rgba(30,64,175,.28)}
#jayumintonDirectInstallV5[hidden]{display:none!important}
#jayumintonDirectInstallNoteV5{position:fixed;right:12px;bottom:66px;z-index:2147483646;max-width:min(320px,calc(100% - 24px));padding:8px 10px;border-radius:10px;background:rgba(15,23,42,.92);color:#fff;font-size:11px;font-weight:700;display:none}
</style>
<button id="jayumintonDirectInstallV5" type="button">📲 앱 설치 준비중</button>
<div id="jayumintonDirectInstallNoteV5"></div>
<script>
/* JAYUMINTON_DIRECT_PWA_INSTALL_V5 */
(() => {
  const button = document.getElementById('jayumintonDirectInstallV5');
  const note = document.getElementById('jayumintonDirectInstallNoteV5');
  let installPrompt = window.__JAYUMINTON_EARLY_INSTALL_PROMPT || null;
  const standalone = () => window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  const showNote = (text) => { note.textContent=text; note.style.display='block'; setTimeout(()=>{note.style.display='none';},4500); };
  const refresh = () => {
    if (standalone()) { button.hidden=true; return; }
    button.hidden=false;
    button.textContent = installPrompt ? '📲 자유민턴 앱 설치' : '📲 앱 설치 준비중';
    button.style.background = installPrompt ? '#16a34a' : '#315efb';
  };
  window.addEventListener('beforeinstallprompt', (event) => {
    event.preventDefault();
    installPrompt = event;
    window.__JAYUMINTON_EARLY_INSTALL_PROMPT = event;
    refresh();
  });
  window.addEventListener('appinstalled', () => {
    installPrompt = null;
    button.hidden = true;
  });
  window.addEventListener('message', (event) => {
    const data=event.data||{};
    if (data.type === 'JAYUMINTON_APP_INSTALL_REQUEST') {
      refresh();
      if (!installPrompt) showNote('Chrome이 설치 가능 상태를 확인 중입니다. 잠시 후 초록색 앱 설치 버튼을 눌러 주세요.');
      else showNote('아래 초록색 앱 설치 버튼을 눌러 주세요.');
    }
  });
  button.addEventListener('click', async () => {
    if (standalone()) { button.hidden=true; return; }
    if (!installPrompt) {
      showNote('아직 설치 준비 중입니다. Chrome 메뉴(⋮)의 앱 설치도 사용할 수 있습니다.');
      return;
    }
    const current=installPrompt;
    try {
      await current.prompt();
      const choice=await current.userChoice;
      if (!choice || choice.outcome !== 'accepted') showNote('설치가 취소되었습니다.');
    } catch (error) {
      showNote('Chrome 메뉴(⋮)에서 앱 설치를 선택해 주세요.');
    }
    installPrompt=null;
    refresh();
  });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/firebase-messaging-sw.js',{scope:'/'}).catch(()=>{});
  refresh();
})();
</script>
