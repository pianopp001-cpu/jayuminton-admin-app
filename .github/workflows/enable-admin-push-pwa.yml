          python3 - <<'PY'
          import json,os
          from pathlib import Path
          from PIL import Image
          root=Path(os.environ['BUILD_ROOT'])/'web-push'
          m=json.loads((root/'manifest.webmanifest').read_text(encoding='utf-8'))
          assert m['display']=='standalone'
          assert m['scope']=='/'
