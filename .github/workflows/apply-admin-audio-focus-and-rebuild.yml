name: Apply admin audio focus and rebuild

on:
  push:
    branches: [main]
    paths:
      - 'deployment/jayuminton/admin_native_audio_focus_patch.py'
      - 'deployment/jayuminton/admin_court_voice_text_patch.py'
      - 'deployment/jayuminton/admin_cloudflare_post_contract_patch.py'
      - '.github/workflows/apply-admin-audio-focus-and-rebuild.yml'
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  apply-redeploy-build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}

      - name: Apply exclusive audio focus to admin native shell
        shell: bash
        run: |
          set -euo pipefail
          python3 deployment/jayuminton/admin_native_audio_focus_patch.py app/src/main/java/com/jayuminton/admin/MainActivity.java
          grep -F 'AUDIOFOCUS_GAIN_TRANSIENT_EXCLUSIVE' app/src/main/java/com/jayuminton/admin/MainActivity.java >/dev/null
          grep -F 'MEDIA_DUCK_VOLUME_STEP = 6' app/src/main/java/com/jayuminton/admin/MainActivity.java >/dev/null
          grep -F 'setStreamVolume(AudioManager.STREAM_ALARM, maxAlarm, 0)' app/src/main/java/com/jayuminton/admin/MainActivity.java >/dev/null
          grep -F 'abandonAudioFocusRequest' app/src/main/java/com/jayuminton/admin/MainActivity.java >/dev/null

      - name: Commit native audio focus shell if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/jayuminton/admin/MainActivity.java
          if ! git diff --cached --quiet; then
            git commit -m 'Apply exclusive audio focus for admin court voice'
            git pull --rebase origin main
            git push origin main
          fi

      - name: Redeploy Cloudflare admin and wait
        shell: bash
        run: |
          set -euo pipefail
          old="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow preview-admin-cloudflare.yml --branch main --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          gh workflow run preview-admin-cloudflare.yml --repo "$GITHUB_REPOSITORY" --ref main
          run_id=''
          for i in $(seq 1 60); do
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow preview-admin-cloudflare.yml --branch main --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
            if [ "$run_id" != "0" ] && [ "$run_id" != "$old" ]; then break; fi
            sleep 2
          done
          test -n "$run_id"; test "$run_id" != "0"; test "$run_id" != "$old"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Rebuild admin APK and wait
        shell: bash
        run: |
          set -euo pipefail
          old="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-v1995-direct.yml --branch main --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          gh workflow run build-v1995-direct.yml --repo "$GITHUB_REPOSITORY" --ref main
          run_id=''
          for i in $(seq 1 60); do
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-v1995-direct.yml --branch main --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
            if [ "$run_id" != "0" ] && [ "$run_id" != "$old" ]; then break; fi
            sleep 2
          done
          test -n "$run_id"; test "$run_id" != "0"; test "$run_id" != "$old"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Done
        run: echo 'ADMIN_FULL_VOICE_AUDIO_FOCUS_REBUILD_OK'
