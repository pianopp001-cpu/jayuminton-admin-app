name: Deploy Cloudflare-only state service

# Canonical Cloudflare state deployment.
on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/state-worker/**'
      - 'deployment/jayuminton/patch_state_worker_md4_autoassign.py'
      - 'deployment/jayuminton/cloudflare_v6_frontend_bridge.js'
      - 'deployment/jayuminton/cloudflare_v6_frontend_bridge.test.mjs'
      - 'deployment/jayuminton/inject_cloudflare_v6_frontend_bridge.py'
      - '.github/workflows/deploy-cloudflare-state-shadow.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: jayuminton-cloudflare-state
  cancel-in-progress: true

jobs:
  deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      INTERNAL_KEY: ${{ secrets.JAYUMINTON_PUSH_SHARED_SECRET }}
      WORKER_URL: https://jayuminton-state.pianopp001.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --global wrangler@latest

      - name: Repair worker parser edge and verify Cloudflare-only rules
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cloudflare/state-worker/worker.js')
          s=p.read_text(encoding='utf-8')
          bad="try { const state = await readState(env.DB); await verifyAdminSession(request, env, state); return reply({ ok: true, state: adminState(state) });\n      catch (error)"
          good="try { const state = await readState(env.DB); await verifyAdminSession(request, env, state); return reply({ ok: true, state: adminState(state) }); }\n      catch (error)"
          if bad in s:
              s=s.replace(bad,good,1)
              p.write_text(s,encoding='utf-8')
          PY
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "${#INTERNAL_KEY}" -ge 32
          node --check cloudflare/state-worker/worker.js
          node cloudflare/state-worker/temp-pairs.test.mjs
          node cloudflare/state-worker/worker.test.mjs
          node cloudflare/state-worker/md4-autoassign.test.mjs
          node cloudflare/state-worker/md-entry-autoassign.test.mjs
          node cloudflare/state-worker/md-final-entry.test.mjs
          node deployment/jayuminton/cloudflare_v6_frontend_bridge.test.mjs
          grep -F "backend: 'cloudflare-only'" cloudflare/state-worker/worker.js >/dev/null
          grep -F 'gas: false' cloudflare/state-worker/worker.js >/dev/null
          grep -F "state.waitGroups = [[...state.waitGroups[1]], [...state.waitGroups[2]], [...state.waitGroups[3]], [...state.waitGroups[4]], []]" cloudflare/state-worker/worker.js >/dev/null
          grep -F "team_requires_assignment_wait" cloudflare/state-worker/worker.js >/dev/null
          if grep -R -n -E 'script\.google\.com|googleusercontent\.com|firebaseapp\.com|web\.app' cloudflare/state-worker deployment/jayuminton/cloudflare_v6_frontend_bridge.js; then exit 1; fi

      - name: Resolve existing Cloudflare D1 database
        shell: bash
        run: |
          set -euo pipefail
          wrangler d1 list --json > "$RUNNER_TEMP/d1-list.json"
          D1_ID="$(jq -r '.[] | select(.name=="jayuminton-state") | .uuid' "$RUNNER_TEMP/d1-list.json" | head -1)"
          test -n "$D1_ID"
          sed "s/__D1_DATABASE_ID__/$D1_ID/g" cloudflare/state-worker/wrangler.toml.template > "$RUNNER_TEMP/wrangler.toml"

      - name: Deploy worker without replacing live state
        shell: bash
        run: |
          set -euo pipefail
          wrangler d1 execute DB --remote --file cloudflare/state-worker/schema.sql --config "$RUNNER_TEMP/wrangler.toml"
          cp cloudflare/state-worker/*.js "$RUNNER_TEMP/"
          echo "::add-mask::$INTERNAL_KEY"
          printf '%s' "$INTERNAL_KEY" | wrangler secret put INTERNAL_KEY --config "$RUNNER_TEMP/wrangler.toml" >/dev/null
          wrangler deploy --config "$RUNNER_TEMP/wrangler.toml"

      - name: Verify live Cloudflare service
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 8 --retry-delay 2 "$WORKER_URL/health?run=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/health.json"
          jq -e '.ok==true and .backend=="cloudflare-only" and .database=="d1" and .concurrency=="durable-object" and .gas==false' "$RUNNER_TEMP/health.json" >/dev/null
          echo CLOUDFLARE_ONLY_STATE_SERVICE_READY
