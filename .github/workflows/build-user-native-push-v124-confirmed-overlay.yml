name: Build v1.2.4 confirmed overlay alert candidate
# internal version markers corrected

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-user-native-push-v124-confirmed-overlay.yml'
  pull_request:
    branches: [main]
    paths:
      - 'deployment/status/trigger-user-native-v124.txt'
      - '.github/workflows/build-user-native-push-v124-confirmed-overlay.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: jayuminton-user-native-v124
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Initialize build checkpoint
        run: echo 'node-ready' > "$RUNNER_TEMP/native-v124-stage.txt"

      - name: Resolve deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          CONFIG="$RUNNER_TEMP/deploy.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$CONFIG"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          jq -e '.mainScriptId and .mainDeploymentId and .pushScriptId and .pushDeploymentId and .firebaseProjectId and .pushUrl' "$CONFIG" >/dev/null
          {
            echo "MAIN_SCRIPT_ID=$(jq -r '.mainScriptId' "$CONFIG")"
            echo "MAIN_DEPLOYMENT_ID=$(jq -r '.mainDeploymentId' "$CONFIG")"
            echo "PUSH_SCRIPT_ID=$(jq -r '.pushScriptId' "$CONFIG")"
            echo "PUSH_DEPLOYMENT_ID=$(jq -r '.pushDeploymentId' "$CONFIG")"
            echo "PUSH_URL=$(jq -r '.pushUrl' "$CONFIG")"
            echo "FIREBASE_PROJECT_ID=$(jq -r '.firebaseProjectId' "$CONFIG")"
          } >> "$GITHUB_ENV"

          echo 'config-ready' > "$RUNNER_TEMP/native-v124-stage.txt"

      - name: Authenticate Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Install Firebase and clasp tools
        run: |
          npm install --global firebase-tools@latest @google/clasp@latest
          echo 'tools-ready' > "$RUNNER_TEMP/native-v124-stage.txt"

      - name: Ensure Firebase Android app and download google-services config
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='com.jayuminton.user'
          firebase apps:list ANDROID --project "$FIREBASE_PROJECT_ID" --json > "$RUNNER_TEMP/apps.json"
          APP_ID="$(jq -r --arg pkg "$PACKAGE" '[.. | objects | select(((.packageName? == $pkg) or (.package_name? == $pkg) or (.androidClientInfo?.packageName? == $pkg)) and ((.appId? // .app_id?) != null)) | (.appId? // .app_id?)] | first // empty' "$RUNNER_TEMP/apps.json")"
          if [ -z "$APP_ID" ]; then
            firebase apps:create ANDROID '자유민턴 코트현황' --package-name "$PACKAGE" --project "$FIREBASE_PROJECT_ID"
            firebase apps:list ANDROID --project "$FIREBASE_PROJECT_ID" --json > "$RUNNER_TEMP/apps.json"
            APP_ID="$(jq -r --arg pkg "$PACKAGE" '[.. | objects | select(((.packageName? == $pkg) or (.package_name? == $pkg) or (.androidClientInfo?.packageName? == $pkg)) and ((.appId? // .app_id?) != null)) | (.appId? // .app_id?)] | first // empty' "$RUNNER_TEMP/apps.json")"
          fi
          test -n "$APP_ID"
          echo "Firebase Android app located for $PACKAGE"
          firebase apps:sdkconfig ANDROID "$APP_ID" --project "$FIREBASE_PROJECT_ID" > app/google-services.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('app/google-services.json').read_text(encoding='utf-8'))
          packages=[]
          for client in data.get('client',[]):
              info=((client.get('client_info') or {}).get('android_client_info') or {})
              if info.get('package_name'): packages.append(info['package_name'])
          if 'com.jayuminton.user' not in packages:
              raise SystemExit('google-services.json package mismatch')
          print('google-services.json package verified')
          PY

          echo 'firebase-app-ready' > "$RUNNER_TEMP/native-v124-stage.txt"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -n "$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | head -1)"

          echo 'android-sdk-ready' > "$RUNNER_TEMP/native-v124-stage.txt"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Mark Gradle ready
        run: echo 'gradle-ready' > "$RUNNER_TEMP/native-v124-stage.txt"

      - name: Verify live push sender is high priority 3x3 3x5
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/verify-push"
          mkdir -p "$WORK"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$PUSH_SCRIPT_ID" > "$WORK/.clasp.json"
          cd "$WORK"
          clasp pull
          grep -F "repeatCount: '1'," Code.js >/dev/null
          grep -F "priority: 'high'" Code.js >/dev/null
          grep -F "ttl: '600s'" Code.js >/dev/null

          echo 'push-sender-ready' > "$RUNNER_TEMP/native-v124-stage.txt"

      - name: Build and verify fresh-install native FCM APK
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/native-v124-build.log") 2>&1
          echo 'native-build-started' > "$RUNNER_TEMP/native-v124-stage.txt"
          python3 deployment/scripts/patch_build_user_native_v111.py deployment/scripts/build_user_native_push_fresh_v110.sh
          python3 deployment/scripts/patch_build_user_native_v112.py deployment/scripts/build_user_native_push_fresh_v110.sh
          python3 deployment/scripts/patch_build_user_native_v113.py deployment/scripts/build_user_native_push_fresh_v110.sh
          python3 deployment/scripts/patch_build_user_native_v114.py deployment/scripts/build_user_native_push_fresh_v110.sh
          python3 deployment/scripts/patch_build_user_native_v115.py deployment/scripts/build_user_native_push_fresh_v110.sh
          python3 deployment/scripts/patch_build_user_native_v116.py deployment/scripts/build_user_native_push_fresh_v110.sh
          python3 deployment/scripts/patch_build_user_native_v117.py deployment/scripts/build_user_native_push_fresh_v110.sh
          python3 deployment/scripts/patch_build_user_native_v118.py deployment/scripts/build_user_native_push_fresh_v110.sh
          python3 deployment/scripts/patch_build_user_native_v119.py deployment/scripts/build_user_native_push_fresh_v110.sh
          python3 deployment/scripts/patch_build_user_native_v120_diagnostic.py deployment/scripts/build_user_native_push_fresh_v110.sh
          python3 deployment/scripts/patch_build_user_native_v121.py deployment/scripts/build_user_native_push_fresh_v110.sh
          python3 deployment/scripts/patch_build_user_native_v122.py deployment/scripts/build_user_native_push_fresh_v110.sh
          python3 deployment/scripts/patch_build_user_native_v124_confirmed_overlay.py deployment/scripts/build_user_native_push_fresh_v110.sh
          bash deployment/scripts/build_user_native_push_fresh_v110.sh
          test -s releases/jayuminton-courtstatus-v1.2.4-confirmed-overlay.apk
          grep -F 'status=success' deployment/status/user-native-push-v1.2.4.txt >/dev/null
          grep -F 'launcher_label=자유민턴 코트현황' deployment/status/user-native-push-v1.2.4.txt >/dev/null
          grep -F 'install_mode=uninstall-old-then-fresh-install' deployment/status/user-native-push-v1.2.4.txt >/dev/null
          grep -F 'wait1_vibration=3-long-pulses-x3-groups' deployment/status/user-native-push-v1.2.4.txt >/dev/null
          grep -F 'court_vibration=3-long-pulses-x5-groups' deployment/status/user-native-push-v1.2.4.txt >/dev/null
          cp releases/jayuminton-courtstatus-v1.2.4-confirmed-overlay.apk "$RUNNER_TEMP/user-native.apk"
          cp deployment/status/user-native-push-v1.2.4.txt "$RUNNER_TEMP/user-native-status.txt"

      - name: Publish v1.2.4 candidate without changing live install button
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          cp "$RUNNER_TEMP/user-native.apk" releases/jayuminton-courtstatus-v1.2.4-confirmed-overlay.apk
          cp "$RUNNER_TEMP/user-native-status.txt" deployment/status/user-native-push-v1.2.4.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/jayuminton-courtstatus-v1.2.4-confirmed-overlay.apk deployment/status/user-native-push-v1.2.4.txt
          git commit -m 'Publish verified fresh-install native push user APK v1.2.4' || true
          git pull --rebase origin main
          git push origin main

      - name: Confirm published APK byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:releases/jayuminton-courtstatus-v1.2.4-confirmed-overlay.apk > "$RUNNER_TEMP/remote.apk"
          test -s "$RUNNER_TEMP/remote.apk"
          test "$(sha256sum "$RUNNER_TEMP/remote.apk" | awk '{print $1}')" = "$(sha256sum "$RUNNER_TEMP/user-native.apk" | awk '{print $1}')"

      - name: Publish sanitized build failure diagnostics
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          {
            echo 'status=failure'
            echo 'stage='"$(cat "$RUNNER_TEMP/native-v124-stage.txt" 2>/dev/null || echo unknown)"
            echo '--- build log tail ---'
            if [ -f "$RUNNER_TEMP/native-v124-build.log" ]; then
              tail -n 240 "$RUNNER_TEMP/native-v124-build.log"
            else
              echo 'build log was not created'
            fi
          } > deployment/status/native-v124-build-failure.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment/status/native-v124-build-failure.txt
          git commit -m 'Record native v1.2.4 build failure' || true
          git pull --rebase origin main
          git push origin main

      - name: Upload fresh-install APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jayuminton-courtstatus-v1.2.4-confirmed-overlay
          path: releases/jayuminton-courtstatus-v1.2.4-confirmed-overlay.apk
          if-no-files-found: error
          retention-days: 30
