name: Deploy complete wait1 transition detection

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-wait1-transition-detection.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global @google/clasp@latest
      - name: Patch only server transition predicate
        shell: bash
        run: |
          set -euo pipefail
          C="$RUNNER_TEMP/deploy.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$C"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          MAIN_SCRIPT_ID="$(jq -r '.mainScriptId' "$C")"
          MAIN_DEPLOYMENT_ID="$(jq -r '.mainDeploymentId' "$C")"
          W="$RUNNER_TEMP/main"
          mkdir -p "$W"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$MAIN_SCRIPT_ID" > "$W/.clasp.json"
          cd "$W"
          clasp pull
          cp Script.html "$RUNNER_TEMP/Script.before.html"
          cp Admin.html "$RUNNER_TEMP/Admin.before.html"
          cp Style.html "$RUNNER_TEMP/Style.before.html"
          python3 "$GITHUB_WORKSPACE/deployment/scripts/patch_wait1_transition_detection.py" Code.js
          cmp Script.html "$RUNNER_TEMP/Script.before.html"
          cmp Admin.html "$RUNNER_TEMP/Admin.before.html"
          cmp Style.html "$RUNNER_TEMP/Style.before.html"
          grep -F 'function shouldCheckStatePush_(actionName)' Code.js >/dev/null
          grep -F 'return true;' Code.js >/dev/null
          grep -F 'sendStateTransitionPushes_' Code.js >/dev/null
          clasp push --force
          clasp create-deployment --deploymentId "$MAIN_DEPLOYMENT_ID" --description "complete wait1 transition detection ${GITHUB_SHA::7}"
          printf 'status=success\nall_locked_transitions_inspected=yes\nwait1_actual_entry_only=yes\ncourt_actual_entry_only=yes\nadmin_ui_changed=no\ndeployed_at=%s\n' "$(date -u +%FT%TZ)" > "$GITHUB_WORKSPACE/deployment/status/wait1-transition-detection-live.txt"
      - name: Publish status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions-bot@users.noreply.github.com'
          git add deployment/status/wait1-transition-detection-live.txt
          git commit -m 'Record complete wait1 transition detection deployment'
          git pull --rebase origin main
          git push origin main
