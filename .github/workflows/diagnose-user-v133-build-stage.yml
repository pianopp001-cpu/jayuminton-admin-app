name: Diagnose v1.3.3 user APK build stage

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-user-v133-build-stage.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: jayuminton-user-v133-build-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.7'}
      - run: npm install --global firebase-tools@latest @google/clasp@latest
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Diagnose build stages and persist report
        shell: bash
        run: |
          set +e
          REPORT="$RUNNER_TEMP/v133-diagnostic.txt"
          : > "$REPORT"
          echo "source_sha=$GITHUB_SHA" >> "$REPORT"
          C="$RUNNER_TEMP/deploy.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$C"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          MAIN_DEPLOYMENT_ID="$(jq -r '.mainDeploymentId // empty' "$C")"
          FIREBASE_PROJECT_ID="$(jq -r '.firebaseProjectId // empty' "$C")"
          PUSH_SCRIPT_ID="$(jq -r '.pushScriptId // empty' "$C")"
          PUSH_DEPLOYMENT_ID="$(jq -r '.pushDeploymentId // empty' "$C")"
          if [ -z "$PUSH_DEPLOYMENT_ID" ]; then PUSH_DEPLOYMENT_ID="$(sed -n 's/^push_deployment_id=//p' deployment/status/apps-script-deployments-now.txt | head -1)"; fi
          PUSH_URL="$(jq -r '.pushUrl // empty' "$C")"
          if [ -z "$PUSH_URL" ] && [ -n "$PUSH_DEPLOYMENT_ID" ]; then PUSH_URL="https://script.google.com/macros/s/$PUSH_DEPLOYMENT_ID/exec"; fi
          echo "resolve_main=$([ -n "$MAIN_DEPLOYMENT_ID" ] && echo ok || echo missing)" >> "$REPORT"
          echo "resolve_firebase=$([ -n "$FIREBASE_PROJECT_ID" ] && echo ok || echo missing)" >> "$REPORT"
          echo "resolve_push_deployment=$([ -n "$PUSH_DEPLOYMENT_ID" ] && echo ok || echo missing)" >> "$REPORT"
          PACKAGE='com.jayuminton.user'
          firebase apps:list ANDROID --project "$FIREBASE_PROJECT_ID" --json > "$RUNNER_TEMP/apps.json" 2>"$RUNNER_TEMP/firebase-list.err"
          echo "firebase_apps_list_exit=$?" >> "$REPORT"
          APP_ID="$(jq -r --arg pkg "$PACKAGE" '[.. | objects | select(((.packageName? == $pkg) or (.package_name? == $pkg) or (.androidClientInfo?.packageName? == $pkg)) and ((.appId? // .app_id?) != null)) | (.appId? // .app_id?)] | first // empty' "$RUNNER_TEMP/apps.json" 2>/dev/null)"
          echo "firebase_user_app=$([ -n "$APP_ID" ] && echo found || echo missing)" >> "$REPORT"
          if [ -n "$APP_ID" ]; then firebase apps:sdkconfig ANDROID "$APP_ID" --project "$FIREBASE_PROJECT_ID" > app/google-services.json 2>"$RUNNER_TEMP/sdkconfig.err"; echo "sdkconfig_exit=$?" >> "$REPORT"; fi
          if [ -z "$PUSH_SCRIPT_ID" ]; then
            PROJECTS="$(clasp list 2>/dev/null)"
            CANDIDATES="$(printf '%s\n' "$PROJECTS" | sed -n -e 's#.*script.google.com/d/\([^/ ]*\)/edit.*#\1#p' -e 's#.*script.google.com/home/projects/\([^/ ]*\)/edit.*#\1#p' | sort -u)"
            while IFS= read -r candidate; do
              [ -n "$candidate" ] || continue
              W="$RUNNER_TEMP/push-$candidate"; mkdir -p "$W"
              printf '{"scriptId":"%s","rootDir":"."}\n' "$candidate" > "$W/.clasp.json"
              if (cd "$W" && clasp deployments 2>/dev/null) | grep -F "$PUSH_DEPLOYMENT_ID" >/dev/null; then PUSH_SCRIPT_ID="$candidate"; break; fi
            done <<< "$CANDIDATES"
          fi
          echo "push_script=$([ -n "$PUSH_SCRIPT_ID" ] && echo found || echo missing)" >> "$REPORT"
          export MAIN_DEPLOYMENT_ID PUSH_URL FIREBASE_PROJECT_ID PUSH_SCRIPT_ID PUSH_DEPLOYMENT_ID

          SCRIPT='deployment/scripts/build_user_native_push_fresh_v110.sh'
          PATCHES=(
            deployment/scripts/patch_build_user_native_v111.py
            deployment/scripts/patch_build_user_native_v112.py
            deployment/scripts/patch_build_user_native_v113.py
            deployment/scripts/patch_build_user_native_v114.py
            deployment/scripts/patch_build_user_native_v115.py
            deployment/scripts/patch_build_user_native_v116.py
            deployment/scripts/patch_build_user_native_v117.py
            deployment/scripts/patch_build_user_native_v118.py
            deployment/scripts/patch_build_user_native_v119.py
            deployment/scripts/patch_build_user_native_v120_diagnostic.py
            deployment/scripts/patch_build_user_native_v121.py
            deployment/scripts/patch_build_user_native_v122.py
            deployment/scripts/patch_build_user_native_v124_confirmed_overlay.py
            deployment/scripts/patch_build_user_native_v126_stop_controller.py
            deployment/scripts/patch_build_user_native_v126_raceguard.py
            deployment/scripts/patch_build_user_native_v127_member_switch.py
            deployment/scripts/patch_build_user_native_v128_repeat_switch.py
            deployment/scripts/patch_build_user_native_v129_background_registration.py
            deployment/scripts/patch_user_native_v130_vibration_cap8.py
            deployment/scripts/patch_user_native_v132_strict_current_member.py
          )
          BASE_PATCH_EXIT=0
          for p in "${PATCHES[@]}"; do
            python3 "$p" "$SCRIPT" >"$RUNNER_TEMP/patch.out" 2>"$RUNNER_TEMP/patch.err"
            rc=$?
            if [ $rc -ne 0 ]; then
              echo "base_patch_failure=$p" >> "$REPORT"
              echo "base_patch_exit=$rc" >> "$REPORT"
              echo "base_patch_error=$(tail -1 "$RUNNER_TEMP/patch.err" | tr '\n' ' ')" >> "$REPORT"
              BASE_PATCH_EXIT=$rc
              break
            fi
          done
          echo "base_patch_chain_exit=$BASE_PATCH_EXIT" >> "$REPORT"

          if [ $BASE_PATCH_EXIT -eq 0 ]; then
            python3 deployment/scripts/patch_user_native_v133_install_safe.py "$SCRIPT" >"$RUNNER_TEMP/v133.out" 2>"$RUNNER_TEMP/v133.err"
            V133_EXIT=$?
            echo "v133_patch_exit=$V133_EXIT" >> "$REPORT"
            echo "v133_patch_error=$(tail -1 "$RUNNER_TEMP/v133.err" | tr '\n' ' ')" >> "$REPORT"
          else V133_EXIT=99; fi

          if [ $V133_EXIT -eq 0 ]; then
            bash "$SCRIPT" >"$RUNNER_TEMP/builder.out" 2>"$RUNNER_TEMP/builder.err"
            BUILDER_EXIT=$?
            echo "builder_exit=$BUILDER_EXIT" >> "$REPORT"
            echo "builder_error=$(tail -3 "$RUNNER_TEMP/builder.err" | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g')" >> "$REPORT"
          else BUILDER_EXIT=99; fi

          APK='releases/jayuminton-courtstatus-v1.3.3-install-safe.apk'
          STATUS='deployment/status/user-native-push-v1.3.3.txt'
          echo "apk_exists=$([ -s "$APK" ] && echo yes || echo no)" >> "$REPORT"
          echo "status_exists=$([ -s "$STATUS" ] && echo yes || echo no)" >> "$REPORT"
          if [ -s "$APK" ]; then
            AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
            APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
            "$AAPT" dump badging "$APK" > "$RUNNER_TEMP/badging.txt" 2>&1; echo "aapt_exit=$?" >> "$REPORT"
            grep -m1 '^package:' "$RUNNER_TEMP/badging.txt" | sed 's/^/aapt_package=/' >> "$REPORT"
            "$APKSIGNER" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/signing.txt" 2>&1; echo "apksigner_exit=$?" >> "$REPORT"
            grep -i -m1 'certificate SHA-256 digest' "$RUNNER_TEMP/signing.txt" | sed 's/^/signer_line=/' >> "$REPORT"
          fi

          git reset --hard HEAD
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p deployment/status
          cp "$REPORT" deployment/status/user-v133-build-diagnostic.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment/status/user-v133-build-diagnostic.txt
          git commit -m 'Record detailed user v1.3.3 build diagnostic' || exit 0
          git pull --rebase origin main
          git push origin main
