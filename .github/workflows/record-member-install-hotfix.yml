name: Record member install hotfix result

on:
  workflow_run:
    workflows: ['Hotfix member reassignment and Chrome install loop']
    types: [completed]

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Record result
        shell: bash
        env:
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          mkdir -p deployment/jayuminton
          printf 'conclusion=%s\nrun_id=%s\nhead_sha=%s\nrun_url=%s\n' "$CONCLUSION" "$RUN_ID" "$HEAD_SHA" "$RUN_URL" > deployment/jayuminton/MEMBER_INSTALL_HOTFIX_STATUS.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment/jayuminton/MEMBER_INSTALL_HOTFIX_STATUS.txt
          git commit -m "Record member/install hotfix: $CONCLUSION" || exit 0
          git pull --rebase origin main || true
          git push
