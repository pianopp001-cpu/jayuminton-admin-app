name: Build publish and click-verify v1.3.0 cap8 user APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-publish-v130-cap8-live.yml'
      - 'deployment/scripts/patch_user_native_v130_vibration_cap8.py'
      - 'deployment/scripts/patch_user_install_link_v130.py'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: jayuminton-v130-cap8-live
  cancel-in-progress: false

jobs:
  build-publish-deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      JAYUMINTON_DEPLOY_CONFIG_JSON: ${{ secrets.JAYUMINTON_DEPLOY_CONFIG_JSON }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.7'}
      - run: npm install --global firebase-tools@latest @google/clasp@latest
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Resolve config and Firebase user app
        shell: bash
        run: |
          set -euo pipefail
          C="$RUNNER_TEMP/deploy.json"
          printf '%s' "$JAYUMINTON_DEPLOY_CONFIG_JSON" > "$C"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          MAIN_DEPLOYMENT_ID="$(jq -r '.mainDeploymentId' "$C")"
          MAIN_SCRIPT_ID="$(jq -r '.mainScriptId' "$C")"
          PUSH_URL="$(jq -r '.pushUrl' "$C")"
          PUSH_SCRIPT_ID="$(jq -r '.pushScriptId' "$C")"
          FIREBASE_PROJECT_ID="$(jq -r '.firebaseProjectId' "$C")"
          HOSTING_URL="$(jq -r '.hostingUrl' "$C")"
          for value in "$MAIN_DEPLOYMENT_ID" "$MAIN_SCRIPT_ID" "$PUSH_URL" "$PUSH_SCRIPT_ID" "$FIREBASE_PROJECT_ID" "$HOSTING_URL"; do
            test -n "$value"; test "$value" != null
          done
          {
            echo "MAIN_DEPLOYMENT_ID=$MAIN_DEPLOYMENT_ID"
            echo "MAIN_SCRIPT_ID=$MAIN_SCRIPT_ID"
            echo "MAIN_URL=https://script.google.com/macros/s/$MAIN_DEPLOYMENT_ID/exec"
            echo "PUSH_URL=$PUSH_URL"
            echo "PUSH_SCRIPT_ID=$PUSH_SCRIPT_ID"
            echo "FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID"
            echo "HOSTING_URL=$HOSTING_URL"
          } >> "$GITHUB_ENV"

          PACKAGE='com.jayuminton.user'
          firebase apps:list ANDROID --project "$FIREBASE_PROJECT_ID" --json > "$RUNNER_TEMP/apps.json"
          APP_ID="$(jq -r --arg pkg "$PACKAGE" '[.. | objects | select(((.packageName? == $pkg) or (.package_name? == $pkg) or (.androidClientInfo?.packageName? == $pkg)) and ((.appId? // .app_id?) != null)) | (.appId? // .app_id?)] | first // empty' "$RUNNER_TEMP/apps.json")"
          test -n "$APP_ID"
          firebase apps:sdkconfig ANDROID "$APP_ID" --project "$FIREBASE_PROJECT_ID" > app/google-services.json
          grep -F 'com.jayuminton.user' app/google-services.json >/dev/null

      - name: Verify live member-switch server guard
        shell: bash
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/push-check"; mkdir -p "$W"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$PUSH_SCRIPT_ID" > "$W/.clasp.json"
          ok=0
          for attempt in 1 2 3 4 5; do
            rm -f "$W/Code.js"
            (cd "$W" && clasp pull) || true
            if grep -F 'JAYUMINTON_MEMBER_TOKEN_SWITCH_ATOMIC_V1' "$W/Code.js" >/dev/null 2>&1; then ok=1; break; fi
            sleep 4
          done
          test "$ok" = 1

      - name: Build v1.3.0 code130 cap8 from verified v1.2.9 chain
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT='deployment/scripts/build_user_native_push_fresh_v110.sh'
          python3 deployment/scripts/patch_build_user_native_v111.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v112.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v113.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v114.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v115.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v116.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v117.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v118.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v119.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v120_diagnostic.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v121.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v122.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v124_confirmed_overlay.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v126_stop_controller.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v126_raceguard.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v127_member_switch.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v128_repeat_switch.py "$SCRIPT"
          python3 deployment/scripts/patch_build_user_native_v129_background_registration.py "$SCRIPT"
          python3 deployment/scripts/patch_user_native_v130_vibration_cap8.py "$SCRIPT"

          grep -F 'VERSION="1.3.0"' "$SCRIPT" >/dev/null
          grep -F 'VERSION_CODE="130"' "$SCRIPT" >/dev/null
          grep -F 'private static final int MAX_GROUPS = 8;' "$SCRIPT" >/dev/null
          grep -F 'JAYUMINTON_V126_START_STOP_RACE_GUARD' "$SCRIPT" >/dev/null
          grep -F 'GROUP_REPEAT_MS = 3490L' "$SCRIPT" >/dev/null
          ! grep -F 'MAX_GROUPS = 10' "$SCRIPT" >/dev/null

          bash "$SCRIPT"

          APK='releases/jayuminton-courtstatus-v1.3.0-cap8.apk'
          STATUS='deployment/status/user-native-push-v1.3.0.txt'
          test -s "$APK"; test -s "$STATUS"
          grep -F 'status=success' "$STATUS" >/dev/null
          grep -F 'version=1.3.0' "$STATUS" >/dev/null
          grep -F 'version_code=130' "$STATUS" >/dev/null
          grep -F 'application_id=com.jayuminton.user' "$STATUS" >/dev/null
          grep -F 'wait1_vibration=controller-finite-3-pulse-groups-max8-or-until-confirmed' "$STATUS" >/dev/null
          grep -F 'court_vibration=controller-finite-3-pulse-groups-max8-or-until-confirmed' "$STATUS" >/dev/null
          grep -F 'pulse_ms=650' "$STATUS" >/dev/null
          grep -F 'intra_pulse_gap_ms=220' "$STATUS" >/dev/null
          grep -F 'group_gap_ms=1100' "$STATUS" >/dev/null
          grep -F 'vibration_max_groups=8' "$STATUS" >/dev/null

          AAPT=''; for p in "$ANDROID_HOME"/build-tools/*/aapt; do [ -x "$p" ] && AAPT="$p"; done; test -n "$AAPT"
          "$AAPT" dump badging "$APK" > "$RUNNER_TEMP/v130-badging.txt"
          grep -F "package: name='com.jayuminton.user'" "$RUNNER_TEMP/v130-badging.txt" >/dev/null
          grep -F "versionCode='130'" "$RUNNER_TEMP/v130-badging.txt" >/dev/null
          grep -F "versionName='1.3.0'" "$RUNNER_TEMP/v130-badging.txt" >/dev/null

          APK_SHA="$(sha256sum "$APK" | awk '{print $1}')"
          echo "V130_APK_SHA=$APK_SHA" >> "$GITHUB_ENV"
          cp "$APK" "$RUNNER_TEMP/v130-cap8.apk"
          cp "$STATUS" "$RUNNER_TEMP/v130-status.txt"

      - name: Publish unique v1.3.0 code130 GitHub release asset
        shell: bash
        run: |
          set -euo pipefail
          TAG='user-v1.3.0-cap8'
          ASSET='Jayuminton-User-v1.3.0-code130-cap8.apk'
          cp "$RUNNER_TEMP/v130-cap8.apk" "$RUNNER_TEMP/$ASSET"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP/$ASSET" --clobber
          else
            gh release create "$TAG" "$RUNNER_TEMP/$ASSET" \
              --title '자유민턴 사용자 앱 v1.3.0' \
              --notes '기존 기능 유지. 대기1/코트입장 진동을 3회씩 최대 8그룹으로 제한한 code130 빌드.'
          fi
          RELEASE_URL="https://github.com/pianopp001-cpu/jayuminton-admin-app/releases/download/$TAG/$ASSET"
          echo "V130_RELEASE_URL=$RELEASE_URL" >> "$GITHUB_ENV"
          curl --fail --location --retry 5 -H 'Cache-Control: no-cache, no-store' "$RELEASE_URL?verify=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/release-v130.apk"
          test "$(sha256sum "$RUNNER_TEMP/release-v130.apk" | awk '{print $1}')" = "$V130_APK_SHA"
          AAPT=''; for p in "$ANDROID_HOME"/build-tools/*/aapt; do [ -x "$p" ] && AAPT="$p"; done
          "$AAPT" dump badging "$RUNNER_TEMP/release-v130.apk" > "$RUNNER_TEMP/release-badging.txt"
          grep -F "versionCode='130'" "$RUNNER_TEMP/release-badging.txt" >/dev/null
          grep -F "versionName='1.3.0'" "$RUNNER_TEMP/release-badging.txt" >/dev/null

      - name: Patch only the actual main user installer route
        shell: bash
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/main"; mkdir -p "$W"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$MAIN_SCRIPT_ID" > "$W/.clasp.json"
          (cd "$W" && clasp pull)
          sha256sum "$W/Admin.html" "$W/Code.js" "$W/Index.html" "$W/Style.html" > "$RUNNER_TEMP/main.before"
          python3 deployment/scripts/patch_user_install_link_v130.py main "$W/Script.html"
          grep -F 'Jayuminton-User-v1.3.0-code130-cap8.apk' "$W/Script.html" >/dev/null
          ! grep -F '1.2.9' "$W/Script.html" >/dev/null
          sha256sum "$W/Admin.html" "$W/Code.js" "$W/Index.html" "$W/Style.html" > "$RUNNER_TEMP/main.after"
          cmp "$RUNNER_TEMP/main.before" "$RUNNER_TEMP/main.after"
          (cd "$W" && clasp push --force)
          (cd "$W" && clasp create-deployment --deploymentId "$MAIN_DEPLOYMENT_ID" --description "user APK 1.3.0 code130 cap8 $GITHUB_RUN_ID")

      - name: Deploy cache-busted hosting installer for v1.3.0
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/deployment/jayuminton/v1637-web"
          ROOT="$RUNNER_TEMP/hosting"
          PUBLIC="$ROOT/public"
          mkdir -p "$PUBLIC"
          cp "$SRC/index.html" "$PUBLIC/index.html"
          cp "$SRC/setup-v205.css" "$PUBLIC/setup-v205.css"
          cp "$SRC/manifest.webmanifest" "$PUBLIC/manifest.webmanifest"
          cp "$SRC/firebase-messaging-sw.js" "$PUBLIC/firebase-messaging-sw.js"
          cp "$SRC/alert-self-test.js" "$PUBLIC/alert-self-test.js"
          BASE="${HOSTING_URL%/}"
          for asset in icon-198.png icon-512.png apple-touch-icon-180.png badge-96.png; do
            curl --fail --location --retry 5 "$BASE/$asset?source=v130-cap8-$GITHUB_RUN_ID" -o "$PUBLIC/$asset"
          done

          cat "$SRC"/setup-v205.js.gz.b64.part-* | tr -d '\r\n' | base64 -d > "$RUNNER_TEMP/setup.gz"
          gzip -dc "$RUNNER_TEMP/setup.gz" > "$PUBLIC/setup-v205.js"
          python3 deployment/scripts/patch_push_setup_verification.py "$PUBLIC/setup-v205.js"
          python3 deployment/scripts/patch_embedded_browser_push.py "$PUBLIC/setup-v205.js"
          python3 deployment/scripts/patch_native_host_bridge.py "$PUBLIC/setup-v205.js"
          python3 deployment/scripts/patch_user_install_link_v130.py hosting "$PUBLIC/setup-v205.js"

          export MAIN_URL_BUST="${MAIN_URL}?build=v130-code130-cap8-${GITHUB_RUN_ID}"
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          public=Path(os.environ['RUNNER_TEMP'])/'hosting'/'public'
          template=Path('deployment/jayuminton/v1637-web/config-v204.template.js').read_text(encoding='utf-8')
          config=template.replace('__MEMBER_PAGE_URL__',os.environ['MAIN_URL_BUST']).replace('__RELAY_URL__',os.environ['PUSH_URL'])
          for n in ('config-v202.js','config-v203.js','config-v204.js'):
              (public/n).write_text(config,encoding='utf-8')
          base=(public/'index.html').read_text(encoding='utf-8')
          for n in ('index.html','badminton.html'):
              h=base.replace('/setup-v205.js?v=1637',f'/setup-v205.js?v=v130-cap8-{os.environ["GITHUB_RUN_ID"]}').replace('/config-v204.js?v=1637',f'/config-v204.js?v=v130-cap8-{os.environ["GITHUB_RUN_ID"]}')
              h=h.replace('</head>',f'<meta name="jayuminton-user-apk" content="1.3.0-code130-cap8-{os.environ["GITHUB_RUN_ID"]}"></head>')
              (public/n).write_text(h,encoding='utf-8')
          sw=public/'firebase-messaging-sw.js'
          w=sw.read_text(encoding='utf-8')
          w += "\nself.addEventListener('install',()=>self.skipWaiting());\nself.addEventListener('activate',e=>e.waitUntil(caches.keys().then(ks=>Promise.all(ks.map(k=>caches.delete(k)))).then(()=>self.clients.claim())));\n"
          sw.write_text(w,encoding='utf-8')
          PY

          grep -F 'Jayuminton-User-v1.3.0-code130-cap8.apk' "$PUBLIC/setup-v205.js" >/dev/null
          ! grep -F '1.2.9' "$PUBLIC/setup-v205.js" >/dev/null

          cat > "$ROOT/firebase.json" <<'JSON'
          {"hosting":{"public":"public","ignore":["firebase.json","**/.*","**/node_modules/**"],"headers":[{"source":"/index.html","headers":[{"key":"Cache-Control","value":"no-cache, no-store, must-revalidate"}]},{"source":"/badminton.html","headers":[{"key":"Cache-Control","value":"no-cache, no-store, must-revalidate"}]},{"source":"/setup-v205.js","headers":[{"key":"Cache-Control","value":"no-cache, no-store, must-revalidate"}]},{"source":"/config-v204.js","headers":[{"key":"Cache-Control","value":"no-cache, no-store, must-revalidate"}]},{"source":"/firebase-messaging-sw.js","headers":[{"key":"Cache-Control","value":"no-cache, no-store, must-revalidate"}]}],"rewrites":[{"source":"**","destination":"/index.html"}]}}
          JSON
          firebase deploy --only hosting --project "$FIREBASE_PROJECT_ID" --config "$ROOT/firebase.json" --non-interactive

      - name: Browser-click live installer and verify actual APK is code130 cap8 build
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/pw"; mkdir -p "$D"; cd "$D"
          npm init -y >/dev/null 2>&1
          npm i playwright@1.54.2 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > verify.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const base=process.env.HOSTING_URL.replace(/\/$/,'');
          const browser=await chromium.launch({headless:true});
          const ctx=await browser.newContext({
            acceptDownloads:true,
            userAgent:'Mozilla/5.0 (Linux; Android 15; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/139.0.0.0 Mobile Safari/537.36'
          });
          const page=await ctx.newPage();
          page.on('dialog',d=>d.accept());
          let apkUrl='';
          ctx.on('request',r=>{ if(r.url().includes('.apk')) apkUrl=r.url(); });
          await page.goto(base+'/badminton.html?v130cap8='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForTimeout(7000);
          const frames=[]; const candidates=[];
          for(const frame of page.frames()){
            let body=''; try{body=(await frame.locator('body').innerText({timeout:3000})).replace(/\s+/g,' ');}catch{}
            frames.push({url:frame.url(),body});
            try{
              const els=frame.locator('button:visible,a:visible'); const n=await els.count();
              for(let i=0;i<n;i++){
                const el=els.nth(i); let text=''; try{text=(await el.innerText()).trim();}catch{}
                if(/앱\s*설치|다운로드|1\.3\.0/.test(text) && !/OFF/.test(text)) candidates.push({el,text});
              }
            }catch{}
          }
          fs.writeFileSync('frames.json',JSON.stringify(frames,null,2));
          if(frames.some(x=>x.body.includes('1.2.9'))) throw new Error('Visible old 1.2.9 remains in rendered installer');
          if(!candidates.length) throw new Error('No visible install/download control found');
          let clicked='';
          for(const c of candidates){
            try{
              const dlP=page.waitForEvent('download',{timeout:8000}).catch(()=>null);
              await c.el.click({timeout:5000}); clicked=c.text;
              const dl=await dlP;
              if(dl){ apkUrl=dl.url(); await dl.saveAs('clicked.apk'); }
              await page.waitForTimeout(1000);
              if(apkUrl) break;
            }catch{}
          }
          fs.writeFileSync('clicked.json',JSON.stringify({clicked,apkUrl},null,2));
          if(!apkUrl.includes('Jayuminton-User-v1.3.0-code130-cap8.apk')) throw new Error('Actual click did not request v1.3.0 code130 asset: '+apkUrl);
          await browser.close();
JS
          node verify.mjs
          cat frames.json
          cat clicked.json
          APK_URL="$(python3 -c 'import json; print(json.load(open("clicked.json"))["apkUrl"])')"
          CLICKED="$(python3 -c 'import json; print(json.load(open("clicked.json"))["clicked"])')"
          curl --fail --location --retry 5 -H 'Cache-Control: no-cache, no-store' "$APK_URL" -o "$RUNNER_TEMP/clicked-v130.apk"
          LIVE_SHA="$(sha256sum "$RUNNER_TEMP/clicked-v130.apk" | awk '{print $1}')"
          test "$LIVE_SHA" = "$V130_APK_SHA"
          AAPT=''; for p in "$ANDROID_HOME"/build-tools/*/aapt; do [ -x "$p" ] && AAPT="$p"; done; test -n "$AAPT"
          "$AAPT" dump badging "$RUNNER_TEMP/clicked-v130.apk" > "$RUNNER_TEMP/clicked-badging.txt"
          grep -F "package: name='com.jayuminton.user'" "$RUNNER_TEMP/clicked-badging.txt" >/dev/null
          grep -F "versionCode='130'" "$RUNNER_TEMP/clicked-badging.txt" >/dev/null
          grep -F "versionName='1.3.0'" "$RUNNER_TEMP/clicked-badging.txt" >/dev/null

          cd "$GITHUB_WORKSPACE"
          cp "$RUNNER_TEMP/v130-cap8.apk" releases/jayuminton-courtstatus-v1.3.0-cap8.apk
          cp "$RUNNER_TEMP/v130-status.txt" deployment/status/user-native-push-v1.3.0.txt
          cat > deployment/status/v130-cap8-live-click-proof.txt <<EOF
          status=success
          live_page=${HOSTING_URL%/}/badminton.html
          clicked_control=$CLICKED
          actual_clicked_apk_url=$APK_URL
          package=com.jayuminton.user
          version_name=1.3.0
          version_code=130
          vibration_groups=8
          pulses_per_group=3
          pulse_ms=650
          intra_pulse_gap_ms=220
          group_gap_ms=1100
          expected_full_vibration_seconds_about=27
          apk_sha256=$LIVE_SHA
          old_v129_visible=no
          admin_logic_changed=no
          verified_at=$(date -u +%FT%TZ)
          EOF

      - name: Publish built APK and live-click proof
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/jayuminton-courtstatus-v1.3.0-cap8.apk deployment/status/user-native-push-v1.3.0.txt deployment/status/v130-cap8-live-click-proof.txt
          git commit -m 'Publish v1.3.0 code130 cap8 user APK and live installer proof' || exit 0
          git pull --rebase origin main || true
          git push origin main
