name: Redeploy admin after Cloudflare patches

# PR-merge trigger marker: v2001-cloudflare-fast-sync-status
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/redeploy-admin-on-patches.yml'
      - 'deployment/jayuminton/apply_admin_vnext_patches.py'
      - 'deployment/jayuminton/admin_fast_state_return_patch.py'
      - 'deployment/jayuminton/admin_vnext_script_patch.py'
      - 'deployment/jayuminton/admin_vnext_badge_cleanup_patch.py'
      - 'deployment/jayuminton/admin_cloudflare_final_contract.py'
      - 'deployment/jayuminton/admin_cloudflare_post_contract_patch.py'
      - 'deployment/jayuminton/admin_finish_alert_v12_patch.py'
      - 'deployment/jayuminton/admin_court_voice_text_patch.py'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - name: Dispatch and monitor verified Cloudflare admin deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${{ github.repository }}"
          before="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$API/actions/workflows/preview-admin-cloudflare.yml/dispatches" \
            -d '{"ref":"main"}'

          preview_run=''
          for i in $(seq 1 30); do
            sleep 2
            runs="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$API/actions/workflows/preview-admin-cloudflare.yml/runs?event=workflow_dispatch&branch=main&per_page=10")"
            preview_run="$(printf '%s' "$runs" | jq -r --arg before "$before" '[.workflow_runs[] | select(.created_at >= $before)] | sort_by(.created_at) | last | .id // empty')"
            [ -n "$preview_run" ] && break
          done
          test -n "$preview_run"

          status='queued'; conclusion=''
          for i in $(seq 1 180); do
            run_json="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$API/actions/runs/$preview_run")"
            status="$(printf '%s' "$run_json" | jq -r '.status')"
            conclusion="$(printf '%s' "$run_json" | jq -r '.conclusion // empty')"
            [ "$status" = completed ] && break
            sleep 10
          done

          mkdir -p deployment/status
          printf 'started=%s\nsource_commit=%s\ntrigger_run=%s\npreview_run=%s\npreview_status=%s\npreview_conclusion=%s\n' \
            "$before" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$preview_run" "$status" "$conclusion" \
            > deployment/status/v2001-cloudflare-dispatch.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment/status/v2001-cloudflare-dispatch.txt
          git commit -m 'Record v200.1 Cloudflare deploy result'
          git pull --rebase origin main
          git push origin main

          [ "$status" = completed ]
          [ "$conclusion" = success ]
