name: Redeploy admin after Cloudflare patches

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/redeploy-admin-on-patches.yml'
      - 'deployment/jayuminton/apply_admin_vnext_patches.py'
      - 'deployment/jayuminton/admin_vnext_script_patch.py'
      - 'deployment/jayuminton/admin_vnext_badge_cleanup_patch.py'
      - 'deployment/jayuminton/admin_cloudflare_final_contract.py'
      - 'deployment/jayuminton/admin_finish_alert_v12_patch.py'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - name: Dispatch verified Cloudflare admin deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/preview-admin-cloudflare.yml/dispatches \
            -d '{"ref":"main"}'
          mkdir -p deployment/status
          printf 'started=%s\nsource_commit=%s\ntrigger_run=%s\ndispatched=preview-admin-cloudflare.yml\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_SHA" "$GITHUB_RUN_ID" > deployment/status/v2001-cloudflare-dispatch.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment/status/v2001-cloudflare-dispatch.txt
          git commit -m 'Record v200.1 Cloudflare redeploy dispatch'
          git pull --rebase origin main
          git push origin main
